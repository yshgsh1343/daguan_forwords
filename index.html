虑的；担心的（3）；2. adj. 渴望的；急切的（1）", "e": "To the <mark>anxious</mark> travelers the sight of the American shore brought almost inexpressible relief."}, {"id": 1138, "u": 12, "w": "appointment", "f": 4, "m": "appoint（任命；约定）+-ment（名词后缀）", "d": "1. n. 任命（4）", "e": "Even Tommasini, who had advocated Gilbert&#x27;s <mark>appointment</mark> in the Times, calls him &quot;an unpretentious musician with no air of the formidable conductor about him.&quot;"}, {"id": 1139, "u": 12, "w": "appropriate", "f": 4, "m": "ap-（向、归到）+propri（专属、自身）+ate（使……；也表示相应性质）", "d": "1. adj. 合适的、恰当的（4）", "e": "Data can be gathered on where the customer can be engaged, such as location, devices used, website interactions, and sites visited, to display marketing messages in <mark>appropriate</mark> forms, including emails, social media posts, pop-up advertisements, and banners at an <mark>appropriate</mark> frequency."}, {"id": 1140, "u": 12, "w": "arrest", "f": 4, "m": "", "d": "1. n. 逮捕（3）；2. v. 逮捕（1）", "e": "California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old assumption that authorities may search through the possessions of suspects at the time of their <mark>arrest</mark>."}, {"id": 1141, "u": 12, "w": "aside", "f": 4, "m": "a-（在、到）+side（旁边、一边）", "d": "1. adv. 放到一边；搁置（2）；2. adv. 撇开……不谈（1）；3. adv. 留出；拨出（set aside）（1）", "e": "He quotes a giant of classical economics, Alfred Marshall, in describing this financial impatience as acting like &quot;children who pick the plums out of their pudding to eat them at once&quot; rather than putting them <mark>aside</mark> to be eaten last."}, {"id": 1142, "u": 12, "w": "assessment", "f": 4, "m": "assess（评估、评定）+-ment（行为、结果）", "d": "1. n. 评估；评价（4）", "e": "Any fair-minded <mark>assessment</mark> of the dangers of the deal between Britain&#x27;s National Health Service (NHS) and DeepMind must start by acknowledging that both sides mean well."}, {"id": 1143, "u": 12, "w": "assign", "f": 4, "m": "as-（向）+sign（标记）", "d": "1. v. 分配；指派（4）", "e": "The Students Union of your university has <mark>assigned</mark> you to inform the international students about an upcoming singing contest."}, {"id": 1144, "u": 12, "w": "assistant", "f": 4, "m": "assist（帮助）+-ant（具有这种作用的；承担作用的人或物）", "d": "1. n. 助手、助理（3）；2. adj. 助理的（1）", "e": "Priestly explains how the deep blue color of the <mark>assistant&#x27;s</mark> sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment."}, {"id": 1145, "u": 12, "w": "attach", "f": 4, "m": "at-（朝向）+tach（固定、连接）", "d": "1. v. 附上；附加；联系在一起（3）；2. v. 重视（attachimportance to）（1）", "e": "In volume V he had <mark>attached</mark> an appendix, The Scovell Ciphers."}, {"id": 1146, "u": 12, "w": "attractive", "f": 4, "m": "attract（吸引）+-ive（具有这种性质的）", "d": "1. adj. 有吸引力的（4）", "e": "One possible response is for classical performers to program <mark>attractive</mark> new music that is not yet available on record."}, {"id": 1147, "u": 12, "w": "automatic", "f": 4, "m": "automat（自行行动）+-ic（具有这种性质的）", "d": "1. adj. 自动的；自发的（4）", "e": "<mark>Automatic</mark> doors often open to the side, with the panels sliding across one another."}, {"id": 1148, "u": 12, "w": "availability", "f": 4, "m": "availabil（available的词干，可获得、可利用的）+-ity（性质、状态）", "d": "1. n. 可获得性；可供使用（3）；2. n. 愿意交往；可接近性（1）", "e": "The widespread <mark>availability</mark> of such recordings has thus brought about a crisis in the institution of the traditional classical concert."}, {"id": 1149, "u": 12, "w": "bag", "f": 4, "m": "", "d": "1. v. 袋；包（3）；2. v. 赢得；获得（1）", "e": "Another factor may be that more people are trying to overpack their carry-on <mark>bags</mark> to avoid checked-baggage fees, though the airlines strongly dispute this."}, {"id": 1150, "u": 12, "w": "beat", "f": 4, "m": "", "d": "1. v. 击败；战胜（2）；2. n. 拍动（翅膀）（1）；3. v. 抢先一步（1）", "e": "Britain&#x27;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to <mark>beat</mark> their bigger competitors."}, {"id": 1151, "u": 12, "w": "beautiful", "f": 4, "m": "beauty（美）+ful（具有、充满）", "d": "1. adj. 美丽的（4）", "e": "Were it not for opportunities to observe these <mark>beautiful</mark>, wild creatures close to home, many more people would be driven by their fascination to travel to wild areas to seek out, disturb and even hunt them down."}, {"id": 1152, "u": 12, "w": "belong", "f": 4, "m": "", "d": "1. v. 属于；归属（4）", "e": "Some blame for the current controversy <mark>belongs</mark> to astronomers."}, {"id": 1153, "u": 12, "w": "biology", "f": 4, "m": "bio-（生命）+-logy（学科；研究）", "d": "1. n. 生物学（4）", "e": "The rise of citizen science has grown alongside the rise of do-it-yourself <mark>biology</mark> laboratories around the world."}, {"id": 1154, "u": 12, "w": "blaze", "f": 4, "m": "", "d": "1. n. 火灾；大火（2）；2. n. 路标（1）；3. v. 火灾；大火（1）", "e": "But when Swetnam enrolled in graduate school at the University of Arizona&#x27;s Laboratory of Tree-Ring Research, he was surprised to find a record of repeated <mark>blazes</mark> dating back hundreds of years before European colonists arrived on the continent."}, {"id": 1155, "u": 12, "w": "bound", "f": 4, "m": "", "d": "1. adj. 一定会；必然（2）；2. adj. 前往；以……为去向（2）", "e": "If it clears the House, this measure would still have to get through the Senate - where someone is <mark>bound</mark> to point out that it amounts to the bare, bare minimum necessary to keep the Postal Service afloat, not comprehensive reform."}, {"id": 1156, "u": 12, "w": "branch", "f": 4, "m": "", "d": "1. n. 分支机构；分店（4）", "e": "The trade magazine The Bookseller reported that Waterstones <mark>branch</mark> managers were being told to remove PRH books from prominent areas such as tables, display spaces and windows, and were &quot;quietly retiring them to their relevant sections&quot;."}, {"id": 1157, "u": 12, "w": "capable", "f": 4, "m": "cap（盛放、容纳、承接）+able（能够）", "d": "1. adj. 有能力的；能够……的（4）", "e": "(47) Our mental health doesn&#x27;t really go anywhere; like the sun behind a cloud, it can be temporarily hidden from view, but it is fully <mark>capable</mark> of being restored in an instant."}, {"id": 1158, "u": 12, "w": "cast", "f": 4, "m": "", "d": "1. v. 投射、使产生（怀疑）（2）；2. n. 铸造（1）；3. v. 铸造（1）", "e": "According to Paragraphs 1 and 2, many young Americans <mark>cast</mark> doubts on____"}, {"id": 1159, "u": 12, "w": "celebrate", "f": 4, "m": "celebr（著名、受到众人关注）+-ate（使成为、进行活动）", "d": "1. v. 赞美；颂扬（4）", "e": "But for all the reasons there are to <mark>celebrate</mark> the computer, we must also act with caution."}, {"id": 1160, "u": 12, "w": "chain", "f": 4, "m": "", "d": "1. n. 连锁企业（4）", "e": "The ruling is a victory for big <mark>chains</mark> with a presence in many states, since they usually collect sales tax on online purchases already."}, {"id": 1161, "u": 12, "w": "changing", "f": 4, "m": "change（去掉末尾e，变化）+-ing（正在进行、持续发生的）", "d": "1. adj. 变化中的、不断变化的（4）", "e": "It is hard, the state argues, for judges to assess the implications of new and rapidly <mark>changing</mark> technologies."}, {"id": 1162, "u": 12, "w": "channel", "f": 4, "m": "", "d": "1. n. 渠道；途径（4）", "e": "[ A ] <mark>channel</mark>"}, {"id": 1163, "u": 12, "w": "characterize", "f": 4, "m": "character（特征、特色）+ize（使具有、说明或体现相应特征）", "d": "1. v. 以……为特征；是……的特征（4）", "e": "Which of the following <mark>characterizes</mark> the scientific publishing model?"}, {"id": 1164, "u": 12, "w": "childless", "f": 4, "m": "child（孩子、子女）+-less（没有……的）", "d": "1. adj. 无子女的（4）", "e": "It doesn&#x27;t seem quite fair, then, to compare the regrets of parents to the regrets of the <mark>childless</mark>."}, {"id": 1165, "u": 12, "w": "circle", "f": 4, "m": "circ（圆、环）+le（本词词形结尾）", "d": "1. n. 圈；圆圈（2）；2. n. 圈子；界（1）；3. v. 环绕（1）", "e": "Parts of the ceremony involve ritual hair cutting, __9__ cotton threads soaked in holy water around the bride&#x27;s and groom&#x27;s wrists, and __10__ a candle around a <mark>circle</mark> of happily married and respected couples to bless the __11__ ."}, {"id": 1166, "u": 12, "w": "classical-music", "f": 4, "m": "classical（古典的）+music（音乐）", "d": "1. 短语 古典音乐（的）（4）", "e": "At last!&quot; wrote Anthony Tommasini, a sober-sided <mark>classical-music</mark> critic."}, {"id": 1167, "u": 12, "w": "closely", "f": 4, "m": "close（紧密的、密切的）+-ly（以这种方式）", "d": "1. adv. 密切地（3）；2. adv. 仔细地；严密地（1）", "e": "But it&#x27;s also a lot more personal, Ortiz says, arguing that because art is so <mark>closely</mark> linked to a person, it could raise data protection and privacy problems."}, {"id": 1168, "u": 12, "w": "cognitive", "f": 4, "m": "cognit（认识、认知）+-ive（有关的）", "d": "1. adj. 认知的（4）", "e": "Their well-developed hippocampal structures may enable elephants, like rats and people, to construct <mark>cognitive</mark> maps."}, {"id": 1169, "u": 12, "w": "comfortable", "f": 4, "m": "comfort（舒适、安慰）+able（能带来或处于这种状态的）", "d": "1. adj. 自在的（4）", "e": "They were <mark>comfortable</mark> in describing different emotional states and part of what you do in drama is put yourself in different shoes.&quot;"}, {"id": 1170, "u": 12, "w": "commit", "f": 4, "m": "com-（共同、完全）+mit（送出、交付）", "d": "1. v. 承诺；致力于（2）；2. v. 实施（自杀行为）（1）；3. v. 语境不足：交付/承诺（干扰项）（1）", "e": "She uses outdated research and decades-old examples to undermine the noble mission of organizations <mark>committed</mark> to connecting children to a world beyond their own."}, {"id": 1171, "u": 12, "w": "commuter", "f": 4, "m": "commut-（commute去e，通勤）+-er（从事者）", "d": "1. n. 通勤者（4）", "e": "However, over the past 12 months, those <mark>commuters</mark> have also experienced some of the worst rail strikes in years."}, {"id": 1172, "u": 12, "w": "comparison", "f": 4, "m": "compar-（compare去掉末尾e，比较）+-ison（行为的名词结尾）", "d": "1. n. 比较；对比（2）；2. n. 相比之下（2）", "e": "Orin Kerr&#x27;s <mark>comparison</mark> is quoted to indicate that____"}, {"id": 1173, "u": 12, "w": "compensation", "f": 4, "m": "compensate（补偿、赔偿，去掉末尾e）+-ion（行为或结果的名词后缀）", "d": "1. n. 补偿；赔偿（3）；2. n. 报酬；薪酬（1）", "e": "However, there is a strong case that those who have been worst affected by industrial action should receive <mark>compensation</mark> for the disruption they have suffered."}, {"id": 1174, "u": 12, "w": "competitor", "f": 4, "m": "competit-（compete的词干变体，竞争）+-or（参与行为的人或组织）", "d": "1. n. 竞争者；对手（4）", "e": "Britain&#x27;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a bid to beat their bigger <mark>competitors</mark>."}, {"id": 1175, "u": 12, "w": "complexity", "f": 4, "m": "complex（复杂的）+ity（性质或状态）", "d": "1. n. 复杂性；复杂程度（4）", "e": "The miracle of the Chesapeake Bay lies not in its depths, but in the <mark>complexity</mark> of its natural construction, the interaction of fresh and saline waters, and the mix of land and water."}, {"id": 1176, "u": 12, "w": "composition", "f": 4, "m": "com-（一起）+posit-（放置）+-ion（过程或结果）", "d": "1. n. 音乐作品（3）；2. n. 布置；构图（1）", "e": "His <mark>compositions</mark> demand the performer to show courage, for example in the use of dynamics."}, {"id": 1177, "u": 12, "w": "comprehensive", "f": 4, "m": "com-（一起、全部）+prehens-（抓住、包含）+-ive（具有这种性质的）", "d": "1. adj. 全面的；综合的（4）", "e": "A smartphone may contain an arrestee&#x27;s reading history, financial history, medical history and <mark>comprehensive</mark> records of recent correspondence."}, {"id": 1178, "u": 12, "w": "concrete", "f": 4, "m": "con-（一起）+cret（生长、凝结）+e（词形结尾）", "d": "1. adj. 具体的；实在的（2）；2. n. 混凝土（1）；3. v. 用混凝土覆盖（1）", "e": "But under anti-bribery laws, proof must be made of <mark>concrete</mark> benefits, such as approval of a contract or regulation."}, {"id": 1179, "u": 12, "w": "conscience", "f": 4, "m": "con-（一起）+sci（认识、知道）+-ence（状态、能力的名词后缀）", "d": "1. n. 良心（4）", "e": "Mental health has commonly been called <mark>conscience</mark>, instinct, wisdom, common sense, or the inner voice."}, {"id": 1180, "u": 12, "w": "considerable", "f": 4, "m": "consider（考虑）+-able（形容词后缀）", "d": "1. adj. 相当大的（4）", "e": "But take a longer view and there is a surprising amount that we can say with <mark>considerable</mark> assurance."}, {"id": 1181, "u": 12, "w": "constituent", "f": 4, "m": "constitu（constitute去te，组成、设立）+ent（有这种作用的；相应的人或物）", "d": "1. n. 选民（2）；2. adj. 组成的（1）；3. n. 成分（1）", "e": "&quot;The basic compact underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their <mark>constituents</mark> and act on their concerns.&quot;"}, {"id": 1182, "u": 12, "w": "construct", "f": 4, "m": "con-（共同、一起）+struct（建造、构成）", "d": "1. v. 建造；构建（3）；2. n. 构造物；虚构的形象（1）", "e": "Their well-developed hippocampal structures may enable elephants, like rats and people, to <mark>construct</mark> cognitive maps."}, {"id": 1183, "u": 12, "w": "contest", "f": 4, "m": "con-（共同、相互）+test（检验、证明）", "d": "1. n. 比赛；竞赛（3）；2. v. 质疑；对……提出争议（1）", "e": "The Students Union of your university has assigned you to inform the international students about an upcoming singing <mark>contest</mark>."}, {"id": 1184, "u": 12, "w": "conventional", "f": 4, "m": "convention（惯例、常规）+-al（依照或具有这种性质的）", "d": "1. adj. 传统的；常规的（4）", "e": "The way consumers now approach the process of making purchase decisions means that marketing&#x27;s impact stems from a broad range of factors beyond <mark>conventional</mark> paid media."}, {"id": 1185, "u": 12, "w": "convince", "f": 4, "m": "con-（完全）+vince（战胜）", "d": "1. v. 使信服；确信（4）", "e": "(47) The researchers are <mark>convinced</mark> that the elephants always know precisely where they are in relation to all the resources they need, and can therefore take shortcuts, as well as following familiar routes."}, {"id": 1186, "u": 12, "w": "cooperate", "f": 4, "m": "co-（共同）+operate（工作、操作）", "d": "1. n. 合作（4）", "e": "That&#x27;s because Congress has always envisioned joint federal-state immigration enforcement and explicitly encourages state officers to share information and <mark>cooperate</mark> with federal colleagues."}, {"id": 1187, "u": 12, "w": "crash", "f": 4, "m": "", "d": "1. n. 碰撞；撞车或坠机事故（2）；2. n. 灾难性失败（比喻）（1）；3. n. 经济崩溃、金融危机（1）", "e": "The <mark>crash</mark> of EgyptAir Flight 804, which terrorists may have downed over the Mediterranean Sea, provides another tragic reminder of why."}, {"id": 1188, "u": 12, "w": "criterion", "f": 4, "m": "crit（判断）+-erion（依据、手段）", "d": "1. n. 标准（4）", "e": "In fact, a listing in Scopus seems to be a <mark>criterion</mark> to be targeted in this type of citation manipulation."}, {"id": 1189, "u": 12, "w": "criticize", "f": 4, "m": "critic（评论者、批评者）+-ize（作出相应行为）", "d": "1. v. 批评；指责（4）", "e": "It is fair to <mark>criticize</mark> and question the mechanism - that is the culture of research, after all - but it is the prize-givers&#x27; money to do with as they please."}, {"id": 1190, "u": 12, "w": "crop", "f": 4, "m": "", "d": "1. n. 农作物；庄稼（2）；2. n. 一批；一群（1）；3. v. 突然出现；意外发生（1）", "e": "Some species of trees have been &quot;read out of the party&quot; by economics-minded foresters because they grow too slowly, or have too low a sale value to pay as timber <mark>crops</mark>."}, {"id": 1191, "u": 12, "w": "curious", "f": 4, "m": "cur（关注、留心）+-ious（具有这种倾向的）", "d": "1. adj. 奇怪的；不寻常的（4）", "e": "In Britain this has had a <mark>curious</mark> result."}, {"id": 1192, "u": 12, "w": "delight", "f": 4, "m": "de（得）+light（光）", "d": "1. n. 喜悦（2）；2. v. 喜悦（1）；3. adj. 感到高兴的（1）", "e": "Even though the day-to-day experience of raising kids can be soul-crushingly hard, Senior writes that &quot;the very things that in the moment dampen our moods can later be sources of intense gratification and <mark>delight</mark>.&quot;"}, {"id": 1193, "u": 12, "w": "depth", "f": 4, "m": "deep（深的，词干变为dep-）+-th（性质、程度的名词后缀）", "d": "1. n. 严重程度（1）；2. n. 景深（depthof field）（1）；3. n. 深入（in-depth）（1）；4. n. 深度；深处（1）", "e": "Yet its report may well set back reform by obscuring the <mark>depth</mark> and breadth of the challenge that Congress asked it to illuminate."}, {"id": 1194, "u": 12, "w": "die", "f": 4, "m": "", "d": "1. v. 死亡（2）；2. v. 耗尽电力（1）；3. v. 逐渐平息（diedown）（1）", "e": "Many of the ships were lost in storms, many passengers <mark>died</mark> of disease, and infants rarely survived the journey."}, {"id": 1195, "u": 12, "w": "diminish", "f": 4, "m": "di-（分开）+min（小、减少）+ish（动词词形结尾）", "d": "1. v. 减少；削弱（4）", "e": "Complex international, economic, technological and cultural changes could start to <mark>diminish</mark> the leading position of English as the language of the world market, and UK interests which enjoy advantage from the breadth of English usage would consequently face new pressures."}, {"id": 1196, "u": 12, "w": "direction", "f": 4, "m": "direct（指向、指引）+-ion（结果或内容的名词后缀）", "d": "1. n. 方向（4）", "e": "Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and steer their activities in virtuous <mark>directions</mark>."}, {"id": 1197, "u": 12, "w": "director", "f": 4, "m": "direct（指导、管理）+-or（人）", "d": "1. n. 主管；负责人（4）", "e": "Glenn Branch, the centre&#x27;s deputy <mark>director</mark>, cautions that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards."}, {"id": 1198, "u": 12, "w": "disappear", "f": 4, "m": "dis-（不再、相反）+appear（出现、显现）", "d": "1. v. 消失；不见（4）", "e": "Worse, the crucial income to feed yourself and your family and pay the bills has <mark>disappeared</mark>."}, {"id": 1199, "u": 12, "w": "distance", "f": 4, "m": "dist（distant去ant，相隔）+-ance（状态）", "d": "1. n. 距离（4）", "e": "Said one recorder of events, &quot;The air at twelve leagues&#x27; <mark>distance</mark> smelt as sweet as a new-blown garden.&quot;"}, {"id": 1200, "u": 12, "w": "distribution", "f": 4, "m": "distribute（去e，分配、分发）+-ion（过程、结果）", "d": "1. n. 分配；分发（2）；2. n. 传播；发行（1）；3. n. 分布；分布状况（1）", "e": "Here, too, the problems are social: the organization and <mark>distribution</mark> of food, wealth and prosperity."}, {"id": 1201, "u": 13, "w": "diverse", "f": 4, "m": "di-（分开、朝不同方向）+vers（转）+e（词形结尾）", "d": "1. adj. 多样的；不同的（4）", "e": "(46) This movement, driven by powerful and <mark>diverse</mark> motivations, built a nation out of a wilderness and, by its nature, shaped the character and destiny of an uncharted continent."}, {"id": 1202, "u": 13, "w": "dominate", "f": 4, "m": "domin（统治、支配）+-ate（动词后缀）", "d": "1. v. 支配、占主导地位（4）", "e": "Third, they now <mark>dominate</mark> left-of-centre politics."}, {"id": 1203, "u": 13, "w": "durable", "f": 4, "m": "dur（持久）+-able（能够……的）", "d": "1. adj. 耐用的（4）", "e": "People often complain that plastics are too <mark>durable</mark>."}, {"id": 1204, "u": 13, "w": "edition", "f": 4, "m": "edit（编辑、校订）+-ion（过程或结果的名词后缀）", "d": "1. n. 版本（4）", "e": "Overhead may be high and circulation lower, but rushing to eliminate its print <mark>edition</mark> would be a mistake, says BuzzFeed CEO Jonah Peretti."}, {"id": 1205, "u": 13, "w": "educate", "f": 4, "m": "educ-（养育；教导）+-ate（动词后缀）", "d": "1. v. 教育、使受教育（3）；2. v. 使增长知识、启发（1）", "e": "Second, they are mostly bright and well-<mark>educated</mark>."}, {"id": 1206, "u": 13, "w": "element", "f": 4, "m": "", "d": "1. n. 要素；组成部分（4）", "e": "What is the essential <mark>element</mark> in the dynamics of social influence?"}, {"id": 1207, "u": 13, "w": "embody", "f": 4, "m": "em-（使进入）+body（身体；具体形式）", "d": "1. v. 体现， 象征（4）", "e": "This very fact <mark>embodied</mark> the new ways of thinking that swept through Europe during most of the 17th century."}, {"id": 1208, "u": 13, "w": "embrace", "f": 4, "m": "em-（进入）+brac（手臂）+e（词形结尾）", "d": "1. v. 欣然接受；拥护（3）；2. n. 拥抱（1）", "e": "There is no reason why everyone cannot be welcomed on Mauna Kea to <mark>embrace</mark> their cultural heritage and to study the stars."}, {"id": 1209, "u": 13, "w": "encounter", "f": 4, "m": "en-（进入）+counter（相对、迎面）", "d": "1. v. 遇到（3）；2. v. 遭遇（尤指困难或问题）（1）", "e": "Visit any antiques store and you&#x27;ll <mark>encounter</mark> artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history."}, {"id": 1210, "u": 13, "w": "enforce", "f": 4, "m": "en-（使）+force（力量、强制力）", "d": "1. v. 执行（4）", "e": "The bans, if fully <mark>enforced</mark>, would suggest to women (and many men) that they should not let others be arbiters of their beauty."}, {"id": 1211, "u": 13, "w": "engineer", "f": 4, "m": "engine（引擎、机器，去掉末尾e）+eer（从事有关工作的人）", "d": "1. n. 工程师（2）；2. v. 精心策划；设计（1）；3. v. 通过工程技术改造（1）", "e": "In 1924 America&#x27;s National Research Council sent two <mark>engineers</mark> to supervise a series of experiments at a telephone-parts factory called the Hawthorne Plant near Chicago."}, {"id": 1212, "u": 13, "w": "entitle", "f": 4, "m": "en-（给予、使具有）+title（标题、称号）", "d": "1. v. 赋予权利；有资格（4）", "e": "The court, though, may want to allow room for police to cite situations where they are <mark>entitled</mark> to more freedom."}, {"id": 1213, "u": 13, "w": "equally", "f": 4, "m": "equal（相等的、平等的）+-ly（以这种方式）", "d": "1. adv. 同样地；相等地（3）；2. adv. 平等地；平均地（1）", "e": "And it is <mark>equally</mark> true that science&#x27;s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world."}, {"id": 1214, "u": 13, "w": "error", "f": 4, "m": "err-（偏离、犯错）+-or（相应的情况或结果）", "d": "1. n. 错误；失误（4）", "e": "Opportunities for misinterpretation, <mark>error</mark>, and self-deception abound."}, {"id": 1215, "u": 13, "w": "exam", "f": 4, "m": "", "d": "1. n. 考试（4）", "e": "If the bar <mark>exam</mark> is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so."}, {"id": 1216, "u": 13, "w": "exception", "f": 4, "m": "except（除外、反对）+-ion（行为或结果的名词后缀）", "d": "1. n. 例外；除外（4）", "e": "But they are the <mark>exception</mark>, not the norm that Ms. Marris implies."}, {"id": 1217, "u": 13, "w": "exciting", "f": 4, "m": "excite（使激动，去掉末尾e）+ing（表示引起某种反应的性质）", "d": "1. adj. 令人兴奋的（4）", "e": "The world of AI is buzzing with an <mark>exciting</mark> potential to improve and enrich our lives."}, {"id": 1218, "u": 13, "w": "exclude", "f": 4, "m": "ex-（向外）+clud（关闭）+e（拼写结尾）", "d": "1. v. 排除；不包括在内（4）", "e": "You are now not wanted; you are now <mark>excluded</mark> from the work environment that offers purpose and structure in your life."}, {"id": 1219, "u": 13, "w": "excuse", "f": 4, "m": "ex-（出去、脱离）+cuse（指控、责备）", "d": "1. n. 借口（4）", "e": "Rather than cloaking his exit in the usual vague <mark>excuses</mark>, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot;"}, {"id": 1220, "u": 13, "w": "existence", "f": 4, "m": "exist（存在、生存）+-ence（状态、过程的名词后缀）", "d": "1. n. 生存；生活（3）；2. n. 存在；生存（1）", "e": "Beethoven&#x27;s music tends to move from chaos to order as if order were an imperative of human <mark>existence</mark>."}, {"id": 1221, "u": 13, "w": "expansion", "f": 4, "m": "expans（expand的词干变体，扩展）+-ion（行为；结果）", "d": "1. n. 扩张、扩大（4）", "e": "The report also advocates greater study of foreign languages, international affairs and the <mark>expansion</mark> of study abroad programs."}, {"id": 1222, "u": 13, "w": "exploit", "f": 4, "m": "ex-（向外、展开）+ploit（使用、运用）", "d": "1. v. 利用；开发（3）；2. v. 掠夺性开发、剥削（1）", "e": "While traditional &quot;paid&quot; media - such as television commercials and print advertisements - still play a major role, companies today can <mark>exploit</mark> many alternative forms of media."}, {"id": 1223, "u": 13, "w": "explosion", "f": 4, "m": "explos-（explode的词干变体，爆炸）+-ion（名词后缀）", "d": "1. n. 激增（4）", "e": "We were kept afloat by &quot;peak TV&quot;, the glut of content that was required by the <mark>explosion</mark> of streaming services."}, {"id": 1224, "u": 13, "w": "facilitate", "f": 4, "m": "facilit（容易、便利）+-ate（使成为）", "d": "1. v. 促进；使便利（4）", "e": "[ A ] <mark>facilitate</mark> healthcare reform."}, {"id": 1225, "u": 13, "w": "factory", "f": 4, "m": "fact（做、制造）+-ory（场所）", "d": "1. n. 工厂（4）", "e": "The sensible place to build new houses, <mark>factories</mark> and offices is where people are, in cities and towns where infrastructure is in place."}, {"id": 1226, "u": 13, "w": "favorable", "f": 4, "m": "favor（好感、支持）+-able（具有这种性质的）", "d": "1. adj. 赞许的（3）；2. adj. 赞成的；有利的（1）", "e": "For the most part, the response has been <mark>favorable</mark>, to say the least."}, {"id": 1227, "u": 13, "w": "favorite", "f": 4, "m": "favor（喜爱、偏爱）+-ite（受到这种偏爱的人或物，也可说明其性质）", "d": "1. adj. 最喜欢的（3）；2. n. 受偏爱的人（play favorites：偏袒）（1）", "e": "1)recommend one of your <mark>favorite</mark> movies and"}, {"id": 1228, "u": 13, "w": "fierce", "f": 4, "m": "", "d": "1. adj. 激烈的；强烈的（3）；2. adj. 凶猛的，凶狠的（1）", "e": "Such debates reflect <mark>fierce</mark> discussions across the US, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools."}, {"id": 1229, "u": 13, "w": "fix", "f": 4, "m": "", "d": "1. v. 修复；解决（2）；2. v. 固定；确定（2）", "e": "&quot;If they fail first and then you <mark>fix</mark> them, it&#x27;s very expensive,&quot; says Domingos."}, {"id": 1230, "u": 13, "w": "fluid", "f": 4, "m": "flu（流动）+-id（形容词后缀）", "d": "1. adj. 流体的（fluid intelligence：流体智力）（4）", "e": "<mark>Fluid</mark> intelligence is the type of intelligence that has to do with short-term memory and the ability to think quickly, logically, and abstractly in order to solve new problems."}, {"id": 1231, "u": 13, "w": "fly", "f": 4, "m": "", "d": "1. v. 飞行（3）；2. v. 冒险逼近（flytoo close to the sun）（1）", "e": "Think of those fleeting moments when you look out of an aeroplane window and realise that you are <mark>flying</mark>, higher than a bird."}, {"id": 1232, "u": 13, "w": "format", "f": 4, "m": "form（形式、形状）+at（词形结尾）", "d": "1. n. 格式（4）", "e": "As technology advances and a <mark>format</mark> becomes obsolete, the object is useless."}, {"id": 1233, "u": 13, "w": "former", "f": 4, "m": "", "d": "1. adj. 以前的；前任的（3）；2. pron. 前者（1）", "e": "In a rare unanimous ruling, the US Supreme Court has overturned the corruption conviction of a <mark>former</mark> Virginia governor, Robert McDonnell."}, {"id": 1234, "u": 13, "w": "forth", "f": 4, "m": "", "d": "1. adv. 来回；往复（back and forth）（2）；2. adv. 向前；向外（1）；3. adv. 唤起（callforth）（1）", "e": "The endless legal battles and back-and-<mark>forth</mark> at the FCC cry out for Congress to act."}, {"id": 1235, "u": 13, "w": "forward", "f": 4, "m": "fore（前面，去掉末尾e）+ward（朝……方向）", "d": "1. adv. 向前；前进（3）；2. adv. 向未来（look forward to期待）（1）", "e": "For thousands of years, donkeys have been critical for propelling human civilizations <mark>forward</mark>."}, {"id": 1236, "u": 13, "w": "foundation", "f": 4, "m": "found（打基础、建立）+-ation（行为、结果或相关事物的名词后缀）", "d": "1. n. 基础；根据（2）；2. n. 基金会（1）；3. n. 地基（1）", "e": "&quot;Elephants never forget&quot;-or so they say-and that piece of folklore seems to have some <mark>foundation</mark>."}, {"id": 1237, "u": 13, "w": "functioning", "f": 4, "m": "function（运作；发挥作用）+-ing（过程；持续状态）", "d": "1. n. 运作；功能发挥（3）；2. adj. （high-functioning）功能水平高的（1）", "e": "The details may be unknowable, but the independence of standard-setters, essential to the proper <mark>functioning</mark> of capital markets, is being compromised."}, {"id": 1238, "u": 13, "w": "garment", "f": 4, "m": "", "d": "1. n. 衣服；服装（4）", "e": "Priestly explains how the deep blue color of the assistant&#x27;s sweater descended over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her <mark>garment</mark>."}, {"id": 1239, "u": 13, "w": "gaze", "f": 4, "m": "", "d": "1. n. 凝视；注视（3）；2. v. 凝视；注视（1）", "e": "This mutual <mark>gaze</mark> is a major part of the attachment between mother and child."}, {"id": 1240, "u": 13, "w": "generator", "f": 4, "m": "generat（generate去e，产生）+-or（执行这种作用的装置）", "d": "1. n. 生成器（4）", "e": "His distinctive style is now one of the most commonly used prompts in the new open-source AI art <mark>generator</mark> Stable Diffusion."}, {"id": 1241, "u": 13, "w": "generous", "f": 4, "m": "gener-（种类；出身）+-ous（具有……性质的）", "d": "1. adj. 慷慨的；丰厚的（4）", "e": "Politicians have repeatedly &quot;backloaded&quot; public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already <mark>generous</mark>."}, {"id": 1242, "u": 13, "w": "genius", "f": 4, "m": "gen（出生、天生）+ius（本词的名词结尾）", "d": "1. n. 天才；天才人物（3）；2. n. 天赋；才华（1）", "e": "They perpetuate the myth of the lone <mark>genius</mark>."}, {"id": 1243, "u": 13, "w": "goods", "f": 4, "m": "good（有用或有价值之物）+-s（复数）", "d": "1. n. 商品、货物（4）", "e": "They&#x27;ve helped pull wheeled vehicles, carry travelers and move <mark>goods</mark> across the world."}, {"id": 1244, "u": 13, "w": "govern", "f": 4, "m": "", "d": "1. v. 由……支配；受……制约（2）；2. v. 管理；治理（2）", "e": "Neither of these patterns is borne out by the analysis, suggesting that the structures of the languages are lineage-specific and not <mark>governed</mark> by universals."}, {"id": 1245, "u": 13, "w": "grasp", "f": 4, "m": "", "d": "1. v. 理解；领会（3）；2. v. 抓住（机会）（1）", "e": "You infer information you feel the writer has invited you to <mark>grasp</mark> by presenting you with specific evidence and clues."}, {"id": 1246, "u": 13, "w": "grin", "f": 4, "m": "", "d": "1. n. 咧嘴笑（3）；2. v. 咧嘴笑（1）", "e": "One explanation might be the loss of dignity displayed through a cheesy <mark>grin</mark>."}, {"id": 1247, "u": 13, "w": "guard", "f": 4, "m": "", "d": "1. v. 保护；防范（4）", "e": "Personal grievance procedures were designed to <mark>guard</mark> the jobs of ordinary workers from &quot;unjustified dismissals&quot;."}, {"id": 1248, "u": 13, "w": "guilty", "f": 4, "m": "guilt（罪过、内疚）+-y（具有这种性质或状态的）", "d": "1. adj. 内疚的；有负罪感的（2）；2. adj. 有罪的（2）", "e": "Yet as we report now, the food police are determined that this __3__ should be rendered yet another <mark>guilty</mark> pleasure __4__ to damage our health."}, {"id": 1249, "u": 13, "w": "hack", "f": 4, "m": "", "d": "1. v. 非法侵入；窃听（4）", "e": "Journalists are known to have <mark>hacked</mark> the phones of up to 5,500 people."}, {"id": 1250, "u": 13, "w": "heritage", "f": 4, "m": "herit（继承）+-age（所得事物的名词后缀）", "d": "1. n. 遗产；传承（4）", "e": "There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural <mark>heritage</mark> and to study the stars."}, {"id": 1251, "u": 13, "w": "hijack", "f": 4, "m": "", "d": "1. v. 劫持、操控（4）", "e": "Members of social networks, for instance, are learning that they can <mark>hijack</mark> media to apply pressure on the businesses that originally created them."}, {"id": 1252, "u": 13, "w": "hinder", "f": 4, "m": "", "d": "1. v. 阻碍，妨碍（4）", "e": "Transient investors, who demand high quarterly profits from companies, can <mark>hinder</mark> a firm&#x27;s efforts to invest in long-term research or to build up customer loyalty."}, {"id": 1253, "u": 13, "w": "homeless", "f": 4, "m": "home（家、住所）+less（没有）", "d": "1. n. 无家可归者（集合名词）（4）", "e": "(48) The gardens of the <mark>homeless</mark>, which are in effect <mark>homeless</mark> gardens, introduce form into an urban environment where it either didn&#x27;t exist or was not discernible as such."}, {"id": 1254, "u": 13, "w": "honor", "f": 4, "m": "hon（荣誉、尊严）+or（本词词形结尾）", "d": "1. n. 荣誉（2）；2. v. 尊重；颂扬（1）；3. v. 授予荣誉；给予表彰（1）", "e": "Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring <mark>honor</mark> to England."}, {"id": 1255, "u": 13, "w": "hunt", "f": 4, "m": "", "d": "1. v. 追猎；捕猎（2）；2. n. 搜寻；寻找（1）；3. v. 搜寻；寻找（1）", "e": "Were it not for opportunities to observe these beautiful, wild creatures close to home, many more people would be driven by their fascination to travel to wild areas to seek out, disturb and even <mark>hunt</mark> them down."}, {"id": 1256, "u": 13, "w": "impossible", "f": 4, "m": "im-（不）+possible（可能的、做得到的）", "d": "1. adj. 不可能的（4）", "e": "While future researchers may find the digital realm a challenging place to ply their trade, they won&#x27;t find it an <mark>impossible</mark> one."}, {"id": 1257, "u": 13, "w": "inadequate", "f": 4, "m": "in-（不）+adequate（足够的、能满足需要的）", "d": "1. adj. 不足的；不充分的（4）", "e": "[ D ] an <mark>inadequate</mark> solution."}, {"id": 1258, "u": 13, "w": "independent", "f": 4, "m": "in-（不）+dependent（依靠的、依赖的）", "d": "1. adj. 独立的；不依赖于……的（4）", "e": "Successful markets require <mark>independent</mark> and even combative standard-setters."}, {"id": 1259, "u": 13, "w": "indicator", "f": 4, "m": "indicat（indicate去e，指示、表明）+or（起指示作用的事物）", "d": "1. n. 指标；标志（4）", "e": "Yes, there has been a budding economic recovery since the 2008 global crash, but in key <mark>indicators</mark> in areas such as health and education, major economies have continued to decline."}, {"id": 1260, "u": 13, "w": "industrial", "f": 4, "m": "industry（工业；y变i）+-al（形容词后缀）", "d": "1. adj. 工业的；产业的（3）；2. adj. 劳资行动的（industrial action：罢工等行动）（1）", "e": "This is hacking on an <mark>industrial</mark> scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking."}, {"id": 1261, "u": 13, "w": "informed", "f": 4, "m": "inform（告知）+-ed（已经得到相应信息、处在相应状态的）", "d": "1. adj. 知情的；了解情况的（4）", "e": "There are lessons about <mark>informed</mark> patient consent to learn."}, {"id": 1262, "u": 13, "w": "inherent", "f": 4, "m": "in-（在里面）+her（粘着、结合）+-ent（处在这种状态的）", "d": "1. adj. 固有的；内在的（4）", "e": "Good governance rests on an understanding of the <mark>inherent</mark> worth of each individual."}, {"id": 1263, "u": 13, "w": "initial", "f": 4, "m": "initi（开端）+-al（与……有关的）", "d": "1. adj. 最初的；开始的（4）", "e": "If people in the network just two degrees removed from the <mark>initial</mark> influential prove resistant, for example, the cascade of change won&#x27;t propagate very far or affect many people."}, {"id": 1264, "u": 13, "w": "intensify", "f": 4, "m": "intens（intense去e，强烈的）+-ify（使变得、变得）", "d": "1. v. 加剧；加强（4）", "e": "[ A ] <mark>intensified</mark>"}, {"id": 1265, "u": 13, "w": "invent", "f": 4, "m": "in-（进入、在里面）+vent（来、到来）", "d": "1. v. 发明；创造（3）；2. v. 编造、虚构（1）", "e": "The best uses of 3D printers and virtual reality haven&#x27;t been <mark>invented</mark> yet."}, {"id": 1266, "u": 13, "w": "investigate", "f": 4, "m": "in-（追入；深入）+vestig（踪迹）+-ate（动词后缀）", "d": "1. v. 调查、研究（4）", "e": "In their study, the researchers <mark>investigated</mark> how donkeys ____"}, {"id": 1267, "u": 13, "w": "isolate", "f": 4, "m": "isol-（岛；孤立）+-ate（动词后缀）", "d": "1. v. 隔离；使孤立（4）", "e": "There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping outsiders out of a law firm <mark>isolates</mark> lawyers from the pressure to make money rather than serve clients ethically."}, {"id": 1268, "u": 13, "w": "judgment", "f": 4, "m": "judge（判断；审判，去e）+-ment（行为；结果；能力）", "d": "1. n. 判断；评价（4）", "e": "The ethical <mark>judgments</mark> of the Supreme Court justices have become an important issue recently."}, {"id": 1269, "u": 13, "w": "keen", "f": 4, "m": "", "d": "1. adj. 热切的；热衷的（4）", "e": "I&#x27;m very <mark>keen</mark> to see them in person."}, {"id": 1270, "u": 13, "w": "kill", "f": 4, "m": "", "d": "1. v. 杀死（3）；2. v. 扼杀；阻止（1）", "e": "The fact that fires happened so often meant they couldn&#x27;t have been severe enough to <mark>kill</mark> most trees."}, {"id": 1271, "u": 13, "w": "label", "f": 4, "m": "", "d": "1. n. 品牌（3）；2. n. 标签；称号（完形干扰选项）（1）", "e": "These <mark>labels</mark> encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don&#x27;t advertise that - and to renew their wardrobe every few weeks."}, {"id": 1272, "u": 13, "w": "laboratory", "f": 4, "m": "labor（劳动、工作）+-atory（场所）", "d": "1. n. 实验室（4）", "e": "So is it time to take the Petri dish out of the <mark>laboratory</mark> and into the garage?"}, {"id": 1273, "u" , "u": 13, "w": "mandate", "f": 4, "m": "mand-（交付、委托、命令）+-ate（相应的事项或要求）", "d": "1. n. 强制规定；命令；任务（3）；2. v. 强制要求；规定（1）", "e": "But are such government <mark>mandates</mark> even necessary?"}, {"id": 1283, "u": 13, "w": "margin", "f": 4, "m": "", "d": "1. n. 利润率（3）；2. n. 边缘（1）", "e": "Scientific publishers routinely report profit <mark>margins</mark> approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis."}, {"id": 1284, "u": 13, "w": "massive", "f": 4, "m": "mass（大量、团块）+-ive（具有这种性质的）", "d": "1. adj. 巨大的；大规模的（4）", "e": "First two hours, now three hours - this is how far in advance authorities are recommending people show up to catch a domestic flight, at least at some major U.S. airports with increasingly <mark>massive</mark> security lines."}, {"id": 1285, "u": 13, "w": "master", "f": 4, "m": "", "d": "1. v. 掌握；精通（3）；2. adj. 技艺高超的、师傅级的（1）", "e": "&quot;Ultimately,&quot; said Jack Miner, Ohio State University&#x27;s registrar, &quot;we see students achieve more success because they retake a course and do better in subsequent courses or <mark>master</mark> the content that allows them to graduate on time.&quot;"}, {"id": 1286, "u": 13, "w": "medium", "f": 4, "m": "medi（中间）+um（词形结尾，整词可作名词或形容词）", "d": "1. n. 媒介；载体（3）；2. adj. 中等的；中期的（1）", "e": "The thing itself is the <mark>medium</mark> that delivers the information."}, {"id": 1287, "u": 13, "w": "membership", "f": 4, "m": "member（成员、会员）+-ship（身份、资格）", "d": "1. n. 成员资格；会员身份（3）；2. n. 成员人数；会员群体（1）", "e": "Requiring companies to make gender the primary qualification for board <mark>membership</mark> will inevitably lead to less experienced private sector boards."}, {"id": 1288, "u": 13, "w": "mere", "f": 4, "m": "", "d": "1. adj. 仅仅的、只不过的（4）", "e": "A hundred years on from Marconi and Reith, is the art of <mark>mere</mark> listening endangered?"}, {"id": 1289, "u": 13, "w": "merit", "f": 4, "m": "mer（应得、值得）+it（词形结尾）", "d": "1. n. 业绩；才干（2）；2. n. 案件本身的是非曲直（1）；3. n. 优点 rvative to implement them."}, {"id": 1369, "u": 14, "w": "sequence", "f": 4, "m": "sequ（跟随）+-ence（状态、结果的名词后缀）", "d": "1. n. 一系列；顺序（2）；2. n. （DNA）序列（2）", "e": "[ D ] <mark>sequence</mark>"}, {"id": 1370, "u": 14, "w": "servant", "f": 4, "m": "serv（服务、侍奉）+-ant（做这项工作的人）", "d": "1. n. 仆人（2）；2. n. 公务员（civilservant）（2）", "e": "Only then will they be useful <mark>servants</mark> and not Frankenstein&#x27;s out-of-control monster."}, {"id": 1371, "u": 14, "w": "settlement", "f": 4, "m": "settle（安顿、定居、解决）+-ment（行为、结果或相关地点的名词后缀）", "d": "1. n. 聚落、定居点（4）", "e": "Located in the southern Peloponnesian peninsula, Pavlopetri (the modern name of the site) emerged as a Neolithic <mark>settlement</mark> around 3500 B.C. and became an important trading center for Mycenaean Greece (1650-1180 B.C.)."}, {"id": 1372, "u": 14, "w": "shareholder", "f": 4, "m": "share（股份）+hold（持有）+-er（人）", "d": "1. n. 股东（4）", "e": "As boards scrutinize succession plans in response to <mark>shareholder</mark> pressure, executives who don&#x27;t get the nod also may wish to move on."}, {"id": 1373, "u": 14, "w": "significance", "f": 4, "m": "signific-（表示；意味）+-ance（性质、状态）", "d": "1. n. 重要性；意义（4）", "e": "Second, the majority of people who use networked computers to upload are not even aware of the <mark>significance</mark> of what they are doing."}, {"id": 1374, "u": 14, "w": "sir", "f": 4, "m": "", "d": "1. n. 爵士（尊称）（4）", "e": "What can be learnt about wireless from <mark>Sir</mark> John Reith?"}, {"id": 1375, "u": 14, "w": "speech", "f": 4, "m": "", "d": "1. n. 演讲（2）；2. n. 言语（2）", "e": "Write an e-mail of about 100 words to a foreign teacher in your college, inviting him/her to be a judge for the upcoming English <mark>speech</mark> contest."}, {"id": 1376, "u": 14, "w": "split", "f": 4, "m": "", "d": "1. v. 分开；分裂（2）；2. adj. 极短的（split-second）（1）；3. v. 裂开（1）", "e": "They were <mark>split</mark> into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck the hardline Republican governor."}, {"id": 1391, "u": 14, "w": "suppress", "f": 4, "m": "sup-（向下）+press（压）", "d": "1. v. 压制、抑制（3）；2. v. 扑灭、控制火势（1）", "e": "(48) Despite attempts by the Church to <mark>suppress</mark> this new generation of logicians and rationalists, more explanations for how the universe functioned were being made at a rate that the people could no longer ignore."}, {"id": 1392, "u": 14, "w": "surpass", "f": 4, "m": "sur-（在……之上、超过）+pass（通过）", "d": "1. v. 超过（4）", "e": "The sales for our May Books of the Month <mark>surpassed</mark> any month since 2018.&quot;"}, {"id": 1393, "u": 14, "w": "surroundings", "f": 4, "m": "surround（环绕）+-ing（相关事物的名词形式）+-s（复数）", "d": "1. n. 周围环境（4）", "e": "Mental health is the source of creativity for solving problems, resolving conflict, making our <mark>surroundings</mark> more beautiful, managing our home life, or coming up with a creative business idea or invention to make our lives easier."}, {"id": 1394, "u": 14, "w": "suspicion", "f": 4, "m": "su-（从下方）+spic（看）+-ion（这种心理状态）", "d": "1. n. 怀疑、猜疑（4）", "e": "Ms Brooks may or may not have had <mark>suspicions</mark> about how her journalists got their stories, but she asked no questions, gave no instructions - nor received traceable, recorded answers."}, {"id": 1395, "u": 14, "w": "tackle", "f": 4, "m": "", "d": "1. v. 处理；应对（4）", "e": "&quot;There is a coalition growing within artist industries to figure out how to <mark>tackle</mark> or mitigate this,&quot; says Ortiz."}, {"id": 1396, "u": 14, "w": "tame", "f": 4, "m": "", "d": "1. v. 驯化（4）", "e": "Prehistoric humans may have <mark>tamed</mark> donkeys to help navigate the expanding Sahara."}, {"id": 1397, "u": 14, "w": "taxpayer", "f": 4, "m": "tax（税）+pay（支付）+er（做这件事的人）", "d": "1. n. 纳税人（4）", "e": "Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general <mark>taxpayer</mark>."}, {"id": 1398, "u": 14, "w": "tempt", "f": 4, "m": "", "d": "1. v. 诱使、使想要（4）", "e": "You might even be <mark>tempted</mark> to assume that humanity has little future to look forward to."}, {"id": 1399, "u": 14, "w": "tendency", "f": 4, "m": "tend（朝一个方向发展）+-ency（状态、特点的名词结尾）", "d": "1. n. 倾向；趋势（4）", "e": "This <mark>tendency</mark> in the natural sciences has long been evident in the social sciences too."}, {"id": 1400, "u": 14, "w": "tension", "f": 4, "m": "tens（拉紧）+-ion（状态名词后缀）", "d": "1. n. 紧张、紧张关系（4）", "e": "Offering up such a theory during a time of high <mark>tension</mark> between scientific and religious minds was branded as heresy and any such heretics that continued to spread these lies were to be punished by imprisonment or even death."}, {"id": 1401, "u": 15, "w": "thin", "f": 4, "m": "", "d": "1. adj. 瘦的（2）；2. adj. 薄的（2）", "e": "Its lawmakers gave preliminary approval last week to a law that would make it a crime to employ ultra-<mark>thin</mark> models on runways."}, {"id": 1402, "u": 15, "w": "threshold", "f": 4, "m": "", "d": "1. n. 门槛；临界值（4）", "e": "Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income <mark>threshold</mark>&quot; from the protection of its unfair dismissal laws."}, {"id": 1403, "u": 15, "w": "trait", "f": 4, "m": "", "d": "1. n. 特征；特质（4）", "e": "But a comparative study of linguistic <mark>traits</mark> published online today supplies a reality check."}, {"id": 1404, "u": 15, "w": "treat", "f": 4, "m": "", "d": "1. v. 对待、看待（4）", "e": "&quot;I think the question is, shouldn&#x27;t a developer who&#x27;s really building a hotel, but disguising it as not a hotel, be <mark>treated</mark> and taxed and regulated like a hotel?&quot;"}, {"id": 1405, "u": 15, "w": "trick", "f": 4, "m": "", "d": "1. n. 技巧；诀窍（2）；2. n. 花招；手段（1）；3. v. 欺骗；哄骗（1）", "e": "The <mark>trick</mark> is to direct these funds better."}, {"id": 1406, "u": 15, "w": "tuition", "f": 4, "m": "tuit（注视、守护）+-ion（活动或相关费用的名词后缀）", "d": "1. n. 学费（4）", "e": "The use of this little-known practice has accelerated in recent years, as colleges continue to do their utmost to keep students in school (and paying <mark>tuition</mark>) and improve their graduation rates."}, {"id": 1407, "u": 15, "w": "ultimately", "f": 4, "m": "ultimate（最后的、根本的）+-ly（副词后缀）", "d": "1. adv. 最终、归根到底（4）", "e": "The carbon emissions from technological research are well spent: <mark>ultimately</mark> this research will safeguard the future of our planet."}, {"id": 1408, "u": 15, "w": "uncertainty", "f": 4, "m": "un-（不）+certainty（确定性）", "d": "1. n. 不确定性（4）", "e": "[ D ] <mark>uncertainty</mark>."}, {"id": 1409, "u": 15, "w": "unexpected", "f": 4, "m": "un-（不）+expect（预期）+ed（已经被预料的状态）", "d": "1. adj. 意料之外的（4）", "e": "The theory also seems to explain the sudden and <mark>unexpected</mark> popularity of certain looks, brands, or neighborhoods."}, {"id": 1410, "u": 15, "w": "unfair", "f": 4, "m": "un-（不）+fair（公平的、公正的）", "d": "1. adj. 不公平的；不公正的（4）", "e": "Across the Tasman Sea, Australia deals with the unjustified dismissal paradox by excluding employees earning above a specified &quot;high-income threshold&quot; from the protection of its <mark>unfair</mark> dismissal laws."}, {"id": 1411, "u": 15, "w": "unilateral", "f": 4, "m": "uni-（一、单）+later-（侧面）+-al（与……有关的）", "d": "1. adj. 单方面的（4）", "e": "The French tax is not just a <mark>unilateral</mark> move by one country in need of revenue."}, {"id": 1412, "u": 15, "w": "universe", "f": 4, "m": "uni（一、统一）+vers（转）+e（词形结尾）", "d": "1. n. 宇宙（4）", "e": "It is becoming less clear, however, that such a theory would be a simplification, given the dimensions and <mark>universes</mark> that it might entail."}, {"id": 1413, "u": 15, "w": "unknown", "f": 4, "m": "un-（未、不）+known（已知的）", "d": "1. adj. 未知的、不为人知的（4）", "e": "Yet only one of his books is now in print, and his vast body of writings on music is <mark>unknown</mark> save to specialists."}, {"id": 1414, "u": 15, "w": "unnecessary", "f": 4, "m": "un-（不）+necessary（必要的）", "d": "1. adj. 不必要的、多余的（4）", "e": "The TSA cannot continue diverting resources into underused PreCheck lanes while most of the traveling public suffers in <mark>unnecessary</mark> lines."}, {"id": 1415, "u": 15, "w": "uphold", "f": 4, "m": "up（向上）+hold（托住、保持）", "d": "1. v. 支持、维持（4）", "e": "Last April, for example, the justices signaled that too many patents were being <mark>upheld</mark> for &quot;inventions&quot; that are obvious."}, {"id": 1416, "u": 15, "w": "upon", "f": 4, "m": "up（上）+on（在……上、靠近）", "d": "1. prep. 对；作用于（3）；2. prep. 在……上（1）", "e": "(48) But the force of geographic conditions peculiar to America, the interplay of the varied national groups <mark>upon</mark> one another, and the sheer difficulty of maintaining old-world ways in a raw, new continent caused significant changes."}, {"id": 1417, "u": 15, "w": "usual", "f": 4, "m": "us（使用、习惯）+ual（形容词结尾）", "d": "1. adj. 通常的；惯常的（4）", "e": "Rather than cloaking his exit in the <mark>usual</mark> vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot;"}, {"id": 1418, "u": 15, "w": "vague", "f": 4, "m": "vagu（不确定、不明确）+e（词形结尾）", "d": "1. adj. 含糊的；不明确的（4）", "e": "While the statement is <mark>vague</mark>, it represents one starting point."}, {"id": 1419, "u": 15, "w": "verify", "f": 4, "m": "ver（真实）+-ify（使……明确）", "d": "1. v. 核实；验证（4）", "e": "However, the Justices said that Arizona police would be allowed to <mark>verify</mark> the legal status of people who come in contact with law enforcement."}, {"id": 1420, "u": 15, "w": "visible", "f": 4, "m": "vis（看）+-ible（能够……的）", "d": "1. adj. 可见的、明显的（4）", "e": "These changes were gradual and at first scarcely <mark>visible</mark>."}, {"id": 1421, "u": 15, "w": "visual", "f": 4, "m": "vis（看、视觉）+ual（与……有关的）", "d": "1. adj. 视觉的；视像的（3）；2. n. 视觉资料；图像（1）", "e": "The founders deliberately focused their projects around light-hence the &quot;<mark>visual</mark> studies&quot; in the name."}, {"id": 1422, "u": 15, "w": "vital", "f": 4, "m": "vit（生命、生命力）+-al（相关的）", "d": "1. adj. 至关重要的、必不可少的（4）", "e": "This is why repeated attempts at reform legislation have failed in recent years, leaving the Postal Service unable to pay its bills except by deferring <mark>vital</mark> modernization."}, {"id": 1423, "u": 15, "w": "weakness", "f": 4, "m": "weak（弱的）+-ness（性质；状态）", "d": "1. n. 弱点；不足（4）", "e": "One basic <mark>weakness</mark> in a conservation system based wholly on economic motives is that most members of the land community have no economic value."}, {"id": 1424, "u": 15, "w": "wealthy", "f": 4, "m": "wealth（财富、丰富积累）+-y（具有这种性质的）", "d": "1. adj. 富有的；富人（4）", "e": "Rather officials must avoid double standards, or different types of access for average people and the <mark>wealthy</mark>."}, {"id": 1425, "u": 15, "w": "web-based", "f": 4, "m": "web（互联网）+base（以……为基础）+-ed（具有这种基础的；base去e）", "d": "1. 短语 基于互联网的；通过网络提供的（4）", "e": "From the early days of broadband, advocates for consumers and <mark>web-based</mark> companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#x27;."}, {"id": 1426, "u": 15, "w": "wellbeing", "f": 4, "m": "well（好）+being（存在；生活状态）", "d": "1. n. 福祉；身心健康（4）", "e": "Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#x27; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#x27;s <mark>wellbeing</mark>."}, {"id": 1427, "u": 15, "w": "whereas", "f": 4, "m": "where（在……处）+as（如同；鉴于）", "d": "1. conj. 然而；而（表示对比）（4）", "e": "In all, the study concludes that <mark>whereas</mark> prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#x27;s record in CSR."}, {"id": 1428, "u": 15, "w": "worldwide", "f": 4, "m": "world（世界）+wide（范围广阔的）", "d": "1. adj. 全世界的、在全世界（4）", "e": "They&#x27;re already used in dozens of countries <mark>worldwide</mark>."}, {"id": 1429, "u": 15, "w": "absence", "f": 3, "m": "absent（去掉词尾ent，缺席的、不存在的）+-ence（状态）", "d": "1. n. 缺乏；不存在（3）", "e": "We have no land ethic yet, (47) but we have at least drawn nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or <mark>absence</mark> of economic advantage to us."}, {"id": 1430, "u": 15, "w": "absolute", "f": 3, "m": "ab-（离开）+solut（松开、解开）+e（拼写结尾）", "d": "1. adj. 绝对的（3）", "e": "France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an <mark>absolute</mark> right to define physical beauty for women."}, {"id": 1431, "u": 15, "w": "absolutely", "f": 3, "m": "absolute（绝对的、完全的、确实的）+-ly（达到这种程度、以这种语气）", "d": "1. adv. 完全；绝对（3）", "e": "Nothing is <mark>absolutely</mark> safe, anywhere."}, {"id": 1432, "u": 15, "w": "abundant", "f": 3, "m": "ab-（向外）+und（波浪、流动）+-ant（具有相应状态的）", "d": "1. adj. 丰富的、充足的（3）", "e": "Here was <mark>abundant</mark> fuel and lumber."}, {"id": 1433, "u": 15, "w": "accident", "f": 3, "m": "ac-（向）+cid-（落下、发生）+ent（发生的事）", "d": "1. n. 偶然事件（1）；2. n. 偶然（byaccident）（1）；3. n. 意外事故（1）", "e": "Stand in the shoes of scientists and witness the degree to which breakthroughs emerge from <mark>accidents</mark>, conflict and sheer mental stamina."}, {"id": 1434, "u": 15, "w": "accompany", "f": 3, "m": "ac-（向、去）+company（陪伴）", "d": "1. v. 伴随；与……同时发生（3）", "e": "The target group was given a 30-minute drama-based activity to <mark>accompany</mark> the passage."}, {"id": 1435, "u": 15, "w": "acknowledge", "f": 3, "m": "ac-（使认知明确表现出来）+knowledge（知道、了解）", "d": "1. v. 承认；认可（3）", "e": "This is hacking on an industrial scale, as was <mark>acknowledged</mark> by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking."}, {"id": 1436, "u": 15, "w": "adequate", "f": 3, "m": "ad-（向）+equ（相等）+-ate（本词的形容词结尾）", "d": "1. adj. 足够的；充分的（3）", "e": "No matter how you &quot;enhance&quot; enclosures, they do not allow for freedom, a natural diet or <mark>adequate</mark> exercise."}, {"id": 1437, "u": 15, "w": "adjustment", "f": 3, "m": "adjust（调整、调节）+-ment（行为、所作改变）", "d": "1. n. 调整；调节（3）", "e": "[ C ] necessary <mark>adjustments</mark>."}, {"id": 1438, "u": 15, "w": "admission", "f": 3, "m": "ad-（向里）+miss（发送、放行）+-ion（名词后缀）", "d": "1. n. 准许进入；接纳入学或入会（3）", "e": "To __8__ this idea, he turned to the university-<mark>admissions</mark> process."}, {"id": 1439, "u": 15, "w": "agent", "f": 3, "m": "ag（做、行动、驱动）+ent（行动者、起作用者）", "d": "1. n. 代理人；经纪人（3）", "e": "&quot;This is all part of a wider change towards concentration of power,&quot; says literary <mark>agent</mark> Andrew Lownie."}, {"id": 1440, "u": 15, "w": "aggressive", "f": 3, "m": "ag-（朝向、主动接近）+gress（走）+-ive（有这种倾向的）", "d": "1. adj. 积极进取的；强势的（3）", "e": "In those situations, it&#x27;s better to be more <mark>aggressive</mark> than less <mark>aggressive</mark>.&quot;"}, {"id": 1441, "u": 15, "w": "alliance", "f": 3, "m": "alli-（ally的y变i，结盟）+-ance（形成的关系或组织）", "d": "1. n. 联盟；合作关系（3）", "e": "The <mark>alliances</mark> are most valuable when scientists and artists have a shared stake in a project, are able to jointly design it and can critique each other&#x27;s work."}, {"id": 1442, "u": 15, "w": "announce", "f": 3, "m": "an-（向、传给）+nounce（报告、宣告）", "d": "1. v. 宣布；公布（3）", "e": "The journal Science is adding an extra round of statistical checks to its peer-review process, editor-in-chief Marcia McNutt <mark>announced</mark> today."}, {"id": 1443, "u": 15, "w": "antique", "f": 3, "m": "ant（在……之前）+-ique（本词的形容词形式）", "d": "1. n. 古董（3）", "e": "Visit any <mark>antiques</mark> store and you&#x27;ll encounter artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history."}, {"id": 1444, "u": 15, "w": "apology", "f": 3, "m": "apo-（离开）+log（言语）+-y（行为或相关内容）", "d": "1. n. 道歉（3）", "e": "I make no <mark>apology</mark> for being obsessed by a particular feature of everyday objects: their price."}, {"id": 1445, "u": 15, "w": "apparently", "f": 3, "m": "apparent（显而易见的、表面看来的）+ly（表示判断的方式或语气）", "d": "1. adv. 看来；似乎；显然（3）", "e": "A deal is a deal-except, <mark>apparently</mark>, when Entergy is involved."}, {"id": 1446, "u": 15, "w": "army", "f": 3, "m": "arm（武装）+-y（集体）", "d": "1. n. 军队（3）", "e": "His status in Lord Wellington&#x27;s headquarters and the recognition given to him for his work were all bound up with the class politics of the <mark>army</mark> at the time."}, {"id": 1447, "u": 15, "w": "artistic", "f": 3, "m": "artist（艺术家）+-ic（形容词后缀）", "d": "1. adj. 艺术的（3）", "e": "These recordings are cheap, available everywhere, and very often much higher in <mark>artistic</mark> quality than today&#x27;s live performances; moreover, they can be &quot;consumed&quot; at a time and place of the listener&#x27;s choosing."}, {"id": 1448, "u": 15, "w": "astronomer", "f": 3, "m": "astronom-（astronomy去y，天文学）+-er（从事这项研究的人）", "d": "1. n. 天文学家（3）", "e": "Some blame for the current controversy belongs to <mark>astronomers</mark>."}, {"id": 1449, "u": 15, "w": "atmosphere", "f": 3, "m": "atmo（蒸气；空气）+sphere（球；层）", "d": "1. n. 大气；大气层（2）；2. n. 气氛；氛围（1）", "e": "Resting in the Pacific Ocean, Mauna Kea&#x27;s peak rises above the bulk of our planet&#x27;s dense <mark>atmosphere</mark>, where conditions allow telescopes to obtain images of unsurpassed clarity."}, {"id": 1450, "u": 15, "w": "attack", "f": 3, "m": "", "d": "1. v. 攻击；袭击（2）；2. n. 抨击；批评（1）", "e": "And now Climate Change agitators are <mark>attacking</mark> publicly displayed works in European museums."}, {"id": 1451, "u": 15, "w": "attribute", "f": 3, "m": "at-（向、归到）+tribute（分配、归属）", "d": "1. v. 把……归于；认为……属于（2）；2. v. 把……归因于（1）", "e": "[ A ] <mark>attributed</mark>"}, {"id": 1452, "u": 15, "w": "await", "f": 3, "m": "a-（在、向）+wait（守望、等候）", "d": "1. v. 等待（2）；2. v. 等着……到来（1）", "e": "The digital services tax now <mark>awaits</mark> the signature of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks."}, {"id": 1453, "u": 15, "w": "aware", "f": 3, "m": "a-（处于）+ware（察觉）", "d": "1. adj. 意识到的、了解的（3）", "e": "Second, the majority of people who use networked computers to upload are not even <mark>aware</mark> of the significance of what they are doing."}, {"id": 1454, "u": 15, "w": "barely", "f": 3, "m": "bare（仅有的；勉强的）+-ly（副词后缀）", "d": "1. adv. 几乎不；勉强（2）；2. adv. 仅仅；刚刚（1）", "e": "During their six- to twelve-week voyage, they survived on <mark>barely</mark> enough food allotted to them."}, {"id": 1455, "u": 15, "w": "barrier", "f": 3, "m": "barr（横木、阻挡）+ier（名词结尾）", "d": "1. n. 障碍；阻碍（2）；2. n. 屏障；阻隔物（1）", "e": "[ B ] <mark>barrier</mark>"}, {"id": 1456, "u": 15, "w": "beef", "f": 3, "m": "", "d": "1. v. 加强；充实（beef up）（2）；2. n. 牛肉（1）", "e": "Yet as distrust has risen toward all media, people may be starting to <mark>beef</mark> up their media literacy skills."}, {"id": 1457, "u": 15, "w": "beneficial", "f": 3, "m": "bene-（好）+fic-（做）+ial（具有相关性质的）", "d": "1. adj. 有益的、有利的（3）", "e": "In the United States, the desire to provide the public with a general, nontechnical education in science originated as far back as the late 1800s. (48) Educators advanced the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was <mark>beneficial</mark> primarily as a way to enhance logical reasoning and observational skills."}, {"id": 1458, "u": 15, "w": "bind", "f": 3, "m": "", "d": "1. n. 联结（1）；2. v. 密切关联（bebound up with）（1）；3. v. 约束（1）", "e": "Newton&#x27;s laws of motion and Darwinian evolution each <mark>bind</mark> a host of different phenomena into a single explicatory framework."}, {"id": 1459, "u": 15, "w": "biologist", "f": 3, "m": "biolog（biology去y，生物学）+-ist（从事这类研究的人）", "d": "1. n. 生物学家（3）", "e": "(48) Time was when <mark>biologists</mark> somewhat overworked the evidence that these creatures preserve the health of game by killing the physically weak, or that they prey only on &quot;worthless&quot; species."}, {"id": 1460, "u": 15, "w": "bleak", "f": 3, "m": "", "d": "1. adj. 黯淡的；令人沮丧的（3）", "e": "Last year marked the third year in a row that Indonesia&#x27;s <mark>bleak</mark> rate of deforestation has slowed in pace."}, {"id": 1461, "u": 15, "w": "block", "f": 3, "m": "", "d": "1. v. 阻挡；阻止（2）；2. n. 构成要素；积木块（1）", "e": "In the meantime, the court threw out the FCC&#x27;s attempt to <mark>block</mark> all state rules on net neutrality, while preserving the commission&#x27;s power to preempt individual state laws that undermine its order."}, {"id": 1462, "u": 15, "w": "boundary", "f": 3, "m": "bound（界限）+-ary（有关的事物）", "d": "1. n. 界限、边界（3）", "e": "The reality is that water, and the pollutants that so often come with it, don&#x27;t respect state <mark>boundaries</mark>."}, {"id": 1463, "u": 15, "w": "boycott", "f": 3, "m": "", "d": "1. v. 抵制（3）", "e": "If that happens, passionate consumers would try to persuade others to <mark>boycott</mark> products, putting the reputation of the target company at risk."}, {"id": 1464, "u": 15, "w": "bread", "f": 3, "m": "", "d": "1. n. 主要收入来源（bread-and-butter）（1）；2. n. 生计来源（where your breadis buttered）（1）；3. n. 面包（1）", "e": "Fundamentally, the USPS is in a historic squeeze between technological change that has permanently decreased demand for its <mark>bread</mark>-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality."}, {"id": 1465, "u": 15, "w": "bright", "f": 3, "m": "", "d": "1. adj. 光明的；乐观的（1）；2. adj. 聪明的（1）；3. adj. 鲜艳的（1）", "e": "[ A ] The Ever-<mark>bright</mark> Prospects of Mankind."}, {"id": 1466, "u": 15, "w": "broadcast", "f": 3, "m": "broad（广阔的、广泛的）+cast（投出）", "d": "1. n. 广播；播出（1）；2. v. 公开宣扬（1）；3. v. 广播；播出（1）", "e": "People report that <mark>broadcast</mark> music made workmen whistle new tunes."}, {"id": 1467, "u": 15, "w": "brush", "f": 3, "m": "", "d": "1. n. 刷子（3）", "e": "A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and &quot;talking on the <mark>brush</mark> handle&quot;."}, {"id": 1468, "u": 15, "w": "cable", "f": 3, "m": "", "d": "1. n. 有线电视（3）", "e": "From the early days of broadband, advocates for consumers and web-based companies worried that the <mark>cable</mark> and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#x27;."}, {"id": 1469, "u": 15, "w": "capability", "f": 3, "m": "capabil-（capable的词干形式，有能力的）+ity（性质、状态）", "d": "1. n. 能力；才干（3）", "e": "Indeed, in &quot;An International Perspective on New Zealand&#x27;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial <mark>capabilities</mark> as a cause of the country&#x27;s poor productivity growth record."}, {"id": 1470, "u": 15, "w": "capitalism", "f": 3, "m": "capital（资本）+-ism（制度、主义）", "d": "1. n. 资本主义（3）", "e": "This has been dubbed &quot;quarterly <mark>capitalism</mark>.&quot;"}, {"id": 1471, "u": 15, "w": "catalog", "f": 3, "m": "cata-（逐一、向下）+log（述说、列举）", "d": "1. n. 目录（2）；2. n. 汇集（大量作品）（1）", "e": "But another, related force - a policy often buried deep in course <mark>catalogs</mark> called &quot;grade forgiveness&quot; - is helping raise GPAs."}, {"id": 1472, "u": 15, "w": "caution", "f": 3, "m": "caut（小心、警惕）+-ion（状态、行为或相关内容的名词后缀）", "d": "1. n. 谨慎、小心（2）；2. n. 告诫、提醒（1）", "e": "But for all the reasons there are to celebrate the computer, we must also act with <mark>caution</mark>."}, {"id": 1473, "u": 15, "w": "ceremony", "f": 3, "m": "cere（关心、在意）+-mony（状态、行为）", "d": "1. n. 仪式、典礼（3）", "e": "In your email you should include time, place and other relevant information about the <mark>ceremony</mark>."}, {"id": 1474, "u": 15, "w": "certainly", "f": 3, "m": "certain（一定的、确信的）+-ly（副词后缀）", "d": "1. adv. 当然、确实（3）", "e": "<mark>Certainly</mark>, our shops are exceptionally busy."}, {"id": 1475, "u": 15, "w": "chancellor", "f": 3, "m": "", "d": "1. n. 英国财政大臣（3）", "e": "What prompted the <mark>chancellor</mark> to develop his scheme?"}, {"id": 1476, "u": 15, "w": "classify", "f": 3, "m": "class（类别、等级）+-ify（使成为）", "d": "1. v. 分类；归类（3）", "e": "In signing the measure, California Governor Jerry Brown admitted that the law, which expressly <mark>classifies</mark> people on the basis of sex, is probably unconstitutional."}, {"id": 1477, "u": 15, "w": "clock", "f": 3, "m": "", "d": "1. n. 全天候（round/around theclock）（1）；2. n. 生物钟（1）；3. n. 钟、计时器（1）", "e": "No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-<mark>clock</mark> help) is a piece of cake."}, {"id": 1478, "u": 15, "w": "clothes", "f": 3, "m": "cloth（衣料）+es（本词固定的复数形式结尾）", "d": "1. n. 衣服（3）", "e": "Buy all your <mark>clothes</mark> at once with a stylist instead of shopping alone, one article of clothing at a time."}, {"id": 1479, "u": 15, "w": "clothing", "f": 3, "m": "clothe（给……穿衣，去e）+-ing（衣物的集合）", "d": "1. n. 衣服；服装（3）", "e": "Buy all your clothes at once with a stylist instead of shopping alone, one article of <mark>clothing</mark> at a time."}, {"id": 1480, "u": 15, "w": "cloud", "f": 3, "m": "", "d": "1. n. 云（1）；2. n. 云端（计算技术）（1）；3. v. 使蒙上阴影（1）", "e": "(47) Our mental health doesn&#x27;t really go anywhere; like the sun behind a <mark>cloud</mark>, it can be temporarily hidden from view, but it is fully capable of being restored in an instant."}, {"id": 1481, "u": 15, "w": "collaborate", "f": 3, "m": "col-（共同、一起）+labor（劳动、工作）+ate（动词后缀）", "d": "1. v. 合作（3）", "e": "(50) They pool resources, <mark>collaborate</mark>, think outside the box, and find solutions and ways around obstacles to explore science for the sake of science without the traditional boundaries of working inside a formal setting."}, {"id": 1482, "u": 15, "w": "collaborative", "f": 3, "m": "collaborate（去掉末尾e，合作、一起工作）+-ive（具有这种性质的）", "d": "1. adj. 协作的；合作的（3）", "e": "AI can be a <mark>collaborative</mark> tool in a wide range of creative endeavors."}, {"id": 1483, "u": 15, "w": "combination", "f": 3, "m": "combin-（combine去e，结合）+-ation（名词后缀）", "d": "1. n. 组合；结合（3）", "e": "Their reactions may be a complex <mark>combination</mark> of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment."}, {"id": 1484, "u": 15, "w": "command", "f": 3, "m": "com-（加强）+mand（交付、命令）", "d": "1. v. 拥有；获得/引起（权威、关注等）（2）；2. v. 指挥；控制（1）", "e": "(49) It wasn&#x27;t until the phrase &quot;scientific literacy&quot; came along in the 1940s that science had the formidable slogan it needed to <mark>command</mark> public attention and make improving science education an important national goal."}, {"id": 1485, "u": 15, "w": "completely", "f": 3, "m": "complete（完整的、完成的）+-ly（达到这种程度）", "d": "1. adv. 完全地；彻底地（3）", "e": "Now the nation&#x27;s top patent court appears <mark>completely</mark> ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago."}, {"id": 1486, "u": 15, "w": "comprehension", "f": 3, "m": "com-（一起、完整地）+prehens-（抓住）+-ion（过程、能力或状态的名词后缀）", "d": "1. n. 理解；领悟（3）", "e": "The ways of reading indicated here are without doubt kinds of <mark>comprehension</mark>."}, {"id": 1487, "u": 15, "w": "concentrate", "f": 3, "m": "con-（一起）+centr（中心）+ate（使成为，也可表示相应产物）", "d": "1. v. 集中注意力（2）；2. v. 集中（于某地）（1）", "e": "[ D ] <mark>Concentrating</mark> on real-life situations."}, {"id": 1488, "u": 15, "w": "conclusion", "f": 3, "m": "con-（一起、完全）+clus（关闭）+-ion（过程、结果的名词后缀）", "d": "1. n. 结论（2）；2. n. 总之（inconclusion）（1）", "e": "&quot;Readers must have confidence in the <mark>conclusions</mark> published in our journal,&quot; writes McNutt in an editorial."}, {"id": 1489, "u": 15, "w": "conductor", "f": 3, "m": "conduct（引导、管理、指挥、传导）+-or（执行的人或起相应作用的物）", "d": "1. n. 指挥家（2）；2. n. 经营者（1）", "e": "For my part, I have no idea whether Gilbert is a great <mark>conductor</mark> or even a good one."}, {"id": 1490, "u": 15, "w": "confuse", "f": 3, "m": "con-（一起）+fus（流动、混合）+e（词形结尾）", "d": "1. v. 使困惑；使糊涂（3）", "e": "It can be <mark>confusing</mark>."}, {"id": 1491, "u": 15, "w": "consist", "f": 3, "m": "con-（一起）+sist（站立、维持）", "d": "1. v. 由...组成（3）", "e": "But they show comprehension to <mark>consist</mark> not just of passive assimilation but of active engagement in inference and problem-solving."}, {"id": 1492, "u": 15, "w": "constraint", "f": 3, "m": "con-（加强）+strain（拉紧、束缚）+t（名词结尾）", "d": "1. n. 限制；制约（3）", "e": "If not placing jobs at risk, to the extent employment protection laws constrain business owners from dismissing under-performing managers, those laws act as a <mark>constraint</mark> on firm productivity and therefore on workers&#x27; wages."}, {"id": 1493, "u": 15, "w": "consult", "f": 3, "m": "", "d": "1. v. 咨询，请教（专业人士）（3）", "e": "<mark>Consulting</mark> firm Parks Associates predicts that legitimate US streaming services&#x27; cumulative loss from piracy since 2022 will reach $113 billion in the next two years."}, {"id": 1494, "u": 15, "w": "container", "f": 3, "m": "contain（容纳）+-er（承担相应作用的物）", "d": "1. n. 容器；盛放物品的器具（3）", "e": "The tester would ask, &quot;What&#x27;s in here?&quot; before looking into the <mark>container</mark>, smiling, and exclaiming, &quot;Wow!&quot;"}, {"id": 1495, "u": 15, "w": "contemptuous", "f": 3, "m": "contempt（轻蔑）+-uous（具有这种态度的）", "d": "1. adj. 轻蔑的（3）", "e": "[ C ] <mark>Contemptuous</mark>."}, {"id": 1496, "u": 15, "w": "contrary", "f": 3, "m": "contr-（相反、对抗）+-ary（相应性质或关系）", "d": "1. prep. 与...相反（3）", "e": "But __1__ some claims to the <mark>contrary</mark>, laughing probably has little influence on physical fitness."}, {"id": 1497, "u": 15, "w": "core", "f": 3, "m": "cor（心、中心）+e（词形结尾）", "d": "1. n. 核心；中心部分（2）；2. adj. 核心的（1）", "e": "The <mark>core</mark> of her successful defence was that she knew nothing."}, {"id": 1498, "u": 15, "w": "countryside", "f": 3, "m": "country（乡村）+side（区域、地方）", "d": "1. n. 乡村（3）", "e": "They don&#x27;t make <mark>countryside</mark> any more, and every year concrete consumes more of it."}, {"id": 1499, "u": 15, "w": "courage", "f": 3, "m": "cour（心）+age（品质、状态的名词结尾）", "d": "1. n. 勇气（3）", "e": "His compositions demand the performer to show <mark>courage</mark>, for example in the use of dynamics."}, {"id": 1500, "u": 15, "w": "crack", "f": 3, "m": "", "d": "1. v. 严厉打击（crack down）（1）；2. v. 立即着手（getcracking）（1）；3. v. 破裂；裂开（1）", "e": "With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that&#x27;s working to <mark>crack</mark> down on the thousands of illegal platforms that have cropped up in recent years."}, {"id": 1501, "u": 16, "w": "criminal", "f": 3, "m": "crimin-（罪、罪名）+-al（有关的）", "d": "1. adj. 犯罪的；涉及犯罪的（3）", "e": "The court&#x27;s ruling is legally sound in defining a kind of favoritism that is not <mark>criminal</mark>."}, {"id": 1502, "u": 16, "w": "cry", "f": 3, "m": "", "d": "1. v. 大声呼喊（1）；2. v. 迫切需要（cryout for）（1）；3. n. 哭泣（1）", "e": "Bob Herz, the FASB&#x27;s chairman, <mark>cried</mark> out against those who &quot;question our motives.&quot;"}, {"id": 1503, "u": 16, "w": "cycle", "f": 3, "m": "cycl（圆环、循环）+e（词形结尾）", "d": "1. n. 循环；周期（3）", "e": "Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce inequality and break the <mark>cycle</mark> of poverty."}, {"id": 1504, "u": 16, "w": "danger", "f": 3, "m": "", "d": "1. n. 危险（3）", "e": "The <mark>danger</mark> will come with Charles, who has both an expensive taste of lifestyle and a pretty hierarchical view of the world."}, {"id": 1505, "u": 16, "w": "database", "f": 3, "m": "data（数据）+base（基础、集中依托）", "d"
