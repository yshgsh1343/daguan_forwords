<style>

a { color: inherit; text-decoration: none; }

.topbar {

  flex-wrap: wrap;

}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {

.btn-chip {

.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {

  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {

  border-radius: 99px;
  overflow: hidden;
  display: flex;

}
.prog-seg { height: 100%; transition: width 0.3s ease; }

.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {

}

.batch-toolbar {

  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;

  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);

.search-box {

  gap: 6px;

  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {

  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {

  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {

  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {

  font-weight: 800;

  color: var(--text);

}
.word-title.masked {

  user-select: none;
}
.speak-btn {

}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {

  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {

  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;

.en-sent mark, .zh-sent mark {

  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {

  background: var(--border) !important;

  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {

  opacity: 0.28;

  cursor: pointer;

.sense-def {

  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;

.zh-sent {

  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;

  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {

  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;

.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {

  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {

  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;

.kbd-hint {

ngress wanted to <mark>prevent</mark> states from using their own resources to check immigration status, it could."}, {"id": 227, "u": 3, "w": "print", "f": 18, "m": "", "d": "1. n. 印刷品；纸质出版（14）；2. v. 印（钞，喻轻松获利）（2）；3. n. 出版发行（inprint）（1）；4. v. 打印（1）", "e": "Readers are migrating away from <mark>print</mark> anyway."}, {"id": 228, "u": 3, "w": "reading", "f": 18, "m": "read（读）+-ing（名词后缀；活动）", "d": "1. n. 阅读；读书（17）；2. n. 理解；解读（1）", "e": "How does your <mark>reading</mark> proceed?"}, {"id": 229, "u": 3, "w": "sign", "f": 18, "m": "", "d": "1. n. 迹象；标志（12）；2. v. 签名；签署（4）；3. v. 登记领取失业救济（sign on）（2）", "e": "Sometimes I feel in his late works a will to break all <mark>signs</mark> of continuity."}, {"id": 230, "u": 3, "w": "species", "f": 18, "m": "spec（看、观察）+ies（名词结尾）", "d": "1. n. 物种（18）", "e": "The fossil record shows that many <mark>species</mark> have endured for millions of years - so why shouldn&#x27;t we?"}, {"id": 231, "u": 3, "w": "affect", "f": 17, "m": "af-（朝向）+fect（做、造成作用）", "d": "1. v. 影响（17）", "e": "Such programs do not have to negatively <mark>affect</mark> the environment, though."}, {"id": 232, "u": 3, "w": "bill", "f": 17, "m": "", "d": "1. n. 法案（13）；2. n. 账单；应付费用（4）", "e": "If the <mark>bills</mark> become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022."}, {"id": 233, "u": 3, "w": "collect", "f": 17, "m": "col-（一起）+lect（收集）", "d": "1. v. 征收（7）；2. v. 收集（7）；3. adj. 收取（1）；4. adj. 收集（1）；5. v. 筹集（1）", "e": "The decisions made it more difficult for states to <mark>collect</mark> sales tax on certain online purchases."}, {"id": 234, "u": 3, "w": "consequence", "f": 17, "m": "con-（一起、相接）+sequ（跟随）+-ence（结果、状态的名词后缀）", "d": "1. n. 结果；后果（14）；2. n. 应承担的后果；惩罚（2）；3. n. 因此（inconsequence）（1）", "e": "What can be one <mark>consequence</mark> of the current dispute?"}, {"id": 235, "u": 3, "w": "draw", "f": 17, "m": "", "d": "1. v. 吸引；引来（6）；2. v. 利用；借助（draw on）（4）；3. v. 获取；吸取（灵感、教训）（2）；4. v. 抽取；选取（draw from）（1）；5 sues arise, however, when developers attempt to create large-scale <mark>short-term</mark> rental facilities-de facto hotels-to bypass taxes and regulations."}, {"id": 280, "u": 3, "w": "significant", "f": 16, "m": "signific（表示、意味；要紧）+-ant（形容词结尾）", "d": "1. adj. 显著的；重要的（16）", "e": "(diverted profits tax), Australia&#x27;s MAAL (multinational anti-avoidance law), and India&#x27;s SEP (<mark>significant</mark> economic presence) test, to name but a few."}, {"id": 281, "u": 3, "w": "step", "f": 16, "m": "", "d": "1. n. 步骤、步（10）；2. n. 步骤；措施（4）；3. v. 加强、增加（step up）（1）；4. v. 迈步；踏；踩（1）", "e": "Relying on ethical persuasion rather than law to address the misuse of body ideals may be the best <mark>step</mark>."}, {"id": 282, "u": 3, "w": "success", "f": 16, "m": "suc-（随后接上）+cess（走、前进）", "d": "1. n. 成功、成效（16）", "e": "How does the author feel about the <mark>success</mark> of Sci-Hub?"}, {"id": 283, "u": 3, "w": "activity", "f": 15, "m": "activ-（active去e，活跃的）+-ity（性质；状态）", "d": "1. n. 活动（14）；2. n. 神经活动（1）", "e": "The target group was given a 30-minute drama-based <mark>activity</mark> to accompany the passage."}, {"id": 284, "u": 3, "w": "analysis", "f": 15, "m": "ana-（分开）+lys（松开、分解）+-is（名词词尾）", "d": "1. n. 分析（15）", "e": "The great question is who should benefit from the <mark>analysis</mark> of all the data that our lives now generate."}, {"id": 285, "u": 3, "w": "analyze", "f": 15, "m": "", "d": "1. v. 分析（15）", "e": "Some of the trees he <mark>analyzed</mark> bore more than 20 fire scars among their rings."}, {"id": 286, "u": 3, "w": "character", "f": 15, "m": "", "d": "1. n. 人物；角色（6）；2. n. 特征；性质；特色（5）；3. n. 性格；品格（4）", "e": "They also &quot;appear to be more comfortable writing in role … while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary <mark>character</mark> and express that <mark>character&#x27;s</mark> emotion&quot;."}, {"id": 287, "u": 3, "w": "competition", "f": 15, "m": "compet-（竞争）+-ition（行为、过程）", "d": "1. n. 竞争（14）；2. n. 比赛（1）", "e": "They rid the forest of dead and sick trees, reducing <mark>competition</mark> and curbing the spread of disease."}, {"id": 288, "u": 3, "w": "continue", "f": 15, "m": "con-（加强）+tinu（连续、持续）+e（词形结尾）", "d": "1. v. 持续， 继续（13）；2. v. 存续（1）；3. v. 接着说（1）", "e": "Old objects <mark>continue</mark> to deteriorate."}, {"id": 289, "u": 3, "w": "critical", "f": 15, "m": "critic（评论者、批评者）+-al（有关的）", "d": "1. adj. 关键的；至关重要的（6）；2. adj. 批判性的、审慎判断的（3）；3. adj. 批评的；挑剔的（3）；4. adj. 临界的（2）；5. adj. 危急的；严重的（1）", "e": "For thousands of years, donkeys have been <mark>critical</mark> for propelling human civilizations forward."}, {"id": 290, "u": 3, "w": "enhance", "f": 15, "m": "", "d": "1. v. 提高（15）", "e": "And what&#x27;s the best way to pull off one that <mark>enhances</mark> our goals?"}, {"id": 291, "u": 3, "w": "expect", "f": 15, "m": "ex-（向外）+pect（spect去掉开头s，看）", "d": "1. v. 期待（14）；2. v. 指望（1）", "e": "If software promises to save lives on the scale that drugs now can, big data may be <mark>expected</mark> to behave as a big pharma has done."}, {"id": 292, "u": 3, "w": "explain", "f": 15, "m": "ex-（出、向外）+plain（清楚、明白）", "d": "1. v. 解释（14）；2. v. 解释……的原因（1）", "e": "How do we <mark>explain</mark> this trend?"}, {"id": 293, "u": 3, "w": "explore", "f": 15, "m": "", "d": "1. v. 探究（11）；2. v. 查看；搜查（3）；3. v. 探索；探查环境（1）", "e": "Specific brain regions that respond during direct gaze are being <mark>explored</mark> by other researchers, using advanced methods of brain scanning."}, {"id": 294, "u": 3, "w": "introduce", "f": 15, "m": "intro-（向内）+duc（引导）+e（词形结尾）", "d": "1. v. 引入；推出（11）；2. v. 介绍（4）", "e": "The problem began late last year, when PRH confirmed that it had <mark>introduced</mark> a credit limit with Waterstones &quot;at a very significant level&quot;."}, {"id": 295, "u": 3, "w": "liberal", "f": 15, "m": "liber（自由）+-al（具有这种性质的）", "d": "1. adj. （liberalarts / education）通识的；博雅的（10）；2. adj. 自由主义的；自由派的（4）；3. n. 自由派人士（1）", "e": "The AAAS displays great enthusiasm for <mark>liberal</mark> education."}, {"id": 296, "u": 3, "w": "light", "f": 15, "m": "", "d": "1. n. 光；光线（8）；2. n. 显露；被发现（come/bring tolight）（2）；3. n. 启示；使明白（shed light on）（1）；4. n. 鉴于；根据（in light of）（1）；5. adj. 轻的；轻量的（1）；6. n. 看待事物的角度（1）；7. v. 点燃（1）", "e": "The founders deliberately focused their projects around <mark>light</mark>-hence the &quot;visual studies&quot; in the name."}, {"id": 297, "u": 3, "w": "maintain", "f": 15, "m": "main（手，历史词形）+tain（保持）", "d": "1. v. 维持；保持（14）；2. v. 维护；保养（1）", "e": "Yet how was that universality of access made possible and, perhaps more importantly, how is it <mark>maintained</mark>?"}, {"id": 298, "u": 3, "w": "management", "f": 15, "m": "manage（管理）+-ment（名词后缀）", "d": "1. n. 管理（8）；2. n. 管理层（7）", "e": "Not only does understanding the equines&#x27; genetic makeup help reveal their contribution to human history, but it also might improve their <mark>management</mark> in the future, as climate change alters the planet&#x27;s environment, write the authors."}, {"id": 299, "u": 3, "w": "million", "f": 15, "m": "", "d": "1. n. 百万（钱）（14）；2. num. （not amillion miles away）相差不远；很相似（1）", "e": "This can mean <mark>millions</mark> more in revenue."}, {"id": 300, "u": 3, "w": "modern", "f": 15, "m": "mode（方式、式样）+RN（确实很新）", "d": "1. adj. 现代的、近代的（15）", "e": "What can be inferred about <mark>modern</mark> firefighting?"}, {"id": 301, "u": 4, "w": "opinion", "f": 15, "m": "", "d": "1. n. 意见、看法（12）；2. n. 司法意见、判决意见（3）", "e": "But such an idea is untrue, according to a new <mark>opinion</mark> article."}, {"id": 302, "u": 4, "w": "percent", "f": 15, "m": "per（每）+cent（百）", "d": "1. n. 百分之……（15）", "e": "If the bills become law, state boards and commissions will be required to set aside 50 <mark>percent</mark> of board seats for women by 2022."}, {"id": 303, "u": 4, "w": "post", "f": 15, "m": "", "d": "1. n. 职位（6）；2. n. 帖子,文章（4）；3. 短语 在……之后（前缀post-）（2）；4. n. 柱；桩（1）；5. v. 邮寄（1）；6. v. 发布（1）", "e": "He finally took that <mark>post</mark> at a major financial institution three years later."}, {"id": 304, "u": 4, "w": "reflect", "f": 15, "m": "re-（回）+flect（弯曲、折弯）", "d": "1. v. 反映；体现（13）；2. v. 反思；认真思考（2）", "e": "Such background material inevitably <mark>reflects</mark> who we are."}, {"id": 305, "u": 4, "w": "represent", "f": 15, "m": "re-（再、重新）+present（把对象摆到面前）", "d": "1. v. 代表；体现；表示（11）；2. v. 代表……的利益；作为……的代表（3）；3. v. 构成；相当于（1）", "e": "Which of the following statements best <mark>represents</mark> Lownie&#x27;s view?"}, {"id": 306, "u": 4, "w": "requirement", "f": 15, "m": "require（需要、要求）+-ment（内容或结果的名词后缀）", "d": "1. n. 要求；需要（15）", "e": "Specify the duties and <mark>requirements</mark> of the job."}, {"id": 307, "u": 4, "w": "respond", "f": 15, "m": "re-（回）+spond（承诺、作答）", "d": "1. v. 回应；作出反应（12）；2. v. 回答，答复（3）", "e": "It is not yet clear how advertisers will <mark>respond</mark>."}, {"id": 308, "u": 4, "w": "series", "f": 15, "m": "ser（连接）+ies（本词的名词词形结尾）", "d": "1. n. 一系列、一连串（12）；2. n. 连续剧、系列节目（3）", "e": "These journals can act as milk cows where every single article in an issue may cite a specific paper or a <mark>series</mark> of papers."}, {"id": 309, "u": 4, "w": "single", "f": 15, "m": "", "d": "1. adj. 单一的；仅一个的（9）；2. adj. 单身的；单亲的（4）；3. adj. 单独指出（single out）（1）；4. adj. 最为（强调最高级）（1）", "e": "Newton&#x27;s laws of motion and Darwinian evolution each bind a host of different phenomena into a <mark>single</mark> explicatory framework."}, {"id": 310, "u": 4, "w": "successful", "f": 15, "m": "success（成功、成就）+-ful（具有这种结果的）", "d": "1. adj. 成功的（15）", "e": "In some ways it has been very <mark>successful</mark>."}, {"id": 311, "u": 4, "w": "target", "f": 15, "m": "", "d": "1. n. 目标；针对的对象（6）；2. n. 实验组的（与对照组相对）（5）；3. v. 针对；以……为目标（3）；4. v. 实验组的（与对照组相对）（1）", "e": "If that happens, passionate consumers would try to persuade others to boycott products, putting the reputation of the <mark>target</mark> company at risk."}, {"id": 312, "u": 4, "w": "tend", "f": 15, "m": "", "d": "1. v. 往往会、倾向于（tend to）（15）", "e": "Beethoven&#x27;s music <mark>tends</mark> to move from chaos to order as if order were an imperative of human existence."}, {"id": 313, "u": 4, "w": "test", "f": 15, "m": "", "d": "1. n. 测试、检验、试验（8）；2. v. 测试、检验、试验（5）；3. n. 考试（1）；4. n. 认定标准、检验标准（1）", "e": "Gray and his colleagues have put them to the <mark>test</mark> by examining four family trees that between them represent more than 2,000 languages."}, {"id": 314, "u": 4, "w": "writer", "f": 15, "m": "write（写，去e）+-er（从事者）", "d": "1. n. 作家；作者（15）", "e": "You infer information you feel the <mark>writer</mark> has invited you to grasp by presenting you with specific evidence and clues."}, {"id": 315, "u": 4, "w": "ability", "f": 14, "m": "able（末尾le变il，有能力的）+-ity（性质、状态）", "d": "1. n. 能力（14）", "e": "Mental health is the seed that contains self-esteem -confidence in ourselves and an <mark>ability</mark> to trust in our common sense."}, {"id": 316, "u": 4, "w": "accept", "f": 14, "m": "ac-（向自己这边）+cept（拿取）", "d": "1. v. 接受（11）；2. v. 认可；认同（2）；3. v. 接纳；录取（1）", "e": "First, most researchers would <mark>accept</mark> such a prize if they were offered one."}, {"id": 317, "u": 4, "w": "advertiser", "f": 14, "m": "advertis（advertise去e，做广告）+er（从事者、机构）", "d": "1. n. 广告商；广告主（14）", "e": "<mark>Advertisers</mark> are horrified."}, {"id": 318, "u": 4, "w": "ancient", "f": 14, "m": "anci（在……之前、久远）+-ent（形容词结尾）", "d": "1. adj. 古代的；古老的（14）", "e": "<mark>Ancient</mark> Greek philosopher Aristotle viewed laughter as &quot;a bodily exercise precious to health.&quot;"}, {"id": 319, "u": 4, "w": "archaeologist", "f": 14, "m": "archaeo-（古代事物）+-logist（研究相应学科的人）", "d": "1. n. 考古学家（14）", "e": "But understanding where the animals were first domesticated could guide <mark>archaeologists</mark> to a narrow region to search for insights about the original tamed donkeys."}, {"id": 320, "u": 4, "w": "artificial", "f": 14, "m": "art（技艺）+i（连接字母）+fic（做、制造）+-ial（形容词后缀）", "d": "1. adj. 人工的；人造的（12）；2. adj. 人为安排的；不自然的（1）；3. adj. 刻意做出的；不自然的（1）", "e": "Advances in <mark>artificial</mark> intelligence (AI) are rapidly changing every aspect of human life."}, {"id": 321, "u": 4, "w": "chance", "f": 14, "m": "", "d": "1. n. 机会（7）；2. n. 可能性（5）；3. n. 偶然（bychance）（1）；4. n. 很可能（chances are）（1）", "e": "Thanks to his invention, we have a real <mark>chance</mark> to decrease the world&#x27;s carbon emissions."}, {"id": 322, "u": 4, "w": "conduct", "f": 14, "m": "con-（共同、一起）+duct（引导、带领）", "d": "1. v. 实施（8）；2. n. 行为；举止（5）；3. v. 组织；带领（1）", "e": "And a survey <mark>conducted</mark> for BuzzFeed News found 44 percent of Facebook users rarely or never trust news from the media giant."}, {"id": 323, "u": 4, "w": "conservation", "f": 14, "m": "con-（一起、整体）+serv（保持、保存）+ation（行为或状态的名词后缀）", "d": "1. n. 保护；保存（自然资源、环境等）（14）", "e": "We do not ruin urban <mark>conservation</mark> areas."}, {"id": 324, "u": 4, "w": "experiment", "f": 14, "m": "ex-（出）+peri（尝试）+-ment（名词结尾）", "d": "1. n. ( 科学) 实验（13）；2. n. 尝试（1）", "e": "The Hawthorne <mark>experiments</mark> had another surprise in store."}, {"id": 325, "u": 4, "w": "field", "f": 14, "m": "", "d": "1. n. 领域；学科（5）；2. n. 竞争环境（playing field）（3）；3. n. 田地、田野（2）；4. n. 场（磁场）（1）；5. n. 景深（depthof field）（1）；6. n. 现场；实地（1）；7. n. 视野范围（1）", "e": "On the overturned provisions the majority held Congress had deliberately &quot;occupied the <mark>field</mark>&quot; and Arizona had thus intruded on the federal&#x27;s privileged powers."}, {"id": 326, "u": 4, "w": "fight", "f": 14, "m": "", "d": "1. n. 争论；争执（5）；2. v. 抗争；对抗（3）；3. n. 打斗（2）；4. n. 争取（1）；5. n. 抗争；对抗（1）；6. v. 反击（fightback）（1）；7. v. 战斗（1）", "e": "A federal appeals court weighed in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the <mark>fight</mark>."}, {"id": 327, "u": 4, "w": "funding", "f": 14, "m": "fund（为……提供资金）+-ing（行为或与行为有关的事物）", "d": "1. n. 资金；经费资助（14）", "e": "The problem is not necessarily the amount of available <mark>funding</mark>."}, {"id": 328, "u": 4, "w": "gain", "f": 14, "m": "", "d": "1. v. 获得（8 h and hamper both prosperity and <mark>overall</mark> well-being."}, {"id": 337, "u": 4, "w": "pass", "f": 14, "m": "", "d": "1. v. 传递；转交（7）；2. v. 通过（考试、审核等）（5）；3. v. 度过；越过（1）；4. v. 超过（1）", "e": "This forces users to be more conscious of their role in <mark>passing</mark> along information."}, {"id": 338, "u": 4, "w": "photograph", "f": 14, "m": "photo-（光）+graph-（写、画、记录）", "d": "1. n. 照片（12）；2. v. 给……拍照（2）", "e": "Visit any antiques store and you&#x27;ll encounter artifacts from the past: <mark>photographs</mark>, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history."}, {"id": 339, "u": 4, "w": "public-sector", "f": 14, "m": "public（公共的）+sector（部门）", "d": "1. 短语 公共部门；公营部门（的）（14）", "e": "Its current leader, Ed Miliband, owes his position to votes from <mark>public-sector</mark> unions."}, {"id": 340, "u": 4, "w": "resource", "f": 14, "m": "re-（再、重新）+source（来源）", "d": "1. n. 资源、可用的财力物力（14）", "e": "But if Congress wanted to prevent states from using their own <mark>resources</mark> to check immigration status, it could."}, {"id": 341, "u": 4, "w": "security", "f": 14, "m": "secure（安全的、有保障的）+ity（状态或保障手段的名词后缀）", "d": "1. n. 安保；安全检查（8）；2. n. 安全；保障（6）", "e": "Americans are willing to tolerate time-consuming <mark>security</mark> procedures in return for increased safety."}, {"id": 342, "u": 4, "w": "similar", "f": 14, "m": "simil-（相似）+-ar（具有某种性质的）", "d": "1. adj. 相似的（14）", "e": "<mark>Similar</mark> to newly staked mining claims, they are full of potential."}, {"id": 343, "u": 4, "w": "specific", "f": 14, "m": "spec（看、辨明）+i（连接字母）+fic（做、使形成）", "d": "1. adj. 具体的、特定的（13）；2. n. 具体细节（1）", "e": "In this age of generalists, it pays to have <mark>specific</mark> knowledge or skills."}, {"id": 344, "u": 4, "w": "streaming", "f": 14, "m": "stream（流动、传送）+-ing（动作名词或分词后缀）", "d": "1. n. 流媒体播放；流媒体传输（14）", "e": "We were kept afloat by &quot;peak TV&quot;, the glut of content that was required by the explosion of <mark>streaming</mark> services."}, {"id": 345, "u": 4, "w": "surprise", "f": 14, "m": "sur-（从上）+prise（抓住）", "d": "1. n. 惊讶；意外（7）；2. v. 惊讶；意外（7）", "e": "The Hawthorne experiments had another <mark>surprise</mark> in store."}, {"id": 346, "u": 4, "w": "text", "f": 14, "m": "", "d": "1. n. 文章、文本（10）；2. n. 文字（4）", "e": "How we read a given <mark>text</mark> also depends to some extent on our particular interest in reading it."}, {"id": 347, "u": 4, "w": "theory", "f": 14, "m": "theor（观点、理论、论说）+y（名词结尾）", "d": "1. n. 理论、学说（11）；2. n. 理论上（intheory）（3）", "e": "The <mark>theory</mark> also seems to explain the sudden and unexpected popularity of certain looks, brands, or neighborhoods."}, {"id": 348, "u": 4, "w": "war", "f": 14, "m": "", "d": "1. n. 战争（8）；2. n. 斗争；争夺（5）；3. n. 陆军事务（Secretary of War：陆军部长）（1）", "e": "As the <mark>war</mark> unfolded, science rapidly assumed a central role."}, {"id": 349, "u": 4, "w": "address", "f": 13, "m": "ad-（向）+dress（安排；使对准，历史词义）", "d": "1. v. 处理；应对（11）；2. n. 地址（1）；3. v. 向……讲话；讲授或涉及（1）", "e": "This practice does not <mark>address</mark> the real worry."}, {"id": 350, "u": 4, "w": "award", "f": 13, "m": "", "d": "1. n. 奖项、奖赏（11）；2. v. 授予、颁发（2）", "e": "The new <mark>awards</mark> are an exercise in self-promotion for those behind them, say scientists."}, {"id": 351, "u": 4, "w": "being", "f": 13, "m": "be（存在）+-ing（名词后缀）", "d": "1. n. （well-being）福祉；身心健康（9）；2. n. 人；有生命或社会属性的存在者（3）；3. n. 存在；生活状态（1）", "e": "Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall well-<mark>being</mark>."}, {"id": 352, "u": 4, "w": "broadband", "f": 13, "m": "broad（宽的）+band（频带）", "d": "1. n. 宽带网络（13）", "e": "The order also declared that state and local governments couldn&#x27;t regulate <mark>broadband</mark> providers either."}, {"id": 353, "u": 4, "w": "charge", "f": 13, "m": "", "d": "1. v. 收取（费用）；征收（6）；2. n. 指控；罪名（3）；3. n. 冲锋；率先发起行动（lead thecharge）（1）；4. n. 收取（费用）；征收（1）；5. n. 负责；掌管（1）；6. v. 委托；赋予任务（be charged wit  v. 语境不足：偏爱／像（干扰项）（1）", "e": "The most loyal customers would still get the product they <mark>favor</mark>, the idea goes, and they&#x27;d feel like they were helping sustain the quality of something they believe in."}, {"id": 363, "u": 4, "w": "finding", "f": 13, "m": "find（发现）+-ing（行为或结果的名词后缀）", "d": "1. n. 研究发现；研究结果（13）", "e": "The team published their <mark>findings</mark> in the journal Science this month."}, {"id": 364, "u": 4, "w": "further", "f": 13, "m": "", "d": "1. adv. 进一步的；进一步地（10）；2. adv. 更远地（1）；3. adv. 此外；而且（1）；4. v. 推进；继续深造（1）", "e": "In 2006, the state went a step <mark>further</mark>, requiring that any extension of the plant&#x27;s license be subject to the Vermont legislature&#x27;s approval."}, {"id": 365, "u": 4, "w": "garden", "f": 13, "m": "", "d": "1. n. 花园, 公园（13）", "e": "Said one recorder of events, &quot;The air at twelve leagues&#x27; distance smelt as sweet as a new-blown <mark>garden</mark>.&quot;"}, {"id": 366, "u": 4, "w": "literacy", "f": 13, "m": "liter（文字、书写）+-acy（能力、状态）", "d": "1. n. 素养；相关知识和能力（10）；2. n. 识字能力；读写能力（3）", "e": "What can promote children&#x27;s emotional <mark>literacy</mark> according to O&#x27;Hanlon?"}, {"id": 367, "u": 4, "w": "particular", "f": 13, "m": "particul-（小部分；个别项）+-ar（形容词后缀）", "d": "1. adj. 特定的；特别的（10）；2. adj. 尤其；特别（in particular）（3）", "e": "How we read a given text also depends to some extent on our <mark>particular</mark> interest in reading it."}, {"id": 368, "u": 4, "w": "popular", "f": 13, "m": "popul（人民、民众）+-ar（与……有关的）", "d": "1. adj. 受欢迎的；流行的（11）；2. adj. 大众的；普遍的（2）", "e": "The tool, along with other <mark>popular</mark> image-generation AI models, allows anyone to create impressive images based on text prompts."}, {"id": 369, "u": 4, "w": "possibility", "f": 13, "m": "possible（可能的，末尾le换成il）+-ity（性质、情况的名词后缀）", "d": "1. n. 可能性、可能的机会（13）", "e": "Don&#x27;t dismiss that <mark>possibility</mark> entirely."}, {"id": 370, "u": 4, "w": "presence", "f": 13, "m": "present（去掉词尾ent，在场的、存在的）+-ence（状态）", "d": "1. n. 存在；在场（12）；2. n. 影响力；存在感（1）", "e": "(diverted profits tax), Australia&#x27;s MAAL (multinational anti-avoidance law), and India&#x27;s SEP (significant economic <mark>presence</mark>) test, to name but a few."}, {"id": 371, "u": 4, "w": "private", "f": 13, "m": "priv（个人、与公共范围分离）+ate（具有这种性质的）", "d": "1. adj. 私营的；私立的（8）；2. adj. 私人的（3）；3. adj. 普通议员的（private member）（1）；4. adj. 私密的；非公开的（1）", "e": "In many rich countries average wages in the state sector are higher than in the <mark>private</mark> one."}, {"id": 372, "u": 4, "w": "project", "f": 13, "m": "pro-（向前）+ject（投掷、投射）", "d": "1. n. 项目；计划（13）", "e": "The founders deliberately focused their <mark>projects</mark> around light-hence the &quot;visual studies&quot; in the name."}, {"id": 373, "u": 4, "w": "provider", "f": 13, "m": "provid-（provide去e，提供）+-er（做某事的人或机构）", "d": "1. n. 提供者；服务机构（13）", "e": "The order also declared that state and local governments couldn&#x27;t regulate broadband <mark>providers</mark> either."}, {"id": 374, "u": 4, "w": "publication", "f": 13, "m": "public（公开的）+-ation（行为、结果的名词后缀）", "d": "1. n. 出版；发表（7）；2. n. 出版物；刊物（6）", "e": "What is important is not truth, but <mark>publication</mark>, which has become almost an end in itself."}, {"id": 375, "u": 4, "w": "publishing", "f": 13, "m": "publish（出版）+-ing（活动、行业）", "d": "1. n. 出版；出版业（13）", "e": "Scientific <mark>publishing</mark> has long been a licence to print money."}, {"id": 376, "u": 4, "w": "radio", "f": 13, "m": "", "d": "1. n. 广播、无线电（11）；2. n. 收音机（2）", "e": "But <mark>radio&#x27;s</mark> enriching serendipity is ebbing."}, {"id": 377, "u": 4, "w": "reach", "f": 13, "m": "", "d": "1. v. 触达；与……接触（4）；2. v. 到达；达到（4）；3. n. 影响或能力所及的范围（2）；4. v. 达成（一致意见）（2）；5. adj. 影响深远的（far-reaching）（1）", "e": "&quot;Artists help scientists <mark>reach</mark> a broader audience and make emotional connections that enhance learning,&quot; one respondent said."}, {"id": 378, "u": 4, "w": "regulation", "f": 13, "m": "regulate（管制、调节，去掉末尾e）+-ion（过程或结果的名词后缀）", "d": s</mark> on music is unknown save to specialists."}, {"id": 387, "u": 4, "w": "account", "f": 12, "m": "", "d": "1. n. 叙述；记载（6）；2. n. 考虑；计入考虑（take accountof）（1）；3. n. 账户；账号（1）；4. n. 账目；财务记录（1）；5. n. 重要性；价值（1）；6. v. 占（比例）（1）；7. v. 解释；说明（account for）（1）", "e": "It is painful to read these roundabout <mark>accounts</mark> today."}, {"id": 388, "u": 4, "w": "amount", "f": 12, "m": "", "d": "1. n. 数量；总量（11）；2. v. 等同于；相当于（1）", "e": "The problem is not necessarily the <mark>amount</mark> of available funding."}, {"id": 389, "u": 4, "w": "application", "f": 12, "m": "applic-（apply的词干形式，应用；请求）+-ation（行为、过程或结果）", "d": "1. n. 应用；运用（6）；2. n. 申请；申请材料（4）；3. n. 应用程序（2）", "e": "New, disruptive technology sometimes demands novel <mark>applications</mark> of the Constitution&#x27;s protections."}, {"id": 390, "u": 4, "w": "basic", "f": 12, "m": "bas（基础）+-ic（与……有关的）", "d": "1. adj. 基本的；基础的（12）", "e": "If connections can be bought, a <mark>basic</mark> premise of democratic society - that all are equal in treatment by government - is undermined."}, {"id": 391, "u": 4, "w": "chief", "f": 12, "m": "", "d": "1. adj. 首席的；最高级别的（9）；2. n. 主管；领导（2）；3. adj. 主要的（1）", "e": "Brendon Lynch, Microsoft&#x27;s <mark>chief</mark> privacy officer, blogged: &quot;We believe consumers should have more control.&quot;"}, {"id": 392, "u": 4, "w": "cite", "f": 12, "m": "cit（召唤、唤起）+e（拼写结尾）", "d": "1. v. 引用；引证；举例提及（12）", "e": "The court, though, may want to allow room for police to <mark>cite</mark> situations where they are entitled to more freedom."}, {"id": 393, "u": 4, "w": "connection", "f": 12, "m": "connect（连接）+-ion（行为；关系）", "d": "1. n. 联系；关联（9）；2. n. 人脉；关系（1）；3. n. 网络连接（1）；4. n. （水体）物理连通（1）", "e": "&quot;Artists help scientists reach a broader audience and make emotional <mark>connections</mark> that enhance learning,&quot; one respondent said."}, {"id": 394, "u": 4, "w": "crisis", "f": 12, "m": "cri（分辨、判断）+-sis（过程、阶段）", "d": "1. n. 危机；危急关头（12）", "e": "The idea that &quot;housing <mark>crisis</mark>&quot; equals &quot;concreted meadows&quot; is pure lobby talk."}, {"id": 395, "u": 4, "w": "cure", "f": 12, "m": "cur（照料）+e（词形结尾）", "d": "1. n. 解决方法；治疗方法（11）；2. v. 治愈（疾病）（1）", "e": "It is also wise to recall that such titles are not a <mark>cure</mark>-all."}, {"id": 396, "u": 4, "w": "decide", "f": 12, "m": "de-（去掉）+cid（切断）+e（拼写结尾）", "d": "1. v. 决定（8）；2. v. 判断（2）；3. v. 裁定（2）", "e": "Nor does it reveal how much companies are banking on the halo effect, rather than the other possible benefits, when they <mark>decide</mark> their do-gooding policies."}, {"id": 397, "u": 4, "w": "deep", "f": 12, "m": "", "d": "1. adj. 深的；深入的（7）；2. adj. 人才储备充足的（1）；3. adj. 表面的（skin-deep）（1）；4. adj. 财力雄厚的（deep-pocketed）（1）；5. adj. 遥远的（未来）（1）；6. adj. （颜色）深的（1）", "e": "The nail hoard was discovered in 1960 in a four-metre-<mark>deep</mark> pit covered by two metres of gravel."}, {"id": 398, "u": 4, "w": "essential", "f": 12, "m": "essent（存在、本质）+-ial（有关的）", "d": "1. adj. 必不可少的；至关重要的（10）；2. adj. 本质的；基本的（1）；3. adj. 核心的；关键的（1）", "e": "The details may be unknowable, but the independence of standard-setters, <mark>essential</mark> to the proper functioning of capital markets, is being compromised."}, {"id": 399, "u": 4, "w": "express", "f": 12, "m": "ex-（向外）+press（压；催促）", "d": "1. v. 表达（12）", "e": "The digital services tax now awaits the signature of President Emmanuel Macron, who has <mark>expressed</mark> support for the measure, and it could go into effect within the next few weeks."}, {"id": 400, "u": 4, "w": "feature", "f": 12, "m": "feat（突出之处）+-ure（词形结尾）", "d": "1. n. 特征、特点、特色（4）；2. v. 以……为特色；突出展示（3）；3. n. 地物、地貌特征（2）；4. n. 特写；专题报道（2）；5. n. 五官；面部特征（1）", "e": "I make no apology for being obsessed by a particular <mark>feature</mark> of everyday objects: their price."}, {"id": 401, "u": 5, "w": "function", "f": 12, "m": "", "d": "1. n. 功能、作用（6）；2. v. 运行、发挥作用（4）；3. n. 取决于……的结果（1）；4. v. 充当、起……作用（1）", "e": "Moreover, some have been found to have a valuable <mark>function</mark> in building up soil fertility."}, {"id": 402, "u": 5, "w": "humanity", "f": 12, "m": "human（人；人类的）+-ity（名词后缀）", "d": "1. n. 人类（总称）（9）；2. n. 人道；仁爱（2）；3. n. 人性；人的特质（1）", "e": "You might even be tempted to assume that <mark>humanity</mark> has little future to look forward to."}, {"id": 403, "u": 5, "w": "immigration", "f": 12, "m": "immigrat-（immigrate去e，移居入境）+-ion（名词后缀）", "d": "1. n. 移民；入境移居（12）", "e": "But if Congress wanted to prevent states from using their own resources to check <mark>immigration</mark> status, it could."}, {"id": 404, "u": 5, "w": "intend", "f": 12, "m": "in-（向内、在心里）+tend（伸展、指向）", "d": "1. v. 打算；意图；旨在（12）", "e": "A foreign friend of yours has recently graduated from college and <mark>intends</mark> to find a job in China."}, {"id": 405, "u": 5, "w": "investment", "f": 12, "m": "invest（投资）+-ment（行为；结果）", "d": "1. n. 投资；投入（12）", "e": "Similarly, some Wall Street <mark>investment</mark> firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice."}, {"id": 406, "u": 5, "w": "legitimate", "f": 12, "m": "legitim（合法）+-ate（形容词、动词后缀）", "d": "1. adj. 合法的；正当的（9）；2. adj. 合理的；有根据的（3）", "e": "In effect, the White House claimed that it could invalidate any otherwise <mark>legitimate</mark> state law that it disagrees with."}, {"id": 407, "u": 5, "w": "nation", "f": 12, "m": "nat（出生、诞生）+ion（这里构成群体名称）", "d": "1. n. 国家；国民（12）", "e": "I would ask that the foreign <mark>nations</mark> and the original country discuss the terms of transfer."}, {"id": 408, "u": 5, "w": "net", "f": 12, "m": "", "d": "1. n. 互联网（6）；2. n. 安全网；保障（3）；3. adj. 净值的（扣除后的）（3）", "e": "In the meantime, the court threw out the FCC&#x27;s attempt to block all state rules on <mark>net</mark> neutrality, while preserving the commission&#x27;s power to preempt individual state laws that undermine its order."}, {"id": 409, "u": 5, "w": "particularly", "f": 12, "m": "particular（特殊的、特定的）+-ly（以这种方式）", "d": "1. adv. 尤其，特别（强调某事物）（12）", "e": "But that&#x27;s a very shortsighted view, <mark>particularly</mark> when it comes to the Chesapeake Bay."}, {"id": 410, "u": 5, "w": "pattern", "f": 12, "m": "", "d": "1. n. 模式；规律（11）；2. n. 图案（1）", "e": "Neither of these <mark>patterns</mark> is borne out by the analysis, suggesting that the structures of the languages are lineage-specific and not governed by universals."}, {"id": 411, "u": 5, "w": "performer", "f": 12, "m": "perform（表演；表现）+-er（人）", "d": "1. n. 业绩优秀者、优秀管理者（5）；2. n. 表演者、演奏者（4）；3. n. 表现者、某方面有特定表现的对象（3）", "e": "Many recruiters say the old disgrace is fading for top <mark>performers</mark>."}, {"id": 412, "u": 5, "w": "planet", "f": 12, "m": "", "d": "1. n. 地球（8）；2. n. 与现实脱节（on the wrongplanet）（2）；3. n. 行星（2）", "e": "Resting in the Pacific Ocean, Mauna Kea&#x27;s peak rises above the bulk of our <mark>planet&#x27;s</mark> dense atmosphere, where conditions allow telescopes to obtain images of unsurpassed clarity."}, {"id": 413, "u": 5, "w": "politics", "f": 12, "m": "polit（公共治理）+ics（相关活动或学科）", "d": "1. n. 政治；政治活动（12）", "e": "Third, they now dominate left-of-centre <mark>politics</mark>."}, {"id": 414, "u": 5, "w": "president", "f": 12, "m": "presid-（preside去e，主持）+-ent（承担相应职责的人）", "d": "1. n. 总统（8）；2. n. 校长（2）；3. n. 主席；会长（1）；4. n. 总裁（1）", "e": "The implication is that Millennials prefer news from the White House to be filtered through other sources, not a <mark>president&#x27;s</mark> social media platform."}, {"id": 415, "u": 5, "w": "privacy", "f": 12, "m": "priv-（私人；个人）+-acy（性质；状态）", "d": "1. n. 隐私；隐私权（12）", "e": "Americans should take steps to protect their digital <mark>privacy</mark>."}, {"id": 416, "u": 5, "w": "range", "f": 12, "m": "", "d": "1. n. 范围；幅度（6）；2. v. 在一定范围内变化；包括从……到……（4）；3. adj. （free-ranging）自由活动的（1）；4. n. 产品系列（1）", "e": "AI can be a collaborative tool in a wide <mark>range</mark> of creative endeavors."}, {"id": 417, "u": 5, "w": "reality", "f": 12, "m": "real（真实的、现实的）+-ity（性质、状态的名词后缀）", "d": "1. n. 现实；实际情况（12）", "e": "But a comparative study of linguistic traits published online today supplies a <mark>reality</mark> check."}, {"id": 418, "u": 5, "w": "relation", "f": 12, "m": "relate（使互相关联）+-ion（关系、状态或相关对象的名词结尾）", "d": "1. n. 关系（10）；2. n. 关于；相对于（in relation to）（2）", "e": "Composure is a state of mind made possible by the structuring of one&#x27;s <mark>relation</mark> to one&#x27;s environment."}, {"id": 419, "u": 5, "w": "release", "f": 12, "m": "re-（充分、向外）+leas（松开）+e（词形结尾）", "d": "1. v. 发布；推出；公开发行（7）；2. v. 释放；排出（物质）（3）；3. n. 授权；准许使用（1）；4. v. 释放；放走（1）", "e": "India <mark>released</mark> its AI ethics strategy this spring."}, {"id": 420, "u": 5, "w": "remove", "f": 12, "m": "re-（离开原处）+move（移动）", "d": "1. v. 移走、去除（9）；2. adj. 远离、与……相隔（3）", "e": "Companies are using artificial intelligence to <mark>remove</mark> some of the unconscious bias from hiring decisions."}, {"id": 421, "u": 5, "w": "respect", "f": 12, "m": "re-（回、再）+spect（看）", "d": "1. v. 尊重（5）；2. n. 尊重（4）；3. n. 关于（inrespect of）（1）；4. n. 方面（1）；5. v. 遵循；顾及（1）", "e": "They do so best where building sticks to their edges and <mark>respects</mark> their character."}, {"id": 422, "u": 5, "w": "signal", "f": 12, "m": "sign（标记）+al（本词的名词结尾）", "d": "1. n. 信号；征兆（9）；2. v. 发出信号；表示；示意（3）", "e": "Getting a DNT <mark>signal</mark> does not oblige anyone to stop tracking, although some companies have promised to do so."}, {"id": 423, "u": 5, "w": "statement", "f": 12, "m": "state（陈述、说明）+-ment（行为、内容或书面结果）", "d": "1. n. 陈述；说法（7）；2. n. 声明；正式公告（4）；3. n. 报表（incomestatement：利润表）（1）", "e": "While the <mark>statement</mark> is vague, it represents one starting point."}, {"id": 424, "u": 5, "w": "survive", "f": 12, "m": "sur-（越过、超过）+viv（活、生存）+e（拼写结尾）", "d": "1. v. 生存；存续；幸存（6）；2. v. 保存下来；流传下来（3）；3. v. 从…中幸存（2）；4. v. 经受住；挺过（1）", "e": "During their six- to twelve-week voyage, they <mark>survived</mark> on barely enough food allotted to them."}, {"id": 425, "u": 5, "w": "technological", "f": 12, "m": "technolog-（technology去y，技术、科技）+ical（与……有关的）", "d": "1. adj. 技术的；科技的（12）", "e": "Optimists point out that <mark>technological</mark> upheaval has benefited workers in the past."}, {"id": 426, "u": 5, "w": "threat", "f": 12, "m": "", "d": "1. n. 威胁（12）", "e": "Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of <mark>threats</mark> facing us, from asteroid strike to epidemic flu and to climate change."}, {"id": 427, "u": 5, "w": "track", "f": 12, "m": "", "d": "1. v. 追踪；跟踪监测（7）；2. n. 掌握动态；记录（keep track of）（1）；3. n. 路线；轨迹（1）；4. n. 踪迹；痕迹（1）；5. n. 轨道；铁轨（1）；6. v. 循着……前行；沿着……追溯（1）", "e": "Using <mark>tracking</mark> devices, researchers have shown that they have &quot;remarkable spatial acuity.&quot;"}, {"id": 428, "u": 5, "w": "traditional", "f": 12, "m": "tradition（传统、习俗）+-al（有关的）", "d": "1. adj. 传统的；惯常的（12）", "e": "Online education can supplement the <mark>traditional</mark> kind."}, {"id": 429, "u": 5, "w": "understanding", "f": 12, "m": "understand（理解）+-ing（过程、结果或相应态度）", "d": "1. n. 理解、认识（10）；2. n. 谅解、体谅（1）；3. v. 谅解、体谅（1）", "e": "Good governance rests on an <mark>understanding</mark> of the inherent worth of each individual."}, {"id": 430, "u": 5, "w": "actually", "f": 11, "m": "actual（实际存在或发生的）+-ly（从某个方面来说）", "d": "1. adv. 实际上；确实（11）", "e": "What is more, they can be detected even when they are not <mark>actually</mark> visible."}, {"id": 431, "u": 5, "w": "adopt", "f": 11, "m": "ad-（朝向）+opt（选择）", "d": "1. v. 采用；采纳（5）；2. v. 正式通过并实施（4）；3. v. 语境不足：采用／收养（干扰项）（2）", "e": "The countries <mark>adopting</mark> the unilateral measures share the opinion that____"}, {"id": 432, "u": 5, "w": "associate", "f": 11, "m": "as-（向、同……结合）+soci（伙伴、社交）+-ate（动作、身份或性质的结尾）", "d": "1. v. 联系；与……有关（10）；2. n. 合伙人；伙伴（1）", "e": "&quot;We see that the program is <mark>associated</mark> with a 30 percent reduction in deforestation,&quot; Ferraro says."}, {"id": 433, "u": 5, "w": "basis", "f": 11, "m": "bas（基础）+is（本词的名词结尾）", "d": "1. n. 基础、依据（11）", "e": "Their North American tree-ring fire-scar network (NAFSN) provided the <mark>basis</mark> for a study published last month."}, {"id": 434, "u": 5, "w": "business-method", "f": 11, "m": "", "d": "1. 短语 商业方法（11）", "e": "Now the nation&#x27;s top patent court appears completely ready to scale back on <mark>business-method</mark> patents, which have been controversial ever since they were first authorized 10 years ago."}, {"id": 435, "u": 5, "w": "capture", "f": 11, "m": "capt-（抓住）+-ure（行为或结果）", "d": "1. v. 捕捉；拍摄（画面）（7）；2. v. 准确表现、表达（3）；3. v. 缴获（1）", "e": "Spontaneous smiles were relatively easy to <mark>capture</mark> by the 1890s, so we must look elsewhere for an explanation of why Victorians still hesitated to smile."}, {"id": 436, "u": 5, "w": "celebrity", "f": 11, "m": "celebr（著名）+-ity（状态、具有这种状态的人）", "d": "1. n. 名人；明星（11）", "e": "Practically every week features at least one <mark>celebrity</mark> mom, or mom-to-be, smiling on the newsstands."}, {"id": 437, "u": 5, "w": "citizen", "f": 11, "m": "citi（城市）+zen（人）", "d": "1. n. 公民；普通公众（11）", "e": "Anyone can be a <mark>citizen</mark> scientist, regardless of age, nationality or academic experience."}, {"id": 438, "u": 5, "w": "colleague", "f": 11, "m": "", "d": "1. n. 同事、同行（11）", "e": "So van Oosten and <mark>colleagues</mark> worked to preserve Gilardi&#x27;s sculptures."}, {"id": 439, "u": 5, "w": "commission", "f": 11, "m": "com-（共同、一起）+miss（派遣）+-ion（名词后缀）", "d": "1. n. 委员会；调查委员会（10）；2. v. 委托创作或制作；委托（1）", "e": "If the bills become law, state boards and <mark>commissions</mark> will be required to set aside 50 percent of board seats for women by 2022."}, {"id": 440, "u": 5, "w": "conflict", "f": 11, "m": "con-（共同、在一起）+flict（击打）", "d": "1. n. 冲突；矛盾（9）；2. v. 与……冲突、不一致（2）", "e": "The <mark>conflict</mark> has been surfacing since 2002, when the corporation bought Vermont&#x27;s only nuclear power plant, an aging reactor in Vernon."}, {"id": 441, "u": 5, "w": "constitution", "f": 11, "m": "constitute（组成、建立，去末尾e）+-ion（构成方式或结果的名词后缀）", "d": "1. n. 宪法；章程（11）", "e": "Just how much does the <mark>Constitution</mark> protect your digital data?"}, {"id": 442, "u": 5, "w": "contrast", "f": 11, "m": "contra-（相反、相对）+st（站立）", "d": "1. n. 对比；对照（8）；2. v. 对照比较（2）；3. v. 形成对比；形成反差（1）", "e": "By <mark>contrast</mark>, in hunter-gatherer societies adults other than the parents can provide almost half of a child&#x27;s care."}, {"id": 443, "u": 5, "w": "critic", "f": 11, "m": "crit（分辨、判断）+ic（有这种能力的人）", "d": "1. n. 批评家；评论家（9）；2. n. 批评者；反对者（2）", "e": "Unfortunately, these <mark>critics</mark> are virtually forgotten."}, {"id": 444, "u": 5, "w": "cultural", "f": 11, "m": "culture（去掉末尾e，文化）+-al（与之有关的）", "d": "1. adj. 文化的；与文化相关的（11）", "e": "Yet science has a <mark>cultural</mark> history, too, with roots going back to the dawn of civilization."}, {"id": 445, "u": 5, "w": "difference", "f": 11, "m": "differ（不同）+-ence（名词后缀）", "d": "1. n. 差异（10）；2. n. 影响、作用（make a difference）（1）", "e": "But what will be the nature of that <mark>difference</mark>?"}, {"id": 446, "u": 5, "w": "discover", "f": 11, "m": "dis-（去掉）+cover（覆盖、遮盖）", "d": "1. v. 发现（11）", "e": "The nail hoard was <mark>discovered</mark> in 1960 in a four-metre-deep pit covered by two metres of gravel."}, {"id": 447, "u": 5, "w": "eliminate", "f": 11, "m": "e-（移出）+limin（门槛、界限）+-ate（形成动作）", "d": "1. v. 消除；去除；取消（11）", "e": "It &quot;has the potential to <mark>eliminate</mark> an entire class of patents.&quot;"}, {"id": 448, "u": 5, "w": "enforcement", "f": 11, "m": "enforce（执行）+-ment（名词后缀）", "d": "1. n. 执行、强制实施（法律或规定）（11）", "e": "However, the Justices said that Arizona police would be allowed to verify the legal status of people who come in contact with law <mark>enforcement</mark>."}, {"id": 449, "u": 5, "w": "ethical", "f": 11, "m": "ethic（道德；伦理）+-al（与……有关的）", "d": "1. adj. 道德的；伦理的（10）；2. adj. 合乎道德的（1）", "e": "The coming use of autonomous vehicles, for example, poses thorny <mark>ethical</mark> questions."}, {"id": 450, "u": 5, "w": "expert", "f": 11, "m": "ex-（出）+per（peri去掉末尾i，尝试）+t（本词词形结尾）", "d": "1. n. 专家；专业人士（10）；2. adj. 专业的（1）", "e": "Most scientists and <mark>experts</mark> sharply dispute Hardy&#x27;s views."}, {"id": 451, "u": 5, "w": "flow", "f": 11, "m": "fl（流动）+ow（词形结尾）", "d": "1. n. 传播、传播流（4）；2. n. 流动、流通（3）；3. v. 流动、流通（2）；4. v. 传播、传播流（1）；5. v. 源于、由……产生（flow from）（1）", "e": "Marketers have embraced the two-step <mark>flow</mark> because it suggests that if they can just find and influence the influentials, those select people will do most of the work for them."}, {"id": 452, "u": 5, "w": "foreign", "f": 11, "m": "", "d": "1. adj. 外国的、国外的（11）", "e": "I would ask that the <mark>foreign</mark> nations and the original country discuss the terms of transfer."}, {"id": 453, "u": 5, "w": "fund", "f": 11, "m": "", "d": "1. n. 资金、基金（6）；2. v. 资助；提供资金（5）", "e": "The trick is to direct these <mark>funds</mark> better."}, {"id": 454, "u": 5, "w": "giant", "f": 11, "m": "", "d": "1. n. 巨头；行业巨擘（9）；2. adj. 巨大的（1）；3. n. 大师；杰出人物（1）", "e": "The use of privacy law to curb the tech <mark>giants</mark> in this instance feels slightly maladapted."}, {"id": 455, "u": 5, "w": "historical", "f": 11, "m": "history（历史，去掉末尾y）+ical（与……有关的）", "d": "1. adj. 历史的；过去的（11）", "e": "The result is an embarrassment of <mark>historical</mark> riches, which brings its own needle-and-haystack problems."}, {"id": 456, "u": 5, "w": "illegal", "f": 11, "m": "il-（不）+legal（合法的）", "d": "1. adj. 非法的，违法的（11）", "e": "The state Legislature recently voted against a bill that would&#x27;ve made it <mark>illegal</mark> for towns to create legislation restricting short-term rentals."}, {"id": 457, "u": 5, "w": "invention", "f": 11, "m": "invent（发明、创造）+-ion（行为或所得结果）", "d": "1. n. 发明；创造（11）", "e": "Thanks to his <mark>invention</mark>, we have a real chance to decrease the world&#x27;s carbon emissions."}, {"id": 458, "u": 5, "w": "landscape", "f": 11, "m": "land（土地）+-scape（景色、景观）", "d": "1. n. 地貌；景观；风景（11）", "e": "There is no doubt of the alternative - the corrupted <mark>landscapes</mark> of southern Portugal, Spain or Ireland."}, {"id": 459, "u": 5, "w": "lifestyle", "f": 11, "m": "life（生活）+style（方式、风格）", "d": "1. n. 生活方式（11）", "e": "Does that mean the writing is on the wall for all European royals, with their magnificent uniforms and majestic <mark>lifestyles</mark>?"}, {"id": 460, "u": 5, "w": "literary", "f": 11, "m": "liter（文字、书写）+-ary（有关的、从事相应活动的）", "d": "1. adj. 文学的（11）", "e": "&quot;This is all part of a wider change towards concentration of power,&quot; says <mark>literary</mark> agent Andrew Lownie."}, {"id": 461, "u": 5, "w": "long-term", "f": 11, "m": "long（长的）+term（时期、期限）", "d": "1. adj. 长期的，长远的（11）", "e": "Unfortunately, the <mark>long-term</mark> costs of using simple quantitative metrics to assess researcher merit are likely to be quite great."}, {"id": 462, "u": 5, "w": "middle", "f": 11, "m": "midd（中间）+le（词形结尾）", "d": "1. adj. 中间；中等的（7）；2. adj. 中年的（3）；3. adj. 折中立场（middle ground）（1）", "e": "But in the medium term, <mark>middle</mark>-class workers may need a lot of help adjusting."}, {"id": 463, "u": 5, "w": "norm", "f": 11, "m": "", "d": "1. n. 常态、通常情况（6）；2. n. 规范、惯例（5）", "e": "But they are the exception, not the <mark>norm</mark> that Ms. Marris implies."}, {"id": 464, "u": 5, "w": "novel", "f": 11, "m": "nov（新）+-el（历史词尾）", "d": "1. n. 小说（6）；2. adj. 新颖的、新的（5）", "e": "Mary Shelley&#x27;s <mark>novel</mark> Frankenstein is mentioned because it____"}, {"id": 465, "u": 5, "w": "picture", "f": 11, "m": "pict（画、描绘）+-ure（描绘所得的结果）", "d": "1. n. 图片；图像（7）；2. n. 全局（big/bigger picture）（2）；3. n. 描绘；呈现的景象（2）", "e": "What might have kept the Victorians from smiling for <mark>pictures</mark> in the 1890s?"}, {"id": 466, "u": 5, "w": "platform", "f": 11, "m": "plat（平的）+form（形状、形态）", "d": "1. n. 平台（11）", "e": "The implication is that Millennials prefer news from the White House to be filtered through other sources, not a president&#x27;s social media <mark>platform</mark>."}, {"id": 467, "u": 5, "w": "principle", "f": 11, "m": "prin（第一、首要）+cip（取）+le（本词名词结尾）", "d": "1. n. 原则、基本准则（8）；2. n. 原理，定律（2）；3. n. 原则上、理论上（in principle）（1）", "e": "As so often is the case, stating that <mark>principle</mark> doesn&#x27;t ease the challenge of line-drawing."}, {"id": 468, "u": 5, "w": "profession", "f": 11, "m": "pro-（公开）+fess（声明）+-ion（行为或相关事物的名词后缀）", "d": "1. n. 职业、行业及其从业者（11）", "e": "Sensible ideas have been around for a long time, but the state-level bodies that govern the <mark>profession</mark> have been too conservative to implement them."}, {"id": 469, "u": 5, "w": "progress", "f": 11, "m": "pro-（向前）+gress（走；前进）", "d": "1. n. 进步；进展（7）；2. v. (使)进展（3）；3. n. 历程（1）", "e": "Scientific papers are the recordkeepers of <mark>progress</mark> in research."}, {"id": 470, "u": 5, "w": "prospect", "f": 11, "m": "pro-（向前）+spect（看）", "d": "1. n. 前景、可能性（11）", "e": "The <mark>prospect</mark> seems remote."}, {"id": 471, "u": 5, "w": "prove", "f": 11, "m": "", "d": "1. v. 结果证明是、显示出（6）；2. v. 证明,证实（5）", "e": "Science-based analytical approaches <mark>proved</mark> remarkably successful in the hunt for German submarines in the Atlantic Ocean."}, {"id": 472, "u": 5, "w": "quickly", "f": 11, "m": "quick（迅速的）+-ly（副词后缀）", "d": "1. adv. 快速地；迅速地（11）", "e": "Those who jumped without a job haven&#x27;t always landed in top positions <mark>quickly</mark>."}, {"id": 473, "u": 5, "w": "relationship", "f": 11, "m": "relation（关系、联系）+ship（身份或关系状态）", "d": "1. n. 关系；联系（11）", "e": "Together, they make up the reading component of your overall literacy, or <mark>relationship</mark> to your surrounding textual environment."}, {"id": 474, "u": 5, "w": "reputation", "f": 11, "m": "reput（考虑；评价）+-ation（名词后缀）", "d": "1. n. 名誉；声望（11）", "e": "A turbulent business environment also has senior managers cautious of letting vague pronouncements cloud their <mark>reputations</mark>."}, {"id": 475, "u": 5, "w": "scale", "f": 11, "m": "scal（逐级升高）+e（词形结尾）", "d": "1. n. 规模；程度（7）；2. n. 量表；等级尺度（2）；3. v. （scale back）缩减（2）", "e": "Issues arise, however, when developers attempt to create large-<mark>scale</mark> short-term rental facilities-de facto hotels-to bypass taxes and regulations."}, {"id": 476, "u": 5, "w": "secure", "f": 11, "m": "se-（没有、离开）+cur（操心、关切）+e（词形结尾）", "d": "1. v. 确保、使稳固（6）；2. v. 获得、取得（3）；3. adj. 安全的；无危险的（1）；4. adj. 稳定可靠的、有保障的（1）", "e": "[ C ] <mark>secure</mark>"}, {"id": 477, "u": 5, "w": "severe", "f": 11, "m": "", "d": "1. adj. 严重的；剧烈的（8）；2. adj. 严厉的；严苛的（3）", "e": "The fact that fires happened so often meant they couldn&#x27;t have been <mark>severe</mark> enough to kill most trees."}, {"id": 478, "u": 5, "w": "solution", "f": 11, "m": "solut（松开、解决）+-ion（行为、方法或结果）", "d": "1. n. 解决办法（11）", "e": "(50) They pool resources, collaborate, think outside the box, and find <mark>solutions</mark> and ways around obstacles to explore science for the sake of science without the traditional boundaries of working inside a formal setting."}, {"id": 479, "u": 5, "w": "spread", "f": 11, "m": "", "d": "1. v. 传播；扩散（8）；2. n. 传播；扩散（2）；3. v. 撒播；撒布（1）", "e": "The idea is intuitively compelling, but it doesn&#x27;t explain how ideas actually <mark>spread</mark>."}, {"id": 480, "u": 5, "w": "suppose", "f": 11, "m": "sup-（在下面）+pos（放置）+e（拼写结尾）", "d": "1. v. 认为；推测（7）；2. v. 所谓的；被认为的（2）；3. v. 假设；设想（1）；4. v. 应当；按要求或职责应该（besupposed to）（1）", "e": "At the beginning of the century songbirds were <mark>supposed</mark> to be disappearing."}, {"id": 481, "u": 5, "w": "teaching", "f": 11, "m": "teach（教；教授）+-ing（活动；过程）", "d": "1. n. 教学；教书（10）；2. n. 教义；学说（1）", "e": "The English language <mark>teaching</mark> sector directly earns nearly £1.3 billion for the UK in invisible exports and our other education related exports earn up to £10 billion a year more."}, {"id": 482, "u": 5, "w": "thinking", "f": 11, "m": "think（思考）+-ing（动作名词或分词后缀）", "d": "1. n. 思考；思想；思维（8）；2. v. 思考；思想；思维（3）", "e": "Zoos are tools for <mark>thinking</mark>."}, {"id": 483, "u": 5, "w": "train", "f": 11, "m": "", "d": "1. n. 火车（8）；2. v. 训练；培训（3）", "e": "How can the <mark>train</mark> operators possibly justify yet another increase to rail passenger fares?"}, {"id": 484, "u": 5, "w": "unique", "f": 11, "m": "uni-（一、单一）+que（本词形容词结尾）", "d": "1. adj. 独特的、独一无二的（10）；2. adj. 不重复的、各不相同的（1）", "e": "Each set of circumstances, however bad, offers a <mark>unique</mark> opportunity for growth."}, {"id": 485, "u": 5, "w": "used", "f": 11, "m": "use（使用、习惯）+d（已经形成的状态或过去形式）", "d": "1. adj. 过去常常；曾经（used to）（10）；2. adj. 习惯于（be/get used to）（1）", "e": "The rough guide to marketing success <mark>used</mark> to be that you got what you paid for."}, {"id": 486, "u": 5, "w": "wholesale", "f": 11, "m": "whole（整个、全部）+sale（销售）", "d": "1. adj. 批发；批发的（11）", "e": "Retailers that master the intricacies of <mark>wholesaling</mark> in Europe may well expect to rake in substantial profits thereby."}, {"id": 487, "u": 5, "w": "academic", "f": 10, "m": "academ-（学院；学术机构）+-ic（形容词后缀）", "d": "1. adj. 学术的；学业的（9）；2. n. 大学教师；学者（1）", "e": "Anyone can be a citizen scientist, regardless of age, nationality or <mark>academic</mark> experience."}, {"id": 488, "u": 5, "w": "appeal", "f": 10, "m": "", "d": "1. v. 吸引、吸引力（4）；2. n. 上诉（3）；3. n. 吸引、吸引力（3）", "e": "Lower-income jobs like gardening or day care don&#x27;t <mark>appeal</mark> to robots."}, {"id": 489, "u": 5, "w": "assess", "f": 10, "m": "as-（向、在旁）+sess（坐）", "d": "1. v. 评估；评价（10）", "e": "Insurance companies, meanwhile, can base their premiums on AI models that more accurately <mark>assess</mark> risk."}, {"id": 490, "u": 5, "w": "automation", "f": 10, "m": "automat（automate去e，使自动化）+-ion（名词后缀）", "d": "1. n. 自动化（10）", "e": "Who will be most threatened by <mark>automation</mark>?"}, {"id": 491, "u": 5, "w": "available", "f": 10, "m": "avail（效用、利益）+able（能够……的）", "d": "1. adj. 可获得的；可供使用的（10）", "e": "The problem is not necessarily the amount of <mark>available</mark> funding."}, {"id": 492, "u": 5, "w": "background", "f": 10, "m": "back（后面）+ground（地面、基础）", "d": "1. n. 出身、经历背景（5）；2. n. 背景（5）", "e": "Passengers who pass a <mark>background</mark> check are eligible to use expedited screening lanes."}, {"id": 493, "u": 5, "w": "break", "f": 10, "m": "", "d": "1. v. 打破；破坏（3）；2. v. 分裂；拆散（break up）（2）；3. n. 缺口；断口（1）；4. v. 分解（breakdown）（1）；5. v. 断绝关系；分开（1）；6. v. 破解；找到答案（1）；7. v. 违反；违背（1）", "e": "Sometimes I feel in his late works a will to <mark>break</mark> all signs of continuity."}, {"id": 494, "u": 5, "w": "campaign", "f": 10, "m": "camp（原野）+aign（词形结尾）", "d": "1. n. 运动、宣传活动（5）；2. n. 竞选活动（4）；3. v. 发起运动、争取（1）", "e": "&quot;Dare to be different, please don&#x27;t smoke!&quot; pleads one billboard <mark>campaign</mark> aimed at reducing smoking among teenagers-teenagers, who desire nothing more than fitting in."}, {"id": 495, "u": 5, "w": "code", "f": 10, "m": "", "d": "1. n. 规范；法则（6）；2. n. 密码（4）", "e": "Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax <mark>code</mark> and quicker disclosure of stock acquisitions."}, {"id": 496, "u": 5, "w": "commercial", "f": 10, "m": "com-（共同、相互）+merc（商品、贸易）+-ial（与此有关的，整词也可作名词）", "d": "1. adj. 商业的、营利性的（9）；2. n. 商业广告（尤指电视或广播广告）（1）", "e": "First, most people do not realise that there are strong <mark>commercial</mark> agendas at work to keep them in passive consumption mode."}, {"id": 497, "u": 5, "w": "communication", "f": 10, "m": "communicate（传达、交流）+ion（活动、手段或系统的名词后缀）", "d": "1. n. 传播（5）；2. n. 沟通；交流（4）；3. n. 宣传；公关（1）", "e": "An emerging body of research shows that positive health habits-as well as negative ones-spread through networks of friends via social <mark>communication</mark>."}, {"id": 498, "u": 5, "w": "complete", "f": 10, "m": "com-（完全）+plet-（填满）+e（词尾字母）", "d": "1. v. 完成（8）；2. adj. 连同；配有（complete with）（1）；3. adj. 完全的；彻底的（1）", "e": "&quot;We reason together, challenge, revise, and <mark>complete</mark> each other&#x27;s reasoning and each other&#x27;s conceptions of reason.&quot;"}, {"id": 499, "u": 5, "w": "connect", "f": 10, "m": "con-（共同；一起）+nect（连接）", "d": "1. v. 连接；联系（8）；2. v. 人脉广的（1）；3. v. 有亲近感的（1）", "e": "Our research provides strong support for the value of zoos in <mark>connecting</mark> people with animals and with nature."}, {"id": 500, "u": 5, "w": "consciousness", "f": 10, "m": "conscious（有意识的、清醒的）+-ness（状态）", "d": "1. n. 意识；知觉（8）；2. n. 民族意识；群体认同（1）；3. n. 自我意识；自我关注（self-consciousness）（1）", "e": "And what&#x27;s so great about <mark>consciousness</mark>, anyway?"}, {"id": 501, "u": 6, "w": "construction", "f": 10, "m": "con-（共同、一起）+struct-（建造）+-ion（过程、结果的名词后缀）", "d": "1. n. 建造；建筑工程（8）；2. n. 人造构造物（1）；3. n. （句子的）结构（1）", "e": "Protests have erupted over <mark>construction</mark> of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#x27;s view of the cosmos."}, {"id": 502, "u": 6, "w": "corporate", "f": 10, "m": "corpor-（身体、实体）+-ate（具有这种性质的）", "d": "1. adj. 公司的；企业的（10）", "e": "That is exactly what happened when Norway adopted a nationwide <mark>corporate</mark> gender quota."}, {"id": 503, "u": 6, "w": "creation", "f": 10, "m": "creat（create去e，创造）+ion（过程、结果）", "d": "1. n. 创造；创立（9）；2. n. 创造物；作品（1）", "e": "Hill&#x27;s pressure later led to the <mark>creation</mark> of national parks and green belts."}, {"id": 504, "u": 6, "w": "deny", "f": 10, "m": "", "d": "1. v. 否认（6）；2. v. 拒绝给予（4）", "e": "[ B ] <mark>denied</mark>"}, {"id": 505, "u": 6, "w": "enjoy", "f": 10, "m": "en-（使进入、处于）+joy（欢乐、乐趣）", "d": "1. v. 享有（7）；2. v. 享受（3）", "e": "Is there any chance that Cardus&#x27;s criticism will <mark>enjoy</mark> a revival?"}, {"id": 506, "u": 6, "w": "establish", "f": 10, "m": "e-（施加作用）+stabl（稳定、固定）+-ish（使成为的动词结尾）", "d": "1. v. 建立；确立（9）；2. v. 查明；确定（1）", "e": "<mark>Established</mark> in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani."}, {"id": 507, "u": 6, "w": "exercise", "f": 10, "m": "", "d": "1. n. 锻炼（7）；2. n. 为某目的开展的活动；试验任务（1）；3. n. 练习；训练项目（1）；4. v. 锻炼（1）", "e": "No matter how you &quot;enhance&quot; enclosures, they do not allow for freedom, a natural diet or adequate <mark>exercise</mark>."}, {"id": 508, "u": 6, "w": "existing", "f": 10, "m": "exist（存在）+-ing（处于这种状态的）", "d": "1. adj. 现有的（10）", "e": "Arizona had attempted to fashion state policies that ran parallel to the <mark>existing</mark> federal ones."}, {"id": 509, "u": 6, "w": "expression", "f": 10, "m": "express（向外表现）+ion（名词后缀）", "d": "1. n. 表达；表述（7）；2. n. 表情；神情（2）；3. n. 体现；表现形式（1）", "e": "Hence it is metaphysical; but the means of <mark>expression</mark> is purely and exclusively physical: sound."}, {"id": 510, "u": 6, "w": "fair", "f": 10, "m": "", "d": "1. adj. 公平的；公正的（9）；2. adj. 合理的；适当的（1）", "e": "Employers must both show cause and act in a procedurally <mark>fair</mark> way."}, {"id": 511, "u": 6, "w": "generally", "f": 10, "m": "general（一般的、普遍的）+-ly（在这种情况下）", "d": "1. adv. 一般地；通常（10）", "e": "The goals identified in the report are <mark>generally</mark> admirable."}, {"id": 512, "u": 6, "w": "gift", "f": 10, "m": "", "d": "1. n. 礼物；馈赠（9）；2. n. 天赋；才能（1）", "e": "It is wise to take such <mark>gifts</mark> with gratitude and grace."}, {"id": 513, "u": 6, "w": "inspire", "f": 10, "m": "in-（进入）+spire（呼吸、精神）", "d": "1. v. 激励；启发（9）；2. v. 激起（希望）（1）", "e": "It <mark>inspired</mark> me to learn more about the culture that it represented."}, {"id": 514, "u": 6, "w": "instance", "f": 10, "m": "in（在其中）+st（站立）+-ance（名词结尾）", "d": "1. n. （for instance）例如（7）；2. n. 情形；实例（3）", "e": "Members of social networks, for <mark>instance</mark>, are learning that they can hijack media to apply pressure on the businesses that originally created them."}, {"id": 515, "u": 6, "w": "learning", "f": 10, "m": "learn（学习）+ing（活动、过程及其所得的名词形式）", "d": "1. n. 学习（8）；2. n. 学识；所学知识（2）", "e": "In such a case, the company&#x27;s response may not be sufficiently quick or thoughtful, and the <mark>learning</mark> curve has been steep."}, {"id": 516, "u": 6, "w": "majority", "f": 10, "m": "major（较大的；成年人）+-ity（相应整体或状态）", "d": "1. n. 大多数；多数（10）", "e": "Specifically, a 5-4 <mark>majority</mark> decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous surface connection&quot; to bodies of water."}, {"id": 517, "u": 6, "w": "marketer", "f": 10, "m": "market（销售、开展市场业务）+-er（从事相应活动的人或机构）", "d": "1. n. 营销人员；营销商（10）", "e": "Paid and owned media are controlled by <mark>marketers</mark> promoting their own products."}, {"id": 518, "u": 6, "w": "mass", "f": 10, "m": "", "d": "1. adj. 大量；大规模的（5）；2. adj. 大众的；面向大众的（3）；3. n. 质量；体重（2）", "e": "&quot;<mark>Mass</mark>-produced clothing, like fast food, fills a hunger and need, yet is non-durable and wasteful,&quot; Cline argues."}, {"id": 519, "u": 6, "w": "negative", "f": 10, "m": "neg（不、否定）+-ative（形容词结尾，也可构成名词）", "d": "1. adj. 负面的、消极的（8）；2. adj. 否定的、阴性的（1）；3. adj. 负碳排放的（吸收多于排放）（1）", "e": "An emerging body of research shows that positive health habits-as well as <mark>negative</mark> ones-spread through networks of friends via social communication."}, {"id": 520, "u": 6, "w": "office", "f": 10, "m": "", "d": "1. n. 办公室；工作场所（8）；2. n. 办事机构；部门（1）；3. n. 律师事务所（1）", "e": "The sensible place to build new houses, factories and <mark>offices</mark> is where people are, in cities and towns where infrastructure is in place."}, {"id": 521, "u": 6, "w": "original", "f": 10, "m": "origin（起源、最初出现的地方）+al（有关的；也可指原来的对象）", "d": "1. adj. 最初的；原来的（8）；2. adj. 原件；原始的；未经修改的（2）", "e": "What was the <mark>original</mark> purpose of grade forgiveness?"}, {"id": 522, "u": 6, "w": "passenger", "f": 10, "m": "passage（通行；旅程）+-er（人；词中插入n）", "d": "1. n. 乘客（10）", "e": "<mark>Passengers</mark> who pass a background check are eligible to use expedited screening lanes."}, {"id": 523, "u": 6, "w": "pick", "f": 10, "m": "", "d": "1. v. 拿起、拾取（含 pick up）（3）；2. v. 挑选、选定（3）；3. v. 增强、加快（pick up）（2）；4. v. 好转、恢复（pick up）（1）；5. v. 采摘、摘取（1）", "e": "[ C ] <mark>pick</mark>"}, {"id": 524, "u": 6, "w": "piracy", "f": 10, "m": "pirac-（海盗活动的历史词干）+-y（名词词尾）", "d": "1. n. 盗版；非法复制传播（10）", "e": "Initially the rise of legitimate online businesses such as Netflix actually helped curb digital <mark>piracy</mark>, which had largely been based on file uploads."}, {"id": 525, "u": 6, "w": "predict", "f": 10, "m": "pre-（预先）+dict（说、宣告）", "d": "1. v. 预测、预言（10）", "e": "The sharp hit to growth <mark>predicted</mark> around the world and in the UK could lead to a decline in the everyday services we depend on for our well-being and for growth."}, {"id": 526, "u": 6, "w": "preservation", "f": 10, "m": "preserve（去掉末尾e，保存、保护）+-ation（行为或状态）", "d": "1. n. 保存；保护（10）", "e": "Despite success stories like van Oosten&#x27;s, <mark>preservation</mark> of plastics will likely get harder."}, {"id": 527, "u": 6, "w": "promise", "f": 10, "m": "pro-（提前、向前）+mise（发送、放出）", "d": "1. n. 诺言（4）；2. v. 承诺（4）；3. v. 显示有望、预示（2）", "e": "But that <mark>promise</mark> has been found wanting."}, {"id": 528, "u": 6, "w": "relate", "f": 10, "m": "re-（带回）+lat（携带、承载）+e（词形结尾）", "d": "1. v. 与……有关；涉及（8）；2. v. 有血缘关系（2）", "e": "But another, <mark>related</mark> force - a policy often buried deep in course catalogs called &quot;grade forgiveness&quot; - is helping raise GPAs."}, {"id": 529, "u": 6, "w": "relevant", "f": 10, "m": "re-（加强）+lev（提起）+-ant（具有这种性质的）", "d": "1. adj. 相关的；适用的（10）", "e": "Why did Waterstones shops retire PRH books to their <mark>relevant</mark> sections?"}, {"id": 530, "u": 6, "w": "replace", "f": 10, "m": "re-（重新）+place（放置、位置）", "d": "1. v. 替换；取代（10）", "e": "Here are a few ways AI is aiding companies without <mark>replacing</mark> employees:"}, {"id": 531, "u": 6, "w": "restore", "f": 10, "m": "re-（重新、回到原处）+store（建立、储备）", "d": "1. v. 恢复；修复（10）", "e": "(47) Our mental health doesn&#x27;t really go anywhere; like the sun behind a cloud, it can be temporarily hidden from view, but it is fully capable of being <mark>restored</mark> in an instant."}, {"id": 532, "u": 6, "w": "room", "f": 10, "m": "", "d": "1. n. 房间（5）；2. n. 余地、空间（4）；3. n. 空间、地方（1）", "e": "It can catch someone&#x27;s attention in a crowded <mark>room</mark>, &quot;Eye contact and smile&quot; can signal availability and confidence, a common-sense notion supported in studies by psychologist Monica Moore."}, {"id": 533, "u": 6, "w": "rural", "f": 10, "m": "rur-（乡野）+al（有关的）", "d": "1. adj. 乡村的，农村的（10）", "e": "Why ruin <mark>rural</mark> ones?"}, {"id": 534, "u": 6, "w": "secret", "f": 10, "m": "se-（分开）+cret（区分、分出）", "d": "1. adj. 秘密的（5）；2. n. 秘密（5）", "e": "Last year, the Transportation Security Administration (TSA) found in a <mark>secret</mark> check that undercover investigators were able to sneak weapons - both fake and real - past airport security nearly every time they tried."}, {"id": 535, "u": 6, "w": "separate", "f": 10, "m": "se-（分开）+par-（安排、准备）+-ate（作出动作或具有相应性质的）", "d": "1. v. (使)分开（4）；2. adj. 分开的（3）；3. v. 区分；辨别（3）", "e": "They are noting that the Victorians suddenly seem to become more human as the hundred-or-so years that <mark>separate</mark> us fade away through our common experience of laughter."}, {"id": 536, "u": 6, "w": "stick", "f": 10, "m": "", "d": "1. v. 坚持；忠于（6）；2. n. 紧贴、局限于（1）；3. v. 卡住；困住（1）；4. v. 团结在一起（stick together）（1）；5. v. 突出、伸出（stick out）（1）", "e": "Human nature being what it is, most people <mark>stick</mark> with default settings."}, {"id": 537, "u": 6, "w": "struggle", "f": 10, "m": "", "d": "1. n. 斗争；对抗（5）；2. v. 艰难应对；苦苦挣扎（3）；3. v. 努力；奋力争取（2）", "e": "A long <mark>struggle</mark> will be needed to avoid a future of digital feudalism."}, {"id": 538, "u": 6, "w": "thus", "f": 10, "m": "", "d": "1. adv. 因此；从而（10）", "e": "The widespread availability of such recordings has <mark>thus</mark> brought about a crisis in the institution of the traditional classical concert."}, {"id": 539, "u": 6, "w": "undergraduate", "f": 10, "m": "under-（尚未达到）+graduate（大学毕业生）", "d": "1. n. 本科生、本科的（10）", "e": "One idea is to allow people to study law as an <mark>undergraduate</mark> degree."}, {"id": 540, "u": 6, "w": "western", "f": 10, "m": "west（西、西方）+-ern（方向、地区属性的形容词结尾）", "d": "1. adj. 西方的（9）；2. adj. 西欧的（1）", "e": "World War II was the watershed event for higher education in modern <mark>Western</mark> societies."}, {"id": 541, "u": 6, "w": "advance", "f": 9, "m": "ad-（向）+vance（向前、前进）", "d": "1. n. 进步；发展／促进发展（4）；2. v. 前进；发展；促进发展（2）；3. n. 提前；预先（in advance）（1）；4. n. 预付款（作者预付稿酬）（1）；5. v. 提出（观点或建议）（1）", "e": "<mark>Advances</mark> in artificial intelligence (AI) are rapidly changing every aspect of human life."}, {"id": 542, "u": 6, "w": "advocate", "f": 9, "m": "ad-（朝向）+voc（发声）+-ate（人或动作词形）", "d": "1. n. 倡导者；支持者（6）；2. v. 提倡；主张；支持（3）", "e": "She exhibits the idealism common to many <mark>advocates</mark> of sustainability, be it in food or in energy."}, {"id": 543, "u": 6, "w": "assume", "f": 9, "m": "as-（向自己这边）+sume（拿取）", "d": "1. v. 假设；认为（6）；2. v. 承担；担任（2）；3. v. 呈现；采取（形式）（1）", "e": "You might even be tempted to <mark>assume</mark> that humanity has little future to look forward to."}, {"id": 544, "u": 6, "w": "audience", "f": 9, "m": "audi（听）+-ence（相关人群或事情的名词结尾）", "d": "1. n. 观众；听众；受众（9）", "e": "Who are your most important <mark>audiences</mark>?"}, {"id": 545, "u": 6, "w": "boost", "f": 9, "m": "", "d": "1. v. 促进；提升（8）；2. n. 促进；提升（1）", "e": "Likewise, automation should eventually <mark>boost</mark> productivity, stimulate demand by driving down prices, and free workers from hard, boring work."}, {"id": 546, "u": 6, "w": "carbon", "f": 9, "m": "", "d": "1. n. 碳（9）", "e": "Thanks to his invention, we have a real chance to decrease the world&#x27;s <mark>carbon</mark> emissions."}, {"id": 547, "u": 6, "w": "catch", "f": 9, "m": "", "d": "1. v. 吸引注意力（2）；2. v. 抓住、捕获（2）；3. v. 赶上；追上（2）；4. n. 发现、抓个正着（1）；5. v. 发现、抓个正着（1）；6. v. 捕捉影像（1）", "e": "It can <mark>catch</mark> someone&#x27;s attention in a crowded room, &quot;Eye contact and smile&quot; can signal availability and confidence, a common-sense notion supported in studies by psychologist Monica Moore."}, {"id": 548, "u": 6, "w": "collection", "f": 9, "m": "collect（收集）+-ion（表示行为或结果的名词后缀）", "d": "1. n. 收藏；收集；收藏品（7）；2. n. 一批；一组（1）；3. n. 文集、作品集（1）", "e": "What was more, many original French dispatches had been pre "The target group was given a 30-minute <mark>drama</mark>-based activity to accompany the passage."}, {"id": 558, "u": 6, "w": "effectively", "f": 9, "m": "effective（有效的、能实际起作用的）+-ly（以这种方式）", "d": "1. adv. 有效地；生效地（7）；2. adv. 实际上；事实上（2）", "e": "Science education today revolves around the idea of scientific literacy - the base-level knowledge about science that nonscientists require to <mark>effectively</mark> get on in the world."}, {"id": 559, "u": 6, "w": "emerge", "f": 9, "m": "e-（出）+merg（沉没）+e（拼写结尾）", "d": "1. v. 出现、兴起（9）", "e": "Located in the southern Peloponnesian peninsula, Pavlopetri (the modern name of the site) <mark>emerged</mark> as a Neolithic settlement around 3500 B.C. and became an important trading center for Mycenaean Greece (1650-1180 B.C.)."}, {"id": 560, "u": 6, "w": "emotional", "f": 9, "m": "emotion（情绪、感情）+-al（与……有关的、具有……特点的）", "d": "1. adj. 情绪的；情感的（9）", "e": "What can promote children&#x27;s <mark>emotional</mark> literacy according to O&#x27;Hanlon?"}, {"id": 561, "u": 6, "w": "employer", "f": 9, "m": "employ（雇用）+-er（实施动作的人或机构）", "d": "1. n. 雇主（9）", "e": "<mark>Employers</mark> must both show cause and act in a procedurally fair way."}, {"id": 562, "u": 6, "w": "engage", "f": 9, "m": "", "d": "1. v. 参与；使参与（4）；2. v. 与……互动（1）；3. v. 接触；吸引顾客参与（1）；4. v. 涉及；探讨（1）；5. v. 聘用（1）；6. v. 被调动；开始活动（1）", "e": "(47) But by utilising the natural curiosity of the general public it is possible to overcome many of these challenges by <mark>engaging</mark> non-scientists directly in the research process."}, {"id": 563, "u": 6, "w": "eventually", "f": 9, "m": "event（结果）+ual（相关的）+ly（副词后缀）", "d": "1. adv. 最终；终于（9）", "e": "There will <mark>eventually</mark> come a day when The New York Times ceases to publish stories on newsprint."}, {"id": 564, "u": 6, "w": "except", "f": 9, "m": "ex-（向外）+cept（拿取）", "d": "1. prep. 除...之外（8）；2. v. 把……除外；不包括（1）", "e": "A deal is a deal-<mark>except</mark>, apparently, when Entergy is involved."}, {"id": 565, "u": 6, "w": "explanation", "f": 9, "m": "explan-（explain的词干变体，解释）+-ation（行为或结果）", "d": "1. n. 解释；说明（9）", "e": "One <mark>explanation</mark> might be the loss of dignity displayed through a cheesy grin."}, {"id": 566, "u": 6, "w": "extend", "f": 9, "m": "ex-（向外）+tend（伸展、延伸）", "d": "1. v. 扩大；扩展（范围、影响等）（8）；2. v. 表达；致以（欢迎）（1）", "e": "Will those jurisdictions <mark>extend</mark> the same protections now denied under Sackett v. EPA?"}, {"id": 567, "u": 6, "w": "fiction", "f": 9, "m": "fict（编造）+-ion（内容；结果）", "d": "1. n. 小说；虚构文学（8）；2. n. 虚构；捏造的内容（1）", "e": "She draws on letters, diaries and <mark>fiction</mark>, and a 1939 field notebook of verbatim audience research by Winifred Gill."}, {"id": 568, "u": 6, "w": "frequently", "f": 9, "m": "frequent（频繁的、经常发生的）+-ly（以这种频率）", "d": "1. adv. 经常地（9）", "e": "Second, novelty itself <mark>frequently</mark> provokes disbelief."}, {"id": 569, "u": 6, "w": "gender", "f": 9, "m": "gen（种类、类别）+der（名词词形结尾）", "d": "1. n. 性别（社会文化意义上的）（9）", "e": "That is exactly what happened when Norway adopted a nationwide corporate <mark>gender</mark> quota."}, {"id": 570, "u": 6, "w": "ground", "f": 9, "m": "", "d": "1. adv. 地面；土地（6）；2. n. 理由；依据（2）；3. n. 立场（middleground折中立场）（1）", "e": "The interdependence of the forest and its constituent tree species, <mark>ground</mark> flora, and fauna is taken for granted."}, {"id": 571, "u": 6, "w": "highly", "f": 9, "m": "high（高、程度高）+-ly（副词后缀）", "d": "1. adv. 非常、高度地（9）", "e": "But these provisions create difficulties for businesses when applied to <mark>highly</mark> paid managers and executives."}, {"id": 572, "u": 6, "w": "humanities", "f": 9, "m": "humanity（人文学问，y变i）+-es（复数后缀）", "d": "1. n. 人文学科（9）", "e": "Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the <mark>humanities</mark> and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda."}, {"id": 573, "u": 6, "w": "impose", "f": 9, "m": "im-（在……上）+pose（放置）", "d": "1. v. 强加；施加；实行（7）；2. v. 征收（税）（2）", "e": "Financial regulators in Britain have <mark>imposed</mark> a rather unusual rule on the bosses of big banks."}, {"id": 574, "u": 6, "w": "intellectual", "f": 9, "m": "intel-（在……之间）+lect（选择、辨读）+-ual（形容词后缀，也可指人）", "d": "1. adj. 智力的；知识的（8）；2. adj. 知识产权的（intellectualproperty）（1）", "e": "Once a discovery claim becomes public, the discoverer receives <mark>intellectual</mark> credit."}, {"id": 575, "u": 6, "w": "invite", "f": 9, "m": "", "d": "1. v. 邀请（5）；2. v. 引导；吸引（2）；3. v. 招致（2）", "e": "I was really excited to hear that you&#x27;d <mark>invite</mark> some young craftsmen to demonstrate their innovative craft-making on campus."}, {"id": 576, "u": 6, "w": "join", "f": 9, "m": "", "d": "1. v. 加入, 参加（7）；2. v. 赞同；支持（2）", "e": "He agreed to <mark>join</mark> because he &quot;found the foresight behind the establishment of the SBoRE to be novel, unique and likely to have a lasting impact."}, {"id": 577, "u": 6, "w": "judge", "f": 9, "m": "jud（法律、公正）+ge（词形结尾）", "d": "1. n. 法官（8）；2. n. 评委；裁判（1）", "e": "It is hard, the state argues, for <mark>judges</mark> to assess the implications of new and rapidly changing technologies."}, {"id": 578, "u": 6, "w": "leading", "f": 9, "m": "lead（领导、领先）+-ing（处于相应作用或状态的）", "d": "1. adj. 主要的；领先的；杰出的（9）", "e": "DeepMind is one of the <mark>leading</mark> artificial intelligence (AI) companies in the world."}, {"id": 579, "u": 6, "w": "locate", "f": 9, "m": "loc（地点、位置）+-ate（动词后缀）", "d": "1. v. 找到；确定…的位置（6）；2. v. 位于；坐落于（3）", "e": "Free-ranging elephants presumably also use this information to <mark>locate</mark> their preferred food."}, {"id": 580, "u": 6, "w": "miss", "f": 9, "m": "", "d": "1. v. 未理解、忽视（5）；2. v. 想念、怀念（2）；3. v. 错过、遗漏（2）", "e": "That <mark>misses</mark> the way the surveillance economy works."}, {"id": 581, "u": 6, "w": "muscle", "f": 9, "m": "musc（肌肉）+le（名词词形结尾）", "d": "1. n. 肌肉（9）", "e": "__6__ , instead of straining <mark>muscles</mark> to build them, as exercise does, laughter apparently accomplishes the __7__ ."}, {"id": 582, "u": 6, eing."}, {"id": 598, "u": 6, "w": "prompt", "f": 9, "m": "pro-（向前、向外）+empt（拿取，省去开头e）", "d": "1. n. （人工智能输入的）提示词（5）；2. v. 促使；引起（4）", "e": "His distinctive style is now one of the most commonly used <mark>prompts</mark> in the new open-source AI art generator Stable Diffusion."}, {"id": 599, "u": 6, "w": "provision", "f": 9, "m": "pro-（在前、预先）+vis（看）+ion（行为或结果）", "d": "1. n. 条款；规定（8）；2. n. 预先安排；准备（1）", "e": "But these <mark>provisions</mark> create difficulties for businesses when applied to highly paid managers and executives."}, {"id": 600, "u": 6, "w": "purchase", "f": 9, "m": "", "d": "1. n. 购买行为（5）；2. n. 购买的物品（2）；3. v. 购买（2）", "e": "The decisions made it more difficult for states to collect sales tax on certain online <mark>purchases</mark>."}, {"id": 601, "u": 7, "w": "realize", "f": 9, "m": "real（真实、现实）+-ize（使成为、使进入相应状态）", "d": "1. v. 意识到；明白（6）；2. v. 意识到，认识到（3）", "e": "What was more, many original French dispatches had been preserved in this collection, which I <mark>realized</mark> was priceless."}, {"id": 602, "u": 7, "w": "strike", "f": 9, "m": "", "d": "1. n. 罢工（5）；2. v. 使突然想到；给人印象（2）；3. v. 使产生（恐惧）（1）；4. v. 击打；撞击（1）", "e": "The responsibility for the latest wave of <mark>strikes</mark> rests on the unions."}, {"id": 603, "u": 7, "w": "supply", "f": 9, "m": "sup-（补上）+ply（填满）supple（柔软的，去le）+-ly（副词后缀，构成独立同形词）", "d": "1. n. 供应、提供（4）；2. n. 供应物资、储备（2）；3. v. 供应、提供（2）；4. v. 满足（1）", "e": "&quot;We are at a crisis level on the <mark>supply</mark> of rental housing,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast."}, {"id": 604, "u": 7, "w": "television", "f": 9, "m": "tele-（远距离）+vis（看）+-ion（相应过程或内容的名词形式）", "d": "1. n. 电视（9）", "e": "<mark>Television</mark> is a one-way tap flowing into our homes."}, {"id": 605, "u": 7, "w": "title", "f": 9, "m": "tit（标题、题签、头衔）+le（词形结尾）", "d": "1. n. 称号、头衔（5）；2. n. 书籍（1）；3. n. 影视作品（1）；4. n. 期刊（1）；5. v. 给……命名、题为（1）", "e": "It is also wise to recall that such <mark>titles</mark> are no ress has always envisioned joint federal-state immigration enforcement and explicitly encourages state <mark>officers</mark> to share information and cooperate with federal colleagues."}, {"id": 655, "u": 7, "w": "operation", "f": 8, "m": "operat-（operate去e，操作；运作）+-ion（名词后缀）", "d": "1. n. 运营；业务活动（6）；2. n. 手术（1）；3. n. 经营企业（1）", "e": "Scientific publishers routinely report profit margins approaching 40% on their <mark>operations</mark> at a time when the rest of the publishing industry is in an existential crisis."}, {"id": 656, "u": 7, "w": "ordinary", "f": 8, "m": "ordin（次序、规则）+-ary（符合或具有这种性质的）", "d": "1. adj. 普通的；平常的（8）", "e": "Between preserving the jobs of <mark>ordinary</mark> workers or losing them."}, {"id": 657, "u": 7, "w": "origin", "f": 8, "m": "ori（升起、起源）+gin（产生、出生）", "d": "1. n. 起源；来源（8）", "e": "What intrinsic factors make the West a suitable home for these artifacts but preclude them from being preserved and displayed by their countries of <mark>origin</mark>?"}, {"id": 658, "u": 7, "w": "party", "f": 8, "m": "part（部分、一方）+y（本词的词形结尾）", "d": "1. n. 一方、当事方（4）；2. n. 政党（2）；3. n. 群体、圈子（read out of theparty：排斥出去）（1）；4. v. 参加聚会、纵情玩乐（1）", "e": "These rules say they must value some assets at the price a third <mark>party</mark> would pay, not the price managers and regulators would like them to fetch."}, {"id": 659, "u": 7, "w": "patient", "f": 8, "m": "pati-（承受、忍受）+ent（处在这种状态的人或性质）", "d": "1. n. 病人（8）", "e": "There are lessons about informed <mark>patient</mark> consent to learn."}, {"id": 660, "u": 7, "w": "peak", "f": 8, "m": "", "d": "1. n. 顶峰；高峰（6）；2. v. 达到顶峰（1）；3. n. 山峰（1）", "e": "But 2022 was the <mark>peak</mark> of <mark>peak</mark> TV."}, {"id": 661, "u": 7, "w": "popularity", "f": 8, "m": "popular（受欢迎的、流行的）+-ity（性质或状态）", "d": "1. n. 受欢迎程度、流行（8）", "e": "The theory also seems to explain the sudden and unexpected <mark>popularity</mark> of certain looks, brands, or neighborhoods."}, {"id": 662, "u": 7, "w": "precisely", "f": 8, "m": "precise（精确的、准确的）+-ly（
