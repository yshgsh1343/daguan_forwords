he shoes of a literary character and express that character&#x27;s <mark>emotion</mark>&quot;."}, {"id": 719, "u": 8, "w": "emphasize", "f": 7, "m": "emphasis（强调，去词尾-is）+-ize（动词后缀）", "d": "1. v. 强调；着重（7）", "e": "What does Hom <mark>emphasize</mark> in Paragraph 5?"}, {"id": 720, "u": 8, "w": "employment", "f": 7, "m": "employ（雇用、使用）+-ment（行为、状态或相应事务）", "d": "1. n. 就业（7）", "e": "Society also suffers from excessive <mark>employment</mark> protections."}, {"id": 721, "u": 8, "w": "entrepreneur", "f": 7, "m": "", "d": "1. n. 企业家（7）", "e": "In previous eras of drastic technological change, <mark>entrepreneurs</mark> smoothed the transition by dreaming up ways to combine labor and machines."}, {"id": 722, "u": 8, "w": "epidemic", "f": 7, "m": "epi-（在……之上、遍及）+dem（人民）+-ic（形容词后缀）", "d": "1. n. 大规模流行的现象（6）；2. n. 流行病；疫情（1）", "e": "Yet it is precisely these non-celebrity influentials who, according to the two-step-flow theory, are supposed to drive social <mark>epidemics</mark>, by influencing their friends and colleagues directly."}, {"id": 723, "u": 8, "w": "evaluate", "f": 7, "m": "e-（向外）+valu（价值）+-ate（动词后缀）", "d": "1. v. 评估；评价（7）", "e": "In all, the study concludes that whereas prosecutors should only <mark>evaluate</mark> a case based on its merits, they do seem to be influenced by a company&#x27;s record in CSR."}, {"id": 724, "u": 8, "w": "evolution", "f": 7, "m": "e-（向外）+volut（转开）+-ion（名词后缀）", "d": "1. n. 生物进化（4）；2. n. 演变；发展；演进（3）", "e": "Newton&#x27;s laws of motion and Darwinian <mark>evolution</mark> each bind a host of different phenomena into a single explicatory framework."}, {"id": 725, "u": 8, "w": "evolutionary", "f": 7, "m": "evolution（进化、演化、逐步演变）+ary（有关的）", "d": "1. adj. 进化的；演化的（7）", "e": "&quot;Donkeys are champions when it comes to carrying stuff and are good at crossing deserts,&quot; co-author Ludovic Orlando, an <mark>evolutionary</mark> biologist at Paul Sabatier University in France, tells the publication."}, {"id": 726, "u": 8, "w": "exactly", "f": 7, t; enclosures, they do not allow for <mark>freedom</mark>, a natural diet or adequate exercise."}, {"id": 735, "u": 8, "w": "fundamental", "f": 7, "m": "fundament（基础）+-al（与……有关的）", "d": "1. adj. 基本的；根本的（7）", "e": "Today the rapid growth of artificial intelligence (AI) raises <mark>fundamental</mark> questions: &quot;What is intelligence, identity, or consciousness?"}, {"id": 736, "u": 8, "w": "grammar", "f": 7, "m": "", "d": "1. n. 语法（4）；2. adj. 文法学校的（2）；3. adj. 小学的（grammar school）（1）", "e": "The most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are born with an innate language-acquisition capacity that dictates a universal <mark>grammar</mark>."}, {"id": 737, "u": 8, "w": "hotel", "f": 7, "m": "", "d": "1. n. 旅馆；酒店（7）", "e": "Issues arise, however, when developers attempt to create large-scale short-term rental facilities-de facto <mark>hotels</mark>-to bypass taxes and regulations."}, {"id": 738, "u": 8, "w": "illustrate", "f": 7, "m": "il-（向、加到……上）+lustr（光、照亮）+-ate（使……，动词后缀）", "d": "1. v. 说明, 阐明（5）；2. v. 用图画表现、配插图（2）", "e": "In the past couple of weeks a quarrel has <mark>illustrated</mark> the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tracked and sent behavioural ads?"}, {"id": 739, "u": 8, "w": "inflation", "f": 7, "m": "in-（向内）+flat（吹、膨胀）+-ion（过程、状态）", "d": "1. n. 通货膨胀（5）；2. n. 分数虚高（grade inflation）（2）", "e": "During the decade before the economic crisis, spending on legal services in America grew twice as fast as <mark>inflation</mark>."}, {"id": 740, "u": 8, "w": "infrastructure", "f": 7, "m": "infra-（在下面）+structure（结构）", "d": "1. n. 基础设施（7）", "e": "Protecting and maintaining <mark>infrastructure</mark>"}, {"id": 741, "u": 8, "w": "invest", "f": 7, "m": "in-（进入）+vest（衣服；穿衣）", "d": "1. v. 投入（精力、时间）（7）", "e": "How do we know when to <mark>invest</mark> in an upgrade?"}, {"id": 742, "u": 8, "w": "journalism", "f": 7, "m": "journal（报刊）+-ism（行业、活动）", "d": "1. n. 新闻业；新闻工作（7）", "e": "These men believed in <mark>journalism</mark> as a calling, and were proud to be published in the daily press."}, {"id": 743, "u": 8, "w": "justify", "f": 7, "m": "just（正当、公正）+ify（使……、说明具有……）", "d": "1. v. 证明……有理；为……辩解（7）", "e": "Instead, dismissals must be <mark>justified</mark>."}, {"id": 744, "u": 8, "w": "lasting", "f": 7, "m": "last（持续）+-ing（形容词后缀）", "d": "1. adj. 持久的（7）", "e": "Evidence that the loveLife program produces <mark>lasting</mark> changes is limited and mixed."}, {"id": 745, "u": 8, "w": "letter", "f": 7, "m": "", "d": "1. n. 信件（6）；2. n. 字面条文（1）", "e": "Also missing is any discussion of eliminating Saturday <mark>letter</mark> delivery."}, {"id": 746, "u": 8, "w": "library", "f": 7, "m": "libr（书）+-ary（场所名词后缀）", "d": "1. n. 图书馆（7）", "e": "Until this century, university <mark>libraries</mark> were not very price sensitive."}, {"id": 747, "u": 8, "w": "list", "f": 7, "m": "", "d": "1. v. 列出；列入清单（4）；2. n. 出版社书目（mid-list：中等销量书目）（2）；3. v. 列入（某一类别）（1）", "e": "(47) It <mark>listed</mark> many documents in code that had been captured from the French army of Spain, and whose secrets had been revealed by the work of one George Scovell, an officer in British headquarters."}, {"id": 748, "u": 8, "w": "lobby", "f": 7, "m": "", "d": "1. v. 游说（4）；2. n. 游说团体（3）", "e": "Unfortunately, banks&#x27; <mark>lobbying</mark> now seems to be working."}, {"id": 749, "u": 8, "w": "making", "f": 7, "m": "make（制造，去词尾-e）+-ing（行为、过程或结果）", "d": "1. n. 制作；形成；制定（4）；2. n. 决策（decision-making）（2）；3. n. 赚钱（moneymaking）（1）", "e": "Unfortunately, despite 2½ years in the <mark>making</mark>, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities."}, {"id": 750, "u": 8, "w": "mechanism", "f": 7, "m": "mechan（机器、装置、机制）+-ism（系统及其运作方式的名词结尾）", "d": "1. n. 机制；运作方式（7）", "e": "For a generation, the collective doctrine has been that the sorting <mark>mechanism</mark> of society should be profit."}, {"id": 751, "u": 8, "w": "medical", "f": 7, "m": "med（治疗、医疗）+-ical（与……有关的）", "d": "1. adj. 医学的；医疗的（7）", "e": "A smartphone may contain an arrestee&#x27;s reading history, financial history, <mark>medical</mark> history and comprehensive records of recent correspondence."}, {"id": 752, "u": 8, "w": "merely", "f": 7, "m": "mere（仅仅、只不过）+-ly（副词后缀）", "d": "1. adv. 仅仅、只是（7）", "e": "<mark>Merely</mark> expanding the orchestra&#x27;s repertoire will not be enough."}, {"id": 753, "u": 8, "w": "moral", "f": 7, "m": "mor（道德、习俗）+-al（与……有关的）", "d": "1. adj. 道德的（7）", "e": "In many respects, the dearth of <mark>moral</mark> purpose frames not only the fact of such widespread phone hacking but the terms on which the trial took place."}, {"id": 754, "u": 8, "w": "multinational", "f": 7, "m": "multi-（多）+national（国家的）", "d": "1. n. 跨国公司（5）；2. adj. 跨国的（2）", "e": "Last Thursday, the French Senate passed a digital services tax, which would impose an entirely new tax on large <mark>multinationals</mark> that provide digital services to consumers or users in France."}, {"id": 755, "u": 8, "w": "neglect", "f": 7, "m": "neg（不）+lect（选择）", "d": "1. n. 忽视、疏于照管（7）", "e": "But the intention is not to <mark>neglect</mark> social science; rather, the complete opposite."}, {"id": 756, "u": 8, "w": "objective", "f": 7, "m": "object（对象；目标）+-ive（形容词或名词后缀）", "d": "1. adj. 客观的（6）；2. n. 目的；目标（1）", "e": "<mark>Objective</mark> knowledge is the goal, not the starting point."}, {"id": 757, "u": 8, "w": "outcome", "f": 7, "m": "out（出来）+come（来）", "d": "1. n. 结果,成果（7）", "e": "It does not include important factors such as environmental quality or education <mark>outcomes</mark> - all things that contribute to a person&#x27;s sense of well-being."}, {"id": 758, "u": 8, "w": "pair", "f": 7, "m": "", "d": "1. n. 一对（4）；2. v. 配对；搭配（3）", "e": "A <mark>pair</mark> of bills sponsored by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provides a case in point."}, {"id": 759, "u": 8, "w": "permission", "f": 7, "m": "per-（通过）+miss（发送、放行）+-ion（名词后缀）", "d": "1. n. 许可；允许（7）", "e": "<mark>Permission</mark> to run a nuclear plant is a public trust."}, {"id": 760, "u": 8, "w": "politician", "f": 7, "m": "politic（政治事务）+-ian（从事有关事务的人）", "d": "1. n. 政治人物；政客（7）", "e": "As the cost to everyone else has become clearer, <mark>politicians</mark> have begun to clamp down."}, {"id": 761, "u": 8, "w": "prepare", "f": 7, "m": "pre-（提前）+pare（准备、安排）", "d": "1. v. 准备；使做好准备（6）；2. v. 愿意；做好心理准备（be preparedto）（1）", "e": "In this as in much else, those who wish to influence the future must <mark>prepare</mark> for it."}, {"id": 762, "u": 8, "w": "procedure", "f": 7, "m": "proced-（proceed的词干形式，前进、进行）+-ure（过程、方式）", "d": "1. n. 程序；手续；步骤（6）；2. n. 手术；治疗程序（cosmeticprocedures：美容手术）（1）", "e": "What might be an effect of ERA&#x27;s unjustified dismissal <mark>procedures</mark>?"}, {"id": 763, "u": 8, "w": "proposal", "f": 7, "m": "propos-（propose去e，提议）+-al（名词后缀）", "d": "1. n. 提议；方案（7）", "e": "What is the author&#x27;s attitude towards the <mark>proposal</mark>?"}, {"id": 764, "u": 8, "w": "propose", "f": 7, "m": "pro-（向前）+pos（放置）+e（拼写结尾）", "d": "1. v. 提议、提出（7）", "e": "In order to ensure that elite women have more such opportunities, they have <mark>proposed</mark> imposing government quotas."}, {"id": 765, "u": 8, "w": "quarter", "f": 7, "m": "quart（四）+-er（表示分得部分的词形结尾）", "d": "1. n. 四分之一（6）；2. n. 季度（1）", "e": "A <mark>quarter</mark> of America&#x27;s public-sector workers have a university degree."}, {"id": 766, "u": 8, "w": "react", "f": 7, "m": "re-（回、反向）+act（行动、起作用）", "d": "1. v. 反应；作出反应（7）", "e": "In the last decade or so, advances in technology have allowed mass-market labels such as Zara, H&amp;M, and Uniqlo to <mark>react</mark> to trends more quickly and anticipate demand more precisely."}, {"id": 767, "u": 8, "w": "recommend", "f": 7, "m": "re-（再次）+commend（称赞、推荐）", "d": "1. v. 推荐；建议（6）；2. v. 称道；认为可取（1）", "e": "1)<mark>recommend</mark> one of your favorite movies and"}, {"id": 768, "u": 8, "w": "regardless", "f": 7, "m": "regard（考虑）+-less（没有、不顾）", "d": "1. adv. 不管、不顾（regardless of）（7）", "e": "Anyone can be a citizen scientist, <mark>regardless</mark> of age, nationality or academic experience."}, {"id": 769, "u": 8, "w": "regulatory", "f": 7, "m": "regulat-（regulate去e，监管）+-ory（有相应作用的）", "d": "1. adj. 监管的；管理的（7）", "e": "This narrowing of the <mark>regulatory</mark> scope was a victory for builders, mining operators and other commercial interests often at odds with environmental rules."}, {"id": 770, "u": 8, "w": "republican", "f": 7, "m": "republic（共和国、共和政体）+-an（与……有关的）", "d": "1. n. （美国）共和党人（6）；2. adj. 共和主义的（1）", "e": "In Wisconsin the unions have rallied thousands of supporters against Scott Walker, the hardline <mark>Republican</mark> governor."}, {"id": 771, "u": 8, "w": "rest", "f": 7, "m": "", "d": "1. n. 剩余部分；其余（3）；2. v. 依赖；建立在……之上（rest on）（1）；3. v. 责任在于（reston）（1）；4. n. 休息（1）；5. v. 位于,坐落于（1）", "e": "They then traced how the animals spread across the <mark>rest</mark> of the continent into Europe and Asia about 2,500 years later."}, {"id": 772, "u": 8, "w": "reviewer", "f": 7, "m": "review（评论；审查）+-er（人）", "d": "1. n. 审稿人；评审人（6）；2. n. 评论者；评论家（1）", "e": "Manuscripts will be flagged up for additional scrutiny by the journal&#x27;s internal editors, or by its existing Board of Reviewing Editors or by outside peer <mark>reviewers</mark>."}, {"id": 773, "u": 8, "w": "rival", "f": 7, "m": "riv-（溪流）+al（与之有关的人或关系）", "d": "1. n. 竞争对手；对手（7）", "e": "Now, <mark>rivals</mark> will be charging sales tax where they hadn&#x27;t before."}, {"id": 774, "u": 8, "w": "scholar", "f": 7, "m": "schol（学习）+-ar（从事相关活动的人）", "d": "1. n. 学者；专家（7）", "e": "Among the commission&#x27;s 51 members are top-tier-university presidents, <mark>scholars</mark>, lawyers, judges, and business executives, as well as prominent figures from diplomacy, filmmaking, music and journalism."}, ouse</mark> is a complex one for the young male."}, {"id": 784, "u": 8, "w": "street", "f": 7, "m": "", "d": "1. n. 街道（3）；2. n. 商业街（highstreet）（2）；3. n. 全街居民（1）；4. n. 相互往来的关系（two-way street）（1）", "e": "The team identified some 15 buildings, courtyards, a network of <mark>streets</mark>, and two chamber tombs."}, {"id": 785, "u": 8, "w": "strict", "f": 7, "m": "", "d": "1. adj. 严格的（7）", "e": "The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state&#x27;s <mark>strict</mark> nuclear regulations."}, {"id": 786, "u": 8, "w": "sustainable", "f": 7, "m": "sustain（支撑、维持）+-able（能够被……的）", "d": "1. adj. 可持续的、能够维持的（7）", "e": "The concept of <mark>sustainable</mark> development has been defined as profitable."}, {"id": 787, "u": 8, "w": "throughout", "f": 7, "m": "through（穿过；遍及）+out（全部；到外部）", "d": "1. adv. 贯穿；遍及（7）", "e": "Two paradoxes exist <mark>throughout</mark> this credibility process."}, {"id": 788, "u": 8, "w": "tie", "f": 7, "m": "", "d": "1. v. 联系；关联（3）；2. n. 联系；关联（2）；3. n. 合作（tie-up）（1）；4. v. 系；绑（1）", "e": "In its latest survey of CEO pay, The Wall Street Journal finds that &quot;a substantial part&quot; of executive pay is now <mark>tied</mark> to performance."}, {"id": 789, "u": 8, "w": "transform", "f": 7, "m": "trans-（跨越、转到另一种状态）+form（形状、形式）", "d": "1. v. 改变；转变（7）", "e": "But it takes collective scrutiny and acceptance to <mark>transform</mark> a discovery claim into a mature discovery."}, {"id": 790, "u": 8, "w": "typically", "f": 7, "m": "typical（典型的、常见的）+-ly（以某种方式、从某种情况来说）", "d": "1. adv. 通常、一般地（7）", "e": "<mark>Typically</mark>, if rains are delayed, people may clear land to plant more rice to supplement their harvests."}, {"id": 791, "u": 8, "w": "undermine", "f": 7, "m": "under（在下面）+mine（挖掘，接采矿）", "d": "1. v. 削弱；损害（7）", "e": "If connections can be bought, a basic premise of democratic society - that all are equal in treatment by government - is <mark>undermined</mark>."}, {"id": 792, "u": 8, "w": "unemployed", "f": 7, "m": "un-（未、没有）+employed（受雇的）", "d": "1. adj. 失业的；失业者（7）", "e": "Ask anyone newly <mark>unemployed</mark> what they want and the answer is always: a job."}, {"id": 793, "u": 8, "w": "useful", "f": 7, "m": "use（用途、用处）+-ful（有……的）", "d": "1. adj. 有用的（7）", "e": "Only then will they be <mark>useful</mark> servants and not Frankenstein&#x27;s out-of-control monster."}, {"id": 794, "u": 8, "w": "vehicle", "f": 7, "m": "veh（运载）+-icle（工具）", "d": "1. n. 车辆；交通工具（5）；2. n. 手段；途径（1）；3. n. （传播的）工具；媒介（1）", "e": "The coming use of autonomous <mark>vehicles</mark>, for example, poses thorny ethical questions."}, {"id": 795, "u": 8, "w": "vision", "f": 7, "m": "vis（看、视觉）+-ion（能力、活动或所见内容）", "d": "1. n. 远见；眼界（4）；2. n. 愿景；想象中的景象（2）；3. n. 视觉；视力（1）", "e": "A citizen science-based approach can extend the field of <mark>vision</mark> and include more ideas and different brains to problem-solve and create, making innovation faster and more effective."}, {"id": 796, "u": 8, "w": "waste", "f": 7, "m": "", "d": "1. n. 浪费（4）；2. v. 浪费（2）；3. n. 粪便（1）", "e": "But even if you accept Friedman&#x27;s premise and regard corporate social responsibility (CSR) policies as a <mark>waste</mark> of shareholders&#x27; money, things may not be absolutely clear-cut."}, {"id": 797, "u": 8, "w": "acceptance", "f": 6, "m": "accept（接受、认可）+ance（行为或状态的名词后缀）", "d": "1. n. 接受；认可（6）", "e": "But it takes collective scrutiny and <mark>acceptance</mark> to transform a discovery claim into a mature discovery."}, {"id": 798, "u": 8, "w": "accessible", "f": 6, "m": "access（进入、接近、取得）+-ible（可以……的）", "d": "1. adj. 可获得、可使用或易接近的（5）；2. adj. 易理解的；通俗易懂的（1）", "e": "This form of <mark>accessible</mark> science means that great minds are able to join the race to create and develop projects with the potential to change the world."}, {"id": 799, "u": 8, "w": "advice", "f": 6, "m": "", "d": "1. n. 建议（6）", "e": "Can you give me some <mark>advice</mark>?"}, {"id": 800, "u": 8, "w": "agency", "f": 6, "m": "ag（行动、办理）+-ency（相应作用或组织的名词结尾）", "d": "1. n. 机构；部门（4）；2. n. 代理机构；中介公司（2）", "e": "There&#x27;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the <mark>agency&#x27;s</mark> costs."}, {"id": 801, "u": 9, "w": "algorithm", "f": 6, "m": "", "d": "1. n. 算法（6）", "e": "It is not enough to say that the <mark>algorithms</mark> DeepMind develops will benefit patients and save lives."}, {"id": 802, "u": 9, "w": "allowance", "f": 6, "m": "allow（允许、给予）+-ance（行为或所给数额的名词后缀）", "d": "1. n. 补助金；津贴（6）", "e": "There will now be a seven-day wait for the jobseeker&#x27;s <mark>allowance</mark>."}, {"id": 803, "u": 9, "w": "alongside", "f": 6, "m": "along（沿着）+side（边、侧面）", "d": "1. adv. 与……一起；与……并存（3）；2. adv. 在旁边；并排（3）", "e": "The rise of citizen science has grown <mark>alongside</mark> the rise of do-it-yourself biology laboratories around the world."}, {"id": 804, "u": 9, "w": "alternative", "f": 6, "m": "altern（另一个）+-ative（形容词结尾，也可构成名词）", "d": "1. n. 替代方案；可供选择的事物（4）；2. adj. 可供替代的；其他可选的（1）；3. n. 另一种可能的现实（1）", "e": "There is no doubt of the <mark>alternative</mark> - the corrupted landscapes of southern Portugal, Spain or Ireland."}, {"id": 805, "u": 9, "w": "ambition", "f": 6, "m": "ambit（追求、四处争取）+-ion（愿望、状态的名词结尾）", "d": "1. n. 抱负；雄心；志向（6）", "e": "Broadcasting his <mark>ambition</mark> was &quot;very much my decision,&quot; McGee says."}, {"id": 806, "u": 9, "w": "annual", "f": 6, "m": "ann（年）+-ual（与此周期有关的）", "d": "1. adj. 每年的；年度的（6）", "e": "Which of the following is true about the recent <mark>annual</mark> study?"}, {"id": 807, "u": 9, "w": "applicant", "f": 6, "m": "applic（apply末尾y换成ic，申请）+-ant（做这件事的人）", "d": "1. n. 申请者、应聘者（6）", "e": "The notice should include the basic qualifications for <mark>applicants</mark> and the other information which you think is relevant."}, {"id": 808, "u": 9, "w": "appreciation", "f": 6, "m": "appreciat-（appreciate去e，认识到价值、欣赏、感激）+-ion（行为、状态）", "d": "1. n. 欣赏、赞赏（4）；2. n. 理解、认识（1）；3. n. 语境不足：理解或欣赏（1）", "e": "In the last paragraph, the author shows his <mark>appreciation</mark> of____"}, {"id": 809, "u": 9, "w": "art-science", "f": 6, "m": "art（艺术）+science（科学）", "d": "1. 短语 艺术与科学相结合的（6）", "e": "The reach of <mark>art-science</mark> tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other."}, {"id": 810, "u": 9, "w": "assumption", "f": 6, "m": "assumpt（承担；假定；assume的词干变体）+-ion（名词后缀）", "d": "1. n. 假设；想当然的看法（6）", "e": "California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old <mark>assumption</mark> that authorities may search through the possessions of suspects at the time of their arrest."}, {"id": 811, "u": 9, "w": "balance", "f": 6, "m": "", "d": "1. n. 平衡、使平衡（4）；2. v. 平衡、使平衡（2）", "e": "But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration&#x27;s effort to upset the <mark>balance</mark> of power between the federal government and the states."}, {"id": 812, "u": 9, "w": "bear", "f": 6, "m": "", "d": "1. v. 带有；具有（3）；2. v. 使发挥作用；运用（bring to bear）（1）；3. v. 承担；承受（1）；4. v. 证实；支持（bear out）（1）", "e": "Some of the trees he analyzed <mark>bore</mark> more than 20 fire scars among their rings."}, {"id": 813, "u": 9, "w": "brand", "f": 6, "m": "", "d": "1. n. 品牌（5）；2. v. 把……污名化；给……贴标签（1）", "e": "The theory also seems to explain the sudden and unexpected popularity of certain looks, <mark>brands</mark>, or neighborhoods."}, {"id": 814, "u": 9, "w": "brief", "f": 6, "m": "", "d": "1. adj. 简短的；短暂的（3）；2. adj. 简而言之（to be brief）（1）；3. n. 简报；摘要报告（1）；4. n. 简而言之（inbrief）（1）", "e": "Neuroscientist Bonnie Auyeung found that the hormone oxytocin increased the amount of eye contact from men toward the interviewer during a <mark>brief</mark> interview when the direction of their gaze was recorded."}, {"id": 815, "u": 9, "w": "bury", "f": 6, "m": "", "d": "1. v. 埋藏；掩埋（5）；2. v. 隐藏；使不显眼（1）", "e": "Why had the Romans <mark>buried</mark> a million nails?"}, {"id": 816, "u": 9, "w": "cancer", "f": 6, "m": "", "d": "1. n. 癌症（6）", "e": "They&#x27;ve implored citizen scientists to help with bug counting and categorising <mark>cancer</mark> cells, and even identifying distant galaxies."}, {"id": 817, "u": 9, "w": "candidate", "f": 6, "m": "candid（白色）+-ate（相应的人）", "d": "1. n. 候选人；应聘者（6）", "e": "For years executives and headhunters have adhered to the rule that the most attractive CEO <mark>candidates</mark> are the ones who must be poached."}, {"id": 818, "u": 9, "w": "capacity", "f": 6, "m": "cap（盛放、容纳）+-acity（性质、程度的名词结尾）", "d": "1. n. 能力（6）", "e": "The most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are born with an innate language-acquisition <mark>capacity</mark> that dictates a universal grammar."}, {"id": 819, "u": 9, "w": "category", "f": 6, "m": "", "d": "1. n. 类别（6）", "e": "The European Union Framework funding programs have long had a <mark>category</mark> specifically targeted at social scientists."}, {"id": 820, "u": 9, "w": "central", "f": 6, "m": "centr（中心）+-al（……的）", "d": "1. adj. 主要的；核心的（5）；2. adj. 中央的；中部的（1）", "e": "As the war unfolded, science rapidly assumed a <mark>central</mark> role."}, {"id": 821, "u": 9, "w": "characteristic", "f": 6, "m": "character（特征、特色）+istic（具有这种特点的）", "d": "1. n. 特征；特点（4）；2. adj. 典型的；特有的（2）", "e": "In contrast to France&#x27;s actions, Denmark&#x27;s fashion industry agreed last month on rules and sanctions regarding the age, health, and other <mark>characteristics</mark> of models."}, {"id": 822, "u": 9, "w": "chemical", "f": 6, "m": "chem（化学）+-ical（与……有关的）", "d": "1. n. 化学物质（4）；2. adj. 使用化学制品的（1）；3. adj. 化学的（1）", "e": "They infused some with stabilizing and consolidating <mark>chemicals</mark>."}, {"id": 823, "u": 9, "w": "collaboration", "f": 6, "m": "collaborat-（collaborate去e，合作）+-ion（名词后缀）", "d": "1. n. 合作、协作（6）", "e": "These <mark>collaborations</mark> are likely to become increasingly common."}, {"id": 824, "u": 9, "w": "compete", "f": 6, "m": "com-（共同、一起）+pet（追求）+e（拼写结尾）", "d": "1. v. 竞争；争夺（5）；2. v. 相互冲突；相互竞争（1）", "e": "Kennedy wrote that the rule &quot;limited states&#x27; ability to seek long-term prosperity and has prevented market participants from <mark>competing</mark> on an even playing field.&quot;"}, {"id": 825, "u": 9, "w": "competitive", "f": 6, "m": "compete（竞争，去掉末尾e）+-itive（本词的形容词结尾）", "d": "1. adj. 竞争的；有竞争力的（6）", "e": "Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even <mark>competitive</mark> products."}, {"id": 826, "u": 9, "w": "compromise", "f": 6, "m": "com-（共同）+promise（答应、承诺）", "d": "1. v. 妥协；让步（4）；2. v. 损害（1）；3. v. 危及；损害（1）", "e": "The astronomy community is making <mark>compromises</mark> to change its use of Mauna Kea."}, {"id": 827, "u": 9, "w": "consensus", "f": 6, "m": "con-（共同）+sens（感觉、看法）+us（名词词形结尾）", "d": "1. n. 共识；一致意见（6）", "e": "The emerging <mark>consensus</mark> around the bill is a sign that legislators are getting frightened about a politically embarrassing short-term collapse at the USPS."}, {"id": 828, "u": 9, "w": "constantly", "f": 6, "m": "constant（持续的、经常发生的）+-ly（以这种方式）", "d": "1. adv. 不断地；经常地（6）", "e": "Zoos are at the forefront of conservation and <mark>constantly</mark> evolving to improve how they care for animals and protect each species in its natural habitat."}, {"id": 829, "u": 9, "w": "constitutional", "f": 6, "m": "constitution（宪法）+-al（与……有关的、符合……的）", "d": "1. adj. 宪法的、宪法规定的（6）", "e": "Two of the three objecting Justices - Samuel Alito and Clarence Thomas - agreed with this <mark>Constitutional</mark> logic but disagreed about which Arizona rules conflicted with the federal statute."}, {"id": 830, "u": 9, "w": "consume", "f": 6, "m": "con-（完全）+sum（拿取、取用）+e（词形结尾）", "d": "1. v. 消费（4）；2. v. 消耗，耗费（燃料、能源、时间等）（2）", "e": "It argues that since prosecutors do not <mark>consume</mark> a company&#x27;s products as part of their investigations, they could be influenced only by the halo effect."}, {"id": 831, "u": 9, "w": "contain", "f": 6, "m": "con-（一起）+tain（持有、保持）", "d": "1. v. 包含、容纳（6）", "e": "Mental health is the seed that <mark>contains</mark> self-esteem -confidence in ourselves and an ability to trust in our common sense."}, {"id": 832, "u": 9, "w": "contribution", "f": 6, "m": "contribute（贡献、捐献、投稿）+-ion（行为或交出内容的名词后缀）", "d": "1. n. 贡献；捐助（5）；2. n. 缴款、缴纳金额（1）", "e": "Neither one of them actually participated in any <mark>contributions</mark> to animal research or conservation."}, {"id": 833, "u": 9, "w": "controversy", "f": 6, "m": "contro-（相反、对抗）+vers（转向）+y（名词词尾）", "d": "1. n. 争议（6）", "e": "Some blame for the current <mark>controversy</mark> belongs to astronomers."}, {"id": 834, "u": 9, "w": "copy", "f": 6, "m": "", "d": "1. n. 复制品， 副本（3）；2. v. 复制（2）；3. n. 广告文案（1）", "e": "The success of Sci-Hub, which relies on researchers passing on <mark>copies</mark> they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants."}, {"id": 835, "u": 9, "w": "copyright", "f": 6, "m": "copy（复制）+right（权利）", "d": "1. n. 版权（4）；2. adj. 受版权保护的（2）", "e": "As a result, they are raising tricky questions about ethics and <mark>copyright</mark>."}, {"id": 836, "u": 9, "w": "corporation", "f": 6, "m": "corpor（身体、整体）+-ation（形成的组织或实体）", "d": "1. n. 公司，企业（尤指大型的、有限责任的）（6）", "e": "The conflict has been surfacing since 2002, when the <mark>corporation</mark> bought Vermont&#x27;s only nuclear power plant, an aging reactor in Vernon."}, {"id": 837, "u": 9, "w": "creativity", "f": 6, "m": "creative（去e，有创造力的）+-ity（性质、能力）", "d": "1. n. 创造力；创造性（6）", "e": "Curriculums - from grammar school to college - should evolve to focus less on memorizing facts and more on <mark>creativity</mark> and complex communication."}, {"id": 838, "u": 9, "w": "credibility", "f": 6, "m": "credible（末尾ble变bil，可信的）+-ity（性质、状态）", "d": "1. n. 可信度；公信力（6）", "e": "Two paradoxes exist throughout this <mark>credibility</mark> process."}, {"id": 839, "u": 9, "w": "date", "f": 6, "m": "dat（给、给定）+e（词形结尾）", "d": "1. adj. 过时（out ofdate）（2）；2. v. 追溯到（dateback）（2）；3. n. 过时（out ofdate）（1）；4. n. 日期（1）", "e": "[ A ] sticks to an out-of-<mark>date</mark> order."}, {"id": 840, "u": 9, "w": "deforestation", "f": 6, "m": "de-（除去）+forest（森林）+-ation（名词后缀）", "d": "1. n. 砍伐森林（6）", "e": "Last year marked the third year in a row that Indonesia&#x27;s bleak rate of <mark>deforestation</mark> has slowed in pace."}, {"id": 841, "u": 9, "w": "deliver", "f": 6, "m": "de（使脱离）+liver（释放、自由）", "d": "1. v. 传递（5）；2. v. 实现；产生（成果）（1）", "e": "The thing itself is the medium that <mark>delivers</mark> the information."}, {"id": 842, "u": 9, "w": "developer", "f": 6, "m": "develop（开发）+-er（从事者）", "d": "1. n. 房地产开发商（4）；2. n. 开发者；开发商（2）", "e": "Issues arise, however, when <mark>developers</mark> attempt to create large-scale short-term rental facilities-de facto hotels-to bypass taxes and regulations."}, {"id": 843, "u": 9, "w": "device", "f": 6, "m": "", "d": "1. n. 设备；装置（6）", "e": "But keeping sensitive information on these <mark>devices</mark> is increasingly a requirement of normal life."}, {"id": 844, "u": 9, "w": "difficulty", "f": 6, "m": "difficult（困难的）+-y（性质、状态）", "d": "1. n. 困难；难度（6）", "e": "But these provisions create <mark>difficulties</mark> for businesses when applied to highly paid managers and executives."}, {"id": 845, "u": 9, "w": "discipline", "f": 6, "m": "discipl（教学、训练）+ine（词形结尾）", "d": "1. n. 学科；专业领域（5）；2. n. 自律；自制力（1）", "e": "As science and technology progressed, and divided into more sub-<mark>disciplines</mark>, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa."}, {"id": 846, "u": 9, "w": "dismiss", "f": 6, "m": "dis-（分开、离去）+miss（派遣、送走）", "d": "1. v. 不予考虑；否定（2）；2. v. 解雇（2）；3. v. 贬低；驳回（ ", "e": "It said that Internet Explorer 10, the <mark>version</mark> due to appear with Windows 8, would have DNT as a default."}, {"id": 936, "u": 10, "w": "violate", "f": 6, "m": "viol（违背、侵犯）+-ate（形成动作）", "d": "1. v. 违反、侵犯（6）", "e": "It also pledged not to deploy AI whose use would <mark>violate</mark> international laws or human rights."}, {"id": 937, "u": 10, "w": "volume", "f": 6, "m": "vol（卷起）+U（U形容器）+me（测量）", "d": "1. n. 数量；总量（2）；2. n. 充分说明；含义深刻（speakvolumes）（1）；3. n. 卷；册；书籍（1）；4. n. 待定（孤立干扰项，可指体积、容量或数量）（1）；5. n. 音量（1）", "e": "Even as California lost a huge <mark>volume</mark> of production to other locations, there was still plenty of film production taking place in Los Angeles before this year."}, {"id": 938, "u": 10, "w": "website", "f": 6, "m": "web（万维网、网上信息网络）+site（地点、站点）", "d": "1. n. 网站（6）", "e": "The parliament also agreed to ban <mark>websites</mark> that &quot;incite excessive thinness&quot; by promoting extreme dieting."}, {"id": 939, "u": 10, "w": "wetland", "f": 6, "m": "wet（湿的）+land（土地）", "d": "1. n. 湿地（6）", "e": "They move between a variety of habitats, including forests, grasslands, woodlands, <mark>wetlands</mark> and agricultural land."}, {"id": 940, "u": 10, "w": "wildfire", "f": 6, "m": "wild（野生的）+fire（火）", "d": "1. n. 野火；森林火灾（6）", "e": "What did the study find about the <mark>wildfires</mark> over the past few decades?"}, {"id": 941, "u": 10, "w": "wildlife", "f": 6, "m": "wild（野生的）+life（生命、生物）", "d": "1. n. 野生生物；野生动植物（6）", "e": "I was a zoo and <mark>wildlife</mark> park employee for years."}, {"id": 942, "u": 10, "w": "wireless", "f": 6, "m": "wire（电线）+-less（没有……的）", "d": "1. n. 无线电广播、收音机（6）", "e": "By and large the <mark>wireless</mark> was welcome."}, {"id": 943, "u": 10, "w": "acquisition", "f": 5, "m": "acquisit-（取得；获得，acquire的历史词干）+-ion（过程或结果）", "d": "1. n. 获得；取得（3）；2. n. 习得；学会（1）；3. n. 收购；购入（1）", "e": "Other scientists perform the specialised work of peer review also for free, because it is a central element in the <mark>acquisition</mark> of status and the production of scientific knowledge."}, {"id": 944, "u": 10, "w": "additional", "f": 5, "m": "addition（增加、附加部分）+-al（与……有关的）", "d": "1. adj. 额外的；增加的（5）", "e": "&quot;Then increase it at a higher rate each year and essentially try to generate <mark>additional</mark> revenue.&quot;"}, {"id": 945, "u": 10, "w": "adjust", "f": 5, "m": "ad-（向）+just（正好符合）", "d": "1. v. 调整；调节（4）；2. v. 适应（1）", "e": "During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted position or <mark>adjusted</mark> their limbs."}, {"id": 946, "u": 10, "w": "advise", "f": 5, "m": "ad-（向）+vis（看、看法）+e（词形结尾）", "d": "1. v. 建议；劝告（5）", "e": "Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes <mark>advise</mark> contributors to add a number of citations to their articles."}, {"id": 947, "u": 10, "w": "affordable", "f": 5, "m": "afford（有能力支付、负担得起）+able（能够被……的）", "d": "1. adj. 负担得起的（5）", "e": "It could make extra training and instruction <mark>affordable</mark>."}, {"id": 948, "u": 10, "w": "agreement", "f": 5, "m": "agree（同意、一致、商定）+-ment（行为、状态或结果的名词后缀）", "d": "1. n. 协议；约定（5）", "e": "What is true of the <mark>agreement</mark> between the NHS and DeepMind?"}, {"id": 949, "u": 10, "w": "airline", "f": 5, "m": "air（空中、航空）+line（线、路线）", "d": "1. n. 航空的（3）；2. n. 航空公司（2）", "e": "It is not yet clear how much more effective <mark>airline</mark> security has become - but the lines are obvious."}, {"id": 950, "u": 10, "w": "amateur", "f": 5, "m": "am（爱）+-ateur（从事者）", "d": "1. n. 业余爱好者（4）；2. adj. 业余的；非职业的（1）", "e": "Court, school, organizations of <mark>amateurs</mark>, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring honor to England."}, {"id": 951, "u": 10, "w": "ambiguous", "f": 5, "m": "ambigu（两可；含糊，词干）+-ous（形容词后缀）", "d": "1. adj. 含糊不清的（5）", "e": "But in the everyday practice of science, discovery frequently follows an <mark>ambiguous</mark> and complicated route."}, {"id": 952, "u": 10, "w": "apart", "f": 5, "m": "a-（加强）+part（部分、分开）", "d": "1. adv. 除……之外（apart from）（3）；2. adv. 分开；分离（2）", "e": "[ A ] <mark>apart</mark> from"}, {"id": 953, "u": 10, "w": "apparent", "f": 5, "m": "ap-（向外、显到眼前）+par（显现）+ent（具有这种状态的）", "d": "1. adj. 明显的、显而易见的（3）；2. adj. 表面上的；貌似的（2）", "e": "Production has been slipping away from Hollywood since the 1950s, but the effects have never been more <mark>apparent</mark> than at present."}, {"id": 954, "u": 10, "w": "aspect", "f": 5, "m": "a-（朝向）+spect（看）", "d": "1. n. 方面（5）", "e": "Advances in artificial intelligence (AI) are rapidly changing every <mark>aspect</mark> of human life."}, {"id": 955, "u": 10, "w": "attend", "f": 5, "m": "at-（向）+tend（伸展、朝向）", "d": "1. v. 参加；出席（4）；2. v. 照料；关注（attend to）（1）", "e": "Write an email to all international experts on campus inviting them to <mark>attend</mark> the graduation ceremony."}, {"id": 956, "u": 10, "w": "awareness", "f": 5, "m": "aware（意识到的、察觉的）+-ness（状态）", "d": "1. n. 意识、认识（5）", "e": "Karla Ortiz, an illustrator based in San Francisco who found her work in Stable Diffusion&#x27;s data set, has been raising <mark>awareness</mark> about the issues around AI art and copyright."}, {"id": 957, "u": 10, "w": "bar", "f": 5, "m": "", "d": "1. n. 律师界；律师职业资格（4）；2. v. 禁止；阻止（1）", "e": "Another is to let students sit for the <mark>bar</mark> after only two years of law school."}, {"id": 958, "u": 10, "w": "biased", "f": 5, "m": "bias（偏见；使偏向）+-ed（具有……状态的）", "d": "1. adj. 有偏见的；偏向一方的（5）", "e": "This is not a free market but a <mark>biased</mark> one."}, {"id": 959, "u": 10, "w": "biological", "f": 5, "m": "biolog（biology去y，生物学）+ical（与……有关的）", "d": "1. adj. 生物的；生物学的（5）", "e": "Looking at these DNA sequences, we get a <mark>biological</mark> testimony to the environment these animals lived in and the experiences they survived.&quot;"}, {"id": 960, "u": 10, "w": "bird", "f": 5, "m": "", "d": "1. n. 鸟（5）", "e": "Beavers build dams and <mark>birds</mark> make nests."}, {"id": 961, "u": 10, "w": "born", "f": 5, "m": "", "d": "1. v. 出生（3）；2. adj. 原生的（born-digital：原生数字的）（1）；3. v. 产生；诞生（1）", "e": "The most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are <mark>born</mark> with an innate language-acquisition capacity that dictates a universal grammar."}, {"id": 962, "u": 10, "w": "capital", "f": 5, "m": "capit（头、首要）+-al（相关性质或事物）", "d": "1. n. 资本；资金（3）；2. n. 之都；中心城市（2）", "e": "The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of <mark>capital</mark> markets, is being compromised."}, {"id": 963, "u": 10, "w": "casual", "f": 5, "m": "cas（落下、降临）+-ual（具有相应特点的）", "d": "1. adj. 随意的；非正式的（3）；2. adj. 随意拍摄的；自然的（1）；3. adj. 随意的；不固定伴侣的（1）", "e": "[ B ] <mark>casual</mark> style."}, {"id": 964, "u": 10, "w": "cater", "f": 5, "m": "", "d": "1. v. 迎合；满足需求（5）", "e": "This __11__ approach aims to <mark>cater</mark> to individual preferences and enhance the concept of beauty tailored to each person&#x27;s unique characteristics."}, {"id": 965, "u": 10, "w": "cautious", "f": 5, "m": "caut（小心、警惕）+ious（具有相应性质的）", "d": "1. adj. 谨慎的（5）", "e": "A turbulent business environment also has senior managers <mark>cautious</mark> of letting vague pronouncements cloud their reputations."}, {"id": 966, "u": 10, "w": "circulation", "f": 5, "m": "circulat（circulate去e，循环、流通）+-ion（过程、相关数量）", "d": "1. n. 发行；发行量（5）", "e": "It was to ruin lives in the quest for <mark>circulation</mark> and impact."}, {"id": 967, "u": 10, "w": "civil", "f": 5, "m": "civ（公民、市民；文明）+il（形容词结尾）", "d": "1. adj. 公务的；行政的（3）；2. adj. 公民的（2）", "e": "If the trade unionist Jimmy Hoffa were alive today, he would probably represent <mark>civil</mark> servants."}, {"id": 968, "u": 10, "w": "clearly", "f": 5, "m": "clear（清楚的、明确的）+-ly（以这种方式、在这种情况下）", "d": "1. adv. 清楚地；明显地（5）", "e": "Roman lamps and Roman chariots are very different from LED strips and sports cars, but Roman nails are still <mark>clearly</mark> nails."}, {"id": 969, "u": 10, "w": "commerce", "f": 5, "m": "com-（共同、相互）+merce（商品、贸易）", "d": "1. n. 商业；贸易（5）", "e": "But in some cases, one marketer&#x27;s owned media become another marketer&#x27;s paid media - for instance, when an e-<mark>commerce</mark> retailer sells ad space on its Web site."}, {"id": 970, "u": 10, "w": "commonly", "f": 5, "m": "common（常见的、普遍的）+-ly（在这种情况下、以这种方式）", "d": "1. adv. 通常、普遍地（5）", "e": "What is <mark>commonly</mark> regarded as the cause of grade inflation?"}, {"id": 971, "u": 10, "w": "communicate", "f": 5, "m": "com-（共同、相互）+mun（服务）+-icate（表示相应动作的词尾）", "d": "1. v. 交流；传递信息（3）；2. v. 表达，传达（2）", "e": "To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#x27; ability to solve problems and <mark>communicate</mark> effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day."}, {"id": 972, "u": 10, "w": "complaint", "f": 5, "m": "complain（抱怨）+-t（名词词尾）", "d": "1. n. 抱怨；投诉（5）", "e": "But there are few places where clients have more grounds for <mark>complaint</mark> than America."}, {"id": 973, "u": 10, "w": "comply", "f": 5, "m": "com-（完全）+ply（完成、补足）", "d": "1. v. 遵守；符合（5）", "e": "Those retailers may face headaches <mark>complying</mark> with various state sales tax laws."}, {"id": 974, "u": 10, "w": "confidence", "f": 5, "m": "con-（充分）+fid（信任、相信）+-ence（状态或相关内容的名词结尾）", "d": "1. n. 信心；自信（5）", "e": "Mental health is the seed that contains self-esteem -<mark>confidence</mark> in ourselves and an ability to trust in our common sense."}, {"id": 975, "u": 10, "w": "consequently", "f": 5, "m": "consequent（随之发生的）+-ly（副词后缀）", "d": "1. adv. 因此；结果（5）", "e": "<mark>Consequently</mark>, discovery claims should be thought of as protoscience."}, {"id": 976, "u": 10, "w": "conservative", "f": 5, "m": "con-（一起、整体）+serv（保持）+-ative（具有这种倾向的）", "d": "1. adj. 保守的；守旧的（4）；2. n. 保守派人士（1）", "e": "Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too <mark>conservative</mark> to implement them."}, {"id": 977, "u": 10, "w": "consolidate", "f": 5, "m": "con-（一起）+solid（坚固、密实）+ate（使……）", "d": "1. v. 巩固（3）；2. v. 加固；使坚固（1）；3. v. 合并（1）", "e": "[ B ] <mark>consolidates</mark> family relationships"}, {"id": 978, "u": 10, "w": "convention", "f": 5, "m": "con-（共同、一起）+vent（来）+-ion（活动或结果）", "d": "1. n. 惯例；传统习俗（5）", "e": "He freed music from hitherto prevailing <mark>conventions</mark> of harmony and structure."}, {"id": 979, "u": 10, "w": "cooperation", "f": 5, "m": "cooperat-（cooperate去e，合作）+-ion（名词后缀）", "d": "1. n. 合作；协作（5）", "e": "It is hard to get right, and requires a remarkable degree of vision, as well as <mark>cooperation</mark> between city authorities, the private sector, community groups and cultural organisations."}, {"id": 980, "u": 10, "w": "counterpart", "f": 5, "m": "counter-（相对）+part（部分）", "d": "1. n. 对应的人或事物；同行（5）", "e": "And though print ad sales still dwarf their online and mobile <mark>counterparts</mark>, revenue from print is still declining."}, {"id": 981, "u": 10, "w": "couple", "f": 5, "m": "", "d": "1. n. 几个 (人或物)（3）；2. n. 夫妇；伴侣（2）", "e": "Such measures have a <mark>couple</mark> of uplifting motives."}, {"id": 982, "u": 10, "w": "craft", "f": 5, "m": "", "d": "1. v. 精心制作（2）；2. n. 小船；船只（1）；3. n. 手工艺（1）；4. n. 技艺；手艺（1）", "e": "To encourage innovation and competition, the report calls for increased investment in research, the <mark>crafting</mark> of coherent curricula that improve students&#x27; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day."}, {"id": 983, "u": 10, "w": "creator", "f": 5, "m": "creat（create去e，创造）+or（从事者）", "d": "1. n. 创造者；创作者（5）", "e": "For millennia, we&#x27;ve known what we&#x27;ve known due to artifacts that have survived, often despite their original <mark>creators</mark>&#x27; neglect."}, {"id": 984, "u": 10, "w": "creature", "f": 5, "m": "creat（create去e，创造）+-ure（形成的事物）", "d": "1. n. 生物；动物（5）", "e": "Yet these <mark>creatures</mark> are members of the biotic community and, if its stability depends on its integrity, they are entitled to continuance."}, {"id": 985, "u": 10, "w": "crime", "f": 5, "m": "", "d": "1. n. 罪行（5）", "e": "&quot;This is organized <mark>crime</mark>.&quot;"}, {"id": 986, "u": 10, "w": "cross", "f": 5, "m": "", "d": "1. v. 穿过（3）；2. v. 交叉核对（cross-check）（1）；3. adj. 跨……的（1）", "e": "&quot;Donkeys are champions when it comes to carrying stuff and are good at <mark>crossing</mark> deserts,&quot; co-author Ludovic Orlando, an evolutionary biologist at Paul Sabatier University in France, tells the publication."}, {"id": 987, "u": 10, "w": "curiosity", "f": 5, "m": "curios（curious的词干变体，好奇的）+-ity（性质；相关事物）", "d": "1. n. 好奇心；求知欲（5）", "e": "The 17th and 18th centuries were times of radical change and <mark>curiosity</mark>."}, {"id": 988, "u": 10, "w": "curriculum", "f": 5, "m": "curr（跑、行进）+ICULUM（我选择有用的课程、动脑学习）", "d": "1. n. 课程（5）", "e": "<mark>Curriculums</mark> - from grammar school to college - should evolve to focus less on memorizing facts and more on creativity and complex communication."}, {"id": 989, "u": 10, "w": "dangerous", "f": 5, "m": "danger（危险）+ous（具有相应性质的）", "d": "1. adj. 危险的（5）", "e": "&quot;Such narratives can lead to maternal exhaustion and have <mark>dangerous</mark> consequences,&quot; they wrote."}, {"id": 990, "u": 10, "w": "default", "f": 5, "m": "de-（加强）+fault（未做到、缺失）", "d": "1. adj. 默认的（5）", "e": "Human nature being what it is, most people stick with <mark>default</mark> settings."}, {"id": 991, "u": 10, "w": "definition", "f": 5, "m": "defin-（define去e，界定）+-ition（名词后缀）", "d": "1. n. 定义；界定（5）", "e": "My <mark>definition</mark> revolves around the concept of &quot;stickiness&quot; -creations and experiences to which others adhere."}, {"id": 992, "u": 10, "w": "department", "f": 5, "m": "de-（分出、离开）+part（部分）+-ment（名词后缀）", "d": "1. n. 部门；系（2）；2. n. 大学院系（2）；3. n. 百货（department store：百货商店）（1）", "e": "To the horror of some who expected a Greek Revival twin of the Treasury Building to be erected on the other side of the White House, the elaborate French Second Empire style design by Alfred Mullett was selected, and construction of a building to house all three <mark>departments</mark> began in June of 1871."}, {"id": 993, "u": 10, "w": "deserve", "f": 5, "m": "de-（充分）+serve（服务、做事）", "d": "1. v. 值得；应得到（5）", "e": "&quot;The Heart of the Matter,&quot; the just-released report by the American Academy of Arts and Sciences (AAAS), <mark>deserves</mark> praise for affirming the importance of the humanities and social sciences to the prosperity and security of liberal democracy in America."}, {"id": 994, "u": 10, "w": "differ", "f": 5, "m": "dif-（分开）+fer（携带）", "d": "1. v. 不同，有区别（5）", "e": "&quot;Our findings indicate that people do not only feel different when they are the centre of attention but that their brain reactions also <mark>differ</mark>.&quot;"}, {"id": 995, "u": 10, "w": "distort", "f": 5, "m": "dis-（分开、偏离）+tort（扭曲）", "d": "1. v. 歪曲；使失真（5）", "e": "They could <mark>distort</mark> the achievement-based system of peer-review-led research."}, {"id": 996, "u": 10, "w": "distribute", "f": 5, "m": "dis-（分开、向各处）+tribute（分配）", "d": "1. v. 分发；分配（3）；2. v. 分布；散布（2）", "e": "As Nature has pointed out before, there are some legitimate concerns about how science prizes - both new and old - are <mark>distributed</mark>."}, {"id": 997, "u": 10, "w": "diversity", "f": 5, "m": "divers-（diverse去e，多种多样的、不同的）+-ity（性质、状态）", "d": "1. n. 多样性；多元性（5）", "e": "Progressives often support <mark>diversity</mark> mandates as a path to equality and a way to level the playing field."}, {"id": 998, "u": 10, "w": "divide", "f": 5, "m": "divid（分开、分割）+e（拼写结尾）", "d": "1. v. 分开（3）；2. v. 使产生分歧（2）", "e": "As science and technology progressed, and <mark>divided</mark> into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa."}, {"id": 999, "u": 10, "w": "drop", "f": 5, "m": "", "d": "1. v. (使) 降低（3）；2. v. 取消（1）；3. v. 退学（drop out）（1）", "e": "The average time for holding a stock in both the United States and Britain, he notes, has <mark>dropped</mark> from seven years to seven months in recent decades."}, {"id": 1000, "u": 10, "w": "e-commerce", "f": 5, "m": "e-（electronic的首字母，电子的）+commerce（商业、贸易）", "d": "1. n. 电子商务（5）", "e": "But in some cases, one marketer&#x27;s owned media become another marketer&#x27;s paid media - for instance, when an <mark>e-commerce</mark> retailer sells ad space on its Web site."}, {"id": 1001, "u": 11, "w": "ecosystem", "f": 5, "m": "eco-（生态、生活环境）+system（系统）", "d": "1. n. 生态系统（4）；2. n. 行业生态系统（比喻）（1）", "e": "They did not always prioritize the protection of Mauna Kea&#x27;s fragile <mark>ecosystems</mark> or its holiness to the island&#x27;s inhabitants."}, {"id": 1002, "u": 11, "w": "efficient", "f": 5, "m": "ef-（出）+fic（做）+-ient（具有相应作用或能力的）", "d": "1. adj. 高效的；节约资源的（5）", "e": "According to Sichel, although the falling price of nails was driven partly by cheaper iron and cheaper energy, most of the credit goes to nail manufacturers who simply found more <mark>efficient</mark> ways to turn steel into nails."}, {"id": 1003, "u": 11, "w": "electricity", "f": 5, "m": "electric（电的）+-ity（性质、现象或相应领域的名词形式）", "d": "1. n. 电、电力（5）", "e": "Companies can also optimize their own energy use and cut down on the cost of <mark>electricity</mark>."}, {"id": 1004, "u": 11, "w": "endeavor", "f": 5, "m": "", "d": "1. n. 努力（5）", "e": "AI can be a collaborative tool in a wide range of creative <mark>endeavors</mark>."}, {"id": 1005, "u": 11, "w": "enroll", "f": 5, "m": "en-（使进入）+roll（名单）", "d": "1. v. 注册；入学；报名参加（3）；2. v. 登记加入；招收（2）", "e": "And third, growth was reflected in changes in the proportion of the relevant age group <mark>enrolled</mark> in institutions of higher education."}, {"id": 1006, "u": 11, "w": "enter", "f": 5, "m": "", "d": "1. v. 进入（3）；2. v. 报名参加（1）；3. v. 达成；签订（enter into）（1）", "e": "But exploring one&#x27;s smartphone is more like <mark>entering</mark> his or her home."}, {"id": 1007, "u": 11, "w": "evade", "f": 5, "m": "e-（向外、离开）+vade（走）", "d": "1. v. 逃避；规避（4）；2. v. 使无法理解；难倒（1）", "e": "[ A ] <mark>evade</mark>"}, {"id": 1008, "u": 11, "w": "exchange", "f": 5, "m": "ex-（向外）+change（更换、交换）", "d": "1. n. 交流；交换（思想、信息等）（2）；2. n. （in exchangefor）作为交换（1）；3. n. 交易所；交易市场（1）；4. v. 交换；交流（1）", "e": "[ C ] <mark>exchange</mark>"}, {"id": 1009, "u": 11, "w": "expense", "f": 5, "m": "ex-（向外）+pens（支付；称量）+e（词尾字母）", "d": "1. n. 牺牲；代价（at the expense of）（3）；2. n. 费用；支出（2）", "e": "Copernicus theorized in 1543 that all of the planets that we knew of revolved not around the Earth, but the Sun, a system that was later upheld by Galileo at his own <mark>expense</mark>."}, {"id": 1010, "u": 11, "w": "exploration", "f": 5, "m": "explore（探索，去e）+-ation（行为名词后缀）", "d": "1. n. 探索；探究；研究（4）；2. n. 探险；勘探（1）", "e": "The development of &quot;cloud computing&quot;, meanwhile, has made that <mark>exploration</mark> so much the easier."}, {"id": 1011, "u": 11, "w": "extent", "f": 5, "m": "ex-（向外）+tent（伸展）", "d": "1. n. 程度；范围（5）", "e": "How we read a given text also depends to some <mark>extent</mark> on our particular interest in reading it."}, {"id": 1012, "u": 11, "w": "extreme", "f": 5, "m": "", "d": "1. adj. 极端的；极度的（4）；2. n. 极端（1）", "e": "The parliament also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting <mark>extreme</mark> dieting."}, {"id": 1013, "u": 11, "w": "facility", "f": 5, "m": "facil-（容易的；方便的）+-ity（性质、状态）", "d": "1. n. 设施；场所（5）", "e": "Issues arise, however, when developers attempt to create large-scale short-term rental <mark>facilities</mark>-de facto hotels-to bypass taxes and regulations."}, {"id": 1014, "u": 11, "w": "faculty", "f": 5, "m": "facult（能力、才能）+-y（性质或集合的名词结尾）", "d": "1. n. 大学教职人员（3）；2. n. 大学院系（2）", "e": "In the 1960s and 1970s, European universities saw marked changes in their governance arrangements, with empowerment of junior <mark>faculty</mark> and to some degree of students as well."}, {"id": 1015, "u": 11, "w": "fade", "f": 5, "m": "", "d": "1. v. 逐渐减弱；消退（5）", "e": "Many recruiters say the old disgrace is <mark>fading</mark> for top performers."}, {"id": 1016, "u": 11, "w": "failure", "f": 5, "m": "fail（失败）+-ure（状态、结果的名词后缀）", "d": "1. n. 失败；未能做到（4）；2. n. 故障（1）", "e": "Regrettably, however, the report&#x27;s <mark>failure</mark> to address the true nature of the crisis facing liberal education may cause more harm than good."}, {"id": 1017, "u": 11, "w": "filter", "f": 5, "m": "", "d": "1. v. 过滤；筛选（3）；2. n. 过滤；筛选机制（2）", "e": "The implication is that Millennials prefer news from the White House to be <mark>filtered</mark> through other sources, not a president&#x27;s social media platform."}, {"id": 1018, "u": 11, "w": "finally", "f": 5, "m": "final（最终的、决定性的）+-ly（副词后缀）", "d": "1. adv. 最后；终于（5）", "e": "He <mark>finally</mark> took that post at a major financial institution three years later."}, {"id": 1019, "u": 11, "w": "formal", "f": 5, "m": "form（形式、形状）+al（与……有关的、按这种方式的）", "d": "1. adj. 正式的；正规的（3）；2. adj. 形式上的；结构的（1）；3. adj. 拘礼的；讲究礼节的（1）", "e": "No matter how <mark>formal</mark> or informal the work environment, the way you present yourself has an impact."}, {"id": 1020, "u": 11, "w": "fulfill", "f": 5, "m": "ful（full简写，满、完全）+fill（填满）", "d": "1. v. 履行；实现；满足（要求）（5）", "e": "[ C ] fail to <mark>fulfill</mark> their social responsibilities."}, {"id": 1021, "u": 11, "w": "given", "f": 5, "m": "", "d": "1. adj. 特定的；给定的（3）；2. prep. 考虑到；鉴于（2）", "e": "How we read a <mark>given</mark> text also depends to some extent on our particular interest in reading it."}, {"id": 1022, "u": 11, "w": "governor", "f": 5, "m": "govern（统治、管理）+-or（执行动作的人）", "d": "1. n. 州长（5）", "e": "At the end of 2018, <mark>Governor</mark> Charlie Baker of Massachusetts signed a bill to rein in those potential investor-buyers."}, {"id": 1023, "u": 11, "w": "green", "f": 5, "m": "", "d": "1. adj. 绿色的；有草木的（4）；2. adj. 环保的（1）", "e": "Hill&#x27;s pressure later led to the creation of national parks and <mark>green</mark> belts."}, {"id": 1024, "u": 11, "w": "guide", "f": 5, "m": "", "d": "1. v. 指导；引导（4）；2. n. 准则；指导原则（1）", "e": "But understanding where the animals were first domesticated could <mark>guide</mark> archaeologists to a narrow region to search for insights about the original tamed donkeys."}, {"id": 1025, "u": 11, "w": "holder", "f": 5, "m": "hold（持有、托住）+er（人或物）", "d": "1. n. 持有者（5）", "e": "The Federal Circuit&#x27;s action comes in the wake of a series of recent decisions by the Supreme Court that have narrowed the scope of protections for patent <mark>holders</mark>."}, {"id": 1026, "u": 11, "w": "hormone", "f": 5, "m": "", "d": "1. n. 激素；荷尔蒙（5）", "e": "Neuroscientist Bonnie Auyeung found that the <mark>hormone</mark> oxytocin increased the amount of eye contact from men toward the interviewer during a brief interview when the direction of their gaze was recorded."}, {"id": 1027, "u": 11, "w": "inequality", "f": 5, "m": "in-（不）+equality（相等、平等）", "d": "1. n. 不平等；差距（5）", "e": "Called conditional cash transfers or CCTs, these social assistance programs are designed to reduce <mark>inequality</mark> and break the cycle of poverty."}, {"id": 1028, "u": 11, "w": "insurance", "f": 5, "m": "insure（给……保险，去掉末尾e）+-ance（制度、费用或行业的名词形式）", "d": "1. n. 保险；保障（5）", "e": "<mark>Insurance</mark> companies, meanwhile, can base their premiums on AI models that more accurately assess risk."}, {"id": 1029, "u": 11, "w": "integrate", "f": 5, "m": "integr（完整、整体）+-ate（使成为）", "d": "1. v. 整合；使融入（5）", "e": "(49) As many took on the duty of trying to <mark>integrate</mark> reasoning and scientific philosophies into the world, the Renaissance was over and it was time for a new era-the Age of Reason."}, {"id": 1030, "u": 11, "w": "interested", "f": 5, "m": "interest（使感兴趣；关切、利益）+-ed（处在相应状态的）", "d": "1. adj. 感兴趣的（4）；2. adj. （self-interested）只顾自身利益的（1）", "e": "When social scientists do tackle practical issues, their scope is often local: Belgium is <mark>interested</mark> mainly in the effects of poverty on Belgium, for example."}, {"id": 1031, "u": 11, "w": "interpersonal", "f": 5, "m": "inter-（在……之间、相互）+personal（个人的）", "d": "1. adj. 人际的（5）", "e": "The main disadvantage of using AI to respond to customers is that there are concerns about trusting personal interactions to machines, which could lead not only to the subsequent loss of <mark>interpersonal</mark> connections, but also to a decrease in marketing personnel."}, {"id": 1032, "u": 11, "w": "investor", "f": 5, "m": "invest（投资）+-or（人）", "d": "1. n. 投资者（5）", "e": "But banks&#x27; shares trade below their book value, suggesting that <mark>investors</mark> are skeptical."}, {"id": 1033, "u": 11, "w": "likewise", "f": 5, "m": "like（同样的）+-wise（方式）", "d": "1. adv. 同样地、也（5）", "e": "Labour <mark>likewise</mark> wants to discontinue local planning where councils oppose development."}, {"id": 1034, "u": 11, "w": "loyal", "f": 5, "m": "", "d": "1. adj. 忠诚的（5）", "e": "Employers have long seen the advantages of hiring school leavers who often prove themselves to be more committed and <mark>loyal</mark> employees than graduates."}, {"id": 1035, "u": 11, "w": "memory", "f": 5, "m": "memor（记忆）+-y（名词结尾）", "d": "1. n. 记忆；记忆力（3）；2. n. 回忆；记忆中的事（1）；3. n. 怀念（1）", "e": "As many people hit middle age, they often start to notice that their <mark>memory</mark> and mental clarity are not what they used to be."}, {"id": 1036, "u": 11, "w": "millennial", "f": 5, "m": "millenni（millennium去um，千年）+-al（有关的）", "d": "1. n. 千禧一代（1981-1996年出生的人）（5）", "e": "<mark>Millennials</mark> were told that if you did well in school, got a decent degree, you would be set up for life."}, {"id": 1037, "u": 11, "w": "modest", "f": 5, "m": "mod（尺度）+est（形容词结尾）", "d": "1. adj. 不太大的；有限的；适度的（3）；2. adj. 谦虚的，谦逊的（1）；3. adj. 谦逊克制的（1）", "e": "Politicians have repeatedly &quot;backloaded&quot; public-sector pay deals, keeping the pay increases <mark>modest</mark> but adding to holidays and especially pensions that are already generous."}, {"id": 1038, "u": 11, "w": "modify", "f": 5, "m": "mod（方式、尺度）+-ify（使成为、使符合）", "d": "1. v. 修改；调整；改变（5）", "e": "(47) The United States is the product of two principal forces -the immigration of European peoples with their varied ideas, customs, and national characteristics and the impact of a new country which <mark>modified</mark> these traits."}, {"id": 1039, "u": 11, "w": "native", "f": 5, "m": "nat（出生）+-ive（具有这种来源或性质的；这里也可指人）", "d": "1. adj. 本地的；土生的（3）；2. n. 原住民（digitalnatives：数字原住民）（1）；3. adj. 美洲原住民的（1）", "e": "(49) A <mark>native</mark> literary drama had been created, its alliance with the public playhouses established, and at least some of its great traditions had been begun."}, {"id": 1040, "u": 11, "w": "objection", "f": 5, "m": "object（反对）+-ion（态度、行为或理由的名词后缀）", "d": "1. n. 反对、异议（5）", "e": "The only major <mark>objection</mark> came from Justice Antonin Scalia, who offered an even more robust defense of state privileges going back to the Alien and Sedition Acts."}, {"id": 1041, "u": 11, "w": "obviously", "f": 5, "m": "obvious（明显的）+-ly（以这种方式）", "d": "1. adv. 显然，明显地（5）", "e": "The growth of the use of English as the world&#x27;s primary language for international communication has <mark>obviously</mark> been continuing for several decades."}, {"id": 1042, "u": 11, "w": "operate", "f": 5, "m": "oper（工作、操作）+-ate（动词后缀）", "d": "1. v. 运营、运作（4）；2. v. 经营；运营（1）", "e": "As a condition of receiving state approval for the sale, the company agreed to seek permission from state regulators to <mark>operate</mark> past 2012."}, {"id": 1043, "u": 11, "w": "opponent", "f": 5, "m": "op-（相对）+pon（放置）+ent（相应的人）", "d": "1. n. 对手；反对者（5）", "e": "There is pressure for change from within the profession, but <mark>opponents</mark> of change among the regulators insist that keeping outsiders out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically."}, {"id": 1044, "u": 11, "w": "outdated", "f": 5, "m": "out-（超出、不再处于）+dat（date去e，日期、年代）+-ed（处在这种状态的）", "d": "1. adj. 过时的（5）", "e": "She uses <mark>outdated</mark> research and decades-old examples to undermine the noble mission of organizations committed to connecting children to a world beyond their own."}, {"id": 1045, "u": 11, "w": "owe", "f": 5, "m": "", "d": "1. v. 归因于；多亏（owe to / owing to）（4）；2. v. 欠；应付（1）", "e": "Its current leader, Ed Miliband, <mark>owes</mark> his position to votes from public-sector unions."}, {"id": 1046, "u": 11, "w": "panel", "f": 5, "m": "", "d": "1. n. 专门小组；评审小组（2）；2. n. 太阳能板（2）；3. n. 门板（1）", "e": "The SBoRE <mark>panel</mark> will then find external statisticians to review these manuscripts."}, {"id": 1047, "u": 11, "w": "parallel", "f": 5, "m": "par-（para-去a，在旁边）+allel-（彼此）", "d": "1. adj. 相似的；对应的（3）；2. adv. 与……平行（1）；3. adj. 同时发生的（1）", "e": "A <mark>parallel</mark> situation exists in respect of predatory mammals and fish-eating birds."}, {"id": 1048, "u": 11, "w": "participation", "f": 5, "m": "participate（去掉末尾e，参与、参加）+-ion（行为或过程）", "d": "1. n. 参与（5）", "e": "Innovation and research have relied on public <mark>participation</mark> in science for centuries."}, {"id": 1049, "u": 11, "w": "passionate", "f": 5, "m": "passion（激情、强烈感情）+ate（具有这种性质的）", "d": "1. adj. 热情的；充满激情的（5）", "e": "If that happens, <mark>passionate</mark> consumers would try to persuade others to boycott products, putting the reputation of the target company at risk."}, {"id": 1050, "u": 11, "w": "patience", "f": 5, "m": "pati-（承受、忍受）+-ence（状态、能力）", "d": "1. n. 耐心（5）", "e": "It gives us <mark>patience</mark> for ourselves and toward others as well as <mark>patience</mark> while driving, catching a fish, working on our car, or raising a child."}, {"id": 1051, "u": 11, "w": "peculiar", "f": 5, "m": "peculi（私人财产、个人专属）+-ar（有关的）", "d": "1. adj. 特有的（3）；2. adj. 奇怪的；不同寻常的（2）", "e": "Each of these manifestations of growth carried its own <mark>peculiar</mark> problems in its wake."}, {"id": 1052, "u": 11, "w": "perspective", "f": 5, "m": "per-（通过）+spect（看）+ive（本词名词结尾）", "d": "1. n. 视角；观点（4）；2. n. 客观的认识；对轻重缓急的判断（1）", "e": "They cross-check sources and prefer news from different <mark>perspectives</mark> - especially those that are open about any bias."}, {"id": 1053, "u": 11, "w": "planning", "f": 5, "m": "plan（计划，双写n）+-ing（活动；过程）", "d": "1. n. 规划；筹划（5）", "e": "Labour likewise wants to discontinue local <mark>planning</mark> where councils oppose development."}, {"id": 1054, "u": 11, "w": "please", "f": 5, "m": "", "d": "1. adv. 请（礼貌用语）（3）；2. v. 使高兴；使满意（1）；3. v. 愿意；喜欢（1）", "e": "<mark>Please</mark> let me know what I can do."}, {"id": 1055, "u": 11, "w": "pledge", "f": 5, "m": "", "d": "1. n. 承诺；保证（5）", "e": "It also <mark>pledged</mark> not to deploy AI whose use would violate international laws or human rights."}, {"id": 1056, "u": 11, "w": "pool", "f": 5, "m": "", "d": "1. v. 汇集（2）；2. n. 储备群体（1）；3. n. 有限领域（比喻）（1）；4. n. 水池（1）", "e": "(50) They <mark>pool</mark> resources, collaborate, think outside the box, and find solutions and ways around obstacles to explore science for the sake of science without the traditional boundaries of working inside a formal setting."}, {"id": 1057, "u": 11, "w": "postgraduate", "f": 5, "m": "post-（在……之后）+graduate（大学毕业生）", "d": "1. n. 研究生（5）", "e": "<mark>Postgraduates</mark> now earn 40 per cent more than graduates."}, {"id": 1058, "u": 11, "w": "praise", "f": 5, "m": "", "d": "1. n. 赞扬（3）；2. v. 赞扬（2）", "e": "The networked computer is an amazing device, the first media machine that serves as the mode of production, means of distribution, site of reception, and place of <mark>praise</mark> and critique."}, {"id": 1059, "u": 11, "w": "primarily", "f": 5, "m": "primari-（primary的y变i，主要的、首要的、最初的）+-ly（以这种方式、在这种情况下）", "d": "1. adv. 主要地；首要地（5）", "e": "Oxytocin is made <mark>primarily</mark> in the central lower part of the brain, and some of it is released into the bloodstream."}, {"id": 1060, "u": 11, "w": "progressive", "f": 5, "m": "progress（前进、进步）+-ive（具有这种性质的）", "d": "1. adj. 进步主义的；进步的（4）；2. n. 进步主义者（1）", "e": "Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;<mark>progressive</mark>,&quot; or left-liberal propaganda."}, {"id": 1061, "u": 11, "w": "proper", "f": 5, "m": "", "d": "1. adj. 恰当的；合适的（4）；2. adj. 正规的（1）", "e": "The details may be unknowable, but the independence of standard-setters, essential to the <mark>proper</mark> functioning of capital markets, is being compromised."}, {"id": 1062, "u": 11, "w": "properly", "f": 5, "m": "proper（适当的、正确的）+-ly（副词后缀）", "d": "1. adv. 恰当地；正确地（5）", "e": "As a fellow environmentalist, animal-protection advocate and longtime vegetarian, I could <mark>properly</mark> be in the same camp as Emma Marris on the issue of zoos."}, {"id": 1063, "u": 11, "w": "property", "f": 5, "m": "proper（自身的、固有的）+-ty（性质或相关事物的名词后缀）", "d": "1. n. 财产；资产（3）；2. n. 媒体资产；媒体平台（1）；3. n. （intellectualproperty）知识产权（1）", "e": "Each spouse retains __16__ <mark>property</mark> he or she __17__ into the marriage, and jointly-acquired <mark>property</mark> is __18__ equally."}, {"id": 1064, "u": 11, "w": "prosperity", "f": 5, "m": "prosper（成功、繁荣）+-ity（状态）", "d": "1. n. 繁荣；富足（5）", "e": "Stringent job dismissal regulations adversely affect productivity growth and hamper both <mark>prosperity</mark> and overall well-being."}, {"id": 1065, "u": 11, "w": "pursue", "f": 5, "m": "pursu（追赶、追求）+e（动词结尾）", "d": "1. v. 追求；致力于（3）；2. v. 从事（职业）（1）；3. v. 攻读（学位）（1）", "e": "Rather than cloaking his exit in the usual vague excuses, he came right out and said he was leaving &quot;to <mark>pursue</mark> my goal of running a company.&quot;"}, {"id": 1066, "u": 11, "w": "quit", "f": 5, "m": "", "d": "1. v. 辞职；离职（4）；2. v. 离开；退出（1）", "e": "The decision to <mark>quit</mark> a senior position to look for a better one is unconventional."}, {"id": 1067, "u": 11, "w": "quota", "f": 5, "m": "quot（多少、数量）+a（本词的名词结尾）", "d": "1. n. 配额、规定名额（5）", "e": "That is exactly what happened when Norway adopted a nationwide corporate gender <mark>quota</mark>."}, {"id": 1068, "u": 11, "w": "rarely", "f": 5, "m": "rare（稀有的、难得的、少见的）+-ly（说明方式或程度的副词后缀）", "d": "1. adv. 很少、难得（5）", "e": "Many of the ships were lost in storms, many passengers died of disease, and infants <mark>rarely</mark> survived the journey."}, {"id": 1069, "u": 11, "w": "recover", "f": 5, "m": "", "d": "1. v. 恢复；康复（4）；2. v. 回收；找回（1）", "e": "[ A ] <mark>recover</mark>"}, {"id": 1070, "u": 11, "w": "reduction", "f": 5, "m": "re-（往回）+duct（引导）+-ion（过程或结果的名词后缀）", "d": "1. n. 减少；降低（5）", "e": "&quot;We see that the program is associated with a 30 percent <mark>reduction</mark> in deforestation,&quot; Ferraro says."}, {"id": 1071, "u": 11, "w": "refer", "f": 5, "m": "re-（回）+fer（携带、带来）", "d": "1. v. 指的是、涉及（2）；2. v. 称作（refer toas）（2）；3. v. 参考、查阅（1）", "e": "With Britain voting to leave the European Union, and GDP already predicted to slow as a result, it is now a timely moment to assess what he was <mark>referring</mark> to."}, {"id": 1072, "u": 11, "w": "regarding", "f": 5, "m": "regard（考虑）+-ing（本词构成介词的词形）", "d": "1. prep. 关于；涉及（5）", "e": "In contrast to France&#x27;s actions, Denmark&#x27;s fashion industry agreed last month on rules and sanctions <mark>regarding</mark> the age, health, and other characteristics of models."}, {"id": 1073, "u": 11, "w": "regular", "f": 5, "m": "reg（规则）+ular（本词的形容词词形）", "d": "1. adj. 定期的；经常的（3）；2. adj. 整齐的；排列匀称的（1）；3. adj. 正常的；普通的；常规的（1）", "e": "In 2007, Indonesia started phasing in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get <mark>regular</mark> medical care."}, {"id": 1074, "u": 11, "w": "regulate", "f": 5, "m": "reg（规则、管理）+ul（词干衔接部分）+-ate（使成为）", "d": "1. v. 管理；管制（5）", "e": "The order also declared that state and local governments couldn&#x27;t <mark>regulate</mark> broadband providers either."}, {"id": 1075, "u": 11, "w": "regulator", "f": 5, "m": "regulat-（regulate去e，监管）+-or（执行者或装置）", "d": "1. n. 监管者、监管机构（5）", "e": "Financial <mark>regulators</mark> in Britain have imposed a rather unusual rule on the bosses of big banks."}, {"id": 1076, "u": 11, "w": "reject", "f": 5, "m": "re-（向回）+ject（投、掷）", "d": "1. v. 拒绝、否定（5）", "e": "Every Justice rightly <mark>rejected</mark> this remarkable claim."}, {"id": 1077, "u": 11, "w": "reliable", "f": 5, "m": "rely（y变i，依靠、信赖）+-able（能够、值得……的）", "d": "1. adj. 可靠的；可信赖的（5）", "e": "&quot;Machine learning often provides a more <mark>reliable</mark> form of statistics which makes data more valuable,&quot; says Winston."}, {"id": 1078, "u": 11, "w": "religious", "f": 5, "m": "religi（religion的词干，宗教）+-ous（有关的）", "d": "1. adj. 宗教的；宗教信仰的（5）", "e": "(46) By the date of his birth Europe was witnessing the passing of the <mark>religious</mark> drama, and the creation of new forms under the incentive of classical tragedy and comedy."}, {"id": 1079, "u": 11, "w": "reluctant", "f": 5, "m": "re-（向回、反向）+luct（挣扎、抵抗）+ant（具有这种状态的）", "d": "1. adj. 不情愿的；勉强的（5）", "e": "And dead markets partly reflect the paralysis of banks which will not sell assets for fear of booking losses, yet are <mark>reluctant</mark> to buy all those supposed bargains."}, {"id": 1080, "u": 11, "w": "remarkable", "f": 5, "m": "remark（注意到、评论）+-able（值得……的）", "d": "1. adj. 显著的；非凡的（5）", "e": "Every Justice rightly rejected this <mark>remarkable</mark> claim."}, {"id": 1081, "u": 11, "w": "restriction", "f": 5, "m": "restrict（限制、约束）+-ion（行为、状态或措施）", "d": "1. n. 限制；约束（5）", "e": "In the information era, large data sets, small teams and financial <mark>restrictions</mark> have slowed scientific process."}, {"id": 1082, "u": 11, "w": "revival", "f": 5, "m": "revive（去e，复活、复苏）+-al（过程、结果）", "d": "1. n. 复兴；复苏；重新兴起（4）；2. n. （建筑等风格的）复兴式（1）", "e": "Is there any chance that Cardus&#x27;s criticism will enjoy a <mark>revival</mark>?"}, {"id": 1083, "u": 11, "w": "revive", "f": 5, "m": "re-（重新）+vive（活、生存）", "d": "1. v. 使恢复；复兴（5）", "e": "Some will say the audiobook boom <mark>revives</mark> it, though I suppose you can then worry about the decline of reading."}, {"id": 1084, "u": 11, "w": "ruin", "f": 5, "m": "", "d": "1. v. 毁坏；毁掉（4）；2. n. 废墟；毁坏的残迹（1）", "e": "Why <mark>ruin</mark> rural ones?"}, {"id": 1085, "u": 11, "w": "sample", "f": 5, "m": "", "d": "1. n. 样本；标本（4）；2. v. 取样；抽样勘探（1）", "e": "(48) Scientists have employed a variety of ways to engage the general public in their research, such as making data analysis into an online game or <mark>sample</mark> collection into a smartphone application."}, {"id": 1086, "u": 11, "w": "satisfy", "f": 5, "m": "satis（足够）+-fy（做成、使成为）", "d": "1. v. 满足（4）；2. v. 使满意（1）", "e": "That said, there is a way in which grade forgiveness <mark>satisfies</mark> colleges&#x27; own needs as well."}, {"id": 1087, "u": 11, "w": "scene", "f": 5, "m": "scen（场景、舞台）+e（词形结尾）", "d": "1. n. 发生地；现场（2）；2. n. 场景；情景（1）；3. n. 幕后（behindthe scenes）（1）；4. n. 活动领域；文艺舞台（1）", "e": "Between 1807 and 1814 the Iberian Peninsula (comprising Spain and Portugal) was the <mark>scene</mark> of a titanic and merciless struggle."}, {"id": 1088, "u": 11, "w": "scheme", "f": 5, "m": "", "d": "1. n. 计划；方案（5）", "e": "What prompted the chancellor to develop his <mark>scheme</mark>?"}, {"id": 1089, "u": 11, "w": "scope", "f": 5, "m": "", "d": "1. n. 范围（5）", "e": "This narrowing of the regulatory <mark>scope</mark> was a victory for builders, mining operators and other commercial interests often at odds with environmental rules."}, {"id": 1090, "u": 11, "w": "sculpture", "f": 5, "m": "sculpt-（雕刻）+-ure（行为或结果）", "d": "1. n. 雕塑、雕塑作品（5）", "e": "So van Oosten and colleagues worked to preserve Gilardi&#x27;s <mark>sculptures</mark>."}, {"id": 1091, "u": 11, "w": "senate", "f": 5, "m": "sen（年长、资深）+ate（集体、机构）", "d": "1. n. 参议院（5）", "e": "Enraged by Entergy&#x27;s behavior, the Vermont <mark>Senate</mark> voted 26 to 4 last year against allowing an extension."}, {"id": 1092, "u": 11, "w": "sentiment", "f": 5, "m": "sent（感觉、感受）+i（连接字母）+-ment（状态、内容的名词后缀）", "d": "1. n. 情绪；看法（5）", "e": "At the next election none of the big parties seem likely to endorse this <mark>sentiment</mark>."}, {"id": 1093, "u": 11, "w": "setting", "f": 5, "m": "set（安放；落下）+-ing（过程、结果或周围条件的名词后缀）", "d": "1. n. 环境；背景；场合（3）；2. n. 制定；设定（规则、目标等）（1）；3. n. 设置；调节位置（1）", "e": "In some <mark>settings</mark>, red sneakers or dress T-shirts can convey status; in others not so much."}, {"id": 1094, "u": 11, "w": "ship", "f": 5, "m": "", "d": "1. v. 运送、发货（3）；2. n. 船（2）", "e": "Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a purchase is being <mark>shipped</mark> to."}, {"id": 1095, "u": 11, "w": "shock", "f": 5, "m": "", "d": "1. n. 震惊；惊愕（2）；2. v. 使震惊（2）；3. adj. 令人震惊的；极差的（1）", "e": "No <mark>shock</mark> there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake."}, {"id": 1096, "u": 11, "w": "shoe", "f": 5, "m": "", "d": "1. n. 处境；立场（in one&#x27;s shoes）（4）；2. n. 鞋（1）", "e": "They were comfortable in describing different emotional states and part of what you do in drama is put yourself in different <mark>shoes</mark>.&quot;"}, {"id": 1097, "u": 11, "w": "shot", "f": 5, "m": "", "d": "1. n. 照片、镜头（5）", "e": "He typically takes between 10,000 and 20,000 <mark>shots</mark> to get one butterfly take-off sequence in focus."}, {"id": 1098, "u": 11, "w": "sophisticated", "f": 5, "m": "sophisticate（使世故；使复杂，去e）+-ed（形容词后缀）", "d": "1. adj. 复杂精巧的；先进的（3）；2. adj. 复杂精深的（1）；3. adj. 高级的；较为精深的（1）", "e": "AI &quot;vision&quot; today is not nearly as <mark>sophisticated</mark> as that of humans."}, {"id": 1099, "u": 11, "w": "sort", "f": 5, "m": "", "d": "1. v. 分类（2）；2. adj. 某种程度上的（of sorts）（1）；3. n. 种,类（1）；4. v. 解决；弄清（sort out）（1）", "e": "For a generation, the collective doctrine has been that the <mark>sorting</mark> mechanism of society should be profit."}, {"id": 1100, "u": 11, "w": "southern", "f": 5, "m": "south（南方）+-ern（位于某方向或与之有关的）", "d": "1. adj. 南部的（5）", "e": "There is no doubt of the alternative - the corrupted landscapes of <mark>southern</mark> Portugal, Spain or Ireland."}, {"id": 1101, "u": 12, "w": "spot", "f": 5, "m": "", "d": "1. n. 地点；位置（2）；2. v. 发现；看出（2）；3. v. 准确的；切中要害的（spot-on）（1）", "e": "When we look at a face or a picture, our eyes pause on one <mark>spot</mark> at a time, often on the eyes or mouth."}, {"id": 1102, "u": 12, "w": "stake", "f": 5, "m": "", "d": "1. n. 利益、利害关系（2）；2. n. 划定并主张占有（stake out）（1）；3. n. 处于危险中、成败在此（at stake）（1）；4. v. 划定并主张占有（stake out）（1）", "e": "The alliances are most valuable when scientists and artists have a shared <mark>stake</mark> in a project, are able to jointly design it and can critique each other&#x27;s work."}, {"id": 1103, "u": 12, "w": "statistician", "f": 5, "m": "statistic-（statistics去掉末尾s，统计学）+ian（从事相关专业的人）", "d": "1. n. 统计学家（5）", "e": "The SBoRE panel will then find external <mark>statisticians</mark> to review these manuscripts."}, {"id": 1104, "u": 12, "w": "straight", "f": 5, "m": "", "d": "1. adv. 径直地；直接地（2）；2. adj. 坦率的；诚实的（1）；3. adj. 直的；不弯曲的（1）；4. adj. 连续的（1）", "e": "__1__ of us just walk <mark>straight</mark> into the woods without a phone."}, {"id": 1105, "u": 12, "w": "strategy", "f": 5, "m": "strat（军队）+eg（引领）+-y（方法、活动）", "d": "1. n. 策略；战略（5）", "e": "India released its AI ethics <mark>strategy</mark> this spring."}, {"id": 1106, "u": 12, "w": "strengthen", "f": 5, "m": "strength（力量）+-en（使成为的动词后缀）", "d": "1. v. 加强；增强；巩固（5）", "e": "[ D ] <mark>strengthen</mark> coordination with other states."}, {"id": 1107, "u": 12, "w": "suggestion", "f": 5, "m": "suggest（建议、暗示）+-ion（提出的行为或内容）", "d": "1. n. 建议（4）；2. n. 说法；暗示（1）", "e": "2)provide some <mark>suggestions</mark> for their campus life here."}, {"id": 1108, "u": 12, "w": "suitable", "f": 5, "m": "suit（适合、相配）+-able（能够具有这种性质的）", "d": "1. adj. 合适的、适宜的（5）", "e": "What intrinsic factors make the West a <mark>suitable</mark> home for these artifacts but preclude them from being preserved and displayed by their countries of origin?"}, {"id": 1109, "u": 12, "w": "surface", "f": 5, "m": "sur-（在上）+face（面、表面）", "d": "1. n. 表面（4）；2. v. 浮现；显露（1）", "e": "Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;continuous <mark>surface</mark> connection&quot; to bodies of water."}, {"id": 1110, "u": 12, "w": "sustain", "f": 5, "m": "sus-（在下）+tain（保持、持有）", "d": "1. v. 维持；支撑（5）", "e": "The most loyal customers would still get the product they favor, the idea goes, and they&#x27;d feel like they were helping <mark>sustain</mark> the quality of something they believe in."}, {"id": 1111, "u": 12, "w": "technique", "f": 5, "m": "techn（技艺）+-ique（名词结尾）", "d": "1. n. 技术；方法；技巧（5）", "e": "One inventor patented a <mark>technique</mark> for lifting a box."}, {"id": 1112, "u": 12, "w": "threaten", "f": 5, "m": "threat（威胁）+-en（动词后缀）", "d": "1. v. 威胁；危及（3）；2. v. 有可能发生；有……的危险（2）", "e": "Who will be most <mark>threatened</mark> by automation?"}, {"id": 1113, "u": 12, "w": "tough", "f": 5, "m": "", "d": "1. adj. 强硬的；严格的（5）", "e": "It is as though 20 years of ever-<mark>tougher</mark> reforms of the job search and benefit administration system never happened."}, {"id": 1114, "u": 12, "w": "traffic", "f": 5, "m": "", "d": "1. n. 流量（网站或网络）（5）", "e": "We define such sold media as owned media whose <mark>traffic</mark> is so strong that other organizations place their content or e-commerce engines within that environment."}, {"id": 1115, "u": 12, "w": "transition", "f": 5, "m": "trans-（越过）+it-（走）+-ion（行为、过程）", "d": "1. n. 转变、过渡（5）", "e": "In previous eras of drastic technological change, entrepreneurs smoothed the <mark>transition</mark> by dreaming up ways to combine labor and machines."}, {"id": 1116, "u": 12, "w": "trigger", "f": 5, "m": "", "d": "1. v. 触发；引发（5）", "e": "In people who score high in a test of neuroticism, a personality dimension associated with self-consciousness and anxiety, eye contact <mark>triggered</mark> more activity associated with avoidance, according to the Finnish researcher Jari Hietanen and colleagues."}, {"id": 1117, "u": 12, "w": "typical", "f": 5, "m": "typ-（type去e，类型）+-ical（形容词后缀）", "d": "1. adj. 典型的；通常的（5）", "e": "We know that a <mark>typical</mark> infant will instinctively gaze into its mother&#x27;s eyes, and she will look back."}, {"id": 1118, "u": 12, "w": "underestimate", "f": 5, "m": "under-（低于、在……之下）+estimate（估计）", "d": "1. v. 低估（5）", "e": "But she <mark>underestimates</mark> the educational value of zoos."}, {"id": 1119, "u": 12, "w": "unemployment", "f": 5, "m": "un-（不、没有）+employment（有工作、受雇做事的状态）", "d": "1. n. 失业、失业状况（5）", "e": "By most recent measures, the UK&#x27;s GDP has been the envy of the Western world, with record low <mark>unemployment</mark> and high growth figures."}, {"id": 1120, "u": 12, "w": "unfortunately", "f": 5, "m": "un-（不）+fortunate（幸运的）+-ly（副词后缀）", "d": "1. adv. 不幸地；遗憾地（5）", "e": "<mark>Unfortunately</mark>, these critics are virtually forgotten."}, {"id": 1121, "u": 12, "w": "universal", "f": 5, "m": "universe（宇宙、整体，去末尾e）+al（与……有关的）", "d": "1. adj. 普遍的；普遍适用的（4）；2. n. 普遍规律；普遍特征（1）", "e": "As degrees became <mark>universal</mark>, they became devalued."}, {"id": 1122, "u": 12, "w": "voice", "f": 5, "m": "voic（呼喊、发声）+e（词形结尾）", "d": "1. n. 声音（2）；2. v. 表达（意见）（2）；3. n. 发声；代言（1）", "e": "Mental health has commonly been called conscience, instinct, wisdom, common sense, or the inner <mark>voice</mark>."}, {"id": 1123, "u": 12, "w": "warrant", "f": 5, "m": "warr（保护、保证）+-ant（凭据或保证行为的词形结尾）", "d": "1. n. 逮捕令；搜查令（5）", "e": "In many cases, it would not be overly burdensome for authorities to obtain a <mark>warrant</mark> to search through phone contents."}, {"id": 1124, "u": 12, "w": "weaken", "f": 5, "m": "weak（弱的）+-en（使成为的动词后缀）", "d": "1. v. 削弱；减弱（5）", "e": "It is like the immune system of the body, which under stress or through lack of nutrition or exercise can be <mark>weakened</mark>, but which never leaves us."}, {"id": 1125, "u": 12, "w": "wing", "f": 5, "m": "", "d": "1. v. 侧翼、建筑物侧楼（3）；2. n. 侧翼、建筑物侧楼（1）；3. n. 翅膀（1）", "e": "[ F ] Construction took 17 years as the building slowly rose <mark>wing</mark> by <mark>wing</mark>."}, {"id": 1126, "u": 12, "w": "wonder", "f": 5, "m": "", "d": "1. v. 想知道、感到疑惑（3）；2. n. 奇怪的事、令人惊讶的事（1）；3. v. 惊叹（1）", "e": "Unhappy parents rarely are provoked to <mark>wonder</mark> if they shouldn&#x27;t have had kids, but unhappy childless folks are bothered with the message that children are the single most important thing in the world: obviously their misery must be a direct result of the gaping baby-size holes in their lives."}, {"id": 1127, "u": 12, "w": "acquire", "f": 4, "m": "ac-（向）+quir（寻求）+e（拼写结尾）", "d": "1. v. 获得、取得（3）；2. v. 习得；学会（1）", "e": "Each spouse retains __16__ property he or she __17__ into the marriage, and jointly-<mark>acquired</mark> property is __18__ equally."}, {"id": 1128, "u": 12, "w": "active", "f": 4, "m": "act（行动）+-ive（具有这种性质或状态的）", "d": "1. adj. 积极主动的（4）", "e": "Such <mark>active</mark> research can have another effect."}, {"id": 1129, "u": 12, "w": "actor", "f": 4, "m": "act（表演、行动）+-or（做这件事的人）", "d": "1. n. 演员（4）", "e": "&quot;The research shows that the way <mark>actors</mark> work makes a big difference to the way children use language and also how they think about themselves,&quot; Jacqui O&#x27;Hanlon of the Royal Shakespeare Company (RSC), which commissioned the study, said."}, {"id": 1130, "u": 12, "w": "actual", "f": 4, "m": "act（做、落实）+-ual（具有相应性质的形容词结尾）", "d": "1. adj. 实际的；真实的（4）", "e": "About a third say the problem of fake news lies in &quot;misinterpretation or exaggeration of <mark>actual</mark> news&quot; via social media."}, {"id": 1131, "u": 12, "w": "addition", "f": 4, "m": "addit（add的词干形式，增加）+-ion（行为；结果）", "d": "1. n. 此外；另外（in addition）（2）；2. n. 除……之外还（in addition to）（2）", "e": "In <mark>addition</mark>, new digital technologies have allowed more rapid trading of equities, quicker use of information, and thus shorter attention spans in financial markets."}, {"id": 1132, "u": 12, "w": "advanced", "f": 4, "m": "advance（前进、推进）+-ed（处在相应状态的）", "d": "1. adj. 先进的；高级的（4）", "e": "Specific brain regions that respond during direct gaze are being explored by other researchers, using <mark>advanced</mark> methods of brain scanning."}, {"id": 1133, "u": 12, "w": "aid", "f": 4, "m": "", "d": "1. v. 帮助；援助（3）；2. n. 创可贴（band-aid 的组成部分，比喻临时应急措施）（1）", "e": "Here are a few ways AI is <mark>aiding</mark> companies without replacing employees:"}, {"id": 1134, "u": 12, "w": "analog", "f": 4, "m": "", "d": "1. adj. 模拟的；非数字的（4）", "e": "Digital information requires a great deal more care than <mark>analog</mark>."}, {"id": 1135, "u": 12, "w": "analyst", "f": 4, "m": "", "d": "1. n. 分析师、分析人员（4）", "e": "The losers, said retail <mark>analyst</mark> Neil Saunders, are online-only retailers, especially smaller ones."}, {"id": 1136, "u": 12, "w": "anticipate", "f": 4, "m": "anti-（在前）+cip-（取、拿）+-ate（做出这种动作）", "d": "1. v. 预料；预期（4）", "e": "And to <mark>anticipate</mark> every imaginable driving situation is a difficult programming problem."}, {"id": 1137, "u": 12, "w": "anxious", "f": 4, "m": "", "d": "1. adj. 焦
