ecessary agro-technological tools to eradicate hunger, from genetically engineered crops to artificial <mark>fertilizers</mark>."}, {"id": 2698, "u": 27, "w": "fever", "f": 1, "m": "", "d": "1. n. 狂热（1）", "e": "A cynic might speculate that the UK is on the verge of disappearing into an endless <mark>fever</mark> of self-celebration in its desperation to reinvent itself for the post-Brexit world: after town of culture, who knows what will follow-village of culture?"}, {"id": 2699, "u": 27, "w": "financially", "f": 1, "m": "financial（财务的、经济方面的）+ly（在这一方面）", "d": "1. adv. 经济上；财务上（1）", "e": "It is <mark>financially</mark> terrifying, psychologically embarrassing and you know that support is minimal and extraordinarily hard to get."}, {"id": 2700, "u": 27, "w": "fiscal", "f": 1, "m": "", "d": "1. adj. 财政的（1）", "e": "It reported a net loss of $5.6 billion for <mark>fiscal</mark> 2016, the 10th straight year its expenses have exceeded revenue."}, {"id": 2701, "u": 28, "w": "fishery", "f": 1, "m": "fish（鱼；捕鱼）+-ery（场所；行业）", "d": "1. n. 渔业（1）", "e": "[ B ] It has triggered a radical reform in commercial <mark>fisheries</mark>."}, {"id": 2702, "u": 28, "w": "fitness", "f": 1, "m": "fit（合适的、能胜任的、身体健康的）+-ness（性质、状态的名词后缀）", "d": "1. n. 健康；健身（1）", "e": "But __1__ some claims to the contrary, laughing probably has little influence on physical <mark>fitness</mark>."}, {"id": 2703, "u": 28, "w": "fixed", "f": 1, "m": "fix（固定）+-ed（动作后的状态）", "d": "1. adj. 固定不变的；僵硬的（1）", "e": "The thought of holding a <mark>fixed</mark> grin as the camera performed its magical duties was too much to contemplate, and so a non-committal blank stare became the norm."}, {"id": 2704, "u": 28, "w": "flee", "f": 1, "m": "", "d": "1. v. 逃离（1）", "e": "Yet two years before Dickens&#x27;s birth, his mother&#x27;s father was caught stealing and <mark>fled</mark> to Europe, never to return."}, {"id": 2705, "u": 28, "w": "flip", "f": 1, "m": "", "d": "1. v. 转手牟利（1）", "e": "Communities throughout New England have been tir children&#x27;s interest in conservation, they cannot replace the excitement of a zoo visit as an intense, immersive and <mark>interactive</mark> experience."}, {"id": 2810, "u": 29, "w": "interior", "f": 1, "m": "inter（内部）+-ior（较……的）", "d": "1. adj. 内部的、室内的（1）", "e": "Almost all of the <mark>interior</mark> detail is of cast iron or plaster; the use of wood was minimized to insure fire safety."}, {"id": 2811, "u": 29, "w": "interpret", "f": 1, "m": "", "d": "1. v. 解释；理解（1）", "e": "(50) One could <mark>interpret</mark> much of the work of Beethoven by saying that suffering is inevitable, but the courage to fight it renders life worth living."}, {"id": 2812, "u": 29, "w": "interviewee", "f": 1, "m": "interview（采访、面试）+-ee（接受这个动作的人）", "d": "1. n. 接受面试者（1）", "e": "Dr Simonsohn found if the score of the previous candidate in a daily series of <mark>interviewees</mark> was 0.75 points or more higher than that of the one __17__ that, then the score for the next applicant would __18__ by an average of 0.075 points."}, {"id": 2813, "u": 29, "w": "intrude", "f": 1, "m": "in-（向内）+trud（推、挤）+e（词形结尾）", "d": "1. v. 侵犯；侵入（1）", "e": "On the overturned provisions the majority held Congress had deliberately &quot;occupied the field&quot; and Arizona had thus <mark>intruded</mark> on the federal&#x27;s privileged powers."}, {"id": 2814, "u": 29, "w": "invalid", "f": 1, "m": "in-（不）+valid（有效的；强健的）", "d": "1. adj. 无效的（1）", "e": "Now the company is suddenly claiming that the 2002 agreement is <mark>invalid</mark> because of the 2006 legislation, and that only the federal government has regulatory power over nuclear issues."}, {"id": 2815, "u": 29, "w": "invert", "f": 1, "m": "in-（向内）+vert（转）", "d": "1. v. 颠倒、逆转（1）", "e": "&quot;The traditional rule was it&#x27;s safer to stay where you are, but that&#x27;s been fundamentally <mark>inverted</mark>,&quot; says one headhunter."}, {"id": 2816, "u": 29, "w": "invisible", "f": 1, "m": "in-（不）+visible（看得见的）", "d": "1. adj. 无形的（1）", "e": "The  29, "w": "mature", "f": 1, "m": "matur（成熟、长成）+e（词形结尾）", "d": "1. adj. 成熟的、完善的（1）", "e": "But it takes collective scrutiny and acceptance to transform a discovery claim into a <mark>mature</mark> discovery."}, {"id": 2876, "u": 29, "w": "maximize", "f": 1, "m": "maxim-（maximum去掉末尾um，最大）+-ize（使成为）", "d": "1. v. 使最大化（1）", "e": "Replacing swing doors, these __11__ smaller buildings to <mark>maximise</mark> the usable space inside without having to __12__ the way for a large, sticking-out door."}, {"id": 2877, "u": 29, "w": "meadow", "f": 1, "m": "", "d": "1. n. 草地（1）", "e": "The idea that &quot;housing crisis&quot; equals &quot;concreted <mark>meadows</mark>&quot; is pure lobby talk."}, {"id": 2878, "u": 29, "w": "measurement", "f": 1, "m": "measure（测量）+-ment（这种行为或结果）", "d": "1. n. 测量；测量结果（1）", "e": "The researchers looked at data that __7__ <mark>measurements</mark> of lean muscle and abdominal fat from more than 4,000 middle-to older-aged men and women and __8__ that data to reported changes in fluid intelligence over a six-year period."}, {"id": 2879, "u": 29, "w": "mechanical", "f": 1, "m": "mechan-（机器、装置）+ical（与……有关、具有相应性质的）", "d": "1. adj. 机械的；机械装置的（1）", "e": "For example, the Long Now Foundation has as its flagship project a <mark>mechanical</mark> clock that is designed to still be marking time thousands of years hence."}, {"id": 2880, "u": 29, "w": "melt", "f": 1, "m": "", "d": "1. v. (使)融化（1）", "e": "They <mark>melt</mark> into sludge."}, {"id": 2881, "u": 29, "w": "midst", "f": 1, "m": "mid（中间）+st（词形结尾）", "d": "1. n. 中间（1）", "e": "One of these urges has to do with creating a state of peace in the <mark>midst</mark> of turbulence, a &quot;still point of the turning world,&quot; to borrow a phrase from T. S. Eliot."}, {"id": 2882, "u": 29, "w": "migration", "f": 1, "m": "migr（迁移）+-ation（过程的名词后缀）", "d": "1. n. 迁移；移民（1）", "e": "Without constant <mark>migration</mark> of digital assets, a nightmare about the foreseeable future is what keeps historians up at night PS fails to <mark>modernize</mark> itself due to____"}, {"id": 2898, "u": 29, "w": "modification", "f": 1, "m": "modific-（modify的词干变体，修改、调整）+-ation（行为或结果）", "d": "1. n. 修改；调整（1）", "e": "Not surprisingly, newly published discovery claims and credible discoveries that appear to be important and convincing will always be open to challenge and potential <mark>modification</mark> or refutation by future researchers."}, {"id": 2899, "u": 29, "w": "monthly", "f": 1, "m": "month（月）+-ly（按这个周期发生的）", "d": "1. adj. 每月的；按月的（1）", "e": "[ C ] Soon after Sketches by Boz appeared, a publishing firm approached Dickens to write a story in <mark>monthly</mark> installments, as a backdrop for a series of woodcuts by the then-famous artist Robert Seymour, who had originated the idea for the story."}, {"id": 2900, "u": 29, "w": "motivation", "f": 1, "m": "motivate（去e，驱动、激励）+-ion（行为、状态或起作用的因素）", "d": "1. n. 动机；动力（1）", "e": "(46) This movement, driven by powerful and diverse <mark>motivations</mark>, built a nation out of a wilderness and, by its nature, shaped the character and destiny of an uncharted continent."}, {"id": 2901, "u": 30, "w": "mount", "f": 1, "m": "", "d": "1. v. 发起（1）", "e": "[ E ] The challenge the computer <mark>mounts</mark> to television thus bears little similarity to one format being replaced by another in the manner of record players being replaced by CD players."}, {"id": 2902, "u": 30, "w": "moved", "f": 1, "m": "mov（move去e，使感动）+-ed（受到作用后形成的状态）", "d": "1. adj. 受感动的（1）", "e": "I was really <mark>moved</mark> by the Chinese families&#x27; handwritten letters you posted yesterday."}, {"id": 2903, "u": 30, "w": "moving", "f": 1, "m": "mov（move去e，移动、使感动）+ing（正在产生这种动作或作用的）", "d": "1. adj. 移动的；可活动的（1）", "e": "[ F ] So what&#x27;s the appeal of a long, sweaty day in pursuit of an elusive, fast-<mark>moving</mark> wild animal?"}, {"id": 2904, "u": 30, "w": "muddy", "f": 1, "m": "mud（泥；双写d）+-y（形容词后缀；亦转作动词）", "d": "1. adj. 使模糊；搅浑（1）", "e": "(46) Tracing the history of the term, we can see how the definition of scientific literacy has shifted over time, <mark>muddying</mark> the waters when it comes to determining the goals of science education."}, {"id": 2905, "u": 30, "w": "multilingual", "f": 1, "m": "multi-（多）+lingual（语言的）", "d": "1. adj. 会多种语言的（1）", "e": "David Graddol concludes that monoglot English graduates face a bleak economic future as qualified <mark>multilingual</mark> youngsters from other countries are proving to have a competitive advantage over their British counterparts in global companies and organisations."}, {"id": 2906, "u": 30, "w": "multitude", "f": 1, "m": "mult（多、许多）+-itude（数量或状态的名词结尾）", "d": "1. n. 众多（1）", "e": "Yet researchers can take some comfort in the fact that there are a <mark>multitude</mark> of librarians devoted to discovering, organizing, and preserving digital information for researchers current and future."}, {"id": 2907, "u": 30, "w": "muscular", "f": 1, "m": "musc（肌肉）+-ular（与……有关或具有这种特点的）", "d": "1. adj. 肌肉的（1）", "e": "Although sadness also __14__ tears, evidence suggests that emotions can flow __15__ <mark>muscular</mark> responses."}, {"id": 2908, "u": 30, "w": "mushroom", "f": 1, "m": "", "d": "1. v. 迅速增长；大量涌现（1）", "e": "And it is equally true that science&#x27;s unrelenting appetite for information has caused a <mark>mushrooming</mark> of energy-intensive data centres around the world."}, {"id": 2909, "u": 30, "w": "narrate", "f": 1, "m": "", "d": "1. v. 叙述（1）", "e": "[ B ] <mark>narrating</mark>"}, {"id": 2910, "u": 30, "w": "nasty", "f": 1, "m": "", "d": "1. adj. 令人厌恶的；恶劣的（1）", "e": "The court did suggest that accepting favors in return for opening doors is &quot;distasteful&quot; and &quot;<mark>nasty</mark>.&quot;"}, {"id": 2911, "u": 30, "w": "nationality", "f": 1, "m": "national（国家的、民族的）+-ity（身份、归属的名词后缀）", "d": "1. n. 国籍（1）", "e": "Anyone can be a citizen scientist, regardless of age, <mark>nationality</mark> or academic experience."}, {"id": 2912, "u": 30, "w": "naturally", "f": 1, "m": "natural（自然的、天生的）+-ly（副词后缀）", "d": "1. adv. 自然地；自然而然地（1）", "e": "&quot;There are experiments that show that, <mark>naturally</mark>, the results of interviews are much more biased than what AI does,&quot; says Pedro Domingos, author of The Master Algorithm: How the Quest for the Ultimate Learning Machine Will Remake Our World and a computer science professor at the University of Washington."}, {"id": 2913, "u": 30, "w": "naval", "f": 1, "m": "nav（船、航行）+-al（与……有关的）", "d": "1. adj. 海军的、船舶的（1）", "e": "Here was the raw material of houses and furniture, ships and potash, dyes and <mark>naval</mark> stores."}, {"id": 2914, "u": 30, "w": "necessitate", "f": 1, "m": "necess（必要、必需）+-itate（使成为）", "d": "1. v. 使成为必要（1）", "e": "In 1866, the construction of the North Wing of the Treasury Building <mark>necessitated</mark> the demolition of the State Department building."}, {"id": 2915, "u": 30, "w": "needle", "f": 1, "m": "", "d": "1. n. （needle-and-haystack）大海捞针中的针（1）", "e": "The result is an embarrassment of historical riches, which brings its own <mark>needle</mark>-and-haystack problems."}, {"id": 2916, "u": 30, "w": "needy", "f": 1, "m": "need（需要）+-y（形容词后缀）", "d": "1. adj. 贫困的；有需要的（1）", "e": "Now we can understand each other&#x27;s positions and recognize our shared values, since we both care about <mark>needy</mark> workers."}, {"id": 2917, "u": 30, "w": "neighborhood", "f": 1, "m": "neighbor（邻居）+-hood（共同生活的人群或范围）", "d": "1. n. 街区；社区（1）", "e": "The theory also seems to explain the sudden and unexpected popularity of certain looks, brands, or <mark>neighborhoods</mark>."}, {"id": 2918, "u": 30, "w": "nest", "f": 1, "m": "", "d": "1. n. 巢；鸟巢（1）", "e": "Beavers build dams and birds make <mark>nests</mark>."}, {"id": 2919, "u": 30, "w": "nevertheless", "f": 1, "m": "never（绝不）+the（因此）+less（更少）", "d": "1. adv. 然而；尽管如此（1）", "e": "<mark>Nevertheless</mark>, as any biographer knows, a person&#x27;s early life and its conditions are often the greatest gift to an individual."}, {"id": 2920, "u": 30, "w": "newborn", "f": 1, "m": "new（新近、刚刚）+born（出生）", "d": "1. adj. 新生的（1）", "e": "Some experts __17__ the stress-reducing, health-related benefits of hugging to the release of oxytocin, often called &quot;the bonding hormone&quot; __18__ it promotes attachment in relationships, including that between mothers and their <mark>newborn</mark> babies."}, {"id": 2921, "u": 30, "w": "noble", "f": 1, "m": "", "d": "1. adj. 高尚的（1）", "e": "She uses outdated research and decades-old examples to undermine the <mark>noble</mark> mission of organizations committed to connecting children to a world beyond their own."}, {"id": 2922, "u": 30, "w": "nod", "f": 1, "m": "", "d": "1. n. 批准；认可（get the nod）（1）", "e": "As boards scrutinize succession plans in response to shareholder pressure, executives who don&#x27;t get the <mark>nod</mark> also may wish to move on."}, {"id": 2923, "u": 30, "w": "nonsense", "f": 1, "m": "non-（没有）+sense（意义、道理）", "d": "1. n. 无稽之谈（1）", "e": "(46) There is a great deal of this kind of <mark>nonsense</mark> in the medical journals which, when taken up by broadcasters and the lay press, generates both health scares and short-lived dietary enthusiasms."}, {"id": 2924, "u": 30, "w": "nontechnical", "f": 1, "m": "non-（非、不属于）+technical（技术的、专业技术性的）", "d": "1. adj. 非专业技术性的（1）", "e": "In the United States, the desire to provide the public with a general, <mark>nontechnical</mark> education in science originated as far back as the late 1800s. (48) Educators advanced the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills."}, {"id": 2925, "u": 30, "w": "normally", "f": 1, "m": "normal（正常的、通常的）+-ly（以这种方式、在这种情况下）", "d": "1. adv. 通常、正常情况下（1）", "e": "Big-name PRH authors may suffer a bit, but it&#x27;s those mid-list authors, who <mark>normally</mark> rely on Waterstones staff&#x27;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute."}, {"id": 2926, "u": 30, "w": "north", "f": 1, "m": "", "d": "1. n. 北；北方（1）", "e": "__3__ you get lost without a phone or a compass, and you __4__ can&#x27;t find <mark>north</mark>, we have a few tricks to help you navigate __5__ to civilization, one of which is to follow the land."}, {"id": 2927, "u": 30, "w": "noticeable", "f": 1, "m": "notice（注意）+-able（能够被……的）", "d": "1. adj. 显眼的；可察觉的（1）", "e": "[ A ] To make them easily <mark>noticeable</mark>."}, {"id": 2928, "u": 30, "w": "numerous", "f": 1, "m": "numer（数字、计数）+-ous（形容词后缀）", "d": "1. adj. 众多的，许多的（1）", "e": "This scale __14__ <mark>numerous</mark> factors into consideration."}, {"id": 2929, "u": 30, "w": "nutrition", "f": 1, "m": "nutrit（滋养）+-ion（行为、过程）", "d": "1. n. 营养（1）", "e": "It is like the immune system of the body, which under stress or through lack of <mark>nutrition</mark> or exercise can be weakened, but which never leaves us."}, {"id": 2930, "u": 30, "w": "observer", "f": 1, "m": "observ（observe去e，观察、留意）+-er（做这件事的人）", "d": "1. n. 观察者（1）", "e": "The idea seems promising, and Rosenberg is a perceptive <mark>observer</mark>."}, {"id": 2931, "u": 30, "w": "occurrence", "f": 1, "m": "occur（发生，双写r）+-ence（事件；发生）", "d": "1. n. 发生的事件、现象（1）", "e": "As the brain __2__ , we refer to these <mark>occurrences</mark> as &quot;senior moments.&quot;"}, {"id": 2932, "u": 30, "w": "ocean", "f": 1, "m": "", "d": "1. n. 广阔领域（比喻）（1）", "e": "But outside those narrow pools of interest, a vast <mark>ocean</mark> awaits, bountiful with simmering ideas, mental adventure and imaginative refreshment."}, {"id": 2933, "u": 30, "w": "odor", "f": 1, "m": "", "d": "1. n. 气味（1）", "e": "(49) The volatile chemicals produced by plants can be carried a long way, and they are very characteristic: Each plant or tree has its own particular <mark>odor</mark> signature."}, {"id": 2934, "u": 30, "w": "offset", "f": 1, "m": "off（另置一侧）+set（放置）", "d": "1. v. 抵消（1）", "e": "The latter step would largely <mark>offset</mark> the financial burden of annually pre-funding retiree health care, thus addressing a long-standing complaint by the USPS and its unions."}, {"id": 2935, "u": 30, "w": "ongoing", "f": 1, "m": "on（继续）+going（进行）", "d": "1. adj. 持续进行的（1）", "e": "[ A ] an <mark>ongoing</mark> conflict."}, {"id": 2936, "u": 30, "w": "openness", "f": 1, "m": "open（开放的）+-ness（性质、状态的名词后缀）", "d": "1. n. 开放性（1）", "e": "It needs to give the commission explicit authority once and for all to bar broadband providers from meddling in the traffic on their network and to create clear rules protecting <mark>openness</mark> and innovation online."}, {"id": 2937, "u": 30, "w": "opera", "f": 1, "m": "", "d": "1. n. 歌剧（1）", "e": "For the time, attention, and money of the art-loving public, classical instrumentalists must compete not only with <mark>opera</mark> houses, dance troupes, theater companies, and museums, but also with the recorded performances of the great classical musicians of the 20th century."}, {"id": 2938, "u": 30, "w": "operational", "f": 1, "m": "operation（操作、运行、经营）+-al（相关性质或状态的）", "d": "1. adj. 运营的；操作方面的（1）", "e": "[ D ] lower their <mark>operational</mark> costs."}, {"id": 2939, "u": 30, "w": "oppression", "f": 1, "m": "oppress（压迫）+ion（这种作用或形成的状态）", "d": "1. n. 压抑（1）", "e": "When we are deprived of green, of plants, of trees, (49) most of us give in to a demoralization of spirit which we usually blame on some psychological conditions, until one day we find ourselves in a garden and feel the <mark>oppression</mark> vanish as if by magic."}, {"id": 2940, "u": 30, "w": "oriental", "f": 1, "m": "orient（东方）+-al（形容词后缀）", "d": "1. adj. 东方的（1）", "e": "[ B ] Completed in 1875, the State Department&#x27;s south wing was the first to be occupied, with its elegant four-story library (completed in 1876), Diplomatic Reception Room, and Secretary&#x27;s office decorated with carved wood, <mark>Oriental</mark> rugs, and stenciled wall patterns."}, {"id": 2941, "u": 30, "w": "ornament", "f": 1, "m": "orna-（装饰）+-ment（行为或所用物件）", "d": "1. n. 装饰、增色之物（1）", "e": "We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the eve of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an <mark>ornament</mark> to the publications in which it appeared."}, {"id": 2942, "u": 30, "w": "ornate", "f": 1, "m": "", "d": "1. adj. 装饰华丽的（1）", "e": "The researchers mapped not only the city&#x27;s vast and <mark>ornate</mark> ceremonial areas, but also hundreds of simpler apartment complexes where common people lived."}, {"id": 2943, "u": 30, "w": "orphan", "f": 1, "m": "", "d": "1. n. 孤儿（1）", "e": "In Oliver Twist, he traces an <mark>orphan&#x27;s</mark> progress from the workhouse to the criminal slums of London."}, {"id": 2944, "u": 30, "w": "outlook", "f": 1, "m": "out（向外）+look（看）", "d": "1. n. 观念、看法（1）", "e": "[ D ] <mark>outlook</mark>"}, {"id": 2945, "u": 30, "w": "outperform", "f": 1, "m": "out-（超过）+perform（表现；执行）", "d": "1. v. 胜过；表现优于（1）", "e": "One company in the UK, Phrasee, claims their software can <mark>outperform</mark> humans by up to 10 percent when it comes to email open rates."}, {"id": 2946, "u": 30, "w": "outrage", "f": 1, "m": "", "d": "1. n. 愤怒、义愤（1）", "e": "The company, a major energy supplier in New England, provoked justified <mark>outrage</mark> in Vermont last week when it announced it was reneging on a longstanding commitment to abide by the state&#x27;s strict nuclear regulations."}, {"id": 2947, "u": 30, "w": "outsize", "f": 1, "m": "out-（超出）+size（尺寸）", "d": "1. adj. 超大的、超出一般的（1）", "e": "The researchers&#x27; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose <mark>outsize</mark> presence is primarily a function of media, not interpersonal, influence - even the most influential members of a population simply don&#x27;t interact with that many others."}, {"id": 2948, "u": 30, "w": "outsourcing", "f": 1, "m": "outsourc（outsource去e，把业务交给外部承办）+-ing（这项活动或正在进行的动作）", "d": "1. v. 外包（1）", "e": "If left to themselves, such trends will diminish the relative strength of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process <mark>outsourcing</mark> in other languages such as Japanese, French and German, spreads."}, {"id": 2949, "u": 30, "w": "outweigh", "f": 1, "m": "out-（超过）+weigh（有……重；衡量）", "d": "1. v. 超过；比……更重要（1）", "e": "[ C ] <mark>outweighs</mark> that held by the states."}, {"id": 2950, "u": 30, "w": "overcome", "f": 1, "m": "over-（超过、越过）+come（来）", "d": "1. v. 克服（1）", "e": "(47) But by utilising the natural curiosity of the general public it is possible to <mark>overcome</mark> many of these challenges by engaging non-scientists directly in the research process."}, {"id": 2951, "u": 30, "w": "overhead", "f": 1, "m": "over（在……上方）+head（头）", "d": "1. n. 日常运营开支（1）", "e": "<mark>Overhead</mark> may be high and circulation lower, but rushing to eliminate its print edition would be a mistake, says BuzzFeed CEO Jonah Peretti."}, {"id": 2952, "u": 30, "w": "overlook", "f": 1, "m": "over（从上方；越过）+look（看）", "d": "1. v. 忽视；未注意到（1）", "e": "[ A ] Its negative effects on businesses are often <mark>overlooked</mark>."}, {"id": 2953, "u": 30, "w": "overly", "f": 1, "m": "over（过分）+-ly（副词后缀）", "d": "1. adv. 过于；过度地（1）", "e": "In many cases, it would not be <mark>overly</mark> burdensome for authorities to obtain a warrant to search through phone contents."}, {"id": 2954, "u": 30, "w": "oversee", "f": 1, "m": "over（在上、统筹）+see（看）", "d": "1. v. 监督；监管（1）", "e": "At Yosemite National Park, Martin <mark>oversaw</mark> the use of what is known as prescribed burns to make the landscape more resilient."}, {"id": 2955, "u": 30, "w": "overshadow", "f": 1, "m": "over（在上方、覆盖）+shadow（阴影；投下阴影）", "d": "1. v. 使黯然失色、遮蔽（1）", "e": "[ A ] largely <mark>overshadowed</mark>."}, {"id": 2956, "u": 30, "w": "overstate", "f": 1, "m": "over-（过度）+state（陈述）", "d": "1. v. 夸大（1）", "e": "Today they argue that market prices <mark>overstate</mark> losses, because they largely reflect the temporary illiquidity of markets, not the likely extent of bad debts."}, {"id": 2957, "u": 30, "w": "overwhelm", "f": 1, "m": "over-（完全盖过）+whelm（淹没、覆盖、压倒）", "d": "1. v. 压倒、使难以招架（1）", "e": "[ B ] will possibly <mark>overwhelm</mark> legitimate streamers"}, {"id": 2958, "u": 30, "w": "overwork", "f": 1, "m": "over-（过度）+work（工作）", "d": "1. v. 过度使用（1）", "e": "(48) Time was when biologists somewhat <mark>overworked</mark> the evidence that these creatures preserve the health of game by killing the physically weak, or that they prey only on &quot;worthless&quot; species."}, {"id": 2959, "u": 30, "w": "oxygen", "f": 1, "m": "oxy-（酸）+-gen（产生者；生成物）", "d": "1. n. 氧,氧气（1）", "e": "Laughter does __2__ short-term changes in the function of the heart and its blood vessels, __3__ heart rate and <mark>oxygen</mark> consumption."}, {"id": 2960, "u": 30, "w": "package", "f": 1, "m": "pack（打包）+-age（处理、结果或相关事物）", "d": "1. n. 一揽子、一套（1）", "e": "This should form part of a wider <mark>package</mark> of measures to address the long-running problems on Britain&#x27;s railways."}, {"id": 2961, "u": 30, "w": "packet", "f": 1, "m": "pack（包裹、捆扎）+-et（小型事物）", "d": "1. n. 薪水（paypacket）（1）", "e": "Bankers&#x27; fat pay <mark>packets</mark> have attracted much criticism, but a public-sector system that does not reward high achievers may be a much bigger problem for America."}, {"id": 2962, "u": 30, "w": "paddle", "f": 1, "m": "", "d": "1. v. 划（船）（1）", "e": "We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not <mark>paddle</mark> a boat across them, but teeming with aquatic life."}, {"id": 2963, "u": 30, "w": "paint", "f": 1, "m": he third quarter, CEO <mark>turnover</mark> was down 23% from a year ago as nervous boards stuck with the leaders they had, according to Liberum Research."}, {"id": 3211, "u": 33, "w": "twin", "f": 1, "m": "", "d": "1. n. 相对应的双生建筑（1）", "e": "To the horror of some who expected a Greek Revival <mark>twin</mark> of the Treasury Building to be erected on the other side of the White House, the elaborate French Second Empire style design by Alfred Mullett was selected, and construction of a building to house all three departments began in June of 1871."}, {"id": 3212, "u": 33, "w": "typewriter", "f": 1, "m": "type（打字）+write（书写，去掉末尾e）+-er（器具）", "d": "1. n. 打字机（1）", "e": "The second half of the 20th century saw a collection of geniuses, warriors, entrepreneurs and visionaries labour to create a fabulous machine that could function as a <mark>typewriter</mark> and printing press, studio and theatre, paintbrush and gallery, piano and radio, the mail as well as the mail carrier."}, {"id": 3213, "u": 33, "w": "ultimate", "f": 1, "m": "ultim（最后、最终、根本）+-ate（具有这种性质的）", "d": "1. adj. 最终的；最高的（1）", "e": "And interest groups ranging from postal unions to greeting-card makers exert self-interested pressure on the USPS&#x27;s <mark>ultimate</mark> overseer - Congress - insisting that whatever else happens to the Postal Service, aspects of the status quo they depend on get protected."}, {"id": 3214, "u": 33, "w": "unanimous", "f": 1, "m": "un（一个）+anim（心、精神）+-ous（具有……性质的）", "d": "1. adj. 一致同意的（1）", "e": "In a rare <mark>unanimous</mark> ruling, the US Supreme Court has overturned the corruption conviction of a former Virginia governor, Robert McDonnell."}, {"id": 3215, "u": 33, "w": "uncertain", "f": 1, "m": "un-（不）+certain（确定的、有把握的）", "d": "1. adj. 不确定的（1）", "e": "[ C ] is faced with <mark>uncertain</mark> prospects."}, {"id": 3216, "u": 33, "w": "undercover", "f": 1, "m": "under（在……之下）+cover（掩护）", "d": "1. adj. 卧底的；秘密行动的（1）", "e": "Last year, the Transportation Security Administration ( let gSelected = new Set();
let currentGlobalMatches = [];

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function getStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
}

function saveStoreObj(store) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  renderDashboard();
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function clearGlobalSearch() {
  document.getElementById('global-q').value = '';
  document.getElementById('global-st-filter').value = '';
  gSelected.clear();
  document.getElementById('global-results').style.display = 'none';
  document.getElementById('gsel-cnt').textContent = 0;
}

function renderGlobalList() {
  const q = document.getElementById('global-q').value.trim().toLowerCase();
  const stFilter = document.getElementById('global-st-filter').value;
  const panel = document.getElementById('global-results');
  if (!q && !stFilter) {
    panel.style.display = 'none';
    currentGlobalMatches = [];
    return;
  }
  const store = getStore();
  let matches = ALL_WORDS.filter(w => {
    const st = String(store[w.id] || 0);
    if (stFilter && stFilter !== 'all') {
      if (stFilter === 'review') {
        if (st !== '2' && st !== '3') return false;
      } else if (st !== stFilter) return false;
    }
    if (!q) return true;
    return w.w.toLowerCase().includes(q) || w.d.toLowerCase().includes(q) || (w.m && w.m.toLowerCase().includes(q));
  });

  currentGlobalMatches = matches;
  const displayList = matches.slice(0, 200);
  panel.style.display = 'block';

  const allChecked = displayList.length > 0 && displayList.every(w => gSelected.has(w.id));
  document.getElementById('gsel-cnt').textContent = gSelected.size;

  panel.innerHTML = `
    <div class="quick-table-wrap">
      <div style="padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;">
        <span>🔍 共匹配到 <b>${matches.length}</b> 个单词 ${matches.length > 200 ? '（当前展示前 200 词，点「一键标熟」可对全部匹配词生效）' : ''}</span>
        <button class="btn-chip btn-momo" style="padding:4px 10px;font-size:12px;" onclick="batchMarkAllMatches(1)">⚡ 将全部 ${matches.length} 个匹配词一键标熟</button>
      </div>
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="toggleSelectAllGlobal()"></th>
            <th style="width:80px;">单元/序号</th>
            <th style="width:150px;">单词</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:200px;text-align:right;">快速标记</th>
          </tr>
        </thead>
        <tbody>
          ${displayList.map(w => {
            const st = store[w.id] || 0;
            const isSel = gSelected.has(w.id);
            const uFile = UNITS[w.u - 1].file;
            return `<tr class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleGSelect(${w.id}, this.checked)"></td>
              <td style="font-size:12px;"><a href="${uFile}" style="color:var(--momo-dark);font-weight:700;">U${String(w.u).padStart(2,'0')}</a> <span style="color:var(--sub)">#${w.id}</span></td>
              <td>
                <strong style="font-size:16px;cursor:pointer;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                ${w.m ? `<div style="font-size:11px;color:var(--sub);">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13px;">${w.d}</div>
                <div style="font-size:12px;color:var(--sub);">${w.e}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 8px;font-size:12px;" onclick="setSingleGlobal(${w.id},1)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 8px;font-size:12px;" onclick="setSingleGlobal(${w.id},2)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 8px;font-size:12px;" onclick="setSingleGlobal(${w.id},3)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function toggleGSelect(id, checked) {
  if (checked) gSelected.add(id);
  else gSelected.delete(id);
  document.getElementById('gsel-cnt').textContent = gSelected.size;
  renderGlobalList();
}

function toggleSelectAllGlobal() {
  const displayList = currentGlobalMatches.slice(0, 200);
  const allChecked = displayList.length > 0 && displayList.every(w => gSelected.has(w.id));
  if (allChecked) displayList.forEach(w => gSelected.delete(w.id));
  else displayList.forEach(w => gSelected.add(w.id));
  renderGlobalList();
}

function setSingleGlobal(id, st) {
  const store = getStore();
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStoreObj(store);
  renderGlobalList();
}

function batchMarkGlobal(st) {
  const store = getStore();
  const targets = gSelected.size > 0
    ? Array.from(gSelected)
    : currentGlobalMatches.map(w => w.id);
  if (!targets.length) {
    showToast('请先搜索筛选或勾选要操作的单词');
    return;
  }
  targets.forEach(id => {
    if (st === 0) delete store[id];
    else store[id] = st;
  });
  gSelected.clear();
  saveStoreObj(store);
  renderGlobalList();
  const labelMap = { 1: '✓ 已标熟', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习' };
  showToast(`已将 ${targets.length} 个单词批量设为「${labelMap[st]}」`);
}

function batchMarkAllMatches(st) {
  const store = getStore();
  if (!currentGlobalMatches.length) return;
  currentGlobalMatches.forEach(w => { store[w.id] = st; });
  gSelected.clear();
  saveStoreObj(store);
  renderGlobalList();
  showToast(`⚡ 已将全部 ${currentGlobalMatches.length} 个匹配词一键标熟！`);
}

function quickMarkUnit(e, uIdx, st) {
  e.preventDefault();
  e.stopPropagation();
  const u = UNITS[uIdx];
  const store = getStore();
  for (let id = u.start; id <= u.end; id++) {
    if (st === 1) store[id] = 1;
    else if (st === 99) { if (!store[id]) store[id] = 1; } // 剩余未学标熟
  }
  saveStoreObj(store);
  showToast(`Unit ${String(u.u).padStart(2,'0')} 已一键标熟！`);
}

function renderDashboard() {
  const store = getStore();
  let tk = 0, tv = 0, tu = 0;
  const grid = document.getElementById('unit-grid');
  grid.innerHTML = UNITS.map((u, idx) => {
    let k = 0, v = 0, x = 0;
    for (let id = u.start; id <= u.end; id++) {
      const st = store[id] || 0;
      if (st === 1) { k++; tk++; }
      else if (st === 2) { v++; tv++; }
      else if (st === 3) { x++; tu++; }
    }
    const pctK = (k / u.count * 100).toFixed(1);
    const pctV = (v / u.count * 100).toFixed(1);
    const pctU = (x / u.count * 100).toFixed(1);
    return `<a class="unit-card" href="${u.file}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:17px;font-weight:800;">Unit ${String(u.u).padStart(2,'0')}</span>
        <span class="freq-badge">考频 ${u.max_f}~${u.min_f} 次</span>
      </div>
      <div style="font-size:12.5px;color:var(--sub);">第 ${u.start} - ${u.end} 词（共 ${u.count} 词）</div>
      <div style="font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">代表词：${u.sample}</div>
      <div class="progress-track" style="height:6px;margin:4px 0;">
        <div class="prog-seg prog-k" style="width:${pctK}%"></div>
        <div class="prog-seg prog-v" style="width:${pctV}%"></div>
        <div class="prog-seg prog-u" style="width:${pctU}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);">
        <div style="display:flex;gap:8px;">
          <span style="color:var(--momo)">✓ ${k}</span>
          <span style="color:var(--amber)">? ${v}</span>
          <span style="color:var(--rose)">✗ ${x}</span>
          <span>未学 ${u.count - k - v - x}</span>
        </div>
        <button class="btn-chip" style="padding:2px 8px;font-size:11px;" onclick="quickMarkUnit(event, ${idx}, 99)" title="将该单元未标记的词一键全部标熟">⚡ 余词标熟</button>
      </div>
    </a>`;
  }).join('');

  document.getElementById('tot-k').textContent = tk;
  document.getElementById('tot-v').textContent = tv;
  document.getElementById('tot-u').textContent = tu;
  document.getElementById('tot-0').textContent = TOTAL_WORDS - tk - tv - tu;
  document.getElementById('tot-pk').style.width = (tk / TOTAL_WORDS * 100) + '%';
  document.getElementById('tot-pv').style.width = (tv / TOTAL_WORDS * 100) + '%';
  document.getElementById('tot-pu').style.width = (tu / TOTAL_WORDS * 100) + '%';
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

function exportProgress() {
  const data = localStorage.getItem(STORAGE_KEY) || '{}';
  const blob = new Blob([data], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kaoyan_vocab_progress.json';
  a.click();
}

function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const obj = JSON.parse(ev.target.result);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
      renderDashboard();
      renderGlobalList();
      showToast('学习进度导入成功！');
    } catch(err) { alert('JSON 文件格式有误'); }
  };
  reader.readAsText(file);
}

function resetProgress() {
  if (confirm('确定要清空所有单元的背诵标记记录吗？')) {
    localStorage.removeItem(STORAGE_KEY);
    renderDashboard();
    renderGlobalList();
  }
}

const savedTheme = localStorage.getItem('kaoyan_theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
renderDashboard();
</script>
</body>
</html>
