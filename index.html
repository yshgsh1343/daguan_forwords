ark> and may even see progress."}, {"id": 1967, "u": 20, "w": "doubtful", "f": 2, "m": "doubt（怀疑）+ful（带有这种性质的）", "d": "1. adj. 怀疑的、不确定的（2）", "e": "And whether the community&#x27;s work contributes much to an overall accumulation of knowledge is <mark>doubtful</mark>."}, {"id": 1968, "u": 20, "w": "dramatically", "f": 2, "m": "dramatic（戏剧性的、变化显著的）+-ally（以这种方式）", "d": "1. adv. 显著地；急剧地（2）", "e": "These agencies and other government bodies should <mark>dramatically</mark> improve incentives to keep our current shows and attract new productions to Los Angeles."}, {"id": 1969, "u": 20, "w": "drastic", "f": 2, "m": "drast-（行动；做，希腊语词干）+-ic（形容词后缀）", "d": "1. adj. 剧烈的；重大的（2）", "e": "In previous eras of <mark>drastic</mark> technological change, entrepreneurs smoothed the transition by dreaming up ways to combine labor and machines."}, {"id": 1970, "u": 20, "w": "drawing", "f": 2, "m": "draw（画）+-ing（活动或所得结果）", "d": "1. n. 绘画（技艺）（1）；2. n. 划分界限（line-drawing）（1）", "e": "After the first installment, Dickens wrote to the artist and asked him to correct a <mark>drawing</mark> Dickens felt was not faithful enough to his prose."}, {"id": 1971, "u": 20, "w": "driver", "f": 2, "m": "drive（驾驶；驱动，去e）+-er（人；物）", "d": "1. n. 驾驶员（2）", "e": "Human <mark>drivers</mark> sometimes must make split-second decisions."}, {"id": 1972, "u": 20, "w": "driving", "f": 2, "m": "drive（驾驶；驱动，去e）+-ing（名词、形容词后缀）", "d": "1. n. 驾驶（2）", "e": "And to anticipate every imaginable <mark>driving</mark> situation is a difficult programming problem."}, {"id": 1973, "u": 20, "w": "dull", "f": 2, "m": "", "d": "1. adj. 乏味的；无趣的（1）；2. adj. 迟钝的；愚笨的（1）", "e": "True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, random enlivening of a car journey or <mark>dull</mark> manual task."}, {"id": 1974, "u": 20, "w": "economics", "f": 2, "m": "economic（经济的）+-s（学科名称结尾）", "d": "1. n. 经济学（2）", "e": "Some species of trees have been &quot;read out of the party&quot; by <mark>economics</mark>-minded foresters because they grow too slowly, or have too low a sale value to pay as timber crops."}, {"id": 1975, "u": 20, "w": "edge", "f": 2, "m": "", "d": "1. adj. 刃（double-edged双刃的）（1）；2. n. 边缘（1）", "e": "&quot;It&#x27;s a double-<mark>edged</mark> sword because wildfires are getting more severe and larger under climate change and we need this work even more, but then the work gets more challenging,&quot; said Susan Prichard, a fire ecologist at the University of Washington."}, {"id": 1976, "u": 20, "w": "editorial", "f": 2, "m": "editor（编辑、编者）+-ial（与……有关的）", "d": "1. adj. 编辑的（1）；2. n. 社论（1）", "e": "Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other <mark>editorial</mark> support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles."}, {"id": 1977, "u": 20, "w": "elevate", "f": 2, "m": "e-（向上）+lev（举起）+-ate（使发生相应动作）", "d": "1. v. 提升（2）", "e": "Even better would be to help <mark>elevate</mark> notions of beauty beyond the material standards of a particular industry."}, {"id": 1978, "u": 20, "w": "eligible", "f": 2, "m": "e-（出）+lig（选择）+-ible（能够被……的）", "d": "1. adj. 具备资格的（2）", "e": "Passengers who pass a background check are <mark>eligible</mark> to use expedited screening lanes."}, {"id": 1979, "u": 20, "w": "embed", "f": 2, "m": "em-（使进入）+bed（承托层、基底）", "d": "1. v. 嵌入（2）", "e": "The study showed the importance of <mark>embedding</mark> arts in education, she said."}, {"id": 1980, "u": 20, "w": "endless", "f": 2, "m": "end（结束、尽头）+-less（没有）", "d": "1. adj. 无穷无尽的；没完没了的（2）", "e": "The <mark>endless</mark> legal battles and back-and-forth at the FCC cry out for Congress to act."}, {"id": 1981, "u": 20, "w": "engine", "f": 2, "m": "", "d": "1. n. 引擎；软件核心系统（1）；2. n. 推动力；动力（1）", "e": "We define such sold media as owned media whose traffic is so strong that other organizations place their content or e-commerce <mark>engines</mark> within that environment."}, {"id": 1982, "u": 20, "w": "engineering", "f": 2, "m": "engineer（工程师）+-ing（工作、活动或领域的名词结尾）", "d": "1. n. 工程（2）", "e": "But many middle-class occupations - trucking, financial advice, software <mark>engineering</mark> - have aroused their interest, or soon will."}, {"id": 1983, "u": 20, "w": "entail", "f": 2, "m": "en-（使进入）+tail（切分后划定、限定）", "d": "1. v. 意味着；必然带来（2）", "e": "It is becoming less clear, however, that such a theory would be a simplification, given the dimensions and universes that it might <mark>entail</mark>."}, {"id": 1984, "u": 20, "w": "entertain", "f": 2, "m": "enter-（在……之间）+tain（保持、留住）", "d": "1. v. 使娱乐；使愉快（2）", "e": "[ C ] news about pregnant celebrities is <mark>entertaining</mark>."}, {"id": 1985, "u": 20, "w": "entry", "f": 2, "m": "enter（进入）+y（行为、入口或记录的名词结尾）", "d": "1. n. 加入 (指行动、权利、机会)（2）", "e": "(47) And the demand that rose in those societies for <mark>entry</mark> to higher education extended to groups and social classes that had not thought of attending a university before the war."}, {"id": 1986, "u": 20, "w": "environmentalist", "f": 2, "m": "environment（环境）+-al（形容词后缀）+-ist（持某种主张的人）", "d": "1. n. 环保主义者（2）", "e": "As a fellow <mark>environmentalist</mark>, animal-protection advocate and longtime vegetarian, I could properly be in the same camp as Emma Marris on the issue of zoos."}, {"id": 1987, "u": 20, "w": "equip", "f": 2, "m": "", "d": "1. v. 装备；使具备所需条件（2）", "e": "[ A ] <mark>equipped</mark>"}, {"id": 1988, "u": 20, "w": "equity", "f": 2, "m": "equ-（平、相等）+-ity（性质或状态）", "d": "1. n. 公平，公正（1）；2. n. 股票（1）", "e": "Next time somebody pushes corporate quotas as a way to promote gender <mark>equity</mark>, remember that such policies are largely self-serving measures that make their sponsors feel good but do little to help average women."}, {"id": 1989, "u": 20, "w": "erode", "f": 2, "m": "e-（向外、离开）+rode（啃蚀、磨损）", "d": "1. v. 侵蚀；冲蚀（1）；2. v. 削弱，损害（抽象事物）（1）", "e": "In recent decades, shifting __6__ and climate change have <mark>eroded</mark> a natural barrier that __7__ Pavlopetri."}, {"id": 1990, "u": 20, "w": "essentially", "f": 2, "m": "essential（本质的、基本的）+-ly（从某方面来说）", "d": "1. adv. 本质上；基本上（2）", "e": "&quot;Then increase it at a higher rate each year and <mark>essentially</mark> try to generate additional revenue.&quot;"}, {"id": 1991, "u": 20, "w": "exceptional", "f": 2, "m": "exception（例外）+al（具有这种性质的）", "d": "1. adj. 非凡的；出色的（2）", "e": "The development of the Elizabethan drama for the next twenty-five years is of <mark>exceptional</mark> interest to students of literary history, for in this brief period we may trace the beginning, growth, blossoming, and decay of many kinds of plays, and of many great careers."}, {"id": 1992, "u": 20, "w": "excess", "f": 2, "m": "ex-（向外、超出）+cess（走）", "d": "1. n. 过量（2）", "e": "Americans, she finds, buy roughly 20 billion garments a year -about 64 items per person - and no matter how much they give away, this <mark>excess</mark> leads to waste."}, {"id": 1993, "u": 20, "w": "excite", "f": 2, "m": "ex-（出来）+cit（唤起、激发）+e（拼写结尾）", "d": "1. v. 使兴奋，使激动（2）", "e": "I was really <mark>excited</mark> to hear that you&#x27;d invite some young craftsmen to demonstrate their innovative craft-making on campus."}, {"id": 1994, "u": 20, "w": "exclusive", "f": 2, "m": "ex-（向外）+clus（关闭）+-ive（具有这种性质的）", "d": "1. adj. 专有的；独有的（1）；2. adj. 专门的（1）", "e": "That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out <mark>exclusive</mark> rights to specific types of online transactions."}, {"id": 1995, "u": 20, "w": "exclusively", "f": 2, "m": "exclusive（排他的、只属于特定一方的）+-ly（在这种范围内）", "d": "1. adv. 专门地；仅仅（2）", "e": "Hence it is metaphysical; but the means of expression is purely and <mark>exclusively</mark> physical: sound."}, {"id": 1996, "u": 20, "w": "exemplify", "f": 2, "m": "exempl（例子、典型）+-ify（使成为、使具体表现出来）", "d": "1. v. 举例说明（2）", "e": "[ B ] It <mark>exemplified</mark> valuable art-science k is its contention that &quot;Circumstances do not make a person, they reveal him.&quot;"}, {"id": 2005, "u": 21, "w": "fantasy", "f": 2, "m": "fant（想象）+asy（名词结尾）", "d": "1. n. 幻想；奇幻（2）", "e": "On display here are various <mark>fantasy</mark> elements whose reference, at some basic level, seems to be the natural world."}, {"id": 2006, "u": 21, "w": "farmer", "f": 2, "m": "farm（种田、经营农牧业）+-er（从事者）", "d": "1. n. 农民；农场主（2）", "e": "Pennsylvania <mark>farmers</mark>, to use one telling example, aren&#x27;t thinking about next year&#x27;s blue crab harvest in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream."}, {"id": 2007, "u": 21, "w": "fascinate", "f": 2, "m": "fascin（迷住、吸引）+-ate（使……）", "d": "1. v. 使着迷；强烈吸引（2）", "e": "Yet humans remain <mark>fascinated</mark> by the idea of robots that would look, move, and respond like humans, similar to those recently depicted on popular sci-fi TV series such as &quot;Westworld&quot; and &quot;Humans.&quot;"}, {"id": 2008, "u": 21, "w": "fascinating", "f": 2, "m": "fascinate（去e，使着迷）+-ing（具有相应作用的）", "d": "1. adj. 迷人的；引人入胜的（2）", "e": "His tale of self-improvement and hard work would make a <mark>fascinating</mark> biography in its own right, but represents something more than that."}, {"id": 2009, "u": 21, "w": "feed", "f": 2, "m": "", "d": "1. v. 依靠他人牟利（feed on）（1）；2. v. 喂养；进食（1）", "e": "[ D ] The few <mark>feed</mark> on the many."}, {"id": 2010, "u": 21, "w": "fellow", "f": 2, "m": "", "d": "1. adj. 同伴的；同类的（2）", "e": "In 2009 the number of unionists in America&#x27;s public sector passed that of their <mark>fellow</mark> members in the private sector."}, {"id": 2011, "u": 21, "w": "fetch", "f": 2, "m": "", "d": "1. v. 卖得（价钱）（1）；2. v. 拿来（1）", "e": "These rules say they must value some assets at the price a third party would pay, not the price managers and regulators would like them to <mark>fetch</mark>."}, {"id": 2012, "u": 21, "w": "fever t completes its reconstruction of rules later this year is strong."}, {"id": 2021, "u": 21, "w": "formally", "f": 2, "m": "formal（正式的）+ly（以这种方式）", "d": "1. adv. 正式地（2）", "e": "[ A ] <mark>formally</mark>"}, {"id": 2022, "u": 21, "w": "formerly", "f": 2, "m": "former（以前的）+-ly（副词后缀）", "d": "1. adv. 以前；曾经（2）", "e": "There are many reasons this <mark>formerly</mark> stable federal institution finds itself at the brink of bankruptcy."}, {"id": 2023, "u": 21, "w": "formulate", "f": 2, "m": "formul（formula去a，明确的表达形式）+-ate（使形成相应内容）", "d": "1. v. 制定；构思（1）；2. v. 明确阐述；构建（论证）（1）", "e": "[ C ] The State, War, and Navy Building, as it was originally known, housed the three Executive Branch Departments most intimately associated with <mark>formulating</mark> and conducting the nation&#x27;s foreign policy in the last quarter of the nineteenth century and the first quarter of the twentieth century - the period when the United States emerged as an international power."}, {"id": 2024, "u": 21, "w": "fraction", "f": 2, "m": "fract-（打破、分开）+-ion（动作或结果的名词后缀）", "d": "1. n. 一点点（1）；2. n. 小部分；一部分（1）", "e": "This year&#x27;s rise, an average of 2.7 per cent, may be a <mark>fraction</mark> lower than last year&#x27;s, but it is still well above the official Consumer Price Index (CPI) measure of inflation."}, {"id": 2025, "u": 21, "w": "fragile", "f": 2, "m": "frag-（打破、破碎）+-ile（能够或容易……的）", "d": "1. adj. 易碎的；脆弱的（2）", "e": "They did not always prioritize the protection of Mauna Kea&#x27;s <mark>fragile</mark> ecosystems or its holiness to the island&#x27;s inhabitants."}, {"id": 2026, "u": 21, "w": "framework", "f": 2, "m": "frame（框架、支撑结构）+work（做成的构造整体）", "d": "1. n. 框架、体系（2）", "e": "Newton&#x27;s laws of motion and Darwinian evolution each bind a host of different phenomena into a single explicatory <mark>framework</mark>."}, {"id": 2027, "u": 21, "w": "freely", "f": 2, "m": "free（自由的、不受限制的）+ly（以这种方式）", "d": "1. adv. 免费地（1）；2. adv. 自由地；不受限制地（1）", "e": "More than half of all British scientific research is now published under open access terms: either <mark>freely</mark> available from the moment of publication, or paywalled for a year or more so that the publishers can make a profit before being placed on general release."}, {"id": 2028, "u": 21, "w": "frequency", "f": 2, "m": "frequ（重复、频繁）+-ency（状态或重复程度的名词词尾）", "d": "1. n. 频率；发生次数（2）", "e": "Data can be gathered on where the customer can be engaged, such as location, devices used, website interactions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and banners at an appropriate <mark>frequency</mark>."}, {"id": 2029, "u": 21, "w": "freshman", "f": 2, "m": "fresh（新的、无经验的）+man（人）", "d": "1. n. 一年级学生；新生（2）", "e": "When this practice first started decades ago, it was usually limited to <mark>freshmen</mark>, to give them a second chance to take a class in their first year if they struggled in their transition to college-level courses."}, {"id": 2030, "u": 21, "w": "front", "f": 2, "m": "", "d": "1. n. 前面（2）", "e": "It&#x27;s enough to make a person put down the smartphone and go out <mark>front</mark> with a yard broom."}, {"id": 2031, "u": 21, "w": "frown", "f": 2, "m": "", "d": "1. n. 皱眉（1）；2. v. 不赞成（frownon）（1）", "e": "Those forced to exercise their smiling muscles __18__ more enthusiastically to funny cartoons than did those whose mouths were contracted in a <mark>frown</mark>, __19__ that expressions may influence emotions rather than just the other way around."}, {"id": 2032, "u": 21, "w": "fuel", "f": 2, "m": "", "d": "1. n. 燃料（2）", "e": "Here was abundant <mark>fuel</mark> and lumber."}, {"id": 2033, "u": 21, "w": "fundamentally", "f": 2, "m": "fundamental（基础的、根本的）+ly（从这一层面而言）", "d": "1. adv. 根本上；本质上（2）", "e": "&quot;The traditional rule was it&#x27;s safer to stay where you are, but that&#x27;s been <mark>fundamentally</mark> inverted,&quot; says one headhunter."}, {"id": 2034, "u": 21, "w": "furthermore", "f": 2, "m": "further（更进一步）+more（更多）", "d": "1. adv. 此外、而且（2）", "e": "[ B ] <mark>Furthermore</mark>"}, {"id": 2035, "u": 21, "w": "gather", "f": 2, "m": "", "d": "1. v. 收集；聚集（2）", "e": "Data can be <mark>gathered</mark> on where the customer can be engaged, such as location, devices used, website interactions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and banners at an appropriate frequency."}, {"id": 2036, "u": 21, "w": "genetic", "f": 2, "m": "genet（起源、产生）+-ic（与……有关的）", "d": "1. adj. 遗传的；基因的（2）", "e": "Not only does understanding the equines&#x27; <mark>genetic</mark> makeup help reveal their contribution to human history, but it also might improve their management in the future, as climate change alters the planet&#x27;s environment, write the authors."}, {"id": 2037, "u": 21, "w": "genetically", "f": 2, "m": "genetic（遗传的、基因的）+-ally（在这一方面、以这种方式）", "d": "1. adv. 在遗传上；通过基因方式（2）", "e": "(41)______ Humanity has the necessary agro-technological tools to eradicate hunger, from <mark>genetically</mark> engineered crops to artificial fertilizers."}, {"id": 2038, "u": 21, "w": "genre", "f": 2, "m": "gen（种类）+re（词形结尾）", "d": "1. n. 体裁；类型（2）", "e": "[ A ] <mark>genre</mark>"}, {"id": 2039, "u": 21, "w": "gigantic", "f": 2, "m": "gigant-（巨人）+ic（具有这种性质的）", "d": "1. adj. 巨大的（2）", "e": "We are still at the beginning of this revolution and small choices now may turn out to have <mark>gigantic</mark> consequences later."}, {"id": 2040, "u": 21, "w": "grain", "f": 2, "m": "", "d": "1. n. 细致程度；颗粒（fine-grained：细粒度的）（1）；2. n. 谷物（1）", "e": "In the past couple of weeks a quarrel has illustrated the value to advertisers of such fine-<mark>grained</mark> information: Should advertisers assume that people are happy to be tracked and sent behavioural ads?"}, {"id": 2041, "u": 21, "w": "gratitude", "f": 2, "m": "grat-（感激、感恩）+-itude（状态、感受的名词后缀）", "d": "1. n. 感激；感谢（2）", "e": "It is wise to take such gifts with <mark>gratitude</mark> and grace."}, {"id": 2042, "u": 21, "w": "guidance", "f": 2, "m": "guide（引导、指导，去掉末尾e）+-ance（行为或作用）", "d": "1. n. 指导；建议（2）", "e": "[ B ] <mark>guidance</mark>"}, {"id": 2043, "u": 21, "w": "guild", "f": 2, "m": "", "d": "1. n. 行会、同业公会（2）", "e": "The other reason why costs are so high is the restrictive <mark>guild</mark>-like ownership structure of the business."}, {"id": 2044, "u": 21, "w": "harvest", "f": 2, "m": "", "d": "1. n. 捕捞量（1）；2. n. 收获；收获量（1）", "e": "Pennsylvania farmers, to use one telling example, aren&#x27;t thinking about next year&#x27;s blue crab <mark>harvest</mark> in Maryland when they decide whether to spread animal waste on their fields, yet the runoff into nearby creeks can have enormous impact downstream."}, {"id": 2045, "u": 21, "w": "hazard", "f": 2, "m": "", "d": "1. n. 危险；风险（2）", "e": "__1__ , AI also has the potential <mark>hazard</mark> of __2__ our experiences in ways we might find difficult to control."}, {"id": 2046, "u": 21, "w": "headquarters", "f": 2, "m": "head（头，联系首脑）+quarter（住处）+s（本词固定保留的复数形式）", "d": "1. n. 总部；指挥部（2）", "e": "His status in Lord Wellington&#x27;s <mark>headquarters</mark> and the recognition given to him for his work were all bound up with the class politics of the army at the time."}, {"id": 2047, "u": 21, "w": "heaven", "f": 2, "m": "", "d": "1. n. 天空（2）", "e": "The same curiosity to find what lies beyond the horizon that first brought early Polynesians to Hawaii&#x27;s shores inspires astronomers today to explore the <mark>heavens</mark>."}, {"id": 2048, "u": 21, "w": "hesitate", "f": 2, "m": "hes（黏住、停住）+-itate（反复进行相应动作）", "d": "1. v. 犹豫；迟疑（2）", "e": "Spontaneous smiles were relatively easy to capture by the 1890s, so we must look elsewhere for an explanation of why Victorians still <mark>hesitated</mark> to smile."}, {"id": 2049, "u": 21, "w": "hint", "f": 2, "m": "", "d": "1. n. 暗示（2）", "e": "And perhaps faintly, they <mark>hint</mark> that people should look to intangible qualities like character and intellect rather than dieting their way to size zero or wasp-waist physiques."}, {"id": 2050, "u": 21, "w": "historic", "f": 2, "m": "histor（history去y，历史）+-ic（有关的）", "d": "1. adj. 历史上的、历史性的（2）", "e": "Fundamentally, the USPS is in a <mark>historic</mark> squeeze between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality."}, {"id": 2051, "u": 21, "w": "hitherto", "f": 2, "m": "hither（到这里）+to（到）", "d": "1. adv. 迄今为止、此前（2）", "e": "He freed music from <mark>hitherto</mark> prevailing conventions of harmony and structure."}, {"id": 2052, "u": 21, "w": "honest", "f": 2, "m": "hon（荣誉、尊严）+est（本词形容词结尾）", "d": "1. adj. 诚实的；坦诚的（2）", "e": "If you&#x27;re not sure, ask for <mark>honest</mark> feedback from trusted friends, colleagues and professionals."}, {"id": 2053, "u": 21, "w": "hopeful", "f": 2, "m": "hope（希望）+-ful（充满……的）", "d": "1. adj. 充满希望的（2）", "e": "We are <mark>hopeful</mark> with our shops now open again that normality will return and that we will be allowed to buy appropriately."}, {"id": 2054, "u": 21, "w": "hunger", "f": 2, "m": "", "d": "1. n. 渴望；需求（1）；2. n. 饥饿（1）", "e": "&quot;Mass-produced clothing, like fast food, fills a <mark>hunger</mark> and need, yet is non-durable and wasteful,&quot; Cline argues."}, {"id": 2055, "u": 21, "w": "hygiene", "f": 2, "m": "", "d": "1. n. 卫生（2）", "e": "A flashing set of healthy and clean, regular &#x27;pearly whites&#x27; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental <mark>hygiene</mark> was not guaranteed)."}, {"id": 2056, "u": 21, "w": "ignite", "f": 2, "m": "ignit-（使燃烧）+e（拼写结尾）", "d": "1. v. 点燃；起火（2）", "e": "&quot;Yet the combined consequences of suppression and climate change have eroded humanity&#x27;s ability to suppress fires, particularly those that <mark>ignite</mark> under the most dangerous weather conditions.&quot;"}, {"id": 2057, "u": 21, "w": "ignorant", "f": 2, "m": "i-（不）+gno（知道）+r（词干延伸字母）+ant（处于这种状态的）", "d": "1. adj. 无知的、不知道的（2）", "e": "Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be <mark>ignorant</mark> that the drama was a form of literature which gave glory to Greece and Rome and might yet bring honor to England."}, {"id": 2058, "u": 21, "w": "ill", "f": 2, "m": "", "d": "1. adj. 生病的（1）；2. n. 弊病（1）", "e": "&quot;I was waiting for surgery, feeling really <mark>ill</mark>, sitting in my garden."}, {"id": 2059, "u": 21, "w": "illusion", "f": 2, "m": "il-（进入其中）+lus（玩耍、戏弄）+-ion（形成的景象或认识）", "d": "1. n. 错觉；幻想（2）", "e": "However, Allen believed that the unconscious mind generates as much action as the conscious mind, and (47) while we may be able to sustain the <mark>illusion</mark> of control through the conscious mind alone, in reality we are continually faced with a question: &quot;Why cannot I make myself do this or achieve that?&quot;"}, {"id": 2060, "u": 21, "w": "imaginative", "f": 2, "m": "imagine（想象，去掉末尾e）+-ative（具有相应能力或倾向的）", "d": "1. adj. 富有想象力的（2）", "e": "[ A ] Writing in an <mark>imaginative</mark> manner."}, {"id": 2061, "u": 21, "w": "imitate", "f": 2, "m": "imit（模仿、仿效）+-ate（动词后缀）", "d": "1. v. 模仿（2）", "e": "This is a subtle form of peer pressure: we unconsciously <mark>imitate</mark> the behavior we see every day."}, {"id": 2062, "u": 21, "w": "immediate", "f": 2, "m": "im-（没有）+medi（中间）+-ate（具有这种状态的）", "d": "1. adj. 即时的；眼前的；紧接着的（2）", "e": "Perhaps willfully, it may be easier to think about such lengthy timescales than about the more <mark>immediate</mark> future."}, {"id": 2063, "u": 21, "w": "immigrant", "f": 2, "m": "im-（入）+migr（迁移）+ant（人，或具有这种状态的）", "d": "1. n. 移民（迁入者）（2）", "e": "(49) The first shiploads of <mark>immigrants</mark> bound for the territory which is now the United States crossed the Atlantic more than a hundred years after the 15th- and 16th-century explorations of North America."}, {"id": 2064, "u": 21, "w": "impair", "f": 2, "m": "", "d": "1. v. 损害、削弱（2）", "e": "[ C ] <mark>impairing</mark>"}, {"id": 2065, "u": 21, "w": "impulse", "f": 2, "m": "im-（向内）+puls（推、击打）+e（拼写结尾）", "d": "1. n. 冲动（2）", "e": "(46) In physics, one approach takes this <mark>impulse</mark> for unification to its extreme, and seeks a theory of everything - a single generative equation for all we see."}, {"id": 2066, "u": 21, "w": "incorporate", "f": 2, "m": "in-（进入）+corpor（身体；整体）+-ate（使成为的动词后缀）", "d": "1. v. 纳入；合并（2）", "e": "Dr. Annie Swanepoel, a child psychiatrist, believes that there are ways to <mark>incorporate</mark> them into western life."}, {"id": 2067, "u": 21, "w": "incur", "f": 2, "m": "in-（进入）+cur（跑；curr少写一个r）", "d": "1. v. 招致, 遭受（2）", "e": "College officials tend to emphasize that the goal of grade forgiveness is less about the grade itself and more about encouraging students to retake courses critical to their degree program and graduation without <mark>incurring</mark> a big penalty."}, {"id": 2068, "u": 21, "w": "indispensable", "f": 2, "m": "in-（不）+dis-（分开）+pens（花费）+-able（可以……的）", "d": "1. adj. 不可或缺的（2）", "e": "But policies to help workers adapt will be <mark>indispensable</mark>."}, {"id": 2069, "u": 21, "w": "indulge", "f": 2, "m": "in-（进入其中）+dulge（放纵、满足）", "d": "1. v. 纵容；迁就（2）", "e": "But in Osborneland, your first instinct is to fall into dependency - permanent dependency if you can get it -supported by a state only too ready to <mark>indulge</mark> your falsehood."}, {"id": 2070, "u": 21, "w": "infer", "f": 2, "m": "in-（进入）+fer（携带）", "d": "1. v. 推断（2）", "e": "You <mark>infer</mark> information you feel the writer has invited you to grasp by presenting you with specific evidence and clues."}, {"id": 2071, "u": 21, "w": "inferior", "f": 2, "m": "infer-（低、在下）+-ior（比较起来更……的）", "d": "1. adj. 较差的；低一等的（2）", "e": "[ D ] <mark>inferior</mark>"}, {"id": 2072, "u": 21, "w": "informal", "f": 2, "m": "in-（不）+formal（正式的、正规的）", "d": "1. adj. 非正式的（2）", "e": "No matter how formal or <mark>informal</mark> the work environment, the way you present yourself has an impact."}, {"id": 2073, "u": 21, "w": "ingredient", "f": 2, "m": "", "d": "1. n. 成分；原料（2）", "e": "Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#x27;t always know how to mix <mark>ingredients</mark> properly, says Thea van Oosten, a polymer chemist who, until retiring a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands (RCE)."}, {"id": 2074, "u": 21, "w": "inherently", "f": 2, "m": "inherent（内在的、固有的）+-ly（从这种性质而言）", "d": "1. adv. 内在地；本质上（2）", "e": "Unfortunately, the polyurethane foam he used is <mark>inherently</mark> unstable."}, {"id": 2075, "u": 21, "w": "initiative", "f": 2, "m": "initiat（initiate去e，开始、发起）+ive（行动、精神）", "d": "1. n. 倡议、行动计划（2）", "e": "In South Africa, an HIV-prevention <mark>initiative</mark> known as loveLife recruits young people to promote safe sex among their peers."}, {"id": 2076, "u": 21, "w": "inner", "f": 2, "m": "inn-（in双写n，在内）+-er（更……的）", "d": "1. adj. 内心的；内在的（2）", "e": "Mental health has commonly been called conscience, instinct, wisdom, common sense, or the <mark>inner</mark> voice."}, {"id": 2077, "u": 21, "w": "innovative", "f": 2, "m": "innovat-（innovate去e，创新）+-ive（具有这种作用或倾向的）", "d": "1. adj. 创新的（2）", "e": "I was really excited to hear that you&#x27;d invite some young craftsmen to demonstrate their <mark>innovative</mark> craft-making on campus."}, {"id": 2078, "u": 21, "w": "insight", "f": 2, "m": "in-（向内、深入）+sight（看见）", "d": "1. n. 洞察；深刻理解（2）", "e": "But understanding where the animals were first domesticated could guide archaeologists to a narrow region to search for <mark>insights</mark> about the original tamed donkeys."}, {"id": 2079, "u": 21, "w": "inspiration", "f": 2, "m": "inspire（鼓舞、使产生灵感，去掉末尾e）+-ation（过程或结果的名词后缀）", "d": "1. n. 灵感；启发（2）", "e": "There is no good reason that these artifacts should be beyond the ordinary reach of the educational objectives or <mark>inspiration</mark> of the generations to which they were left."}, {"id": 2080, "u": 21, "w": "installment", "f": 2, "m": "install（使各部分到位）+-ment（交付的部分或安排）", "d": "1. n. 连载的一期（2）", "e": "After the first <mark>installment</mark>, Dickens wrote to the artist and asked him to correct a drawing Dickens felt was not faithful enough to his prose."}, {"id": 2081, "u": 21, "w": "instant", "f": 2, "m": "in-（在……上；向）+stant（站；迫近）", "d": "1. adj. 即刻的、立即的（1）；2. n. 瞬间；片刻（1）", "e": "Their reactions may be a complex combination of <mark>instant</mark> reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment."}, {"id": 2082, "u": 21, "w": "institute", "f": 2, "m": "in-（在里面、放入其中）+stit（站、建立）+ute（本组固定词形结尾）", "d": "1. v. 设立；实行（2）", "e": "The only previous study analyzing causality, based on an area in Mexico that had <mark>instituted</mark> CCTs, supported the traditional view."}, {"id": 2083, "u": 21, "w": "instruct", "f": 2, "m": "in-（在……上）+struct（建造、建立）", "d": "1. v. 指导；教授（1）；2. v. 指示；命令（1）", "e": "[ C ] <mark>instruct</mark> first-time contributors in citation."}, {"id": 2084, "u": 21, "w": "instructive", "f": 2, "m": "instruct（教导、指导）+-ive（具有相应作用的）", "d": "1. adj. 指导式的（教学）（2）", "e": "While hunter-gatherer children learnt from observation and imitation in mixed-age playgroups, researchers said that western &quot;<mark>instructive</mark> teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder."}, {"id": 2085, "u": 21, "w": "insufficient", "f": 2, "m": "in-（不）+sufficient（充足的、足够的）", "d": "1. adj. 不足的；不充分的（2）", "e": "[ C ] <mark>insufficient</mark>"}, {"id": 2086, "u": 21, "w": "insult", "f": 2, "m": "in-（向着、在上）+sult（跳、猛冲）", "d": "1. n. 侮辱（2）", "e": "Emma Marris&#x27;s article is an <mark>insult</mark> and a disservice to the thousands of passionate people who work tirelessly to improve the lives of animals and protect our planet."}, {"id": 2087, "u": 21, "w": "intensity", "f": 2, "m": "intens（intense去e，强烈的）+ity（性质、程度）", "d": "1. n. (光、声等的)强度（2）", "e": "(48) Beethoven&#x27;s habit of increasing the volume with an extreme <mark>intensity</mark> and then abruptly following it with a sudden soft passage was only rarely used by composers before him."}, {"id": 2088, "u": 21, "w": "interference", "f": 2, "m": "interfer（干扰；interfere去e）+-ence（名词后缀）", "d": "1. n. 干预；干扰（2）", "e": "The number of women on corporate boards has been steadily increasing without government <mark>interference</mark>."}, {"id": 2089, "u": 21, "w": "intervene", "f": 2, "m": "inter-（在……之间）+ven（来）+e（词形结尾）", "d": "1. v. 干预，介入（以影响结果）（2）", "e": "But Judge Patricia Millett rightly argued in a concurring opinion that &quot;the result is unhinged from the realities of modern broadband service,&quot; and said Congress or the Supreme Court could <mark>intervene</mark> to &quot;avoid trapping Internet regulation in technological anachronism.&quot;"}, {"id": 2090, "u": 21, "w": "intervention", "f": 2, "m": "inter-（在……之间）+vent-（来）+-ion（行为）", "d": "1. n. 干预；介入（2）", "e": "[ D ] the needlessness of government <mark>interventions</mark>."}, {"id": 2091, "u": 21, "w": "inventor", "f": 2, "m": "invent（发明）+-or（做这件事的人）", "d": "1. n. 发明者（2）", "e": "One <mark>inventor</mark> patented a technique for lifting a box."}, {"id": 2092, "u": 21, "w": "inventory", "f": 2, "m": "invent（找到）+-ory（名词词尾）", "d": "1. n. 库存、存量（2）", "e": "Quicker turnarounds mean less wasted <mark>inventory</mark>, more frequent releases, and more profit."}, {"id": 2093, "u": 21, "w": "joint", "f": 2, "m": "join（连接）+-t（历史分词词尾）", "d": "1. adj. 共同的；联合的（2）", "e": "That&#x27;s because Congress has always envisioned <mark>joint</mark> federal-state immigration enforcement and explicitly encourages state officers to share information and cooperate with federal colleagues."}, {"id": 2094, "u": 21, "w": "jurisdiction", "f": 2, "m": "juris-（法律）+dict-（说、裁断）+-ion（行为、权力）", "d": "1. n. 司法管辖区（2）", "e": "Will those <mark>jurisdictions</mark> extend the same protections now denied under Sackett v. EPA?"}, {"id": 2095, "u": 21, "w": "kingdom", "f": 2, "m": "king（国王）+-dom（领域；管辖范围）", "d": "1. n. 王国（1）；2. n. 界（animalkingdom动物界）（1）", "e": "And so, the Middle East excepted, Europe is the most monarch-infested region in the world, with 10 <mark>kingdoms</mark> (not counting Vatican city and Andorra)."}, {"id": 2096, "u": 21, "w": "lady", "f": 2, "m": "", "d": "1. n. 女士（1）；2. n. 红蛱蝶（painted lady）（1）", "e": "Today we fret about the isolating culture of smartphone-staring and selfie-vanity, but already in 1939 there was that <mark>lady</mark> regretting how, when all her street got wirelesses, it lost the neighbourly habit of &quot;talking on the brush handle&quot;."}, {"id": 2097, "u": 21, "w": "layer", "f": 2, "m": "", "d": "1. n. 一层（1）；2. v. 将……分层叠加（1）", "e": "They were covered by a thick <mark>layer</mark> of sand __5__ the island of Laconia."}, {"id": 2098, "u": 21, "w": "leaf", "f": 2, "m": "", "d": "1. n. 树叶（2）", "e": "In most of the homeless gardens of New York City the actual cultivation of plants is unfeasible, yet even so the compositions often seem to represent attempts to call forth the spirit of plant and animal life, if only symbolically, through a clumplike arrangement of materials, an introduction of colors, small pools of water, and a frequent presence of petals or <mark>leaves</mark> as well as of stuffed animals."}, {"id": 2099, "u": 21, "w": "lecture", "f": 2, "m": "lect（阅读）+ure（本词的名词结尾）", "d": "1. v. 讲课；讲授（2）", "e": "This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from classroom to <mark>lecture</mark> hall is not an inevitable one and that other options are available."}, {"id": 2100, "u": 21, "w": "lend", "f": 2, "m": "", "d": "1. v. 借出、借给（1）；2. v. 适合于、易于（lend itself to）（1）", "e": "Scientists have found that exposure __8__ this hormone puts us in a trusting __9__ : In a Swiss study, researchers sprayed oxytocin into the noses of half the subjects; those subjects were ready to <mark>lend</mark> significantly higher amounts of money to strangers than were their __10__ who inhaled something else."}, {"id": 2101, "u": 22, "w": "lest", "f": 2, "m": "", "d": "1. conj. 以免、唯恐（2）", "e": "[ B ] <mark>lest</mark>"}, {"id": 2102, "u": 22, "w": "levy", "f": 2, "m": "lev（提起）+y（名词、动词词形结尾）", "d": "1. n. 税费（2）", "e": "The bill requires every rental host to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state <mark>levy</mark>."}, {"id": 2103, "u": 22, "w": "liberty", "f": 2, "m": "liber（自由）+-ty（状态或相关权利）", "d": "1. n. 自由（2）", "e": "Scientific method, reductionism and the questioning of Church ideals was to be encouraged, as were ideas of <mark>liberty</mark>, tolerance and progress."}, {"id": 2104, "u": 22, "w": "lift", "f": 2, "m": "", "d": "1. v. 起飞（lift off）（1）；2. v. 举起；抬起（1）", "e": "[ B ] Peters&#x27; signature shot is a butterfly &quot;take-off&quot;, showing the multiple wing-beats of one butterfly in one frame as it <mark>lifts</mark> off from a flower."}, {"id": 2105, "u": 22, "w": "lip", "f": 2, "m": "", "d": "1. n. 嘴唇（2）", "e": "&quot;Nature gave us <mark>lips</mark> to conceal our teeth,&quot; ran one popular Victorian maxim, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene."}, {"id": 2106, "u": 22, "w": "livelihood", "f": 2, "m": "", "d": "1. n. 生计、谋生手段（2）", "e": "(48) But the professional companies prospered in their permanent theaters, and university men with literary ambitions were quick to turn to these theaters as offering a means of <mark>livelihood</mark>."}, {"id": 2107, "u": 22, "w": "logical", "f": 2, "m": "logic（逻辑、推理规则）+-al（具有相应性质的）", "d": "1. adj. 合乎逻辑的（2）", "e": "Renaissance ideas had spread throughout Europe well into the 17th century, with the arts and sciences flourishing extraordinarily among those with a more <mark>logical</mark> disposition."}, {"id": 2108, "u": 22, "w": "loyalty", "f": 2, "m": "loyal（忠诚的）+-ty（性质、状态的名词后缀）", "d": "1. n. 忠诚（2）", "e": "Transient investors, who demand high quarterly profits from companies, can hinder a firm&#x27;s efforts to invest in long-term research or to build up customer <mark>loyalty</mark>."}, {"id": 2109, "u": 22, "w": "magnificent", "f": 2, "m": "magni（大、伟大）+fic（做、造成）+-ent（具有这种性质的）", "d": "1. adj. 壮丽的；极好的（2）", "e": "Does that mean the writing is on the wall for all European royals, with their <mark>magnificent</mark> uniforms and majestic lifestyles?"}, {"id": 2110, "u": 22, "w": "male", "f": 2, "m": "", "d": "1. adj. 男性、男性的（2）", "e": "In Cambodia, the choice of a spouse is a complex one for the young <mark>male</mark>."}, {"id": 2111, "u": 22, "w": "mankind", "f": 2, "m": "man（人）+kind（种类）", "d": "1. n. 人类（2）", "e": "To ensure the future of <mark>mankind</mark>, it is crucial to____"}, {"id": 2112, "u": 22, "w": "manuscript", "f": 2, "m": "manu-（手）+script-（写下的文字）", "d": "1. n. 稿件（2）", "e": "The SBoRE panel will then find external statisticians to review these <mark>manuscripts</mark>."}, {"id": 2113, "u": 22, "w": "march", "f": 2, "m": "", "d": "1. n. .三月（2）", "e": "The US $3-million Fundamental Physics Prize is indeed an interesting experiment, as Alexander Polyakov said when he accepted this year&#x27;s award in <mark>March</mark>."}, {"id": 2114, "u": 22, "w": "marginal", "f": 2, "m": "margin（边缘、边界）+-al（处在相应位置或具有相应性质的）", "d": "1. adj. 能力勉强够用的（1）；2. adj. 边缘的；作用有限的（1）", "e": "This makes it harder for the <mark>marginal</mark> manager to gain employment."}, {"id": 2115, "u": 22, "w": "marry", "f": 2, "m": "", "d": "1. v. (和某人)结婚（2）", "e": "__5__ a spouse has been selected, each family investigates the other to make sure its child is <mark>marrying</mark> __6__ a good family."}, {"id": 2116, "u": 22, "w": "masterpiece", "f": 2, "m": "master（高超的）+piece（作品）", "d": "1. n. 杰作（2）", "e": "But look at what happened to Boston&#x27;s Gardner Museum theft in 1990, including the loss of Rembrandt, Vermeer, Manet, and other <mark>masterpieces</mark>."}, {"id": 2117, "u": 22, "w": "match", "f": 2, "m": "", "d": "1. v. 匹敌、比得上（1）；2. v. 配对、匹配（1）", "e": "[ A ] <mark>match</mark>"}, {"id": 2118, "u": 22, "w": "medicine", "f": 2, "m": "med（治疗、医疗）+ic（相关）+ine（本词名词结尾）", "d": "1. n. 医学（1）；2. n. 药物（1）", "e": "Although more than half of Harvard undergraduates end up in law, <mark>medicine</mark> or business, future doctors and lawyers must study a non-specialist liberal-arts degree before embarking on a professional qualification."}, {"id": 2119, "u": 22, "w": "medieval", "f": 2, "m": "medi-（中间）+ev（时代）+-al（形容词后缀）", "d": "1. adj. 中世纪的（2）", "e": "(46) with the Church&#x27;s teachings and ways of thinking eclipsed by the Renaissance, the gap between the <mark>Medieval</mark> and modern periods had been bridged leading to new and unexplored intellectual territories."}, {"id": 2120, "u": 22, "w": "mend", "f": 2, "m": "", "d": "1. v. 修复；使愈合（1）；2. v. 改正行为（mend one’s ways）（1）", "e": "(46) We don&#x27;t have to learn how to be mentally healthy; it is built into us in the same way that our bodies know how to heal a cut or <mark>mend</mark> a broken bone."}, {"id": 2121, "u": 22, "w": "merger", "f": 2, "m": "merge（去掉末尾e，合并）+-er（行为或过程）", "d": "1. n. （公司、组织的）合并，兼并（2）", "e": "It comes at a time when authors are already worried about the consequences of the proposed <mark>merger</mark> between PRH and another big publisher, Simon &amp; Schuster-the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower advances, and more conformity in terms of what is published."}, {"id": 2122, "u": 22, "w": "meter", "f": 2, "m": "", "d": "1. n. 米（长度单位）（2）", "e": "The nail hoard was discovered in 1960 in a four-<mark>metre</mark>-deep pit covered by two <mark>metres</mark> of gravel."}, {"id": 2123, "u": 22, "w": "migrate", "f": 2, "m": "migr（迁移、移动）+ate（动词后缀）", "d": "1. v. 迁移、转移（2）", "e": "Readers are <mark>migrating</mark> away from print anyway."}, {"id": 2124, "u": 22, "w": "mindset", "f": 2, "m": "mind（思想、思维）+set（固定下来的状态、倾向）", "d": "1. n. 思维模式；观念（2）", "e": "Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial predecessors, even if parents and teachers tend to be still set in the degree <mark>mindset</mark>."}, {"id": 2125, "u": 22, "w": "miracle", "f": 2, "m": "mir（惊奇）+-acle（引起相应感受的事物）", "d": "1. n. 奇迹（2）", "e": "The <mark>miracle</mark> of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the mix of land and water."}, {"id": 2126, "u": 22, "w": "mislead", "f": 2, "m": "mis-（错误地）+lead（引导、带领）", "d": "1. v. 误导（2）", "e": "[ B ] will <mark>mislead</mark> behavioral studies."}, {"id": 2127, "u": 22, "w": "mission", "f": 2, "m": "miss（派遣）+-ion（相关人或事的名词后缀）", "d": "1. n. 使命、任务（2）", "e": "She uses outdated research and decades-old examples to undermine the noble <mark>mission</mark> of organizations committed to connecting children to a world beyond their own."}, {"id": 2128, "u": 22, "w": "mobility", "f": 2, "m": "mobile（去掉末尾e，能够移动的）+-ity（性质或能力）", "d": "1. n. 流动性；流动（2）", "e": "Education was no longer a secure route of social <mark>mobility</mark>."}, {"id": 2129, "u": 22, "w": "moderate", "f": 2, "m": "moder-（尺度；限度）+-ate（动词或形容词词尾）", "d": "1. v. 减轻；缓和（2）", "e": "[ C ] <mark>moderate</mark>"}, {"id": 2130, "u": 22, "w": "monitor", "f": 2, "m": "mon（提醒、警告）+i（连接字母）+-tor（执行作用的人或装置）", "d": "1. v. 监测；监督（2）", "e": "Board members like her &quot;casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a non-profit group that <mark>monitors</mark> public education."}, {"id": 2131, "u": 22, "w": "motion", "f": 2, "m": "mot（移动、推动）+-ion（行为或过程的名词后缀，整词也可作动词）", "d": "1. n. 运动；移动（2）", "e": "Newton&#x27;s laws of <mark>motion</mark> and Darwinian evolution each bind a host of different phenomena into a single explicatory framework."}, {"id": 2132, "u": 22, "w": "mysterious", "f": 2, "m": "mystery（神秘，y变i）+-ous（形容词后缀）", "d": "1. adj. 神秘的（2）", "e": "[ B ] <mark>mysterious</mark>"}, {"id": 2133, "u": 22, "w": "myth", "f": 2, "m": "", "d": "1. n. 错误观念；不实的说法（2）", "e": "They perpetuate the <mark>myth</mark> of the lone genius."}, {"id": 2134, "u": 22, "w": "navigation", "f": 2, "m": "navigate（去e，导航、航行）+-ion（行为、过程）", "d": "1. n. 导航；辨别行进方向（2）", "e": "Today we live in a world where GPS systems, digital maps, and other <mark>navigation</mark> apps are available on our smartphones."}, {"id": 2135, "u": 22, "w": "navy", "f": 2, "m": "nav（船、航海）+y（名词结尾）", "d": "1. n. 海军（2）", "e": "It has housed 16 Secretaries of the <mark>Navy</mark>, 21 Secretaries of War, and 24 Secretaries of State."}, {"id": 2136, "u": 22, "w": "negatively", "f": 2, "m": "negative（消极的、负面的）+-ly（以这种方式、产生这种方向的影响）", "d": "1. adv. 负面地；不利地（2）", "e": "Such programs do not have to <mark>negatively</mark> affect the environment, though."}, {"id": 2137, "u": 22, "w": "negotiation", "f": 2, "m": "negotiat（negotiate去e，谈判、协商）+-ion（这种活动的过程）", "d": "1. n. 协商；交涉（2）", "e": "A young man can __2__ a likely spouse on his own and then ask his parents to __3__ the marriage <mark>negotiations</mark>, or the young man&#x27;s parents may make the choice of a spouse, giving the child little to say in the selection."}, {"id": 2138, "u": 22, "w": "normal", "f": 2, "m": "norm（规则、标准）+-al（形容词结尾）", "d": "1. adj. 正常的；通常的（2）", "e": "But keeping sensitive information on these devices is increasingly a requirement of <mark>normal</mark> life."}, {"id": 2139, "u": 22, "w": "nose", "f": 2, "m": "", "d": "1. n. 捏着鼻子忍受（hold one&#x27;s nose比喻勉强接受）（1）；2. n. 鼻子（1）", "e": "But it did so while holding its <mark>nose</mark> at the ethics of his conduct, which included accepting gifts such as a Rolex watch and a Ferrari automobile from a company seeking access to government."}, {"id": 2140, "u": 22, "w": "obsession", "f": 2, "m": "obsess（缠住心思、占据头脑）+-ion（状态或所念之事）", "d": "1. n. 痴迷；着迷（2）", "e": "[ B ] <mark>obsession</mark> with high fashion."}, {"id": 2141, "u": 22, "w": "obsolete", "f": 2, "m": "", "d": "1. adj. 过时的（2）", "e": "As technology advances and a format becomes <mark>obsolete</mark>, the object is useless."}, {"id": 2142, "u": 22, "w": "occupation", "f": 2, "m": "occup-（occupy去y，占据）+-ation（行为、状态）", "d": "1. n. 占领（1）；2. n. 职业（1）", "e": "A small but vocal group of Hawaiians and environmentalists have long viewed their presence as disrespect for sacred land and a painful reminder of the <mark>occupation</mark> of what was once a sovereign nation."}, {"id": 2143, "u": 22, "w": "optimism", "f": 2, "m": "optim-（最好）+-ism（态度；信念）", "d": "1. n. 乐观；乐观态度（2）", "e": "It&#x27;s a form of innate or unlearned <mark>optimism</mark>."}, {"id": 2144, "u": 22, "w": "outlet", "f": 2, "m": "out（向外）+let（让、使通过）", "d": "1. n. 媒体机构（1）；2. n. 渠道、发布平台（1）", "e": "Many French politicians and media <mark>outlets</mark> have referred to this as a &quot;GAFA tax,&quot; meaning that it is designed to apply primarily to companies such as Google, Apple, Facebook and Amazon-in other words, multinational tech companies based in the United States."}, {"id": 2145, "u": 22, "w": "outsider", "f": 2, "m": "outsid（outside去e，外部、外面）+-er（处在相应位置的人）", "d": "1. n. 外部人士；行外人（2）", "e": "There is pressure for change from within the profession, but opponents of change among the regulators insist that keeping <mark>outsiders</mark> out of a law firm isolates lawyers from the pressure to make money rather than serve clients ethically."}, {"id": 2146, "u": 22, "w": "overestimate", "f": 2, "m": "over-（超过、过高）+estimate（估计）", "d": "1. v. 高估（2）", "e": "[ D ] <mark>overestimate</mark> the value of live performances."}, {"id": 2147, "u": 22, "w": "painful", "f": 2, "m": "pain（痛、痛苦；劳苦）+ful（充满或带来这种感受的）", "d": "1. adj. 痛苦的；令人难受的（2）", "e": "It is <mark>painful</mark> to read these roundabout accounts today."}, {"id": 2148, "u": 22, "w": "palace", "f": 2, "m": "", "d": "1. n. 宫殿（2）", "e": "The word &quot;caravanserai&quot; is a __3__ of the Persian words &quot;karvan&quot;, which means a group of travellers or a caravan, and &quot;saray&quot;, a <mark>palace</mark> or enclosed building."}, {"id": 2149, "u": 22, "w": "palm", "f": 2, "m": "", "d": "1. n. 手掌（1）；2. n. 棕榈（1）", "e": "Now think of your laptop, thinner than a brown-paper envelope, or your cellphone in the <mark>palm</mark> of your hand."}, {"id": 2150, "u": 22, "w": "panic", "f": 2, "m": "", "d": "1. n. 恐慌；惊慌（2）", "e": "&quot;There are as many scientists working against all the <mark>panic</mark> of global climate change as there are those who are pushing it,&quot; she claims."}, {"id": 2151, "u": 22, "w": "parenthood", "f": 2, "m": "parent（父亲或母亲）+-hood（身份、状态）", "d": "1. n. 为人父母（2）", "e": "Of course, the image of <mark>parenthood</mark> that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock."}, {"id": 2152, "u": 22, "w": "parenting", "f": 2, "m": "parent（父亲或母亲；作父母养育）+-ing（活动）", "d": "1. n. 养育子女；育儿（2）", "e": "[ C ] the conventional <mark>parenting</mark> style in western culture"}, {"id": 2153, "u": 22, "w": "parliament", "f": 2, "m": "parl（说话、商谈）+ia（连接部分）+-ment（活动及其组织）", "d": "1. n. 议会（2）", "e": "The <mark>parliament</mark> also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting."}, {"id": 2154, "u": 22, "w": "partner", "f": 2, "m": "part（共同事务中的一份）+n（本词的连接字母）+-er（人）", "d": "1. n. 伴侣（1）；2. n. 合伙人（1）", "e": "No shock there, considering how much work it is to raise a kid without a <mark>partner</mark> to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake."}, {"id": 2155, "u": 22, "w": "passion", "f": 2, "m": "pass-（承受、遭受）+-ion（经历、状态）", "d": "1. n. 热情；热爱（2）", "e": "Big-name PRH authors may suffer a bit, but it&#x27;s those mid-list authors, who normally rely on Waterstones staff&#x27;s <mark>passion</mark> for promoting books by lesser-known writers, who will be praying for an end to the dispute."}, {"id": 2156, "u": 22, "w": "patch", "f": 2, "m": "", "d": "1. n. 小片区域（2）", "e": "(50) The experiment showed that elephants may well use smell to identify <mark>patches</mark> of trees that are good to eat, and secondly to assess the quality of the trees within each <mark>patch</mark>."}, {"id": 2157, "u": 22, "w": "peace", "f": 2, "m": "", "d": "1. n. 平静；安宁（2）", "e": "(47) A sacred place of <mark>peace</mark>, however crude it may be, is a distinctly human need, as opposed to shelter, which is a distinctly animal need."}, {"id": 2158, "u": 22, "w": "penalty", "f": 2, "m": "penal（惩罚的）+-ty（名词后缀）", "d": "1. n. 处罚；罚款（2）", "e": "The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient <mark>penalties</mark>."}, {"id": 2159, "u": 22, "w": "peninsula", "f": 2, "m": "pen-（几乎）+insula（岛）", "d": "1. n. 半岛（2）", "e": "Studying Scovell&#x27;s papers at the Public Record Office, London, I found that he had left an extensive journal and copious notes about his work in the <mark>peninsula</mark>."}, {"id": 2160, "u": 22, "w": "pension", "f": 2, "m": "pens（称量；支付）+-ion（名词后缀）", "d": "1. n. 养老金、退休金（2）", "e": "The FASB and IASB have been exactly that, cleaning up rules on stock options and <mark>pensions</mark>, for example, against hostility from special interests."}, {"id": 2161, "u": 22, "w": "perception", "f": 2, "m": "per-（充分）+cept-（抓住）+-ion（过程、结果）", "d": "1. n. 认识；感知；看法（2）", "e": "Favoritism in official access can fan public <mark>perceptions</mark> of corruption."}, {"id": 2162, "u": 22, "w": "perfectly", "f": 2, "m": "perfect（完全的、完美的）+-ly（达到这种程度、以这种方式）", "d": "1. adv. 完全地；十分（1）；2. adv. 完美地（1）", "e": "(49) Although mental health is the cure-all for living our lives, it is <mark>perfectly</mark> ordinary as you will see that it has been there to direct you through all your difficult decisions."}, {"id": 2163, "u": 22, "w": "permanently", "f": 2, "m": "permanent（永久的、持久的）+-ly（副词后缀）", "d": "1. adv. 永久地；长期地（2）", "e": "Fundamentally, the USPS is in a historic squeeze between technological change that has <mark>permanently</mark> decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality."}, {"id": 2164, "u": 22, "w": "personnel", "f": 2, "m": "person（人）+nel（本词集合性名词结尾）", "d": "1. n. 人员、职员（2）", "e": "There&#x27;s no change to collective bargaining at the USPS, a major omission considering that <mark>personnel</mark> accounts for 80 percent of the agency&#x27;s costs."}, {"id": 2165, "u": 22, "w": "phase", "f": 2, "m": "phas-（显现、呈现的状态）+e（拼写结尾）", "d": "1. v. 分阶段引入、逐步实施（phase in）（2）", "e": "In 2007, Indonesia started <mark>phasing</mark> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care."}, {"id": 2166, "u": 22, "w": "philosopher", "f": 2, "m": "philosoph（哲学；philosophy去y）+-er（从事者）", "d": "1. n. 哲学家（2）", "e": "Ancient Greek <mark>philosopher</mark> Aristotle viewed laughter as &quot;a bodily exercise precious to health.&quot;"}, {"id": 2167, "u": 22, "w": "physicist", "f": 2, "m": "physic-（physics的词干，物理学）+-ist（从事者）", "d": "1. n. 物理学家（2）", "e": "As a result, scientists - <mark>physicists</mark> in particular - found themselves in high demand."}, {"id": 2168, "u": 22, "w": "pile", "f": 2, "m": "pil（柱状堆叠）+e（词形结尾）", "d": "1. v. 堆积；堆放（1）；2. v. 蜂拥进入（1）", "e": "[ B ] <mark>piling</mark>"}, {"id": 2169, "u": 22, "w": "pipe", "f": 2, "m": "", "d": "1. n. 管道（2）", "e": "A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground <mark>pipe</mark> system leakage, raised serious questions about both Vermont Yankee&#x27;s safety and Entergy&#x27;s management -especially after the company made misleading statements about the <mark>pipe</mark>."}, {"id": 2170, "u": 22, "w": "pit", "f": 2, "m": "", "d": "1. n. 剧场正厅后排（旧时廉价站席）（1）；2. n. 坑、深坑（1）", "e": "By the time that Shakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once popular and literary; Kyd had written a tragedy that crowded the <mark>pit</mark>; and Marlowe had brought poetry and genius to triumph on the common stage - where they had played no part since the death of Euripides."}, {"id": 2171, "u": 22, "w": "plane", "f": 2, "m": "", "d": "1. n. 层面（1）；2. n. 飞机（1）", "e": "It took place on many different <mark>planes</mark>: between Napoleon&#x27;s French army and the angry inhabitants; between the British, ever keen to exacerbate the emperor&#x27;s difficulties, and the marshals sent from Paris to try to keep them in check; between new forces of science and meritocracy and old ones of conservatism and birth."}, {"id": 2172, "u": 22, "w": "plateau", "f": 2, "m": "plat（平的）+eau（本词名词结尾）", "d": "1. n. 稳定阶段；平台期（1）；2. n. 趋于稳定（1）", "e": "Workers __19__ to be diligent for the first few days of the week in any case, before __20__ a <mark>plateau</mark> and then slackening off."}, {"id": 2173, "u": 22, "w": "plead", "f": 2, "m": "plea（请求、恳求）+d（本词保留词形结尾）", "d": "1. v. 恳求、呼吁（2）", "e": "Only Ukip, sensing its chance, has sided with those <mark>pleading</mark> for a more considered approach to using green land."}, {"id": 2174, "u": 22, "w": "polish", "f": 2, "m": "", "d": "1. adj. 波兰的（1）；2. n. 擦亮剂；鞋油（1）", "e": "A <mark>Polish</mark> digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering."}, {"id": 2175, "u": 22, "w": "pollutant", "f": 2, "m": "pollute（污染，去e）+-ant（物质）", "d": "1. n. 污染物（2）", "e": "The reality is that water, and the <mark>pollutants</mark> that so often come with it, don&#x27;t respect state boundaries."}, {"id": 2176, "u": 22, "w": "portable", "f": 2, "m": "port（携带、运送）+-able（能够……的）", "d": "1. adj. 便携的；可移动的（2）", "e": "But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other <mark>portable</mark> cameras meant that, though slow by today&#x27;s digital standards, the exposure was almost instantaneous."}, {"id": 2177, "u": 22, "w": "portray", "f": 2, "m": "por-（呈现出来）+tray（画、描绘）", "d": "1. v. 描绘；刻画（2）", "e": "Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while <mark>portraying</mark> conservative or classical liberal ideas - such as free markets and self-reliance - as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation."}, {"id": 2178, "u": 22, "w": "possession", "f": 2, "m": "possess（占有、拥有）+-ion（状态、权利或相关事物的名词后缀）", "d": "1. n. 拥有；占有（2）", "e": "But this distinction misses the point that it is processing and aggregation, not the mere <mark>possession</mark> of bits, that gives the data value."}, {"id": 2179, "u": 22, "w": "postpone", "f": 2, "m": "post-（后）+pon（放置）+e（词形结尾）", "d": "1. v. 推迟（2）", "e": "[ D ] <mark>postpone</mark>"}, {"id": 2180, "u": 22, "w": "precede", "f": 2, "m": "pre-（在前）+ced（走）+e（词形结尾）", "d": "1. v. 优先于（1）；2. v. 先于（1）", "e": "The Constitutional principles that Washington alone has the power to &quot;establish a uniform Rule of Naturalization&quot; and that federal laws <mark>precede</mark> state laws are noncontroversial."}, {"id": 2181, "u": 22, "w": "precious", "f": 2, "m": "preci（价值）+-ous（具有这种性质的）", "d": "1. adj. 珍贵的；宝贵的（2）", "e": "Ancient Greek philosopher Aristotle viewed laughter as &quot;a bodily exercise <mark>precious</mark> to health.&quot;"}, {"id": 2182, "u": 22, "w": "predecessor", "f": 2, "m": "pre-（在前）+de-（离开）+cess（走）+-or（人）", "d": "1. n. 前任；前辈（2）", "e": "Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial <mark>predecessors</mark>, even if parents and teachers tend to be still set in the degree mindset."}, {"id": 2183, "u": 22, "w": "prediction", "f": 2, "m": "predict（预测）+ion（行为、结果）", "d": "1. n. 预测；预言（2）", "e": "They reimagined the 300-year-old score by injecting the latest climate <mark>prediction</mark> data for each season-provided by Monash University&#x27;s Climate Change Communication Research Hub."}, {"id": 2184, "u": 22, "w": "pregnant", "f": 2, "m": "pre-（在前）+gn（生育、出生）+-ant（处于这种状态的）", "d": "1. adj. 怀孕的（2）", "e": "There are also stories about newly adoptive - and newly single - mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is <mark>pregnant</mark>&quot; news."}, {"id": 2185, "u": 22, "w": "prejudice", "f": 2, "m": "pre-（预先）+jud（判断）+-ice（名词词尾；整词也可作动词）", "d": "1. n. 偏见；成见（2）", "e": "Divorced persons may remarry, but a gender <mark>prejudice</mark> __19__ up: The divorced male doesn&#x27;t have a waiting period before he can remarry __20__ the woman must wait ten months."}, {"id": 2186, "u": 22, "w": "prime", "f": 2, "m": "prim（第一、首要）+e（词形结尾）", "d": "1. adj. 首要的、主要的（1）；2. n. 全盛时期、盛年（1）", "e": "[ B ] Feasibility should be a <mark>prime</mark> concern in policymaking."}, {"id": 2187, "u": 22, "w": "principal", "f": 2, "m": "prin（第一、首要）+cip（取）+-al（相应性质，也可指人或物）", "d": "1. adj. 主要的；首要的（2）", "e": "(47) The United States is the product of two <mark>principal</mark> forces -the immigration of European peoples with their varied ideas, customs, and national characteristics and the impact of a new country which modified these traits."}, {"id": 2188, "u": 22, "w": "prioritize", "f": 2, "m": "priority（去y，优先、优先事项）+-ize（使形成相应安排）", "d": "1. v. 优先安排、优先考虑（2）", "e": "They did not always <mark>prioritize</mark> the protection of Mauna Kea&#x27;s fragile ecosystems or its holiness to the island&#x27;s inhabitants."}, {"id": 2189, "u": 22, "w": "privileged", "f": 2, "m": "privilege（去e，给予特权）+ed（已经获得这种待遇的）", "d": "1. adj. 享有特权的；优越的（2）", "e": "On the overturned provisions the majority held Congress had deliberately &quot;occupied the field&quot; and Arizona had thus intruded on the federal&#x27;s <mark>privileged</mark> powers."}, {"id": 2190, "u": 22, "w": "processing", "f": 2, "m": "process（处理、加工）+-ing（正在开展的动作）", "d": "1. v. 处理;加工（2）", "e": "A number of companies, particularly in energy and transportation, use AI image <mark>processing</mark> technology to inspect infrastructure and prevent equipment failure or leaks before they happen."}, {"id": 2191, "u": 22, "w": "promotion", "f": 2, "m": "promot-（promote去e，促进）+-ion（名词后缀）", "d": "1. n. 推广；促销（1）；2. n. 晋升，升职（1）", "e": "The new awards are an exercise in self-<mark>promotion</mark> for those behind them, say scientists."}, {"id": 2192, "u": 22, "w": "prone", "f": 2, "m": "", "d": "1. adj. 易于……的；有……倾向的（2）", "e": "[ D ] <mark>prone</mark>"}, {"id": 2193, "u": 22, "w": "prose", "f": 2, "m": "", "d": "1. n. 散文（2）", "e": "Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian <mark>prose</mark> in which he specialized."}, {"id": 2194, "u": 22, "w": "province", "f": 2, "m": "", "d": "1. n. 外省；首都以外地区（1）；2. n. 省（1）", "e": "What is true of London is even truer of the <mark>provinces</mark>."}, {"id": 2195, "u": 22, "w": "psychological", "f": 2, "m": "psychology（去掉末尾y，心理学）+ical（与之有关的）", "d": "1. adj. 心理的；心理学的（2）", "e": "When we are deprived of green, of plants, of trees, (49) most of us give in to a demoralization of spirit which we usually blame on some <mark>psychological</mark> conditions, until one day we find ourselves in a garden and feel the oppression vanish as if by magic."}, {"id": 2196, "u": 22, "w": "psychologist", "f": 2, "m": "psycholog（心理学；psychology去y）+-ist（从业者）", "d": "1. n. 心理学家（2）", "e": "It can catch someone&#x27;s attention in a crowded room, &quot;Eye contact and smile&quot; can signal availability and confidence, a common-sense notion supported in studies by <mark>psychologist</mark> Monica Moore."}, {"id": 2197, "u": 22, "w": "psychology", "f": 2, "m": "psych（心灵、精神）+o（连接字母）+-logy（研究、学科）", "d": "1. n. 心理学（2）", "e": "Her critique of the lameness of many public-health campaigns is spot-on: they fail to mobilize peer pressure for healthy habits, and they demonstrate a seriously flawed understanding of <mark>psychology</mark>."}, {"id": 2198, "u": 22, "w": "pulse", "f": 2, "m": "puls（击打、推动）+e（词形结尾）", "d": "1. n. (电、光、声的)脉冲（1）；2. n. 脉搏（比喻地球状况）（1）", "e": "This __11__ makes sense if you simplify the workings of a complex brain, __12__ it to an array of electrical <mark>pulses</mark>; cells in plants also communicate through electrical signals."}, {"id": 2199, "u": 22, "w": "punch", "f": 2, "m": "", "d": "1. n. 抢先行动（beat to the punch）（1）；2. n. 一拳；打击（比喻）（1）", "e": "Later, more established companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the <mark>punch</mark>."}, {"id": 2200, "u": 22, "w": "qualify", "f": 2, "m": "qual（什么样的、具有什么性质）+-ify（使成为）", "d": "1. v. 具备资格；符合条件（2）", "e": "Since students and parents expect a college degree to lead to a job, it is in the best interest of a school to turn out graduates who are as <mark>qualified</mark> as possible - or at least appear to be."}, {"id": 2201, "u": 23, "w": "quarrel", "f": 2, "m": "", "d": "1. n. 争吵（2）", "e": "In the past couple of weeks a <mark>quarrel</mark> has illustrated the value to advertisers of such fine-grained information: Should advertisers assume that people are happy to be tracked and sent behavioural ads?"}, {"id": 2202, "u": 23, "w": "quest", "f": 2, "m": "", "d": "1. v. 追求；探索（2）", "e": "It was to ruin lives in the <mark>quest</mark> for circulation and impact."}, {"id": 2203, "u": 23, "w": "rake", "f": 2, "m": "", "d": "1. v. 大量赚取（rake in）（2）", "e": "But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the titles on their own, illegitimate services, which <mark>rake</mark> in about $2 billion annually from ads and subscriptions."}, {"id": 2204, "u": 23, "w": "rally", "f": 2, "m": "", "d": "1. v. 动员；争取支持（2）", "e": "In Wisconsin the unions have <mark>rallied</mark> thousands of supporters against Scott Walker, the hardline Republican governor."}, {"id": 2205, "u": 23, "w": "random", "f": 2, "m": "", "d": "1. adj. 随机的；随意的（2）", "e": "True: for more than 80 pre-digital years, linear speech broadcasting brought the gift of serendipity, <mark>random</mark> enlivening of a car journey or dull manual task."}, {"id": 2206, "u": 23, "w": "ratio", "f": 2, "m": "rat（计算、推理）+io（词形结尾）", "d": "1. n. 比例（2）", "e": "An infant born to a hunter-gatherer society could have more than ten caregivers-this contrasts starkly to nursery settings in the UK where regulations call for a <mark>ratio</mark> of one carer to four children aged two to three."}, {"id": 2207, "u": 23, "w": "reap", "f": 2, "m": "", "d": "1. v. 获得；收获（2）", "e": "[ B ] <mark>reaped</mark> benefits from the war with digital pirates"}, {"id": 2208, "u": 23, "w": "rear", "f": 2, "m": "", "d": "1. adj. 背面的、后部的（1）；2. v. 抚养、养育（1）", "e": "One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and <mark>Rear</mark> Cell technology which is now found in most of the world&#x27;s solar panels."}, {"id": 2209, "u": 23, "w": "recognition", "f": 2, "m": "re-（再次）+cogn（认知）+-ition（过程或结果的名词结尾）", "d": "1. n. 认可；承认（2）", "e": "His status in Lord Wellington&#x27;s headquarters and the <mark>recognition</mark> given to him for his work were all bound up with the class politics of the army at the time."}, {"id": 2210, "u": 23, "w": "recommendation", "f": 2, "m": "recommend（推荐、建议）+-ation（这种行为或提出的内容）", "d": "1. n. 推荐；建议（2）", "e": "2)give reasons for your <mark>recommendation</mark>."}, {"id": 2211, "u": 23, "w": "recovery", "f": 2, "m": "recover（恢复、痊愈、重新获得）+-y（过程或结果的名词后缀）", "d": "1. n. 经济复苏；恢复发展（2）", "e": "As the first signs of <mark>recovery</mark> begin to take hold, deputy chiefs may be more willing to make the jump without a net."}, {"id": 2212, "u": 23, "w": "refuge", "f": 2, "m": "re-（回、退离）+fug-（逃）+e（词尾字母）", "d": "1. n. 野生动物保护区（2）", "e": "These are mostly students who had no opportunity as children to travel to wilderness areas, wildlife <mark>refuges</mark> or national parks."}, {"id": 2213, "u": 23, "w": "regime", "f": 2, "m": "reg（统治、管理）+ime（本词的名词词形结尾）", "d": "1. n. 制度（1）；2. n. 政权（1）", "e": "In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal <mark>regime</mark>."}, {"id": 2214, "u": 23, "w": "relative", "f": 2, "m": "relate（关联；去e）+-ive（形容词或名词后缀）", "d": "1. adj. 相对的，比较而言的（2）", "e": "If left to themselves, such trends will diminish the <mark>relative</mark> strength of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process outsourcing in other languages such as Japanese, French and German, spreads."}, {"id": 2215, "u": 23, "w": "relieve", "f": 2, "m": "re-（解除；减轻）+lieve（举起；减轻，历史词干）", "d": "1. v. 缓解；减轻（2）", "e": "[ A ] <mark>Relieved</mark>."}, {"id": 2216, "u": 23, "w": "religion", "f": 2, "m": "re（重新、反复）+lig（绑、连接）+-ion（名词形式）", "d": "1. n. 宗教（2）", "e": "Humans are unique in their capacity to not only make tools but then turn around and use them to create superfluous material goods - paintings, sculpture and architecture - and superfluous experiences - music, literature, <mark>religion</mark> and philosophy."}, {"id": 2217, "u": 23, "w": "remains", "f": 2, "m": "remain（留下、剩余）+-s（复数词形）", "d": "1. n. 遗迹、遗存（2）", "e": "[ C ] <mark>remains</mark>"}, {"id": 2218, "u": 23, "w": "remark", "f": 2, "m": "re-（再次）+mark（标记）", "d": "1. n. 评论；言论（1）；2. v. 评论；谈到（1）", "e": "Queen Liliuokalani&#x27;s <mark>remark</mark> in Paragraph 1 indicates____"}, {"id": 2219, "u": 23, "w": "remote", "f": 2, "m": "re-（向后、离开）+mot（移动）+e（拼写结尾）", "d": "1. adj. 可能性渺茫的（1）；2. adj. 遥远的；远程的（1）", "e": "The prospect seems <mark>remote</mark>."}, {"id": 2220, "u": 23, "w": "renew", "f": 2, "m": "re-（重新、再次）+new（新）", "d": "1. v. 更新；重新开始（2）", "e": "These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don&#x27;t advertise that - and to <mark>renew</mark> their wardrobe every few weeks."}, {"id": 2221, "u": 23, "w": "renewable", "f": 2, "m": "renew（更新、恢复）+-able（能够被……的）", "d": "1. adj. 可再生的；可更新的（2）", "e": "Every day, scientists, technologists and engineers are discovering new ways to exploit <mark>renewable</mark> energy sources and develop techniques not just to use power more intelligently but to power our intelligence."}, {"id": 2222, "u": 23, "w": "repair", "f": 2, "m": "re-（重新）+pair（准备、安排）", "d": "1. v. 修复（2）", "e": "[ C ] <mark>repairing</mark>"}, {"id": 2223, "u": 23, "w": "reply", "f": 2, "m": "re-（返回）+ply（折叠、折回）", "d": "1. n. 回复、回答（1）；2. v. 回复、回答（1）", "e": "Raise objections and listen carefully to their <mark>replies</mark>."}, {"id": 2224, "u": 23, "w": "reporter", "f": 2, "m": "report（报告、汇报）+-er（从事者）", "d": "1. n. 记者（2）", "e": "He taught himself shorthand to get an even better job later as a court stenographer and as a <mark>reporter</mark> in Parliament."}, {"id": 2225, "u": 23, "w": "reproduce", "f": 2, "m": "re-（再次）+produce（生产、带出结果）", "d": "1. v. 再现；复制（2）", "e": "Just how people think is still far too complex to be understood, let alone <mark>reproduced</mark>, says David Eagleman, a Stanford University neuroscientist."}, {"id": 2226, "u": 23, "w": "reserve", "f": 2, "m": "re-（往回留）+serv（保持）+e（词形结尾）", "d": "1. n. 保护区；自然保护区（1）；2. v. 保留；预留（1）", "e": "[ C ] Britain has relatively few butterfly species compared with mainland Europe and 80% are in decline, mostly because intensive chemical farming has reduced many species to tiny fragments of habitat and small nature <mark>reserves</mark>."}, {"id": 2227, "u": 23, "w": "resilient", "f": 2, "m": "re-（回来）+sili（跳、弹）+-ent（具有这种性质的）", "d": "1. adj. 适应力强的；有恢复力的（2）", "e": "At Yosemite National Park, Martin oversaw the use of what is known as prescribed burns to make the landscape more <mark>resilient</mark>."}, {"id": 2228, "u": 23, "w": "resolution", "f": 2, "m": "re-（进一步）+solut（松开、解开）+-ion（相应过程或结果）", "d": "1. n. 决议（1）；2. n. 解决（争端）（1）", "e": "[ C ] has issued a special <mark>resolution</mark>."}, {"id": 2229, "u": 23, "w": "resolve", "f": 2, "m": "re-（进一步）+solve（松开、解开）", "d": "1. v. 解决（问题、困难）（2）", "e": "Perhaps museums and governments might explore some role for the use of nearly exact reproductions as a means of <mark>resolving</mark> issues relating to returning works of art and antiquities."}, {"id": 2230, "u": 23, "w": "respondent", "f": 2, "m": "respond（回答）+-ent（做这件事的人）", "d": "1. n. 受访者；调查应答者（2）", "e": "&quot;Artists help scientists reach a broader audience and make emotional connections that enhance learning,&quot; one <mark>respondent</mark> said."}, {"id": 2231, "u": 23, "w": "restoration", "f": 2, "m": "restor-（restore去e，恢复、修复）+ation（行为、过程、结果）", "d": "1. n. 修复；恢复（2）", "e": "Joana Lia Ferreira, an assistant professor of conservation and <mark>restoration</mark> at the NOVA School of Science and Technology, notes that archaeologists first defined the great material ages of human history-Stone Age, Iron Age, and so on-after examining artifacts in museums."}, {"id": 2232, "u": 23, "w": "restrictive", "f": 2, "m": "restrict（限制、约束）+-ive（具有这种作用的）", "d": "1. adj. 限制性的（2）", "e": "The other reason why costs are so high is the <mark>restrictive</mark> guild-like ownership structure of the business."}, {"id": 2233, "u": 23, "w": "revolutionary", "f": 2, "m": "revolution（革命、根本转变）+-ary（有关的性质或人）", "d": "1. adj. 革命性的；突破性的（2）", "e": "Beethoven&#x27;s importance in music has been principally defined by the <mark>revolutionary</mark> nature of his compositions."}, {"id": 2234, "u": 23, "w": "rid", "f": 2, "m": "", "d": "1. v. 使摆脱、清除（2）", "e": "They <mark>rid</mark> the forest of dead and sick trees, reducing competition and curbing the spread of disease."}, {"id": 2235, "u": 23, "w": "rip", "f": 2, "m": "", "d": "1. v. 放任发展（letrip）（1）；2. v. 盗录；提取（1）", "e": "Development should be planned, not let <mark>rip</mark>."}, {"id": 2236, "u": 23, "w": "robust", "f": 2, "m": "rob-（橡木、力量）+-ust（形容词词形结尾）", "d": "1. adj. 强有力的；强健的（2）", "e": "The only major objection came from Justice Antonin Scalia, who offered an even more <mark>robust</mark> defense of state privileges going back to the Alien and Sedition Acts."}, {"id": 2237, "u": 23, "w": "rock", "f": 2, "m": "", "d": "1. v. 震撼、轰动（1）；2. n. 岩石（1）", "e": "One example of how artists and scientists have together <mark>rocked</mark> the scenes came last month when the Sydney Symphony Orchestra performed a reworked version of Antonio Vivaldi&#x27;s The Four Seasons."}, {"id": 2238, "u": 23, "w": "rose", "f": 2, "m": "", "d": "1. n. 玫瑰（2）", "e": "It&#x27;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#x27;s pumpkins, <mark>roses</mark>, and other figures were splitting and crumbling."}, {"id": 2239, "u": 23, "w": "roundabout", "f": 2, "m": "round（绕圈）+about（在周围）", "d": "1. adj. 迂回的（1）；2. n. 环形交叉路口（1）", "e": "It is painful to read these <mark>roundabout</mark> accounts today."}, {"id": 2240, "u": 23, "w": "routinely", "f": 2, "m": "routine（例行的）+-ly（副词后缀）", "d": "1. adv. 通常；经常；惯常地（2）", "e": "Scientific publishers <mark>routinely</mark> report profit margins approaching 40% on their operations at a time when the rest of the publishing industry is in an existential crisis."}, {"id": 2241, "u": 23, "w": "sacred", "f": 2, "m": "sacr（神圣）+-ed（具有这种性质的）", "d": "1. adj. 神圣的（2）", "e": "(47) A <mark>sacred</mark> place of peace, however crude it may be, is a distinctly human need, as opposed to shelter, which is a distinctly animal need."}, {"id": 2242, "u": 23, "w": "satellite", "f": 2, "m": "", "d": "1. n. 天然卫星，卫星（天体）（2）", "e": "It is unarguable that our laboratories, scientific instruments, rockets and <mark>satellites</mark>-the tools we scientists need to measure the planet&#x27;s pulse-demand significant amounts of energy both in their construction and operation."}, {"id": 2243, "u": 23, "w": "scan", "f": 2, "m": "", "d": "1. v. 扫视；快速查看（2）", "e": "At night, <mark>scan</mark> the horizon for __17__ light sources, such as fires and streetlights, then walk toward the glow of light pollution."}, {"id": 2244, "u": 23, "w": "scare", "f": 2, "m": "", "d": "1. n. 恐慌、担忧（2）", "e": "(46) There is a great deal of this kind of nonsense in the medical journals which, when taken up by broadcasters and the lay press, generates both health <mark>scares</mark> and short-lived dietary enthusiasms."}, {"id": 2245, "u": 23, "w": "seat", "f": 2, "m": "", "d": "1. n. 席位；职位（2）", "e": "If the bills become law, state boards and commissions will be required to set aside 50 percent of board <mark>seats</mark> for women by 2022."}, {"id": 2246, "u": 23, "w": "secondary", "f": 2, "m": "second（第二）+-ary（属于这一层次的）", "d": "1. adj. 中等教育的；中学的（1）；2. adj. 次要的；辅助的（干扰选项）（1）", "e": "But after the war, great social and political changes arising out of the successful war against Fascism created a growing demand in European and American economies for increasing numbers of graduates with more than a <mark>secondary</mark> school education."}, {"id": 2247, "u": 23, "w": "seize", "f": 2, "m": "", "d": "1. v. 抓住；把握（2）", "e": "[ B ] <mark>seize</mark>"}, {"id": 2248, "u": 23, "w": "selection", "f": 2, "m": "select（选择、挑选）+-ion（表示行为或结果的名词后缀）", "d": "1. n. 选择；选拔（1）；2. n. （进化中的）选择；性选择（1）", "e": "A young man can __2__ a likely spouse on his own and then ask his parents to __3__ the marriage negotiations, or the young man&#x27;s parents may make the choice of a spouse, giving the child little to say in the <mark>selection</mark>."}, {"id": 2249, "u": 23, "w": "senator", "f": 2, "m": "senate（参议院，去掉末尾e）+or（成员）", "d": "1. n. 参议员（2）", "e": "A pair of bills sponsored by Massachusetts state <mark>Senator</mark> Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provides a case in point."}, {"id": 2250, "u": 23, "w": "sentence", "f": 2, "m": "sent（由感受形成的看法）+-ence（内容、结果的名词结尾）", "d": "1. n. 句子（1）；2. v. 判刑（1）", "e": "[ D ] In effect, you try to reconstruct the likely meanings or effects that any given <mark>sentence</mark>, image or reference might have had: These might be the ones the author intended."}, {"id": 2251, "u": 23, "w": "sharp", "f": 2, "m": "", "d": "1. adj. 尖锐的、严厉的（1）；2. adj. 急剧的、大幅的（1）", "e": "[ D ] non-professionals&#x27; <mark>sharp</mark> criticism."}, {"id": 2252, "u": 23, "w": "shatter", "f": 2, "m": "", "d": "1. v. 破坏；粉碎（2）", "e": "As a historian who&#x27;s always searching for the text or the image that makes us re-evaluate the past, I&#x27;ve become preoccupied with looking for photographs that show our Victorian ancestors smiling (what better way to <mark>shatter</mark> the image of 19th-century prudery?)."}, {"id": 2253, "u": 23, "w": "shoot", "f": 2, "m": "", "d": "1. v. 拍摄（照片、电影）（2）", "e": "A typical digital SLR camera <mark>shoots</mark> 20 frames a second."}, {"id": 2254, "u": 23, "w": "shopper", "f": 2, "m": "shop（双写末尾p，购物）+-er（做这件事的人）", "d": "1. n. 购物者（2）", "e": "States will be able to force more people to pay sales tax when they make online purchases under a Supreme Court decision Thursday that will leave <mark>shoppers</mark> with lighter wallets but is a big financial win for states."}, {"id": 2255, "u": 23, "w": "shore", "f": 2, "m": "", "d": "1. n. 岸、滨岸（2）", "e": "To the anxious travelers the sight of the American <mark>shore</mark> brought almost inexpressible relief."}, {"id": 2256, "u": 23, "w": "shortage", "f": 2, "m": "short（不足）+-age（状态的名词形式）", "d": "1. n. 短缺；不足（2）", "e": "[ B ] is a triumph against energy <mark>shortage</mark>"}, {"id": 2257, "u": 23, "w": "shut", "f": 2, "m": "", "d": "1. v. 隔绝（shut out）（1）；2. v. 关闭；停止运营（1）", "e": "[ D ] <mark>shut</mark> out the feverish fashion world."}, {"id": 2258, "u": 23, "w": "shutter", "f": 2, "m": "shut（关闭，双写t）+-er（执行作用的装置）", "d": "1. n. (相机的)快门（2）", "e": "At such high <mark>shutter</mark> speeds, the depth of field is tiny, and as butterflies do not fly in a straight line they swiftly flutter out of focus."}, {"id": 2259, "u": 23, "w": "significantly", "f": 2, "m": "significant（有意义的、重要的、显著的）+-ly（以这种方式、达到这种程度）", "d": "1. adv. 显著地；大幅度地（2）", "e": "It __6__ out that the brain needs exercise in much the same way our muscles do, and the right mental __7__ can <mark>significantly</mark> improve our basic cognitive __8__ ."}, {"id": 2260, "u": 23, "w": "simulate", "f": 2, "m": "simul-（相似）+-ate（使成为、做出某种状态）", "d": "1. v. 模拟（2）", "e": "(48) Algorithms used to <mark>simulate</mark> human interactions are creating many of these concerns, especially as no-one is quite sure what the outcomes of using AI to interact with customers will be."}, {"id": 2261, "u": 23, "w": "simultaneously", "f": 2, "m": "simultaneous（同时的）+ly（以这种方式）", "d": "1. adv. 同时地；一齐地（2）", "e": "As science and technology progressed, and divided into more sub-disciplines, the centre was <mark>simultaneously</mark> looking to a time when leading researchers could also be artists, writers and poets, and vice versa."}, {"id": 2262, "u": 23, "w": "sky", "f": 2, "m": "", "d": "1. n. 天空（2）", "e": "Perhaps that is why we explore the starry <mark>skies</mark>, as if answering a primal calling to know ourselves and our true ancestral homes."}, {"id": 2263, "u": 23, "w": "slide", "f": 2, "m": "", "d": "1. v. 滑动（2）", "e": "Automatic doors often open to the side, with the panels <mark>sliding</mark> across one another."}, {"id": 2264, "u": 23, "w": "solar", "f": 2, "m": "sol（太阳）+-ar（形容词后缀）", "d": "1. adj. 太阳的；太阳能的（2）", "e": "<mark>Solar</mark> panels had a few niche uses until they became cheap; now they are transforming the global energy system."}, {"id": 2265, "u": 23, "w": "solid", "f": 2, "m": "", "d": "1. adj. 坚实的；可靠的（2）", "e": "[ D ] requires <mark>solid</mark> evidence for its validity."}, {"id": 2266, "u": 23, "w": "somewhat", "f": 2, "m": "some（有一些）+what（多么、多少，接程度）", "d": "1. adv. 有点、稍微（2）", "e": "Therefore, unless customers are prepared to sign release agreements, the use of AI may become <mark>somewhat</mark> restricted in the future."}, {"id": 2267, "u": 23, "w": "south", "f": 2, "m": "", "d": "1. n. 南方（2）", "e": "The animals could benefit from more research: Currently, there are no published genomes from donkeys located <mark>south</mark> of the Equator in Africa."}, {"id": 2268, "u": 23, "w": "span", "f": 2, "m": "S（展开）+P（纸）+A（横跨）+N（笔记本）", "d": "1. n. 持续时间；时间跨度（2）", "e": "In addition, new digital technologies have allowed more rapid trading of equities, quicker use of information, and thus shorter attention <mark>spans</mark> in financial markets."}, {"id": 2269, "u": 23, "w": "spare", "f": 2, "m": "", "d": "1. adj. 空闲的（1）；2. v. 节省；吝惜（1）", "e": "[ D ] The proper procedures for renting out <mark>spare</mark> houses."}, {"id": 2270, "u": 23, "w": "speaker", "f": 2, "m": "speak（说话）+-er（人或器具）", "d": "1. n. 使用某种语言的人（1）；2. n. 议长（1）", "e": "(46) But even as the number of English <mark>speakers</mark> expands further there are signs that the global predominance of the language may fade within the foreseeable future."}, {"id": 2271, "u": 23, "w": "specialize", "f": 2, "m": "special（专门的）+-ize（使成为、从事）", "d": "1. v. 专门从事、擅长（2）", "e": "Journalistic tastes had changed long before his death, and postmodern readers have little use for the richly upholstered Vicwardian prose in which he <mark>specialized</mark>."}, {"id": 2272, "u": 23, "w": "specialized", "f": 2, "m": "specializ（specialize去e，专攻、专门研究、专业化）+-ed（已经形成的状态）", "d": "1. adj. 专业的、专门化的（2）", "e": "Other scientists perform the <mark>specialised</mark> work of peer review also for free, because it is a central element in the acquisition of status and the production of scientific knowledge."}, {"id": 2273, "u": 23, "w": "spectrum", "f": 2, "m": "spect-（看）+-rum（名词词尾）", "d": "1. n. 谱系、范围（2）", "e": "Avoiding this rather than promoting it should unite the left and right of the political <mark>spectrum</mark>."}, {"id": 2274, "u": 23, "w": "spell", "f": 2, "m": "", "d": "1. n. 一段时间（1）；2. n. 详细说明（spell out）（1）", "e": "A badly run &quot;year of culture&quot; washes in and washes out of a place like the tide, bringing prominence for a <mark>spell</mark> but leaving no lasting benefits to the community."}, {"id": 2275, "u": 23, "w": "spiritual", "f": 2, "m": "spirit（精神）+-ual（……的）", "d": "1. adj. 精神的、心灵的（2）", "e": "For him, order does not result from forgetting or ignoring the disorders that plague our existence; order is a necessary development, an improvement that may lead to the Greek ideal of <mark>spiritual</mark> elevation."}, {"id": 2276, "u": 23, "w": "spite", "f": 2, "m": "sp（弄坏）+i（一件物品）+te（取笑）", "d": "1. 短语 尽管；不顾（in spite of）（2）", "e": "[ B ] in <mark>spite</mark> of"}, {"id": 2277, "u": 23, "w": "spokesperson", "f": 2, "m": "spokes-（代表他人说话）+person（人）", "d": "1. n. 发言人（2）", "e": "What message does the <mark>spokesperson</mark> for Waterstones seem to convey?"}, {"id": 2278, "u": 23, "w": "spring", "f": 2, "m": "", "d": "1. n. 春天（1）；2. n. 泉；泉水（1）", "e": "India released its AI ethics strategy this <mark>spring</mark>."}, {"id": 2279, "u": 23, "w": "squeeze", "f": 2, "m": "", "d": "1. n. 两面夹击的困境（1）；2. v. 挤压；使陷入困境（1）", "e": "Fundamentally, the USPS is in a historic <mark>squeeze</mark> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality."}, {"id
