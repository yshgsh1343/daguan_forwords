": 2280, "u": 23, "w": "starve", "f": 2, "m": "", "d": "1. v. 使严重缺乏（1）；2. v. 挨饿、使饿死（1）", "e": "(49) If customers are not willing to share data, AI will be <mark>starved</mark> of essential information and will not be able to function effectively or employ machine learning to improve its marketing content and communication."}, {"id": 2281, "u": 23, "w": "station", "f": 2, "m": "stat（站、停驻）+-ion（停驻处、工作场所）", "d": "1. n. 站；所；局（2）", "e": "They then set up a &quot;food <mark>station</mark>&quot; experiment, in which they gave the elephants a series of choices based only on smell."}, {"id": 2282, "u": 23, "w": "steep", "f": 2, "m": "", "d": "1. adj. 陡峭的（学习曲线，需迅速学习）（2）", "e": "In such a case, the company&#x27;s response may not be sufficiently quick or thoughtful, and the learning curve has been <mark>steep</mark>."}, {"id": 2283, "u": 23, "w": "steer", "f": 2, "m": "", "d": "1. v. 引导（1）；2. v. 避开；使远离（steer clear of）（1）", "e": "Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and <mark>steer</mark> their activities in virtuous directions."}, {"id": 2284, "u": 23, "w": "stir", "f": 2, "m": "", "d": "1. n. 轰动；骚动（1）；2. v. 激起；打动（1）", "e": "I&#x27;ve found quite a few, and-since I started posting them on Twitter-they have been causing quite a <mark>stir</mark>."}, {"id": 2285, "u": 23, "w": "string", "f": 2, "m": "", "d": "1. n. 一连串；一系列（2）", "e": "As a News Feature article in Nature discusses, a <mark>string</mark> of lucrative awards for researchers have joined the Nobel Prizes in recent years."}, {"id": 2286, "u": 23, "w": "strip", "f": 2, "m": "", "d": "1. n. 条状物（1）；2. v. 剥夺（1）", "e": "Roman lamps and Roman chariots are very different from LED <mark>strips</mark> and sports cars, but Roman nails are still clearly nails."}, {"id": 2287, "u": 23, "w": "strive", "f": 2, "m": "", "d": "1. v. 努力；力求（2）", "e": "The most successful monarchies <mark>strive</mark> to abandon or hide their old aristocratic ways."}, {"id": 2288, "u": 23, "w": "subconscious", "f": 2, "m": "sub-（在下面）+conscious（有意识的）", "d": "1. adj. 潜意识的（2）", "e": "But it&#x27;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#x27;t in some small, <mark>subconscious</mark> way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston."}, {"id": 2289, "u": 23, "w": "submit", "f": 2, "m": "sub-（在……之下）+mit（发送、交付）", "d": "1. v. 提交；呈交（2）", "e": "[ B ] <mark>submits</mark>"}, {"id": 2290, "u": 23, "w": "substitute", "f": 2, "m": "sub-（在下面；替代）+stitut（放置、建立）+e（词形结尾）", "d": "1. n. 替代物；替代者（2）", "e": "Devoted concertgoers who reply that recordings are no <mark>substitute</mark> for live performance are missing the point."}, {"id": 2291, "u": 23, "w": "successfully", "f": 2, "m": "successful（成功的）+ly（以某种方式、取得某种结果地）", "d": "1. adv. 成功地（2）", "e": "Far less certain, however, is how <mark>successfully</mark> experts and bureaucrats can select our peer groups and steer their activities in virtuous directions."}, {"id": 2292, "u": 23, "w": "succession", "f": 2, "m": "suc-（随后接上）+cess（走）+-ion（过程或状态的名词后缀）", "d": "1. n. 继任（1）；2. n. 连续；接连（1）", "e": "As boards scrutinize <mark>succession</mark> plans in response to shareholder pressure, executives who don&#x27;t get the nod also may wish to move on."}, {"id": 2293, "u": 23, "w": "successive", "f": 2, "m": "suc-（随后接上）+cess（走）+-ive（具有这种状态的）", "d": "1. adj. 接连的；历届的（2）", "e": "<mark>Successive</mark> governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer."}, {"id": 2294, "u": 23, "w": "suffering", "f": 2, "m": "suffer（受苦、承受痛苦）+-ing（经历或状态）", "d": "1. v. 苦难；痛苦（2）", "e": "(50) One could interpret much of the work of Beethoven by saying that <mark>suffering</mark> is inevitable, but the courage to fight it renders life worth living."}, {"id": 2295, "u": 23, "w": "sufficient", "f": 2, "m": "suf-（在下、起支撑作用）+fic（做）+-ient（具有相应性质的）", "d": "1. adj. 足够的、充分的（2）", "e": "The premise was that the common law of contract lacked <mark>sufficient</mark> safeguards for workers against arbitrary conduct by management."}, {"id": 2296, "u": 23, "w": "supervise", "f": 2, "m": "super-（在上方、负责全局）+vis（看）+e（词形结尾）", "d": "1. v. 监督；指导（2）", "e": "In 1924 America&#x27;s National Research Council sent two engineers to <mark>supervise</mark> a series of experiments at a telephone-parts factory called the Hawthorne Plant near Chicago."}, {"id": 2297, "u": 23, "w": "supervision", "f": 2, "m": "supervis-（supervise去e，监督）+ion（行为、过程）", "d": "1. n. 监督；监管（2）", "e": "[ B ] The FCC should be put under strict <mark>supervision</mark>."}, {"id": 2298, "u": 23, "w": "suppression", "f": 2, "m": "suppress（镇压、压制、抑制）+-ion（行为或过程）", "d": "1. n. 压制；扑灭（火灾）（2）", "e": "The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire <mark>suppression</mark>."}, {"id": 2299, "u": 23, "w": "surely", "f": 2, "m": "sure（确信的、确定的）+-ly（以这种态度）", "d": "1. adv. 无疑；肯定（2）", "e": "<mark>Surely</mark> there must be some middle ground that balances zoos&#x27; treatment of animals with their educational potential."}, {"id": 2300, "u": 23, "w": "surprising", "f": 2, "m": "surpris（surprise去e，使惊讶）+-ing（具有这种作用的）", "d": "1. adj. 令人惊讶的（2）", "e": "Such an encouraging result is not <mark>surprising</mark>."}, {"id": 2301, "u": 24, "w": "surrounding", "f": 2, "m": "surround（围绕）+-ing（具有这种位置关系的）", "d": "1. adj. 周围的、附近的（2）", "e": "Together, they make up the reading component of your overall literacy, or relationship to your <mark>surrounding</mark> textual environment."}, {"id": 2302, "u": 24, "w": "surveillance", "f": 2, "m": "sur-（从上方）+veill（看守）+-ance（名词后缀）", "d": "1. n. 监视、监控（2）", "e": "That misses the way the <mark>surveillance</mark> economy works."}, {"id": 2303, "u": 24, "w": "suspend", "f": 2, "m": "sus-（从下方）+pend（悬挂）", "d": "1. v. 暂停；中止（2）", "e": "If that sounds melodramatic, consider this: The Art Directors Guild, a labor union representing about 3,000 film workers, has <mark>suspended</mark> a training program and issued a statement explaining that &quot;we cannot in good conscience encourage you to pursue our profession.&quot;"}, {"id": 2304, "u": 24, "w": "suspicious", "f": 2, "m": "suspic（怀疑；suspect的同源词干）+-ious（形容词后缀）", "d": "1. adj. 可疑的（2）", "e": "In 2016, researchers developed an algorithm to recognize <mark>suspicious</mark> citation patterns, including groups of authors that disproportionately cite one another and groups of journals that cite each other frequently to increase the impact factors of their publications."}, {"id": 2305, "u": 24, "w": "sweep", "f": 2, "m": "", "d": "1. v. 掠过；席卷（2）", "e": "This very fact embodied the new ways of thinking that <mark>swept</mark> through Europe during most of the 17th century."}, {"id": 2306, "u": 24, "w": "sword", "f": 2, "m": "", "d": "1. n. 剑（1）；2. n. 双刃剑；利弊兼有之事（1）", "e": "For example, type in &quot;Wizard with <mark>sword</mark> and a glowing orb of magic fire fights a fierce dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#x27;s style."}, {"id": 2307, "u": 24, "w": "symbol", "f": 2, "m": "sym-（共同；一起）+bol（投；放）", "d": "1. n. 象征；标志（2）", "e": "[ A ] a <mark>symbol</mark> of the entrepreneurs&#x27; wealth."}, {"id": 2308, "u": 24, "w": "taste", "f": 2, "m": "", "d": "1. n. 喜好；品味（2）", "e": "The danger will come with Charles, who has both an expensive <mark>taste</mark> of lifestyle and a pretty hierarchical view of the world."}, {"id": 2309, "u": 24, "w": "teenager", "f": 2, "m": "teen（十三至十九）+age（年龄，去掉末尾e）+er（人）", "d": "1. n. 青少年（2）", "e": "&quot;Dare to be different, please don&#x27;t smoke!&quot; pleads one billboard campaign aimed at reducing smoking among <mark>teenagers</mark>-<mark>teenagers</mark>, who desire nothing more than fitting in."}, {"id": 2310, "u": 24, "w": "temperature", "f": 2, "m": "temper（调节冷热）+ature（状态、程度的名词结尾）", "d": "1. n. 气氛热度（比喻争论激烈）（1）；2. n. 温度（1）", "e": "The weather in Texas may have cooled since the recent extreme heat, but the <mark>temperature</mark> will be high at the State Board of Education meeting in Austin this month as officials debate how climate change is taught in Texas schools."}, {"id": 2311, "u": 24, "w": "tense", "f": 2, "m": "", "d": "1. n. 时态（2）", "e": "Older generations often talk about their degree in the present and personal <mark>tense</mark>: &#x27;I am a geographer&#x27; or &#x27;I am a classicist&#x27;."}, {"id": 2312, "u": 24, "w": "territory", "f": 2, "m": "terr（土地）+itory（词形结尾）", "d": "1. n. 领土；地区（1）；2. n. （知识等的）领域（1）", "e": "(49) The first shiploads of immigrants bound for the <mark>territory</mark> which is now the United States crossed the Atlantic more than a hundred years after the 15th- and 16th-century explorations of North America."}, {"id": 2313, "u": 24, "w": "terror", "f": 2, "m": "terr（恐惧、震慑）+-or（状态或相关对象的名词结尾）", "d": "1. n. 恐惧；恐慌（2）", "e": "Its Campaign to Protect Rural England struck <mark>terror</mark> into many local Conservative parties."}, {"id": 2314, "u": 24, "w": "testimony", "f": 2, "m": "test（见证）+-imony（名词词尾）", "d": "1. n. 见证陈述（1）；2. n. 证据（1）", "e": "There&#x27;s fun in <mark>testimonies</mark> of people enjoying the sheer newness."}, {"id": 2315, "u": 24, "w": "thereby", "f": 2, "m": "there（那）+by（凭借；通过）", "d": "1. adv. 因此；由此（2）", "e": "In an experiment published in 1988, social psychologist Fritz Strack of the University of Würzburg in Germany asked volunteers to __16__ a pen either with their teeth - <mark>thereby</mark> creating an artificial smile - or with their lips, which would produce a(n) __17__ expression."}, {"id": 2316, "u": 24, "w": "thoughtful", "f": 2, "m": "thought（思考；考虑）+-ful（充满……的）", "d": "1. adj. 深思熟虑的（2）", "e": "In such a case, the company&#x27;s response may not be sufficiently quick or <mark>thoughtful</mark>, and the learning curve has been steep."}, {"id": 2317, "u": 24, "w": "tide", "f": 2, "m": "", "d": "1. n. 浪潮；潮流（1）；2. n. 潮汐；潮水（1）", "e": "Within the span of a hundred years, in the seventeenth and early eighteenth centuries, a <mark>tide</mark> of emigration - one of the great folk wanderings of history - swept from Europe to America."}, {"id": 2318, "u": 24, "w": "tolerant", "f": 2, "m": "toler（忍受、容忍）+-ant（具有这种性质的）", "d": "1. adj. 宽容的；容忍的（2）", "e": "[ D ] <mark>Tolerant</mark>."}, {"id": 2319, "u": 24, "w": "touch", "f": 2, "m": "", "d": "1. n. 联系（1）；2. v. 触摸；接触（1）", "e": "[ D ] is out of <mark>touch</mark> with reality."}, {"id": 2320, "u": 24, "w": "tourism", "f": 2, "m": "tour（旅行、游览）+-ism（活动或行业）", "d": "1. n. 旅游业；旅游活动（2）", "e": "&quot;A lot of workers are servicing the tourist industry, and the <mark>tourism</mark> industry is serviced by those people coming in short term,&quot; Castle said, &quot;and so it&#x27;s a cyclical effect.&quot;"}, {"id": 2321, "u": 24, "w": "toxic", "f": 2, "m": "tox-（毒）+ic（具有相应性质的）", "d": "1. adj. 有毒的、高风险的不良资产的（2）", "e": "And, unless banks carry <mark>toxic</mark> assets at prices that attract buyers, reviving the banking system will be difficult."}, {"id": 2322, "u": 24, "w": "trading", "f": 2, "m": "trade（交易；去e）+-ing（活动）", "d": "1. n. 交易；贸易（2）", "e": "In addition, new digital technologies have allowed more rapid <mark>trading</mark> of equities, quicker use of information, and thus shorter attention spans in financial markets."}, {"id": 2323, "u": 24, "w": "traditionally", "f": 2, "m": "traditional（传统的）+-ly（以这种方式、在这种情况下）", "d": "1. adv. 传统上、历来（2）", "e": "Libraries and archives have <mark>traditionally</mark> shouldered the responsibility of organization, preservation, and access to information."}, {"id": 2324, "u": 24, "w": "trail", "f": 2, "m": "", "d": "1. n. 小径；路径（2）", "e": "<mark>Trail</mark> blazes, tire tracks, and other features can __20__ you to civilization."}, {"id": 2325, "u": 24, "w": "transaction", "f": 2, "m": "trans-（跨过、在各方之间）+act（办理）+-ion（过程、事情或结果的名词后缀）", "d": "1. n. 交易、业务办理（2）", "e": "That ruling produced an explosion in business-method patent filings, initially by emerging Internet companies trying to stake out exclusive rights to specific types of online <mark>transactions</mark>."}, {"id": 2326, "u": 24, "w": "transient", "f": 2, "m": "trans-（经过、越过）+i（走）+-ent（具有这种性质的）", "d": "1. adj. 短期的（2）", "e": "<mark>Transient</mark> investors, who demand high quarterly profits from companies, can hinder a firm&#x27;s efforts to invest in long-term research or to build up customer loyalty."}, {"id": 2327, "u": 24, "w": "translate", "f": 2, "m": "trans-（跨越）+lat（携带）+e（词形结尾）", "d": "1. v. 转化；转换（1）；2. v. 适用；推广（1）", "e": "Across the 163 countries measured, the UK is one of the poorest performers in ensuring that economic growth is <mark>translated</mark> into meaningful improvements for its citizens."}, {"id": 2328, "u": 24, "w": "transmit", "f": 2, "m": "trans-（从这一端到另一端）+mit（发送）", "d": "1. v. 传递、传播（2）", "e": "[ A ] <mark>transmit</mark>"}, {"id": 2329, "u": 24, "w": "transportation", "f": 2, "m": "transport（运输、运送）+-ation（行为、相关系统）", "d": "1. n. 运输；交通运输（2）", "e": "A number of companies, particularly in energy and <mark>transportation</mark>, use AI image processing technology to inspect infrastructure and prevent equipment failure or leaks before they happen."}, {"id": 2330, "u": 24, "w": "trap", "f": 2, "m": "", "d": "1. n. 困境；陷阱（1）；2. v. 使陷入困境；困住（1）", "e": "The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the <mark>trap</mark> of stereotyping each other."}, {"id": 2331, "u": 24, "w": "tree-ring", "f": 2, "m": "", "d": "1. 短语 树木年轮（的）（2）", "e": "Their North American <mark>tree-ring</mark> fire-scar network (NAFSN) provided the basis for a study published last month."}, {"id": 2332, "u": 24, "w": "trivial", "f": 2, "m": "tri-（三）+vi（路）+-al（形容词后缀）", "d": "1. adj. 琐碎的、不重要的（2）", "e": "[ B ] centered on <mark>trivial</mark> issues."}, {"id": 2333, "u": 24, "w": "tune", "f": 2, "m": "tun（ton中的o换成u，声音）+e（拼写结尾）", "d": "1. n. 微调；完善（fine-tune）（1）；2. n. 曲调（1）", "e": "Standing in the shoes of others fine <mark>tunes</mark> our social understanding, useful as we struggle to understand friends, neighbours, customers and co-workers."}, {"id": 2334, "u": 24, "w": "unclear", "f": 2, "m": "un-（不）+clear（清楚的、明确的）", "d": "1. adj. 不清楚的、不明确的（2）", "e": "Also <mark>unclear</mark> is why Microsoft has gone it alone."}, {"id": 2335, "u": 24, "w": "unconscious", "f": 2, "m": "un-（不、没有）+conscious（有意识的、清醒的）", "d": "1. adj. 无意识的；未察觉的（2）", "e": "Companies are using artificial intelligence to remove some of the <mark>unconscious</mark> bias from hiring decisions."}, {"id": 2336, "u": 24, "w": "uncover", "f": 2, "m": "un-（解除、去掉）+cover（覆盖）", "d": "1. v. 发现；揭示（2）", "e": "In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and <mark>uncovered</mark> a striking shortfall."}, {"id": 2337, "u": 24, "w": "underline", "f": 2, "m": "under（在下面）+line（线、划线）", "d": "1. n. 强调；凸显（1）；2. v. 强调；凸显（1）", "e": "The challenge of coping with automation <mark>underlines</mark> the need for the U.S. to revive its fading business dynamism: Starting new companies must be made easier."}, {"id": 2338, "u": 24, "w": "underwater", "f": 2, "m": "under（在……下面）+water（水）", "d": "1. adj. 水下的（2）", "e": "Since the 1960s, <mark>underwater</mark> archaeology __15__ and tools had made huge advances."}, {"id": 2339, "u": 24, "w": "undoubtedly", "f": 2, "m": "un-（不）+doubt（怀疑）+ed（所处状态）+ly（以这种状态或语气）", "d": "1. adv. 毫无疑问地（2）", "e": "Even so, kings and queens <mark>undoubtedly</mark> have a downside."}, {"id": 2340, "u": 24, "w": "unhealthy", "f": 2, "m": "un-（不）+healthy（健康的）", "d": "1. adj. 不健康的；有害健康的（2）", "e": "Animals end up stressed and <mark>unhealthy</mark> or dead."}, {"id": 2341, "u": 24, "w": "unity", "f": 2, "m": "uni-（一；统一）+-ty（状态）", "d": "1. n. 团结；统一（2）", "e": "Symbolic of national <mark>unity</mark> as they claim to be, their very history - and sometimes the way they behave today - embodies outdated and indefensible privileges and inequalities."}, {"id": 2342, "u": 24, "w": "unpredictable", "f": 2, "m": "un-（不）+predictable（可预测的）", "d": "1. adj. 不可预测的（2）", "e": "[ A ] <mark>unpredictable</mark>"}, {"id": 2343, "u": 24, "w": "utilize", "f": 2, "m": "util（使用）+-ize（动词后缀）", "d": "1. v. 利用（2）", "e": "(47) But by <mark>utilising</mark> the natural curiosity of the general public it is possible to overcome many of these challenges by engaging non-scientists directly in the research process."}, {"id": 2344, "u": 24, "w": "utmost", "f": 2, "m": "", "d": "1. n. 最大努力（doone&#x27;s utmost）（2）", "e": "We are not boycotting PRH titles but we are doing our <mark>utmost</mark> to ensure that availability for customers remains good despite the lower overall levels of stock."}, {"id": 2345, "u": 24, "w": "valley", "f": 2, "m": "", "d": "1. n. 山谷；谷地（2）", "e": "Humans overwhelmingly live in <mark>valleys</mark>, and on supplies of fresh water."}, {"id": 2346, "u": 24, "w": "vanish", "f": 2, "m": "van（空、虚无）+ish（保留本词的动词词形）", "d": "1. v. 消失（2）", "e": "When we are deprived of green, of plants, of trees, (49) most of us give in to a demoralization of spirit which we usually blame on some psychological conditions, until one day we find ourselves in a garden and feel the oppression <mark>vanish</mark> as if by magic."}, {"id": 2347, "u": 24, "w": "variable", "f": 2, "m": "vari-（vary的词干，变化）+-able（能够……的）", "d": "1. n. 变量；可变因素（2）", "e": "Even though there is plenty of evidence that the quality of the teachers is the most important <mark>variable</mark>, teachers&#x27; unions have fought against getting rid of bad ones and promoting good ones."}, {"id": 2348, "u": 24, "w": "varied", "f": 2, "m": "vary（变化，y变i）+-ed（分词形容词后缀）", "d": "1. adj. 各种各样的；多样的（2）", "e": "(47) The United States is the product of two principal forces -the immigration of European peoples with their <mark>varied</mark> ideas, customs, and national characteristics and the impact of a new country which modified these traits."}, {"id": 2349, "u": 24, "w": "vary", "f": 2, "m": "", "d": "1. v. 变化；有差异（1）；2. v. 改变、使多样化（1）", "e": "[ G ] During the late 1990s, national spending on social sciences and the humanities as a percentage of all research and development funds - including government, higher education, non-profit and corporate - <mark>varied</mark> from around 4% to 25%; in most European nations, it is about 15%."}, {"id": 2350, "u": 24, "w": "verbal", "f": 2, "m": "verb（词、言语；动词）+-al（与……有关的）", "d": "1. adj. 言语的；口头的（2）", "e": "Like physical fights, <mark>verbal</mark> fights can leave both sides bloodied."}, {"id": 2351, "u": 24, "w": "verdict", "f": 2, "m": "ver-（真实）+dict（说；宣告）", "d": "1. n. 裁决；判定（2）", "e": "It is against that background that the information commissioner, Elizabeth Denham, has issued her damning <mark>verdict</mark> against the Royal Free hospital trust under the NHS, which handed over to DeepMind the records of 1.6 million patients in 2015 on the basis of a vague agreement which took far too little account of the patients&#x27; rights and their expectations of privacy."}, {"id": 2352, "u": 24, "w": "vessel", "f": 2, "m": "", "d": "1. n. 船只（1）；2. n. 血管（1）", "e": "Sometimes storms blew the <mark>vessels</mark> far off their course, and often calm brought unbearably long delay."}, {"id": 2353, "u": 24, "w": "viewpoint", "f": 2, "m": "view（看法；视野）+point（点；位置）", "d": "1. n. 观点（2）", "e": "&quot;Many young people assume a great deal of personal responsibility for educating themselves and actively seeking out opposing <mark>viewpoints</mark>,&quot; the survey concluded."}, {"id": 2354, "u": 24, "w": "virtually", "f": 2, "m": "virtual（实际上的；虚拟的）+-ly（副词后缀）", "d": "1. adv. 几乎；实际上（1）；2. adv. 通过虚拟技术；虚拟地（1）", "e": "Unfortunately, these critics are <mark>virtually</mark> forgotten."}, {"id": 2355, "u": 24, "w": "virtue", "f": 2, "m": "virt（勇气、优秀品质）+ue（词形结尾）", "d": "1. n. 美德；德行（2）", "e": "But all too often such policies are an insincere form of <mark>virtue</mark>-signaling that benefits only the most privileged and does little to help average people."}, {"id": 2356, "u": 24, "w": "visitor", "f": 2, "m": "visit（访问、参观）+-or（执行者）", "d": "1. n. 来访者；游客（2）", "e": "[ A ] keep them from hurting <mark>visitors</mark>."}, {"id": 2357, "u": 24, "w": "vivid", "f": 2, "m": "viv（活、有生命力）+id（具有这种性质的）", "d": "1. adj. 生动的；鲜明的（2）", "e": "While veterans of previous expeditions had written at length about stunning sights, these <mark>vivid</mark> photographs were another thing entirely."}, {"id": 2358, "u": 24, "w": "voluntary", "f": 2, "m": "volunt（自愿）+-ary（具有这种性质的）", "d": "1. adj. 自愿的；非强制的（2）", "e": "In Denmark, the United States, and a few other countries, it is trying to set <mark>voluntary</mark> standards for models and fashion images that rely more on peer pressure for enforcement."}, {"id": 2359, "u": 24, "w": "vulnerable", "f": 2, "m": "vulner（伤口、使受伤）+-able（可被……的）", "d": "1. adj. 脆弱的；易受伤害的（2）", "e": "It&#x27;s especially <mark>vulnerable</mark> to light damage, and by the mid-1990s, Gilardi&#x27;s pumpkins, roses, and other figures were splitting and crumbling."}, {"id": 2360, "u": 24, "w": "warehouse", "f": 2, "m": "ware（货物）+house（房屋）", "d": "1. n. 仓库（2）", "e": "Amazon.com, with its network of <mark>warehouses</mark>, also collects sales tax in every state that charges it, though third-party sellers who use the site don&#x27;t have to."}, {"id": 2361, "u": 24, "w": "weigh", "f": 2, "m": "", "d": "1. v. 参与讨论并发表意见（weigh in）（1）；2. v. 权衡；仔细考虑（1）", "e": "A federal appeals court <mark>weighed</mark> in again Tuesday, but instead of providing a badly needed resolution, it only prolonged the fight."}, {"id": 2362, "u": 24, "w": "welfare", "f": 2, "m": "wel（well少写一个l，好）+fare（过活）", "d": "1. n. 社会福利；福利制度（2）", "e": "The principle of British <mark>welfare</mark> is no longer that you can insure yourself against the risk of unemployment and receive unconditional payments if the disaster happens."}, {"id": 2363, "u": 24, "w": "west", "f": 2, "m": "", "d": "1. n. 西方国家（2）", "e": "What intrinsic factors make the <mark>West</mark> a suitable home for these artifacts but preclude them from being preserved and displayed by their countries of origin?"}, {"id": 2364, "u": 24, "w": "wholly", "f": 2, "m": "whole（全部的、完整的，去掉末尾e）+-ly（副词后缀）", "d": "1. adv. 完全地（2）", "e": "One basic weakness in a conservation system based <mark>wholly</mark> on economic motives is that most members of the land community have no economic value."}, {"id": 2365, "u": 24, "w": "widen", "f": 2, "m": "wid-（wide去e，宽的）+-en（使变得、变得）", "d": "1. v. 扩大、拓宽（2）", "e": "Finally, because automation threatens to <mark>widen</mark> the gap between capital income and labor income, taxes and the safety net will have to be rethought."}, {"id": 2366, "u": 24, "w": "wife", "f": 2, "m": "", "d": "1. n. 妻子（2）", "e": "Newlyweds traditionally move in with the <mark>wife&#x27;s</mark> parents and may __12__ with them up to a year, __13__ they can build a new house nearby."}, {"id": 2367, "u": 24, "w": "wisdom", "f": 2, "m": "", "d": "1. n. 智慧；明智看法（2）", "e": "Mental health has commonly been called conscience, instinct, <mark>wisdom</mark>, common sense, or the inner voice."}, {"id": 2368, "u": 24, "w": "withdrawal", "f": 2, "m": "withdraw（撤回、退出、提取）+-al（行为）", "d": "1. n. 撤军；撤离（1）；2. n. 撤回；撤销（1）", "e": "The likely explanation is that the <mark>withdrawal</mark> was rushed, and they didn&#x27;t want the local Caledonians getting their hands on 10 tons of weapon-grade iron."}, {"id": 2369, "u": 24, "w": "witness", "f": 2, "m": "wit（知道；知晓）+-ness（状态或相关的人、事物）", "d": "1. v. 目睹；见证（2）", "e": "(46) By the date of his birth Europe was <mark>witnessing</mark> the passing of the religious drama, and the creation of new forms under the incentive of classical tragedy and comedy."}, {"id": 2370, "u": 24, "w": "worsen", "f": 2, "m": "worse（更坏的；去e）+-en（使变成的动词后缀）", "d": "1. v. 恶化；使变坏（2）", "e": "&quot;Short-termism&quot; or the desire for quick profits, has <mark>worsened</mark> in publicly traded companies, says the Bank of England&#x27;s top economist, Andrew Haldane."}, {"id": 2371, "u": 24, "w": "wound", "f": 2, "m": "", "d": "1. n. 伤害、创伤（1）；2. v. 伤害、创伤（1）", "e": "The humiliations of his father&#x27;s imprisonment and his labor in the blacking factory formed Dickens&#x27;s greatest <mark>wound</mark> and became his deepest secret."}, {"id": 2372, "u": 24, "w": "yell", "f": 2, "m": "", "d": "1. v. 大喊（2）", "e": "If you <mark>yell</mark>, &quot;Yes,&quot; and I <mark>yell</mark>, &quot;No,&quot; neither of us learns anything."}, {"id": 2373, "u": 24, "w": "abdomen", "f": 1, "m": "", "d": "1. n. 腹部（1）", "e": "One study found that muscle loss and the __4__ of body fat around the <mark>abdomen</mark> are associated with a decline in fluid intelligence."}, {"id": 2374, "u": 24, "w": "abide", "f": 1, "m": "", "d": "1. v. 遵守（1）", "e": "The company, a major energy supplier in New England, provoked justified outrage in Vermont last week when it announced it was reneging on a longstanding commitment to <mark>abide</mark> by the state&#x27;s strict nuclear regulations."}, {"id": 2375, "u": 24, "w": "absurd", "f": 1, "m": "ab-（加强）+surd（闷声、不合调）", "d": "1. adj. 荒谬的、荒唐的（1）", "e": "It would be <mark>absurd</mark> to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes perfect sense."}, {"id": 2376, "u": 24, "w": "abuzz", "f": 1, "m": "a-（处于……状态）+buzz（嗡嗡声；议论）", "d": "1. adj. 议论纷纷的（1）", "e": "In a move that has intellectual-property lawyers <mark>abuzz</mark>, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents."}, {"id": 2377, "u": 24, "w": "academy", "f": 1, "m": "", "d": "1. n. 学院；学会；研究院（1）", "e": "Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, <mark>academies</mark> and merit pay all faced drawn-out battles."}, {"id": 2378, "u": 24, "w": "accord", "f": 1, "m": "ac-（向）+cord（心）", "d": "1. v. 与……一致；相符（1）", "e": "Since desire and will are damaged by the presence of thoughts that do not <mark>accord</mark> with desire, Allen concluded: &quot;We do not attract what we want, but what we are.&quot;"}, {"id": 2379, "u": 24, "w": "accumulate", "f": 1, "m": "ac-（往一起加）+cumul（堆积、积累）+-ate（做出这种动作）", "d": "1. v. 积累；累积（1）", "e": "The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the title&#x27;s impact factor) and the number of citations a specific paper <mark>accumulates</mark>."}, {"id": 2380, "u": 24, "w": "accurate", "f": 1, "m": "ac-（向、加强）+cur（关注、照料）+-ate（处于这种状态的）", "d": "1. adj. 准确的（1）", "e": "This process, along with employees reviewing the contracts, is faster and more <mark>accurate</mark>."}, {"id": 2381, "u": 24, "w": "accurately", "f": 1, "m": "accurate（准确的）+ly（以这种方式）", "d": "1. adv. 准确地（1）", "e": "Insurance companies, meanwhile, can base their premiums on AI models that more <mark>accurately</mark> assess risk."}, {"id": 2382, "u": 24, "w": "accuse", "f": 1, "m": "ac-（朝向）+cuse（原因、指控）", "d": "1. v. 指责；指控（1）", "e": "Still, we need to be careful not to <mark>accuse</mark> opponents of bad arguments too quickly."}, {"id": 2383, "u": 24, "w": "acre", "f": 1, "m": "", "d": "1. n. 英亩（1）", "e": "Covering about two and a half <mark>acres</mark>, Pavlopetri&#x27;s three main roads __18__ some 50 rectangular buildings, all of which had open courtyards."}, {"id": 2384, "u": 24, "w": "admire", "f": 1, "m": "ad-（向着）+mir（惊奇地看）+e（词形结尾）", "d": "1. v. 钦佩、赞赏（1）", "e": "During his lifetime, though, he was also one of England&#x27;s foremost classical-music critics, and a stylist so widely <mark>admired</mark> that his Autobiography (1947) became a best-seller."}, {"id": 2385, "u": 24, "w": "adolescent", "f": 1, "m": "ad-（向前 ter（以后）+-ward（向……方向）", "d": "1. adv. 后来；之后（1）", "e": "[ C ] <mark>Afterward</mark>"}, {"id": 2394, "u": 24, "w": "agreeable", "f": 1, "m": "agree（同意、相合）+-able（具有这种性质的）", "d": "1. adj. 乐意接受的、赞同的（1）", "e": "[ C ] <mark>agreeable</mark>"}, {"id": 2395, "u": 24, "w": "ahead", "f": 1, "m": "a-（在、朝）+head（头、前端）", "d": "1. adv. 提前、预先（1）", "e": "The performance was a creative call to action <mark>ahead</mark> of November&#x27;s United Nations Climate Change Conference in Glasgow, UK."}, {"id": 2396, "u": 24, "w": "albeit", "f": 1, "m": "all（完全）+be（是）+it（它）", "d": "1. conj. 虽然；尽管（1）", "e": "She is proud that several sculptures have even gone on display again, <mark>albeit</mark> sometimes beneath protective cases."}, {"id": 2397, "u": 24, "w": "alert", "f": 1, "m": "", "d": "1. n. 警报；提醒通知（1）", "e": "Consumers passionate about a product may create &quot;earned&quot; media by willingly promoting it to friends, and a company may leverage &quot;owned&quot; media by sending e-mail <mark>alerts</mark> about products and sales to customers registered with its Web site."}, {"id": 2398, "u": 24, "w": "alien", "f": 1, "m": "", "d": "1. adj. 陌生的；不相容的（1）", "e": "[ D ] <mark>alien</mark>"}, {"id": 2399, "u": 24, "w": "alive", "f": 1, "m": "a-（处于……状态）+live（活着）", "d": "1. adj. 活着的（1）", "e": "If the trade unionist Jimmy Hoffa were <mark>alive</mark> today, he would probably represent civil servants."}, {"id": 2400, "u": 24, "w": "ally", "f": 1, "m": "", "d": "1. n. 盟友（1）", "e": "[ C ] takes republicans as his potential <mark>allies</mark>."}, {"id": 2401, "u": 25, "w": "alphabet", "f": 1, "m": "alpha（希腊字母α）+beta（希腊字母β）", "d": "1. n. 字母（缩写的组成）（1）", "e": "Instead, the digital services tax is part of a much larger trend, with countries over the past few years proposing or putting in place an <mark>alphabet</mark> soup of new international tax provisions."}, {"id": 2402, "u": 25, "w": "amiable", "f": 1, "m": "ami（爱、友好）+-able（能够被喜爱、容易亲近的）", "d": "1. adj. 和蔼可亲的、友善的（1）", "e": "[ B ] <mark>amiable</mark>"}, {"id": 2403, "u": 25, "w": "amuse", "f": 1, "m": "", "d": "1. v. 逗乐；使开心（1）", "e": "[ B ] Applications like tumblr.com, which allow users to combine pictures, words and other media in creative ways and then share them, have the potential to add stickiness by <mark>amusing</mark>, entertaining and enlightening others."}, {"id": 2404, "u": 25, "w": "analytical", "f": 1, "m": "analytic（分析的）+-al（具有这种特点的）", "d": "1. adj. 分析性的（1）", "e": "Science-based <mark>analytical</mark> approaches proved remarkably successful in the hunt for German submarines in the Atlantic Ocean."}, {"id": 2405, "u": 25, "w": "anniversary", "f": 1, "m": "ann-（年）+i（连接元音）+vers（转）+-ary（与……有关的）", "d": "1. n. 周年纪念（1）", "e": "[ A ] Last year marked the 150th <mark>anniversary</mark> of a series of Yellowstone photographs by the renowned landscape photographer William Henry Jackson."}, {"id": 2406, "u": 25, "w": "anytime", "f": 1, "m": "any（任何）+time（时候、时间）", "d": "1. adv. 随时；任何时候（1）", "e": "This is the credibility process, through which the individual researcher&#x27;s me, here, now becomes the community&#x27;s anyone, anywhere, <mark>anytime</mark>."}, {"id": 2407, "u": 25, "w": "apartment", "f": 1, "m": "apart（分开的、分隔的）+-ment（名词后缀）", "d": "1. n. 公寓；公寓住宅（1）", "e": "The researchers mapped not only the city&#x27;s vast and ornate ceremonial areas, but also hundreds of simpler <mark>apartment</mark> complexes where common people lived."}, {"id": 2408, "u": 25, "w": "apologize", "f": 1, "m": "apology（道歉；辩解，去y）+-ize（动词后缀）", "d": "1. v. 道歉（1）", "e": "DeepMind has almost <mark>apologized</mark>."}, {"id": 2409, "u": 25, "w": "appetite", "f": 1, "m": "ap-（趋向）+pet（寻求）+ite（本词的名词结尾）", "d": "1. n. 强烈欲望（1）", "e": "And it is equally true that science&#x27;s unrelenting <mark>appetite</mark> for information has caused a mushrooming of energy-intensive data centres around the world."}, {"id": 2410, "u": 25, "w": "appreciate", "f": 1, "m": "ap-（向）+preci（价值）+-ate（动词后缀）", "d": "1. v. 欣赏；认可（1）", "e": "Sometimes years are required for truly novel discovery claims to be accepted and <mark>appreciated</mark>."}, {"id": 2411, "u": 25, "w": "approximately", "f": 1, "m": "approximate（近似的、大致相当的）+ly（副词后缀）", "d": "1. adv. 大约；近似地（1）", "e": "[ A ] <mark>Approximately</mark>"}, {"id": 2412, "u": 25, "w": "apt", "f": 1, "m": "", "d": "1. adj. 容易……的（1）", "e": "[ B ] is <mark>apt</mark> to arouse criticism at home and abroad."}, {"id": 2413, "u": 25, "w": "archaeology", "f": 1, "m": "archaeo-（古代、古代事物）+-logy（研究、学科）", "d": "1. n. 考古学（1）", "e": "Since the 1960s, underwater <mark>archaeology</mark> __15__ and tools had made huge advances."}, {"id": 2414, "u": 25, "w": "architect", "f": 1, "m": "archi-（首席、主要）+tect（建造者）", "d": "1. n. 建筑师（1）", "e": "Designed by Supervising <mark>Architect</mark> of the Treasury, Alfred B. Mullett, it was built from 1871 to 1888 to house the growing staffs of the State, War, and Navy Departments, and is considered one of the best examples of French Second Empire architecture in the country."}, {"id": 2415, "u": 25, "w": "archive", "f": 1, "m": "", "d": "1. n. 档案馆；档案保存机构（1）", "e": "Libraries and <mark>archives</mark> have traditionally shouldered the responsibility of organization, preservation, and access to information."}, {"id": 2416, "u": 25, "w": "arrogant", "f": 1, "m": "ar-（朝向自己一方）+rog（请求、主张）+-ant（具有这种性质的）", "d": "1. adj. 傲慢的（1）", "e": "[ A ] <mark>arrogant</mark>."}, {"id": 2417, "u": 25, "w": "ascribe", "f": 1, "m": "a-（向）+scrib（写）+e（词形结尾）", "d": "1. v. 赋予（意义）（1）", "e": "[ G ] Rather, we <mark>ascribe</mark> meanings to texts on the basis of interaction between what we might call textual and contextual material: between kinds of organization or patterning we perceive in a text&#x27;s formal structures (so especially its language structures) and various kinds of background, social knowledge, belief and attitude that we bring to the text."}, {"id": 2418, "u": 25, "w": "ash", "f": 1, "m": "", "d": "1. n. 灰烬（1）", "e": "This was an attempt to recover the valuable nails, which could be reused after sifting the <mark>ashes</mark>."}, {"id": 2419, "u": 25, "w": "assemble", "f": 1, "m": "as-（向）+sem（相同、同一）+ble（词形结尾）", "d": "1. v. 组装；组合（1）", "e": "How the whole image is then <mark>assembled</mark> and perceived is still a mystery although it is the subject of current research."}, {"id": 2420, "u": 25, "w": "assert", "f": 1, "m": "as-（向）+sert（连接；主张）", "d": "1. v. 明确表达、坚持主张（1）", "e": "The Administration was in essence <mark>asserting</mark> that because it didn&#x27;t want to carry out Congress&#x27;s immigration wishes, no state should be allowed to do so either."}, {"id": 2421, "u": 25, "w": "assignment", "f": 1, "m": "assign（分配、指派）+-ment（表示行为或结果的名词后缀）", "d": "1. n. 作业；指定任务（1）", "e": "I&#x27;ve got a class <mark>assignment</mark> to make an oral report on an ancient Chinese scientist, but I&#x27;m not sure how to prepare for it."}, {"id": 2422, "u": 25, "w": "assistance", "f": 1, "m": "assist（协助、帮助）+-ance（行为、作用的名词后缀）", "d": "1. n. 帮助；援助（1）", "e": "Called conditional cash transfers or CCTs, these social <mark>assistance</mark> programs are designed to reduce inequality and break the cycle of poverty."}, {"id": 2423, "u": 25, "w": "assurance", "f": 1, "m": "assure（使确信、向……保证，去掉末尾e）+ance（行为、话语或状态的名词形式）", "d": "1. n. 把握、信心（1）", "e": "But take a longer view and there is a surprising amount that we can say with considerable <mark>assurance</mark>."}, {"id": 2424, "u": 25, "w": "attorney", "f": 1, "m": "", "d": "1. n. 律师（1）", "e": "The judges on the Federal Circuit are &quot;reacting to the anti-patent trend at the Supreme Court,&quot; says Harold C. Wegner, a patent <mark>attorney</mark> and professor at George Washington University Law School."}, {"id": 2425, "u": 25, "w": "audit", "f": 1, "m": "audi（听）+t（词形结尾）", "d": "1. n. 审计（1）", "e": "[ B ] One accounting firm, BY, uses an AI system that helps review contracts during an <mark>audit</mark>."}, {"id": 2426, "u": 25, "w": "augment", "f": 1, "m": "aug（增加、扩大）+ment（本词的动词词形部分）", "d": "1. v ractions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and <mark>banners</mark> at an appropriate frequency."}, {"id": 2435, "u": 25, "w": "basically", "f": 1, "m": "basic（基本的、基础的）+ally（从这种性质而言）", "d": "1. adv. 基本上；本质上（1）", "e": "[ B ] have remained <mark>basically</mark> the same since Roman times"}, {"id": 2436, "u": 25, "w": "bearing", "f": 1, "m": "bear（承受；携带）+-ing（名词后缀）", "d": "1. n. 方位感（1）", "e": "If you&#x27;ve explored the area before, keep an eye out for familiar sights - you may be __11__ how quickly identifying a distinctive rock or tree can restore your <mark>bearings</mark>."}, {"id": 2437, "u": 25, "w": "beautify", "f": 1, "m": "beaut-（beauty去y，美、美丽）+-ify（使成为、使具有）", "d": "1. v. 美化（1）", "e": "There is no doubt that gardens evidence an irrepressible urge to create, express, fashion, and <mark>beautify</mark> and that self-expression is a basic human urge; (46) yet when one looks at the photographs of the gardens created by the homeless, it strikes one that, for all their diversity of styles, these gardens speak of various other fundamental urges, beyond that of decoration and creative expression."}, {"id": 2438, "u": 25, "w": "becoming", "f": 1, "m": "become（适合，去e）+-ing（形容词化分词后缀）", "d": "1. adj. 得体的；相称的（1）", "e": "A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#x27;s gum-exposing Cheshire Cat, but it was not a <mark>becoming</mark> look for properly bred persons."}, {"id": 2439, "u": 25, "w": "bench", "f": 1, "m": "", "d": "1. n. 后备人才队伍（1）", "e": "Persuading studios to film here would become much more challenging if we couldn&#x27;t offer a deep <mark>bench</mark> of local film workers, on-screen talent and local businesses that support the entertainment industry."}, {"id": 2440, "u": 25, "w": "better", "f": 1, "m": "", "d": "1. v. 改善  Quick Cure."}, {"id": 2488, "u": 25, "w": "cigar", "f": 1, "m": "", "d": "1. n. 雪茄（1）", "e": "There were Pickwick coats and Pickwick <mark>cigars</mark>, and the plump, spectacled hero, Samuel Pickwick, became a national figure."}, {"id": 2489, "u": 25, "w": "cigarette", "f": 1, "m": "cigar（雪茄烟）+ette（小型）", "d": "1. n. 香烟（1）", "e": "Rosenberg, the recipient of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking program called Rage Against the Haze sets out to make <mark>cigarettes</mark> uncool."}, {"id": 2490, "u": 25, "w": "citizenship", "f": 1, "m": "citizen（公民）+-ship（身份、资格）", "d": "1. n. 公民身份、国籍（1）", "e": "Some powers do belong exclusively to the federal government, and control of <mark>citizenship</mark> and the borders is among them."}, {"id": 2491, "u": 25, "w": "classic", "f": 1, "m": "class（等级）+-ic（具有这种性质的，也可指相应作品）", "d": "1. adj. 经典的（1）", "e": "Modern (Sebastian Barry or Olga Tokarczuk), <mark>classic</mark> (Virginia Woolf or James Baldwin) or genre (Stephen King, Margaret Atwood, Georges Simenon)-it doesn&#x27;t matter."}, {"id": 2492, "u": 25, "w": "classification", "f": 1, "m": "class（类别）+-ification（使成为及其过程的名词后缀）", "d": "1. n. 分类（1）", "e": "The US Supreme Court frowns on sex-based <mark>classifications</mark> unless they are designed to address an &quot;important&quot; policy interest."}, {"id": 2493, "u": 25, "w": "cliff", "f": 1, "m": "", "d": "1. n. 悬崖（1）", "e": "His pictures of a Glanville fritillary rising from the sea-pinks beside the chalk <mark>cliffs</mark> of Compton Bay on the Isle of Wight are particularly glorious."}, {"id": 2494, "u": 25, "w": "cling", "f": 1, "m": "", "d": "1. v. 紧紧抓住；不愿放弃（1）", "e": "[ A ] top performers used to <mark>cling</mark> to their posts."}, {"id": 2495, "u": 25, "w": "cloak", "f": 1, "m": "", "d": "1. v. 掩饰（1）", "e": "Rather than <mark>cloaking</mark> his exit in the usual vague excuses, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot;"}, {"id": 2496, "u": 25, "w": "coalition", "f": 1, "m": "co-（共同）+alit（生长；alescere的词干变体）+-ion（名词后缀）", "d": "1. n. 联盟（1）", "e": "&quot;There is a <mark>coalition</mark> growing within artist industries to figure out how to tackle or mitigate this,&quot; says Ortiz."}, {"id": 2497, "u": 25, "w": "coexistence", "f": 1, "m": "co-（共同、一起）+exist（存在）+-ence（状态）", "d": "1. n. 共存（1）", "e": "I believe it is precisely this permanent <mark>coexistence</mark> of metaphysical message through physical means that is the strength of music."}, {"id": 2498, "u": 25, "w": "coherent", "f": 1, "m": "co-（一起）+her（粘合、结合）+-ent（具有这种状态的）", "d": "1. adj. 连贯的；协调一致的（1）", "e": "To encourage innovation and competition, the report calls for increased investment in research, the crafting of <mark>coherent</mark> curricula that improve students&#x27; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day."}, {"id": 2499, "u": 25, "w": "coin", "f": 1, "m": "", "d": "1. v. 创造新词（1）", "e": "[ A ] <mark>coined</mark>"}, {"id": 2500, "u": 25, "w": "coincide", "f": 1, "m": "co-（共同）+in-（在……上）+cid-（落下、发生）+e（词形结尾）", "d": "1. v. 同时发生（1）", "e": "Though it&#x27;s still unclear why the original domestication happened, Science News&#x27; Freda Kreier reports that the event <mark>coincided</mark> with the Sahara growing larger and drier."}, {"id": 2501, "u": 26, "w": "colonial", "f": 1, "m": "colony（殖民地，去掉末尾y）+ial（与……有关的）", "d": "1. adj. 殖民地的（1）", "e": "Of necessity, <mark>colonial</mark> America was a projection of Europe."}, {"id": 2502, "u": 26, "w": "colony", "f": 1, "m": "col（耕种、居住）+-ony（名词结尾）", "d": "1. n. 殖民地（1）", "e": "In the meantime, thriving Spanish <mark>colonies</mark> had been established in Mexico, the West Indies, and South America."}, {"id": 2503, "u": 26, "w": "column", "f": 1, "m": "", "d": "1. n. 专栏（1）", "e": "It was only after I started to write a weekly <mark>column</mark> about the medical journals, and began to read scientific papers from beginning to end, that I realised just how bad much of the medical literature frequently was."}, {"id": 2504, "u": 26, "w": "comb", "f": 1, "m": "", "d": "1. v. 仔细搜查（1）", "e": "In the late 1800s British archaeologist Sir Arthur Evans <mark>combed</mark> antique dealers&#x27; stores in Athens, Greece."}, {"id": 2505, "u": 26, "w": "combat", "f": 1, "m": "com-（共同、相互）+bat（击打）", "d": "1. n. 对抗；制止（1）", "e": "[ A ] <mark>combat</mark> unnecessary waste."}, {"id": 2506, "u": 26, "w": "committed", "f": 1, "m": "commit（交付、使承担）+-ed（已形成的状态）", "d": "1. adj. 投入的（1）", "e": "Employers have long seen the advantages of hiring school leavers who often prove themselves to be more <mark>committed</mark> and loyal employees than graduates."}, {"id": 2507, "u": 26, "w": "commute", "f": 1, "m": "com-（共同、一起）+mut（改变、交换）+e（词形结尾）", "d": "1. v. 通勤（1）", "e": "Why, the argument goes, should a car-driving pensioner from Lincolnshire have to subsidise the daily <mark>commute</mark> of a stockbroker from Surrey?"}, {"id": 2508, "u": 26, "w": "compact", "f": 1, "m": "com-（共同、一起）+pact（固定、压紧）", "d": "1. n. 协议；契约（1）", "e": "&quot;The basic <mark>compact</mark> underlying representative government,&quot; wrote Chief Justice John Roberts for the court, &quot;assumes that public officials will hear from their constituents and act on their concerns.&quot;"}, {"id": 2509, "u": 26, "w": "comparable", "f": 1, "m": "compar-（compare去e，比较）+-able（能够……的）", "d": "1. adj. 可比较的；类似的（1）", "e": "The author believes that exploring one&#x27;s phone contents is <mark>comparable</mark> to____"}, {"id": 2510, "u": 26, "w": "comparative", "f": 1, "m": "compar-（compare去掉末尾e，比较）+-ative（具有相应性质的）", "d": "1. adj. 比较的（1）", "e": "But a <mark>comparative</mark> study of linguistic traits published online today supplies a reality check."}, {"id": 2511, "u": 26, "w": "compass", "f": 1, "m": "com-（一起）+pass（通过、走过）", "d": "1. n. 指南针（1）", "e": "__3__ you get lost without a phone or a <mark>compass</mark>, and you __4__ can&#x27;t find north, we have a few tricks to help you navigate __5__ to civilization, one of which is to follow the land."}, {"id": 2512, "u": 26, "w": "compel", "f": 1, "m": "com-（充分、加强）+pel（推动、驱使）", "d": "1. v. 强迫；迫使（1）", "e": "[ C ] <mark>compelled</mark>"}, {"id": 2513, "u": 26, "w": "compelling", "f": 1, "m": "compell-（compel双写l，迫使、强烈驱使）+ing（具有这种作用的）", "d": "1. adj. 令人信服的（1）", "e": "The idea is intuitively <mark>compelling</mark>, but it doesn&#x27;t explain how ideas actually spread."}, {"id": 2514, "u": 26, "w": "compensate", "f": 1, "m": "com-（一起、使相抵）+pens（支付）+-ate（动词后缀）", "d": "1. v. 补偿；赔偿（1）", "e": "[ A ] It is clear that the countries of origin have never been <mark>compensated</mark> for the stolen artifacts."}, {"id": 2515, "u": 26, "w": "compensatory", "f": 1, "m": "compensat-（compensate去e，补偿、赔偿）+-ory（具有这种作用或性质的）", "d": "1. adj. 补偿性的（1）", "e": "[ C ] <mark>compensatory</mark>."}, {"id": 2516, "u": 26, "w": "compile", "f": 1, "m": "com-（一起）+pile（汇集）", "d": "1. v. 编纂；汇集（1）", "e": "In 2022, Swetnam and other scientists teamed up to <mark>compile</mark> a database of fire-scarred trees from across the continent."}, {"id": 2517, "u": 26, "w": "complementary", "f": 1, "m": "complement（补足、补足物）+-ary（具有相应性质、关系的）", "d": "1. adj. 互补的（1）", "e": "Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes <mark>complementary</mark> and even competitive products."}, {"id": 2518, "u": 26, "w": "complicated", "f": 1, "m": "complicate（使复杂，去掉末尾e）+-ed（已经形成这种状态的）", "d": "1. adj. 复杂的；难懂的（1）", "e": "[ B ] describes the long and <mark>complicated</mark> process of its making."}, {"id": 2519, "u": 26, "w": "component", "f": 1, "m": "com-（一起）+pon（放置）+ent（参与者、事物或性质的词形结尾）", "d": "1. n. 组成部分（1）", "e": "Together, they make up the reading <mark>component</mark> of your overall literacy, or relationship to your surrounding textual environment."}, {"id": 2520, "u": 26, "w": "compose", "f": 1, "m": "com-（一起）+pos（放置）+e（词形结尾）", "d": "1. v. 组成（1）", "e": "It was a musician who discovered the planet Uranus in the 18th century by making his own telescope with mirrors <mark>composed</mark> of copper and tin."}, {"id": 2521, "u": 26, "w": "comprehend", "f": 1, "m": "com-（一起、完整地）+prehend（抓住）", "d": "1. v. 理解；领会（1）", "e": "Clearly you try to <mark>comprehend</mark>, in the sense of identifying meanings for individual words and working out relationships between them, drawing on your implicit knowledge of English grammar."}, {"id": 2522, "u": 26, "w": "concede", "f": 1, "m": "con-（加强）+ced-（走、退让）+e（词尾字母）", "d": "1. v. 承认（某事属实、正确）（1）", "e": "Of course, I need to <mark>concede</mark> that my collection of &#x27;Smiling Victorians&#x27; makes up only a tiny percentage of the vast catalogue of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance."}, {"id": 2523, "u": 26, "w": "concerning", "f": 1, "m": "concern（涉及、关系到）+-ing（本词形成介词用法的结尾）", "d": "1. adj. 令人担忧的（1）", "e": "&quot;That&#x27;s <mark>concerning</mark>.&quot;"}, {"id": 2524, "u": 26, "w": "concession", "f": 1, "m": "concess-（concede的词干形式，让步、让予）+-ion（行为、结果）", "d": "1. n. 让步（1）", "e": "But by giving in to critics now they are inviting pressure to make more <mark>concessions</mark>."}, {"id": 2525, "u": 26, "w": "conference", "f": 1, "m": "confer（商讨）+ence（名词后缀）", "d": "1. n. 会议（1）", "e": "You are supposed to write for the Postgraduates’ Association a notice to recruit volunteers for an international <mark>conference</mark> on globalization."}, {"id": 2526, "u": 26, "w": "confide", "f": 1, "m": "con-（加强）+fid-（信任）+e（拼写结尾）", "d": "1. v. 吐露 (隐私)（1）", "e": "He could not <mark>confide</mark> them even to his wife, although they provide the unacknowledged foundation of his fiction."}, {"id": 2527, "u": 26, "w": "confident", "f": 1, "m": "con-（充分）+fid（相信）+-ent（具有这种状态的）", "d": "1. adj. 有信心的（1）", "e": "[ C ] <mark>confident</mark>."}, {"id": 2528, "u": 26, "w": "conjunction", "f": 1, "m": "con-（共同、一起）+junct（连接）+-ion（过程或结果）", "d": "1. n. 同时发生（1）", "e": "The scores were __15__ used in <mark>conjunction</mark> with an applicant&#x27;s score on the Graduate Management Admission Test, or GMAT, a standardised exam which is __16__ out of 800 points, to make a decision on whether to accept him or her."}, {"id": 2529, "u": 26, "w": "conspiracy", "f": 1, "m": "con-（共同、一起）+spir（呼吸）+-acy（行为或关系的名词词形）", "d": "1. n. 阴谋（1）", "e": "[ D ] was part of a <mark>conspiracy</mark>."}, {"id": 2530, "u": 26, "w": "constitute", "f": 1, "m": "con-（共同）+stitut（放置、建立）+e（词形结尾）", "d": "1. v. 构成；算作（1）", "e": "[ D ] <mark>constitutes</mark> part of the investigation."}, {"id": 2531, "u": 26, "w": "consultant", "f": 1, "m": "consult（咨询、商议）+ant（接受咨询、提供意见的人）", "d": "1. n. 顾问；咨询师（1）", "e": "In one example, an individual-acting as author, editor, and <mark>consultant</mark>-was able to use at least 15 journals as citation providers to articles published by five scientists at three universities."}, {"id": 2532, "u": 26, "w": "consuming", "f": 1, "m": "consum（consume去e，消耗）+-ing（具有这种作用的）", "d": "1. adj. 耗费的（1）", "e": "Americans are willing to tolerate time-<mark>consuming</mark> security procedures in return for increased safety."}, {"id": 2533, "u": 26, "w": "contemptible", "f": 1, "m": "contempt（轻蔑）+-ible（值得被……的）", "d": "1. adj. 可鄙的（1）", "e": "[ B ] It is <mark>contemptible</mark> for writers to be journalists."}, {"id": 2534, "u": 26, "w": "contend", "f": 1, "m": "con-（共同、相互）+tend（伸展、用力指向）", "d": "1. v. 主张；认为（1）", "e": "But in her new book Join the Club, Tina Rosenberg <mark>contends</mark> that peer pressure can also be a positive force through what she calls the social cure, in which organizations and officials use the power of group dynamics to help individuals improve their lives and possibly the world."}, {"id": 2535, "u": 26, "w": "continually", "f": 1, "m": "continual（不断发生的、持续的）+-ly（以这种方式）", "d": "1. adv. 不断地；持续地（1）", "e": "However, Allen believed that the unconscious mind generates as much action as the conscious mind, and (47) while we may be able to sustain the illusion of control through the conscious mind alone, in reality we are <mark>continually</mark> faced with a question: &quot;Why cannot I make myself do this or achieve that?&quot;"}, {"id": 2536, "u": 26, "w": "continuous", "f": 1, "m": "con-（加强）+tinu（连续、持续）+-ous（形容词后缀）", "d": "1. adj. 连续的；持续不断的（1）", "e": "Specifically, a 5-4 majority decided that wetlands protected by the EPA under its Clean Water Act authority must have a &quot;<mark>continuous</mark> surface connection&quot; to bodies of water."}, {"id": 2537, "u": 26, "w": "contradict", "f": 1, "m": "contra-（相反）+dict（说）", "d": "1. v. 反驳（1）", "e": "[ D ] <mark>contradicted</mark> both the federal and state policies."}, {"id": 2538, "u": 26, "w": "contradiction", "f": 1, "m": "contra-（相反）+dict（说）+-ion（行为或状态的名词后缀）", "d": "1. n. 矛盾（1）", "e": "In his Oxford lectures, Seamus Heaney argued that a poem draws a picture of reality, a &quot;glimpsed alternative&quot; that sets up a <mark>contradiction</mark> with your own, in ways little and large."}, {"id": 2539, "u": 26, "w": "convenience", "f": 1, "m": "conveni-（相合；适宜，历史词干）+-ence（状态）", "d": "1. n. 方便，便利（1）", "e": "[ B ] <mark>convenience</mark>"}, {"id": 2540, "u": 26, "w": "convenient", "f": 1, "m": "con-（共同、一起）+ven（来、到）+i（连接字母）+-ent（具有这种状态的）", "d": "1. adj. 方便的；便利的（1）", "e": "__6__ , as <mark>convenient</mark> and provocative, AI enables virtual try-on experiences where you can virtually __7__ makeup, hairstyles, clothing, and even cosmetic procedures __8__ making any physical changes."}, {"id": 2541, "u": 26, "w": "conversely", "f": 1, "m": "con-（相互）+verse（转）+-ly（以这种方式）", "d": "1. adv. 相反（1）", "e": "[ D ] <mark>Conversely</mark>"}, {"id": 2542, "u": 26, "w": "convict", "f": 1, "m": "con-（完全）+vict（战胜）", "d": "1. v. 判定有罪（1）", "e": "[ B ] made no compromise in <mark>convicting</mark> McDonnell."}, {"id": 2543, "u": 26, "w": "cooperative", "f": 1, "m": "cooperate（合作、协作，去掉末尾e）+ive（具有相应性质的）", "d": "1. adj. 合作的（1）", "e": "[ D ] <mark>cooperative</mark> spirit."}, {"id": 2544, "u": 26, "w": "coordinate", "f": 1, "m": "co-（共同、一起）+ordin（次序、安排）+-ate（实行这种安排）", "d": "1. v. 协调（1）", "e": "[ A ] The need to <mark>coordinate</mark> anti-piracy action."}, {"id": 2545, "u": 26, "w": "correct", "f": 1, "m": "cor-（加强）+rect（直、正）", "d": "1. v. 纠正（1）", "e": "After the first installment, Dickens wrote to the artist and asked him to <mark>correct</mark> a drawing Dickens felt was not faithful enough to his prose."}, {"id": 2546, "u": 26, "w": "correlation", "f": 1, "m": "cor-（共同、相互）+relation（关系）", "d": "1. n. 相关性；相关关系（1）", "e": "However, those <mark>correlations</mark> don&#x27;t prove cause and effect."}, {"id": 2547, "u": 26, "w": "correspond", "f": 1, "m": "cor-（相互）+respond（回答、作出反应）", "d": "1. v. 相符合（1）", "e": "In the end, credibility &quot;happens&quot; to a discovery claim-a process that <mark>corresponds</mark> to what philosopher Annette Baier has described as the commons of the mind."}, {"id": 2548, "u": 26, "w": "cotton", "f": 1, "m": "", "d": "1. n. 棉花（1）", "e": "Parts of the ceremony involve ritual hair cutting, __9__ <mark>cotton</mark> threads soaked in holy water around the bride&#x27;s and groom&#x27;s wrists, and __10__ a candle around a circle of happily married and respected couples to bless the __11__ ."}, {"id": 2549, "u": 26, "w": "council", "f": 1, "m": "", "d": "1. n. 委员会；议会（1）", "e": "Labour likewise wants to discontinue local planning where <mark>councils</mark> oppose development."}, {"id": 2550, "u": 26, "w": "counter", "f": 1, "m": "", "d": "1. v. 反驳；反击（1）", "e": "Then I <mark>counter</mark> with another reasonable argument: that a higher minimum wage will force businesses to employ fewer people for less time."}, {"id": 2551, "u": 26, "w": "counteract", "f": 1, "m": "counter-（相反、反向）+act（起作用、行动）", "d": "1. v. 抵消；抗衡（1）", "e": "&quot;This indicates there is a real personal responsibility in <mark>counteracting</mark> this problem,&quot; says Roxanne Stone, editor in chief at Barna Group."}, {"id": 2552, "u": 26, "w": "coverage", "f": 1, "m": "cover（覆盖、报道）+-age（行为、结果或范围）", "d": "1. n. 报道（1）", "e": "Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-reaching has been the inexorable decline in the scope and seriousness of their arts <mark>coverage</mark>."}, {"id": 2553, "u": 26, "w": "cricket", "f": 1, "m": "", "d": "1. n. 板球（1）", "e": "Neville Cardus, who wrote for the Manchester Guardian from 1917 until shortly before his death in 1975, is now known solely as a writer of essays on the game of <mark>cricket</mark>."}, {"id": 2554, "u": 26, "w": "crisp", "f": 1, "m": "", "d": "1. v. 使变脆（1）", "e": "This means that people should __7__ <mark>crisping</mark> their roast potatoes, reject thin-crust pizzas and only __8__ toast their bread."}, {"id": 2555, "u": 26, "w": "crown", "f": 1, "m": "", "d": "1. n. 桂冠、荣誉称号（1）", "e": "Cooper and her colleagues argue that the success of the <mark>crown</mark> for Hull, where it brought in £220m of investment and an avalanche of arts, ought not to be confined to cities."}, {"id": 2556, "u": 26, "w": "crust", "f": 1, "m": "", "d": "1. n. 饼皮、面包等的外皮（1）", "e": "This means that people should __7__ crisping their roast potatoes, reject thin-<mark>crust</mark> pizzas and only __8__ toast their bread."}, {"id": 2557, "u": 26, "w": "cultivate", "f": 1, "m": "cult（耕种、培养）+iv（词干延长部分）+-ate（实施相应动作）", "d": "1. v. 培养；培育（1）", "e": "[ C ] <mark>cultivate</mark>"}, {"id": 2558, "u": 26, "w": "cumulative", "f": 1, "m": "cumul-（堆积、积累）+-ative（具有相应作用或性质的）", "d": "1. adj. 累计的（1）", "e": "Consulting firm Parks Associates predicts that legitimate US streaming services&#x27; <mark>cumulative</mark> loss from piracy since 2022 will reach $113 billion in the nex ds is only one limited benchmark in a country that <mark>decentralises</mark> decisions to local school boards."}, {"id": 2569, "u": 26, "w": "declare", "f": 1, "m": "de-（充分）+clar（清晰）+e（拼写结尾）", "d": "1. v. 宣布；声明（1）", "e": "The order also <mark>declared</mark> that state and local governments couldn&#x27;t regulate broadband providers either."}, {"id": 2570, "u": 26, "w": "dedicate", "f": 1, "m": "de-（完全、加强）+dic（宣告）+-ate（构成动词）", "d": "1. v. 投入；致力于；专用于（1）", "e": "That&#x27;s one reason why we have launched Arc, a new publication <mark>dedicated</mark> to the near future."}, {"id": 2571, "u": 26, "w": "deed", "f": 1, "m": "", "d": "1. n. 行为、事迹（1）", "e": "And third, through a more diffuse &quot;halo effect,&quot; whereby its good <mark>deeds</mark> earn it greater consideration from consumers and others."}, {"id": 2572, "u": 26, "w": "defend", "f": 1, "m": "de-（向外、离开）+fend（击打）", "d": "1. v. 维护；为……辩护（1）", "e": "[ A ] <mark>defended</mark>"}, {"id": 2573, "u": 26, "w": "deficiency", "f": 1, "m": "deficient（缺乏的、不足的；去掉末尾t）+-cy（性质、状态）", "d": "1. n. 缺乏；不足（1）", "e": "(50) The intense focus on scientific literacy in the United States originally grew out of the critical role of science and technology during World War II, as well as the perceived <mark>deficiencies</mark> of American soldiers."}, {"id": 2574, "u": 26, "w": "definitely", "f": 1, "m": "definite（明确的、确定的）+-ly（以这种态度或方式）", "d": "1. adv. 肯定地；明确地（1）", "e": "<mark>Definitely</mark> not."}, {"id": 2575, "u": 26, "w": "degrade", "f": 1, "m": "de-（向下）+grade（等级）", "d": "1. v. 降低地位；降职（1）", "e": "Words <mark>degraded</mark> to the margin have been justice, fairness, tolerance, proportionality and accountability."}, {"id": 2576, "u": 26, "w": "delicate", "f": 1, "m": "delic（精致、娇嫩、微妙）+-ate（具有这种性质的）", "d": "1. adj. 精巧而脆弱的（干扰项）（1）", "e": "[ D ] <mark>delicate</mark>"}, {"id": 2577, "u": 26, "w": "demographic", "f": 1, "m": "demo-（人民、人口）+graph-（记录、描述）+-ic（与……有关的）", "d": "1. adj. 人口的（1）", "e": "[ A ] The idea is to force social scientists to integrate their work with other categories, including health and <mark>demographic</mark> change; food security; marine research and the bio-economy; clean, efficient energy; and inclusive, innovative and secure societies."}, {"id": 2578, "u": 26, "w": "descend", "f": 1, "m": "de-（向下）+scend（攀爬）", "d": "1. v. 从高端逐渐传至低端（1）", "e": "Priestly explains how the deep blue color of the assistant&#x27;s sweater <mark>descended</mark> over the years from fashion shows to department stores and to the bargain bin in which the poor girl doubtless found her garment."}, {"id": 2579, "u": 26, "w": "descendant", "f": 1, "m": "descend（沿世代传承）+ant（处于相应关系中的人）", "d": "1. n. 后代（1）", "e": "As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based forecasts about the situations in which our <mark>descendants</mark> will find themselves."}, {"id": 2580, "u": 26, "w": "designation", "f": 1, "m": "designat（designate去e，指定、指派）+-ion（这种行为或结果）", "d": "1. n. 正式认定（1）", "e": "While some locals opposed the <mark>designation</mark>, the decision was largely accepted-and Jackson&#x27;s photos played a key role in the fight to protect the area."}, {"id": 2581, "u": 26, "w": "desirable", "f": 1, "m": "desir-（desire去e，渴望）+-able（值得……的）", "d": "1. adj. 理想的（1）", "e": "[ B ] <mark>desirable</mark>."}, {"id": 2582, "u": 26, "w": "despise", "f": 1, "m": "de（向下）+spis（看）+e（词形结尾）", "d": "1. v. 鄙视（1）", "e": "Animals <mark>despise</mark> being captives in zoos."}, {"id": 2583, "u": 26, "w": "destiny", "f": 1, "m": "destin（确定、注定）+-y（状态或结果的名词结尾）", "d": "1. n. 命运（1）", "e": "(46) This movement, driven by powerful and diverse motivations, built a nation out of a wilderness and, by its nature, shaped the character and <mark>destiny</mark> of an uncharted continent."}, {"id": 2584, "u": 26, "w": "destruction", "f": 1, "m": "de-（去除、拆去）+struct（建造、构成）+-ion（这种行为或结果）", "d": "1. n. 破坏；毁灭（1）", "e": "To say, going through a suspect&#x27;s purse."}, {"id": 2599, "u": 26, "w": "disconnect", "f": 1, "m": "dis-（分开；解除）+connect（连接）", "d": "1. v. 使脱节；使不连贯（1）", "e": "The music is abrupt and seemingly <mark>disconnected</mark>, as in the last piano sonata."}, {"id": 2600, "u": 26, "w": "discount", "f": 1, "m": "dis-（除去、减少）+count（计算）", "d": "1. v. 不重视；低估；忽视（1）", "e": "Our studies focused on the impact of zoo experiences on how people think about themselves and nature, and the data points extracted from our studies do not, in any way, <mark>discount</mark> what is learned in a zoo visit."}, {"id": 2601, "u": 27, "w": "discriminate", "f": 1, "m": "discrimin（区分；辨别）+-ate（动词后缀）", "d": "1. v. 歧视（1）", "e": "But it has already sparked significant controversy, with the United States trade representative opening an investigation into whether the tax <mark>discriminates</mark> against American companies, which in turn could lead to trade sanctions against France."}, {"id": 2602, "u": 27, "w": "discrimination", "f": 1, "m": "discriminat（discriminate去e，区别、歧视）+-ion（行为、现象）", "d": "1. n. 歧视（1）", "e": "Because the California law applies to all boards, even where there is no history of prior <mark>discrimination</mark>, courts are likely to rule that the law violates the constitutional guarantee of &quot;equal protection&quot;."}, {"id": 2603, "u": 27, "w": "dish", "f": 1, "m": "", "d": "1. n. 皿（Petri dish培养皿）（1）", "e": "So is it time to take the Petri <mark>dish</mark> out of the laboratory and into the garage?"}, {"id": 2604, "u": 27, "w": "dispatch", "f": 1, "m": "", "d": "1. n. 急件（1）", "e": "What was more, many original French <mark>dispatches</mark> had been preserved in this collection, which I realized was priceless."}, {"id": 2605, "u": 27, "w": "disperse", "f": 1, "m": "dis-（分开）+pers（散布）+e（词形结尾）", "d": "1. v. (使)分散（1）", "e": "[ A ] <mark>dispersed</mark> widely in the world."}, {"id": 2606, "u": 27, "w": "displace", "f": 1, "m": "dis-（离开原位）+place（位置、放置）", "d": "1. v. 取代；挤走（1）", "e": "The Industrial Revolution didn&#x27;t go so well for Luddites whose jobs were <mark>displaced</mark> by mechanized looms, but it eventually raised living standards and created more jobs than it destroyed."}, {"id": 2607, "u": 27, "w": "disposition", "f": 1, "m": "dis-（分开）+posit（放置）+-ion（名词后缀）", "d": "1. n. 倾向（1）", "e": "Renaissance ideas had spread throughout Europe well into the 17th century, with the arts and sciences flourishing extraordinarily among those with a more logical <mark>disposition</mark>."}, {"id": 2608, "u": 27, "w": "distinguish", "f": 1, "m": "distingu（区别）+-ish（动词词尾）", "d": "1. v. 区分；辨别（1）", "e": "[ B ] <mark>Distinguishing</mark>"}, {"id": 2609, "u": 27, "w": "ditch", "f": 1, "m": "", "d": "1. v. 抛弃（1）", "e": "Nostalgia for ink on paper and the rustle of pages aside, there&#x27;s plenty of incentive to <mark>ditch</mark> print."}, {"id": 2610, "u": 27, "w": "diversify", "f": 1, "m": "divers（diverse去e，多样的）+-ify（使成为）", "d": "1. v. 使多样化（1）", "e": "[ C ] Rules need to be set to <mark>diversify</mark> online services."}, {"id": 2611, "u": 27, "w": "dizzy", "f": 1, "m": "", "d": "1. v. 使眩晕；令人眼花缭乱（1）", "e": "The variety of plastic objects at risk is <mark>dizzying</mark>: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart."}, {"id": 2612, "u": 27, "w": "documentary", "f": 1, "m": "document（文件、记录）+-ary（有关的）", "d": "1. adj. 记录事实的、文献的（1）", "e": "[ H ] Perhaps most importantly, these images provided <mark>documentary</mark> evidence that later made its way to government officials."}, {"id": 2613, "u": 27, "w": "dome", "f": 1, "m": "", "d": "1. n. 穹顶(半球形建筑)（1）", "e": "Eight monumental curving staircases of granite with over 4,000 individually cast bronze balusters are capped by four skylight <mark>domes</mark> and two stained glass rotundas."}, {"id": 2614, "u": 27, "w": "donation", "f": 1, "m": "don（给、赠予）+-ation（行为、所给事物）", "d": "1. n. 捐赠；捐款（1）", "e": "Officials must not be allowed to play favorites in providing information or in arranging meetings simply because an individual or group provides a campaign <mark>donation</mark> or a personal gift."}, {"id": 2615, "u": 27, "w": "dormant", "f": 1, "m": "", "d": "1. adj. 休眠的（1）", "e": "At issue is the TMT&#x27;s planned location on Mauna Kea, a <mark>dormant</mark> volcano worshiped by some Hawaiians as the piko, that connects the Hawaiian Islands to the heavens."}, {"id": 2616, "u": 27, "w": "drag", "f": 1, "m": "", "d": "1. n. 拖累；阻力（1）", "e": "And it should: Wasted time is a <mark>drag</mark> on Americans&#x27; economic and private lives, not to mention infuriating."}, {"id": 2617, "u": 27, "w": "drain", "f": 1, "m": "", "d": "1. v. (人才等的)流失（1）", "e": "[ C ] a brain <mark>drain</mark> to other places."}, {"id": 2618, "u": 27, "w": "drift", "f": 1, "m": "", "d": "1. v. 逐渐流失（drift away）（1）", "e": "If productions in Southern California dip below a critical level for too long, the industry&#x27;s essential talent will <mark>drift</mark> away along with enormous sums of revenue."}, {"id": 2619, "u": 27, "w": "drone", "f": 1, "m": "", "d": "1. n. 雄蜂（1）", "e": "They afford an opportunity for people from all backgrounds to encounter a range of animals, from <mark>drone</mark> bees to springbok or salmon, to better understand the natural world we live in."}, {"id": 2620, "u": 27, "w": "drunk", "f": 1, "m": "", "d": "1. n. 醉汉（1）", "e": "A toothy grin (especially when there were gaps or blackened gnashers) lacked class: <mark>drunks</mark>, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#x27;s gum-exposing Cheshire Cat, but it was not a becoming look for properly bred persons."}, {"id": 2621, "u": 27, "w": "dubious", "f": 1, "m": "dub-（犹豫、怀疑）+ious（具有相应状态或性质的）", "d": "1. adj. 可疑的（1）", "e": "[ A ] punish <mark>dubious</mark> corporate practices."}, {"id": 2622, "u": 27, "w": "dumb", "f": 1, "m": "", "d": "1. adj. 愚蠢的（1）", "e": "It&#x27;s hard to imagine that many people are <mark>dumb</mark> enough to want children just because Reese and Angelina make it look so glamorous: most adults understand that a baby is not a haircut."}, {"id": 2623, "u": 27, "w": "duplicate", "f": 1, "m": "du-（二、双）+plic（折叠）+-ate（使成为；也接相应名词、形容词）", "d": "1. v. 复制（1）", "e": "[ B ] <mark>duplicate</mark> them for future display."}, {"id": 2624, "u": 27, "w": "dust", "f": 1, "m": "", "d": "1. n. 远远落后的位置（leave in thedust）（1）", "e": "Other regions in the United States, Canada and Europe have steadily increased incentives to attract TV shows and movies, leaving California in the <mark>dust</mark>."}, {"id": 2625, "u": 27, "w": "dwarf", "f": 1, "m": "", "d": "1. v. 使相形见绌、远超（1）", "e": "And though print ad sales still <mark>dwarf</mark> their online and mobile counterparts, revenue from print is still declining."}, {"id": 2626, "u": 27, "w": "dwelling", "f": 1, "m": "dwell（居住）+-ing（相关活动或事物）", "d": "1. n. 住宅（1）", "e": "In one case, many researchers working around the ancient Maya city of Copán, Honduras, have located hundreds of small rural villages and individual <mark>dwellings</mark> by using aerial photographs and by making surveys on foot."}, {"id": 2627, "u": 27, "w": "dye", "f": 1, "m": "", "d": "1. n. 染料（1）", "e": "Here was the raw material of houses and furniture, ships and potash, <mark>dyes</mark> and naval stores."}, {"id": 2628, "u": 27, "w": "east", "f": 1, "m": "", "d": "1. adj. 东方的（1）", "e": "The Navy Department moved into the <mark>east</mark> wing in 1879, where elaborate wall and ceiling stenciling and marquetry floors decorated the office of the Secretary."}, {"id": 2629, "u": 27, "w": "ebb", "f": 1, "m": "", "d": "1. v. 衰退；减弱（1）", "e": "But radio&#x27;s enriching serendipity is <mark>ebbing</mark>."}, {"id": 2630, "u": 27, "w": "eclipse", "f": 1, "m": "ec-（向外）+lips-（离开、缺失）+e（拼写结尾）", "d": "1. v. 使黯然失色、取代（1）", "e": "(46) with the Church&#x27;s teachings and ways of thinking <mark>eclipsed</mark> by the Renaissance, the gap between the Medieval and modern periods had been bridged leading to new and unexplored intellectual territories."}, {"id": 2631, "u": 27, "w": "educated", "f": 1, "m": "educat（educate去e，教育、培养）+-ed（已经受到这种作用的）", "d": "1. adj. 基于知识的；有根据的（1）", "e": "The crude technique required <mark>educated</mark> guesses on exposure times, and involved heavy, awkward equipment-several men had to assist in its transportation."}, {"id": 2632, "u": 27, "w": "elect", "f": 1, "m": "e-（出）+lect（选择）", "d": "1. v. 选举（1）", "e": "<mark>Elected</mark> leaders must be allowed to help supporters deal with bureaucratic problems without fear of prosecution for bribery."}, {"id": 2633, "u": 27, "w": "electric", "f": 1, "m": "electr（电）+ic（与……有关的）", "d": "1. adj. 电的；电动的（1）", "e": "Even before the invention of the <mark>electric</mark> light bulb, the author produced a remarkable work of speculative fiction that would foreshadow many ethical questions to be raised by technologies yet to come."}, {"id": 2634, "u": 27, "w": "electronic", "f": 1, "m": "electr（电、电子）+-on（粒子名称结尾）+-ic（与……有关的）", "d": "1. adj. 电子的；电子设备的（1）", "e": "The advent of <mark>electronic</mark> publishing and authors&#x27; need to find outlets for their papers resulted in thousands of new journals."}, {"id": 2635, "u": 27, "w": "elegant", "f": 1, "m": "e-（出）+leg（选择）+-ant（形容词结尾）", "d": "1. adj. 优雅的（1）", "e": "[ B ] Completed in 1875, the State Department&#x27;s south wing was the first to be occupied, with its <mark>elegant</mark> four-story library (completed in 1876), Diplomatic Reception Room, and Secretary&#x27;s office decorated with carved wood, Oriental rugs, and stenciled wall patterns."}, {"id": 2636, "u": 27, "w": "embark", "f": 1, "m": "em-（进入）+bark（船）", "d": "1. v. 开始（1）", "e": "Although more than half of Harvard undergraduates end up in law, medicine or business, future doctors and lawyers must study a non-specialist liberal-arts degree before <mark>embarking</mark> on a professional qualification."}, {"id": 2637, "u": 27, "w": "emergency", "f": 1, "m": "emerge（显现，去掉末尾e）+-ency（情况、状态的名词词形）", "d": "1. n. 紧急情况；突发事件（1）", "e": "Particularly __7__ in busy locations or during times of <mark>emergency</mark>, the doors __8__ crowd management by reducing the obstacles put in people&#x27;s way."}, {"id": 2638, "u": 27, "w": "eminent", "f": 1, "m": "e-（出）+min（突出）+-ent（形容词后缀）", "d": "1. adj. 杰出的（1）", "e": "[ D ] The <mark>eminent</mark> pioneers in radio broadcasting."}, {"id": 2639, "u": 27, "w": "emperor", "f": 1, "m": "emper（命令、统治）+or（承担作用的人）", "d": "1. n. 皇帝（1）", "e": "It took place on many different planes: between Napoleon&#x27;s French army and the angry inhabitants; between the British, ever keen to exacerbate the <mark>emperor&#x27;s</mark> difficulties, and the marshals sent from Paris to try to keep them in check; between new forces of science and meritocracy and old ones of conservatism and birth."}, {"id": 2640, "u": 27, "w": "empirical", "f": 1, "m": "em-（在……中）+pir-（尝试、经验）+-ic（有关的）+-al（具有相应性质的）", "d": "1. adj. 实证的、基于经验观察的（1）", "e": "(49) The second, by Joshua Greenberg, takes a more <mark>empirical</mark> approach to universality, identifying traits (particularly in word order) shared by many languages, which are considered to represent biases that result from cognitive constraints."}, {"id": 2641, "u": 27, "w": "enclose", "f": 1, "m": "en-（使在里面）+clos（关闭、封闭）+e（拼写结尾）", "d": "1. v. 围住， 封闭（1）", "e": "The word &quot;caravanserai&quot; is a __3__ of the Persian words &quot;karvan&quot;, which means a group of travellers or a caravan, and &quot;saray&quot;, a palace or <mark>enclosed</mark> building."}, {"id": 2642, "u": 27, "w": "enclosure", "f": 1, "m": "en-（使）+clos（close去掉末尾e，关）+-ure（过程或相关物的名词后缀）", "d": "1. n. 圈养围栏、圈舍（1）", "e": "No matter how you &quot;enhance&quot; <mark>enclosures</mark>, they do not allow for freedom, a natural diet or adequate exercise."}, {"id": 2643, "u": 27, "w": "endanger", "f": 1, "m": "en-（使进入）+danger（危险）", "d": "1. v. 使受到威胁（1）", "e": "A hundred years on from Marconi and Reith, is the art of mere listening <mark>endangered</mark>?"}, {"id": 2644, "u": 27, "w": "endangered", "f": 1, "m": "endanger（使遭受危险）+-ed（受到这种作用的状态）", "d": "1. adj. 濒危的；有灭绝危险的（1）", "e": "[ D ] improve the wellbeing of <mark>endangered</mark> species"}, {"id": 2645, "u": 27, "w": "endorse", "f": 1, "m": "", "d": "1. v. 支持（1）", "e": "At the next election none of the big parties seem likely to <mark>endorse</mark> this sentiment."}, {"id": 2646, "u": 27, "w": "endurance", "f": 1, "m": "endure（忍受、持久）+-ance（状态或能力）", "d": "1. n. 耐力；持久力（1）", "e": "[ B ] Their <mark>endurance</mark> has done justice to them."}, {"id": 2647, "u": 27, "w": "enlarge", "f": 1, "m": "en-（使）+large（大的）", "d": "1. v. (使)扩大（1）", "e": "[ C ] unions have <mark>enlarged</mark> their public-sector membership."}, {"id": 2648, "u": 27, "w": "enterprise", "f": 1, "m": "enter-（在……之间）+pris（拿取）+e（词形结尾）", "d": "1. n. 事业；活动（1）", "e": "Since the days of Aristotle, a search for universal principles has characterized the scientific <mark>enterprise</mark>."}, {"id": 2649, "u": 27, "w": "entity", "f": 1, "m": "ent-（存在）+-ity（性质、状态或事物的名词后缀）", "d": "1. n. 实体；所指对象（1）", "e": "On the assumption that they will become relevant later, you make a mental note of discourse <mark>entities</mark> as well as possible links between them."}, {"id": 2650, "u": 27, "w": "envelope", "f": 1, "m": "en-（在内）+velop-（包裹）+e（词尾字母）", "d": "1. n. 信封（1）", "e": "Now think of your laptop, thinner than a brown-paper <mark>envelope</mark>, or your cellphone in the palm of your hand."}, {"id": 2651, "u": 27, "w": "envisage", "f": 1, "m": "en-（使进入）+vis（看）+age（词形结尾）", "d": "1. v. 设想（1）", "e": "The potential evolution of today&#x27;s technology, and its social consequences, is dazzlingly complicated, and it&#x27;s perhaps best left to science fiction writers and futurologists to explore the many possibilities we can <mark>envisage</mark>."}, {"id": 2652, "u": 27, "w": "envy", "f": 1, "m": "", "d": "1. n. 令人羡慕的对象（1）", "e": "By most recent measures, the UK&#x27;s GDP has been the <mark>envy</mark> of the Western world, with record low unemployment and high growth figures."}, {"id": 2653, "u": 27, "w": "epic", "f": 1, "m": "", "d": "1. adj. 史诗般的（1）", "e": "I first discovered the Napoleonic cryptographic battle a few years ago when I was reading Sir Charles Oman&#x27;s <mark>epic</mark> History of the Peninsular War."}, {"id": 2654, "u": 27, "w": "equation", "f": 1, "m": "equa（相等）+-tion（表示关系或结果的名词后缀）", "d": "1. n. 方程式（1）", "e": "(46) In physics, one approach takes this impulse for unification to its extreme, and seeks a theory of everything - a single generative <mark>equation</mark> for all we see."}, {"id": 2655, "u": 27, "w": "equator", "f": 1, "m": "equa（相等、平分）+-tor（起相应作用的事物）", "d": "1. n. 赤道（1）", "e": "The animals could benefit from more research: Currently, there are no published genomes from donkeys located south of the <mark>Equator</mark> in Africa."}, {"id": 2656, "u": 27, "w": "equivalent", "f": 1, "m": "equi（相等）+val（价值、效力）+-ent（具有这种性质的）", "d": "1. adj. 相等的（1）", "e": "In a society that so persistently celebrates procreation, is it any wonder that admitting you regret having children is <mark>equivalent</mark> to admitting you support kitten-killing?"}, {"id": 2657, "u": 27, "w": "eradicate", "f": 1, "m": "", "d": "1. v. 根除（1）", "e": "(41)______ Humanity has the necessary agro-technological tools to <mark>eradicate</mark> hunger, from genetically engineered crops to artificial fertilizers."}, {"id": 2658, "u": 27, "w": "erase", "f": 1, "m": "e-（除去）+ras（刮擦）+e（词形结尾）", "d": "1. v. 抹去；删除（1）", "e": "They could still invalidate Fourth Amendment protections when facing severe, urgent circumstances, and they could take reasonable measures to ensure that phone data are not <mark>erased</mark> or altered while waiting for a warrant."}, {"id": 2659, "u": 27, "w": "erect", "f": 1, "m": "e-（向外、向上）+rect（直、正、竖立）", "d": "1. v. 建造、竖立（1）", "e": "To the horror of some who expected a Greek Revival twin of the Treasury Building to be <mark>erected</mark> on the other side of the White House, the elaborate French Second Empire style design by Alfred Mullett was selected, and construction of a building to house all three departments began in June of 1871."}, {"id": 2660, "u": 27, "w": "erroneous", "f": 1, "m": "erron-（游走、偏离、犯错）+-eous（具有这种性质的）", "d": "1. adj. 错误的（1）", "e": "(46) Allen&#x27;s contribution was to take an assumption we all share - that because we are not robots we therefore control our thoughts - and reveal its <mark>erroneous</mark> nature."}, {"id": 2661, "u": 27, "w": "erupt", "f": 1, "m": "e-（向外）+rupt（破裂）", "d": "1. v. 爆发（1）", "e": "Protests have <mark>erupted</mark> over construction of the Thirty Meter Telescope (TMT), a giant observatory that promises to revolutionize humanity&#x27;s view of the cosmos."}, {"id": 2662, "u": 27, "w": "essence", "f": 1, "m": "ess（存在）+-ence（状态、内容的名词后缀）", "d": "1. n. 本质（1）", "e": "The Administration was in <mark>essence</mark> asserting that because it didn&#x27;t want to carry out Congress&#x27;s immigration wishes, no state should be allowed to do so either."}, {"id": 2663, "u": 27, "w": "established", "f": 1, "m": "establish（建立、确立）+ed（已经形成并保持的状态）", "d": "1. adj. 根基稳固的（1）", "e": "Later, more <mark>established</mark> companies raced to add such patents to their files, if only as a defensive move against rivals that might beat them to the punch."}, {"id": 2664, "u": 27, "w": "estate", "f": 1, "m": "", "d": "1. n. 房地产（1）", "e": "[ C ] strict management of real <mark>estate</mark> agents."}, {"id": 2665, "u": 27, "w": "ethic", "f": 1, "m": "", "d": "1. n. 伦理准则（1）", "e": "We have no land <mark>ethic</mark> yet, (47) but we have at least drawn nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or absence of economic advantage to us."}, {"id": 2666, "u": 27, "w": "ethnic", "f": 1, "m": "ethn（民族、族群）+-ic（与……有关的）", "d": "1. adj. 种族的；民族的（1）", "e": "[ C ] <mark>ethnic</mark>"}, {"id": 2667, "u": 27, "w": "eve", "f": 1, "m": "", "d": "1. n. 前夕（1）", "e": "We are even farther removed from the unfocused newspaper reviews published in England between the turn of the 20th century and the <mark>eve</mark> of World War II, at a time when newsprint was dirt-cheap and stylish arts criticism was considered an ornament to the publications in which it appeared."}, {"id": 2668, "u": 27, "w": "ex-editor", "f": 1, "m": "ex-（以前的）+editor（编辑；主编）", "d": "1. 短语 前任编辑（1）", "e": "As the hacking trial concludes - finding guilty one <mark>ex-editor</mark> of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge - the wider issue of dearth of integrity still stands."}, {"id": 2669, "u": 27, "w": "exceed", "f": 1, "m": "ex-（向外、越出）+ceed（走）", "d": "1. v. 超过（1）", "e": "It reported a net loss of $5.6 billion for fiscal 2016, the 10th straight year its expenses have <mark>exceeded</mark> revenue."}, {"id": 2670, "u": 27, "w": "excel", "f": 1, "m": "", "d": "1. v. 擅长；表现出色（1）", "e": "[ C ] <mark>excel</mark>"}, {"id": 2671, "u": 27, "w": "excellent", "f": 1, "m": "excell-（excel末尾l双写，超越）+-ent（形容词后缀）", "d": "1. adj. 极好的， 优秀的（1）", "e": "Take a broader look at our species&#x27; place in the universe, and it becomes clear that we have an <mark>excellent</mark> chance of surviving for tens, if not hundreds, of thousands of years."}, {"id": 2672, "u": 27, "w": "excitement", "f": 1, "m": "excite（刺激、使激动）+-ment（行为、状态的名词后缀）", "d": "1. n. 兴奋；激动（1）", "e": "Although good TV shows can help stir children&#x27;s interest in conservation, they cannot replace the <mark>excitement</mark> of a zoo visit as an intense, immersive and interactive experience."}, {"id": 2673, "u": 27, "w": "exclaim", "f": 1, "m": "ex-（向外）+claim（呼喊、说出）", "d": "1. v. 惊呼（1）", "e": "The tester would ask, &quot;What&#x27;s in here?&quot; before looking into the container, smiling, and <mark>exclaiming</mark>, &quot;Wow!&quot;"}, {"id": 2674, "u": 27, "w": "exhaust", "f"
