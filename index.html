 psychological conditions, until one day we find ourselves in a garden and feel the oppression vanish as if by magic."}, {"id": 1514, "u": 16, "w": "derive", "f": 3, "m": "de（从原处引出）+rive（河流）", "d": "1. v. 源于；来自（2）；2. v. 获得；获取（1）", "e": "The supposed importance of influentials <mark>derives</mark> from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else."}, {"id": 1515, "u": 16, "w": "description", "f": 3, "m": "de-（向下、写下）+script-（写）+-ion（行为、结果）", "d": "1. n. 描述；描写；叙述（3）", "e": "As a <mark>description</mark> of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise."}, {"id": 1516, "u": 16, "w": "desert", "f": 3, "m": "de-（离开）+sert（连接）", "d": "1. adj. 荒无人烟的（desert island：荒岛）（2）；2. n. 沙漠（1）", "e": "The Time to Act study also found that while control pupils relied on &quot;<mark>desert</mark> island clichés&quot; such as palm trees, target pupils were &quot;more expansive [giving] a broader picture of the sky, the sea and the atmospheric conditions&quot;."}, {"id": 1517, "u": 16, "w": "designer", "f": 3, "m": "design（设计）+er（从事者）", "d": "1. n. 设计师（3）", "e": "The victims of this revolution, of course, are not limited to <mark>designers</mark>."}, {"id": 1518, "u": 16, "w": "devoted", "f": 3, "m": "devote（献身；去e）+-ed（形容词后缀）", "d": "1. adj. 忠实的；热衷的（1）；2. adj. 忠诚的（1）；3. adj. 致力于；专心于（1）", "e": "<mark>Devoted</mark> concertgoers who reply that recordings are no substitute for live performance are missing the point."}, {"id": 1519, "u": 16, "w": "dignity", "f": 3, "m": "dign（值得尊重、有尊严的）+-ity（性质或状态的名词后缀）", "d": "1. n. 尊严（3）", "e": "One explanation might be the loss of <mark>dignity</mark> displayed through a cheesy grin."}, {"id": 1520, "u": 16, "w": "dilemma", "f": 3, "m": "di-（二）+lemma（前提、命题）", "d": "1. n. 两难困境（3）", "e": "[ B ] put most online businesses in a <mark>dilemma</mark>."}, {"id": 1521, "u": 16, "w": "dimension", "f": 3, "m": "di-（分开）+mens（测量）+-ion（结果）", "d": "1. n. 方面（3）", "e": "(45)______ Such <mark>dimensions</mark> of reading suggest - as others introduced later in the book will also do - that we bring an implicit (often unacknowledged) agenda to any act of reading."}, {"id": 1522, "u": 16, "w": "disagree", "f": 3, "m": "dis-（不、相反）+agree（同意、一致、相合）", "d": "1. v. 不同意；意见不一致（3）", "e": "In effect, the White House claimed that it could invalidate any otherwise legitimate state law that it <mark>disagrees</mark> with."}, {"id": 1523, "u": 16, "w": "distinction", "f": 3, "m": "distinct（清楚分开的、不同的）+ion（状态、特点或结果的名词后缀）", "d": "1. n. 区别；差异（2）；2. n. 卓越；出众（1）", "e": "But this <mark>distinction</mark> misses the point that it is processing and aggregation, not the mere possession of bits, that gives the data value."}, {"id": 1524, "u": 16, "w": "document", "f": 3, "m": "docu（教导；证明）+-ment（名词后缀）", "d": "1. n. 文件（3）", "e": "(47) It listed many <mark>documents</mark> in code that had been captured from the French army of Spain, and whose secrets had been revealed by the work of one George Scovell, an officer in British headquarters."}, {"id": 1525, "u": 16, "w": "dominant", "f": 3, "m": "domin（统治、支配）+-ant（形容词后缀）", "d": "1. adj. 占支配地位的；主要的（3）", "e": "[ B ] the world&#x27;s <mark>dominant</mark> power."}, {"id": 1526, "u": 16, "w": "dream", "f": 3, "m": "", "d": "1. n. 梦想；愿望（2）；2. v. 想出；构思（dream up）（1）", "e": "You are the lucky inheritor of a <mark>dream</mark> come true."}, {"id": 1527, "u": 16, "w": "edit", "f": 3, "m": "e-（向外）+dit（给予、传递）", "d": "1. v. 编辑；修改（文字、影像等）（3）", "e": "The purpose of <mark>editing</mark> the News of the World was not to promote reader understanding, to be fair in what was written or to betray any common humanity."}, {"id": 1528, "u": 16, "w": "educator", "f": 3, "m": "educate（去e，教育）+-or（从事者）", "d": "1. n. 教育工作者；教师（3）", "e": "In the United States, the desire to provide the public with a general, nontechnical education in science originated as far back as the late 1800s. (48) <mark>Educators</mark> advanced the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills."}, {"id": 1529, "u": 16, "w": "effectiveness", "f": 3, "m": "effective（有效的、能产生预期效果的）+ness（性质）", "d": "1. n. 有效性（3）", "e": "But on the general <mark>effectiveness</mark> of the social cure, Rosenberg is less persuasive."}, {"id": 1530, "u": 16, "w": "efficiency", "f": 3, "m": "effici（做成）+-ency（名词后缀；性质或状态）", "d": "1. n. 效率、效能（3）", "e": "The words that have mattered are <mark>efficiency</mark>, flexibility, shareholder value, business-friendly, wealth generation, sales, impact and, in newspapers, circulation."}, {"id": 1531, "u": 16, "w": "elaborate", "f": 3, "m": "e-（出）+labor（劳动、努力）+-ate（动词或形容词结尾）", "d": "1. adj. 精心制作的；复杂精致的（3）", "e": "[ C ] <mark>elaborate</mark> layout."}, {"id": 1532, "u": 16, "w": "electrical", "f": 3, "m": "electr（电）+-ical（与……有关的）", "d": "1. adj. 电的（3）", "e": "This __11__ makes sense if you simplify the workings of a complex brain, __12__ it to an array of <mark>electrical</mark> pulses; cells in plants also communicate through <mark>electrical</mark> signals."}, {"id": 1533, "u": 16, "w": "elite", "f": 3, "m": "", "d": "1. adj. 精英的（3）", "e": "In order to ensure that <mark>elite</mark> women have more such opportunities, they have proposed imposing government quotas."}, {"id": 1534, "u": 16, "w": "emphasis", "f": 3, "m": "em-（在其中）+pha-（显现）+-sis（行为或结果）", "d": "1. n. 强调；重视（3）", "e": "As the streamers&#x27; <mark>emphasis</mark> changed from subscriber growth to profitability, prices for the services went up and the number of new shows went down to 481 released in 2023, with the number expected to dip into the 300s within a few years."}, {"id": 1535, "u": 16, "w": "endure", "f": 3, "m": "en-（使）+dur（持续、坚持）+e（本词拼写结尾）", "d": "1. v. 忍受；经历（2）；2. v. 持续存在；存续（1）", "e": "Yes, more investment is needed, but passengers will not be willing to pay more indefinitely if they must also <mark>endure</mark> cramped, unreliable services, punctuated by regular chaos when timetables are changed, or planned maintenance is managed incompetently."}, {"id": 1536, "u": 16, "w": "energy-intensive", "f": 3, "m": "energy（能量、能源）+intensive（需要集中、大量投入的）", "d": "1. 短语 耗能密集的；高能耗的（3）", "e": "The crisis is here, they said, and we need to cut back on our <mark>energy-intensive</mark> modelling."}, {"id": 1537, "u": 16, "w": "enlighten", "f": 3, "m": "en-（使）+light（光）+-en（动词词尾）", "d": "1. v. 启发（3）", "e": "[ B ] <mark>enlightening</mark>"}, {"id": 1538, "u": 16, "w": "enrich", "f": 3, "m": "en-（使）+rich（丰富的）", "d": "1. v. 丰富；充实（3）", "e": "But radio&#x27;s <mark>enriching</mark> serendipity is ebbing."}, {"id": 1539, "u": 16, "w": "entertainment", "f": 3, "m": "entertain（招待、款待、使人欢乐）+-ment（活动或内容）", "d": "1. n. 娱乐（3）", "e": "Persuading studios to film here would become much more challenging if we couldn&#x27;t offer a deep bench of local film workers, on-screen talent and local businesses that support the <mark>entertainment</mark> industry."}, {"id": 1540, "u": 16, "w": "enthusiastic", "f": 3, "m": "enthusiast（热心者；热衷者）+-ic（有关的）", "d": "1. adj. 热情的、热衷的（3）", "e": "[ B ] <mark>enthusiastic</mark>."}, {"id": 1541, "u": 16, "w": "equality", "f": 3, "m": "equal（相等、处在同一水平的）+ity（表示性质、状态的名词后缀）", "d": "1. n. 平等；相等（3）", "e": "Progressives often support diversity mandates as a path to <mark>equality</mark> and a way to level the playing field."}, {"id": 1542, "u": 16, "w": "equipment", "f": 3, "m": "equip（装备、配备）+-ment（相关事物的名词后缀）", "d": "1. n. 设备；器材（3）", "e": "A number of companies, particularly in energy and transportation, use AI image processing technology to inspect infrastructure and prevent <mark>equipment</mark> failure or leaks before they happen."}, {"id": 1543, "u": 16, "w": "establishment", "f": 3, "m": "establish（建立、设立）+-ment（过程或结果的名词后缀）", "d": "1. n. 建立；设立；创立（3）", "e": "He agreed to join because he &quot;found the foresight behind the <mark>establishment</mark> of the SBoRE to be novel, unique and likely to have a lasting impact."}, {"id": 1544, "u": 16, "w": "esteem", "f": 3, "m": "", "d": "1. n. 自尊、自我评价（self-esteem）（2）；2. n. 尊重（1）", "e": "Mental health is the seed that contains self-<mark>esteem</mark> -confidence in ourselves and an ability to trust in our common sense."}, {"id": 1545, "u": 16, "w": "evaluation", "f": 3, "m": "evaluate（去掉末尾e，评价、评估）+-ion（行为或结果）", "d": "1. n. 评估；评价（3）", "e": "[ D ] <mark>evaluation</mark>"}, {"id": 1546, "u": 16, "w": "evident", "f": 3, "m": "e-（显出）+vid（看）+-ent（具有相应状态的）", "d": "1. adj. 明显的（3）", "e": "This tendency in the natural sciences has long been <mark>evident</mark> in the social sciences too."}, {"id": 1547, "u": 16, "w": "exact", "f": 3, "m": "ex-（向外、完全做出来）+act（做）", "d": "1. adj. 精确的；完全相同的（3）", "e": "&quot;It&#x27;s like baking a cake: If you don&#x27;t have <mark>exact</mark> amounts, it goes wrong,&quot; she says."}, {"id": 1548, "u": 16, "w": "exaggerate", "f": 3, "m": "ex-（加强）+ag-（向一处）+ger（携带、带来）+-ate（作出相应动作）", "d": "1. v. 夸大；夸张（3）", "e": "[ A ] She <mark>exaggerates</mark> the existing panic."}, {"id": 1549, "u": 16, "w": "explicit", "f": 3, "m": "ex-（向外）+plicit（折叠）", "d": "1. adj. 明确的， 清晰的（3）", "e": "Or should they have <mark>explicit</mark> permission?"}, {"id": 1550, "u": 16, "w": "extension", "f": 3, "m": "ex-（向外）+tens（伸展）+-ion（过程、结果）", "d": "1. n. 延长；延期（3）", "e": "In 2006, the state went a step further, requiring that any <mark>extension</mark> of the plant&#x27;s license be subject to the Vermont legislature&#x27;s approval."}, {"id": 1551, "u": 16, "w": "faith", "f": 3, "m": "", "d": "1. n. 信任、信心（3）", "e": "[ A ] <mark>faith</mark>"}, {"id": 1552, "u": 16, "w": "fare", "f": 3, "m": "", "d": "1. n. 票价、车费（3）", "e": "How can the train operators possibly justify yet another increase to rail passenger <mark>fares</mark>?"}, {"id": 1553, "u": 16, "w": "female", "f": 3, "m": "fem（女性、雌性）+ale（词形结尾）", "d": "1. adj. 女性、女性的（3）", "e": "Haddad and Lewis are concerned that more than half the state-government boards are less than 40 percent <mark>female</mark>."}, {"id": 1554, "u": 16, "w": "finance", "f": 3, "m": "fin（结束债务、结清款项）+-ance（相关活动的名词词尾）", "d": "1. v. 提供资金；资助（2）；2. n. 金融；财务；资金（1）", "e": "But Congress should look into doing so directly, by helping to <mark>finance</mark> PreCheck enrollment or to cut costs in other ways."}, {"id": 1555, "u": 16, "w": "firefighting", "f": 3, "m": "fire（火）+fighting（扑灭；对抗）", "d": "1. n. 灭火；消防（3）", "e": "What can be inferred about modern <mark>firefighting</mark>?"}, {"id": 1556, "u": 16, "w": "flag", "f": 3, "m": "", "d": "1. v. 标示、标记（2）；2. n. 警示信号（redflag）（1）", "e": "Manuscripts will be <mark>flagged</mark> up for additional scrutiny by the journal&#x27;s internal editors, or by its existing Board of Reviewing Editors or by outside peer reviewers."}, {"id": 1557, "u": 16, "w": "fluctuate", "f": 3, "m": "fluct（波动；波浪）+-uate（动词结尾）", "d": "1. v. 波动（3）", "e": "__11__ , because these connections are made through effort and practice, scientists believe that intelligence can expand and <mark>fluctuate</mark> __12__ mental effort."}, {"id": 1558, "u": 16, "w": "foam", "f": 3, "m": "", "d": "1. n. 泡沫；泡沫材料（3）", "e": "Unfortunately, the polyurethane <mark>foam</mark> he used is inherently unstable."}, {"id": 1559, "u": 16, "w": "folk", "f": 3, "m": "", "d": "1. n. 人们、民众（3）", "e": "Within the span of a hundred years, in the seventeenth and early eighteenth centuries, a tide of emigration - one of the great <mark>folk</mark> wanderings of history - swept from Europe to America."}, {"id": 1560, "u": 16, "w": "forecast", "f": 3, "m": "fore-（预先、在前）+cast（投出）", "d": "1. v. 预测，预报（未来的事情或趋势）（2）；2. n. 预测；预报（1）", "e": "[ A ] <mark>forecast</mark>"}, {"id": 1561, "u": 16, "w": "formidable", "f": 3, "m": "formid-（畏惧）+-able（足以引起这种感受的）", "d": "1. adj. 令人敬畏的（1）；2. adj. 令人望而生畏的（1）；3. adj. 强有力的（1）", "e": "Even Tommasini, who had advocated Gilbert&#x27;s appointment in the Times, calls him &quot;an unpretentious musician with no air of the <mark>formidable</mark> conductor about him.&quot;"}, {"id": 1562, "u": 16, "w": "foster", "f": 3, "m": "", "d": "1. v. 培养；促进（3）", "e": "Vocational schools should do a better job of <mark>fostering</mark> problem-solving skills and helping students work alongside robots."}, {"id": 1563, "u": 16, "w": "found", "f": 3, "m": "", "d": "1. v. （be foundedin）以…为依据（2）；2. v. 建立；创立（1）", "e": "It was with these great revelations that a new kind of philosophy <mark>founded</mark> in reason was born."}, {"id": 1564, "u": 16, "w": "founder", "f": 3, "m": "found（建立）+-er（人）", "d": "1. n. 创始人（3）", "e": "The <mark>founders</mark> deliberately focused their projects around light-hence the &quot;visual studies&quot; in the name."}, {"id": 1565, "u": 16, "w": "fragment", "f": 3, "m": "frag（破碎）+ment（留下的事物）", "d": "1. n. 碎片、片段（2）；2. v. 碎片化、分裂（1）", "e": "Most ground surveys involve a lot of walking, looking for surface clues such as small <mark>fragments</mark> of pottery."}, {"id": 1566, "u": 16, "w": "fresh", "f": 3, "m": "", "d": "1. adj. 淡的；无盐的（2）；2. adj. 刚刚的（fresh from）（1）", "e": "Humans overwhelmingly live in valleys, and on supplies of <mark>fresh</mark> water."}, {"id": 1567, "u": 16, "w": "genuine", "f": 3, "m": "gen（出生、血统、原本来源）+uine（形容词结尾）", "d": "1. adj. 真正的；真诚的（3）", "e": "But a <mark>genuine</mark> partnership must be a two-way street."}, {"id": 1568, "u": 16, "w": "globe", "f": 3, "m": "glob（球、球体）+e（拼写结尾）", "d": "1. n. 全球；世界（3）", "e": "The researchers examined 207 genomes from modern donkeys living in 31 countries across the <mark>globe</mark>."}, {"id": 1569, "u": 16, "w": "glory", "f": 3, "m": "", "d": "1. n. 荣耀；辉煌（3）", "e": "Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave <mark>glory</mark> to Greece and Rome and might yet bring honor to England."}, {"id": 1570, "u": 16, "w": "golden", "f": 3, "m": "gold（金）+-en（……制的；像……的）", "d": "1. adj. 黄金般的；鼎盛的（2）；2. adj. 身居多家董事会的精英女性的（golden skirt）（1）", "e": "We are living through a <mark>golden</mark> age of translation too, so you can go anywhere in time or place."}, {"id": 1571, "u": 16, "w": "governance", "f": 3, "m": "govern（治理、管理）+ance（行为、过程或方式）", "d": "1. n. 治理；管理（3）", "e": "Good <mark>governance</mark> rests on an understanding of the inherent worth of each individual."}, {"id": 1572, "u": 16, "w": "guideline", "f": 3, "m": "guide（引导）+line（线、路线）", "d": "1. n. 指导原则；准则（3）", "e": "Along with Singapore, other governments and mega-corporations are beginning to establish their own <mark>guidelines</mark>."}, {"id": 1573, "u": 16, "w": "headache", "f": 3, "m": "head（头）+ache（疼痛）", "d": "1. n. 棘手的麻烦（3）", "e": "Those retailers may face <mark>headaches</mark> complying with various state sales tax laws."}, {"id": 1574, "u": 16, "w": "healthcare", "f": 3, "m": "health（健康）+care（照料、护理）", "d": "1. n. 医疗保健（3）", "e": "The potential of this work applied to <mark>healthcare</mark> is very great, but it could also lead to further concentration of power in the tech giants."}, {"id": 1575, "u": 16, "w": "heat", "f": 3, "m": "", "d": "1. n. 热、高温（2）；2. adj. 激烈的（1）", "e": "Established in an old paper mill, it is powered by a nearby river and its remote <mark>heat</mark> warms the people who live in the surrounding town of Kajaani."}, {"id": 1576, "u": 16, "w": "hence", "f": 3, "m": "", "d": "1. adv. 因此；由此（2）；2. adv. 从现在起……以后（1）", "e": "<mark>Hence</mark> it is metaphysical; but the means of expression is purely and exclusively physical: sound."}, {"id": 1577, "u": 16, "w": "high-income", "f": 3, "m": "high（高）+income（收入）", "d": "1. adj. 高收入的（3）", "e": "In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and <mark>high-income</mark> employees to contract out of the unjustified dismissal regime."}, {"id": 1578, "u": 16, "w": "horizon", "f": 3, "m": "", "d": "1. n. 地平线（2）；2. n. 视野（1）", "e": "The same curiosity to find what lies beyond the <mark>horizon</mark> that first brought early Polynesians to Hawaii&#x27;s shores inspires astronomers today to explore the heavens."}, {"id": 1579, "u": 16, "w": "imagination", "f": 3, "m": "imagin-（imagine去e，想象）+-ation（名词后缀）", "d": "1. n. 想象；想象力（3）", "e": "[ D ] lack of <mark>imagination</mark>."}, {"id": 1580, "u": 16, "w": "imitation", "f": 3, "m": "imit（模仿、仿效）+-ation（行为或结果的名词后缀）", "d": "1. n. 模仿（3）", "e": "While hunter-gatherer children learnt from observation and <mark>imitation</mark> in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder."}, {"id": 1581, "u": 16, "w": "implement", "f": 3, "m": "im-（加强、完全）+ple-（填满、补足）+-ment（相关事物）", "d": "1. v. 实施；执行（3）", "e": "Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to <mark>implement</mark> them."}, {"id": 1582, "u": 16, "w": "implicit", "f": 3, "m": "im-（向内）+plicit（折叠）", "d": "1. adj. 隐含的；未明说的（3）", "e": "(50) It is this <mark>implicit</mark> or explicit reference to nature that fully justifies the use of the word garden, though in a &quot;liberated&quot; sense, to describe these synthetic constructions."}, {"id": 1583, "u": 16, "w": "imply", "f": 3, "m": "im-（向内）+ply（折入、折叠）", "d": "1. v. 暗示；意味着（3）", "e": "But they are the exception, not the norm that Ms. Marris <mark>implies</mark>."}, {"id": 1584, "u": 16, "w": "impression", "f": 3, "m": "impress（盖印、留下印象）+-ion（名词后缀）", "d": "1. n. 印象（2）；2. n. 语境不足：印象（干扰选项，与句子搭配不通）（1）", "e": "This is especially true in first <mark>impressions</mark>."}, {"id": 1585, "u": 16, "w": "impressive", "f": 3, "m": "impress（留下印象）+-ive（能产生这种作用的）", "d": "1. adj. 令人印象深刻的（3）", "e": "The tool, along with other popular image-generation AI models, allows anyone to create <mark>impressive</mark> images based on text prompts."}, {"id": 1586, "u": 16, "w": "independence", "f": 3, "m": "in-（不）+dependence（依赖状态）", "d": "1. n. 独立；自主（3）", "e": "The details may be unknowable, but the <mark>independence</mark> of standard-setters, essential to the proper functioning of capital markets, is being compromised."}, {"id": 1587, "u": 16, "w": "index", "f": 3, "m": "", "d": "1. n. 指数；指标（3）", "e": "Under the law, using a fashion model that does not meet a government-defined <mark>index</mark> of body mass could result in a $85,000 fine and six months in prison."}, {"id": 1588, "u": 16, "w": "inevitably", "f": 3, "m": "inevitab（inevitable去le，不可避免的）+-ly（副词后缀）", "d": "1. adv. 不可避免地（3）", "e": "Such background material <mark>inevitably</mark> reflects who we are."}, {"id": 1589, "u": 16, "w": "inference", "f": 3, "m": "infer（推论、推断）+ence（名词后缀）", "d": "1. n. 推断（3）", "e": "But they show comprehension to consist not just of passive assimilation but of active engagement in <mark>inference</mark> and problem-solving."}, {"id": 1590, "u": 16, "w": "inform", "f": 3, "m": "in-（向内、在里面）+form（形成、赋予形式）", "d": "1. v. 通知；告知（2）；2. v. 启发；为…提供信息（1）", "e": "The Students Union of your university has assigned you to <mark>inform</mark> the international students about an upcoming singing contest."}, {"id": 1591, "u": 16, "w": "inhabitant", "f": 3, "m": "in-（在里面）+habit（居住）+-ant（这样的人）", "d": "1. n. 居民（3）", "e": "They did not always prioritize the protection of Mauna Kea&#x27;s fragile ecosystems or its holiness to the island&#x27;s <mark>inhabitants</mark>."}, {"id": 1592, "u": 16, "w": "innocent", "f": 3, "m": "in-（不、没有）+noc（罪责、伤害）+-ent（处于这种状态的）", "d": "1. adj. 无罪的；无辜的（2）；2. adj. 无害的；无恶意的（1）", "e": "As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, <mark>innocent</mark> of the same charge - the wider issue of dearth of integrity still stands."}, {"id": 1593, "u": 16, "w": "inquiry", "f": 3, "m": "in-（向内）+quir（寻求）+-y（行为的名词结尾）", "d": "1. n. 探究；研究（2）；2. n. 询问；咨询（1）", "e": "Sadly, the spirit of <mark>inquiry</mark> once at home on campus has been replaced by the use of the humanities and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda."}, {"id": 1594, "u": 16, "w": "instinct", "f": 3, "m": "in-（在里面）+stinct（刺、戳）", "d": "1. n. 本能；直觉（3）", "e": "Mental health has commonly been called conscience, <mark>instinct</mark>, wisdom, common sense, or the inner voice."}, {"id": 1595, "u": 16, "w": "instruction", "f": 3, "m": "instruct（教授、指导、指示）+ion（过程、所给内容）", "d": "1. n. 教学；指导（2）；2. n. 指令（1）", "e": "It could make extra training and <mark>instruction</mark> affordable."}, {"id": 1596, "u": 16, "w": "insure", "f": 3, "m": "in-（使进入）+sure（安全、有保障）", "d": "1. v. 投保；承保（2）；2. v. 确保（1）", "e": "The principle of British welfare is no longer that you can <mark>insure</mark> yourself against the risk of unemployment and receive unconditional payments if the disaster happens."}, {"id": 1597, "u": 16, "w": "intelligent", "f": 3, "m": "intel-（在……之间）+lig（选择、辨别）+-ent（形容词后缀）", "d": "1. adj. 聪明的；有才智的（2）；2. adj. 智能的（指机器、系统等）（1）", "e": "We think of it simply as a healthy and helpful flow of <mark>intelligent</mark> thought."}, {"id": 1598, "u": 16, "w": "intense", "f": 3, "m": "in-（朝向、加强）+tens（拉伸、绷紧）+e（词形结尾）", "d": "1. adj. 强烈的、集中的（3）", "e": "Although good TV shows can help stir children&#x27;s interest in conservation, they cannot replace the excitement of a zoo visit as an <mark>intense</mark>, immersive and interactive experience."}, {"id": 1599, "u": 16, "w": "intention", "f": 3, "m": "in-（向着）+tent-（伸展）+-ion（行为、状态）", "d": "1. n. 意图；打算（3）", "e": "Time, rather than <mark>intention</mark>, has given them legitimacy."}, {"id": 1600, "u": 16, "w": "interact", "f": 3, "m": "inter-（在彼此之间、相互）+act（行动、起作用）", "d": "1. v. 交流、互动（2）；2. v. 互动；相互作用（1）", "e": "(48) Algorithms used to simulate human interactions are creating many of these concerns, especially as no-one is quite sure what the outcomes of using AI to <mark>interact</mark> with customers will be."}, {"id": 1601, "u": 17, "w": "internal", "f": 3, "m": "intern-（内部）+-al（形容词后缀）", "d": "1. adj. 内部的（3）", "e": "Manuscripts will be flagged up for additional scrutiny by the journal&#x27;s <mark>internal</mark> editors, or by its existing Board of Reviewing Editors or by outside peer reviewers."}, {"id": 1602, "u": 17, "w": "intrinsic", "f": 3, "m": "", "d": "1. adj. 内在的；固有的（3）", "e": "What <mark>intrinsic</mark> factors make the West a suitable home for these artifacts but preclude them from being preserved and displayed by their countries of origin?"}, {"id": 1603, "u": 17, "w": "introduction", "f": 3, "m": "intro-（向内）+duct（引导）+-ion（过程或相关内容的名词后缀）", "d": "1. n. 引入；推出（3）", "e": "This concept has served as a central goal for curriculum developers, local school boards, business and community leaders, and policymakers ever since its <mark>introduction</mark> nearly 80 years ago."}, {"id": 1604, "u": 17, "w": "involvement", "f": 3, "m": "involve（使卷入、涉及）+-ment（状态、行为）", "d": "1. n. 参与、介入（3）", "e": "What can be inferred about the EPA&#x27;s <mark>involvement</mark> in the Chesapeake Bay Program?"}, {"id": 1605, "u": 17, "w": "knock", "f": 3, "m": "", "d": "1. adj. 连带的、间接的（knock-on）（1）；2. v. 仿制（knockoff）（1）；3. v. 废除、取消（knock out）（1）", "e": "Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#x27; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;<mark>knock</mark>-on&quot; benefit to a child&#x27;s wellbeing."}, {"id": 1606, "u": 17, "w": "known", "f": 3, "m": "know（知道、认识）+-n（已经被……的）", "d": "1. adj. 知名的；被了解的（3）", "e": "Big-name PRH authors may suffer a bit, but it&#x27;s those mid-list authors, who normally rely on Waterstones staff&#x27;s passion for promoting books by lesser-<mark>known</mark> writers, who will be praying for an end to the dispute."}, {"id": 1607, "u": 17, "w": "latter", "f": 3, "m": "latt（后、晚）+er（比较级结尾）", "d": "1. adj. 后者；后面的（3）", "e": "This distinction is so much so that where the <mark>latter</mark> is lacking, as it is for these unlikely gardeners, the former becomes all the more urgent."}, {"id": 1608, "u": 17, "w": "launch", "f": 3, "m": "", "d": "1. v. 发起；推出；创办（3）", "e": "That&#x27;s one reason why we have <mark>launched</mark> Arc, a new publication dedicated to the near future."}, {"id": 1609, "u": 17, "w": "lawmaker", "f": 3, "m": "law（法律）+maker（制定者、创造者）", "d": "1. n. 立法者（3）", "e": "Its <mark>lawmakers</mark> gave preliminary approval last week to a law that would make it a crime to employ ultra-thin models on runways."}, {"id": 1610, "u": 17, "w": "lay", "f": 3, "m": "", "d": "1. adj. 非专业的、外行的（2）；2. v. 放置、铺设（1）", "e": "(46) There is a great deal of this kind of nonsense in the medical journals which, when taken up by broadcasters and the <mark>lay</mark> press, generates both health scares and short-lived dietary enthusiasms."}, {"id": 1611, "u": 17, "w": "leak", "f": 3, "m": "", "d": "1. v. 泄露（2）；2. n. 泄漏（1）", "e": "[ A ] <mark>leaking</mark> secrets intentionally."}, {"id": 1612, "u": 17, "w": "lean", "f": 3, "m": "", "d": "1. adj. 瘦的、低脂肪的（2）；2. v. 依靠、依赖（lean on）（1）", "e": "__16__ there are steps you can __17__ to help reduce abdominal fat and maintain <mark>lean</mark> muscle mass as you age in order to protect both your physical and mental __18__ ."}, {"id": 1613, "u": 17, "w": "legally", "f": 3, "m": "legal（法律的、合法的）+ly（副词后缀）", "d": "1. adv. 在法律上；合法地（3）", "e": "The court&#x27;s ruling is <mark>legally</mark> sound in defining a kind of favoritism that is not criminal."}, {"id": 1614, "u": 17, "w": "limitation", "f": 3, "m": "limit（限制、界限）+-ation（行为或状态的名词后缀）", "d": "1. n. 限制、局限（3）", "e": "(50) The upside is the possibilities contained in knowing that everything is up to us; where before we were experts in the array of <mark>limitations</mark>, now we become authorities of what is possible."}, {"id": 1615, "u": 17, "w": "literally", "f": 3, "m": "liter（文字）+-al（与……有关的）+-ly（副词后缀）", "d": "1. adv. 按字面意思；确实地（3）", "e": "[ D ] <mark>literally</mark>"}, {"id": 1616, "u": 17, "w": "long-standing", "f": 3, "m": "long（长时间地）+standing（保持存在的）", "d": "1. 短语 存在已久的；长期以来的（3）", "e": "The Church&#x27;s <mark>long-standing</mark> dogma was losing the great battle for truth to rationalists and scientists."}, {"id": 1617, "u": 17, "w": "low-wage", "f": 3, "m": "low（低）+wage（工资、报酬）", "d": "1. adj. 低工资的（3）", "e": "For H&amp;M to offer a $5.95 knit miniskirt in all its 2,300-plus stores around the world, it must rely on <mark>low-wage</mark> overseas labor, order in volumes that strain natural resources, and use massive amounts of harmful chemicals."}, {"id": 1618, "u": 17, "w": "luxury", "f": 3, "m": "", "d": "1. n. 奢侈品；奢华享受（2）；2. n. 难得的便利；优越条件（1）", "e": "[ B ] Make Your Print Newspaper a <mark>Luxury</mark> Good"}, {"id": 1619, "u": 17, "w": "maker", "f": 3, "m": "make（制造，去词尾-e）+-er（从事者或事物）", "d": "1. n. 制定者；决策者（2）；2. n. 制造者；制作商（1）", "e": "How can we inform decision <mark>makers</mark> about the best ways to bring down carbon emissions if we can&#x27;t track the amount of carbon dioxide in the atmosphere, where it&#x27;s coming from and who&#x27;s producing it?"}, {"id": 1620, "u": 17, "w": "manner", "f": 3, "m": "", "d": "1. n. 方式（2）；2. n. 举止；态度（1）", "e": "[ A ] Writing in an imaginative <mark>manner</mark>."}, {"id": 1621, "u": 17, "w": "mass-market", "f": 3, "m": "mass（大量、众多）+market（市场）", "d": "1. 短语 面向大众市场的（3）", "e": "In the last decade or so, advances in technology have allowed <mark>mass-market</mark> labels such as Zara, H&amp;M, and Uniqlo to react to trends more quickly and anticipate demand more precisely."}, {"id": 1622, "u": 17, "w": "meantime", "f": 3, "m": "mean（中间）+time（时间）", "d": "1. adv. 与此同时（3）", "e": "In the <mark>meantime</mark>, PRH authors have been the losers."}, {"id": 1623, "u": 17, "w": "mention", "f": 3, "m": "", "d": "1. v. 提到；提及（2）；2. v. 更不用说（notto mention）（1）", "e": "Mary Shelley&#x27;s novel Frankenstein is <mark>mentioned</mark> because it____"}, {"id": 1624, "u": 17, "w": "merchant", "f": 3, "m": "merch（商品、贸易）+-ant（人）", "d": "1. n. 商人（2）；2. adj. 商业的（1）", "e": "__16__ , it was frequently the first stop for <mark>merchants</mark> looking to sell their wares and __17__ supplies for their own journeys."}, {"id": 1625, "u": 17, "w": "metric", "f": 3, "m": "metr（meter去掉r前的e，测量）+ic（与……有关的）", "d": "1. n. 衡量指标（3）", "e": "Unfortunately, the long-term costs of using simple quantitative <mark>metrics</mark> to assess researcher merit are likely to be quite great."}, {"id": 1626, "u": 17, "w": "middle-class", "f": 3, "m": "middle（中间）+class（阶层）", "d": "1. 短语 中产阶级（的）（3）", "e": "But in the medium term, <mark>middle-class</mark> workers may need a lot of help adjusting."}, {"id": 1627, "u": 17, "w": "minimize", "f": 3, "m": "minim-（最小，minimum的词干）+-ize（使……）", "d": "1. v. 尽量减少；使最小化（3）", "e": "The TMT site was chosen to <mark>minimize</mark> the telescope&#x27;s visibility around the island and to avoid archaeological and environmental impact."}, {"id": 1628, "u": 17, "w": "minute", "f": 3, "m": "minut-（微小、变小）+e（拼写结尾）", "d": "1. n. 分钟（3）", "e": "The target group was given a 30-<mark>minute</mark> drama-based activity to accompany the passage."}, {"id": 1629, "u": 17, "w": "misinterpret", "f": 3, "m": "mis-（错误地）+interpret（解释）", "d": "1. v. 误解；错误解释（3）", "e": "[ C ] <mark>misinterpreted</mark> the role of GDP."}, {"id": 1630, "u": 17, "w": "mix", "f": 3, "m": "", "d": "1. v. 混合；混合物；组合（3）", "e": "The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the interaction of fresh and saline waters, and the <mark>mix</mark> of land and water."}, {"id": 1631, "u": 17, "w": "mock", "f": 3, "m": "", "d": "1. v. 嘲笑；嘲弄（3）", "e": "A cartoon <mark>mocks</mark> a group failing to converse because they&#x27;re all in headphones."}, {"id": 1632, "u": 17, "w": "mode", "f": 3, "m": "mod（方式、模式）+e（词形结尾）", "d": "1. n. 方式；模式（3）", "e": "First, most people do not realise that there are strong commercial agendas at work to keep them in passive consumption <mark>mode</mark>."}, {"id": 1633, "u": 17, "w": "monetary", "f": 3, "m": "monet（货币、钱）+-ary（与……有关的）", "d": "1. adj. 金钱的、货币的（3）", "e": "The <mark>monetary</mark> value of the objects on display is a distant second place in importance."}, {"id": 1634, "u": 17, "w": "motivate", "f": 3, "m": "motive（动机，去掉末尾e）+-ate（使产生、使行动）", "d": "1. v. 激励；驱使（3）", "e": "What <mark>motivated</mark> him, we were to understand, was his zeal for &quot;fundamental fairness&quot; - protecting the taxpayer, controlling spending and ensuring that only the most deserving claimants received their benefits."}, {"id": 1635, "u": 17, "w": "mystery", "f": 3, "m": "myst（秘密、神秘）+ery（名词结尾）", "d": "1. n. 谜；神秘的事物（3）", "e": "How the whole image is then assembled and perceived is still a <mark>mystery</mark> although it is the subject of current research."}, {"id": 1636, "u": 17, "w": "narrow", "f": 3, "m": "", "d": "1. adj. 狭窄的；范围小的（2）；2. v. 缩小（范围、差距）（1）", "e": "But understanding where the animals were first domesticated could guide archaeologists to a <mark>narrow</mark> region to search for insights about the original tamed donkeys."}, {"id": 1637, "u": 17, "w": "navigate", "f": 3, "m": "nav-（船）+ig-（驱动、引导）+ate（进行相应动作）", "d": "1. v. 找到方向；行进；穿行（2）；2. v. 应对；设法处理（1）", "e": "Prehistoric humans may have tamed donkeys to help <mark>navigate</mark> the expanding Sahara."}, {"id": 1638, "u": 17, "w": "necessarily", "f": 3, "m": "necessari-（necessary的y变i，必要的、不可避免的）+-ly（在这种情况下）", "d": "1. adv. 必然；一定（3）", "e": "The problem is not <mark>necessarily</mark> the amount of available funding."}, {"id": 1639, "u": 17, "w": "neighbor", "f": 3, "m": "", "d": "1. n. 邻居（2）；2. adj. 邻近的（1）", "e": "It is too easy, and misleading, to see such court rulings as merely standing up for the rights of land owners when the consequences can be so dire for their <mark>neighbors</mark>."}, {"id": 1640, "u": 17, "w": "non-profit", "f": 3, "m": "non-（不、非）+profit（利润、收益）", "d": "1. 短语 非营利的（3）", "e": "Board members like her &quot;casually dismiss the career work of scholars and scientists as just another misguided opinion,&quot; says Dan Quinn, senior communications strategist at the Texas Freedom Network, a <mark>non-profit</mark> group that monitors public education."}, {"id": 1641, "u": 17, "w": "nonetheless", "f": 3, "m": "none（丝毫不）+the（因此）+less（更少）", "d": "1. adv. 尽管如此、仍然（3）", "e": "<mark>Nonetheless</mark>, unification of sorts remains a major goal."}, {"id": 1642, "u": 17, "w": "notice", "f": 3, "m": "", "d": "1. v. 注意到；察觉（2）；2. n. 解雇通知（1）", "e": "As many people hit middle age, they often start to <mark>notice</mark> that their memory and mental clarity are not what they used to be."}, {"id": 1643, "u": 17, "w": "novelty", "f": 3, "m": "novel（新奇的、新颖的）+ty（性质或相应事物的名词后缀）", "d": "1. n. 新奇；新颖性（3）", "e": "Second, <mark>novelty</mark> itself frequently provokes disbelief."}, {"id": 1644, "u": 17, "w": "nursery", "f": 3, "m": "nurs（nurse去e，照料、养育）+-ery（进行这种活动的场所）", "d": "1. n. 托儿所（3）", "e": "In Germany, one scheme has paired an old people&#x27;s home with a <mark>nursery</mark>."}, {"id": 1645, "u": 17, "w": "oblige", "f": 3, "m": "ob-（向）+lig（绑）+e（词形结尾）", "d": "1. v. 迫使、要求（2）；2. v. 配合、照办（1）", "e": "Getting a DNT signal does not <mark>oblige</mark> anyone to stop tracking, although some companies have promised to do so."}, {"id": 1646, "u": 17, "w": "observation", "f": 3, "m": "observe（观察，去e）+-ation（行为；结果）", "d": "1. n. 观察；观察所得（3）", "e": "While hunter-gatherer children learnt from <mark>observation</mark> and imitation in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder."}, {"id": 1647, "u": 17, "w": "occasion", "f": 3, "m": "oc-（朝向）+cas（落下、降临）+-ion（事情、时点）", "d": "1. n. 一次；某次（1）；2. n. （on occasion）有时；偶尔（1）；3. n. 场合；时刻（1）", "e": "When finding their way to waterholes, they headed off in exactly the right direction, on one <mark>occasion</mark> from a distance of roughly thirty miles."}, {"id": 1648, "u": 17, "w": "odd", "f": 3, "m": "", "d": "1. adj. 奇怪的、反常的（3）", "e": "Which of the following is shown to be <mark>odd</mark>, according to Paragraph 4?"}, {"id": 1649, "u": 17, "w": "odds", "f": 3, "m": "odd（不相等）+s（词形结尾）", "d": "1. n. 不一致、冲突（at odds with）（3）", "e": "This narrowing of the regulatory scope was a victory for builders, mining operators and other commercial interests often at <mark>odds</mark> with environmental rules."}, {"id": 1650, "u": 17, "w": "open-source", "f": 3, "m": "open（开放的）+source（源代码）", "d": "1. 短语 开放源代码的；开源的（3）", "e": "His distinctive style is now one of the most commonly used prompts in the new <mark>open-source</mark> AI art generator Stable Diffusion."}, {"id": 1651, "u": 17, "w": "opposition", "f": 3, "m": "op-（相对、对着）+posit-（放置）+-ion（行为、状态或相关的一方）", "d": "1. n. 反对；抵制（3）", "e": "<mark>Opposition</mark> to telescopes on Mauna Kea is nothing new."}, {"id": 1652, "u": 17, "w": "orchestra", "f": 3, "m": "", "d": "1. n. 管弦乐队（3）", "e": "Merely expanding the <mark>orchestra&#x27;s</mark> repertoire will not be enough."}, {"id": 1653, "u": 17, "w": "organize", "f": 3, "m": "organ（按分工配合的功能部分）+-ize（使形成这种状态）", "d": "1. v. 组织，安排（活动、会议等）（2）；2. v. 整理；编排（1）", "e": "&quot;This is <mark>organized</mark> crime.&quot;"}, {"id": 1654, "u": 17, "w": "originate", "f": 3, "m": "origin（起源、开始）+-ate（发生或使之发生的动词后缀）", "d": "1. v. 起源、源于（2）；2. v. 首创、提出（1）", "e": "In the United States, the desire to provide the public with a general, nontechnical education in science <mark>originated</mark> as far back as the late 1800s. (48) Educators advanced the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills."}, {"id": 1655, "u": 17, "w": "pain", "f": 3, "m": "", "d": "1. n. 疼痛、痛苦（2）；2. n. 煞费苦心、努力（at pains to）（1）", "e": "(48) Mental health allows us to view others with sympathy if they are having troubles, with kindness if they are in <mark>pain</mark>, and with unconditional love no matter who they are."}, {"id": 1656, "u": 17, "w": "paradox", "f": 3, "m": "para-（偏离通常方向、似乎相反）+dox（观点、看法）", "d": "1. n. 悖论；矛盾现象（3）", "e": "Two <mark>paradoxes</mark> exist throughout this credibility process."}, {"id": 1657, "u": 17, "w": "participate", "f": 3, "m": "part（部分）+i（连接字母）+cip（拿、取）+-ate（动词后缀）", "d": "1. v. 参与，参加（3）", "e": "Neither one of them actually <mark>participated</mark> in any contributions to animal research or conservation."}, {"id": 1658, "u": 17, "w": "passage", "f": 3, "m": "pass（通过、经过）+-age（过程、空间或片段的名词结尾）", "d": "1. n. 乐段（1）；2. n. （文章的）段落（1）；3. n. （法案的）通过（1）", "e": "(48) Beethoven&#x27;s habit of increasing the volume with an extreme intensity and then abruptly following it with a sudden soft <mark>passage</mark> was only rarely used by composers before him."}, {"id": 1659, "u": 17, "w": "peer-reviewed", "f": 3, "m": "peer（同行）+review（评审）+-ed（已经受到……的）", "d": "1. 短语 经同行评审的（3）", "e": "They do not fund <mark>peer-reviewed</mark> research."}, {"id": 1660, "u": 17, "w": "perfect", "f": 3, "m": "per-（完全）+fect（做、做成）", "d": "1. adj. 完全的（make perfect sense：完全说得通）（1）；2. adj. 完美的（1）；3. v. 使完善（1）", "e": "It would be absurd to try to track the changing price of sports cars since 1695, but to ask the same question of nails makes <mark>perfect</mark> sense."}, {"id": 1661, "u": 17, "w": "personality", "f": 3, "m": "personal（个人的）+ity（性质、特质的名词后缀）", "d": "1. n. 个性；性格（3）", "e": "In people who score high in a test of neuroticism, a <mark>personality</mark> dimension associated with self-consciousness and anxiety, eye contact triggered more activity associated with avoidance, according to the Finnish researcher Jari Hietanen and colleagues."}, {"id": 1662, "u": 17, "w": "pirate", "f": 3, "m": "pir（尝试、冒险）+-ate（名词结尾）", "d": "1. n. 盗版者（3）", "e": "In 2017 the association formed the Alliance for Creativity and Entertainment (ACE), an enforcement task force of about 100 detectives circling the globe to help local authorities arrest streaming <mark>pirates</mark>."}, {"id": 1663, "u": 17, "w": "plate", "f": 3, "m": "plat（平的、平坦）+e（词形结尾）", "d": "1. n. 摄影底片、金属版（3）", "e": "During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper <mark>plate</mark>) could take several minutes to complete, resulting in blurred images as sitters shifted position or adjusted their limbs."}, {"id": 1664, "u": 17, "w": "plenty", "f": 3, "m": "plen（充满、数量多）+ty（数量、状态的名词词形）", "d": "1. n. 大量、充足（3）", "e": "Nostalgia for ink on paper and the rustle of pages aside, there&#x27;s <mark>plenty</mark> of incentive to ditch print."}, {"id": 1665, "u": 17, "w": "plus", "f": 3, "m": "", "d": "1. prep. 另外；加上（2）；2. adv. 多；以上（1）", "e": "<mark>Plus</mark>, whatever image we present is magnified by social-media services like LinkedIn."}, {"id": 1666, "u": 17, "w": "poem", "f": 3, "m": "poe（创造、写诗）+m（做出来的）", "d": "1. n. 诗（3）", "e": "[ A ] And just read a single <mark>poem</mark>."}, {"id": 1667, "u": 17, "w": "poet", "f": 3, "m": "", "d": "1. n. 诗人（3）", "e": "As science and technology progressed, and divided into more sub-disciplines, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and <mark>poets</mark>, and vice versa."}, {"id": 1668, "u": 17, "w": "pop", "f": 3, "m": "", "d": "1. adj. 小本家庭经营的（mom-and-pop）（2）；2. adj. 弹出的（pop-up）（1）", "e": "&quot;The people who are stealing our movies and our television shows and operating piracy sites are not mom and <mark>pop</mark> operations,&quot; says Charlie Rivkin, chief executive officer of the MPA."}, {"id": 1669, "u": 17, "w": "portrait", "f": 3, "m": "por-（呈现在前面）+trait（画、描绘）", "d": "1. n. 肖像（3）", "e": "What does the author say about the Victorian <mark>portraits</mark> he has collected?"}, {"id": 1670, "u": 17, "w": "potentially", "f": 3, "m": "potential（潜在的）+-ly（副词后缀）", "d": "1. adv. 可能地；潜在地（3）", "e": "The shallows provide homes for hundreds of species while storing floodwaters, filtering pollutants from water, and protecting nearby communities from <mark>potentially</mark> destructive storm surges."}, {"id": 1671, "u": 17, "w": "practical", "f": 3, "m": "pract（实践、做）+-ical（与……有关的）", "d": "1. adj. 实际的；实用的（3）", "e": "That is a necessary and <mark>practical</mark> approach."}, {"id": 1672, "u": 17, "w": "predatory", "f": 3, "m": "predat-（捕获、掠夺）+-ory（具有这种性质的）", "d": "1. adj. 掠夺性的、牟利的（2）；2. adj. 捕食性的（1）", "e": "The birth of <mark>predatory</mark> journals wasn&#x27;t far behind."}, {"id": 1673, "u": 17, "w": "premise", "f": 3, "m": "pre-（预先、在前）+mise（放置）", "d": "1. n. 前提（3）", "e": "The <mark>premise</mark> was that the common law of contract lacked sufficient safeguards for workers against arbitrary conduct by management."}, {"id": 1674, "u": 17, "w": "preparation", "f": 3, "m": "prepare（去掉末尾e，准备）+-ation（行为或过程）", "d": "1. n. 准备；预备（3）", "e": "Also, I&#x27;d like to help with your <mark>preparation</mark> work."}, {"id": 1675, "u": 17, "w": "prestige", "f": 3, "m": "", "d": "1. n. 声望、威望（3）", "e": "You cannot buy class, as the old saying goes, and these upstart entrepreneurs cannot buy their prizes the <mark>prestige</mark> of the Nobels."}, {"id": 1676, "u": 17, "w": "previously", "f": 3, "m": "previous（先前的）+-ly（在这个时候）", "d": "1. adv. 以前，先前（指过去某个时间）（3）", "e": "The randomised control trial involved hundreds of year 5 pupils aged nine and ten-at 45 state primary schools that had not been &quot;<mark>previously</mark> exposed to RSC pedagogy&quot;."}, {"id": 1677, "u": 17, "w": "priority", "f": 3, "m": "prior（在前的、较先的）+-ity（性质、地位，也可指具有这种地位的事）", "d": "1. n. 优先事项、优先权（3）", "e": "The White House argued that Arizona&#x27;s laws conflicted with its enforcement <mark>priorities</mark>, even if state laws complied with federal statutes to the letter."}, {"id": 1678, "u": 17, "w": "problem-solving", "f": 3, "m": "problem（问题）+solv（solve去e，解决）+-ing（这项活动或具有这种作用的）", "d": "1. n. 解决问题（的）（3）", "e": "But they show comprehension to consist not just of passive assimilation but of active engagement in inference and <mark>problem-solving</mark>."}, {"id": 1679, "u": 17, "w": "profound", "f": 3, "m": "pro-（深入）+found（底层、基础）", "d": "1. adj. 深刻的；深远的；重大的（3）", "e": "[ C ] <mark>profound</mark>."}, {"id": 1680, "u": 17, "w": "proof", "f": 3, "m": "", "d": "1. n. 证据；证明（3）", "e": "But under anti-bribery laws, <mark>proof</mark> must be made of concrete benefits, such as approval of a contract or regulation."}, {"id": 1681, "u": 17, "w": "protest", "f": 3, "m": "pro-（向前、公开）+test（作证、证明）", "d": "1. n. 抗议；反对行动（3）", "e": "This has resulted in <mark>protests</mark> from social scientists."}, {"id": 1682, "u": 17, "w": "provoke", "f": 3, "m": "pro-（向前、向外）+vok（呼喊、召唤）+e（拼写结尾）", "d": "1. v. 引起,激起（3）", "e": "Second, novelty itself frequently <mark>provokes</mark> disbelief."}, {"id": 1683, "u": 17, "w": "public-health", "f": 3, "m": "public（公众的）+health（健康）", "d": "1. n. 公共卫生（的）（3）", "e": "Rosenberg argues convincingly that <mark>public-health</mark> advocates ought to take a page from advertisers, so skilled at applying peer pressure."}, {"id": 1684, "u": 17, "w": "pull", "f": 3, "m": "", "d": "1. v. 成功完成（pulloff）（1）；2. v. 拉；牵引（1）；3. v. 撤离（pull out）（1）", "e": "And what&#x27;s the best way to <mark>pull</mark> off one that enhances our goals?"}, {"id": 1685, "u": 17, "w": "punish", "f": 3, "m": "pun（惩罚）+ish（本词的动词结尾）", "d": "1. v. 惩罚（3）", "e": "Offering up such a theory during a time of high tension between scientific and religious minds was branded as heresy and any such heretics that continued to spread these lies were to be <mark>punished</mark> by imprisonment or even death."}, {"id": 1686, "u": 17, "w": "punishment", "f": 3, "m": "punish（惩罚）+-ment（行为或结果）", "d": "1. n. 惩罚；处罚（3）", "e": "The French measures, however, rely too much on severe <mark>punishment</mark> to change a culture that still regards beauty as skin-deep - and bone-showing."}, {"id": 1687, "u": 17, "w": "pursuit", "f": 3, "m": "pur-（向前、持续）+suit（跟随）", "d": "1. n. 追求；寻求（3）", "e": "[ D ] It is in <mark>pursuit</mark> of quality service."}, {"id": 1688, "u": 17, "w": "puzzle", "f": 3, "m": "", "d": "1. adj. 困惑的；感到不解的（3）", "e": "[ B ] <mark>Puzzled</mark>."}, {"id": 1689, "u": 17, "w": "pyramid", "f": 3, "m": "", "d": "1. n. 金字塔形结构（2）；2. n. 金字塔(结构)（1）", "e": "Even after the advent of widespread social media, a <mark>pyramid</mark> of production remains, with a small number of people uploading material, a slightly larger group commenting on or modifying that content, and a huge percentage remaining content to just consume."}, {"id": 1690, "u": 17, "w": "qualification", "f": 3, "m": "qual（什么样的、品质）+-ification（确认性质或条件的过程、结果）", "d": "1. n. 资格；条件（3）", "e": "The notice should include the basic <mark>qualifications</mark> for applicants and the other information which you think is relevant."}, {"id": 1691, "u": 17, "w": "qualified", "f": 3, "m": "qualify（y变i，使具备资格、达到要求）+ed（已经形成的状态）", "d": "1. adj. 合格的；有资格的（3）", "e": "Writing in The New Republic, Alice Lee notes that increasing the number of opportunities for board membership without increasing the pool of <mark>qualified</mark> women to serve on such boards has led to a &quot;golden skirt&quot; phenomenon, where the same elite women scoop up multiple seats on a variety of boards."}, {"id": 1692, "u": 17, "w": "race", "f": 3, "m": "", "d": "1. n. 竞赛、竞争（2）；2. v. 争先恐后地做、竞相（1）", "e": "This form of accessible science means that great minds are able to join the <mark>race</mark> to create and develop projects with the potential to change the world."}, {"id": 1693, "u": 17, "w": "radar", "f": 3, "m": "ra（radio，无线电）+d（detection，探测）+a（and，和）+r（ranging，测距）", "d": "1. n. 雷达（3）", "e": "Battles increasingly depended on new military technologies such as <mark>radar</mark> and the proximity fuze."}, {"id": 1694, "u": 17, "w": "recipient", "f": 3, "m": "re-（接到自己这一边）+cip（取）+-ient（相应的人、物或状态）", "d": "1. n. 接受者；获奖者（3）", "e": "Rosenberg, the <mark>recipient</mark> of a Pulitzer Prize, offers a host of examples of the social cure in action: In South Carolina, a state-sponsored antismoking program called Rage Against the Haze sets out to make cigarettes uncool."}, {"id": 1695, "u": 17, "w": "reinforce", "f": 3, "m": "re-（再、进一步）+in-（进入）+force（力量）", "d": "1. v. 加强（3）", "e": "But the ruling <mark>reinforces</mark> the need for citizens and their elected representatives, not the courts, to ensure equality of access to government."}, {"id": 1696, "u": 17, "w": "related", "f": 3, "m": "relat（relate去e，使互相关联）+-ed（处于已经形成的关系中的）", "d": "1. adj. 相关的；有关联的（3）", "e": "Some experts __17__ the stress-reducing, health-<mark>related</mark> benefits of hugging to the release of oxytocin, often called &quot;the bonding hormone&quot; __18__ it promotes attachment in relationships, including that between mothers and their newborn babies."}, {"id": 1697, "u": 17, "w": "resemble", "f": 3, "m": "re-（再）+sem（相似、一样）+ble（保留本词词形结尾）", "d": "1. v. 像、与……相似（3）", "e": "But the result was a new social pattern which, although it <mark>resembled</mark> European society in many ways, had a character that was distinctly American."}, {"id": 1698, "u": 17, "w": "resident", "f": 3, "m": "resid-（reside去e，居住）+-ent（处在这种状态的人或性质）", "d": "1. n. 居民（3）", "e": "The <mark>residents</mark> help to look after the children, an arrangement akin to alloparenting."}, {"id": 1699, "u": 17, "w": "resist", "f": 3, "m": "re-（反向、对抗）+sist（站立、维持）", "d": "1. v. 抵抗；反对（3）", "e": "Pat Hardy, who sympathises with the views of the energy sector, is <mark>resisting</mark> proposed changes to science standards for pre-teen pupils."}, {"id": 1700, "u": 17, "w": "resistance", "f": 3, "m": "resist（抵抗）+-ance（行为、能力或作用的名词后缀）", "d": "1. n. 抵制；反对（2）；2. n. 阻力；抗力（1）", "e": "[ B ] tough <mark>resistance</mark>."}, {"id": 1701, "u": 18, "w": "resistant", "f": 3, "m": "resist（抵抗）+-ant（具有这种性质的）", "d": "1. adj. 抵制的；有抵抗力的（3）", "e": "If people in the network just two degrees removed from the initial influential prove <mark>resistant</mark>, for example, the cascade of change won&#x27;t propagate very far or affect many people."}, {"id": 1702, "u": 18, "w": "responsible", "f": 3, "m": "respons（respond的词干形式，回应、作答）+-ible（应能承担的）", "d": "1. adj. 导致…的；造成…的（1）；2. adj. 负责任的；可靠的（1）；3. adj. 负责的；负有责任的（1）", "e": "[ C ] may be <mark>responsible</mark> for fiercer competition."}, {"id": 1703, "u": 18, "w": "restrict", "f": 3, "m": "re-（再）+strict（拉紧、约束）", "d": "1. v. 限制；约束（3）", "e": "The state Legislature recently voted against a bill that would&#x27;ve made it illegal for towns to create legislation <mark>restricting</mark> short-term rentals."}, {"id": 1704, "u": 18, "w": "resume", "f": 3, "m": "re-（重新）+sum（拿取）+e（词形结尾；名词简历另借自法语résumé）", "d": "1. v. 恢复；重新开始（2）；2. n. 简历（1）", "e": "[ C ] <mark>resumed</mark>"}, {"id": 1705, "u": 18, "w": "retire", "f": 3, "m": "", "d": "1. v. 撤下；移回（2）；2. v. 退休（1）", "e": "Why did Waterstones shops <mark>retire</mark> PRH books to their relevant sections?"}, {"id": 1706, "u": 18, "w": "revelation", "f": 3, "m": "re-（移开）+vel（遮盖）+-ation（行为或结果）", "d": "1. n. 新发现（2）；2. n. 揭示；揭露的事实（1）", "e": "It was with these great <mark>revelations</mark> that a new kind of philosophy founded in reason was born."}, {"id": 1707, "u": 18, "w": "revise", "f": 3, "m": "re-（再次）+vise（看）", "d": "1. v. 修订；修改（3）", "e": "&quot;We reason together, challenge, <mark>revise</mark>, and complete each other&#x27;s reasoning and each other&#x27;s conceptions of reason.&quot;"}, {"id": 1708, "u": 18, "w": "revolution", "f": 3, "m": "re-（回、重新）+volut（转动）+-ion（名词后缀）", "d": "1. n. 革命、重大变革（3）", "e": "The victims of this <mark>revolution</mark>, of course, are not limited to designers."}, {"id": 1709, "u": 18, "w": "rigid", "f": 3, "m": "rig（僵硬）+id（具有这种性质的）", "d": "1. adj. 严格的；僵化的（3）", "e": "[ D ] a <mark>rigid</mark> moral code."}, {"id": 1710, "u": 18, "w": "ritual", "f": 3, "m": "ritu-（仪式）+-al（有关的）", "d": "1. n. 仪式；固定惯例（3）", "e": "It has become a grimly reliable annual <mark>ritual</mark>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise."}, {"id": 1711, "u": 18, "w": "round", "f": 3, "m": "", "d": "1. n. 轮；一轮（2）；2. prep. 全天候（round-the-clock）（1）", "e": "The journal Science is adding an extra <mark>round</mark> of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today."}, {"id": 1712, "u": 18, "w": "routine", "f": 3, "m": "", "d": "1. n. 惯例、日常安排（2）；2. adj. 常规的、日常的（1）", "e": "Most importantly, it __18__ modifies and enhances the games you play to __19__ on the strengths you are developing -much like a(n) __20__ exercise <mark>routine</mark> requires you to increase resistance and vary your muscle use."}, {"id": 1713, "u": 18, "w": "safeguard", "f": 3, "m": "safe（安全的）+guard（守护、保护）", "d": "1. v. 保护、保障（2）；2. n. 保障措施（1）", "e": "The carbon emissions from technological research are well spent: ultimately this research will <mark>safeguard</mark> the future of our planet."}, {"id": 1714, "u": 18, "w": "sake", "f": 3, "m": "", "d": "1. n. 为了（for thesake of）（3）", "e": "(50) They pool resources, collaborate, think outside the box, and find solutions and ways around obstacles to explore science for the <mark>sake</mark> of science without the traditional boundaries of working inside a formal setting."}, {"id": 1715, "u": 18, "w": "scar", "f": 3, "m": "", "d": "1. n. 伤疤；疤痕（2）；2. v. 使留下伤疤；使留下疤痕（1）", "e": "Some of the trees he analyzed bore more than 20 fire <mark>scars</mark> among their rings."}, {"id": 1716, "u": 18, "w": "section", "f": 3, "m": "sect（切割、切分）+-ion（结果、部分的名词后缀）", "d": "1. n. 部分；分区（3）", "e": "Why did Waterstones shops retire PRH books to their relevant <mark>sections</mark>?"}, {"id": 1717, "u": 18, "w": "seemingly", "f": 3, "m": "seem（看似、显得）+-ing（呈现的状态）+-ly（副词后缀）", "d": "1. adv. 似乎；表面上（3）", "e": "The music is abrupt and <mark>seemingly</mark> disconnected, as in the last piano sonata."}, {"id": 1718, "u": 18, "w": "self-help", "f": 3, "m": "self（自己）+help（帮助）", "d": "1. 短语 自助；自我提升（3）", "e": "With its theme that &quot;Mind is the master weaver,&quot; creating our inner character and outer circumstances, the book As a Man Thinketh by James Allen is an in-depth exploration of the central idea of <mark>self-help</mark> writing."}, {"id": 1719, "u": 18, "w": "settle", "f": 3, "m": "sett（放置、固定）+le（动词词形结尾）", "d": "1. v. 解决；确定（2）；2. v. 安定下来（settle down）（1）", "e": "[ D ] <mark>settle</mark>"}, {"id": 1720, "u": 18, "w": "shame", "f": 3, "m": "sham（羞耻、耻辱）+e（拼写结尾）", "d": "1. n. 遗憾（2）；2. v. 使蒙羞；公开谴责（1）", "e": "And that&#x27;s a <mark>shame</mark>, because there is much to recommend in the idea of scientific literacy as it was originally articulated in 1945, a time when science appeared to be the key to progress and scientists seemingly held the fate of the world in their hands."}, {"id": 1721, "u": 18, "w": "sheer", "f": 3, "m": "", "d": "1. adj. 十足的；纯粹的（3）", "e": "There&#x27;s fun in testimonies of people enjoying the <mark>sheer</mark> newness."}, {"id": 1722, "u": 18, "w": "shrink", "f": 3, "m": "", "d": "1. v. 缩小、减少（2）；2. v. 退缩、局限于（1）", "e": "ACE says it&#x27;s helped <mark>shrink</mark> the number of illegal streaming services in North America to 126, from more than 1,400 in 2018, aided in part by the MPA&#x27;s support for a 2020 federal law that made large-scale streaming of copyrighted material a serious crime."}, {"id": 1723, "u": 18, "w": "signature", "f": 3, "m": "signat-（签名；标记，历史词干）+-ure（名词后缀）", "d": "1. adj. 标志性的（1）；2. n. 独特标志（1）；3. n. 签名（1）", "e": "[ B ] Peters&#x27; <mark>signature</mark> shot is a butterfly &quot;take-off&quot;, showing the multiple wing-beats of one butterfly in one frame as it lifts off from a flower."}, {"id": 1724, "u": 18, "w": "similarity", "f": 3, "m": "similar（相似的）+-ity（性质）", "d": "1. n. 相似性；相似之处（3）", "e": "Why this <mark>similarity</mark> exists in smell genes is difficult to explain, for now."}, {"id": 1725, "u": 18, "w": "similarly", "f": 3, "m": "similar（相似的）+-ly（以这种方式）", "d": "1. adv. 同样地；类似地（3）", "e": "<mark>Similarly</mark>, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice."}, {"id": 1726, "u": 18, "w": "simplify", "f": 3, "m": "simpl（simple去e，简单的）+-ify（使成为）", "d": "1. v. 简化（3）", "e": "This __11__ makes sense if you <mark>simplify</mark> the workings of a complex brain, __12__ it to an array of electrical pulses; cells in plants also communicate through electrical signals."}, {"id": 1727, "u": 18, "w": "skeptical", "f": 3, "m": "skeptic（怀疑者）+-al（形容词后缀）", "d": "1. adj. 怀疑的；持怀疑态度的（3）", "e": "But banks&#x27; shares trade below their book value, suggesting that investors are <mark>skeptical</mark>."}, {"id": 1728, "u": 18, "w": "sketch", "f": 3, "m": "", "d": "1. n. 短篇小品；随笔（3）", "e": "From then on his <mark>sketches</mark>, which appeared under the pen name &quot;Boz&quot; in The Evening Chronicle, earned him a modest reputation."}, {"id": 1729, "u": 18, "w": "slightly", "f": 3, "m": "slight（轻微的、微小的）+-ly（达到这种程度）", "d": "1. adv. 稍微，略微，轻微地（3）", "e": "The use of privacy law to curb the tech giants in this instance feels <mark>slightly</mark> maladapted."}, {"id": 1730, "u": 18, "w": "so-called", "f": 3, "m": "so（这样）+called（被称为的）", "d": "1. 短语 所谓的；被称作……的（3）", "e": "Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the <mark>so-called</mark> State Street Bank case, approving a patent on a way of pooling mutual-fund assets."}, {"id": 1731, "u": 18, "w": "soul", "f": 3, "m": "", "d": "1. n. 灵魂,心灵（3）", "e": "It might be poetic, philosophical, sensual, or mathematical, but in any case it must, in my view, have something to do with the <mark>soul</mark> of the human being."}, {"id": 1732, "u": 18, "w": "specialist", "f": 3, "m": "special（专门的）+-ist（从事相应工作的人）", "d": "1. n. 专家（2）；2. n. 专门的；专业的（1）", "e": "Yet only one of his books is now in print, and his vast body of writings on music is unknown save to <mark>specialists</mark>."}, {"id": 1733, "u": 18, "w": "specifically", "f": 3, "m": "specific（具体的、特定的）+ally（以这种方式）", "d": "1. adv. 专门地、明确地（2）；2. adv. 具体来说（1）", "e": "It was <mark>specifically</mark> to provide city dwellers with spaces for leisure where they could experience &quot;a refreshing air.&quot;"}, {"id": 1734, "u": 18, "w": "specify", "f": 3, "m": "spec（看、辨明）+-ify（使成为）", "d": "1. v. 明确说明、具体规定（3）", "e": "<mark>Specify</mark> the duties and requirements of the job."}, {"id": 1735, "u": 18, "w": "speculate", "f": 3, "m": "spec（看、观察）+ulate（动词结尾）", "d": "1. v. 推测、猜测（3）", "e": "It is <mark>speculated</mark> that gardens arise from a basic human need in the individuals who made them: the need for creative expression."}, {"id": 1736, "u": 18, "w": "stability", "f": 3, "m": "stabil（稳定）+-ity（性质、状态的名词后缀）", "d": "1. n. 稳定（3）", "e": "Yet these creatures are members of the biotic community and, if its <mark>stability</mark> depends on its integrity, they are entitled to continuance."}, {"id": 1737, "u": 18, "w": "stable", "f": 3, "m": "stabl（稳定、固定）+e（词形结尾）", "d": "1. adj. 稳定的；稳固的（3）", "e": "There are many reasons this formerly <mark>stable</mark> federal institution finds itself at the brink of bankruptcy."}, {"id": 1738, "u": 18, "w": "stakeholder", "f": 3, "m": "stake（利益、利害关系）+holder（持有者）", "d": "1. n. 利益相关方（3）", "e": "Within companies, the right compensation design can provide incentives for executives to think beyond their own time at the company and on behalf of all <mark>stakeholders</mark>."}, {"id": 1739, "u": 18, "w": "star", "f": 3, "m": "", "d": "1. n. 星；恒星（3）", "e": "<mark>Star</mark> watchers were among the most esteemed members of Hawaiian society."}, {"id": 1740, "u": 18, "w": "stare", "f": 3, "m": "", "d": "1. v. 凝视、盯着看（2）；2. n. 凝视、盯着看（1）", "e": "Have you ever <mark>stared</mark> helplessly at a ZIP disk, thinking: how do I get the files off this?"}, {"id": 1741, "u": 18, "w": "state-level", "f": 3, "m": "state（州；国家）+level（层级）", "d": "1. 短语 州级的（3）", "e": "Sensible ideas have been around for a long time, but the <mark>state-level</mark> bodies that govern the profession have been too conservative to implement them."}, {"id": 1742, "u": 18, "w": "stern", "f": 3, "m": "", "d": "1. adj. 严厉的、严峻的（3）", "e": "If the bar exam is truly a <mark>stern</mark> enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so."}, {"id": 1743, "u": 18, "w": "strain", "f": 3, "m": "", "d": "1. n. 使承受压力、压力负担（1）；2. v. 使承受压力、压力负担（1）；3. v. 使肌肉用力、拉紧（1）", "e": "For example, a high growth rate placed great <mark>strains</mark> on the existing structures of governance, of administration, and above all of socialization."}, {"id": 1744, "u": 18, "w": "strategic", "f": 3, "m": "strateg（strategy去y，战略、策略）+-ic（与……有关的）", "d": "1. adj. 战略性的；有谋划的（3）", "e": "As the international education market expands, the recent slowdown in the numbers of international students studying in the main English-speaking countries is likely to continue, especially if there are no effective <mark>strategic</mark> policies to prevent such slippage."}, {"id": 1745, "u": 18, "w": "striking", "f": 3, "m": "strik（strike去e，击中、给人强烈印象）+ing（具有这种作用的）", "d": "1. adj. 显著的、引人注目的（3）", "e": "In the study, the researchers compared the historical fire cadence with the wildfires recorded over the past few decades, and uncovered a <mark>striking</mark> shortfall."}, {"id": 1746, "u": 18, "w": "stunning", "f": 3, "m": "stun（使震惊；双写n）+-ing（形容词后缀）", "d": "1. adj. 令人惊叹的；极其美丽的（2 as <mark>surprisingly</mark> straight up."}, {"id": 1755, "u": 18, "w": "sustainability", "f": 3, "m": "sustainable（可持续的，-able变-abil）+-ity（性质）", "d": "1. n. 可持续性；可持续发展（3）", "e": "She exhibits the idealism common to many advocates of <mark>sustainability</mark>, be it in food or in energy."}, {"id": 1756, "u": 18, "w": "sympathy", "f": 3, "m": "sym-（共同）+path（感受）+-y（名词后缀）", "d": "1. n. 同情；同情心（3）", "e": "(48) Mental health allows us to view others with <mark>sympathy</mark> if they are having troubles, with kindness if they are in pain, and with unconditional love no matter who they are."}, {"id": 1757, "u": 18, "w": "symptom", "f": 3, "m": "sym-（共同、一起）+ptom（发生、出现）", "d": "1. n. 症状；征兆（3）", "e": "This was also found in high-functioning men with some autistic spectrum <mark>symptoms</mark>, who may tend to avoid eye contact."}, {"id": 1758, "u": 18, "w": "systematic", "f": 3, "m": "system（系统、体系）+-atic（具有这种性质的）", "d": "1. adj. 系统的；有条理的（3）", "e": "__12__ the descriptions on record, no <mark>systematic</mark> __13__ was found that levels of productivity were related to changes in lighting."}, {"id": 1759, "u": 18, "w": "tactic", "f": 3, "m": "tact（安排）+-ic（本词的名词结尾）", "d": "1. n. 策略、手段（3）", "e": "The <mark>tactic</mark> never really works."}, {"id": 1760, "u": 18, "w": "talent", "f": 3, "m": "", "d": "1. n. 人才；有才能的人（3）", "e": "If productions in Southern California dip below a critical level for too long, the industry&#x27;s essential <mark>talent</mark> will drift away along with enormous sums of revenue."}, {"id": 1761, "u": 18, "w": "tangible", "f": 3, "m": "tang（接触、触碰）+-ible（能够被……的）", "d": "1. adj. 有形的；可触摸的（3）", "e": "Because they&#x27;re <mark>tangible</mark>."}, {"id": 1762, "u": 18, "w": "tear", "f": 3, "m": "", "d": "1. n. 眼泪；泪水（3）", "e": "Although sadness also __14__ <mark>tears</mark>, evidence suggests that emotions can flow __15__ muscular responses."}, {"id": 1763, "u": 18, "w": "technical", "f": 3, "m": "technic-（技术；技艺）+-al（形容词后缀）", "d": "1. adj. 技术的（3）", "e": "[ ably when they can&#x27;t afford not to."}, {"id": 1782, "u": 18, "w": "variation", "f": 3, "m": "vary（变化；y变i）+-ation（名词后缀）", "d": "1. n. 变化；差异（3）", "e": "[ D ] its major <mark>variations</mark>."}, {"id": 1783, "u": 18, "w": "via", "f": 3, "m": "", "d": "1. prep. 通过；经由（3）", "e": "An emerging body of research shows that positive health habits-as well as negative ones-spread through networks of friends <mark>via</mark> social communication."}, {"id": 1784, "u": 18, "w": "victory", "f": 3, "m": "vict（战胜、征服）+ory（名词结尾）", "d": "1. n. 胜利（3）", "e": "This narrowing of the regulatory scope was a <mark>victory</mark> for builders, mining operators and other commercial interests often at odds with environmental rules."}, {"id": 1785, "u": 18, "w": "video", "f": 3, "m": "vide（看）+o（词形结尾）", "d": "1. n. 视频（3）", "e": "The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own <mark>video</mark>-streaming service at the expense of Netflix and Apple TV."}, {"id": 1786, "u": 18, "w": "virtual", "f": 3, "m": "", "d": "1. adj. 虚拟的；网络的（2）；2. adj. 实际上的；事实上的（1）", "e": "The best uses of 3D printers and <mark>virtual</mark> reality haven&#x27;t been invented yet."}, {"id": 1787, "u": 18, "w": "vocabulary", "f": 3, "m": "vocabul-（词语；名称）+-ary（集合或相关事物）", "d": "1. n. 词汇；词汇量（3）", "e": "The peer-reviewed results showed that the target group of pupils drew on a wider <mark>vocabulary</mark>, used words &quot;classed as more sophisticated or rarer&quot;, and wrote at greater length."}, {"id": 1788, "u": 18, "w": "volunteer", "f": 3, "m": "volunt-（意愿、自愿）+-eer（从事者）", "d": "1. n. 志愿者、志愿参加的（3）", "e": "Write an email to answer the inquiry from an international student <mark>volunteer</mark>, specifying the details of the project."}, {"id": 1789, "u": 18, "w": "wake", "f": 3, "m": "", "d": "1. n. 紧接……之后（in the wake of）（2）；2. n. 随之产生的结果（in its wake）（1）", "e": "The Federal Circuit&#x27;s action comes in the <mark>wake</mark> of a series of recent decisions by the Supreme Court that have narrowed the scope of protections for patent holders."}, {"id": 1790, "u": 18, "w": "warn", "f": 3, "m": "war（警觉、察觉）+n（本词词形结尾）", "d": "1. v. 警告；提醒（3）", "e": "Charlie McCreevy, a European commissioner, <mark>warned</mark> the IASB that it did &quot;not live in a political vacuum&quot; but &quot;in the real world&quot; and that Europe could yet develop different rules."}, {"id": 1791, "u": 18, "w": "warning", "f": 3, "m": "warn（警告、提醒）+-ing（相应的行为、内容或正在进行的动作）", "d": "1. n. 警告；预警（3）", "e": "If everything was going so well, then why did over 17 million people vote for Brexit, despite the <mark>warnings</mark> about what it could do to their country&#x27;s economic prospects?"}, {"id": 1792, "u": 18, "w": "wash", "f": 3, "m": "", "d": "1. n. 洗涤（1）；2. n. 涌入（比喻）（1）；3. n. 退去（比喻）（1）", "e": "These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a <mark>wash</mark> or two, although they don&#x27;t advertise that - and to renew their wardrobe every few weeks."}, {"id": 1793, "u": 18, "w": "weapon", "f": 3, "m": "", "d": "1. n. 武器（3）", "e": "The likely explanation is that the withdrawal was rushed, and they didn&#x27;t want the local Caledonians getting their hands on 10 tons of <mark>weapon</mark>-grade iron."}, {"id": 1794, "u": 18, "w": "wear", "f": 3, "m": "", "d": "1. v. 穿；戴（2）；2. v. 显露；表现（wear one’slearning lightly：不卖弄学问）（1）", "e": "The point of a style upgrade isn&#x27;t to become more vain or to spend more time fussing over what to <mark>wear</mark>."}, {"id": 1795, "u": 18, "w": "weight", "f": 3, "m": "", "d": "1. n. 坠子；重物（1）；2. n. 重压；负担（1）；3. v. 重量；体重（1）", "e": "Excavations revealed a large number of Minoan-style loom <mark>weights</mark>, __19__ Pavlopetri was a thriving trade center with a __20__ textile industry."}, {"id": 1796, "u": 18, "w": "withdraw", "f": 3, "m": "with-（向后、离开）+draw（拉）", "d": "1. v. 撤回；撤离（2）；2. v. 取出；提取（1）", "e": "[ C ] g viewpoints,&quot; the survey concluded."}, {"id": 1812, "u": 19, "w": "adhere", "f": 2, "m": "ad-（向）+her-（黏、附着）+e（词形结尾）", "d": "1. v. 依附；被吸引而持续关注（1）；2. v. 遵守；坚持（1）", "e": "My definition revolves around the concept of &quot;stickiness&quot; -creations and experiences to which others <mark>adhere</mark>."}, {"id": 1813, "u": 19, "w": "adulthood", "f": 2, "m": "adult（成年人）+-hood（身份；时期）", "d": "1. n. 成年期（2）", "e": "In <mark>adulthood</mark>, looking someone else in a pleasant way can be a complimentary sign of paying attention."}, {"id": 1814, "u": 19, "w": "advent", "f": 2, "m": "ad-（向、到）+vent（来、到来）", "d": "1. n. 出现；到来（2）", "e": "The <mark>advent</mark> of electronic publishing and authors&#x27; need to find outlets for their papers resulted in thousands of new journals."}, {"id": 1815, "u": 19, "w": "aerial", "f": 2, "m": "aer-（空气、空中）+-ial（与之有关的）", "d": "1. adj. 空中的、航空的（2）", "e": "<mark>Aerial</mark> surveys locate general areas of interest or larger buried features, such as ancient buildings or fields."}, {"id": 1816, "u": 19, "w": "affair", "f": 2, "m": "a-（要做、待做）+fair（做）", "d": "1. n. 事务（1）；2. n. 社交活动；场合（1）", "e": "The report also advocates greater study of foreign languages, international <mark>affairs</mark> and the expansion of study abroad programs."}, {"id": 1817, "u": 19, "w": "afford", "f": 2, "m": "", "d": "1. v. 承担得起（1）；2. v. 提供（1）", "e": "Vanity is a constant; people will only start shopping more sustainably when they can&#x27;t <mark>afford</mark> not to."}, {"id": 1818, "u": 19, "w": "afloat", "f": 2, "m": "a-（处于……状态）+float（漂浮）", "d": "1. adj. 维持运转、免于倒闭（2）", "e": "We were kept <mark>afloat</mark> by &quot;peak TV&quot;, the glut of content that was required by the explosion of streaming services."}, {"id": 1819, "u": 19, "w": "agenda", "f": 2, "m": "ag（做）+end（结束）+a（全部）", "d": "1. n. 目的；行动意图（2）", "e": "First, most people do not realise that there are strong commercial <mark>agendas</mark> at work to keep them in passive consumption mode."}, {"id": 1820, ture, religion and philosophy."}, {"id": 1835, "u": 19, "w": "arm", "f": 2, "m": "", "d": "1. n. 愤怒抗议（upin arms）（1）；2. v. 装备；使具备（1）", "e": "And in Europe, some are up in <mark>arms</mark> over a proposal to drop a specific funding category for social-science research and to integrate it within cross-cutting topics of sustainable development."}, {"id": 1836, "u": 19, "w": "array", "f": 2, "m": "", "d": "1. n. 一系列；大量（2）", "e": "(50) The upside is the possibilities contained in knowing that everything is up to us; where before we were experts in the <mark>array</mark> of limitations, now we become authorities of what is possible."}, {"id": 1837, "u": 19, "w": "arrestee", "f": 2, "m": "arrest（逮捕）+-ee（承受该动作的人）", "d": "1. n. 被捕者（2）", "e": "A smartphone may contain an <mark>arrestee&#x27;s</mark> reading history, financial history, medical history and comprehensive records of recent correspondence."}, {"id": 1838, "u": 19, "w": "articulate", "f": 2, "m": "articul（关节、分节）+-ate（作出相应动作）", "d": "1. v. 清楚地表达（2）", "e": "(46) It is also the reason why when we try to describe music with words, all we can do is <mark>articulate</mark> our reactions to it, and not grasp music itself."}, {"id": 1839, "u": 19, "w": "assist", "f": 2, "m": "as-（向、到旁边）+sist（站立、维持）", "d": "1. v. 帮助；协助（2）", "e": "Fewer artists than scientists responded to the Nature poll; however, several respondents noted that artists do not simply <mark>assist</mark> scientists with their communication requirements."}, {"id": 1840, "u": 19, "w": "attachment", "f": 2, "m": "attach（附加、使连接）+-ment（相关对象或状态）", "d": "1. n. 依恋；情感联系（2）", "e": "This mutual gaze is a major part of the <mark>attachment</mark> between mother and child."}, {"id": 1841, "u": 19, "w": "attraction", "f": 2, "m": "attract（吸引）+ion（作用、力量或相关对象）", "d": "1. n. 吸引力；喜爱（1）；2. n. 旅游景点（1）", "e": "[ D ] the <mark>attraction</mark> of financial rewards."}, {"id": 1842, "u": 19, "w": "automate", "f": 2, "m": "automat（自动）+-e（词形结尾）", "d": "1. v. 使自动化（2）", "e": "About hal x27;s <mark>chairman</mark>, cried out against those who &quot;question our motives.&quot;"}, {"id": 1874, "u": 19, "w": "chaos", "f": 2, "m": "", "d": "1. n. 混乱（2）", "e": "Beethoven&#x27;s music tends to move from <mark>chaos</mark> to order as if order were an imperative of human existence."}, {"id": 1875, "u": 19, "w": "charter", "f": 2, "m": "chart（纸、文书）+-er（词形结尾）", "d": "1. n. 章程（1）；2. n. 特许的（1）", "e": "The <mark>charter&#x27;s</mark> main tool of enforcement is to deny access for designers and modeling agencies to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute."}, {"id": 1876, "u": 19, "w": "cherish", "f": 2, "m": "cher（亲爱的、珍贵的）+-ish（以相应态度对待）", "d": "1. v. 珍惜（2）", "e": "[ D ] <mark>cherish</mark>"}, {"id": 1877, "u": 19, "w": "clarity", "f": 2, "m": "clar（清晰）+ity（性质、状态的名词后缀）", "d": "1. n. 清晰；清楚（2）", "e": "As many people hit middle age, they often start to notice that their memory and mental <mark>clarity</mark> are not what they used to be."}, {"id": 1878, "u": 19, "w": "classmate", "f": 2, "m": "class（班级）+-mate（一起活动的同伴，表人成分）", "d": "1. n. 同学（2）", "e": "Read the following email from your <mark>classmate</mark> Paul and write him a reply."}, {"id": 1879, "u": 19, "w": "classroom", "f": 2, "m": "class（班级、课）+room（房间）", "d": "1. n. 教室（2）", "e": "This is not to say that there is no point in getting a degree, but rather stress that a degree is not for everyone, that the switch from <mark>classroom</mark> to lecture hall is not an inevitable one and that other options are available."}, {"id": 1880, "u": 19, "w": "climb", "f": 2, "m": "", "d": "1. n. 攀登；爬上（1）；2. v. 攀登；爬上（1）", "e": "Another __12__ : <mark>Climb</mark> high and look for signs of human habitation."}, {"id": 1881, "u": 19, "w": "club", "f": 2, "m": "", "d": "1. n. 俱乐部（2）", "e": "You are going to host a <mark>club</mark> reading session."}, {"id": 1882, "u": 19, "w": "coat", "f": 2, "m": "", "d": "1. n. 外套（1）；2. v. 涂覆（1）", "e": "There were Pickwick <mark>coats</mark> and Pickwick cigars, and the plump, spectacled hero, Samuel Pickwick, became a national figure."}, {"id": 1883, "u": 19, "w": "comedy", "f": 2, "m": "", "d": "1. n. 喜剧（作品）（2）", "e": "(46) By the date of his birth Europe was witnessing the passing of the religious drama, and the creation of new forms under the incentive of classical tragedy and <mark>comedy</mark>."}, {"id": 1884, "u": 19, "w": "comfort", "f": 2, "m": "com-（共同、加强）+fort（力量）", "d": "1. n. 安慰；慰藉（2）", "e": "Yet researchers can take some <mark>comfort</mark> in the fact that there are a multitude of librarians devoted to discovering, organizing, and preserving digital information for researchers current and future."}, {"id": 1885, "u": 19, "w": "comic", "f": 2, "m": "com-（欢宴、喜剧）+-ic（具有相应性质的）", "d": "1. adj. 滑稽的（2）", "e": "At the same time, Dickens, who had a reporter&#x27;s eye for transcribing the life around him, especially anything <mark>comic</mark> or odd, submitted short sketches to obscure magazines."}, {"id": 1886, "u": 19, "w": "commitment", "f": 2, "m": "commit（承诺、投入）+-ment（行为、状态、所承接事项）", "d": "1. n. 承诺；承担的责任（2）", "e": "Either Entergy never really intended to live by those <mark>commitments</mark>, or it simply didn&#x27;t foresee what would happen next."}, {"id": 1887, "u": 19, "w": "commodity", "f": 2, "m": "com-（共同）+mod（尺度）+-ity（名词结尾）", "d": "1. n. 商品；货物（2）", "e": "It was a year before she became head of a tiny Internet-based <mark>commodities</mark> exchange."}, {"id": 1888, "u": 19, "w": "complement", "f": 2, "m": "com-（完全）+ple-（填满）+-ment（相关事物）", "d": "1. v. 补充（2）", "e": "[ D ] <mark>complement</mark>"}, {"id": 1889, "u": 19, "w": "complicate", "f": 2, "m": "com-（一起）+plic（折叠、缠绕）+ate（使……）", "d": "1. v. 使复杂（2）", "e": "But in the everyday practice of science, discovery frequently follows an ambiguous and <mark>complicated</mark> route."}, {"id": 1890, "u": 19, "w": "composure", "f": 2, "m": "compos（compose去e，使平静、使安定）+-ure（这种状态）", "d": "1. n. 镇定（2）", "e": "<mark>Composure</mark> is a state of mind made possible by the structuring of one&#x27;s relation to one&#x27;s environment."}, {"id": 1891, "u": 19, "w": "compound", "f": 2, "m": "", "d": "1. n. 化合物（2）", "e": "Scientists say the <mark>compound</mark> is __11__ to cause cancer but have no hard scientific proof."}, {"id": 1892, "u": 19, "w": "comprise", "f": 2, "m": "com-（共同、一起）+pris（拿取、收进）+e（词形结尾）", "d": "1. v. 包括（2）", "e": "Between 1807 and 1814 the Iberian Peninsula (<mark>comprising</mark> Spain and Portugal) was the scene of a titanic and merciless struggle."}, {"id": 1893, "u": 19, "w": "conceal", "f": 2, "m": "con-（完全）+ceal（隐藏、隐瞒）", "d": "1. v. 隐藏（2）", "e": "&quot;Nature gave us lips to <mark>conceal</mark> our teeth,&quot; ran one popular Victorian maxim, alluding to the fact that before the birth of proper dentistry, mouths were often in a shocking state of hygiene."}, {"id": 1894, "u": 19, "w": "conceive", "f": 2, "m": "con-（聚到一起）+ceive（拿入、接纳）", "d": "1. v. 构想；想象（1）；2. v. 理解；认为（1）", "e": "[ D ] Our immediate future is hard to <mark>conceive</mark>."}, {"id": 1895, "u": 19, "w": "concentration", "f": 2, "m": "concentrate（集中、浓缩）+ion（过程、状态或程度的名词后缀）", "d": "1. n. 集中；集聚（2）", "e": "&quot;This is all part of a wider change towards <mark>concentration</mark> of power,&quot; says literary agent Andrew Lownie."}, {"id": 1896, "u": 19, "w": "conception", "f": 2, "m": "con-（一起）+cept（抓住、拿取）+-ion（这种过程或结果）", "d": "1. n. 理解（2）", "e": "&quot;We reason together, challenge, revise, and complete each other&#x27;s reasoning and each other&#x27;s <mark>conceptions</mark> of reason.&quot;"}, {"id": 1897, "u": 19, "w": "concerned", "f": 2, "m": "concern（涉及、使关心）+-ed（处于相关心理状态的）", "d": "1. adj. 关心的；关注的（2）", "e": "He was not interested in daily politics, but <mark>concerned</mark> with questions of moral behavior and the larger questions of right and wrong affecting the entire society."}, {"id": 1898, "u": 19, "w": "concert", "f": 2, "m": "con（共同、一起）+cert（确定）", "d": "1. n. 音乐会（2）", "e": "The widespread availability of such recordin
