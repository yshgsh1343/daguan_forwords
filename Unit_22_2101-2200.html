<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 22 (2101-2200) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

;There are as many scientists working against all the <mark>panic</mark> of global climate change as there are those who are pushing it,&quot; she claims.", "z": "她声称：“反对围绕全球气候变化制造<mark>恐慌</mark>的科学家，和推动这种<mark>恐慌</mark>的科学家一样多。”", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2151, "w": "parenthood", "f": 2, "m": "parent（父亲或母亲）+-hood（身份、状态）", "s": [{"d": "1. n. 为人父母（2）", "e": "Of course, the image of <mark>parenthood</mark> that celebrity magazines like Us Weekly and People present is hugely unrealistic, especially when the parents are single mothers like Bullock.", "z": "当然，《美国周刊》和《人物》等名人杂志所呈现的<mark>为人父母</mark>的形象，极其不切实际，尤其当这些父母是像布洛克这样的单身母亲时。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2152, "w": "parenting", "f": 2, "m": "parent（父亲或母亲；作父母养育）+-ing（活动）", "s": [{"d": "1. n. 养育子女；育儿（2）", "e": "[ C ] the conventional <mark>parenting</mark> style in western culture", "z": "[C] 西方文化中传统的<mark>育儿</mark>方式", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 选项 C · 真题选项"}]}, {"id": 2153, "w": "parliament", "f": 2, "m": "parl（说话、商谈）+ia（连接部分）+-ment（活动及其组织）", "s": [{"d": "1. n. 议会（2）", "e": "The <mark>parliament</mark> also agreed to ban websites that &quot;incite excessive thinness&quot; by promoting extreme dieting.", "z": "<mark>议会</mark>还同意禁止通过鼓吹极端节食来“煽动过度消瘦”的网站。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2154, "w": "partner", "f": 2, "m": "part（共同事务中的一份）+n（本词的连接字母）+-er（人）", "s": [{"d": "1. n. 伴侣（1）", "e": "No shock there, considering how much work it is to raise a kid without a <mark>partner</mark> to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-clock help) is a piece of cake.", "z": "考虑到没有<mark>伴侣</mark>可以依靠时抚养孩子是多么辛苦，这并不令人震惊；但听桑德拉和布兰妮的说法，“独自”养孩子（意思是：有人全天候帮忙）简直是小菜一碟。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 合伙人（1）", "e": "Says Korn/Ferry senior <mark>partner</mark> Dennis Carey: &quot;I can&#x27;t think of a single search I&#x27;ve done where a board has not instructed me to look at sitting CEOs first.&quot;", "z": "光辉国际高级<mark>合伙人</mark>丹尼斯·凯里说：“我想不出自己哪一次招聘高管时，董事会没有指示我先考察在任首席执行官。”", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2155, "w": "passion", "f": 2, "m": "pass-（承受、遭受）+-ion（经历、状态）", "s": [{"d": "1. n. 热情；热爱（2）", "e": "Big-name PRH authors may suffer a bit, but it&#x27;s those mid-list authors, who normally rely on Waterstones staff&#x27;s <mark>passion</mark> for promoting books by lesser-known writers, who will be praying for an end to the dispute.", "z": "企鹅兰登书屋旗下的知名作家可能会受到一点影响，但那些销量中等的作家才会祈求争端结束，因为他们通常依靠水石书店员工推广不太知名作家作品的<mark>热情</mark>。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2156, "w": "patch", "f": 2, "m": "", "s": [{"d": "1. n. 小片区域（2）", "e": "(50) The experiment showed that elephants may well use smell to identify <mark>patches</mark> of trees that are good to eat, and secondly to assess the quality of the trees within each <mark>patch</mark>.", "z": "（50）实验证明，大象很可能利用嗅觉识别适宜食用的<mark>成片</mark>树木，其次还能评估每一<mark>小片区域</mark>内树木的品质。", "r": "2024 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2157, "w": "peace", "f": 2, "m": "", "s": [{"d": "1. n. 平静；安宁（2）", "e": "(47) A sacred place of <mark>peace</mark>, however crude it may be, is a distinctly human need, as opposed to shelter, which is a distinctly animal need.", "z": "（47）一处神圣而<mark>安宁</mark>的场所，无论多么简陋，都是人类特有的需要；与之相对，庇护所则是动物特有的需要。", "r": "2013 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 2158, "w": "penalty", "f": 2, "m": "penal（惩罚的）+-ty（名词后缀）", "s": [{"d": "1. n. 处罚；罚款（2）", "e": "The study found that, among prosecuted firms, those with the most comprehensive CSR programmes tended to get more lenient <mark>penalties</mark>.", "z": "研究发现，在被起诉的公司中，企业社会责任计划最全面的公司往往受到较宽松的<mark>处罚</mark>。", "r": "2016 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2159, "w": "peninsula", "f": 2, "m": "pen-（几乎）+insula（岛）", "s": [{"d": "1. n. 半岛（2）", "e": "Studying Scovell&#x27;s papers at the Public Record Office, London, I found that he had left an extensive journal and copious notes about his work in the <mark>peninsula</mark>.", "z": "我在伦敦公共档案馆研究斯科维尔的文稿时发现，他留下了篇幅浩繁的日记，以及大量有关他在<mark>半岛</mark>工作情况的笔记。", "r": "2022 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 2160, "w": "pension", "f": 2, "m": "pens（称量；支付）+-ion（名词后缀）", "s": [{"d": "1. n. 养老金、退休金（2）", "e": "The FASB and IASB have been exactly that, cleaning up rules on stock options and <mark>pensions</mark>, for example, against hostility from special interests.", "z": "财务会计准则委员会和国际会计准则理事会恰恰如此，例如，它们顶着特殊利益集团的敌意，清理了有关股票期权和<mark>养老金</mark>的规则。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2161, "w": "perception", "f": 2, "m": "per-（充分）+cept-（抓住）+-ion（过程、结果）", "s": [{"d": "1. n. 认识；感知；看法（2）", "e": "Favoritism in official access can fan public <mark>perceptions</mark> of corruption.", "z": "在接触官员的机会方面搞偏袒，会加剧公众对腐败的<mark>感受</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2162, "w": "perfectly", "f": 2, "m": "perfect（完全的、完美的）+-ly（达到这种程度、以这种方式）", "s": [{"d": "1. adv. 完全地；十分（1）", "e": "(49) Although mental health is the cure-all for living our lives, it is <mark>perfectly</mark> ordinary as you will see that it has been there to direct you through all your difficult decisions.", "z": "（49）虽然心理健康是我们生活的万能良方，但它其实<mark>十分</mark>平常，因为你会发现，在你作出每一个艰难决定时，它一直都在指引你。", "r": "2016 · 英语一 · 阅读理解 C · 第 49、50 题"}, {"d": "2. adv. 完美地（1）", "e": "[ D ] Reproductions, even if <mark>perfectly</mark> made, cannot take the place of the authentic objects.", "z": "[D] 复制品即使制作得<mark>完美</mark>，也不能代替真品。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 2163, "w": "permanently", "f": 2, "m": "permanent（永久的、持久的）+-ly（副词后缀）", "s": [{"d": "1. adv. 永久地；长期地（2）", "e": "Fundamentally, the USPS is in a historic squeeze between technological change that has <mark>permanently</mark> decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.", "z": "从根本上说，美国邮政署正陷入一场历史性的两面夹击：技术变革<mark>永久性</mark>地降低了对其主要收入来源--一类邮件--的需求，而监管结构又剥夺了管理层调整运营以适应新现实的灵活性。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2164, "w": "personnel", "f": 2, "m": "person（人）+nel（本词集合性名词结尾）", "s": [{"d": "1. n. 人员、职员（2）", "e": "There&#x27;s no change to collective bargaining at the USPS, a major omission considering that <mark>personnel</mark> accounts for 80 percent of the agency&#x27;s costs.", "z": "美国邮政局的集体谈判机制没有任何变化，考虑到<mark>人员</mark>开支占该机构成本的80%，这是一项重大疏漏。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2165, "w": "phase", "f": 2, "m": "phas-（显现、呈现的状态）+e（拼写结尾）", "s": [{"d": "1. v. 分阶段引入、逐步实施（phase in）（2）", "e": "In 2007, Indonesia started <mark>phasing</mark> in a program that gives money to its poorest residents under certain conditions, such as requiring people to keep kids in school or get regular medical care.", "z": "2007年，印度尼西亚开始<mark>逐步推行</mark>一项计划，在特定条件下向最贫困的居民发放现金，例如要求他们让孩子继续上学，或定期接受医疗服务。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2166, "w": "philosopher", "f": 2, "m": "philosoph（哲学；philosophy去y）+-er（从事者）", "s": [{"d": "1. n. 哲学家（2）", "e": "Ancient Greek <mark>philosopher</mark> Aristotle viewed laughter as &quot;a bodily exercise precious to health.&quot;", "z": "古希腊<mark>哲学家</mark>亚里士多德把笑看作“一种对健康宝贵的身体锻炼”。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 2167, "w": "physicist", "f": 2, "m": "physic-（physics的词干，物理学）+-ist（从事者）", "s": [{"d": "1. n. 物理学家（2）", "e": "As a result, scientists - <mark>physicists</mark> in particular - found themselves in high demand.", "z": "因此，科学家，尤其是<mark>物理学家</mark>，发现社会对他们的需求很大。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2168, "w": "pile", "f": 2, "m": "pil（柱状堆叠）+e（词形结尾）", "s": [{"d": "1. v. 堆积；堆放（1）", "e": "[ B ] <mark>piling</mark>", "z": "[B] <mark>堆积</mark>", "r": "2016 · 英语一 · 完形填空 · 第 9 题 · 选项 B · 真题选项"}, {"d": "2. v. 蜂拥进入（1）", "e": "The best lawyers made skyscrapers-full of money, tempting ever more students to <mark>pile</mark> into law schools.", "z": "顶尖律师赚的钱能堆满摩天大楼，诱使越来越多的学生<mark>蜂拥进入</mark>法学院。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2169, "w": "pipe", "f": 2, "m": "", "s": [{"d": "1. n. 管道（2）", "e": "A string of accidents, including the partial collapse of a cooling tower in 2007 and the discovery of an underground <mark>pipe</mark> system leakage, raised serious questions about both Vermont Yankee&#x27;s safety and Entergy&#x27;s management -especially after the company made misleading statements about the <mark>pipe</mark>.", "z": "一连串事故，包括2007年一座冷却塔的部分坍塌和后来发现的地下<mark>管道</mark>系统泄漏，使人们对佛蒙特扬基核电站的安全性与安特吉公司的管理提出严重质疑，尤其是在该公司就<mark>管道</mark>问题作出误导性陈述之后。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2170, "w": "pit", "f": 2, "m": "", "s": [{"d": "1. n. 剧场正厅后排（旧时廉价站席）（1）", "e": "By the time that Shakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once popular and literary; Kyd had written a tragedy that crowded the <mark>pit</mark>; and Marlowe had brought poetry and genius to triumph on the common stage - where they had played no part since the death of Euripides.", "z": "莎士比亚二十五岁时，利利、皮尔和格林已创作出既受大众欢迎又有文学性的喜剧；基德写出了一部使剧场<mark>廉价站席</mark>挤满观众的悲剧；马洛则让诗歌与天才在普通舞台上大获成功，而自欧里庇得斯去世以来，它们一直未能在那里发挥作用。", "r": "2018 · 英语一 · 阅读理解 C · 第 48、49 题"}, {"d": "2. n. 坑、深坑（1）", "e": "The nail hoard was discovered in 1960 in a four-metre-deep <mark>pit</mark> covered by two metres of gravel.", "z": "这批藏匿的钉子于1960年在一个四米深、覆盖着两米厚砾石的<mark>坑</mark>里被发现。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2171, "w": "plane", "f": 2, "m": "", "s": [{"d": "1. n. 层面（1）", "e": "It took place on many different <mark>planes</mark>: between Napoleon&#x27;s French army and the angry inhabitants; between the British, ever keen to exacerbate the emperor&#x27;s difficulties, and the marshals sent from Paris to try to keep them in check; between new forces of science and meritocracy and old ones of conservatism and birth.", "z": "它发生在许多不同的<mark>层面</mark>上：拿破仑的法国军队与愤怒的居民之间；一心想加剧这位皇帝困境的英国人与从巴黎派来、试图遏制英国人的元帅们之间；以及科学和任人唯贤的新力量与保守主义和出身门第的旧力量之间。", "r": "2022 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "2. n. 飞机（1）", "e": "If, like most business people, you spend your life dashing from office to <mark>plane</mark>, train to home, boardroom to washroom, what you really need to do is stay in more, sit down - and read a book.", "z": "如果你像大多数商界人士一样，终日从办公室赶往<mark>飞机</mark>、从火车赶回家、从董事会议室赶去洗手间，那么你真正需要做的，是多待一会儿，坐下来读一本书。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 2172, "w": "plateau", "f": 2, "m": "plat（平的）+eau（本词名词结尾）", "s": [{"d": "1. n. 稳定阶段；平台期（1）", "e": "Workers __19__ to be diligent for the first few days of the week in any case, before __20__ a <mark>plateau</mark> and then slackening off.", "z": "无论如何，工人在一周的头几天__19__表现勤奋，之后__20__<mark>稳定阶段</mark>，再随后逐渐松懈。", "r": "2010 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. n. 趋于稳定（1）", "e": "&quot;While there is some optimism that emerging countermeasures and best practices may see piracy begin to <mark>plateau</mark> by 2027, there is no consensus among stakeholders as to when it may begin to decline,&quot; says analyst Steve Hawley.", "z": "分析师史蒂夫·霍利说：“虽然有人乐观地认为，新出现的应对措施和最佳实践可能让盗版活动到2027年开始<mark>趋于稳定</mark>，但各方对于它何时会开始减少，并没有共识。”", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题 原表义项待核：本例中为动词“趋于稳定”。"}]}, {"id": 2173, "w": "plead", "f": 2, "m": "plea（请求、恳求）+d（本词保留词形结尾）", "s": [{"d": "1. v. 恳求、呼吁（2）", "e": "Only Ukip, sensing its chance, has sided with those <mark>pleading</mark> for a more considered approach to using green land.", "z": "只有英国独立党察觉到了机会，站在那些<mark>呼吁</mark>以更审慎的方式使用绿地的人一边。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2174, "w": "polish", "f": 2, "m": "", "s": [{"d": "1. adj. 波兰的（1）", "e": "A <mark>Polish</mark> digital artist who uses classical painting styles to create dreamy fantasy landscapes, Greg Rutkowski has made illustrations for games such as Dungeons &amp; Dragons and Magic: The Gathering.", "z": "格雷格·鲁特科夫斯基是一位<mark>波兰</mark>数字艺术家，用古典绘画风格创作梦幻般的幻想景观，曾为《龙与地下城》和《万智牌》等游戏绘制插图。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 擦亮剂；鞋油（1）", "e": "The family&#x27;s increasing poverty forced Dickens out of school at age 12 to work in Warren&#x27;s Blacking Warehouse, a shoe-<mark>polish</mark> factory, where the other working boys mocked him as &quot;the young gentleman.&quot;", "z": "家庭日益贫困迫使狄更斯在12岁时辍学，到沃伦鞋油仓库这家<mark>鞋油</mark>厂工作，其他做工的男孩在那里嘲笑他是“小绅士”。", "r": "2017 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 2175, "w": "pollutant", "f": 2, "m": "pollute（污染，去e）+-ant（物质）", "s": [{"d": "1. n. 污染物（2）", "e": "The reality is that water, and the <mark>pollutants</mark> that so often come with it, don&#x27;t respect state boundaries.", "z": "现实是，水以及常常随水而来的<mark>污染物</mark>并不会顾及州界。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2176, "w": "portable", "f": 2, "m": "port（携带、运送）+-able（能够……的）", "s": [{"d": "1. adj. 便携的；可移动的（2）", "e": "But exposure times were much quicker by the 1880s, and the introduction of the Box Brownie and other <mark>portable</mark> cameras meant that, though slow by today&#x27;s digital standards, the exposure was almost instantaneous.", "z": "但到19世纪80年代，曝光时间已大大缩短；布朗尼方盒相机和其他<mark>便携</mark>相机的出现意味着，尽管按今天的数字标准来看仍然很慢，当时的曝光几乎已是瞬间完成的。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2177, "w": "portray", "f": 2, "m": "por-（呈现出来）+tray（画、描绘）", "s": [{"d": "1. v. 描绘；刻画（2）", "e": "Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while <mark>portraying</mark> conservative or classical liberal ideas - such as free markets and self-reliance - as falling outside the boundaries of routine, and sometimes legitimate, intellectual investigation.", "z": "如今，教授们通常将进步主义的历史解释和公共政策视为适当的研究对象，却把自由市场、自力更生等保守主义或古典自由主义思想<mark>描绘</mark>为超出常规知识探究范围、有时甚至不具正当性的东西。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2178, "w": "possession", "f": 2, "m": "possess（占有、拥有）+-ion（状态、权利或相关事物的名词后缀）", "s": [{"d": "1. n. 拥有；占有（2）", "e": "But this distinction misses the point that it is processing and aggregation, not the mere <mark>possession</mark> of bits, that gives the data value.", "z": "但这种区分忽略了关键之处：赋予数据价值的是处理与汇总，而不是仅仅<mark>占有</mark>一些数据位。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2179, "w": "postpone", "f": 2, "m": "post-（后）+pon（放置）+e（词形结尾）", "s": [{"d": "1. v. 推迟（2）", "e": "[ D ] <mark>postpone</mark>", "z": "［D］<mark>推迟</mark>。", "r": "2016 · 英语一 · 完形填空 · 第 3 题 · 选项 D · 真题选项"}]}, {"id": 2180, "w": "precede", "f": 2, "m": "pre-（在前）+ced（走）+e（词形结尾）", "s": [{"d": "1. v. 优先于（1）", "e": "The Constitutional principles that Washington alone has the power to &quot;establish a uniform Rule of Naturalization&quot; and that federal laws <mark>precede</mark> state laws are noncontroversial.", "z": "只有联邦政府有权“制定统一的归化规则”，以及联邦法律<mark>优先于</mark>州法律，这两项宪法原则并无争议。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 先于（1）", "e": "[ C ] <mark>precedes</mark>", "z": "[C] <mark>先于</mark>。", "r": "2011 · 英语一 · 完形填空 · 第 14 题 · 选项 C · 真题选项"}]}, {"id": 2181, "w": "precious", "f": 2, "m": "preci（价值）+-ous（具有这种性质的）", "s": [{"d": "1. adj. 珍贵的；宝贵的（2）", "e": "Ancient Greek philosopher Aristotle viewed laughter as &quot;a bodily exercise <mark>precious</mark> to health.&quot;", "z": "古希腊哲学家亚里士多德把笑看作“一种对健康<mark>宝贵</mark>的身体锻炼”。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 2182, "w": "predecessor", "f": 2, "m": "pre-（在前）+de-（离开）+cess（走）+-or（人）", "s": [{"d": "1. n. 前任；前辈（2）", "e": "Thankfully, there are signs that this is already happening, with Generation Z seeking to learn from their millennial <mark>predecessors</mark>, even if parents and teachers tend to be still set in the degree mindset.", "z": "值得庆幸的是，有迹象表明这已经在发生：Z世代正试图向千禧一代<mark>前辈</mark>学习，尽管家长和教师往往仍固守着学历至上的思维模式。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2183, "w": "prediction", "f": 2, "m": "predict（预测）+ion（行为、结果）", "s": [{"d": "1. n. 预测；预言（2）", "e": "They reimagined the 300-year-old score by injecting the latest climate <mark>prediction</mark> data for each season-provided by Monash University&#x27;s Climate Change Communication Research Hub.", "z": "他们为这份有300年历史的乐谱注入了由莫纳什大学气候变化传播研究中心提供的各季最新气候<mark>预测</mark>数据，从而对其进行了重新创作。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2184, "w": "pregnant", "f": 2, "m": "pre-（在前）+gn（生育、出生）+-ant（处于这种状态的）", "s": [{"d": "1. adj. 怀孕的（2）", "e": "There are also stories about newly adoptive - and newly single - mom Sandra Bullock, as well as the usual &quot;Jennifer Aniston is <mark>pregnant</mark>&quot; news.", "z": "还有一些报道涉及刚收养孩子、又刚恢复单身的母亲桑德拉·布洛克，以及常见的“詹妮弗·安妮斯顿<mark>怀孕</mark>了”的新闻。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2185, "w": "prejudice", "f": 2, "m": "pre-（预先）+jud（判断）+-ice（名词词尾；整词也可作动词）", "s": [{"d": "1. n. 偏见；成见（2）", "e": "Divorced persons may remarry, but a gender <mark>prejudice</mark> __19__ up: The divorced male doesn&#x27;t have a waiting period before he can remarry __20__ the woman must wait ten months.", "z": "离婚者可以再婚，但性别<mark>偏见</mark>__19__出来了：离婚男性再婚前无需等待，__20__女性必须等十个月。", "r": "2016 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2186, "w": "prime", "f": 2, "m": "prim（第一、首要）+e（词形结尾）", "s": [{"d": "1. adj. 首要的、主要的（1）", "e": "[ B ] Feasibility should be a <mark>prime</mark> concern in policymaking.", "z": "[B] 可行性应是制定政策时<mark>首要</mark>考虑的事项。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 35 题 · 选项 B · 真题选项"}, {"d": "2. n. 全盛时期、盛年（1）", "e": "When Hoffa&#x27;s Teamsters were in their <mark>prime</mark> in 1960, only one in ten American government workers belonged to a union; now 36% do.", "z": "1960年，霍法领导的卡车司机工会处于<mark>全盛时期</mark>，当时美国政府雇员中只有十分之一加入工会；如今这一比例为36%。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2187, "w": "principal", "f": 2, "m": "prin（第一、首要）+cip（取）+-al（相应性质，也可指人或物）", "s": [{"d": "1. adj. 主要的；首要的（2）", "e": "(47) The United States is the product of two <mark>principal</mark> forces -the immigration of European peoples with their varied ideas, customs, and national characteristics and the impact of a new country which modified these traits.", "z": "（47）美国是两股<mark>主要</mark>力量共同作用的产物：一股是欧洲各民族的移民，他们带来了各不相同的思想、习俗和民族特征；另一股是新国度的影响，这种影响改变了这些特征。", "r": "2015 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 2188, "w": "prioritize", "f": 2, "m": "priority（去y，优先、优先事项）+-ize（使形成相应安排）", "s": [{"d": "1. v. 优先安排、优先考虑（2）", "e": "They did not always <mark>prioritize</mark> the protection of Mauna Kea&#x27;s fragile ecosystems or its holiness to the island&#x27;s inhabitants.", "z": "他们并非始终<mark>优先</mark>保护莫纳克亚山脆弱的生态系统，或<mark>优先</mark>尊重它在岛上居民心中的神圣地位。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2189, "w": "privileged", "f": 2, "m": "privilege（去e，给予特权）+ed（已经获得这种待遇的）", "s": [{"d": "1. adj. 享有特权的；优越的（2）", "e": "On the overturned provisions the majority held Congress had deliberately &quot;occupied the field&quot; and Arizona had thus intruded on the federal&#x27;s <mark>privileged</mark> powers.", "z": "对于被推翻的那些条款，多数法官认为，国会已经有意“占据了这一领域”，因此亚利桑那州侵犯了联邦政府的<mark>专属</mark>权力。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2190, "w": "processing", "f": 2, "m": "process（处理、加工）+-ing（正在开展的动作）", "s": [{"d": "1. v. 处理;加工（2）", "e": "A number of companies, particularly in energy and transportation, use AI image <mark>processing</mark> technology to inspect infrastructure and prevent equipment failure or leaks before they happen.", "z": "许多公司，尤其是能源和交通运输行业的公司，利用人工智能图像<mark>处理</mark>技术检查基础设施，在设备故障或泄漏发生前加以预防。", "r": "2021 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 2191, "w": "promotion", "f": 2, "m": "promot-（promote去e，促进）+-ion（名词后缀）", "s": [{"d": "1. n. 推广；促销（1）", "e": "The new awards are an exercise in self-<mark>promotion</mark> for those behind them, say scientists.", "z": "科学家们说，这些新奖项是其幕后推动者进行自我<mark>宣传</mark>的活动。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 晋升，升职（1）", "e": "(50) Just as the code breaking has its wider relevance in the struggle for Spain, so his attempts to make his way up the <mark>promotion</mark> ladder speak volumes about British society.", "z": "（50）正如破译密码 const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {

            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">

              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
