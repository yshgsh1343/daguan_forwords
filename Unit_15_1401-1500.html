<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 15 (1401-1500) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

的；通过网络提供的（4）", "e": "From the early days of broadband, advocates for consumers and <mark>web-based</mark> companies worried that the cable and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#x27;.", "z": "从宽带发展初期起，消费者和<mark>互联网</mark>公司的权益倡导者就担心，出售宽带连接服务的有线电视和电话公司，既有能力也有动机优待关联网站，而将竞争对手的网站置于不利地位。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1426, "w": "wellbeing", "f": 4, "m": "well（好）+being（存在；生活状态）", "s": [{"d": "1. n. 福祉；身心健康（4）", "e": "Chaudhary said that parents now had less childcare support from family and social networks than during most of humans&#x27; evolutionary history, but introducing additional caregivers could reduce stress and maternal depression, which could have a &quot;knock-on&quot; benefit to a child&#x27;s <mark>wellbeing</mark>.", "z": "乔杜里说，如今父母从家庭和社会网络获得的育儿支持，比人类进化史上大多数时期都少；但引入额外照护者可以减轻压力和产妇抑郁，从而对孩子的<mark>身心健康</mark>产生“连带”益处。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1427, "w": "whereas", "f": 4, "m": "where（在……处）+as（如同；鉴于）", "s": [{"d": "1. conj. 然而；而（表示对比）（4）", "e": "In all, the study concludes that <mark>whereas</mark> prosecutors should only evaluate a case based on its merits, they do seem to be influenced by a company&#x27;s record in CSR.", "z": "总的来说，这项研究得出的结论是：检察官本应仅依据案件本身的是非曲直作出评估，<mark>然而</mark>，他们似乎确实会受到企业社会责任方面的过往表现的影响。", "r": "2016 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1428, "w": "worldwide", "f": 4, "m": "world（世界）+wide（范围广阔的）", "s": [{"d": "1. adj. 全世界的、在全世界（4）", "e": "They&#x27;re already used in dozens of countries <mark>worldwide</mark>.", "z": "它们已经在<mark>世界各地</mark>几十个国家投入使用。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1429, "w": "absence", "f": 3, "m": "absent（去掉词尾ent，缺席的、不存在的）+-ence（状态）", "s": [{"d": "1. n. 缺乏；不存在（3）", "e": "We have no land ethic yet, (47) but we have at least drawn nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or <mark>absence</mark> of economic advantage to us.", "z": "我们尚未形成土地伦理，但我们至少更接近承认这样一个观点：鸟类的存续属于其固有权利的问题，而不论它们<mark>能否</mark>给我们带来经济利益。", "r": "2010 · 英语一 · 阅读理解 C · 第 47 题"}]}, {"id": 1430, "w": "absolute", "f": 3, "m": "ab-（离开）+solut（松开、解开）+e（拼写结尾）", "s": [{"d": "1. adj. 绝对的（3）", "e": "France, which prides itself as the global innovator of fashion, has decided its fashion industry has lost an <mark>absolute</mark> right to define physical beauty for women.", "z": "以全球时尚创新者自居的法国认定，本国时尚业已经丧失了定义女性形体美的<mark>绝对</mark>权利。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1431, "w": "absolutely", "f": 3, "m": "absolute（绝对的、完全的、确实的）+-ly（达到这种程度、以这种语气）", "s": [{"d": "1. adv. 完全；绝对（3）", "e": "Nothing is <mark>absolutely</mark> safe, anywhere.", "z": "任何地方都没有任何事物是<mark>绝对</mark>安全的。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1432, "w": "abundant", "f": 3, "m": "ab-（向外）+und（波浪、流动）+-ant（具有相应状态的）", "s": [{"d": "1. adj. 丰富的、充足的（3）", "e": "Here was <mark>abundant</mark> fuel and lumber.", "z": "这里有<mark>丰富</mark>的燃料和木材。", "r": "2015 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1433, "w": "accident", "f": 3, "m": "ac-（向）+cid-（落下、发生）+ent（发生的事）", "s": [{"d": "1. n. 偶然事件（1）", "e": "Stand in the shoes of scientists and witness the degree to which breakthroughs emerge from <mark>accidents</mark>, conflict and sheer mental stamina.", "z": "站在科学家的立场上，看看突破在多大程度上源于<mark>偶然事件</mark>、冲突和纯粹的精神耐力。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}, {"d": "2. n. 偶然（byaccident）（1）", "e": "Most archaeological sites have been located by means of careful searching, while many others have been discovered by <mark>accident</mark>.", "z": "大多数考古遗址通过细致搜寻得到定位，还有许多则是<mark>偶然</mark>发现的。", "r": "2014 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 A · 真题选项"}, {"d": "3. n. 意外事故（1）", "e": "A string of <mark>accidents</mark>, including the partial collapse of a cooling tower in 2007 and the discovery of an underground pipe system leakage, raised serious questions about both Vermont Yankee&#x27;s safety and E ermanently decreased demand for its <mark>bread</mark>-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.", "z": "从根本上说，美国邮政署正陷入一场历史性的两面夹击：技术变革永久性地降低了对其<mark>主要收入来源</mark>--一类邮件--的需求，而监管结构又剥夺了管理层调整运营以适应新现实的灵活性。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 生计来源（where your breadis buttered）（1）", "e": "You need to remember where your <mark>bread</mark> is buttered.&quot;", "z": "你得记住自己的<mark>饭碗靠谁</mark>。”", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. n. 面包（1）", "e": "This means that people should __7__ crisping their roast potatoes, reject thin-crust pizzas and only __8__ toast their <mark>bread</mark>.", "z": "这意味着，人们应当____把烤土豆烤脆，拒绝薄饼皮比萨，并且只____烘烤<mark>面包</mark>。", "r": "2020 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1465, "w": "bright", "f": 3, "m": "", "s": [{"d": "1. adj. 光明的；乐观的（1）", "e": "[ A ] The Ever-<mark>bright</mark> Prospects of Mankind.", "z": "［A］人类始终<mark>光明</mark>的前景。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 35 题 · 选项 A · 真题选项"}, {"d": "2. adj. 聪明的（1）", "e": "Second, they are mostly <mark>bright</mark> and well-educated.", "z": "其次，他们大多<mark>聪明</mark>且受过良好的教育。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. adj. 鲜艳的（1）", "e": "In the 1960s, the Italian artist Piero Gilardi began to create hundreds of <mark>bright</mark>, colorful foam pieces.", "z": "20世纪60年代，意大利艺术家皮耶罗·吉拉尔迪开始创作数百件色彩<mark>鲜艳</mark>、丰富的泡沫作品。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1466, "w": "broadcast", "f": 3, "m": "broad（广阔的、广泛的）+cast（投出）", "s": [{"d": "1. n. 广播；播出（1）", "e": "People report that <mark>broadcast</mark> music made workmen whistle new tunes.", "z": "有人报告说，<mark>广播</mark>中的音乐使工人吹起了新曲调。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 公开宣扬（1）", "e": "<mark>Broadcasting</mark> his ambition was &quot;very much my decision,&quot; McGee says.", "z": "麦基说，<mark>公开宣扬</mark>自己的抱负“完全是我自己的决定”。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 广播；播出（1）", "e": "True: for more than 80 pre-digital years, linear speech <mark>broadcasting</mark> brought the gift of serendipity, random enlivening of a car journey or dull manual task.", "z": "确实，在数字时代之前的八十多年里，按固定顺序播放的语言<mark>广播</mark>带来了意外发现的乐趣，不时为汽车旅途或枯燥的体力劳动增添生气。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1467, "w": "brush", "f": 3, "m": "", "s": [{"d": "1. n. 刷子（3）", "e": "A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and &quot;talking on the <mark>brush</mark> handle&quot;.", "z": "一名妇女说，自从有了收音机，街头打斗减少了，但人们停下脚步、“扶着<mark>扫帚</mark>柄聊天”的情况也少了。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1468, "w": "cable", "f": 3, "m": "", "s": [{"d": "1. n. 有线电视（3）", "e": "From the early days of broadband, advocates for consumers and web-based companies worried that the <mark>cable</mark> and phone companies selling broadband connections had the power and incentive to favor affiliated websites over their rivals&#x27;.", "z": "从宽带发展初期起，消费者和互联网公司的权益倡导者就担心，出售宽带连接服务的<mark>有线电视</mark>和电话公司，既有能力也有动机优待关联网站，而将竞争对手的网站置于不利地位。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1469, "w": "capability", "f": 3, "m": "capabil-（capable的词干形式，有能力的）+ity（性质、状态）", "s": [{"d": "1. n. 能力；才干（3）", "e": "Indeed, in &quot;An International Perspective on New Zealand&#x27;s Productivity Paradox&quot; (2014), the Productivity Commission singled out the low quality of managerial <mark>capabilities</mark> as a cause of the country&#x27;s poor productivity growth record.", "z": "的确，在2014年的《从国际视角看新西兰的生产率悖论》中，生产率委员会特别指出，管理<mark>能力</mark>不足是该国生产率增长表现不佳的一个原因。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1470, "w": "capitalism", "f": 3, "m": "capital（资本）+-ism（制度、主义）", "s": [{"d": "1. n. 资本主义（3）", "e": "This has been dubbed &quot;quarterly <mark>capitalism</mark>.&quot;", "z": "这被称为“季度<mark>资本主义</mark>”。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1471, "w": "catalog", "f": 3, "m": "cata-（逐一、向下）+log（述说、列举）", "s": [{"d": "1. n. 目录（2）", "e": "But another, related force - a policy often buried deep in course <mark>catalogs</mark> called &quot;grade forgiveness&quot; - is helping raise GPAs.", "z": "但另一个相关的推动力量--一种往往深藏于课程<mark>目录</mark>、名为“成绩宽免”的政策--正在帮助提高平均绩点。", "r": "2019 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 汇集（大量作品）（1）", "e": "Of course, I need to concede that my collection of &#x27;Smiling Victorians&#x27; makes up only a tiny percentage of the vast <mark>catalogue</mark> of photographic portraiture created between 1840 and 1900, the majority of which show sitters posing miserably and stiffly in front of painted backdrops, or staring absently into the middle distance.", "z": "当然，我得承认，我收集的“微笑的维多利亚时代人”只占1840年至1900年间创作的<mark>大量肖像摄影作品</mark>中的极小一部分；其中大多数照片里，拍摄对象都在绘制的背景前愁眉苦脸、僵硬地摆着姿势，或者心不在焉地凝视着不远不近的地方。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1472, "w": "caution", "f": 3, "m": "caut（小心、警惕）+-ion（状态、行为或相关内容的名词后缀）", "s": [{"d": "1. n. 谨慎、小心（2）", "e": "But for all the reasons there are to celebrate the computer, we must also act with <mark>caution</mark>.", "z": "但是，无论有多少理由值得我们赞美计算机，我们仍必须<mark>谨慎</mark>行事。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}, {"d": "2. n. 告诫、提醒（1）", "e": "Glenn Branch, the centre&#x27;s deputy director, <mark>cautions</mark> that setting state-level science standards is only one limited benchmark in a country that decentralises decisions to local school boards.", "z": "该中心副主任格伦·布兰奇<mark>提醒</mark>说，在一个将决策权下放给地方学校董事会的国家，制定州级科学标准只是一项作用有限的衡量指标。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题 原表义项待核：本例中为动词“提醒”。"}]}, {"id": 1473, "w": "ceremony", "f": 3, "m": "cere（关心、在意）+-mony（状态、行为）", "s": [{"d": "1. n. 仪式、典礼（3）", "e": "In your email you should include time, place and other relevant information about the <mark>ceremony</mark>.", "z": "你应在邮件中写明<mark>仪式</mark>的时间、地点以及其他相关信息。", "r": "2018 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 1474, "w": "certainly", "f": 3, "m": "certain（一定的、确信的）+-ly（副词后缀）", "s": [{"d": "1. adv. 当然、确实（3）", "e": "<mark>Certainly</mark>, our shops are exceptionally busy.", "z": "<mark>当然</mark>，我们的商店异常繁忙。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1475, "w": "chancellor", "f": 3, "m": "", "s": [{"d": "1. n. 英国财政大臣（3）", "e": "What prompted the <mark>chancellor</mark> to develop his scheme?", "z": "是什么促使<mark>财政大臣</mark>制定这项方案？", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 23 题"}]}, {"id": 1476, "w": "classify", "f": 3, "m": "class（类别、等级）+-ify（使成为）", "s": [{"d": "1. v. 分类；归类（3）", "e": "In signing the measure, California Governor Jerry Brown admitted that the law, which expressly <mark>classifies</mark> people on the basis of sex, is probably unconstitutional.", "z": "加州州长杰里·布朗在签署这项措施时承认，这部明确依据性别对人进行<mark>分类</mark>的法律，很可能违宪。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1477, "w": "clock", "f": 3, "m": "", "s": [{"d": "1. n. 全天候（round/around theclock）（1）", "e": "No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with round-the-<mark>clock</mark> help) is a piece of cake.", "z": "考虑到没有伴侣可以依靠时抚养孩子是多么辛苦，这并不令人震惊；但听桑德拉和布兰妮的说法，“独自”养孩子（意思是：有人<mark>全天候</mark>帮忙）简直是小菜一碟。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 生物钟（1）", "e": "It assumes, falsely, that the economic parts of the biotic <mark>clock</mark> will function without the uneconomic parts.", "z": "它错误地假定，生物这座<mark>时钟</mark>中具有经济价值的部件，即便缺少没有经济价值的部件也能运转。", "r": "2010 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "3. n. 钟、计时器（1）", "e": "For example, the Long Now Foundation has as its flagship project a mechanical <mark>clock</mark> that is designed to still be marking time thousands of years hence.", "z": "例如，长远基金会的旗舰项目是一座机械<mark>钟</mark>，其设计目标是在从现在起数千年后仍能记录时间。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1478, "w": "clothes", "f": 3, "m": "cloth（衣料）+es（本词固定的复数形式结尾）", "s": [{"d": "1. n. 衣服（3）", "e": "Buy all your <mark>clothes</mark> at once with a stylist instead of shopping alone, one article of clothing at a time.", "z": "与造型师一起一次性买齐所有<mark>衣服</mark>，而不要独自购物，每次只买一件衣物。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1479, "w": "clothing", "f": 3, "m": "clothe（给……穿衣，去e）+-ing（衣物的集合）", "s": [{"d": "1. n. 衣服；服装（3）", "e": "Buy all your clothes at once with a stylist instead of shopping alone, one article of <mark>clothing</mark> at a time.", "z": "与造型师一起一次性买齐所有衣服，而不要独自购物，每次只买一件<mark>衣物</mark>。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1480, "w": "cloud", "f": 3, "m": "", "s": [{"d": "1. n. 云（1）", "e": "(47) Our mental health doesn&#x27;t really go anywhere; like the sun behind a <mark>cloud</mark>, it can be temporarily hidden from view, but it is fully capable of being restored in an instant.", "z": "（47）我们的心理健康并没有真正消失；它就像藏在<mark>云</mark>后的太阳，可能暂时从视野中隐去，却完全能够在一瞬间恢复。", "r": "2016 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "2. n. 云端（计算技术）（1）", "e": "The development of &quot;<mark>cloud</mark> computing&quot;, meanwhile, has made that exploration so much the easier.", "z": "与此同时，“<mark>云</mark>计算”的开发使这种探索容易得多。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 使蒙上阴影（1）", "e": "A turbulent business environment also has senior managers cautious of letting vague pronouncements <mark>cloud</mark> their reputations.", "z": "动荡的商业环境也使高管们格外谨慎，避免让含糊的声明给自己的声誉<mark>蒙上阴影</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1481, "w": "collaborate", "f": 3, "m": "col-（共同、一起）+labor（劳动、工作）+ate（动词后缀）", "s": [{"d": "1. v. 合作（3）", "e": "(50) They pool resources, <mark>collaborate</mark>, think outside the box, and find solutions and ways around obstacles to explore science for the sake of science without the traditional boundaries of working inside a formal setting.", "z": "（50）他们汇集资源、相互<mark>合作</mark>、跳出思维框架，寻找解决办法和绕开障碍的途径，为科学本身而探索科学，不受正式机构工作方式的传统界限约束。", "r": "2025 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1482, "w": "collaborative", "f": 3, "m": "collaborate（去掉末尾e，合作、一起工作）+-ive（具有这种性质的）", "s": [{"d": "1. adj. 协作的；合作的（3）", "e": "AI can be a <mark>collaborative</mark> tool in a wide range of creative endeavors.", "z": "人工智能可以成为广泛范围内各种创造性活动的<mark>协作</mark>工具。", "r": "2026 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1483, "w": "combination", "f": 3, "m": "combin-（combine去e，结合）+-ation（名词后缀）", "s": [{"d": "1. n. 组合；结合（3）", "e": "Their reactions may be a complex <mark>combination</mark> of instant reflexes, input from past driving experiences, and what their eyes and ears tell them in that moment.", "z": "他们的反应可能是即时反射、以往驾驶经验提供的信息，以及当时眼睛和耳朵传递的信息的复杂<mark>结合</mark>。", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1484, "w": "command", "f": 3, "m": "com-（加强）+mand（交付、命令）", "s": [{"d": "1. v. 拥有；获得/引起（权威、关注等）（2）", "e": "(49) It wasn&#x27;t until the phrase &quot;scientific literacy&quot; came along in the 1940s that science had the formidable slogan it needed to <mark>command</mark> public attention and make improving science education an important national goal.", "z": "（49）直到20世纪40年代“科学素养”一词出现，科学才拥有了所需的强有力口号，足以<mark>吸引</mark>公众关注，并让改善科学教育成为一项重要的国家目标。", "r": "2026 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "2. v. 指挥；控制（1）", "e": "&quot;They __10__ claimed that plants have &#x27;brain-like <mark>command</mark> centers&#x27; at their root tips.&quot;", "z": "“他们____声称，植物的根尖具有‘类似大脑的<mark>指挥</mark>中心’。”", "r": "2022 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文 原表义项待核：本例中为名词作定语“指挥”。"}]}, {"id": 1485, "w": "completely", "f": 3, "m": "complete（完整的、完成的）+-ly（达到这种程度）", "s": [{"d": "1. adv. 完全地；彻底地（3）", "e": "Now the nation&#x27;s top patent court appears <mark>completely</mark> ready to scale back on business-method patents, which have been controversial ever since they were first authorized 10 years ago.", "z": "如今，美国最高专利法院似乎已<mark>完全</mark>准备好缩减商业方法专利的范围；此类专利自十年前首次获得授权以来，就一直存在争议。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1486, "w": "comprehension", "f": 3, "m": "com-（一起、完整地）+prehens-（抓住）+-ion（过程、能力或状态的名词后缀）", "s": [{"d": "1. n. 理解；领悟（3）", "e": "The ways of reading indicated here are without doubt kinds of <mark>comprehension</mark>.", "z": "这里指出的阅读方式，无疑都是<mark>理解</mark>的形式。", "r": "2015 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 1487, "w": "concentrate", "f": 3, "m": "con-（一起）+centr（中心）+ate（使成为，也可表示相应产物）", "s": [{"d": "1. v. 集中注意力（2）", "e": "[ D ] <mark>Concentrating</mark> on real-life situations.", "z": "[D] <mark>关注</mark>现实生活中的情境。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 24 题 · 选项 D · 真题选项"}, {"d": "2. v. 集中（于某地）（1）", "e": "Ms Denham chose to <mark>concentrate</mark> the blame on the NHS trust, since under existing law it &quot;controlled&quot; the data and DeepMind merely &quot;processed&quot; it.", "z": "丹纳姆女士选择把责备<mark>集中</mark>在英国国民医疗服务体系信托机构身上，因为依照现行法律，该机构“控制”数据，而深度思维只是“处理”数据。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1488, "w": "conclusion", "f": 3, "m": "con-（一起、完全）+clus（关闭）+-ion（过程、结果的名词后缀）", "s": [{"d": "1. n. 结论（2）", "e": "&quot;Readers must have confidence in the <mark>conclusions</mark> published in our journal,&quot; writes McNutt in an editorial.", "z": "麦克纳特在一篇社论中写道：“读者必须对本刊发表的<mark>结论</mark>有信心。”", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 总之（inconclusion）（1）", "e": "[ A ] In <mark>conclusion</mark>", "z": "[A] <mark>总之</mark>", "r": "2024 · 英语一 · 完形填空 · 第 18 题 · 选项 A · 真题选项"}]}, {"id": 1489, "w": "conductor", "f": 3, "m": "conduct（引导、管理、指挥、传导）+-or（执行的人或起相应作用的物）", "s": [{"d": "1. n. 指挥家（2）", "e": "For my part, I have no idea whether Gilbert is a great <mark>conductor</mark> or even a good one.", "z": "就我而言，我不知道吉尔伯特是不是一位伟大的<mark>指挥家</mark>，甚至不知道他算不算一位优秀的<mark>指挥家</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 经营者（1）", "e": "[ C ] e-commerce <mark>conductors</mark>.", "z": "[C] 电子商务<mark>经营者</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 选项 C · 真题选项"}]}, {"id": 1490, "w": "confuse", "f": 3, "m": "con-（一起）+fus（流动、混合）+e（词形结尾）", "s": [{"d": "1. v. 使困惑；使糊涂（3）", "e": "It can be <mark>confusing</mark>.", "z": "这可能<mark>令人困惑</mark>。", "r": "20 ": "But __1__ some claims to the <mark>contrary</mark>, laughing probably has little influence on physical fitness.", "z": "但____一些<mark>相反</mark>的说法，笑对身体健康可能影响甚微。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1497, "w": "core", "f": 3, "m": "cor（心、中心）+e（词形结尾）", "s": [{"d": "1. n. 核心；中心部分（2）", "e": "The <mark>core</mark> of her successful defence was that she knew nothing.", "z": "她成功辩护的<mark>核心</mark>是，她对一切毫不知情。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 核心的（1）", "e": "Education, and not just knowledge gained on campus, will be a <mark>core</mark> part of Generation Z&#x27;s career trajectory.", "z": "教育将成为Z世代职业发展轨迹的<mark>核心</mark>部分，而且不只是校园里获得的知识。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1498, "w": "countryside", "f": 3, "m": "country（乡村）+side（区域、地方）", "s": [{"d": "1. n. 乡村（3）", "e": "They don&#x27;t make <mark>countryside</mark> any more, and every year concrete consumes more of it.", "z": "<mark>乡村</mark>土地不会再增加，而混凝土每年都在吞噬更多<mark>乡村</mark>土地。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1499, "w": "courage", "f": 3, "m": "cour（心）+age（品质、状态的名词结尾）", "s": [{"d": "1. n. 勇气（3）", "e": "His compositions demand the performer to show <mark>courage</mark>, for example in the use of dynamics.", "z": "他的作品要求演奏者展现<mark>勇气</mark>，例如在运用力度变化时。", "r": "2014 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 1500, "w": "crack", "f": 3, "m": "", "s": [{"d": "1. v. 严厉打击（crack down）（1）", "e": "With no video production costs, illegal streaming sites have achieved profit margins approaching 90%, according to the Motion Picture Association (MPA), a trade group representing Hollywood studios that&#x27;s working to <mark>crack</mark> down on the thousands of illegal platforms that have cropped up in recent years.", "z": "美国电影协会（MPA）称，由于无需承担视频制作成本，非法流媒体网站的利润率已接近90%；该协会代表好莱坞制片厂，正努力<mark>打击</mark>近年来涌现的数千家非法平台。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 立即着手（getcracking）（1）", "e": "In February the FTC and the Digital Adver const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
