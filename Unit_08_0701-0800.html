<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 08 (701-800) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

ing statements about the pipe.", "z": "一连串事故，包括2007年一座冷却塔的部分<mark>坍塌</mark>和后来发现的地下管道系统泄漏，使人们对佛蒙特扬基核电站的安全性与安特吉公司的管理提出严重质疑，尤其是在该公司就管道问题作出误导性陈述之后。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. n. 暴跌；大幅下降（1）", "e": "The Gutenberg printing press transformed civilisation not by changing the nature of writing but by changing its cost-and it would have achieved little without a parallel <mark>collapse</mark> in the price of surfaces to write on, thanks to an often-overlooked technology called paper.", "z": "古腾堡印刷机通过改变写作的成本，而非其性质，改变了文明；但如果没有一种经常被忽视、名叫纸的技术，使书写材料的价格同时<mark>暴跌</mark>，它也不会取得多大成就。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 707, "w": "collective", "f": 7, "m": "collect（聚集）+ive（形容词后缀）", "s": [{"d": "1. adj. 集体的；共同的（7）", "e": "The author holds that the current <mark>collective</mark> doctrine shows", "z": "作者认为，当前的<mark>集体</mark>信条表明", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 39 题"}]}, {"id": 708, "w": "combine", "f": 7, "m": "com-（一起）+bin（成双、两个）+e（拼写结尾）", "s": [{"d": "1. v. 结合；组合（7）", "e": "In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to <mark>combine</mark> labor and machines.", "z": "在以往技术发生剧烈变化的时代，企业家们通过构思将劳动力与机器相<mark>结合</mark>的方法，使过渡更加顺利。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 709, "w": "conscious", "f": 7, "m": "con-（一起）+sci（知道、认识）+-ous（处于这种状态的）", "s": [{"d": "1. adj. 意识到的；察觉到的（2）", "e": "This forces users to be more <mark>conscious</mark> of their role in passing along information.", "z": "这迫使用户更加清楚地<mark>意识到</mark>自己在传递信息中的作用。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 有意识的（与无意识相对）（2）", "e": "However, Allen believed that the unconscious mind generates as much action as the <mark>conscious</mark> mind, and (47) while we may be able to sustain the illusion of control through the <mark>conscious</mark> mind alone, in reality we are continually faced with a question: &quot;Why cannot I make myself do this or achieve that?&quot;", "z": "然而，艾伦认为，无意识心理引发的行为与<mark>有意识</mark>心理一样多；而且，（47）虽然我们也许能仅凭<mark>有意识</mark>心理维持掌控一切的错觉，但现实中，我们不断面临一个问题：“为什么我不能让自己做到这件事，或实现那个目标？”", "r": "2011 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "3. adj. 注重；关注……的（2）", "e": "Millennials, it seems, face the paradox of being the least formal generation yet the most <mark>conscious</mark> of style and personal branding.", "z": "千禧一代似乎面临着这样的悖论：他们最不拘礼，却最<mark>注重</mark>风格和个人品牌。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "4. adj. 自觉的；有意的（1）", "e": "In fact, (49) circumstances seem to be designed to bring out the best in us, and if we feel that we have been &quot;wronged&quot; then we are unlikely to begin a <mark>conscious</mark> effort to escape from our situation.", "z": "事实上，（49）环境似乎就是为了激发我们最好的一面而设计的；如果我们觉得自己受了“委屈”，就不太可能开始<mark>有意识</mark>地努力摆脱处境。", "r": "2011 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 710, "w": "constant", "f": 7, "m": "con-（加强）+stant（站立、站稳）", "s": [{"d": "1. adj. 持续不断的；经常发生的（5）", "e": "It needs <mark>constant</mark> guardianship.", "z": "它需要<mark>持续不断</mark>的守护。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 不变的事物（1）", "e": "Vanity is a <mark>constant</mark>; people will only start shopping more sustainably when they can&#x27;t afford not to.", "z": "虚荣是<mark>永恒不变</mark>的；只有当人们承担不起不这样做的代价时，才会开始以更可持续的方式购物。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. adj. 不变的（1）", "e": "(46) Those societies came out of the war with levels of enrollment that had been roughly <mark>constant</mark> at 3-5% of the relevant age groups during the decades before the war.", "z": "（46）战争结束时，这些社会的入学率仍与战前几十年间大致<mark>恒定</mark>的水平相同，即占相应年龄人群的百分之三至百分之五。", "r": "2021 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 711, "w": "contract", "f": 7, "m": "con-（一起）+tract（拉）", "s": [{"d": "1. n. 合同；契约；合约（5）", "e": "The premise was that the common law of <mark>contract</mark> lacked sufficient safeguards for workers against arbitrary conduct by management.", "z": "其前提是，普通<mark>合同</mark>法缺乏充分的保障措施，无法保护工人免受管理层任意行为的侵害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 通过合同约定排除适用（contractout of）（1）", "e": "In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and high-income employees to <mark>contract</mark> out of the unjustified dismissal regime.", "z": "在新西兰，2016年一项普通议员提出的法案试图允许企业与高收入雇员<mark>通过合同约定，排除</mark>不当解雇制度的适用。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 缩小；收缩；使缩小或收紧（1）", "e": "Those forced to exercise their smiling muscles __18__ more enthusiastically to funny cartoons than did those whose mouths were <mark>contracted</mark> in a frown, __19__ that expressions may influence emotions rather than just the other way around.", "z": "那些被迫锻炼微笑肌肉的人，对有趣漫画的____比那些嘴部<mark>收紧</mark>、皱眉的人更加热烈，____表情可能影响情绪，而并非只是情绪影响表情。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 712, "w": "count", "f": 7, "m": "", "s": [{"d": "1. v. 计算；计数（3）", "e": "Never mind the quality, then, <mark>count</mark> the number.", "z": "那么，别管质量了，<mark>数数量</mark>就行。", "r": "2019 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. n. 方面（1）", "e": "DNT does not seem an obviously huge selling point for windows 8 - though the firm has compared some of its other products favourably with Google&#x27;s on that <mark>count</mark> before.", "z": "DNT似乎并不是Windows 8一个特别突出的卖点，尽管这家公司以前曾在这一<mark>方面</mark>将自家其他一些产品与谷歌的产品比较，称前者更胜一筹。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 次数；数量（1）", "e": "[ A ] boost citation <mark>counts</mark> for certain authors.", "z": "[A] 提高某些作者的被引<mark>次数</mark>。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 38 题 · 选项 A · 真题选项"}, {"d": "4. v. 计入（1）", "e": "Grade forgiveness allows students to retake a course in which they received a low grade, and the most recent grade or the highest grade is the only one that <mark>counts</mark> in calculating a student&#x27;s overall GPA.", "z": "重修成绩替换制度允许学生重修成绩较低的课程，而在计算学生总体平均绩点时，只<mark>计入</mark>最近一次或最高的成绩。", "r": "2019 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "5. v. 算作；对……重要（1）", "e": "What <mark>counts</mark> as meaningful uploading?", "z": "什么才<mark>算得上</mark>有意义的创作与分享？", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 713, "w": "determine", "f": 7, "m": "de-（彻底、明确）+termin（term后加in，界限）+e（动词结尾）", "s": [{"d": "1. v. 决定；影响结果（3）", "e": "If circumstances always <mark>determined</mark> the life and prospects of people, then humanity would never have progressed.", "z": "如果环境总是<mark>决定</mark>人们的生活和前景，那么人类就永远不会取得进步。", "r": "2011 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "2. v. 确定；查明；判定（3）", "e": "It tells the fashion industry that it must take responsibility for the signal it sends women, especially teenage girls, about the social tape-measure they must use to <mark>determine</mark> their individual worth.", "z": "这告诉时尚界，它必须对向女性，尤其是青春期女孩传递的信号负责；这些信号涉及她们必须用来<mark>判定</mark>个人价值的社会“卷尺”。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 决心；决意（1）", "e": "Yet as we report now, the food police are <mark>determined</mark> that this __3__ should be rendered yet another guilty pleasure __4__ to damage our health.", "z": "然而，正如我们现在报道的，食品监管者<mark>决意</mark>让这种____变成又一种令人内疚的享受，____损害我们的健康。", "r": "2020 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 714, "w": "directly", "f": 7, "m": "direct（径直的）+-ly（副词后缀）", "s": [{"d": "1. adv. 直接地；径直地（7）", "e": "But Congress should look into doing so <mark>directly</mark>, by helping to finance PreCheck enrollment or to cut costs in other ways.", "z": "但国会应研究如何<mark>直接</mark>这样做，例如资助PreCheck预安检登记，或以其他方式降低成本。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 715, "w": "dynamics", "f": 7, "m": "dynam-（力、力量）+-ics（名词结尾）", "s": [{"d": "1. n. 动态过程；相互作用机制（6）", "e": "What is the essential element in the <mark>dynamics</mark> of social influence?", "z": "社会影响的<mark>作用机制</mark>中，关键要素是什么？", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 35 题"}, {"d": "2. n. 力度变化；强弱对比（1）", "e": "His compositions demand the performer to show courage, for example in the use of <mark>dynamics</mark>.", "z": "他的作品要求演奏者展现勇气，例如在运用<mark>力度变化</mark>时。", "r": "2014 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 716, "w": "ease", "f": 7, "m": "", "s": [{"d": "1. v. (使)缓解（7）", "e": "As so often is the case, stating that principle doesn&#x27;t <mark>ease</mark> the challenge of line-drawing.", "z": "正如常见的情况一样，陈述这一原则并不能<mark>缓解</mark>划定界线的难题。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 717, "w": "educational", "f": 7, "m": "education（教育）+-al（与……有关、具有相应作用的）", "s": [{"d": "1. adj. 教育的；与教育有关的（5）", "e": "There is no good reason that these artifacts should be beyond the ordinary reach of the <mark>educational</mark> objectives or inspiration of the generations to which they were left.", "z": "这些文物既然留给了后代，就没有充分理由让后代难以接触它们，无法借此实现通常的<mark>教育</mark>目标或获得启发。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. adj. 有教育意义的；有启发性的（2）", "e": "But she underestimates the <mark>educational</mark> value of zoos.", "z": "但她低估了动物园的<mark>教育</mark>价值。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 718, "w": "emotion", "f": 7, "m": "e-（向外）+mot（移动、触动）+-ion（状态的名词后缀）", "s": [{"d": "1. n. 情绪（7）", "e": "They also &quot;appear to be more comfortable writing in role … while [control] pupils imagine how they themselves would react to being shipwrecked, [target] children put themselves in the shoes of a literary character and express that character&#x27;s <mark>emotion</mark>&quot;.", "z": "他们还“似乎更擅长以角色的身份写作……当对照组学生想象自己遭遇海难时会如何反应时，实验组孩子会设身处地地成为一个文学人物，并表达该人物的<mark>情感</mark>”。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 719, "w": "emphasize", "f": 7, "m": "emphasis（强调，去词尾-is）+-ize（动词后缀）", "s": [{"d": "1. v. 强调；着重（7）", "e": "What does Hom <mark>emphasize</mark> in Paragraph 5?", "z": "霍姆在第五段<mark>强调</mark>了什么？", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 29 题"}]}, {"id": 720, "w": "employment", "f": 7, "m": "employ（雇用、使用）+-ment（行为、状态或相应事务）", "s": [{"d": "1. n. 就业（7）", "e": "Society also suffers from excessive <mark>employment</mark> protections.", "z": "社会也会因过度的<mark>就业</mark>保护而受到损害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 721, "w": "entrepreneur", "f": 7, "m": "", "s": [{"d": "1. n. 企业家（7）", "e": "In previous eras of drastic technological change, <mark>entrepreneurs</mark> smoothed the transition by dreaming up ways to combine labor and machines.", "z": "在以往技术发生剧烈变化的时代，<mark>企业家</mark>们通过构思将劳动力与机器相结合的方法，使过渡更加顺利。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 722, "w": "epidemic", "f": 7, "m": "epi-（在……之上、遍及）+dem（人民）+-ic（形容词后缀）", "s": [{"d": "1. n. 大规模流行的现象（6）", "e": "Yet it is precisely these non-celebrity influentials who, according to the two-step-flow theory, are supposed to drive social <mark>epidemics</mark>, by influencing their friends and colleagues directly.", "z": "然而，根据两级传播理论，恰恰应该是这些并非名人的有影响力者，通过直接影响朋友和同事，推动社会<mark>流行现象</mark>。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 流行病；疫情（1）", "e": "Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid strike to <mark>epidemic</mark> flu and to climate change.", "z": "如今，乌托邦逐渐变得不再流行，因为我们对所面临的种种威胁有了更深的认识，从小行星撞击到流感<mark>疫情</mark>，再到气候变化。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 723, "w": "evaluate", "f": 7, "m": "e-（向外）+valu（价值）+-ate（动词后缀）", "s": [{"d": "1. v. 评估；评价（7）", "e": "In all, the study concludes that whereas prosecutors should only <mark>evaluate</mark> a case based on its merits, they do seem to be influenced by a company&#x27;s record in CSR.", "z": "总的来说，这项研究得出的结论是：检察官本应仅依据案件本身的是非曲直作出<mark>评估</mark>，然而，他们似乎确实会受到企业社会责任方面的过往表现的影响。", "r": "2016 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 724, "w": "evolution", "f": 7, "m": "e-（向外）+volut（转开）+-ion（名词后缀）", "s": [{"d": "1. n. 生物进化（4）", "e": "Newton&#x27;s laws of motion and Darwinian <mark>evolution</mark> each bind a host of different phenomena into a single explicatory framework.", "z": "牛顿运动定律和达尔文的<mark>进化</mark>论各自把许多不同的现象联结成一个单一的解释框架。", "r": "2012 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "2. n. 演变；发展；演进（3）", "e": "Russell Gray at the University of Auckland and his colleagues consider the <mark>evolution</mark> of 慢，当时的<mark>曝光</mark>几乎已是瞬间完成的。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 接触；暴露于某种影响（1）", "e": "Scientists have found that <mark>exposure</mark> __8__ this hormone puts us in a trusting __9__ : In a Swiss study, researchers sprayed oxytocin into the noses of half the subjects; those subjects were ready to lend significantly higher amounts of money to strangers than were their __10__ who inhaled something else.", "z": "科学家发现，<mark>接触</mark>__8__这种激素会使我们处于信任的__9__：在一项瑞士研究中，研究人员向一半受试者的鼻子里喷入催产素；与那些吸入其他物质的__10__相比，这些受试者愿意借给陌生人的钱要多得多。", "r": "2018 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "3. n. 曝光；泄露（1）", "e": "[ D ] <mark>Exposure</mark> of a mass-market secret.", "z": "[D] 大众市场的一个秘密被<mark>曝光</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 D · 真题选项"}]}, {"id": 730, "w": "file", "f": 7, "m": "", "s": [{"d": "1. n. 文件；档案（7）", "e": "Have you ever stared helplessly at a ZIP disk, thinking: how do I get the <mark>files</mark> off this?", "z": "你是否曾无助地盯着一张ZIP磁盘，心想：我该怎样把里面的<mark>文件</mark>取出来？", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 731, "w": "fine", "f": 7, "m": "fin（精细；结束债务）+e（词形结尾）", "s": [{"d": "1. n. 罚款（3）", "e": "Under the law, using a fashion model that does not meet a government-defined index of body mass could result in a $85,000 <mark>fine</mark> and six months in prison.", "z": "根据这项法律，聘用未达到政府制定的身体质量指数标准的时装模特，可能面临8.5万美元<mark>罚款</mark>和六个月监禁。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 好的；无妨的（2）", "e": "The rich own the robots, so they will be <mark>fine</mark>.", "z": "富人拥有机器人，所以他们会<mark>安然无恙</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. adj. 精细的（1）", "e": "In the past couple of weeks a quarrel has illustrated the value to advertisers of such <mark>fine</mark>-grained information: Should advertisers assume that people are happy to be tracked and sent behavioural ads?", "z": "过去几周的一场争吵说明了如此<mark>精细</mark>的信息对广告商的价值：广告商是否应当认为，人们乐于被追踪并收到行为定向广告？", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. adv. 细致地（fine-tune微调）（1）", "e": "Standing in the shoes of others <mark>fine</mark> tunes our social understanding, useful as we struggle to understand friends, neighbours, customers and co-workers.", "z": "设身处地为他人着想，可以<mark>细致地</mark>完善我们对社会的理解；当我们努力理解朋友、邻居、顾客和同事时，这很有帮助。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}]}, {"id": 732, "w": "flaw", "f": 7, "m": "", "s": [{"d": "1. v. 使有缺陷（4）", "e": "Justice Anthony Kennedy wrote that the previous decisions were <mark>flawed</mark>.", "z": "安东尼·肯尼迪大法官写道，先前的裁决<mark>存在缺陷</mark>。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 缺陷（3）", "e": "Since the beginning, this price tag has been PreCheck&#x27;s fatal <mark>flaw</mark>.", "z": "从一开始，这项费用就是PreCheck预检计划的致命<mark>缺陷</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 733, "w": "frame", "f": 7, "m": "", "s": [{"d": "1. n. 画面；帧（5）", "e": "A typical digital SLR camera shoots 20 <mark>frames</mark> a second.", "z": "典型的数码单反相机每秒可拍摄20<mark>帧</mark>画面。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 B · 真题选项"}, {"d": "2. n. （time frame）时间范围；期限（1）", "e": "&quot;I don&#x27;t believe that the legal protection would have happened in the time <mark>frame</mark> that it did without those images,&quot; says Heather Hansen, journalist and author of Prophets and Moguls, Rangers and Rogues, Bison and Bears: 100 Years of the National Park Service.", "z": "记者兼《先知与巨头、护林员与无赖、野牛与熊：国家公园管理局一百年》作者希瑟·汉森说：“我不认为，如果没有那些影像，法律保护会在当时那个<mark>时间范围</mark>内实现。”", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}, {"d": "3. v. 构成…的背景；为…定下框架（1）", "e": "In many respects, the dearth of moral purpose <mark>frames</mark> not only the fact of such widespread phone hacking but the terms on which the trial took place.", "z": "从许多方面来看，道德使命感的缺失，不仅<mark>构成了</mark>如此大规模电话窃听事件的<mark>背景</mark>，也决定了这场审判得以进行的条件。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 734, "w": "freedom", "f": 7, "m": "free（自由、不受束缚）+-dom（状态或权利的名词后缀）", "s": [{"d": "1. n. 自由、自主权（7 , "r": "2022 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "2. n. 出版社书目（mid-list：中等销量书目）（2）", "e": "Big-name PRH authors may suffer a bit, but it&#x27;s those mid-<mark>list</mark> authors, who normally rely on Waterstones staff&#x27;s passion for promoting books by lesser-known writers, who will be praying for an end to the dispute.", "z": "企鹅兰登书屋旗下的知名作家可能会受到一点影响，但那些<mark>销量中等</mark>的作家才会祈求争端结束，因为他们通常依靠水石书店员工推广不太知名作家作品的热情。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. v. 列入（某一类别）（1）", "e": "Look up Homo sapiens in the &quot;Red List&quot; of threatened species of the International Union for the Conservation of Nature (IUCN) and you will read: &quot;<mark>Listed</mark> as Least Concern as the species is very widely distributed, adaptable, currently increasing, and there are no major threats resulting in an overall population decline.&quot;", "z": "在国际自然保护联盟（IUCN）的受威胁物种“红色名录”中查询智人，你会读到：“<mark>被列为</mark>无危，因为该物种分布极广、适应能力强、数量目前仍在增加，且没有导致其整体种群数量下降的重大威胁。”", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 748, "w": "lobby", "f": 7, "m": "", "s": [{"d": "1. v. 游说（4）", "e": "Unfortunately, banks&#x27; <mark>lobbying</mark> now seems to be working.", "z": "遗憾的是，银行的<mark>游说</mark>现在似乎正在奏效。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 游说团体（3）", "e": "The idea that &quot;housing crisis&quot; equals &quot;concreted meadows&quot; is pure <mark>lobby</mark> talk.", "z": "认为“住房危机”等于“给草地铺上混凝土”，纯粹是<mark>游说团体</mark>的一套说辞。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 749, "w": "making", "f": 7, "m": "make（制造，去词尾-e）+-ing（行为、过程或结果）", "s": [{"d": "1. n. 制作；形成；制定（4）", "e": "Unfortunately, despite 2½ years in the <mark>making</mark>, &quot;The Heart of the Matter&quot; never gets to the heart of the matter: the illiberal nature of liberal education at our leading colleges and universities.", "z": "遗憾的是，尽管耗时两年半<mark>编制</mark>，《问题的核心》却从未触及问题的核心：我们顶尖大学的博雅教育所具有的不自由本质。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 决策（decision-making）（ overy.", "z": "但只有经过集体审查和<mark>认可</mark>，才能将一项发现的宣称转化为成熟的发现。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 798, "w": "accessible", "f": 6, "m": "access（进入、接近、取得）+-ible（可以……的）", "s": [{"d": "1. adj. 可获得、可使用或易接近的（5）", "e": "This form of <mark>accessible</mark> science means that great minds are able to join the race to create and develop projects with the potential to change the world.", "z": "这种<mark>人人可参与</mark>的科学形式，意味着才智卓越的人能加入创造和开发项目的竞赛，而这些项目有潜力改变世界。", "r": "2025 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "2. adj. 易理解的；通俗易懂的（1）", "e": "[ E ] We are living through a golden age of science writing, so lucid and <mark>accessible</mark> that even lay readers can relish the unpredictability of discovery.", "z": "[E] 我们正生活在科学写作的黄金时代，作品清晰而<mark>通俗易懂</mark>，连外行读者也能欣赏科学发现的不可预测性。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 799, "w": "advice", "f": 6, "m": "", "s": [{"d": "1. n. 建议（6）", "e": "Can you give me some <mark>advice</mark>?", "z": "你能给我一些<mark>建议</mark>吗？", "r": "2024 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 800, "w": "agency", "f": 6, "m": "ag（行动、办理）+-ency（相应作用或组织的名词结尾）", "s": [{"d": "1. n. 机构；部门（4）", "e": "There&#x27;s no change to collective bargaining at the USPS, a major omission considering that personnel accounts for 80 percent of the <mark>agency&#x27;s</mark> costs.", "z": "美国邮政局的集体谈判机制没有任何变化，考虑到人员开支占该<mark>机构</mark>成本的80%，这是一项重大疏漏。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 代理机构；中介公司（2）", "e": "The charter&#x27;s main tool of enforcement is to deny access for designers and modeling <mark>agencies</mark> to Copenhagen Fashion Week (CFW), which is run by the Danish Fashion Institute.", "z": "该章程的主要执行手段，是禁止设计师和模特<mark>经纪公司</mark>参加由丹麦时尚研究所主办的哥本哈根时装周（CFW）。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
