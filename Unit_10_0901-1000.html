<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 10 (901-1000) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

, and act as useful <mark>reference</mark> points for and counterbalances to one another.", "z": "理想情况下，不同类型的阅读应相互启发，并成为彼此有益的<mark>参考</mark>点和制衡因素。", "r": "2015 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 907, "w": "region", "f": 6, "m": "reg（引导、管理）+-ion（名词词形）", "s": [{"d": "1. n. 地区；区域（6）", "e": "Specific brain <mark>regions</mark> that respond during direct gaze are being explored by other researchers, using advanced methods of brain scanning.", "z": "其他研究人员正在利用先进的脑部扫描方法，探究直接凝视时会作出反应的特定<mark>脑区</mark>。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 908, "w": "register", "f": 6, "m": "", "s": [{"d": "1. v. 登记，注册（5）", "e": "Boston took things even further, requiring renters to <mark>register</mark> with the city&#x27;s Inspectional Services Department.", "z": "波士顿更进一步，要求出租者向市检验服务部门<mark>登记</mark>。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 被注意并记住；在脑中留下印象（1）", "e": "These pauses typically occur at about three per second, and the eyes then jump to another spot, until several important points in the image are <mark>registered</mark> like a series of snapshots.", "z": "这种停顿通常每秒发生约三次，随后眼睛便跳向另一处，直到图像中的几个重要点像一连串快照那样<mark>被记录在脑中</mark>。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 909, "w": "relatively", "f": 6, "m": "relative（相对的、比较的）+-ly（在这种比较中）", "s": [{"d": "1. adv. 相对地；比较而言（6）", "e": "Some <mark>relatively</mark> poor European countries have seen huge improvements across measures including civil society, income equality and the environment.", "z": "一些<mark>相对</mark>贫穷的欧洲国家在公民社会、收入平等和环境等各项指标上都取得了巨大改善。", "r": "2017 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 910, "w": "renaissance", "f": 6, "m": "re-（重新）+naiss（出生）+-ance（名词后缀）", "s": [{"d": "1. n. 文艺复兴（5）", "e": "(46) with the Church&#x27;s teachings and ways of thinking eclipsed by the <mark>Renaissance</mark>, the gap between the Medieval and modern periods had been bridged leading to new and unexplored intellectual territories.", "z": "（46）随着<mark>文艺复兴</mark>使教会的教义和思维方式黯然失色，中世纪与现代时期之间的鸿沟被弥合了，通 d": "4. n. 生根；确立（take root）（1）", "e": "The idea that plants have some degree of consciousness first took <mark>root</mark> in the early 2000s; the term &quot;plant neurobiology&quot; was __1__ around the notion that some aspects of plant behavior could be __2__ to intelligence in animals.", "z": "植物具有某种程度意识的观点最初在21世纪初<mark>扎根</mark>；“植物神经生物学”这一术语是围绕这样一种观念而____的：植物行为的某些方面可能与动物的智力____。", "r": "2022 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "5. v. 起源于；根植于（1）", "e": "Constitutional law is political because it results from choices <mark>rooted</mark> in fundamental social __15__ like liberty and property.", "z": "宪法具有政治性，因为它源于<mark>根植于</mark>自由、财产等基本社会__15__的选择。", "r": "2012 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 913, "w": "route", "f": 6, "m": "", "s": [{"d": "1. n. 途径；实现目标的办法（4）", "e": "Education was no longer a secure <mark>route</mark> of social mobility.", "z": "教育不再是实现社会流动的可靠<mark>途径</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 路线；路径（2）", "e": "(47) The researchers are convinced that the elephants always know precisely where they are in relation to all the resources they need, and can therefore take shortcuts, as well as following familiar <mark>routes</mark>.", "z": "（47）研究人员确信，大象总是准确知道自己相对于所需各种资源的位置，因此既能沿熟悉的<mark>路线</mark>行进，也能抄近路。", "r": "2024 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 914, "w": "safe", "f": 6, "m": "", "s": [{"d": "1. adj. 安全的；稳妥的（6）", "e": "Nothing is absolutely <mark>safe</mark>, anywhere.", "z": "任何地方都没有任何事物是绝对<mark>安全</mark>的。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 915, "w": "safety", "f": 6, "m": "safe（安全的）+-ty（性质、状态）", "s": [{"d": "1. n. 安全（5）", "e": "Americans are willing to tolerate time-consuming security procedures in return for increased <mark>safety</mark>.", "z": "美国人愿意忍受耗时的安检程序，以换取更高的<mark>安全</mark>保障。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 保障（safetynet社会保障网）（1）", "e": "Finally, because automation threatens to widen the gap between capital income and labor income, taxes clusively physical: <mark>sound</mark>.", "z": "因此，它是形而上的；但其表达手段却纯粹且仅仅是物质性的：<mark>声音</mark>。", "r": "2014 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "3. adj. 合理的、站得住脚的（1）", "e": "The court&#x27;s ruling is legally <mark>sound</mark> in defining a kind of favoritism that is not criminal.", "z": "法院的裁决界定了一类不构成犯罪的偏袒行为，这在法律上是<mark>站得住脚</mark>的。", "r": "2017 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 919, "w": "space", "f": 6, "m": "", "s": [{"d": "1. n. 空间；空地（4）", "e": "It was specifically to provide city dwellers with <mark>spaces</mark> for leisure where they could experience &quot;a refreshing air.&quot;", "z": "其目的专门在于为城市居民提供休闲<mark>空间</mark>，让他们在那里感受“令人神清气爽的空气”。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 专用场所；位置（1）", "e": "But in some cases, one marketer&#x27;s owned media become another marketer&#x27;s paid media - for instance, when an e-commerce retailer sells ad <mark>space</mark> on its Web site.", "z": "但在某些情况下，一家营销者的自有媒体会成为另一家营销者的付费媒体，例如，电子商务零售商在自己的网站上出售<mark>广告位</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 太空（1）", "e": "Another issue is that while climate change is well integrated into some subjects and at some ages-such as earth and <mark>space</mark> sciences in high schools-it is not as well represented in curricula for younger children and in subjects that are more widely taught, such as biology and chemistry.", "z": "另一个问题是，虽然气候变化已充分融入某些学科及年龄阶段的教学，例如高中的地球与<mark>空间</mark>科学，但在低龄儿童的课程，以及生物和化学等教学更普及的学科中，它的体现仍不够充分。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 920, "w": "spark", "f": 6, "m": "", "s": [{"d": "1. v. 引发；激起（6）", "e": "Artifacts in museums have the power to inspire, and perhaps <mark>spark</mark> that need to learn and understand the nature of their creators.", "z": "博物馆里的文物有启发人的力量，也可能<mark>激起</mark>人们学习和了解其创造者本质的需求。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 921, "w": "sponsor", "f": 6, "m": "spons（保证、承担责任）+-or（人）", "s": [{"d": "1. v. 资助；赞助（3）", "e": "They include materials <mark>sponsored</mark> by energy industry associations.", "z": "其中包括能源行业协会<mark>资助</mark>的材料。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 发起；提议（法案）（2）", "e": "A pair of bills <mark>sponsored</mark> by Massachusetts state Senator Jason Lewis and House Speaker Pro Tempore Patricia Haddad, to ensure &quot;gender parity&quot; on boards and commissions, provides a case in point.", "z": "马萨诸塞州参议员贾森·刘易斯和众议院临时议长帕特里夏·哈达德共同<mark>提出</mark>的两项法案就是一个恰当的例证，这些法案旨在确保各董事会和委员会实现“性别均衡”。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 倡议者；发起者（1）", "e": "Next time somebody pushes corporate quotas as a way to promote gender equity, remember that such policies are largely self-serving measures that make their <mark>sponsors</mark> feel good but do little to help average women.", "z": "下次有人主张以企业配额促进性别公平时，请记住，这类政策在很大程度上是为自己谋利的措施，能让<mark>倡议者</mark>自我感觉良好，却几乎不能帮助普通女性。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 922, "w": "statistical", "f": 6, "m": "statistic（统计数字、统计量）+-al（与……有关的）", "s": [{"d": "1. adj. 统计的、统计学的（6）", "e": "&quot;Most journals are weak in <mark>statistical</mark> review, and this damages the quality of what they publish.", "z": "“大多数期刊的<mark>统计</mark>审查薄弱，这损害了所发表内容的质量。", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 923, "w": "stock", "f": 6, "m": "", "s": [{"d": "1. n. 股票；股份（3）", "e": "The FASB and IASB have been exactly that, cleaning up rules on <mark>stock</mark> options and pensions, for example, against hostility from special interests.", "z": "财务会计准则委员会和国际会计准则理事会恰恰如此，例如，它们顶着特殊利益集团的敌意，清理了有关<mark>股票</mark>期权和养老金的规则。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 库存；存货（2）", "e": "We are not boycotting PRH titles but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of <mark>stock</mark>.", "z": "我们并未抵制企鹅兰登书屋的书籍，而是在总体<mark>库存</mark>水平降低的情况下，仍竭尽全力确保顾客能够顺利买到书。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. v. 储备；备足（stock up on）（1）", "e": "[ D ] <mark>stock</mark> up on", "z": "[D] <mark>储备</mark>；<mark>备足</mark>", "r": "2023 · 英语一 · 完形填空 · 第 17 题 · 选项 D · 真题选项"}]}, {"id": 924, "w": "strength", "f": 6, "m": "strong（强壮的；词干变为streng-）+-th（名词后缀）", "s": [{"d": "1. n. 优势；长处（3）", "e": "I believe it is precisely this permanent coexistence of metaphysical message through physical means that is the <mark>strength</mark> of music.", "z": "我认为，恰恰是这种通过物质手段传达形而上信息的永久共存关系，构成了音乐的<mark>力量</mark>。", "r": "2014 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "2. n. 力量；实力（2）", "e": "If left to themselves, such trends will diminish the relative <mark>strength</mark> of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process outsourcing in other languages such as Japanese, French and German, spreads.", "z": "如果任其发展，随着人们对西班牙语、阿拉伯语或普通话等语言的教育资源需求增加，以及使用日语、法语和德语等其他语言的国际业务流程外包不断扩展，这些趋势将削弱英语在国际教育市场上的相对<mark>实力</mark>。", "r": "2017 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "3. n. （论证的）说服力（1）", "e": "Assess its <mark>strength</mark> impartially.", "z": "公正地评估它的<mark>说服力</mark>。", "r": "2019 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}]}, {"id": 925, "w": "tradition", "f": 6, "m": "tra-（跨越）+dit（给予、传递）+-ion（过程或结果的名词后缀）", "s": [{"d": "1. n. 传统（6）", "e": "Moreover, the amateur <mark>tradition</mark> in music criticism has been in headlong retreat.", "z": "此外，音乐评论中的业余<mark>传统</mark>一直在迅速衰退。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 926, "w": "transfer", "f": 6, "m": "trans-（跨过、从一处到另一处）+fer（携带）", "s": [{"d": "1. v. 转移；转交；转让（3）", "e": "[ A ] <mark>transfer</mark>", "z": "[A] <mark>转移</mark>；转交；转让。", "r": "2017 · 英语一 · 完形填空 · 第 17 题 · 选项 A · 真题选项"}, {"d": "2. n. 转移支付；资金拨付（1）", "e": "Called conditional cash <mark>transfers</mark> or CCTs, these social assistance programs are designed to reduce inequality and break the cycle of poverty.", "z": "这些被称为“有条件现金<mark>转移支付</mark>”、简称CCT的社会援助项目，旨在减少不平等并打破贫困循环。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 转移；转交；转让（1）", "e": "I would ask that the foreign nations and the original country discuss the terms of <mark>transfer</mark>.", "z": "我会请求外国与原属国讨论<mark>移交</mark>的条件。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "4. v. 适用到；推广到（1）", "e": "Ferraro suggests the results may <mark>transfer</mark> to other parts of Asia, due to commonalities such as the importance of growing rice and market access.", "z": "费拉罗认为，鉴于水稻种植的重要性和市场准入等共同之处，这些结果可能也<mark>适用于</mark>亚洲其他地区。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 927, "w": "trial", "f": 6, "m": "", "s": [{"d": "1. n. 审判（4）", "e": "In many respects, the dearth of moral purpose frames not only the fact of such widespread phone hacking but the terms on which the <mark>trial</mark> took place.", "z": "从许多方面来看，道德使命感的缺失，不仅构成了如此大规模电话窃听事件的背景，也决定了这场<mark>审判</mark>得以进行的条件。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 试用（1）", "e": "[ A ] <mark>Trial</mark> subscription is offered.", "z": "[A] 提供<mark>试用</mark>订阅。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 30 题 · 选项 A · 真题选项"}, {"d": "3. n. 试验；实验（1）", "e": "The randomised control <mark>trial</mark> involved hundreds of year 5 pupils aged nine and ten-at 45 state primary schools that had not been &quot;previously exposed to RSC pedagogy&quot;.", "z": "这项随机对照<mark>试验</mark>涉及45所公立小学的数百名九至十岁五年级学生，这些学校“此前未接触过皇家莎士比亚剧团的教学法”。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 928, "w": "trouble", "f": 6, "m": "troub（搅乱）+le（词形结尾）", "s": [{"d": "1. n. 麻烦、困难（6）", "e": "Bankers have been blaming themselves for their <mark>troubles</mark> in public.", "z": "银行家们一直在公开地将自身<mark>困境</mark>归咎于自己。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 929, "w": "unlike", "f": 6, "m": "un-（不）+like（相似的、像）", "s": [{"d": "1. adj. 与……不同（6）", "e": "But, <mark>unlike</mark> with mining claims, the community takes control of what happens next.", "z": "不过，<mark>与采矿权的情况不同</mark>，接下来发生什么由社区掌控。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题 原表义项待核：本例中为介词“与……不同”。"}]}, {"id": 930, "w": "unlikely", "f": 6, "m": "un-（不）+likely（可能的）", "s": [{"d": "1. adj. 不大可能的（5）", "e": "That seems <mark>unlikely</mark>.", "z": "这似乎<mark>不太可能</mark>。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 不像会如此的、出人意料的（1）", "e": "This distinction is so much so that where the latter is lacking, as it is for these <mark>unlikely</mark> gardeners, the former becomes all the more urgent.", "z": "这种区别如此明显，以至于当后者缺失时--正如这些<mark>出人意料的</mark>园丁的情况--前者就变得更加迫切。", "r": "2013 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 931, "w": "upset", "f": 6, "m": "up（向上、翻起）+set（放置、放稳）", "s": [{"d": "1. adj. 心烦的、不快的（2）", "e": "&quot;Figuring out a way to accelerate that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#x27;re going to have your most loyal customers really <mark>upset</mark> with you.&quot;", "z": "他说：“对他们而言，想办法加快这一转型是合理的，但如果你停止提供它，就会让最忠实的客户对你非常<mark>不满</mark>。”", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 使心烦、使不快（2）", "e": "If it is trying to <mark>upset</mark> Google, which relies almost wholly on advertising, it has chosen an indirect method: there is no guarantee that DNT by default will become the norm.", "z": "如果它是想让几乎完全依赖广告的谷歌<mark>感到不快</mark>，那么它选择了一种间接方式：没有任何保证表明，默认开启“请勿追踪”会成为惯例。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 打乱、破坏（1）", "e": "But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration&#x27;s effort to <mark>upset</mark> the balance of power between the federal government and the states.", "z": "但在更重要的宪法问题上，这项裁决以8比0使政府试图<mark>打破</mark>联邦与各州之间权力平衡的努力遭到失败。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "4. v. 推翻、颠覆（1）", "e": "California has asked the justices to refrain from a sweeping ruling, particularly one that <mark>upsets</mark> the old assumption that authorities may search through the possessions of suspects at the time of their arrest.", "z": "加利福尼亚州要求大法官们避免作出影响广泛的裁决，尤其不要<mark>推翻</mark>长期以来的一项假定，即当局可以在逮捕嫌疑人时搜查其随身物品。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 932, "w": "urban", "f": 6, "m": "urb-（城市）+-an（与……有关的）", "s": [{"d": "1. adj. 城市的（6）", "e": "We do not ruin <mark>urban</mark> conservation areas.", "z": "我们不破坏<mark>城市</mark>保护区。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 933, "w": "various", "f": 6, "m": "vari（变化；差别）+-ous（具有……性质的）", "s": [{"d": "1. adj. 各种各样的；不同的（6）", "e": "Those retailers may face headaches complying with <mark>various</mark> state sales tax laws.", "z": "那些零售商在遵守各州<mark>不同的</mark>销售税法规时，可能会遇到棘手的麻烦。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 934, "w": "vast", "f": 6, "m": "", "s": [{"d": "1. adj. 广大的；巨大的；大量的（6）", "e": "Yet only one of his books is now in print, and his <mark>vast</mark> body of writings on music is unknown save to specialists.", "z": "然而，如今他的书只有一本仍在出版；除专家以外，几乎无人知晓他那<mark>数量庞大</mark>的一批音乐著作。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 935, "w": "version", "f": 6, "m": "vers（转、转换）+ion（结果的名词后缀）", "s": [{"d": "1. n. 版本；形式（6）", "e": "It said that Internet Explorer 10, the <mark>version</mark> due to appear with Windows 8, would have DNT as a default.", "z": "它表示，预定随Windows 8一同推出的Internet Explorer 10<mark>版本</mark>，将默认启用DNT。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 936, "w": "violate", "f": 6, "m": "viol（违背、侵犯）+-ate（形成动作）", "s": [{"d": "1. v. 违反、侵犯（6）", "e": "It also pledged not to deploy AI whose use would <mark>violate</mark> international laws or human rights.", "z": "它还承诺，不部署那些在使用中会<mark>违反</mark>国际法或<mark>侵犯</mark>人权的人工智能。", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 937, "w": "volume", "f": 6, "m": "vol（卷起）+U（U形容器）+me（测量）", "s": [{"d": "1. n. 数量；总量（2）", "e": "Even as California lost a huge <mark>volume</mark> of production to other locations, there was still plenty of film production taking place in Los Angeles before this year.", "z": "虽然加利福尼亚州有<mark>大量</mark>影视制作流向其他地方，但在今年之前，洛杉矶仍有很多电影制作活动。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 充分说明；含义深刻（speakvolumes）（1）", "e": "(50) Just as the code breaking has its wider relevance in the struggle for Spain, so his attempts to make his way up the promotion ladder speak <mark>volumes</mark> about British society.", "z": "（50）正如破译密码在西班牙的斗争中具有更广泛的意义一样，他努力沿晋升阶梯向上攀登的经历也<mark>充分说明</mark>了英国社会的状况。", "r": "2022 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "3. n. 卷；册；书籍（1）", "e": "In <mark>volume</mark> V he had attached an appendix, The Scovell Ciphers.", "z": "在第五<mark>卷</mark>中，他附上了一篇名为《斯科维尔密码》的附录。", "r": "2022 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "4. n. 待定（孤立干扰项，可指体积、容量或数量）（1）", "e": "[ B ] <mark>volumes</mark>", "z": "[B] <mark>体积</mark>；<mark>容量</mark>；数量", "r": "2024 · 英语一 · 完形填空 · 第 6 题 · 选项 B · 真题选项"}, {"d": "5. n. 音量（1）", "e": "(48) Beethoven&#x27;s habit of increasing the <mark>volume</mark> with an extreme intensity and then abruptly following it with a sudden soft passage was only rarely used by composers before him.", "z": "（48）贝多芬惯于以极高的强度增大<mark>音量</mark>，然后突然接上一段轻柔的乐段；在他之前，作曲家很少采用这种手法。", "r": "2014 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 938, "w": "website", "f": 6, "m": "web（万维网、网上信息网络）+site（地点、站点）", "s": [{"d": "1. n. 网站（6）", "e": "The parliament also agreed to ban <mark>websites</mark> that &quot;incite excessive thinness&quot; by promoting extreme dieting.", "z": "议会还同意禁止通过鼓吹极端节食来“煽动过度消瘦”的<mark>网站</mark>。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 939, "w": "wetland", "f": 6, "m": "wet（湿的）+land（土地）", "s": [{"d": "1. n. 湿地（6）", "e": "They move between a variety of habitats, including forests, grasslands, woodlands, <mark>wetlands</mark> and agricultural land.", "z": "它们在各种栖息地之间迁移，包括森林、草原、林地、<mark>湿地</mark>和农业用地。", "r": "2024 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 940, "w": "wildfire", "f": 6, "m": "wild（野生的）+fire（火）", "s": [{"d": "1. n. 野火；森林火灾（6）", "e": "What did the study find about the <mark>wildfires</mark> over the past few decades?", "z": "关于过去几十年的<mark>野火</mark>，这项研究发现了什么？", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 38 题"}]}, {"id": 941, "w": "wildlife", "f": 6, "m": "wild（野生的）+life（生命、生物）", "s": [{"d": "1. n. 野生生物；野生动植物（6）", "e": "I was a zoo and <mark>wildlife</mark> park employee for years.", "z": "我曾多年在动物园和<mark>野生动物</mark>园工作，是那里的员工。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 942, "w": "wireless", "f": 6, "m": "wire（电线）+-less（没有……的）", "s": [{"d": "1. n. 无线电广播、收音机（6）", "e": "By and large the <mark>wireless</mark> was welcome.", "z": "总体而言，<mark>收音机</mark>是受欢迎的。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 943, "w": "acquisition", "f": 5, "m": "acquisit-（取得；获得，acquire的历史词干）+-ion（过程或结果）", "s": [{"d": "1. n. 获得；取得（3）", "e": "Other scientists perform the specialised work of peer review also for free, because it is a central element in the <mark>acquisition</mark> of status and the production of scientific knowledge.", "z": "其他科学家也免费从事同行评审这一专业工作，因为它是<mark>获得</mark>地位和生产科学知识的核心环节。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 习得；学会（1）", "e": "The most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are born with an innate language-<mark>acquisition</mark> capacity that dictates a universal grammar.", "z": "其中最著名的探索努力由诺姆·乔姆斯基发起；他提出，人类生来就具备一种先天的语言<mark>习得</mark>能力，这种能力决定了普遍语法。", "r": "2012 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "3. n. 收购；购入（1）", "e": "Much more could be done to encourage &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock <mark>acquisitions</mark>.", "z": "为了鼓励“长期主义”，还可以做更多事情，例如修改税法，以及更快地披露股票<mark>收购</mark>情况。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 944, "w": "additional", "f": 5, "m": "addition（增加、附加部分）+-al（与……有关的）", "s": [{"d": "1. adj. 额外的；增加的（5）", "e": "&quot;Then increase it at a higher rate each year and essentially try to generate <mark>additional</mark> revenue.&quot;", "z": "“然后每年以更高的幅度提高它，本质上是设法创造<mark>额外</mark>收入。”", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 945, "w": "adjust", "f": 5, "m": "ad-（向）+just（正好符合）", "s": [{"d": "1. v. 调整；调节（4）", "e": "During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted position or <mark>adjusted</mark> their limbs.", "z": "在19世纪40年代和50年代，也就是摄影术的早期，曝光时间之长是出了名的：银版摄影法（在镀银铜板上成像）可能需要几分钟才能完成，因此被摄者挪动位置或<mark>调整</mark>四肢时，就会造成影像模糊。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 适应（1）", "e": "But in the medium term, middle-class workers may need a lot of help <mark>adjusting</mark>.", "z": "但从中期来看，中产阶级劳动者在<mark>适应</mark>变化时可能需要大量帮助。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 946, "w": "advise", "f": 5, "m": "ad-（向）+vis（看、看法）+e（词形结尾）", "s": [{"d": "1. v. 建议；劝告（5）", "e": "Recently, another expression of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes <mark>advise</mark> contributors to add a number of citations to their articles.", "z": "最近，这种掠夺行为又出现了一种表现形式：所谓提供辅助服务的咨询机构，为个人作者和期刊提供语言及其他编辑支持，有时会<mark>建议</mark>投稿者在文章中增加若干引文。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 947, "w": "affordable", "f": 5, "m": "afford（有能力支付、负担得起）+able（能够被……的）", "s": [{"d": "1. adj. 负担得起的（5）", "e": "It could make extra training and instruction <mark>affordable</mark>.", "z": "这可以使额外的培训和教学变得<mark>负担得起</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 948, "w": "agreement", "f": 5, "m": "agree（同意、一致、商定）+-ment（行为、状态或结果的名词后缀）", "s": [{"d": "1. n. 协议；约定（5）", "e": "What is true of the <mark>agreement</mark> between the NHS and DeepMind?", "z": "关于英国国家医疗服务体系与DeepMind之间的<mark>协议</mark>，哪一说法是正确的？", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31 题"}]}, {"id": 949, "w": "airline", "f": 5, "m": "air（空中、航空）+line（线、路线）", "s": [{"d": "1. n. 航空的（3）", "e": "I 物质。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 合并（1）", "e": "Moreover, average overall margins are higher in wholesale than in retail; wholesale demand from the food service sector is growing quickly as more Europeans eat out more often; and changes in the competitive dynamics of this fragmented industry are at last making it feasible for wholesalers to <mark>consolidate</mark>.", "z": "此外，批发业的平均总体利润率高于零售业；随着更多欧洲人更频繁地外出就餐，餐饮服务业的批发需求正迅速增长；而这个分散行业的竞争格局变化，终于使批发商的<mark>合并</mark>变得可行。", "r": "2010 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 978, "w": "convention", "f": 5, "m": "con-（共同、一起）+vent（来）+-ion（活动或结果）", "s": [{"d": "1. n. 惯例；传统习俗（5）", "e": "He freed music from hitherto prevailing <mark>conventions</mark> of harmony and structure.", "z": "他使音乐摆脱了此前占主导地位的和声与结构<mark>惯例</mark>的束缚。", "r": "2014 · 英语一 · 阅读理解 C · 第 47 题"}]}, {"id": 979, "w": "cooperation", "f": 5, "m": "cooperat-（cooperate去e，合作）+-ion（名词后缀）", "s": [{"d": "1. n. 合作；协作（5）", "e": "It is hard to get right, and requires a remarkable degree of vision, as well as <mark>cooperation</mark> between city authorities, the private sector, community groups and cultural organisations.", "z": "这件事很难做好，需要非凡的远见，以及城市当局、私营部门、社区团体和文化组织之间的<mark>合作</mark>。", "r": "2020 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 980, "w": "counterpart", "f": 5, "m": "counter-（相对）+part（部分）", "s": [{"d": "1. n. 对应的人或事物；同行（5）", "e": "And though print ad sales still dwarf their online and mobile <mark>counterparts</mark>, revenue from print is still declining.", "z": "尽管纸媒广告的销售额仍远超网络和移动端<mark>同类广告</mark>，但纸媒收入依然在下降。", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 981, "w": "couple", "f": 5, "m": "", "s": [{"d": "1. n. 几个 (人或物)（3）", "e": "Such measures have a <mark>couple</mark> of uplifting motives.", "z": "这些措施有<mark>几个</mark>令人振奋的动机。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 夫妇；伴侣（2）", "e": "According to several studies concluding that parents are less happy than childless <mark>couples</mark>, single parents are the least happy of all.", "z": "几项研究得出结论，有孩子的父母不如无子女<mark>夫妇</mark>幸福，而单亲父母是其中最不幸福的。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 982, "w": "craft", "f": 5, "m": "", "s": [{"d": "1. v. 精心制作（2）", "e": "To encourage innovation and competition, the report calls for increased investment in research, the <mark>crafting</mark> of coherent curricula that improve students&#x27; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to bear on the great challenges of the day.", "z": "为鼓励创新和竞争，报告呼吁增加研究投资，<mark>精心编制</mark>连贯的课程，以提高学生在21世纪解决问题和有效交流的能力，增加对教师的资助，并鼓励学者运用所学知识应对当今的重大挑战。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 小船；船只（1）", "e": "These travelers to North America came in small, unmercifully overcrowded <mark>craft</mark>.", "z": "这些前往北美的旅客乘坐的<mark>船只</mark>很小，拥挤得令人难以忍受。", "r": "2015 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "3. n. 手工艺（1）", "e": "I was really excited to hear that you&#x27;d invite some young craftsmen to demonstrate their innovative <mark>craft</mark>-making on campus.", "z": "听说你们将邀请一些年轻手艺人到校园演示他们创新的<mark>手工艺</mark>制作，我非常兴奋。", "r": "2025 · 英语一 · 写作 A · 第 51 题"}, {"d": "4. n. 技艺；手艺（1）", "e": "But as Cline is the first to note, it took Beaumont decades to perfect her <mark>craft</mark>; her example can&#x27;t be knocked off.", "z": "但正如克莱因首先指出的那样，博蒙特花了几十年才让自己的<mark>技艺</mark>臻于完善；她这个榜样无法被轻易复制。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 983, "w": "creator", "f": 5, "m": "creat（create去e，创造）+or（从事者）", "s": [{"d": "1. n. 创造者；创作者（5）", "e": "For millennia, we&#x27;ve known what we&#x27;ve known due to artifacts that have survived, often despite their original <mark>creators</mark>&#x27; neglect.", "z": "数千年来，我们之所以拥有现有的知识，是因为一些物品留存至今，而它们得以留存，往往并非出于最初<mark>创造者</mark>的珍惜保管。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 984, "w": "creature", "f": 5, "m": "creat（create去e，创造）+-ure（形成的事物）", "s": [{"d": "1. n. 生物；动物（5）", "e": "Yet these <mark>creatures</mark> are members of the biotic community and, if its stability depends on its integrity, they are entitled to continuance.", "z": "然而，这些<mark>生物</mark>是生物群落的成员；如果群落的稳定性取决于其完整性，那么它们就有权继续生存。", "r": "2010 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 985, "w": "crime", "f": 5, "m": "", "s": [{"d": "1. n. 罪行（5）", "e": "&quot;This is organized <mark>crime</mark>.&quot;", "z": "“这是有组织的<mark>犯罪</mark>。”", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 986, "w": "cross", "f": 5, "m": "", "s": [{"d": "1. v. 穿过（3）", "e": "&quot;Donkeys are champions when it comes to carrying stuff and are good at <mark>crossing</mark> deserts,&quot; co-author Ludovic Orlando, an evolutionary biologist at Paul Sabatier University in France, tells the publication.", "z": "“驴是驮运物品的能手，也擅长<mark>穿越</mark>沙漠，”合著者、法国保罗·萨巴蒂耶大学的进化生物学家吕多维克·奥兰多对该刊物说。", "r": "2026 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 交叉核对（cross-check）（1）", "e": "They <mark>cross</mark>-check sources and prefer news from different perspectives - especially those that are open about any bias.", "z": "他们<mark>交叉核对</mark>消息来源，偏好不同视角的新闻，尤其是那些坦诚说明自身偏见的新闻。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. adj. 跨……的（1）", "e": "And in Europe, some are up in arms over a proposal to drop a specific funding category for social-science research and to integrate it within <mark>cross</mark>-cutting topics of sustainable development.", "z": "而在欧洲，一些人对一项提议愤怒抗议：取消社会科学研究的专门资助类别，将其整合进可持续发展的<mark>跨领域</mark>议题。", "r": "2013 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 987, "w": "curiosity", "f": 5, "m": "curios（curious的词干变体，好奇的）+-ity（性质；相关事物）", "s": [{"d": "1. n. 好奇心；求知欲（5）", "e": "The 17th and 18th centuries were times of radical change and <mark>curiosity</mark>.", "z": "17和18世纪是充满根本变革与<mark>求知欲</mark>的时代。", "r": "2020 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 988, "w": "curriculum", "f": 5, "m": "curr（跑、行进）+ICULUM（我选择有用的课程、动脑学习）", "s": [{"d": "1. n. 课 const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
