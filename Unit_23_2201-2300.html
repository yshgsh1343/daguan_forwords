<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 23 (2201-2300) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

, "f": 2, "m": "rat（计算、推理）+io（词形结尾）", "s": [{"d": "1. n. 比例（2）", "e": "An infant born to a hunter-gatherer society could have more than ten caregivers-this contrasts starkly to nursery settings in the UK where regulations call for a <mark>ratio</mark> of one carer to four children aged two to three.", "z": "出生于狩猎采集社会的婴儿可能有十多位照护者，这与英国托儿机构的情况形成鲜明对比；英国规定，每位照护者对应四名两至三岁儿童，即一比四的<mark>比例</mark>。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2207, "w": "reap", "f": 2, "m": "", "s": [{"d": "1. v. 获得；收获（2）", "e": "[ B ] <mark>reaped</mark> benefits from the war with digital pirates", "z": "[B] 从与数字盗版者的斗争中<mark>获得</mark>了利益。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 32 题 · 选项 B · 真题选项"}]}, {"id": 2208, "w": "rear", "f": 2, "m": "", "s": [{"d": "1. adj. 背面的、后部的（1）", "e": "One of the past winners, Professor Martin Green from the University of New South Wales, Australia, is the inventor of the Passivated Emitter and <mark>Rear</mark> Cell technology which is now found in most of the world&#x27;s solar panels.", "z": "往届获奖者之一、澳大利亚新南威尔士大学的马丁·格林教授，发明了钝化发射极和<mark>背面</mark>电池技术，如今全球大多数太阳能电池板都采用了这一技术。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 抚养、养育（1）", "e": "[ B ] Celebrity moms have influenced our attitude towards child <mark>rearing</mark>.", "z": "[B] 明星妈妈影响了我们对<mark>抚养</mark>孩子的态度。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 40 题 · 选项 B · 真题选项"}]}, {"id": 2209, "w": "recognition", "f": 2, "m": "re-（再次）+cogn（认知）+-ition（过程或结果的名词结尾）", "s": [{"d": "1. n. 认可；承认（2）", "e": "His status in Lord Wellington&#x27;s headquarters and the <mark>recognition</mark> given to him for his work were all bound up with the class politics of the army at the time.", "z": "他在惠灵顿勋爵指挥部的地位，以及其工作获得的<mark>认可</mark>，都与当时军队的阶级政治密切相关。", "r": "2022 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2210, "w": "recommendation", "f": 2, "m": "recommend（推荐、建议）+-ation（这种行为或提出的内容）", "s": [{"d": "1. n. 推荐；建议（2）", "e": "2)give reasons for your <mark>recommendation</mark>.", "z": "2）说明你提出这项<mark>建议</mark>的理由。", "r": "2011 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 2211, "w": "recovery", "f": 2, "m": "recover（恢复、痊愈、重新获得）+-y（过程或结果的名词后缀）", "s": [{"d": "1. n. 经济复苏；恢复发展（2）", "e": "As the first signs of <mark>recovery</mark> begin to take hold, deputy chiefs may be more willing to make the jump without a net.", "z": "随着<mark>经济复苏</mark>的最初迹象开始显现，副职主管们可能更愿意在没有安全网的情况下纵身一跃。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2212, "w": "refuge", "f": 2, "m": "re-（回、退离）+fug-（逃）+e（词尾字母）", "s": [{"d": "1. n. 野生动物保护区（2）", "e": "These are mostly students who had no opportunity as children to travel to wilderness areas, wildlife <mark>refuges</mark> or national parks.", "z": "这些学生大多在童年时没有机会前往荒野、<mark>野生动物保护区</mark>或国家公园。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 2213, "w": "regime", "f": 2, "m": "reg（统治、管理）+ime（本词的名词词形结尾）", "s": [{"d": "1. n. 制度（1）", "e": "In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal <mark>regime</mark>.", "z": "在新西兰，2016年一项普通议员提出的法案试图允许企业与高收入雇员通过合同约定，排除不当解雇<mark>制度</mark>的适用。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 政权（1）", "e": "When public opinion is particularly polarised, as it was following the end of the Franco <mark>regime</mark>, monarchs can rise above &quot;mere&quot; politics and &quot;embody&quot; a spirit of national unity.", "z": "当公众意见极度分化时，比如佛朗哥<mark>政权</mark>结束后，君主可以超越“纯粹的”政治，体现民族团结的精神。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2214, "w": "relative", "f": 2, "m": "relate（关联；去e）+-ive（形容词或名词后缀）", "s": [{"d": "1. adj. 相对的，比较而言的（2）", "e": "If left to themselves, such trends will diminish the <mark>relative</mark> strength of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process outsourcing in other languages such as Japanese, French and German, spreads.", "z": "如果任其发展，随着人们对西班牙语、阿拉伯语或普  and its <mark>remote</mark> heat warms the people who live in the surrounding town of Kajaani.", "z": "它建在一座旧造纸厂里，由附近的一条河流提供动力，并将热量<mark>远程</mark>输送给周边卡亚尼镇的居民，为他们供暖。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2220, "w": "renew", "f": 2, "m": "re-（重新、再次）+new（新）", "s": [{"d": "1. v. 更新；重新开始（2）", "e": "These labels encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don&#x27;t advertise that - and to <mark>renew</mark> their wardrobe every few weeks.", "z": "这些品牌鼓励注重时尚的消费者把衣服看作一次性用品，设计时就只打算让它们经受一两次洗涤，尽管品牌不会公开说明这一点；它们还鼓励消费者每隔几周就<mark>更新</mark>衣橱中的全部衣物。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2221, "w": "renewable", "f": 2, "m": "renew（更新、恢复）+-able（能够被……的）", "s": [{"d": "1. adj. 可再生的；可更新的（2）", "e": "Every day, scientists, technologists and engineers are discovering new ways to exploit <mark>renewable</mark> energy sources and develop techniques not just to use power more intelligently but to power our intelligence.", "z": "科学家、技术人员和工程师每天都在发现利用<mark>可再生</mark>能源的新方法，并开发新技术，不仅更聪明地用电，还要用电为我们的智能提供动力。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2222, "w": "repair", "f": 2, "m": "re-（重新）+pair（准备、安排）", "s": [{"d": "1. v. 修复（2）", "e": "[ C ] <mark>repairing</mark>", "z": "[C] <mark>修复</mark>", "r": "2022 · 英语一 · 完形填空 · 第 8 题 · 选项 C · 真题选项"}]}, {"id": 2223, "w": "reply", "f": 2, "m": "re-（返回）+ply（折叠、折回）", "s": [{"d": "1. n. 回复、回答（1）", "e": "Raise objections and listen carefully to their <mark>replies</mark>.", "z": "提出异议，并仔细倾听他们的<mark>回答</mark>。", "r": "2019 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}, {"d": "2. v. 回复、回答（1）", "e": "Devoted concertgoers who <mark>reply</mark> that recordings are no substitute for live performance are missing the point.", "z": "那些忠实的音乐会听众<mark>回答</mark>说，录音无法充当现场演奏的替代品，但他们没有抓住要点。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2224, "w": "reporter", "f": 2, "m": "report（报告、汇报）+-er（从事者）", "s": [{"d": "1. n. 记者（2）", "e": "He tau and waterfalls to its variety of flora and fauna.", "z": "这就是海登探险队力求更全面了解黄石河地区的原因，研究范围从<mark>温泉</mark>和瀑布到各种植物和动物。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 2279, "w": "squeeze", "f": 2, "m": "", "s": [{"d": "1. n. 两面夹击的困境（1）", "e": "Fundamentally, the USPS is in a historic <mark>squeeze</mark> between technological change that has permanently decreased demand for its bread-and-butter product, first-class mail, and a regulatory structure that denies management the flexibility to adjust its operations to the new reality.", "z": "从根本上说，美国邮政署正陷入一场历史性的<mark>两面夹击</mark>：技术变革永久性地降低了对其主要收入来源--一类邮件--的需求，而监管结构又剥夺了管理层调整运营以适应新现实的灵活性。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 挤压；使陷入困境（1）", "e": "About half of U.S. jobs are at high risk of being automated, according to a University of Oxford study, with the middle class disproportionately <mark>squeezed</mark>.", "z": "牛津大学的一项研究显示，美国约一半的工作岗位面临很高的自动化风险，中产阶级受到的<mark>挤压</mark>尤为严重。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2280, "w": "starve", "f": 2, "m": "", "s": [{"d": "1. v. 使严重缺乏（1）", "e": "(49) If customers are not willing to share data, AI will be <mark>starved</mark> of essential information and will not be able to function effectively or employ machine learning to improve its marketing content and communication.", "z": "（49）如果客户不愿分享数据，人工智能就会<mark>严重缺乏</mark>必要的信息，无法有效运作，也无法利用机器学习改进其营销内容和沟通。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}, {"d": "2. v. 挨饿、使饿死（1）", "e": "And the ban on ultra-thin models seems to go beyond protecting models from <mark>starving</mark> themselves to death - as some have done.", "z": "而禁止使用极瘦模特，似乎不仅仅是为了保护模特免于把自己<mark>饿死</mark>，因为已有一些模特这样死去。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2281, "w": "station", "f": 2, "m": "stat（站、停驻）+-ion（停驻处、工作场所）", "s": [{"d": "1. n. 站；所；局（2）", "e": "They then set up a &quot;food <mark>station</mark>&quot; experiment, in which they gave the elephants a series of choices based only on smell.", "z": "随后，他们设计了一个“食物<mark>站</mark>”实验，让大象进行一系列仅凭气味作出的选择。", "r": "2024 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2282, "w": "steep", "f": 2, "m": "", "s": [{"d": "1. adj. 陡峭的（学习曲线，需迅速学习）（2）", "e": "In such a case, the company&#x27;s response may not be sufficiently quick or thoughtful, and the learning curve has been <mark>steep</mark>.", "z": "在这种情况下，公司的回应可能不够迅速或周全，而且学习曲线一直十分<mark>陡峭</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2283, "w": "steer", "f": 2, "m": "", "s": [{"d": "1. v. 引导（1）", "e": "Far less certain, however, is how successfully experts and bureaucrats can select our peer groups and <mark>steer</mark> their activities in virtuous directions.", "z": "然而，专家和官僚究竟能在多大程度上成功地为我们选择同伴群体，并把这些群体的活动<mark>引向</mark>正当的方向，就远没有那么确定了。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 避开；使远离（steer clear of）（1）", "e": "And for authors who wish to <mark>steer</mark> clear of citation cartel activities: when an editor, a reviewer, or a support service asks you to add inappropriate references, do not oblige and do report the request to the journal.", "z": "对于希望<mark>避开</mark>引文联盟活动的作者来说，当编辑、审稿人或支持服务机构要求你添加不恰当的参考文献时，不要照办，而应向期刊报告这一要求。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2284, "w": "stir", "f": 2, "m": "", "s": [{"d": "1. n. 轰动；骚动（1）", "e": "I&#x27;ve found quite a few, and-since I started posting them on Twitter-they have been causing quite a <mark>stir</mark>.", "z": "我已经找到了不少，自从我开始把它们发布在推特上之后，它们就引起了不小的<mark>轰动</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 激起；打动（1）", "e": "Although good TV shows can help <mark>stir</mark> children&#x27;s interest in conservation, they cannot replace the excitement of a zoo visit as an intense, immersive and interactive experience.", "z": "虽然优秀的电视节目有助于<mark>激发</mark>儿童对自然保护的兴趣，但它们无法取代参观动物园带来的兴奋感，因为那是一种强烈、身临其境且具有互动性的体验。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 2285, "w": "string", "f": 2, "m": "", "s": [{"d": "1. n. 一连串；一系列（2）", "e": "As a News Feature article in Nature discusses, a <mark>string</mark> of lucrative awards for researchers have joined the Nobel Prizes in recent years.", "z": "正如《自然》的一篇新闻特写所讨论的，近年来，除了诺贝尔奖以外，又出现了<mark>一系列</mark>面向研究人员的丰厚奖项。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2286, "w": "strip", "f": 2, "m": "", "s": [{"d": "1. n. 条状物（1）", "e": "Roman lamps and Roman chariots are very different from LED <mark>strips</mark> and sports cars, but Roman nails are still clearly nails.", "z": "罗马时代的灯具和战车与LED<mark>灯带</mark>和跑车截然不同，但罗马时代的钉子仍然明显是钉子。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 剥夺（1）", "e": "Downloading and consuming culture requires great skills, but failing to move beyond downloading is to <mark>strip</mark> oneself of a defining constituent of humanity.", "z": "下载和消费文化需要高超的技能，但如果止步于下载，就等于<mark>剥夺</mark>了自身人性中一个决定性的组成部分。", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 A · 真题选项"}]}, {"id": 2287, "w": "strive", "f": 2, "m": "", "s": [{"d": "1. v. 努力；力求（2）", "e": "The most successful monarchies <mark>strive</mark> to abandon or hide their old aristocratic ways.", "z": "最成功的君主制国家<mark>努力</mark>摒弃或隐藏其旧有的贵族做派。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2288, "w": "subconscious", "f": 2, "m": "sub-（在下面）+conscious（有意识的）", "s": [{"d": "1. adj. 潜意识的（2）", "e": "But it&#x27;s interesting to wonder if the images we see every week of stress-free, happiness-enhancing parenthood aren&#x27;t in some small, <mark>subconscious</mark> way contributing to our own dissatisfactions with the actual experience, in the same way that a small part of us hoped getting &quot;the Rachel&quot; might make us look just a little bit like Jennifer Aniston.", "z": "但值得思考的是，我们每周看到的那些毫无压力、增添幸福的育儿形象，是否正以某种微小而<mark>潜意识</mark>的方式，加深我们对实际育儿经历的不满；这就像我们内心多少曾期待，剪一个“瑞秋头”便能让自己看起来有一点像詹妮弗·安妮斯顿一样。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2289, "w": "submit", "f": 2, "m": "sub-（在……之下）+mit（发送、交付）", "s": [{"d": "1. v. 提交；呈交（2）", "e": "[ B ] <mark>submits</mark>", "z": "[B] <mark>提交</mark>；<mark>呈交</mark>", "r": "2013 · 英语一 · 完形填空 · 第 1 题 · 选项 B · 真题选项"}]}, {"id": 2290, "w": "substitute", "f": 2, "m": "sub-（在下面；替代）+stitut（放置、建立）+e（词形结尾）", "s": [{"d": "1. n. 替代物；替代者（2）", "e": "Devoted concertgoers who reply that recordings are no <mark>substitute</mark> for live performance are missing the point.", "z": "那些忠实的音乐会听众回答说，录音无法充当现场演奏的<mark>替代品</mark>，但他们没有抓住要点。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2291, "w": "successfully", "f": 2, "m": "successful（成功的）+ly（以某种方式、取得某种结果地）", "s": [{"d": "1. adv. 成功地（2）", "e": "Far less certain, however, is how <mark>successfully</mark> experts and bureaucrats can select our peer groups and steer their activities in virtuous directions.", "z": "然而，专家和官僚究竟能在多大程度上<mark>成功地</mark>为我们选择同伴群体，并把这些群体的活动引向正当的方向，就远没有那么确定了。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2292, "w": "succession", "f": 2, "m": "suc-（随后接上）+cess（走）+-ion（过程或状态的名词后缀）", "s": [{"d": "1. n. 继任（1）", "e": "As boards scrutinize <mark>succession</mark> plans in response to shareholder pressure, executives who don&#x27;t get the nod also may wish to move on.", "z": "董事会因应股东压力而严格审查<mark>继任</mark>计划时，未获认可的高管也可能希望另谋出路。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 连续；接连（1）", "e": "In quick <mark>succession</mark>, the Senate and House passed legislation protecting Yellowstone in early 1872.", "z": "1872年初，参议院和众议院<mark>相继</mark>迅速通过了保护黄石的立法。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}]}, {"id": 2293, "w": "successive", "f": 2, "m": "suc-（随后接上）+cess（走）+-ive（具有这种状态的）", "s": [{"d": "1. adj. 接连的；历届的（2）", "e": "<mark>Successive</mark> governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general taxpayer.", "z": "<mark>历届</mark>政府都允许这样的涨价，理由是铁路网络的投资与运营成本应由使用者承担，而非由普通纳税人承担。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2294, "w": "suffering", "f": 2, "m": "suffer（受苦、承受痛苦）+-ing（经历或状态）", "s": [{"d": "1. v. 苦难；痛苦（2）", "e": "(50) One could interpret much of the work of Beethoven by saying that <mark>suffering</mark> is inevitable, but the courage to fight it renders life worth living.", "z": "（50）贝多芬的许多作品可以这样理解：<mark>苦难</mark>不可避免，但与之抗争的勇气使人生值得一活。", "r": "2014 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2295, "w": "sufficient", "f": 2, "m": "suf-（在下、起支撑作用）+fic（做）+-ient（具有相应性质的）", "s": [{"d": "1. adj. 足够的、充分的（2）", "e": "The premise was that the common law of contract lacked <mark>sufficient</mark> safeguards for workers against arbitrary conduct by management.", "z": "其前提是，普通合同法缺乏<mark>充分</mark>的保障措施，无法保护工人免受管理层任意行为的侵害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2296, "w": "supervise", "f": 2, "m": "super-（在上方、负责全局）+vis（看）+e（词形结尾）", "s": [{"d": "1. v. 监督；指导（2）", "e": "In 1924 America&#x27;s National Research Council sent two engineers to <mark>supervise</mark> a series of experiments at a telephone-parts factory called the Hawthorne Plant near Chicago.", "z": "1924年，美国国家研究委员会派出两名工程师，到芝加哥附近一家名为霍桑工厂的电话零件厂，<mark>监督</mark>一系列实验。", "r": "2010 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 2297, "w": "supervision", "f": 2, "m": "supervis-（supervise去e，监督）+ion（行为、过程）", "s": [{"d": "1. n. 监督；监管（2）", "e": "[ B ] The FCC should be put under strict <mark>supervision</mark>.", "z": "[B] 联邦通信委员会应受到严格<mark>监督</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 40 题 · 选项 B · 真题选项"}]}, {"id": 2298, "w": "suppression", "f": 2, "m": "suppress（镇压、压制、抑制）+-ion（行为或过程）", "s": [{"d": "1. n. 压制；扑灭（火灾）（2）", "e": "The NAFSN sites experienced less than a quarter of the number of fires that would have been expected without fire <mark>suppression</mark>.", "z": "NAFSN各观测点经历的火灾数量，不到没有<mark>灭火</mark>措施时预计数量的四分之一。", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2299, "w": "surely", "f": 2, "m": "sure（确信的、确定的）+-ly（以这种态度）", "s": [{"d": "1. adv. 无疑；肯定（2）", "e": "<mark>Surely</mark> there must be some middle ground that balances zoos&#x27; treatment of animals with their educational potential.", "z": "<mark>肯定</mark>存在某种折中立场，可以在动物园对待动物的方式与其教育潜力之间取得平衡。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 2300, "w": "surprising", "f": 2, "m": "surpris（surprise去e，使惊讶）+-ing（具有这种作用的）", "s": [{"d": "1. adj. 令人惊讶的（2）", "e": "Such an encouraging result is not <mark>surprising</mark>.", "z": "如此令人鼓舞的结果并不<mark>令人惊讶</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}];

try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
