<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 09 (801-900) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

35 题"}, {"d": "3. n. 语境不足：理解或欣赏（1）", "e": "[ B ] <mark>appreciation</mark>", "z": "［B］<mark>理解</mark>；<mark>欣赏</mark>。", "r": "2026 · 英语一 · 完形填空 · 第 19 题 · 选项 B · 真题选项"}]}, {"id": 809, "w": "art-science", "f": 6, "m": "art（艺术）+science（科学）", "s": [{"d": "1. 短语 艺术与科学相结合的（6）", "e": "The reach of <mark>art-science</mark> tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.", "z": "<mark>艺术与科学</mark>合作的影响范围，需要超越传播研究成果这一必要目的，而且参与者不能陷入以刻板印象看待彼此的陷阱。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 810, "w": "assumption", "f": 6, "m": "assumpt（承担；假定；assume的词干变体）+-ion（名词后缀）", "s": [{"d": "1. n. 假设；想当然的看法（6）", "e": "California has asked the justices to refrain from a sweeping ruling, particularly one that upsets the old <mark>assumption</mark> that authorities may search through the possessions of suspects at the time of their arrest.", "z": "加利福尼亚州要求大法官们避免作出影响广泛的裁决，尤其不要推翻长期以来的一项<mark>假定</mark>，即当局可以在逮捕嫌疑人时搜查其随身物品。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 811, "w": "balance", "f": 6, "m": "", "s": [{"d": "1. n. 平衡、使平衡（4）", "e": "But on the more important matter of the Constitution, the decision was an 8-0 defeat for the Administration&#x27;s effort to upset the <mark>balance</mark> of power between the federal government and the states.", "z": "但在更重要的宪法问题上，这项裁决以8比0使政府试图打破联邦与各州之间权力<mark>平衡</mark>的努力遭到失败。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 平衡、使平衡（2）", "e": "Surely there must be some middle ground that <mark>balances</mark> zoos&#x27; treatment of animals with their educational potential.", "z": "肯定存在某种折中立场，可以在动物园对待动物的方式与其教育潜力之间取得<mark>平衡</mark>。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 812, "w": "bear", "f": 6, "m": "", "s": [{"d": "1. v. 带有；具有（3）", "e": "Some of the trees he analyzed <mark>bore</mark> more than 20 fire scars among their rings.", "z": "他分析的一些树木，其年轮中<mark>带有</mark>二十多处火灾疤痕。", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 使发挥作用；运用（bring to bear）（1）", "e": "To encourage innovation and competition, the report calls for increased investment in research, the crafting of coherent curricula that improve students&#x27; ability to solve problems and communicate effectively in the 21st century, increased funding for teachers and the encouragement of scholars to bring their learning to <mark>bear</mark> on the great challenges of the day.", "z": "为鼓励创新和竞争，报告呼吁增加研究投资，精心编制连贯的课程，以提高学生在21世纪解决问题和有效交流的能力，增加对教师的资助，并鼓励学者<mark>运用</mark>所学知识应对当今的重大挑战。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 承担；承受（1）", "e": "Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be <mark>borne</mark> by those who use it, rather than the general taxpayer.", "z": "历届政府都允许这样的涨价，理由是铁路网络的投资与运营成本应由使用者<mark>承担</mark>，而非由普通纳税人<mark>承担</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "4. v. 证实；支持（bear out）（1）", "e": "Neither of these patterns is <mark>borne</mark> out by the analysis, suggesting that the structures of the languages are lineage-specific and not governed by universals.", "z": "分析未能<mark>证实</mark>这两种模式中的任何一种，这表明语言结构为各自语系所特有，并不受普遍规律支配。", "r": "2012 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 813, "w": "brand", "f": 6, "m": "", "s": [{"d": "1. n. 品牌（5）", "e": "The theory also seems to explain the sudden and unexpected popularity of certain looks, <mark>brands</mark>, or neighborhoods.", "z": "这一理论似乎还能够解释，为什么某些造型、<mark>品牌</mark>或街区会突然出乎意料地流行起来。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 把……污名化；给……贴标签（1）", "e": "Offering up such a theory during a time of high tension between scientific and religious minds was <mark>branded</mark> as heresy and any such heretics that continued to spread these lies were to be punished by imprisonment or even death.", "z": "在科学思想与宗教思想关系高度紧张的时期，提出这样的理论会被<mark>扣上</mark>异端的帽子，而任何继续传播这些谎言的异端者都将受到监禁甚至死刑的惩罚。", "r": "2020 · 英语一 · 阅读理解 C 7; ability to seek long-term prosperity and has prevented market participants from <mark>competing</mark> on an even playing field.&quot;", "z": "肯尼迪写道，该规定“限制了各州谋求长期繁荣的能力，并阻碍市场参与者在公平的竞争环境中展开<mark>竞争</mark>”。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 相互冲突；相互竞争（1）", "e": "As a discovery claim works its way through the community, the interaction and confrontation between shared and <mark>competing</mark> beliefs about the science and the technology involved transforms an individual&#x27;s discovery claim into the community&#x27;s credible discovery.", "z": "当一项发现主张在科学共同体中逐步传播时，围绕相关科学技术的共同信念与<mark>相互冲突</mark>的信念之间的互动和交锋，会将个人的发现主张转化为共同体认可的可信发现。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 825, "w": "competitive", "f": 6, "m": "compete（竞争，去掉末尾e）+-itive（本词的形容词结尾）", "s": [{"d": "1. adj. 竞争的；有竞争力的（6）", "e": "Johnson &amp; Johnson, for example, has created BabyCenter, a stand-alone media property that promotes complementary and even <mark>competitive</mark> products.", "z": "例如，强生公司创建了BabyCenter，这是一个独立的媒体平台，推广互补产品，甚至也推广<mark>竞争</mark>产品。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 826, "w": "compromise", "f": 6, "m": "com-（共同）+promise（答应、承诺）", "s": [{"d": "1. v. 妥协；让步（4）", "e": "The astronomy community is making <mark>compromises</mark> to change its use of Mauna Kea.", "z": "天文学界正在作出<mark>妥协</mark>，以改变其使用莫纳克亚山的方式。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 损害（1）", "e": "[ B ] <mark>compromised</mark>", "z": "[B] <mark>损害</mark>了", "r": "2012 · 英语一 · 完形填空 · 第 4 题 · 选项 B · 真题选项"}, {"d": "3. v. 危及；损害（1）", "e": "The details may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being <mark>compromised</mark>.", "z": "细节也许无从得知，但标准制定者的独立性正在受到<mark>损害</mark>，而这种独立性对资本市场的正常运作至关重要。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 827, "w": "consensus", "f": 6, "m": "con-（共同）+sens（感觉、看法）+us（名词词形结尾）", "s": [{"d": "1. n. 共识；一致意见（6）", "e": "The t in our common sense.", "z": "心理健康是一颗<mark>包含</mark>自尊的种子；自尊就是对自己的信心，以及相信自身常识的能力。", "r": "2016 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 832, "w": "contribution", "f": 6, "m": "contribute（贡献、捐献、投稿）+-ion（行为或交出内容的名词后缀）", "s": [{"d": "1. n. 贡献；捐助（5）", "e": "Neither one of them actually participated in any <mark>contributions</mark> to animal research or conservation.", "z": "他们两人实际上都没有参与任何为动物研究或保护作出<mark>贡献</mark>的活动。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. n. 缴款、缴纳金额（1）", "e": "Even the very phrase &quot;jobseeker&#x27;s allowance&quot; is about redefining the unemployed as a &quot;jobseeker&quot; who had no fundamental right to a benefit he or she has earned through making national insurance <mark>contributions</mark>.", "z": "甚至“求职者津贴”这一说法本身，也是在把失业者重新界定为“求职者”，不再承认其对通过<mark>缴纳</mark>国民保险费而获得的福利享有基本权利。", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 833, "w": "controversy", "f": 6, "m": "contro-（相反、对抗）+vers（转向）+y（名词词尾）", "s": [{"d": "1. n. 争议（6）", "e": "Some blame for the current <mark>controversy</mark> belongs to astronomers.", "z": "当前<mark>争议</mark>的部分责任应归于天文学家。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 834, "w": "copy", "f": 6, "m": "", "s": [{"d": "1. n. 复制品， 副本（3）", "e": "The success of Sci-Hub, which relies on researchers passing on <mark>copies</mark> they have themselves legally accessed, shows the legal ecosystem has lost legitimacy among its users and must be transformed so that it works for all participants.", "z": "Sci-Hub依赖研究人员转交他们合法获取的论文<mark>副本</mark>；它的成功表明，合法的出版生态系统已在用户心中失去正当性，必须转型，才能为所有参与者服务。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 复制（2）", "e": "[ C ] <mark>copy</mark>", "z": "[C] <mark>复制</mark>。", "r": "2016 · 英语一 · 完形填空 · 第 8 题 · 选项 C · 真题选项"}, {"d": "3. n. 广告文案（1）", "e": "For example, AI can be used to analyse what type of advertising content or <mark>copy</mark> would be appropriate to &quot;speak&quot; to a specific target customer group by revealing information about trends and preferences through the analysis of big data.", "z": "例如，人工智能可以通过分析大数据揭示趋势和偏好信息，据此分析哪类广告内容或<mark>文案</mark>适合与特定目标客户群“对话”。", "r": "2023 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 835, "w": "copyright", "f": 6, "m": "copy（复制）+right（权利）", "s": [{"d": "1. n. 版权（4）", "e": "As a result, they are raising tricky questions about ethics and <mark>copyright</mark>.", "z": "因此，它们引出了有关伦理和<mark>版权</mark>的棘手问题。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 受版权保护的（2）", "e": "Artists say they risk losing income as people start using AI-generated images based on <mark>copyrighted</mark> material for commercial purposes.", "z": "艺术家表示，随着人们开始将人工智能利用<mark>受版权保护</mark>的素材生成的图像用于商业目的，他们面临收入流失的风险。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 836, "w": "corporation", "f": 6, "m": "corpor（身体、整体）+-ation（形成的组织或实体）", "s": [{"d": "1. n. 公司，企业（尤指大型的、有限责任的）（6）", "e": "The conflict has been surfacing since 2002, when the <mark>corporation</mark> bought Vermont&#x27;s only nuclear power plant, an aging reactor in Vernon.", "z": "这一冲突从2002年就开始显现，当时该<mark>公司</mark>收购了佛蒙特州唯一的核电站，即位于弗农的一座老化的反应堆。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 837, "w": "creativity", "f": 6, "m": "creative（去e，有创造力的）+-ity（性质、能力）", "s": [{"d": "1. n. 创造力；创造性（6）", "e": "Curriculums - from grammar school to college - should evolve to focus less on memorizing facts and more on <mark>creativity</mark> and complex communication.", "z": "从小学到大学的课程都应当逐步调整，减少对事实记忆的侧重，更多关注<mark>创造力</mark>和复杂沟通能力。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 838, "w": "credibility", "f": 6, "m": "credible（末尾ble变bil，可信的）+-ity（性质、状态）", "s": [{"d": "1. n. 可信度；公信力（6）", "e": "Two paradoxes exist throughout this <mark>credibility</mark> process.", "z": "在这一建立<mark>可信度</mark>的整个过程中，始终存在着两个悖论。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 839, "w": "date", "f": 6, "m": "dat（给、给定）+e（词形结尾）", "s": [{"d": "1. adj. 过时（out ofdate）（2）", "e": "[ A ] sticks to an out-of-<mark>date</mark> order.", "z": "[A] 固 ver</mark> sustainable computing and deliver more LUMIs.", "z": "如果世界要实现净零排放目标，我们就必须认真思考如何<mark>实现</mark>可持续计算，并建造更多LUMI超级计算机。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 842, "w": "developer", "f": 6, "m": "develop（开发）+-er（从事者）", "s": [{"d": "1. n. 房地产开发商（4）", "e": "Issues arise, however, when <mark>developers</mark> attempt to create large-scale short-term rental facilities-de facto hotels-to bypass taxes and regulations.", "z": "然而，当<mark>开发商</mark>试图打造大规模的短期出租场所--实质上的酒店--以规避税收和法规时，问题就出现了。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 开发者；开发商（2）", "e": "This concept has served as a central goal for curriculum <mark>developers</mark>, local school boards, business and community leaders, and policymakers ever since its introduction nearly 80 years ago.", "z": "这一理念自近80年前被引入以来，一直是课程<mark>开发者</mark>、地方学校董事会、商业和社区领袖以及政策制定者的核心目标。", "r": "2026 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 843, "w": "device", "f": 6, "m": "", "s": [{"d": "1. n. 设备；装置（6）", "e": "But keeping sensitive information on these <mark>devices</mark> is increasingly a requirement of normal life.", "z": "但将敏感信息保存在这些<mark>设备</mark>上，越来越成为正常生活的必需。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 844, "w": "difficulty", "f": 6, "m": "difficult（困难的）+-y（性质、状态）", "s": [{"d": "1. n. 困难；难度（6）", "e": "But these provisions create <mark>difficulties</mark> for businesses when applied to highly paid managers and executives.", "z": "然而，这些条款适用于薪酬很高的经理和高管时，会给企业带来<mark>困难</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 845, "w": "discipline", "f": 6, "m": "discipl（教学、训练）+ine（词形结尾）", "s": [{"d": "1. n. 学科；专业领域（5）", "e": "As science and technology progressed, and divided into more sub-<mark>disciplines</mark>, the centre was simultaneously looking to a time when leading researchers could also be artists, writers and poets, and vice versa.", "z": "随着科学技术的发展并分化为更多子<mark>学科</mark>，该中心也同时展望着这样一个时代：顶尖研究人员也可以成为艺术家、作家和诗人，反之亦然。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 自律；自制力（1）", "e": "So when young people are critical of an over-tweeting president, they reveal a mental <mark>discipline</mark> in thinking skills -and in their choices on when to share on social media.", "z": "因此，当年轻人批评一位过度发推文的总统时，他们在思考能力以及选择何时在社交媒体上分享内容方面，展现出了心智上的<mark>自律</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 846, "w": "dismiss", "f": 6, "m": "dis-（分开、离去）+miss（派遣、送走）", "s": [{"d": "1. v. 不予考虑；否定（2）", "e": "Don&#x27;t <mark>dismiss</mark> that possibility entirely.", "z": "不要完全<mark>排除</mark>这种可能性。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 解雇（2）", "e": "If not placing jobs at risk, to the extent employment protection laws constrain business owners from <mark>dismissing</mark> under-performing managers, those laws act as a constraint on firm productivity and therefore on workers&#x27; wages.", "z": "就业保护法限制企业主<mark>解雇</mark>表现不佳的管理者，就算没有使就业岗位面临风险，也会相应制约企业生产率，进而制约工人的工资。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 贬低；驳回（2）", "e": "[ A ] <mark>dismissed</mark>", "z": "[A] <mark>驳回</mark>了", "r": "2012 · 英语一 · 完形填空 · 第 17 题 · 选项 A · 真题选项"}]}, {"id": 847, "w": "dramatic", "f": 6, "m": "drama（戏剧）+-tic（本词形容词结尾）", "s": [{"d": "1. adj. 显著的；剧烈的；引人注目的（4）", "e": "Curbs on business-method claims would be a <mark>dramatic</mark> about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, approving a patent on a way of pooling mutual-fund assets.", "z": "限制商业方法专利申请将是一次<mark>重大</mark>转向，因为正是联邦巡回上诉法院在1998年所谓的道富银行案裁决中，批准了一项汇集共同基金资产的方法专利，从而引入了此类专利。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 戏剧的；有关戏剧的（2）", "e": "(50) To realize how great was the <mark>dramatic</mark> activity, we must remember further that hosts of plays have been lost, and that probably there is no author of note whose entire work has survived.", "z": "（50）要认识到<mark>戏剧</mark>活动曾是何等繁盛，我们还必须记住，大量剧作已经失传，而且恐怕没有哪位著名作家的全部作品都流传了下来。", "r": "2018 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 848, "w": "economist", "f": 6, "m": "econom（经济）+-ist（从事者、专家）", "s": [{"d": "1. n. 经济学家（6）", "e": "I am an <mark>economist</mark>, after all.", "z": "毕竟，我是一名<mark>经济学家</mark>。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 849, "w": "employ", "f": 6, "m": "em-（进入）+ploy（折叠；卷入，历史词干）", "s": [{"d": "1. v. 使用；采用（3）", "e": "(48) Scientists have <mark>employed</mark> a variety of ways to engage the general public in their research, such as making data analysis into an online game or sample collection into a smartphone application.", "z": "（48）科学家<mark>采用</mark>了各种方式让普通公众参与研究，比如将数据分析变成在线游戏，或将样本采集变成智能手机应用程序。", "r": "2025 · 英语一 · 阅读理解 C · 第 48 题"}, {"d": "2. v. 雇用（3）", "e": "Its lawmakers gave preliminary approval last week to a law that would make it a crime to <mark>employ</mark> ultra-thin models on runways.", "z": "该国立法者上周初步批准了一项法律，将<mark>雇用</mark>极瘦模特走秀定为犯罪。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 850, "w": "enable", "f": 6, "m": "en-（使具有、使进入）+able（能够、有能力）", "s": [{"d": "1. v. 使能够、使成为可能（6）", "e": "Their well-developed hippocampal structures may <mark>enable</mark> elephants, like rats and people, to construct cognitive maps.", "z": "发育完善的海马体结构或许<mark>能使</mark>大象像老鼠和人一样，构建认知地图。", "r": "2024 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 851, "w": "engagement", "f": 6, "m": "engage（参与；订约，去词尾-e）+-ment（行为、状态或结果）", "s": [{"d": "1. n. 参与；投入（6）", "e": "But they show comprehension to consist not just of passive assimilation but of active <mark>engagement</mark> in inference and problem-solving.", "z": "但它们表明，理解不仅由被动吸收构成，也包括主动<mark>参与</mark>推断和解决问题。", "r": "2015 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 852, "w": "enormous", "f": 6, "m": "e-（出、超出）+norm（通常尺度、标准）+-ous（具有这种性质的）", "s": [{"d": "1. adj. 巨大的；庞大的（6）", "e": "There&#x27;s no doubt that our peer groups exert <mark>enormous</mark> influence on our behavior.", "z": "毫无疑问，我们的同辈群体会对我们的行为施加<mark>巨大</mark>影响。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"i d pensions, for example, against <mark>hostility</mark> from special interests.", "z": "财务会计准则委员会和国际会计准则理事会恰恰如此，例如，它们顶着特殊利益集团的<mark>敌意</mark>，清理了有关股票期权和养老金的规则。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 875, "w": "hunter-gatherer", "f": 6, "m": "hunter（猎取动物的人）+gatherer（收集食物的人）", "s": [{"d": "1. n. 狩猎采集者（的）（6）", "e": "Parenting tips obtained from <mark>hunter-gatherers</mark> in Africa may be the key to bringing up more contented children, researchers have suggested.", "z": "研究人员提出，从非洲<mark>狩猎采集者</mark>那里获得的育儿诀窍，或许是养育更知足快乐的孩子的关键。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 876, "w": "immune", "f": 6, "m": "im-（免除、不）+mun（义务、负担）+e（词形结尾）", "s": [{"d": "1. adj. 不受…影响的；免受…的（4）", "e": "Nor are highly paid managers themselves <mark>immune</mark> from the harm caused by the ERA&#x27;S unjustified dismissal procedures.", "z": "高薪管理者本人也无法<mark>免受</mark>《雇佣关系法》中不当解雇程序所造成的伤害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 免疫的（2）", "e": "It is like the <mark>immune</mark> system of the body, which under stress or through lack of nutrition or exercise can be weakened, but which never leaves us.", "z": "它就像人体的<mark>免疫</mark>系统，在压力下或缺乏营养、运动时可能减弱，却从不会离开我们。", "r": "2016 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 877, "w": "implication", "f": 6, "m": "im-（向内）+plic（折叠）+-ation（内容或关系的名词后缀）", "s": [{"d": "1. n. 影响；可能后果（3）", "e": "It is hard, the state argues, for judges to assess the <mark>implications</mark> of new and rapidly changing technologies.", "z": "州政府认为，法官很难评估不断迅速变化的新技术可能带来的<mark>影响</mark>。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 暗含的意思；含义（3）", "e": "The <mark>implication</mark> is that Millennials prefer news from the White House to be filtered through other sources, not a president&#x27;s social media platform.", "z": "其<mark>言下之意</mark>是，千禧一代更愿意通过其他来源的筛选来获取白宫新闻，而不是通过总统的社交媒体平台。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 878, "w": "indeed", "f": 6, "m": "in（在……中）+deed（实际做出的事）", "s": [{"d": "1. adv. 确实；的确（6）", "e": "Young people who are digital natives are <mark>indeed</mark> becoming more skillful at separating fact from fiction in cyberspace.", "z": "作为数字原住民的年轻人，<mark>的确</mark>越来越善于在网络空间中区分事实与虚构。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 879, "w": "inevitable", "f": 6, "m": "in-（不）+evit（避免）+-able（能够……的）", "s": [{"d": "1. adj. 不可避免的；必然的（6）", "e": "(50) One could interpret much of the work of Beethoven by saying that suffering is <mark>inevitable</mark>, but the courage to fight it renders life worth living.", "z": "（50）贝多芬的许多作品可以这样理解：苦难<mark>不可避免</mark>，但与之抗争的勇气使人生值得一活。", "r": "2014 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 880, "w": "infant", "f": 6, "m": "in-（不）+fant（说话）", "s": [{"d": "1. n. 婴儿（6）", "e": "Many of the ships were lost in storms, many passengers died of disease, and <mark>infants</mark> rarely survived the journey.", "z": "许多船只在风暴中沉没，许多乘客死于疾病，而<mark>婴儿</mark>很少能从这段旅程中幸存下来。", "r": "2015 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 881, "w": "insect", "f": 6, "m": "in-（在里面）+sect（切分、分节）", "s": [{"d": "1. n. 昆虫（6）", "e": "(46) Scientists jumped to the rescue with some distinctly shaky evidence to the effect that <mark>insects</mark> would eat us up if birds failed to control them.", "z": "（46）科学家们迅速赶来救场，拿出一些明显站不住脚的证据，大意是，如果鸟类不能控制<mark>昆虫</mark>，<mark>昆虫</mark>就会把我们吃光。", "r": "2010 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 882, "w": "integrity", "f": 6, "m": "integr（完整、无缺）+-ity（性质、状态的名词后缀）", "s": [{"d": "1. n. 正直；诚信（5）", "e": "<mark>Integrity</mark> had collapsed, she argued, because of a collective acceptance that the only &quot;sorting mechanism&quot; in society should be profit and the market.", "z": "她认为，<mark>诚信</mark>已经崩塌，因为大家共同接受了这样一种观念：社会中唯一的“筛选机制”应当是利润和市场。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 完整性（1）", "e": "Yet these creatures are members of the biotic community and, if its stability depends on its <mark>integrity</mark>, they are entitled to continuance.", "z": "然而，这些生物是生物群落的成员；如果群落的稳定性取决于其<mark>完整性</mark>，那么它们就有权继续生存。", "r": "2010 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 883, "w": "intensive", "f": 6, "m": "in-（向内、集中到）+tens（拉伸、绷紧）+-ive（具有相应性质的）", "s": [{"d": "1. adj. 密集的；集中的（3）", "e": "This abrupt shift to an &quot;<mark>intensive</mark> mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.", "z": "这种突然转向“<mark>密集</mark>育儿叙事”的变化很可能造成了伤害，因为这种叙事暗示，母亲应独自承担育儿工作。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 耗能大的（energy-intensive）（3）", "e": "The crisis is here, they said, and we need to cut back on our energy-<mark>intensive</mark> modelling.", "z": "他们说，危机已经到来，我们需要减少<mark>高能耗</mark>的建模工作。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 884, "w": "interpretation", "f": 6, "m": "interpret（解释、口译）+-ation（行为、结果的名词后缀）", "s": [{"d": "1. n. 解释；理解；诠释（6）", "e": "It can be hard for scientists to make the case because our work is complex, often takes place behind closed doors and does not always lend itself to easy <mark>interpretation</mark> or explanation.", "z": "科学家可能很难把道理讲清楚，因为我们的工作很复杂，常常在不公开的情况下进行，也并不总是适合用简单的方式来<mark>解读</mark>或解释。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 885, "w": "island", "f": 6, "m": "", "s": [{"d": "1. n. 岛；岛屿（6）", "e": "They did not always prioritize the protection of Mauna Kea&#x27;s fragile ecosystems or its holiness to the <mark>island&#x27;s</mark> inhabitants.", "z": "他们并非始终优先保护莫纳克亚山脆弱的生态系统，或优先尊重它在<mark>岛</mark>上居民心中的神圣地位。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 886, "w": "jump", "f": 6, "m": "", "s": [{"d": "1. v. 跳槽；离职（比喻跳离）（3）", "e": "Those who <mark>jumped</mark> without a job haven&#x27;t always landed in top positions quickly.", "z": "那些没找到下一份工作就<mark>跳槽</mark>的人，并不总能迅速获得高层职位。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 激增（1）", "e": "[ A ] <mark>jump</mark>", "z": "［A］<mark>激增</mark>。", "r": "2013 · 英语一 · 完形填空 · 第 18 题 · 选项 A · 真题选项"}, {"d": "3. v. 跳；跃（1）", "e": "These pauses typically occur at about three per second, and the eyes then <mark>jump</mark> to another spot, until several important points in the image are registered like a series of snapshots.", "z": "这种停顿通常每秒发生约三次，随后眼睛便<mark>跳</mark>向另一处，直到图像中的几个重要点像一连串快照那样被记录在脑中。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "4. v. 迅速行动（1）", "e": "(46) Scientists <mark>jumped</mark> to the rescue with some distinctly shaky evidence to the effect that insects would eat us up if birds failed to control them.", "z": "（46）科学家们<mark>迅速赶来</mark>救场，拿出一些明显站不住脚的证据，大意是，如果鸟类不能控制昆虫，昆虫就会把我们吃光。", "r": "2010 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 887, "w": "leader", "f": 6, "m": "lead（引导、领导）+er（做某事的人）", "s": [{"d": "1. n. 领导者（6）", "e": "Its current <mark>leader</mark>, Ed Miliband, owes his position to votes from public-sector unions.", "z": "现任<mark>领导人</mark>埃德·米利班德能够获得这一职位，要归功于公共部门工会的选票。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 888, "w": "literature", "f": 6, "m": "liter（文字、书写）+-ature（活动成果或集合的名词结尾）", "s": [{"d": "1. n. 文学（4）", "e": "For a time <mark>literature</mark> showed no interest in this public stage.", "z": "有一段时间，<mark>文学</mark>对这个公共舞台毫无兴趣。", "r": "2018 · 英语一 · 阅读理解 C · 第 48、49 题"}, {"d": "2. n. 文献（2）", "e": "It was only after I started to write a weekly column about the medical journals, and began to read scientific papers from beginning to end, that I realised just how bad much of the medical <mark>literature</mark> frequently was.", "z": "直到我开始每周撰写有关医学期刊的专栏，并从头到尾阅读科学论文之后，我才意识到许多医学<mark>文献</mark>往往有多么糟糕。", "r": "2019 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 889, "w": "living", "f": 6, "m": "liv-（live去e，生活、活着）+-ing（持续状态、活动或相关事物）", "s": [{"d": "1. n. 生活的；生活方式（3）", "e": "Half a century of town and country planning has enabled it to retain an enviable rural coherence, while still permitting low-density urban <mark>living</mark>.", "z": "半个世纪的城乡规划使它保留了令人羡慕的乡村整体风貌，同时仍允许低密度的城市<mark>生活</mark>。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 活着的；有生命的（3）", "e": "Hawaiian culture is not a relic of the past; it is a <mark>living</mark> culture undergoing a renaissance today.", "z": "夏威夷文化不是过去的遗迹，而是一种<mark>有生命力的</mark>文化，如今正经历复兴。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 890, "w": "location", "f": 6, "m": "loc（地点、位置）+-ation（表示相关事物或行为的名词后缀）", "s": [{"d": "1. n. 地点，位置（6）", "e": "There are around 40 official do-it-yourself biology centres across the globe in <mark>locations</mark> including Paris, London, Sydney, and Tel Aviv.", "z": "全球约有40个正式的自助生物实验中心，分布在巴黎、伦敦、悉尼和特拉维夫等<mark>地点</mark>。", "r": "2025 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 891, "w": "monarch", "f": 6, "m": "mon（独一）+arch（统治者）", "s": [{"d": "1. n. 君主（6）", "e": "It is this apparent transcendence of politics that explains <mark>monarchs</mark>&#x27; continuing popularity as heads of state.", "z": "正是这种看似超越政治的地位，解释了<mark>君主</mark>作为国家元首持续受到欢迎的原因。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 892, "w": "moreover", "f": 6, "m": "more（更多）+over（在已有内容之上）", "s": [{"d": "1. adv. 此外；而且（6）", "e": "<mark>Moreover</mark>, the amateur tradition in music criticism has been in headlong retreat.", "z": "<mark>此外</mark>，音乐评论中的业余传统一直在迅速衰退。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 893, "w": "multiple", "f": 6, "m": "mult（多）+i（连接字母）+ple（倍、重）", "s": [{"d": "1. adj. 多个的；多种的（6）", "e": "With <mark>multiple</mark> networks and countless podcasts, a smartphone user selects what to hear and when.", "z": "面对<mark>多个</mark>广播网和数不清的播客，智能手机用户可以选择听什么以及何时听。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 894, "w": "narrative", "f": 6, "m": "narrat（叙述；narrate去e）+-ive（形容词或名词后缀）", "s": [{"d": "1. n. 叙述；故事；叙事（5）", "e": "&quot;Such <mark>narratives</mark> can lead to maternal exhaustion and have dangerous consequences,&quot; they wrote.", "z": "他们写道：“这种<mark>叙述</mark>可能导致母亲身心俱疲，并带来危险的后果。”", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 叙事的（1）", "e": "[ F ] In plays, novels and <mark>narrative</mark> poems, characters speak as constructs created by the author, not necessarily as mouthpieces for the author&#x27;s own thoughts.", "z": "[F] 在戏剧、小说和<mark>叙事</mark>诗中，人物是以作者塑造的虚构形象的身份说话，并不一定是作者本人思想的代言人。", "r": "2015 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 895, "w": "necessity", "f": 6, "m": "necess（必需、不可避免）+-ity（性质或相关事物的名词后缀）", "s": [{"d": "1. n. 必要性、需要（4）", "e": "[ C ] reassess the <mark>necessity</mark> of college education.", "z": "[C] 重新评估大学教育的<mark>必要性</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26 题 · 选项 C · 真题选项"}, {"d": "2. n. 必然、不得已（of necessity）（1）", "e": "Of <mark>necessity</mark>, colonial America was a projection of Europe.", "z": "殖民时期的美洲<mark>必然</mark>是欧洲的投影。", "r": "2015 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "3. n. 必需品（1）", "e": "Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a virtual <mark>necessity</mark> of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.", "z": "法学教授奥林·克尔把21世纪数字信息的爆炸式增长及其易获取性，比作20世纪汽车在事实上成为生活<mark>必需品</mark>的过程：当时，大法官们不得不为乘用车这一新的个人领域制定新规则；如今，他们必须弄清第四修正案如何适用于数字信息。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 896, "w": "obscure", "f": 6, "m": "", "s": [{"d": "1. adj. 不知名的（2）", "e": "Oman rated Scovell&#x27;s significance highly, but at the same time, the general nature of his History meant that (48) he could not analyze carefully what this <mark>obscure</mark> officer may or may not have contributed to that great struggle between nations or indeed tell us anything much about the man himself.", "z": "奥曼高度评价斯科维尔的重要性，但与此同时，他的《历史》是一部通史，这意味着（48）他无法仔细分析这位<mark>默默无闻的</mark>军官究竟有没有、又有多少贡献于那场国家间的重大斗争，也无法详尽讲述这个人本身。", "r": "2022 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "2. adj. 模糊的；难理解的（2）", "e": "The legal issues in the case are <mark>obscure</mark>: whereas the Supreme Court has ruled that states do have some regulatory authority over nuclear power, legal scholars say that Vermont case will offer a precedent-setting test of how far those powers extend.", "z": "本案涉及的法律问题<mark>并不明朗</mark>：尽管最高法院已裁定，各州确实对核电拥有一定监管权，但法律学者表示，佛蒙特州案件将对这些权力究竟延伸到何种程度作出一次具有判例意义的检验。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 掩盖；使模糊（2）", "e": "Yet its report may well set back reform by <mark>obscuring</mark> the depth and breadth of the challenge that Congress asked it to illuminate.", "z": "然而，它的报告可能会阻碍改革，因为它<mark>掩盖</mark>了国会要求它阐明的挑战的深度和广度。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 897, "w": "observe", "f": 6, "m": "ob-（朝向）+serve（保持）", "s": [{"d": "1. v. 观察；察觉（5）", "e": "Were it not for opportunities to <mark>observe</mark> these beautiful, wild creatures close to home, many more people would be driven by their fascination to travel to wild areas to seek out, disturb and even hunt them down.", "z": "如果人们没有机会在家附近<mark>观察</mark>这些美丽的野生动物，就会有更多人因痴迷它们而前往野外，寻找、打扰，甚至追猎它们。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 指出；评论说（1）", "e": "And it carries &quot;significant repercussions for water quality and flood control throughout the United States,&quot; as Justice Brett Kavanaugh <mark>observed</mark>.", "z": "正如大法官布雷特·卡瓦诺所<mark>指出</mark>的，它还会“对全美的水质和洪水防控产生重大影响”。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 898, "w": "pace", "f": 6, "m": "", "s": [{"d": "1. n. 速度；节奏（6）", "e": "Last year marked the third year in a row that Indonesia&#x27;s bleak rate of deforestation has slowed in <mark>pace</mark>.", "z": "去年标志着印度尼西亚令人沮丧的森林砍伐速率连续第三年放缓了<mark>步伐</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 899, "w": "perceive", "f": 6, "m": "per-（通过、贯穿）+ceive（拿取、获取）", "s": [{"d": "1. v. 感知，察觉（4）", "e": "How the whole image is then assembled and <mark>perceived</mark> is still a mystery although it is the subject of current research.", "z": "随后，完整图像是如何被组合并被<mark>感知</mark>的，虽然正在受到研究，但仍然是一个谜。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 认为；看待（2）", "e": "Look for cues about how others <mark>perceive</mark> you.", "z": "寻找线索，了解别人如何<mark>看待</mark>你。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 900, "w": "percentage", "f": 6, "m": "percent（百分之……）+-age（名词后缀；数量）", "s": [{"d": "1. n. 百分比；比例（6）", "e": "Female participation on corporate boards may not currently mirror the <mark>percentage</mark> of women in the general population, but so what?", "z": "目前，公司董事会中的女性参与情况或许没有反映出女性在总人口中所占的<mark>比例</mark>，但那又怎样？", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}];

let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
