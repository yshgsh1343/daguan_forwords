<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 06 (501-600) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

持续依附的<mark>作品</mark>和体验。", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 504, "w": "deny", "f": 10, "m": "", "s": [{"d": "1. v. 否认（6）", "e": "[ B ] <mark>denied</mark>", "z": "［B］<mark>否认</mark>。", "r": "2017 · 英语一 · 完形填空 · 第 9 题 · 选项 B · 真题选项"}, {"d": "2. v. 拒绝给予（4）", "e": "Will those jurisdictions extend the same protections now <mark>denied</mark> under Sackett v. EPA?", "z": "这些司法管辖区如今会扩大保护范围，给予“萨克特诉环保署案”裁决所<mark>拒绝给予</mark>的同等保护吗？", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 505, "w": "enjoy", "f": 10, "m": "en-（使进入、处于）+joy（欢乐、乐趣）", "s": [{"d": "1. v. 享有（7）", "e": "Is there any chance that Cardus&#x27;s criticism will <mark>enjoy</mark> a revival?", "z": "卡达斯的评论作品是否还有可能<mark>迎来</mark>复兴？", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 享受（3）", "e": "There&#x27;s fun in testimonies of people <mark>enjoying</mark> the sheer newness.", "z": "人们<mark>享受</mark>那种十足的新鲜感，他们的亲身见证中充满了趣味。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 506, "w": "establish", "f": 10, "m": "e-（施加作用）+stabl（稳定、固定）+-ish（使成为的动词结尾）", "s": [{"d": "1. v. 建立；确立（9）", "e": "<mark>Established</mark> in an old paper mill, it is powered by a nearby river and its remote heat warms the people who live in the surrounding town of Kajaani.", "z": "它<mark>建</mark>在一座旧造纸厂里，由附近的一条河流提供动力，并将热量远程输送给周边卡亚尼镇的居民，为他们供暖。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 查明；确定（1）", "e": "The researchers first <mark>established</mark> what kinds of plant the elephants preferred either to eat or avoid when foraging freely.", "z": "研究人员首先<mark>查明</mark>，大象自由觅食时偏爱吃哪些植物，又会避开哪些植物。", "r": "2024 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 507, "w": "exercise", "f": 10, "m": "", "s": [{"d": "1. n. 锻炼（7）", "e": "No matter how you &quot;enhance&quot; enclosures, they do not allow for freedom, a natural diet or adequate <mark>exercise</mark>.", "z": "无论你怎样“改善”圈舍，它们都无法让动物获得自由、天然食物或充分的<mark>运动</mark>。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. n. 为某目的开展的活动；试验任务（1）", "e": "The new awards are an <mark>exercise</mark> in self-promotion for those behind them, say scientists.", "z": "科学家们说，这些新奖项是其幕后推动者进行自我宣传的<mark>活动</mark>。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 练习；训练项目（1）", "e": "In the United States, the desire to provide the public with a general, nontechnical education in science originated as far back as the late 1800s. (48) Educators advanced the idea of having students complete detailed laboratory <mark>exercises</mark> in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills.", "z": "在美国，向公众提供普通的、非专业性的科学教育这一愿望，早在19世纪末就已产生。（48）教育工作者提出，让高中生完成细致的实验室<mark>练习</mark>，因为他们认为这类活动的益处主要在于增强逻辑推理能力和观察技能。", "r": "2026 · 英语一 · 阅读理解 C · 第 48 题"}, {"d": "4. v. 锻炼（1）", "e": "Those forced to <mark>exercise</mark> their smiling muscles __18__ more enthusiastically to funny cartoons than did those whose mouths were contracted in a frown, __19__ that expressions may influence emotions rather than just the other way around.", "z": "那些被迫<mark>锻炼</mark>微笑肌肉的人，对有趣漫画的____比那些嘴部收紧、皱眉的人更加热烈，____表情可能影响情绪，而并非只是情绪影响表情。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 508, "w": "existing", "f": 10, "m": "exist（存在）+-ing（处于这种状态的）", "s": [{"d": "1. adj. 现有的（10）", "e": "Arizona had attempted to fashion state policies that ran parallel to the <mark>existing</mark> federal ones.", "z": "亚利桑那州曾试图制定与<mark>现有</mark>联邦政策并行的州政策。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 509, "w": "expression", "f": 10, "m": "express（向外表现）+ion（名词后缀）", "s": [{"d": "1. n. 表达；表述（7）", "e": "Hence it is metaphysical; but the means of <mark>expression</mark> is purely and exclusively physical: sound.", "z": "因此，它是形而上的；但其<mark>表达</mark>手段却纯粹且仅仅是物质性的：声音。", "r": "2014 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "2. n. 表情；神情（2）", "e": "Those forced to exercise their smiling muscles __18__ more enthusiastically to funny cartoons than did those whose mouths were contracted in a frown, __19__ that <mark>expressions</mark> may influence emotions rather than just the other way around.", "z": "那些被迫锻炼微笑肌肉的人，对有趣漫画的____比那些嘴部收紧、皱眉的人更加热烈，____<mark>表情</mark>可能影响情绪，而并非只是情绪影响<mark>表情</mark>。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "3. n. 体现；表现形式（1）", "e": "Recently, another <mark>expression</mark> of this predatory behavior has emerged: so-called support service consultancies that provide language and other editorial support to individual authors and to journals sometimes advise contributors to add a number of citations to their articles.", "z": "最近，这种掠夺行为又出现了一种<mark>表现形式</mark>：所谓提供辅助服务的咨询机构，为个人作者和期刊提供语言及其他编辑支持，有时会建议投稿者在文章中增加若干引文。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 510, "w": "fair", "f": 10, "m": "", "s": [{"d": "1. adj. 公平的；公正的（9）", "e": "Employers must both show cause and act in a procedurally <mark>fair</mark> way.", "z": "雇主既必须说明理由，也必须按照<mark>公平</mark>的程序行事。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 合理的；适当的（1）", "e": "It is <mark>fair</mark> to criticize and question the mechanism - that is the culture of research, after all - but it is the prize-givers&#x27; money to do with as they please.", "z": "批评和质疑这一机制是<mark>合理</mark>的--毕竟，这就是研究文化--但钱属于颁奖者，他们可以随心所愿地使用。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 511, "w": "generally", "f": 10, "m": "general（一般的、普遍的）+-ly（在这种情况下）", "s": [{"d": "1. adv. 一般地；通常（10）", "e": "The goals identified in the report are <mark>generally</mark> admirable.", "z": "报告中确定的目标<mark>总体上</mark>值得赞赏。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 512, "w": "gift", "f": 10, "m": "", "s": [{"d": "1. n. 礼物；馈赠（9）", "e": "It is wise to take such <mark>gifts</mark> with gratitude and grace.", "z": "怀着感激之情并以优雅得体的方式接受这样的<mark>馈赠</mark>，是明智之举。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 天赋；才能（1）", "e": "&quot;So few authors have brains enough or literary <mark>gift</mark> enough to keep their own end up in journalism,&quot; Newman wrote, &quot;that I am tempted to define &#x27;journalism&#x27; as &#x27;a term of contempt applied by writers who are not read to writers who are&#x27;.&quot;", "z": "纽曼写道：“拥有足够才智或文学<mark>天赋</mark>、能在新闻写作中独当一面的作家少之又少，因此我忍不住把‘新闻写作’定义为‘作品无人问津的作家用来称呼那些有人阅读的作家的一个蔑称’。”", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 513, "w": "inspire", "f": 10, "m": "in-（进入）+spire（呼吸、精神）", "s": [{"d": "1. v. 激励；启发（9）", "e": "It <mark>inspired</mark> me to learn more about the culture that it represented.", "z": "它<mark>激发</mark>了我进一步了解其所代表文化的兴趣。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 激起（希望）（1）", "e": "[ D ] <mark>inspire</mark> hopes in average people.", "z": "[D] <mark>激起</mark>普通人的希望。", "r": "2017 · 英语一 · 阅读理解 A Text 4 · 第 39 题 · 选项 D · 真题选项"}]}, {"id": 514, "w": "instance", "f": 10, "m": "in（在其中）+st（站立）+-ance（名词结尾）", "s": [{"d": "1. n. （for instance）例如（7）", "e": "Members of social networks, for <mark>instance</mark>, are learning that they can hijack media to apply pressure on the businesses that originally created them.", "z": "<mark>例如</mark>，社交网络的成员正在了解到，他们可以操控媒体，向最初创建这些媒体的企业施加压力。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 情形；实例（3）", "e": "The use of privacy law to curb the tech giants in this <mark>instance</mark> feels slightly maladapted.", "z": "在这种<mark>情形</mark>下，使用隐私法来约束科技巨头，感觉略有些不合适。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 515, "w": "learning", "f": 10, "m": "learn（学习）+ing（活动、过程及其所得的名词形式）", "s": [{"d": "1. n. 学习（8）", "e": "In such a case, the company&#x27;s response may not be sufficiently quick or thoughtful, and the <mark>learning</mark> curve has been steep.", "z": "在这种情况下，公司的回应可能不够迅速或周全，而且<mark>学习</mark>曲线一直十分陡峭。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 学识；所学知识（2）", "e": "Theirs was a serious business, and even those reviewers who wore their <mark>learning</mark> lightly, like George Bernard Shaw and Ernest Newman, could be trusted to know what they were about.", "z": "他们从事的是一项严肃的工作，即使像乔治·萧伯纳和欧内斯特· sually limited to freshmen, to give them a second chance to take a class in their first year if they <mark>struggled</mark> in their transition to college-level courses.", "z": "这项做法在几十年前刚开始时，通常只适用于一年级新生，目的是在他们<mark>难以适应</mark>大学课程时，让他们在第一学年有第二次修读某门课的机会。", "r": "2019 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 努力；奋力争取（2）", "e": "[ B ] Just Another Round of <mark>Struggle</mark> for Beauty", "z": "[B] 不过是又一轮追求美的<mark>努力</mark>", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 B · 真题选项"}]}, {"id": 538, "w": "thus", "f": 10, "m": "", "s": [{"d": "1. adv. 因此；从而（10）", "e": "The widespread availability of such recordings has <mark>thus</mark> brought about a crisis in the institution of the traditional classical concert.", "z": "<mark>因此</mark>，这类录音随处可得，给传统古典音乐会这一惯常形式带来了危机。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 539, "w": "undergraduate", "f": 10, "m": "under-（尚未达到）+graduate（大学毕业生）", "s": [{"d": "1. n. 本科生、本科的（10）", "e": "One idea is to allow people to study law as an <mark>undergraduate</mark> degree.", "z": "一个想法是允许人们在<mark>本科</mark>阶段攻读法律学位。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 540, "w": "western", "f": 10, "m": "west（西、西方）+-ern（方向、地区属性的形容词结尾）", "s": [{"d": "1. adj. 西方的（9）", "e": "World War II was the watershed event for higher education in modern <mark>Western</mark> societies.", "z": "第二次世界大战是现代<mark>西方</mark>社会高等教育的分水岭事件。", "r": "2021 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "2. adj. 西欧的（1）", "e": "These new forms were at first mainly written by scholars and performed by amateurs, but in England, as everywhere else in <mark>western</mark> Europe, the growth of a class of professional actors was threatening to make the drama popular, whether it should be new or old, classical or medieval, literary or farcical.", "z": "这些新形式起初主要由学者创作、业余演员表演，但在英格兰，如同在<mark>西欧</mark>其他地方一样，职业演员阶层的壮大正使戏剧有望走向大众，无论戏剧是新的还是旧的、古典的还是中世纪的、文学性的还是闹剧式的。", "r": "2018 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 541, "w": "advance", "f": 9, "m": "ad-（向）+vance（向前、前进）", "s": [{"d": "1. n. 进步；发展／促进发展（4）", "e": "<mark>Advances</mark> in artificial intelligence (AI) are rapidly changing every aspect of human life.", "z": "人工智能（AI）的<mark>进步</mark>正在迅速改变人类生活的各个方面。", "r": "2026 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. v. 前进；发展；促进发展（2）", "e": "[ A ] <mark>advanced</mark>", "z": "[A] <mark>推进了</mark>", "r": "2012 · 英语一 · 完形填空 · 第 5 题 · 选项 A · 真题选项"}, {"d": "3. n. 提前；预先（in advance）（1）", "e": "First two hours, now three hours - this is how far in <mark>advance</mark> authorities are recommending people show up to catch a domestic flight, at least at some major U.S. airports with increasingly massive security lines.", "z": "起初是两小时，现在是三小时--当局建议人们<mark>提前</mark>这么久到达机场，以便赶上国内航班；至少在美国一些安检队伍越来越庞大的主要机场，情况如此。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "4. n. 预付款（作者预付稿酬）（1）", "e": "It comes at a time when authors are already worried about the consequences of the proposed merger between PRH and another big publisher, Simon &amp; Schuster-the reduction in the number of unaligned UK publishers is likely to lead to fewer bidding wars, lower <mark>advances</mark>, and more conformity in terms of what is published.", "z": "这件事发生之时，作家们本就已担心企鹅兰登书屋与另一家大型出版商西蒙与舒斯特拟议合并的后果：英国独立出版商数量减少，可能导致竞价争夺减少、<mark>预付稿酬</mark>降低，以及出版内容更加趋同。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "5. v. 提出（观点或建议）（1）", "e": "In the United States, the desire to provide the public with a general, nontechnical education in science originated as far back as the late 1800s. (48) Educators <mark>advanced</mark> the idea of having students complete detailed laboratory exercises in high schools in the belief that such work was beneficial primarily as a way to enhance logical reasoning and observational skills.", "z": "在美国，向公众提供普通的、非专业性的科学教育这一愿望，早在19世纪末就已产生。（48）教育工作者<mark>提出</mark>，让高中生完成细致的实验室练习，因为他们认为这类活动的益处主要在于增强逻辑推理能力和观察技能。", "r": "2026 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 542, "w": "advocate", "f": 9, "m": "ad-（朝向）+voc（发声）+-ate（人或动作词形）", "s": [{"d": "1. n. 倡导者；支持者（6）", "e": "She exhibits the idealism common to many <mark>advocates</mark> of sustainability, be it in food or in energy.", "z": "她表现出许多可持续发展<mark>倡导者</mark>共有的理想主义，无论是在食品领域还是能源领域。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 提倡；主张；支持（3）", "e": "The report also <mark>advocates</mark> greater study of foreign languages, international affairs and the expansion of study abroad programs.", "z": "报告还<mark>主张</mark>加强外语和国际事务的学习，并扩大海外留学项目。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 543, "w": "assume", "f": 9, "m": "as-（向自己这边）+sume（拿取）", "s": [{"d": "1. v. 假设；认为（6）", "e": "You might even be tempted to <mark>assume</mark> that humanity has little future to look forward to.", "z": "你甚至可能不由得<mark>认为</mark>，人类的未来没有多少值得期待的东西。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 承担；担任（2）", "e": "As the war unfolded, science rapidly <mark>assumed</mark> a central role.", "z": "随着战争展开，科学迅速<mark>承担</mark>起核心作用。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "3. v. 呈现；采取（形式）（1）", "e": "In them we can see biophilia - a yearning for contact with nonhuman life - <mark>assuming</mark> uncanny representational forms.", "z": "在它们身上，我们可以看到亲生物倾向--一种渴望与非人类生命接触的愿望--<mark>呈现</mark>出奇异的具象形态。", "r": "2013 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 544, "w": "audience", "f": 9, "m": "audi（听）+-ence（相关人群或事情的名词结尾）", "s": [{"d": "1. n. 观众；听众；受众（9）", "e": "Who are your most important <mark>audiences</mark>?", "z": "你最重要的<mark>受众</mark>是谁？", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 545, "w": "boost", "f": 9, "m": "", "s": [{"d": "1. v. 促进；提升（8）", "e": "Likewise, automation should eventually <mark>boost</mark> productivity, stimulate demand by driving down prices, and free workers from hard, boring work.", "z": "同样，自动化最终应当能<mark>提高</mark>生产率，通过压低价格刺激需求，并使工人摆脱辛苦而枯燥的工作。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 促进；提升（1）", "e": "[ A ] <mark>boost</mark> citation counts for certain authors.", "z": "[A] <mark>提高</mark>某些作者的被引次数。", "r": " 婴儿的杂志<mark>封面</mark>，远非唯一的圣母与圣婴式图像。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 报道（2）", "e": "In those far-off days, it was taken for granted that the critics of major papers would write in detail and at length about the events they <mark>covered</mark>.", "z": "在那些遥远的岁月里，人们理所当然地认为，各大报纸的评论家会对其<mark>报道</mark>的事件作篇幅较长、详尽的论述。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 覆盖（2）", "e": "The nail hoard was discovered in 1960 in a four-metre-deep pit <mark>covered</mark> by two metres of gravel.", "z": "这批藏匿的钉子于1960年在一个四米深、<mark>覆盖</mark>着两米厚砾石的坑里被发现。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "4. v. 占（面积）（1）", "e": "<mark>Covering</mark> about two and a half acres, Pavlopetri&#x27;s three main roads __18__ some 50 rectangular buildings, all of which had open courtyards.", "z": "帕夫洛佩特里<mark>占地</mark>约两英亩半，其三条主要道路__18__约50座长方形建筑，每座建筑都有露天庭院。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "5. v. 涵盖（1）", "e": "[ D ] Surveys can <mark>cover</mark> a single large settlement or entire landscapes.", "z": "[D] 调查可以<mark>覆盖</mark>一个大型聚居地，也可以<mark>涵盖</mark>整个区域的地貌。", "r": "2014 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}, {"d": "6. v. 支付（1）", "e": "Publishers have responded to the demand that they make their product free to readers by charging their writers fees to <mark>cover</mark> the costs of preparing an article.", "z": "面对要求其产品向读者免费开放的呼声，出版商采取的应对办法是向作者收费，以<mark>支付</mark>文章制作成本。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 551, "w": "curb", "f": 9, "m": "cur（汽车）+b（阻挡）", "s": [{"d": "1. v. 抑制（9）", "e": "The use of privacy law to <mark>curb</mark> the tech giants in this instance feels slightly maladapted.", "z": "在这种情形下，使用隐私法来<mark>约束</mark>科技巨头，感觉略有些不合适。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 552, "w": "currently", "f": 9, "m": "current（当前的）+-ly（表示时间、情况）", "s": [{"d": "1. adv. 目前、现在（9）", "e": "And are they <mark>currently</mark> on public display somewhere?", "z": "那么，它们<mark>目前</mark>正在某个地方公开展出吗？", "r": "2026 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 553, "w": "depend", "f": 9, "m": "de-（向下）+pend（悬挂）", "s": [{"d": "1. v. 依靠（5）", "e": "Battles increasingly <mark>depended</mark> on new military technologies such as radar and the proximity fuze.", "z": "战斗越来越<mark>依赖</mark>雷达和近炸引信等新的军事技术。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "2. v. 取决于（4）", "e": "How we read a given text also <mark>depends</mark> to some extent on our particular interest in reading it.", "z": "我们如何阅读某一特定文本，也在一定程度上<mark>取决于</mark>我们阅读它时的具体兴趣。", "r": "2015 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 554, "w": "desire", "f": 9, "m": "", "s": [{"d": "1. n. 愿望；渴望（8）", "e": "Since <mark>desire</mark> and will are damaged by the presence of thoughts that do not accord with <mark>desire</mark>, Allen concluded: &quot;We do not attract what we want, but what we are.&quot;", "z": "由于与<mark>愿望</mark>不一致的想法会损害<mark>愿望</mark>和意志，艾伦得出结论：“我们吸引来的不是自己想要的东西，而是与自身相应的东西。”", "r": "2011 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "2. v. 渴望（1）", "e": "&quot;Dare to be different, please don&#x27;t smoke!&quot; pleads one billboard campaign aimed at reducing smoking among teenagers-teenagers, who <mark>desire</mark> nothing more than fitting in.", "z": "一项旨在减少青少年吸烟的广告牌宣传活动恳求道：“勇于与众不同，请不要吸烟！”然而，青少年最<mark>渴望</mark>的恰恰是合群。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 555, "w": "direct", "f": 9, "m": "", "s": [{"d": "1. adj. 直接的（4）", "e": "Specific brain regions that respond during <mark>direct</mark> gaze are being explored by other researchers, using advanced methods of brain scanning.", "z": "其他研究人员正在利用先进的脑部扫描方法，探究<mark>直接</mark>凝视时会作出反应的特定脑区。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. adj. 指向、针对（1）", "e": "[ B ] its wrongly-<mark>directed</mark> implementation.", "z": "[B] 其实施<mark>方向错误</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 24 题 · 选项 B · 真题选项"}, {"d": "3. v. 指向、针对（1）", "e": "[ B ] <mark>directed</mark>", "z": "[B] <mark>指向</mark>；<mark>针对</mark>", "r": "2022 · 英语一 · 完形填空 · 第 2 题 · 选项 B · 真题选项"}, {"d": "4. v. 指导、引路（1）", "e": "(49) Although mental health is the cure-all for living our lives, it is perfectly ordinary as you will see that it has been there to <mark>direct</mark> you through all your difficult decisions.", "z": "（49）虽然心理健康是我们生活的万能良方，但它其实十分平常，因为你会发现，在你作出每一个艰难决定时，它一直都在<mark>指引</mark>你。", "r": "2016 · 英语一 · 阅读理解 C · 第 49、50 题"}, {"d": "5. v. 调配、引导（1）", "e": "The trick is to <mark>direct</mark> these funds better.", "z": "诀窍在于更好地<mark>调配</mark>这些资金。", "r": "2013 · 英语一 · 阅读理解 B · 第 45 题"}, {"d": "6. v. 指导， 引导（1）", "e": "[ D ] <mark>direct</mark>", "z": "[D] <mark>指导</mark>；引导。", "r": "2024 · 英语一 · 完形填空 · 第 11 题 · 选项 D · 真题选项"}]}, {"id": 556, "w": "dismissal", "f": 9, "m": "dismiss（解雇、免去职务）+-al（行为、决定）", "s": [{"d": "1. n. 解雇；免职（9）", "e": "Instead, <mark>dismissals</mark> must be justified.", "z": "相反，<mark>解雇</mark>必须有正当理由。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 557, "w": "drama", "f": 9, "m": "dram（行动、表演）+a（名词结尾）", "s": [{"d": "1. n. 戏剧；剧本（9）", "e": "The target group was given a 30-minute <mark>drama</mark>-based activity to accompany the passage.", "z": "实验组获得了一项以<mark>戏剧</mark>为基础、与该段落配合进行的30分钟活动。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 558, "w": "effectively", "f": 9, "m": "effective（有效的、能实际起作用的）+-ly（以这种方式）", "s": [{"d": "1. adv. 有效地；生效地（7）", "e": "Science education today revolves around the idea of scientific literacy - the base-level knowledge about science that nonscientists require to <mark>effectively</mark> get on in the world.", "z": "今天的科学教育围绕着科学素养这一理念展开，即非科学家为了<mark>有效地</mark>在世上生活所需的基础科学知识。", "r": "2026 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "2. adv. 实际上；事实上（2）", "e": "This trend, which we believe is still in its infancy, <mark>effectively</mark> began with retailers and travel providers such as airlines and hotels and will no doubt go further.", "z": "我们认为，这一趋势仍处于萌芽阶段；<mark>实际上</mark>，它始于零售商以及航空公司和酒店等旅游服务提供商，而且毫无疑问还会继续发展。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 559, "w": "emerge", "f": 9, "m": "e-（出）+merg（沉没）+e（拼写结尾）", "s": [{"d": "1. v. 出现、兴起（9）", "e": "Located in the southern Peloponnesian peninsula, Pavlopetri (the modern name of the site) <mark>emerged</mark> as a Neolithic settlement around 3500 B.C. and became an important trading center for Mycenaean Greece (1650-1180 B.C.).", "z": "帕夫洛彼特里（该遗址的现代名称）位于伯罗奔尼撒半岛南部，约于公元前3500年作为一处新石器时代聚落<mark>出现</mark>，后来成为迈锡尼时代希腊（公元前1650-前1180年）的重要贸易中心。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 560, "w": "emotional", "f": 9, "m": "emotion（情绪、感情）+-al（与……有关的、具有……特点的）", "s": [{"d": "1. adj. 情绪的；情感的（9）", "e": "What can promote children&#x27;s <mark>emotional</mark> literacy according to O&#x27;Hanlon?", "z": "根据奥汉隆的说法，什么能够促进儿童的<mark>情绪</mark>素养？", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 24 题"}]}, {"id": 561, "w": "employer", "f": 9, "m": "employ（雇用）+-er（实施动作的人或机构）", "s": [{"d": "1. n. 雇主（9）", "e": "<mark>Employers</mark> must both show cause and act in a procedurally fair way.", "z": "<mark>雇主</mark>既必须说明理由，也必须按照公平的程序行事。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 562, "w": "engage", "f": 9, "m": "", "s": [{"d": "1. v. 参与；使参与（4）", "e": "(47) But by utilising the natural curiosity of the general public it is possible to overcome many of these challenges by <mark>engaging</mark> non-scientists directly in the research process.", "z": "（47）不过，通过利用普通公众天生的好奇心，让非科学家直接<mark>参与</mark>研究过程，就有可能克服其中许多挑战。", "r": "2025 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. v. 与……互动（1）", "e": "Toyota Motor, for example, alleviated some of the damage from its recall crisis earlier this year with a relatively quick and well-orchestrated social-media response campaign, which included efforts to <mark>engage</mark> with consumers directly on sites such as Twitter and the social-news site Digg.", "z": "例如，丰田汽车今年早些时候通过一场反应相对迅速、组织周密的社交媒体应对活动，缓解了召回危机造成的部分损害；其中包括努力在推特和社交新闻网站Digg等平台直接与消费者<mark>互动</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. v. 接触；吸引顾客参与（1）", "e": "Data can be gathered on where the customer can be <mark>engaged</mark>, such as location, devices used, website interactions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and banners at an appropriate frequency.", "z": "可以收集与何处能够<mark>接触到顾客</mark>有关的数据，例如顾客的位置、使用的设备、网站互动和访问的网站，从而以合适的频率，通过电子邮件、社交媒体帖子、弹出式广告和横幅广告等恰当形式展示营销信息。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}, {"d": "4. v. 涉及；探讨（1）", "e": "Precisely because readers from different historical periods, places and social experiences produce different but overlapping readings of the same words on the page-including for texts that <mark>engage</mark> with fundamental human concerns -debates about texts can play an important role in social discussion of beliefs and values.", "z": "正因为来自不同历史时期、地区和社会经历的读者，会对纸面上相同的文字作出不同却又相互重叠的解读--即使是<mark>探讨</mark>人类根本关切的文本也是如此--围绕文本的争论才能在有关信仰与价值观的社会讨论中发挥重要作用。", "r": "2015 · 英语一 · 阅读理解 B · 第 44 题"}, {"d": "5. v. 聘用（1）", "e": "Researchers should improve their standards, he wrote in 2012, but journals should also take a tougher line, &quot;<mark>engaging</mark> reviewers who are statistically literate and editors who can verify the process&quot;.", "z": "他在2012年写道，研究人员应该提高自身标准，但期刊也应该采取更强硬的立场，“<mark>聘用</mark>具备统计学知识的审稿人和能够核实研究过程的编辑”。", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "6. v. 被调动；开始活动（1）", "e": "Different parts of our brain <mark>engage</mark> as we simulate scenes, characters and mental states.", "z": "当我们模拟场景、人物和心理状态时，大脑的不同部分会<mark>被调动</mark>起来。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}]}, {"id": 563, "w": "eventually", "f": 9, "m": "event（结果）+ual（相关的）+ly（副词后缀）", "s": [{"d": "1. adv. 最终；终于（9）", "e": "There will <mark>eventually</mark> come a day when The New York Times ceases to publish stories on newsprint.", "z": "<mark>终有一天</mark>，《纽约时报》会停止在新闻纸上刊印报道。", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 564, "w": "except", "f": 9, "m": "ex-（向外）+cept（拿取）", "s": [{"d": "1. prep. 除...之外（8）", "e": "A deal is a deal-<mark>except</mark>, apparently, when Entergy is involved.", "z": "协议就是协议--但显然，安特吉公司参与其中时却是<mark>例外</mark>。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 把……除外；不包括（1）", "e": "And so, the Middle East <mark>excepted</mark>, Europe is the most monarch-infested region in the world, with 10 kingdoms (not counting Vatican city and Andorra).", "z": "所以，<mark>除中东外</mark>，欧洲是全世界君主最为泛滥的地区，有10个王国，尚未计入梵蒂冈和安道尔。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 565, "w": "explanation", "f": 9, "m": "explan-（explain的词干变体，解释）+-ation（行为或结果）", "s": [{"d": "1. n. 解释；说明（9）", "e": "One <mark>explanation</mark> might be the loss of dignity displayed through a cheesy grin.", "z": "一种<mark>解释</mark>可能是，做作的咧嘴笑显得有失尊严。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 566, "w": "extend", "f": 9, "m": "ex-（向外）+tend（伸展、延伸）", "s": [{"d": "1. v. 扩大；扩展（范围、影响等）（8）", "e": "Will those jurisdictions <mark>extend</mark> the same protections now denied under Sackett v. EPA?", "z": "这些司法管辖区如今会<mark>扩大</mark>保护范围，给予“萨克特诉环保署案”裁决所拒绝给予的同等保护吗？", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 表达；致以（欢迎）（1）", "e": "1)<mark>extend</mark> your welcome and", "z": "1）<mark>表达</mark>你的欢迎，并且", "r": "2012 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 567, "w": "fiction", "f": 9, "m": "fict（编造）+-ion（内容；结果）", "s": [{"d": "1. n. 小说；虚构文学（8）", "e": "She draws on letters, diaries and <mark>fiction</mark>, and a 1939 field notebook of verbatim audience research by Winifred Gill.", "z": "她利用了信件、日记、<mark>小说</mark>，以及威妮弗雷德·吉尔1939年开展观众研究时逐字记录的实地笔记。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 虚构；捏造的内容（1）", "e": "Young people who are digital natives are indeed becoming more skillful at separating fact from <mark>fiction</mark> in cyberspace.", "z": "作为数字原住民的年轻人，的确越来越善于在网络空间中区分事实与<mark>虚构</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 568, "w": "frequently", "f": 9, "m": "frequent（频繁的、经常发生的）+-ly（以这种频率）", "s": [{"d": "1. adv. 经常地（9）", "e": "Second, novelty itself <mark>frequently</mark> provokes disbelief.", "z": "其次，新奇本身<mark>常常</mark>会引起怀疑。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 569, "w": "gender", "f": 9, "m": "gen（种类、类别）+der（名词词形结尾）", "s": [{"d": "1. n. 性别（社会文化意义上的）（9）", "e": "That is exactly what happened when Norway adopted a nationwide corporate <mark>gender</mark> quota.", "z": "挪威在全国范围内实行企业<mark>性别</mark>配额时，发生的正是这种情况。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 570, "w": "ground", "f": 9, "m": "", "s": [{"d": "1. adv. 地面；土地（6）", "e": "The interdependence of the forest and its constituent tree species, <mark>ground</mark> flora, and fauna is taken for granted.", "z": "人们认为，森林与构成森林的树种、<mark>地面</mark>植物及动物之间的相互依存关系是理所当然的。", "r": "2010 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "2. n. 理由；依据（2）", "e": "But there are few places where clients have more <mark>grounds</mark> for complaint than America.", "z": "但很少有地方的客户比美国的客户更有<mark>理由</mark>投诉。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 立场（middleground折中立场）（1）", "e": "Surely there must be some middle <mark>ground</mark> that balances zoos&#x27; treatment of animals with their educational potential.", "z": "肯定存在某种<mark>折中立场</mark>，可以在动物园对待动物的方式与其教育潜力之间取得平衡。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 571, "w": "highly", "f": 9, "m": "high（高、程度高）+-ly（副词后缀）", "s": [{"d": "1. adv. 非常、高度地（9）", "e": "But these provisions create difficulties for businesses when applied to <mark>highly</mark> paid managers and executives.", "z": "然而，这些条款适用于薪酬<mark>很高</mark>的经理和高管时，会给企业带来困难。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 572, "w": "humanities", "f": 9, "m": "humanity（人文学问，y变i）+-es（复数后缀）", "s": [{"d": "1. n. 人文学科（9）", "e": "Sadly, the spirit of inquiry once at home on campus has been replaced by the use of the <mark>humanities</mark> and social sciences as vehicles for publicizing &quot;progressive,&quot; or left-liberal propaganda.", "z": "遗憾的是，曾在校园中扎根的探究精神已被取代，<mark>人文学科</mark>和社会科学成了传播“进步主义”或左翼自由主义宣传的工具。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 573, "w": "impose", "f": 9, "m": "im-（在……上）+pose（放置）", "s": [{"d": "1. v. 强加；施加；实行（7）", "e": "Financial regulators in Britain have <mark>imposed</mark> a rather unusual rule on the bosses of big banks.", "z": "英国金融监管机构向大型银行的掌舵者<mark>施加</mark>了一项颇不寻常的规定。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 征收（税）（2）", "e": "Last Thursday, the French Senate passed a digital services tax, which would <mark>impose</mark> an entirely new tax on large multinationals that provide digital services to consumers or users in France.", "z": "上周四，法国参议院通过了一项数字服务税法案，将对向法国消费者或用户提供数字服务的大型跨国公司<mark>征收</mark>一种全新的税。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 574, "w": "intellectual", "f": 9, "m": "intel-（在……之间）+lect（选择、辨读）+-ual（形容词后缀，也可指人）", "s": [{"d": "1. adj. 智力的；知识的（8）", "e": "Once a discovery claim becomes public, the discoverer receives <mark>intellectual</mark> credit.", "z": "一项发现声明一旦公开，发现者就会获得<mark>学术</mark>功劳上的认可。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 知识产权的（intellectualproperty）（1）", "e": "In a move that has <mark>intellectual</mark>-property lawyers abuzz, the U.S. Court of Appeals for the Federal Circuit said it would use a particular case to conduct a broad review of business-method patents.", "z": "美国联邦巡回上诉法院表示，将以一个特定案件为契机，对商业方法专利展开全面审查，这一举动令<mark>知识产权</mark>律师议论纷纷。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 575, "w": "invite", "f": 9, "m": "", "s": [{"d": "1. v. 邀请（5）", "e": "I was really excited to hear that you&#x27;d <mark>invite</mark> some young craftsmen to demonstrate their innovative craft-making on campus.", "z": "听说你们将<mark>邀请</mark>一些年轻手艺人到校园演示他们创新的手工艺制作，我非常兴奋。", "r": "2025 · 英语一 · 写作 A · 第 51 题"}, {"d": "2. v. 引导；吸引（2）", "e": "You infer information you feel the writer has <mark>invited</mark> you to grasp by presenting you with specific evidence and clues.", "z": "你根据具体证据和线索推断信息，因为你觉得作者提供这些内容，是在<mark>引导</mark>你理解相应信息。", "r": "2015 · 英 并阻碍繁荣和整体福祉的提升。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 598, "w": "prompt", "f": 9, "m": "pro-（向前、向外）+empt（拿取，省去开头e）", "s": [{"d": "1. n. （人工智能输入的）提示词（5）", "e": "His distinctive style is now one of the most commonly used <mark>prompts</mark> in the new open-source AI art generator Stable Diffusion.", "z": "他独特的风格如今已成为新款开源人工智能艺术生成器Stable Diffusion中最常用的<mark>提示词</mark>之一。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 促使；引起（4）", "e": "What <mark>prompted</mark> the chancellor to develop his scheme?", "z": "是什么<mark>促使</mark>财政大臣制定这项方案？", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 23 题"}]}, {"id": 599, "w": "provision", "f": 9, "m": "pro-（在前、预先）+vis（看）+ion（行为或结果）", "s": [{"d": "1. n. 条款；规定（8）", "e": "But these <mark>provisions</mark> create difficulties for businesses when applied to highly paid managers and executives.", "z": "然而，这些<mark>条款</mark>适用于薪酬很高的经理和高管时，会给企业带来困难。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 预先安排；准备（1）", "e": "Have you pondered the life cycle of intangible formats, digital information, given that those who produce these artifacts seldom make <mark>provision</mark> for their long-term preservation?", "z": "考虑到制作这些数字资料的人很少为其长期保存作出<mark>安排</mark>，你是否思考过无形格式，也就是数字信息的生命周期？", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 600, "w": "purchase", "f": 9, "m": "", "s": [{"d": "1. n. 购买行为（5）", "e": "The decisions made it more difficult for states to collect sales tax on certain online <mark>purchases</mark>.", "z": "这些裁决使各州更难对某些<mark>网购行为</mark>征收销售税。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 购买的物品（2）", "e": "Big chains have been collecting sales tax nationwide because they typically have physical stores in whatever state a <mark>purchase</mark> is being shipped to.", "z": "大型连锁企业一直在全美征收销售税，因为无论<mark>购买的物品</mark>运送到哪个州，它们通常都在那里设有实体店。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 购买（2）", "e": "Having said that, I do feel that whatever artifacts find their way to public museums should, in fact, be sanctioned as having been obtained on loan, legally <mark>purchased</mark>, or obtained by treaty.", "z": "话虽如此，我确实认为，无论文物如何进入公共博物馆，都应当被正式确认为通过借展、合法<mark>购买</mark>或条约取得。", "r": "2024 · 英语一 · 阅读理解 B · 第 41-45 题"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
