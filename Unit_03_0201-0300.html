<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 03 (201-300) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

拿破仑的法国军队与愤怒的居民之间；一心想加剧这位皇帝困境的英国人与从巴黎派来、试图<mark>遏制</mark>英国人的元帅们之间；以及科学和任人唯贤的新力量与保守主义和出身门第的旧力量之间。", "r": "2022 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "6. v. 查看（1）", "e": "Most Americans rely on social media to <mark>check</mark> daily headlines.", "z": "大多数美国人依靠社交媒体<mark>查看</mark>每日新闻头条。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 217, "w": "design", "f": 18, "m": "de-（加强）+sign（标记）", "s": [{"d": "1. v. 旨在、为……而设计（11）", "e": "Worse, biodegradable plastics, <mark>designed</mark> to disintegrate, are increasingly common.", "z": "更糟的是，<mark>设计成</mark>能够分解的可生物降解塑料越来越常见。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 设计；构思（4）", "e": "The alliances are most valuable when scientists and artists have a shared stake in a project, are able to jointly <mark>design</mark> it and can critique each other&#x27;s work.", "z": "当科学家和艺术家在一个项目中有共同利益、能够共同<mark>设计</mark>项目并且可以评议彼此的工作时，这种合作关系最有价值。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 设计；图案（3）", "e": "Within companies, the right compensation <mark>design</mark> can provide incentives for executives to think beyond their own time at the company and on behalf of all stakeholders.", "z": "在企业内部，恰当的薪酬<mark>设计</mark>能够激励高管超越自己在公司的任期来考虑问题，并代表所有利益相关方行事。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 218, "w": "encourage", "f": 18, "m": "en-（使具有）+courage（勇气）", "s": [{"d": "1. v. 鼓励（18）", "e": "Much more could be done to <mark>encourage</mark> &quot;long-termism,&quot; such as changes in the tax code and quicker disclosure of stock acquisitions.", "z": "为了<mark>鼓励</mark>“长期主义”，还可以做更多事情，例如修改税法，以及更快地披露股票收购情况。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 219, "w": "global", "f": 18, "m": "glob（球、地球）+-al（与……有关的）", "s": [{"d": "1. adj. 全球的；全世界的（17）", "e": "The <mark>global</mark> impact is about $71 billion annually.", "z": "其<mark>全球</mark>影响每年约为710亿美元。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 全局的、大范围的（1）", "e": "They found that the principal requirement for what is called &quot;<mark>global</mark> cascades&quot; - the widespread propagation of influence through networks - is the presence not of a few influentials but, rather, of a critical mass of easily influenced people.", "z": "他们发现，所谓“<mark>全局</mark>级联”--即影响力通过网络广泛传播--的首要条件，并非存在少数有影响力的人，而是存在达到临界数量的容易受到影响的人。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 220, "w": "influential", "f": 18, "m": "influent（influence的词干变体，影响）+-ial（具有……性质的）", "s": [{"d": "1. n. 有影响力的人（14）", "e": "If people in the network just two degrees removed from the initial <mark>influential</mark> prove resistant, for example, the cascade of change won&#x27;t propagate very far or affect many people.", "z": "例如，如果社交网络中与最初那位<mark>有影响力的人</mark>仅相隔两层关系的人就表现出抵制，那么这种变化的连锁效应便不会传播得很远，也不会影响很多人。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 有影响力的（3）", "e": "The researchers&#x27; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize presence is primarily a function of media, not interpersonal, influence - even the most <mark>influential</mark> members of a population simply don&#x27;t interact with that many others.", "z": "研究人员的论点源于对社会影响力的一项简单观察：除了奥普拉·温弗瑞等少数名人，其超乎常人的存在感主要取决于媒体影响而非人际影响之外，即使是一个群体中最<mark>有影响力</mark>的人，也不会与那么多人互动。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 有影响力的（1）", "e": "[ A ] <mark>influential</mark>.", "z": "[A] <mark>有影响力的</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 22 题 · 选项 A · 真题选项 原表义项待核：本例中为形容词“有影响力的”。"}]}, {"id": 221, "w": "innovation", "f": 18, "m": "in-（引入）+nov（新的）+ation（过程或结果的名词后缀）", "s": [{"d": "1. n. 创新；新方法（18）", "e": "Whatever we do, <mark>innovation</mark> will happen.", "z": "无论我们做什么，<mark>创新</mark>都会发生。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 222, "w": "lawyer", "f": 18, "m": "law（法律）+-yer（本词中形成从业者名称的词尾）", "s": [{"d": "1. n. 律师（18）", "e": "Reforming the system would help both <mark>lawyers</mark> and their customers.", "z": "改革这一制度将有助于<mark>律师</mark>及其客户。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 223, "w": "national", "f": 18, "m": "nation（民族、国家）+-al（……的）", "s": [{"d": "1. adj. 国家的；全国的（16）", "e": "Hill&#x27;s pressure later led to the creation of <mark>national</mark> parks and green belts.", "z": "希尔施加的压力后来促成了<mark>国家</mark>公园和绿色地带的建立。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adj. 民族的（2）", "e": "(47) The United States is the product of two principal forces -the immigration of European peoples with their varied ideas, customs, and <mark>national</mark> characteristics and the impact of a new country which modified these traits.", "z": "（47）美国是两股主要力量共同作用的产物：一股是欧洲各民族的移民，他们带来了各不相同的思想、习俗和<mark>民族</mark>特征；另一股是新国度的影响，这种影响改变了这些特征。", "r": "2015 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 224, "w": "newspaper", "f": 18, "m": "news（新闻）+paper（纸、印刷品）", "s": [{"d": "1. n. 报纸（18）", "e": "Yet a considerable number of the most significant collections of criticism published in the 20th century consisted in large part of <mark>newspaper</mark> reviews.", "z": "然而，20世纪出版的最重要的评论文集中，有相当多在很大程度上由<mark>报纸</mark>评论构成。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 225, "w": "position", "f": 18, "m": "posit-（放置）+-ion（行为或结果）", "s": [{"d": "1. n. 地位（6）", "e": "Complex international, economic, technological and cultural changes could start to diminish the leading <mark>position</mark> of English as the language of the world market, and UK interests which enjoy advantage from the breadth of English usage would consequently face new pressures.", "z": "复杂的国际、经济、技术和文化变化可能开始削弱英语作为世界市场语言的主导<mark>地位</mark>，而凭借英语使用广泛而获益的英国利益相关方也将因此面临新的压力。", "r": "2017 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. n. 职位（6）", "e": "Its current leader, Ed Miliband, owes his <mark>position</mark> to votes from public-sector unions.", "z": "现任领导人埃德·米利班德能够获得这一<mark>职位</mark>，要归功于公共部门工会的选票。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. n. 立场,观点（5）", "e": "Similarly, some Wall Street investment firms armed themselves with patents for financial products, even as they took <mark>positions</mark> in court cases opposing the practice.", "z": "同样，一些华尔街投资公司用金融产品专利来武装自己，即便它们在诉讼中对这一做法采取了反对<mark>立场</mark>。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. n. 位置（1）", "e": "During the 1840s and 1850s, in the early days of photography, exposure times were notoriously long: the daguerreotype photographic method (producing an image on a silvered copper plate) could take several minutes to complete, resulting in blurred images as sitters shifted <mark>position</mark> or adjusted their limbs.", "z": "在19世纪40年代和50年代，也就是摄影术的早期，曝光时间之长是出了名的：银版摄影法（在镀银铜板上成像）可能需要几分钟才能完成，因此被摄者挪动<mark>位置</mark>或调整四肢时，就会造成影像模糊。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 226, "w": "prevent", "f": 18, "m": "pre-（在前、事先）+vent（来、到来）", "s": [{"d": "1. v. 防止；阻止（18）", "e": "But if Congress wanted to <mark>prevent</mark> states from using their own resources to check immigration status, it could.", "z": "不过，如果国会想<mark>阻止</mark>各州使用自己的资源核查移民身份，它是可以这样做的。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 227, "w": "print", "f": 18, "m": "", "s": [{"d": "1. n. 印刷品；纸质出版（14）", "e": "Readers are migrating away from <mark>print</mark> anyway.", "z": "无论如何，读者正在逐渐远离<mark>纸质出版物</mark>。", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 印（钞，喻轻松获利）（2）", "e": "Scientific publishing has long been a licence to <mark>print</mark> money.", "z": "长期以来，科学出版一直是一张可以<mark>印钞</mark>的许可证。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 出版发行（inprint）（1）", "e": "Yet only one of his books is now in <mark>print</mark>, and his vast body of writings on music is unknown save to specialists.", "z": "然而，如今他的书只有一本<mark>仍在出版</mark>；除专家以外，几乎无人知晓他那数量庞大的一批音乐著作。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "4. v. 打印（1）", "e": "He asked Jackson to <mark>print</mark> out large copies and distributed them, along with reproductions of Moran&#x27;s paintings, to each member of Congress.", "z": "他请杰克逊<mark>打印</mark>出大幅复制品，再将这些复制品连同莫兰画作的复制品一起分发给每位国会议员。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}]}, {"id": 228, "w": "reading", "f": 18, "m": "read（读）+-ing（名词后缀；活动）", "s": [{"d": "1. n. 阅读；读书（17）", "e": "How does your <mark>reading</mark> proceed?", "z": "你的<mark>阅读</mark>是如何进行的？", "r": "2015 · 英语一 · 阅读理解 B · 第 41 题"}, {"d": "2. n. 理解；解读（1）", "e": "Precisely because readers from different historical periods, places and social experiences produce different but overlapping <mark>readings</mark> of the same words on the page-including for texts that engage with fundamental human concerns -debates about texts can play an important role in social discussion of beliefs and values.", "z": "正因为来自不同历史时期、地区和社会经历的读者，会对纸面上相同的文字作出不同却又相互重叠的<mark>解读</mark>--即使是探讨人类根本关切的文本也是如此--围绕文本的争论才能在有关信仰与价值观的社会讨论中发挥重要作用。", "r": "2015 · 英语一 · 阅读理解 B · 第 44 题"}]}, {"id": 229, "w": "sign", "f": 18, "m": "", "s": [{"d": "1. n. 迹象；标志（12）", "e": "Sometimes I feel in his late works a will to break all <mark>signs</mark> of continuity.", "z": "有时，我从他晚年的作品中感受到一种意愿：打破一切延续性的<mark>迹象</mark>。", "r": "2014 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. v. 签名；签署（4）", "e": "At the end of 2018, Governor Charlie Baker of Massachusetts <mark>signed</mark> a bill to rein in those potential investor-buyers.", "z": "2018年底，马萨诸塞州州长查理·贝克<mark>签署</mark>了一项法案，以约束那些潜在的投资型买家。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 登记领取失业救济（sign on）（2）", "e": "&quot;Those first few days should be spent looking for work, not looking to <mark>sign</mark> on,&quot; he claimed.", "z": "他声称：“最初几天应该用来找工作，而不是想着<mark>登记领取失业救济</mark>。”", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 230, "w": "species", "f": 18, "m": "spec（看、观察）+ies（名词结尾）", "s": [{"d": "1. n. 物种（18）", "e": "The fossil record shows that many <mark>species</mark> have endured for millions of years - so why shouldn&#x27;t we?", "z": "化石记录显示，许多<mark>物种</mark>已存续了数百万年，那么我们为什么不能呢？", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 231, "w": "affect", "f": 17, "m": "af-（朝向）+fect（做、造成作用）", "s": [{"d": "1. v. 影响（17）", "e": "Such programs do not have to negatively <mark>affect</mark> the environment, though.", "z": "不过，这类项目未必会对环境产生负面<mark>影响</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 232, "w": "bill", "f": 17, "m": "", "s": [{"d": "1. n. 法案（13）", "e": "If the <mark>bills</mark> become law, state boards and commissions will be required to set aside 50 percent of board seats for women by 2022.", "z": "如果这些<mark>法案</mark>成为法律，各州的理事会和委员会将被要求在2022年之前留出百分之五十的理事会席位给女性。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 账单；应付费用（4）", "e": "Worse, the crucial income to feed yourself and your family and pay the <mark>bills</mark> has disappeared.", "z": "更糟的是，赖以养活自己和家人、支付<mark>账单</mark>的关键收入已经消失。", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 233, "w": "collect", "f": 17, "m": "col-（一起）+lect（收集）", "s": [{"d": "1. v. 征收（7）", "e": "The decisions made it more difficult for states to <mark>collect</mark> sales tax on certain online purchases.", "z": "这些裁决使各州更难对某些网购行为<mark>征收</mark>销售税。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 收集（7）", "e": "What does the author say about the Victorian portraits he has <mark>collected</mark>?", "z": "关于他<mark>收集</mark>的维多利亚时代肖像，作者说了什么？", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 32 题"}, {"d": "3. adj. 收取（1）", "e": "[ B ] <mark>collect</mark> payments from third parties.", "z": "[B] 向第三方<mark>收取</mark>款项。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36 题 · 选项 B · 真题选项 原表义项待核：本例中为动词“收取”。"}, {"d": "4. adj. 收集（1）", "e": "Bob Liodice, the chief executive of the Association of National Advertisers, says consumers will be worse off if the industry cannot <mark>collect</mark> information about their preferences.", "z": "美国全国广告商协会首席执行官鲍勃·利奥迪斯表示，如果该行业不能<mark>收集</mark>有关消费者偏好的信息，消费者的处境将会更差。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "5. v. 筹集（1）", "e": "[ D ] <mark>collect</mark> funds for film and TV making.", "z": "［D］为电影和电视制作<mark>筹集</mark>资金。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 选项 D · 真题选项"}]}, {"id": 234, "w": "consequence", "f": 17, "m": "con-（一起、相接）+sequ（跟随）+-ence（结果、状态的名词后缀）", "s": [{"d": "1. n. 结果；后果（14）", "e": "What can be one <mark>consequence</mark> of the current dispute?", "z": "当前的争议可能产生什么<mark>后果</mark>？", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 34 题"}, {"d": "2. n. 应承担的后果；惩罚（2）", "e": "But there should be <mark>consequences</mark>.", "z": "但应当承担相应的<mark>后果</mark>。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 因此（inconsequence）（1）", "e": "[ C ] In <mark>consequence</mark>", "z": "[C] <mark>因此</mark>。", "r": "2010 · 英语一 · 完形填空 · 第 15 题 · 选项 C · 真题选项"}]}, {"id": 235, "w": "draw", "f": 17, "m": "", "s": [{"d": "1. v. 吸引；引来（6）", "e": "Some want to shock, others to <mark>draw</mark> people into science, or to better reward those who have made their careers in research.", "z": "有些人想制造震撼，另一些人想<mark>吸引</mark>人们投身科学，或更好地奖励那些以研究为职业的人。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 利用；借助（draw on）（4）", "e": "She <mark>draws</mark> on letters, diaries and fiction, and a 1939 field notebook of verbatim audience research by Winifred Gill.", "z": "她<mark>利用</mark>了信件、日记、小说，以及威妮弗雷德·吉尔1939年开展观众研究时逐字记录的实地笔记。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. v. 获取；吸取（灵感、教训）（2）", "e": "[ C ] <mark>Drawing</mark> inspiration from nature.", "z": "［C］从大自然中<mark>汲取</mark>灵感。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 24 题 · 选项 C · 真题选项"}, {"d": "4. v. 抽取；选取（draw from）（1）", "e": "Though all the subjects were <mark>drawn</mark> from a population of European extraction, care was taken to __20__ that all subjects, friends and strangers, were taken from the same population.", "z": "虽然所有受试者都<mark>选自</mark>欧洲血统的人群，研究者仍谨慎地____所有受试者，无论朋友还是陌生人，都来自同一人群。", "r": "2015 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "5. adj. 拖长；延长（drawn-out）（1）", "e": "Reform has been vigorously opposed, perhaps most notoriously in education, where charter schools, academies and merit pay all faced <mark>drawn</mark>-out battles.", "z": "改革遭到了强烈反对，教育领域的情况或许尤其恶名昭彰，其中特许学校、学院和绩效工资都经历了<mark>旷日持久</mark>的斗争。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "6. v. 汲取；从……获得（1）", "e": "The Chesapeake <mark>draws</mark> from a 64,000-square-mile watershed that extends into Virginia, Pennsylvania, New York, West Virginia, the District of Columbia and Delaware.", "z": "切萨皮克湾从一个面积达六万四千平方英里的流域<mark>获得水源</mark>，该流域延伸至弗吉尼亚州、宾夕法尼亚州、纽约州、西弗吉尼亚州、哥伦比亚特区和特拉华州。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "7. v. 描绘；画出（1）", "e": "In his Oxford lectures, Seamus Heaney argued that a poem <mark>draws</mark> a picture of reality, a &quot;glimpsed alternative&quot; that sets up a contradiction with your own, in ways little and large.", "z": "谢默斯·希尼在牛津讲座中提出，诗歌<mark>描绘</mark>了一幅现实图景，呈现一种“惊鸿一瞥的另一种现实”，它会以大大小小的方式与你自己的现实形成矛盾。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 A · 真题选项"}, {"d": "8. v. 领取；获得（收入）（1）", "e": "We have no land ethic yet, (47) but we have at least <mark>drawn</mark> nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or absence of economic advantage to us.", "z": "我们尚未形成土地伦理，但我们至少更<mark>接近</mark>承认这样一个观点：鸟类的存续属于其固有权利的问题，而不论它们能否给我们带来经济利益。", "r": "2010 · 英语一 · 阅读理解 C · 第 47 题 原表义项待核：本例中为“更接近”，非“领取收入”。"}]}, {"id": 236, "w": "due", "f": 17, "m": "", "s": [{"d": "1. prep. 由于（12）", "e": "For millennia, we&#x27;ve known what we&#x27;ve known <mark>due</mark> to artifacts that have survived, often despite their original creators&#x27; neglect.", "z": "数千年来，我们之所以拥有现有的知识，<mark>是因为</mark>一些物品留存至今，而它们得以留存，往往并非出于最初创造者的珍惜保管。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 应得的；应有的（3）", "e": "[ B ] attach <mark>due</mark> importance to wetlands protections", "z": "[B] 对湿地保护给予<mark>应有</mark>的重视。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 40 题 · 选项 B · 真题选项"}, {"d": "3. adj. 预定的；预计将发生的（2）", "e": "It said that Internet Explorer 10, the version <mark>due</mark> to appear with Windows 8, would have DNT as a default.", "z": "它表示，<mark>预定</mark>随Windows 8一同推出的Internet Explorer 10版本，将默认启用DNT。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 237, "w": "ensure", "f": 17, "m": "en-（使处于）+sure（确定、安全）", "s": [{"d": "1. v. 确保；保证（某事发生或某种情况存在）（17）", "e": "In order to <mark>ensure</mark> that elite women have more such opportunities, they have proposed imposing government quotas.", "z": "为了<mark>确保</mark>精英女性拥有更多此类机会，他们提议由政府实行配额制。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 238, "w": "labor", "f": 17, "m": "", "s": [{"d": "1. n. 劳动；劳动力（16）", "e": "In previous eras of drastic technological change, entrepreneurs smoothed the transition by dreaming up ways to combine <mark>labor</mark> and machines.", "z": "在以往技术发生剧烈变化的时代，企业家们通过构思将<mark>劳动力</mark>与机器相结合的方法，使过渡更加顺利。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 努力工作（1）", "e": "The second half of the 20th century saw a collection of geniuses, warriors, entrepreneurs and visionaries <mark>labour</mark> to create a fabulous machine that could function as a typewriter and printing press, studio and theatre, paintbrush and gallery, piano and radio, the mail as well as the mail carrier.", "z": "20世纪下半叶，一批天才、勇士、企业家和远见卓识之士<mark>努力</mark>创造出一台令人惊叹的机器，它既能充当打字机和印刷机、工作室和剧院、画笔和画廊、钢琴和收音机，也能充当邮件和邮递员。", "r": "2012 · 英语一 · 阅读理解 B · 第 41 题"}]}, {"id": 239, "w": "network", "f": 17, "m": "net（网）+work（构成的系统）", "s": [{"d": "1. n. 网络、网络系统（9）", "e": "The team identified some 15 buildings, courtyards, a <mark>network</mark> of streets, and two chamber tombs.", "z": "研究小组辨认出了约十五座建筑物、一些庭院、一张街道<mark>网络</mark>以及两座墓室式坟墓。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题"}, {"d": "2. n. 人际关系网络（7）", "e": "An emerging body of research shows that positive health habits-as well as negative ones-spread through <mark>networks</mark> of friends via social communication.", "z": "一批新兴研究表明，积极的健康习惯和消极的习惯一样，都会经由社会交流在朋友关系<mark>网络</mark>中传播。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. n. 广播网（1）", k>一个主要目标。", "r": "2012 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "2. v. 留下；继续存在（4）", "e": "Even after the advent of widespread social media, a pyramid of production <mark>remains</mark>, with a small number of people uploading material, a slightly larger group commenting on or modifying that content, and a huge percentage remaining content to just consume.", "z": "即便在社交媒体广泛普及之后，内容生产的金字塔结构<mark>依然存在</mark>：少数人上传素材，稍多一些的人评论或修改这些内容，而绝大多数人仍满足于仅仅消费内容。", "r": "2012 · 英语一 · 阅读理解 B · 第 44 题"}]}, {"id": 277, "w": "revenue", "f": 16, "m": "re-（回）+ven（来）+ue（本词名词结尾）", "s": [{"d": "1. n. （公司、组织的）收入，收益（16）", "e": "This can mean millions more in <mark>revenue</mark>.", "z": "这可能意味着<mark>收入</mark>再增加数百万。", "r": "2021 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 278, "w": "save", "f": 16, "m": "sav（救助、保住）+e（词形结尾）", "s": [{"d": "1. v. 节省；省去（6）", "e": "<mark>Saving</mark> customers money", "z": "为顾客<mark>省钱</mark>", "r": "2021 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 保存；储存（5）", "e": "Even when a digital object is preserved, it may only be the carrier that&#x27;s <mark>saved</mark>, not the information itself.", "z": "即使数字物件得以留存，<mark>保存</mark>下来的也可能只是载体，而非信息本身。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 拯救；挽救；保护（3）", "e": "If software promises to <mark>save</mark> lives on the scale that drugs now can, big data may be expected to behave as a big pharma has done.", "z": "如果软件有望像如今的药物一样大规模<mark>挽救</mark>生命，那么人们也许会期待大数据公司像大型制药企业那样行事。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "4. prep. 除………之外（2）", "e": "Yet only one of his books is now in print, and his vast body of writings on music is unknown <mark>save</mark> to specialists.", "z": "然而，如今他的书只有一本仍在出版；<mark>除专家以外</mark>，几乎无人知晓他那数量庞大的一批音乐著作。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 279, "w": "short-term", "f": 16, "m": "short（短的）+term（期限、时期）", "s": [{"d": "1. adj. 短期的，暂时的（16）", "e": "Issues arise, however, when developers attempt to create large-scale <mark>short-term</mark> rental facilities-de facto h const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
