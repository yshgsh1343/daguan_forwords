<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 07 (601-700) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

<script>
const UNIT_NO = 7;
const WORDS = [{"id": 601, "w": "realize", "f": 9, "m": "real（真实、现实）+-ize（使成为、使进入相应状态）", "s": [{"d": "1. v. 意识到；明白（6）", "e": "What was more, many original French dispatches had been preserved in this collection, which I <mark>realized</mark> was priceless.", "z": "更重要的是，这批收藏中保存了许多法国急件的原件，我<mark>意识到</mark>它们价值连城。", "r": "2022 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "2. v. 意识到，认识到（3）", "e": "First, most people do not <mark>realise</mark> that there are strong commercial agendas at work to keep them in passive consumption mode.", "z": "首先，大多数人没有<mark>意识到</mark>，强大的商业目的正在发挥作用，使他们一直处于被动消费模式。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 602, "w": "strike", "f": 9, "m": "", "s": [{"d": "1. n. 罢工（5）", "e": "The responsibility for the latest wave of <mark>strikes</mark> rests on the unions.", "z": "最近这一波<mark>罢工</mark>浪潮的责任在于工会。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 使突然想到；给人印象（2）", "e": "As a description of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have <mark>struck</mark> at least some Times readers as faint praise.", "z": "对于一支迄今曾由古斯塔夫·马勒和皮埃尔·布列兹等音乐家执掌的乐团来说，这样描述其下一任音乐总监，似乎至少会让部分《泰晤士报》读者<mark>觉得</mark>这只是轻描淡写的赞美。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 使产生（恐惧）（1）", "e": "Its Campaign to Protect Rural England <mark>struck</mark> terror into many local Conservative parties.", "z": "其“保护英格兰乡村运动”<mark>使</mark>许多地方保守党组织<mark>产生</mark>了恐惧。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. v. 击打；撞击（1）", "e": "Now utopia has grown unfashionable, as we have gained a deeper appreciation of the range of threats facing us, from asteroid <mark>strike</mark> to epidemic flu and to climate change.", "z": "如今，乌托邦逐渐变得不再流行，因为我们对所面临的种种威胁有了更深的认识，从小行星<mark>撞击</mark>到流感疫情，再到气候变化。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 603, "w": "supply", "f": 9, "m": "sup-（补上）+ply（填满）supple（柔软的，去le）+-ly（副词后缀，构成独立同形词）", "s": [{"d": "1. n. 供应、提供（4）", "e": "&quot;We are at a crisis level on the <mark>supply</mark> of rental housing,&quot; said Nick Taylor, executive director of the Workforce Housing Coalition of the Greater Seacoast.", "z": "大海岸地区劳动力住房联盟执行主任尼克·泰勒说：“我们的出租住房<mark>供应</mark>已处于危机水平。”", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 供应物资、储备（2）", "e": "Humans overwhelmingly live in valleys, and on <mark>supplies</mark> of fresh water.", "z": "绝大多数人类居住在谷地，依赖淡水<mark>供应</mark>生存。", "r": "2019 · 英语一 · 完形填空 · 第 1-20 题"}, {"d": "3. v. 供应、提供（2）", "e": "Scientists need journals in which to publish their research, so they will <mark>supply</mark> the articles without monetary reward.", "z": "科学家需要期刊来发表研究，因此他们会无偿<mark>提供</mark>文章。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. v. 满足（1）", "e": "Court, school, organizations of amateurs, and the traveling actors were all rivals in <mark>supplying</mark> a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring honor to England.", "z": "宫廷、学校、业余爱好者组织以及巡回演员，竞相<mark>满足</mark>人们对戏剧娱乐的广泛需求；（47）任何上过文法学校的男孩都不会不知道，戏剧是一种为希腊和罗马带来荣耀、也可能为英国带来荣誉的文学形式。", "r": "2018 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 604, "w": "television", "f": 9, "m": "tele-（远距离）+vis（看）+-ion（相应过程或内容的名词形式）", "s": [{"d": "1. n. 电视（9）", "e": "<mark>Television</mark> is a one-way tap flowing into our homes.", "z": "<mark>电视</mark>就像一个单向水龙头，信息从中流入我们的家中。", "r": "2012 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 605, "w": "title", "f": 9, "m": "tit（标题、题签、头衔）+le（词形结尾）", "s": [{"d": "1. n. 称号、头衔（5）", "e": "It is also wise to recall that such <mark>titles</mark> are not a cure-all.", "z": "记住这类<mark>头衔</mark>并非万能解决办法，也是明智之举。", "r": "2020 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 书籍（1）", "e": "We are not boycotting PRH <mark>titles</mark> but we are doing our utmost to ensure that availability for customers remains good despite the lower overall levels of stock.", "z": "我们并未抵制企鹅兰登书屋的<mark>书籍</mark>，而是在总体库存水平降低的情况下，仍竭尽全力确保顾客能够顺利买到书。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 影视作品（1）", "e": "But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and host the <mark>titles</mark> on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.", "z": "但流媒体时代也让一些意料之外的赢家获益：盗版者利用软件，在几秒钟内就能从合法在线视频平台上盗录一部电影或电视剧，然后把这些<mark>影视作品</mark>存放在自己非法运营的平台上，每年靠广告和订阅大赚约20亿美元。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "4. n. 期刊（1）", "e": "The scientific community measures the quality of those papers in a number of ways, including the perceived quality of the journal (as reflected by the <mark>title&#x27;s</mark> impact factor) and the number of citations a specific paper accumulates.", "z": "科学界通过多种方式衡量这些论文的质量，包括人们对期刊质量的评价（由<mark>该刊</mark>的影响因子反映）以及某篇论文累计获得的引用次数。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "5. v. 给……命名、题为（1）", "e": "A recent paper, <mark>titled</mark> &quot;The Natural Selection of Bad Science&quot;, published on the Royal Society&#x27;s open science website, attempts to answer this intriguing and important question.", "z": "最近发表在皇家学会开放科学网站上的一篇<mark>题为</mark>《劣质科学的自然选择》的论文，试图回答这个有趣而重要的问题。", "r": "2019 · 英语一 · 阅读理解 C · 第 47 题"}]}, {"id": 606, "w": "valuable", "f": 9, "m": "value（价值；去e）+-able（形容词后缀）", "s": [{"d": "1. adj. 有价值的；有用的（8）", "e": "Moreover, some have been found to have a <mark>valuable</mark> function in building up soil fertility.", "z": "此外，人们发现其中一些在提高土壤肥力方面具有<mark>重要</mark>作用。", "r": "2010 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "2. adj. 值钱的；价值高的（1）", "e": "This was an attempt to recover the <mark>valuable</mark> nails, which could be reused after sifting the ashes.", "z": "这样做是为了尝试回收<mark>有价值的</mark>钉子，筛除灰烬后，这些钉子可以再次使用。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 607, "w": "visit", "f": 9, "m": "vis（看）+it（它）", "s": [{"d": "1. n. 访问（网站）（5）", "e": "The zoology program at my university attracts students for whom zoo <mark>visits</mark> were the crucial formative experience that led them to major in biological sciences.", "z": "我所在大学的动物学课程吸引了一批学生；对他们而言，<mark>参观</mark>动物园是成长过程中影响深远的关键经历，促使他们主修生物科学。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题 原表义项待核：本例中为参观动物园，并非访问网站。"}, {"d": "2. v. 访问（网站）（4）", "e": "Data can be gathered on where the customer can be engaged, such as location, devices used, website interactions, and sites <mark>visited</mark>, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and banners at an appropriate frequency.", "z": "为了以适当的频率，通过电子邮件、社交媒体帖子、弹窗广告和横幅等合适的形式展示营销信息，可以收集有关能够接触客户的场景的数据，例如客户的位置、所用设备、网站互动以及<mark>访问过</mark>的网站。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 608, "w": "wage", "f": 9, "m": "", "s": [{"d": "1. n. 工资（9）", "e": "In many rich countries average <mark>wages</mark> in the state sector are higher than in the private one.", "z": "在许多富裕国家，国有部门的平均<mark>工资</mark>高于私营部门。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 609, "w": "well-being", "f": 9, "m": "well（好、良好地）+being（存在、生活状态）", "s": [{"d": "1. 短语 福祉；幸福安康（8）", "e": "Stringent job dismissal regulations adversely affect productivity growth and hamper both prosperity and overall <mark>well-being</mark>.", "z": "严格的解雇规定会对生产率增长产生不利影响，并阻碍繁荣和整体<mark>福祉</mark>的提升。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. 短语 幸福感；良好生活感受（1）", "e": "It does not include important factors such as environmental quality or education outcomes - all things that contribute to a person&#x27;s sense of <mark>well-being</mark>.", "z": "它不包括环境质量或教育成果等重要因素，而这些因素都有助于增强一个人的<mark>幸福感</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 610, "w": "adapt", "f": 8, "m": "ad-（朝向）+apt（合适、适应）", "s": [{"d": "1. v. 适应（7）", "e": "But policies to help workers <mark>adapt</mark> will be indispensable.", "z": "但帮助劳动者<mark>适应</mark>的政策将不可或缺。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 语境不足：适应／改造（干扰项）（1）", "e": "[ A ] <mark>adapting</mark>", "z": "[A] <mark>适应</mark>。", "r": "2022 · 英语一 · 完形填空 · 第 8 题 · 选项 A · 真题选项"}]}, {"id": 611, "w": "advertising", "f": 8, "m": "advertis（advertise去e，做广告）+ing（活动、内容）", "s": [{"d": "1. n. 广告、广告宣传（8）", "e": "For someone moving from finance to <mark>advertising</mark>, maybe they want to look more &quot;SoHo.&quot;", "z": "对于一个从金融业转到<mark>广告</mark>业的人来说，也许他想让自己看上去更有“苏豪区”的风格。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 612, "w": "arise", "f": 8, "m": "", "s": [{"d": "1. v. 出现、产生（8）", "e": "Issues <mark>arise</mark>, however, when developers attempt to create large-scale short-term rental facilities-de facto hotels-to bypass taxes and regulations.", "z": "然而，当开发商试图打造大规模的短期出租场所--实质上的酒店--以规避税收和法规时，问题就<mark>出现</mark>了。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 613, "w": "association", "f": 8, "m": "associat-（associate去e，联合）+-ion（名词后缀）", "s": [{"d": "1. n. 协会；团体（5）", "e": "They include materials sponsored by energy industry <mark>associations</mark>.", "z": "其中包括能源行业<mark>协会</mark>资助的材料。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 关联（1）", "e": "For women, the <mark>association</mark> may be __12__ to changes in immunity that resulted from excess abdominal fat; in men, the immune system did not appear to be __13__ .", "z": "对女性而言，这种<mark>关联</mark>可能____腹部脂肪过多导致的免疫变化；对男性而言，免疫系统似乎并未____。", "r": "2021 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "3. n. 联想；联系（1）", "e": "[ B ] <mark>associations</mark>", "z": "[B] <mark>联想</mark>。", "r": "2014 · 英语一 · 完形填空 · 第 7 题 · 选项 B · 真题选项"}, {"d": "4. n. 语境不足：联系／结交（干扰项）（1）", "e": "[ A ] <mark>association</mark>", "z": "[A] <mark>联系</mark>；结交。", "r": "2016 · 英语一 · 完形填空 · 第 11 题 · 选项 A · 真题选项"}]}, {"id": 614, "w": "behavioral", "f": 8, "m": "behavior（行为）+-al（形容词后缀）", "s": [{"d": "1. adj. 行为的（8）", "e": "Unable to tell whether someone really objects to <mark>behavioural</mark> ads or whether they are sticking with Microsoft&#x27;s default, some may ignore a DNT signal and press on anyway.", "z": "由于无法判断用户是真的反对<mark>行为</mark>定向广告，还是只是沿用微软的默认设置，有些公司可能会无视“请勿追踪”信号，仍然继续行事。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 615, "w": "challenging", "f": 8, "m": "challenge（挑战，去e）+-ing（具有某种作用的）", "s": [{"d": "1. adj. 有挑战性的；困难的（8）", "e": "Enlightening, <mark>challenging</mark>, stimulating, fun.", "z": "富有启发性，<mark>具有挑战性</mark>，让人振奋，而且有趣。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 616, "w": "civilization", "f": 8, "m": "civilize（使文明，去e）+-ation（行为、状态）", "s": [{"d": "1. n. 文明（8）", "e": "Yet science has a cultural history, too, with roots going back to the dawn of <mark>civilization</mark>.", "z": "然而，科学也有文化历史，其根源可以追溯到<mark>文明</mark>的开端。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 617, "w": "concept", "f": 8, "m": "con-（一起）+cept（抓住、拿取）", "s": [{"d": "1. n. 概念；观念（8）", "e": "Many argue that it is a flawed <mark>concept</mark>.", "z": "许多人认为，这是一个有缺陷的<mark>概念</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 618, "w": "consumption", "f": 8, "m": "consumpt（消耗；consume的词干变体）+-ion（名词后缀）", "s": [{"d": "1. n. 消费；消耗（4）", "e": "Laughter does __2__ short-term changes in the function of the heart and its blood vessels, __3__ heart rate and oxygen <mark>consumption</mark>.", "z": "笑确实会__2__心脏及其血管功能的短期变化，__3__心率和氧气<mark>消耗量</mark>。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. n. 消费、欣赏（文化内容）（2）", "e": "First, most people do not realise that there are strong commercial agendas at work to keep them in passive <mark>consumption</mark> mode.", "z": "首先，大多数人没有意识到，强大的商业目的正在发挥作用，使他们一直处于被动<mark>消费</mark>模式。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}, {"d": "3. n. 食物消费；食用（2）", "e": "[ A ] The first and most important is the consumer&#x27;s growing preference for eating out: the <mark>consumption</mark> of food and drink in places other than homes has risen from about 32 percent of total <mark>consumption</mark> in 1995 to 35 percent in 2000 and is expected to approach 38 percent by 2005.", "z": "[A] 首先也是最重要的一点，是消费者越来越偏好外出就餐：在家以外场所进行的餐饮<mark>消费</mark>占总<mark>消费</mark>的比例，已从1995年的约32%升至2000年的35%，预计到2005年将接近38%。", "r": "2010 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 A · 真题选项"}]}, {"id": 619, "w": "context", "f": 8, "m": "con-（共同、一起）+text（编织、文本）", "s": [{"d": "1. n. 背景、具体情境（6）", "e": "Enlist the support of professionals and share with them your goals and <mark>context</mark>.", "z": "争取专业人士的支持，并与他们分享你的目标和<mark>具体背景</mark>。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. n. （词、句、段落的）上下文、语境（2）", "e": "(41)______ You begin to infer a <mark>context</mark> for the text, for instance by making decisions about what kind of speech event is involved: Who is making the utterance, to whom, when and where.", "z": "（41）____ 你开始推断文本的<mark>语境</mark>，例如判断所涉及的言语事件属于何种类型：谁在说话，对谁说，何时说，以及在哪里说。", "r": "2015 · 英语一 · 阅读理解 B · 第 41 题 · 真题题干"}]}, {"id": 620, "w": "controversial", "f": 8, "m": "controversy（争论，去掉末尾y）+-ial（与……有关的）", "s": [{"d": "1. adj. 有争议的（8）", "e": "Now the nation&#x27;s top patent court appears completely ready to scale back on business-method patents, which have been <mark>controversial</mark> ever since they were first authorized 10 years ago.", "z": "如今，美国最高专利法院似乎已完全准备好缩减商业方法专利的范围；此类专利自十年前首次获得授权以来，就一直<mark>存在争议</mark>。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 621, "w": "creative", "f": 8, "m": "create（去e，创造）+-ive（具有相应能力或性质的）", "s": [{"d": "1. adj. 有创造力的；创新的（8）", "e": "AI can be a collaborative tool in a wide range of <mark>creative</mark> endeavors.", "z": "人工智能可以成为广泛范围内各种<mark>创造性</mark>活动的协作工具。", "r": "2026 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 622, "w": "credit", "f": 8, "m": "cred（相信）+-it（词形结尾）", "s": [{"d": "1. n. 税收抵免（3）", "e": "Taxes on low-wage labor need to be cut, and wage subsidies such as the earned income tax <mark>credit</mark> should be expanded: This would boost incomes, encourage work, reward companies for job creation, and reduce inequality.", "z": "应当降低对低工资劳动所得征收的税款，并扩大劳动所得<mark>税收抵免</mark>等工资补贴：这会提高收入、鼓励工作、奖励创造就业的企业，并减少不平等。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 赊账信用、信贷额度（3）", "e": "The problem began late last year, when PRH confirmed that it had introduced a <mark>credit</mark> limit with Waterstones &quot;at a very significant level&quot;.", "z": "问题始于去年年底，当时企鹅兰登书屋确认，已对水石书店推出了“额度非常可观”的<mark>赊账信用</mark>上限。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 功劳（2）", "e": "Once a discovery claim becomes public, the discoverer receives intellectual <mark>credit</mark>.", "z": "一项发现声明一旦公开，发现者就会获得学术<mark>功劳</mark>上的认可。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 623, "w": "crucial", "f": 8, "m": "cruc（十字、关键、决定性）+ial（具有这种性质的）", "s": [{"d": "1. adj. 至关重要的；关键性的（8）", "e": "But that doesn&#x27;t mean <mark>crucial</mark> ethical issues involving AI aren&#x27;t at hand.", "z": "但这并不意味着，涉及人工智能的<mark>关键</mark>伦理问题尚未摆在我们眼前。", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 624, "w": "debate", "f": 8, "m": "de-（充分、彻底）+bat（击打）+e（拼写结尾）", "s": [{"d": "1. n. 辩论（8）", "e": "Exactly when that day will be is a matter of <mark>debate</mark>.", "z": "那一天究竟何时到来，仍是一个存在<mark>争议</mark>的问题。", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 625, "w": "demonstrate", "f": 8, "m": "de-（完全）+monstr（指给别人看）+-ate（动词后缀）", "s": [{"d": "1. v. 表明；证明/展示（7）", "e": "But <mark>demonstrating</mark> the efficacy of science will be crucial if we are to solve humanity&#x27;s greatest challenges.", "z": "但是，要解决人类面临的最大挑战，<mark>证明</mark>科学的效用将至关重要。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 演示；示范（1）", "e": "I was really excited to hear that you&#x27;d invite some young craftsmen to <mark>demonstrate</mark> their innovative craft-making on campus.", "z": "听说你们将邀请一些年轻手艺人到校园<mark>演示</mark>他们创新的手工艺制作，我非常兴奋。", "r": "2025 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 626, "w": "detail", "f": 8, "m": "de-（充分、彻底）+tail（切割）", "s": [{"d": "1. n. 细节；详情（7）", "e": "The <mark>details</mark> may be unknowable, but the independence of standard-setters, essential to the proper functioning of capital markets, is being compromised.", "z": "<mark>细节</mark>也许无从得知，但标准制定者的独立性正在受到损害，而这种独立性对资本市场的正常运作至关重要。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 详细介绍（1）", "e": "Visit any antiques store and you&#x27;ll encounter artifacts from the past: photographs, letters, a brochure <mark>detailing</mark> the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history.", "z": "走进任何一家古董店，你都会遇见来自过去的物件：照片、书信、<mark>详细介绍</mark>1964至1965年世界博览会辛克莱恐龙展的一本宣传手册，以及历史中那些原本短暂留存的纸质杂物。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 627, "w": "dispute", "f": 8, "m": "dis-（分开、分别）+pute（计算、评议）", "s": [{"d": "1. n. 争议；质疑（6）", "e": "What can be one consequence of the current <mark>dispute</mark>?", "z": "当前的<mark>争议</mark>可能产生什么后果？", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 34 题"}, {"d": "2. v. 争议；质疑（2）", "e": "Most scientists and experts sharply <mark>dispute</mark> Hardy&#x27;s views.", "z": "大多数科学家和专家都激烈地<mark>质疑</mark>哈代的观点。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 628, "w": "effective", "f": 8, "m": "effect（结果、作用）+-ive（具有相应性质的）", "s": [{"d": "1. adj. 有效的，起作用的（8）", "e": "More <mark>effective</mark> marketing", "z": "更<mark>有效</mark>的市场营销。", "r": "2021 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 629, "w": "emission", "f": 8, "m": "e-（向外）+miss-（送出）+ion（过程、结果）", "s": [{"d": "1. n. （气体）排放；排放量（8）", "e": "Thanks to his invention, we have a real chance to decrease the world&#x27;s carbon <mark>emissions</mark>.", "z": "得益于他的发明，我们真正有机会减少全球碳<mark>排放</mark>。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 630, "w": "examine", "f": 8, "m": "examin（检验；衡量）+-e（词形结尾）", "s": [{"d": "1. v. 检查（8）", "e": "The researchers <mark>examined</mark> 207 genomes from modern donkeys living in 31 countries across the globe.", "z": "研究人员<mark>检查</mark>了来自全球31个国家的现代驴的207份基因组。", "r": "2026 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 631, "w": "expose", "f": 8, "m": "ex-（向外）+pos（放置）+e（词形结尾）", "s": [{"d": "1. v. 使接触；使暴露于（3）", "e": "The randomised control trial involved hundreds of year 5 pupils aged nine and ten-at 45 state primary schools that had not been &quot;previously <mark>exposed</mark> to RSC pedagogy&quot;.", "z": "这项随机对照试验涉及45所公立小学的数百名九至十岁五年级学生，这些学校“此前未<mark>接触</mark>过皇家莎士比亚剧团的教学法”。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 使面临（危险、风险）（2）", "e": "[ D ] <mark>exposed</mark>", "z": "[D] <mark>使面临危险</mark>。", "r": "2016 · 英语一 · 完形填空 · 第 15 题 · 选项 D · 真题选项"}, {"d": "3. v. 揭示；显露（1）", "e": "[ D ] <mark>expose</mark>", "z": "[D] <mark>揭示</mark>", "r": "2019 · 英语一 · 完形填空 · 第 20 题 · 选项 D · 真题选项"}, {"d": "4. v. 露出（1）", "e": "A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#x27;s gum-<mark>exposing</mark> Cheshire Cat, but it was not a becoming look for properly bred persons.", "z": "露齿咧嘴笑（尤其是牙齿有缺口或发黑时）显得缺乏格调：醉汉、流浪汉和音乐厅演员可以挤眉弄眼、咧嘴大笑，像刘易斯·卡罗尔笔下<mark>露出</mark>牙龈的柴郡猫那样笑得嘴角大开，但对有良好教养的人来说，这种表情并不得体。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "5. v. 曝光（胶片）（1）", "e": "[ D ] Throughout the trip, Jackson juggled multiple cameras and plate sizes using the collodion process that involved coating the plates with a chemical mixture, <mark>exposing</mark> them and developing the resulting images with a portable darkroom.", "z": "［D］在整个旅途中，杰克逊使用火棉胶工艺，兼顾多台相机和不同尺寸的感光板；这种工艺要先在感光板上涂覆化学混合物，再使其<mark>曝光</mark>，最后借助便携暗室将影像显影。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 632, "w": "forgiveness", "f": 8, "m": "forgive（原谅）+-ness（状态、行为的名词后缀）", "s": [{"d": "1. n. （gradeforgiveness）重修成绩替换；原成绩豁免（8）", "e": "What was the original purpose of grade <mark>forgiveness</mark>?", "z": "<mark>重修成绩替换</mark>制度最初的目的是什么？", "r": "2019 · 英语一 · 阅读理解 A Text 2 · 第 27 题"}]}, {"id": 633, "w": "game", "f": 8, "m": "", "s": [{"d": "1. n. 游戏；比赛（6）", "e": "(48) Scientists have employed a variety of ways to engage the general public in their research, such as making data analysis into an online <mark>game</mark> or sample collection into a smartphone application.", "z": "（48）科学家采用了各种方式让普通公众参与研究，比如将数据分析变成在线<mark>游戏</mark>，或将样本采集变成智能手机应用程序。", "r": "2025 · 英语一 · 阅读理解 C · 第 48 题"}, {"d": "2. n. 活动；行业或事业（比喻）（1）", "e": "Ever since taking on Netflix Inc. at its own <mark>game</mark>, old Hollywood has struggled to turn a profit in streaming, with the likes of Disney+, Peacock and Paramount+ losing billions of dollars each year, sparking concerns that the services will never be as profitable as cable once was.", "z": "自从进入奈飞擅长的<mark>业务领域</mark>与其竞争以来，传统好莱坞一直难以在流媒体业务上盈利，Disney+、Peacock和Paramount+等平台每年亏损数十亿美元，引发人们担忧：这些服务可能永远无法像有线电视曾经那样赚钱。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. n. 猎物；猎禽猎兽（1）", "e": "(48) Time was when biologists somewhat overworked the evidence that these creatures preserve the health of <mark>game</mark> by killing the physically weak, or that they prey only on &quot;worthless&quot; species.", "z": "（48）曾有一段时期，生物学家有些过度利用这样的证据：这些生物通过捕杀身体虚弱的个体来维持<mark>猎物</mark>种群的健康，或者它们只捕食“毫无价值”的物种。", "r": "2010 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 634, "w": "grant", "f": 8, "m": "", "s": [{"d": "1. v. 授予；批准；给予（4）", "e": "Over the past decade, thousands of patents have been <mark>granted</mark> for what are called business methods.", "z": "在过去十年里，数以千计的专利被<mark>授予</mark>了所谓的商业方法。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 补助金；拨款（2）", "e": "[ A ] <mark>grants</mark>", "z": "[A] <mark>补助金</mark>", "r": "2013 · 英语一 · 完形填空 · 第 1 题 · 选项 A · 真题选项"}, {"d": "3. v. 认为理所当然（take for granted）（2）", "e": "The interdependence of the forest and its constituent tree species, ground flora, and fauna is taken for <mark>granted</mark>.", "z": "人们认为，森林与构成森林的树种、地面植物及动物之间的相互依存关系是<mark>理所当然</mark>的。", "r": "2010 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 635, "w": "guarantee", "f": 8, "m": "guarant（保证、担保）+-ee（名词词形结尾）", "s": [{"d": "1. n. 保证；保障（6）", "e": "If it is trying to upset Google, which relies almost wholly on advertising, it has chosen an indirect method: there is no <mark>guarantee</mark> that DNT by default will become the norm.", "z": "如果它是想让几乎完全依赖广告的谷歌感到不快，那么它选择了一种间接方式：没有任何<mark>保证</mark>表明，默认开启“请勿追踪”会成为惯例。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 保证；保障（2）", "e": "A flashing set of healthy and clean, regular &#x27;pearly whites&#x27; was a rare sight in Victorian society, the preserve of the super-rich (and even then, dental hygiene was not <mark>guaranteed</mark>).", "z": "在维多利亚时代的社会，一口闪亮、健康、洁净又整齐的“珍珠白牙”实属罕见，是超级富豪的专属之物（即便如此，牙齿卫生也未必有<mark>保障</mark>）。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 636, "w": "handle", "f": 8, "m": "", "s": [{"d": "1. v. 处理；应对（5）", "e": "[ C ] are hard to <mark>handle</mark> at present", "z": "[C] 目前难以<mark>处理</mark>", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 选项 C · 真题选项"}, {"d": "2. n. 柄；把手（3）", "e": "A woman says there have been fewer street fights since the arrival of the wireless but also less stopping and &quot;talking on the brush <mark>handle</mark>&quot;.", "z": "一名妇女说，自从有了收音机，街头打斗减少了，但人们停下脚步、“扶着扫帚<mark>柄</mark>聊天”的情况也少了。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 637, "w": "heart", "f": 8, "m": "", "s": [{"d": "1. n. 核心（4）", "e": "In other words, the choice to share news on social media may be the <mark>heart</mark> of the issue.", "z": "换句话说，选择在社交媒体上分享新闻，可能才是问题的<mark>核心</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 心, 心脏（3）", "e": "The variety of plastic objects at risk is dizzying: early radios, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial <mark>heart</mark>.", "z": "面临风险的塑料物品种类多得令人眼花缭乱：早期的收音机、先锋派雕塑、迪士尼电影的赛璐珞动画单帧画，以及第一颗人工<mark>心脏</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. n. 内心；心声（1）", "e": "Losing a job is hurting: you don&#x27;t skip down to the jobcentre with a song in your <mark>heart</mark>, delighted at the prospect of doubling your income from the generous state.", "z": "失业令人痛苦：你不会因为想到慷慨的国家将让自己的收入翻倍，就兴高采烈、<mark>心里</mark>唱着歌，一路蹦跳地去就业中心。", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 638, "w": "host", "f": 8, "m": "", "s": [{"d": "1. n. 许多、大量（ahost of）（3）", "e": "Newton&#x27;s laws of motion and Darwinian evolution each bind a <mark>host</mark> of different phenomena into a single explicatory framework.", "z": "牛顿运动定律和达尔文的进化论各自把<mark>许多</mark>不同的现象联结成一个单一的解释框架。", "r": "2012 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "2. v. 主持、举办（3）", "e": "You are going to <mark>host</mark> a club reading session.", "z": "你将<mark>主持</mark>俱乐部的一场读书活动。", "r": "2015 · 英语一 · 写作 A · 第 51 题"}, {"d": "3. n. 房东、出租者（1）", "e": "The bill requires every rental <mark>host</mark> to register with the state, mandates they carry insurance, and opens the potential for local taxes on top of a new state levy.", "z": "该法案要求每位出租<mark>房东</mark>在州政府登记，强制要求他们购买保险，并允许在新设州税之外再征收地方税。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "4. v. 托管、存放（网站内容）（1）", "e": "But the age of streaming has been a boon for some unintended winners: pirates that use software to rip a film or television show in seconds from legitimate online video platforms and <mark>host</mark> the titles on their own, illegitimate services, which rake in about $2 billion annually from ads and subscriptions.", "z": "但流媒体时代也让一些意料之外的赢家获益：盗版者利用软件，在几秒钟内就能从合法在线视频平台上盗录一部电影或电视剧，然后把这些影视作品<mark>存放</mark>在自己非法运营的平台上，每年靠广告和订阅大赚约20亿美元。", "r": "2025 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 639, "w": "ideal", "f": 8, "m": "idea（想法、观念）+-al（相关性质或事物的结尾）", "s": [{"d": "1. n. 理想；典范（7）", "e": "Relying on ethical persuasion rather than law to address the misuse of body <mark>ideals</mark> may be the best step.", "z": "依靠道德劝说而非法律来处理滥用<mark>理想</mark>身体形象的问题，可能是最佳举措。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 理想的；最合适的（1）", "e": "Mauna Kea is deemed as an <mark>ideal</mark> astronomical site due to____", "z": "莫纳克亚山被视为<mark>理想</mark>的天文观测地点，是因为____。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 真题题干"}]}, {"id": 640, "w": "imagine", "f": 8, "m": "imag（形象）+-ine（动词结尾）", "s": [{"d": "1. v. 想象；设想（7）", "e": "She added: &quot;The emotional understanding was very evident and it is probably related to the [rehearsal room process] where you are used to trying to <mark>imagine</mark> your way through.", "z": "她补充道：“这种情感理解十分明显，可能与排练室中的过程有关，在那里你习惯于尝试通过<mark>想象</mark>来理解情境。”", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 认为；推测（1）", "e": "In the 2006 film version of The Devil Wears Prada, Miranda Priestly, played by Meryl Streep, scolds her unattractive assistant for <mark>imagining</mark> that high fashion doesn&#x27;t affect her.", "z": "在2006年的电影版《穿普拉达的女王》中，梅丽尔·斯特里普饰演的米兰达·普里斯特利斥责她那位其貌不扬的助理，因为助理竟然<mark>以为</mark>高级时尚不会影响自己。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 641, "w": "incentive", "f": 8, "m": "", "s": [{"d": "1. n. 激励；诱因（8）", "e": "On this, students&#x27; and colleges&#x27; <mark>incentives</mark> seem to be aligned.", "z": "在这一点上，学生与大学的<mark>利益驱动</mark>似乎是一致的。", "r": "2019 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 642, "w": "indicate", "f": 8, "m": "in-（朝向）+dic（说、说明）+-ate（构成动词）", "s": [{"d": "1. v. 表明；指出；显示（8）", "e": "The ways of reading <mark>indicated</mark> here are without doubt kinds of comprehension.", "z": "这里<mark>指出</mark>的阅读方式，无疑都是理解的形式。", "r": "2015 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 643, "w": "insist", "f": 8, "m": "in-（向内、加强）+sist（站立、维持）", "s": [{"d": "1. v. 坚持要求（4）", "e": "And that&#x27;s the problem with a social cure engineered from the outside: in the real world, as in school, we <mark>insist</mark> on choosing our own friends.", "z": "这正是从外部设计社会疗法的问题所在：在现实世界中，就像在学校里一样，我们<mark>坚持</mark>自己选择朋友。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 坚持认为（4）", "e": "King Juan Carlos of Spain once <mark>insisted</mark> &quot;kings don&#x27;t abdicate, they die in their sleep.&quot;", "z": "西班牙国王胡安·卡洛斯曾<mark>坚持认为</mark>：“国王不会退位，他们会在睡梦中辞世。”", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 644, "w": "interaction", "f": 8, "m": "inter-（相互、在……之间）+action（行动、作用）", "s": [{"d": "1. n. 互动；交流（5）", "e": "(48) Algorithms used to simulate human <mark>interactions</mark> are creating many of these concerns, especially as no-one is quite sure what the outcomes of using AI to interact with customers will be.", "z": "（48）用于模拟人类<mark>互动</mark>的算法正在引发其中许多担忧，尤其是因为没有人十分确定，使用人工智能与顾客互动究竟会带来什么结果。", "r": "2023 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "2. n. 相互作用；相互影响（3）", "e": "The miracle of the Chesapeake Bay lies not in its depths, but in the complexity of its natural construction, the <mark>interaction</mark> of fresh and saline waters, and the mix of land and water.", "z": "切萨皮克湾的奇迹不在于它有多深，而在于其自然结构的复杂性、淡水与咸水的<mark>相互作用</mark>，以及陆地与水域的交融。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 645, "w": "investigation", "f": 8, "m": "investigate（调查，去e）+-ion（行为；过程）", "s": [{"d": "1. n. 调查；研究（6）", "e": "Yet the FCC also ended the <mark>investigations</mark> of broadband providers that imposed data caps on their rivals&#x27; streaming services but not their own.", "z": "然而，联邦通信委员会也结束了对宽带服务商的<mark>调查</mark>，这些服务商对竞争对手的流媒体服务设定数据流量上限，却不限制自己的服务。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 研究；探究（2）", "e": "Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas - such as free markets and self-reliance - as falling outside the boundaries of routine, and sometimes legitimate, intellectual <mark>investigation</mark>.", "z": "如今，教授们通常将进步主义的历史解释和公共政策视为适当的研究对象，却把自由市场、自力更生等保守主义或古典自由主义思想描绘为超出常规<mark>知识探究</mark>范围、有时甚至不具正当性的东西。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 646, "w": "key", "f": 8, "m": "", "s": [{"d": "1. adj. 关键；关键的（7）", "e": "Parenting tips obtained from hunter-gatherers in Africa may be the <mark>key</mark> to bringing up more content ark> were to be punished by imprisonment or even death.", "z": "在科学思想与宗教思想关系高度紧张的时期，提出这样的理论会被扣上异端的帽子，而任何继续传播这些<mark>谎言</mark>的异端者都将受到监禁甚至死刑的惩罚。", "r": "2020 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "4. v. 说谎（1）", "e": "As a librarian whose day job revolves around special collections and digital assets, I share the night terrors of historians, and I&#x27;d be <mark>lying</mark> if I said a comprehensive preservation solution currently exists.", "z": "作为一名日常工作围绕特藏和数字资产展开的图书馆员，我与历史学家一样常被噩梦惊醒；若说目前已有全面的保存方案，那我就是在<mark>说谎</mark>。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 650, "w": "limited", "f": 8, "m": "limit（界限、限制）+-ed（处于相应状态的）", "s": [{"d": "1. adj. 有限的；受限的（8）", "e": "Evidence that the loveLife program produces lasting changes is <mark>limited</mark> and mixed.", "z": "证明loveLife项目能带来持久变化的证据<mark>有限</mark>，而且结论不一。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 651, "w": "map", "f": 8, "m": "", "s": [{"d": "1. v. 绘制地图（4）", "e": "A year later, he returned with a few students to __11__ the location and <mark>map</mark> the site.", "z": "一年后，他带着几名学生回来____这个地点，并<mark>绘制遗址地图</mark>。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. n. 地图；图（4）", "e": "Their well-developed hippocampal structures may enable elephants, like rats and people, to construct cognitive <mark>maps</mark>.", "z": "发育完善的海马体结构或许能使大象像老鼠和人一样，构建认知<mark>地图</mark>。", "r": "2024 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 652, "w": "mark", "f": 8, "m": "", "s": [{"d": "1. v. 标志着；恰逢（3）", "e": "Last year <mark>marked</mark> the third year in a row that Indonesia&#x27;s bleak rate of deforestation has slowed in pace.", "z": "去年<mark>标志着</mark>印度尼西亚令人沮丧的森林砍伐速率连续第三年放缓了步伐。", "r": "2021 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 痕迹（1）", "e": "[ B ] <mark>marks</mark>", "z": "[B] <mark>痕迹</mark>。", "r": "2019 · 英语一 · 完形填空 · 第 19 题 · 选项 B · 真题选项"}, {"d": "3. v. 标定（资产价值）（1）", "e": "America&#x27;s new plan to buy up toxic assets will not work unless banks <mark>mark</mark> assets to levels w ollect information about their preferences.", "z": "美国全国广告商协会首席执行官鲍勃·利奥迪斯表示，如果该行业不能收集有关消费者偏好的信息，消费者的<mark>处境将会更差</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 698, "w": "battle", "f": 7, "m": "batt（击打）+le（本词词形结尾）", "s": [{"d": "1. n. 斗争、争斗（6）", "e": "The endless legal <mark>battles</mark> and back-and-forth at the FCC cry out for Congress to act.", "z": "联邦通信委员会没完没了的法律<mark>争斗</mark>和反复拉锯，迫切需要国会采取行动。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 战斗、战役（1）", "e": "<mark>Battles</mark> increasingly depended on new military technologies such as radar and the proximity fuze.", "z": "<mark>战斗</mark>越来越依赖雷达和近炸引信等新的军事技术。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 699, "w": "bias", "f": 7, "m": "", "s": [{"d": "1. n. 偏见、偏差（7）", "e": "Companies are using artificial intelligence to remove some of the unconscious <mark>bias</mark> from hiring decisions.", "z": "企业正利用人工智能消除招聘决策中的部分无意识<mark>偏见</mark>。", "r": "2021 · 英语一 · 阅读理解 B · 第 41 题"}]}, {"id": 700, "w": "bit", "f": 7, "m": "", "s": [{"d": "1. n. 一点；少量；一小块（5）", "e": "Could you please tell me a <mark>bit</mark> more about them?", "z": "能否请你再多告诉我<mark>一点</mark>关于它们的情况？", "r": "2026 · 英语一 · 写作 A · 第 51 题"}, {"d": "2. n. 完全同样地（every bit as）（1）", "e": "I became convinced that this story was every <mark>bit</mark> as exciting and significant as that of Enigma and the breaking of German codes in the Second World War.", "z": "我开始确信，这个故事与二战期间“恩尼格玛”密码机及破解德国密码的故事<mark>一样</mark>激动人心，也<mark>同样</mark>意义重大。", "r": "2022 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "3. n. 比特；数据位（1）", "e": "But this distinction misses the point that it is processing and aggregation, not the mere possession of <mark>bits</mark>, that gives the data value.", "z": "但这种区分忽略了关键之处：赋予数据价值的是处理与汇总，而不是仅仅占有一些<mark>数据位</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
