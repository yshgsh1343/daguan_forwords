<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 18 (1701-1800) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

const UNIT_NO = 18;
const WORDS = [{"id": 1701, "w": "resistant", "f": 3, "m": "resist（抵抗）+-ant（具有这种性质的）", "s": [{"d": "1. adj. 抵制的；有抵抗力的（3）", "e": "If people in the network just two degrees removed from the initial influential prove <mark>resistant</mark>, for example, the cascade of change won&#x27;t propagate very far or affect many people.", "z": "例如，如果社交网络中与最初那位有影响力的人仅相隔两层关系的人就表现出<mark>抵制</mark>，那么这种变化的连锁效应便不会传播得很远，也不会影响很多人。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1702, "w": "responsible", "f": 3, "m": "respons（respond的词干形式，回应、作答）+-ible（应能承担的）", "s": [{"d": "1. adj. 导致…的；造成…的（1）", "e": "[ C ] may be <mark>responsible</mark> for fiercer competition.", "z": "［C］可能<mark>导致</mark>更加激烈的竞争。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 33 题 · 选项 C · 真题选项"}, {"d": "2. adj. 负责任的；可靠的（1）", "e": "[ E ] You make further inferences, for instance, about how the text may be significant to you, or about its validity - inferences that form the basis of a personal response for which the author will inevitably be far less <mark>responsible</mark>.", "z": "[E] 你还会进一步推断，比如文本对你可能有什么意义，或者它是否有效；这些推断构成了个人反应的基础，而作者对这种反应<mark>所负的责任</mark>必然会小得多。", "r": "2015 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}, {"d": "3. adj. 负责的；负有责任的（1）", "e": "Customers were generally <mark>responsible</mark> for paying the sales tax to the state themselves if they weren&#x27;t charged it, but most didn&#x27;t realize they owed it and few paid.", "z": "如果商家未收取销售税，顾客通常<mark>有责任</mark>自行向州政府缴纳，但多数人不知道自己应缴这笔税，实际缴纳的人很少。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1703, "w": "restrict", "f": 3, "m": "re-（再）+strict（拉紧、约束）", "s": [{"d": "1. v. 限制；约束（3）", "e": "The state Legislature recently voted against a bill that would&#x27;ve made it illegal for towns to create legislation <mark>restricting</mark> short-term rentals.", "z": "州议会最近投票否决了一项法案，该法案原本会使城镇制定<mark>限制</mark>短期租赁的法规成为违法行为。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1704, "w": "resume", "f": 3, "m": "re-（重新）+sum（拿取）+e（词形结尾；名词简历另借自法语résumé）", "s": [{"d": "1. v. 恢复；重新开始（2）", "e": "[ C ] <mark>resumed</mark>", "z": "[C] <mark>恢复</mark>了", "r": "2025 · 英语一 · 完形填空 · 第 14 题 · 选项 C · 真题选项"}, {"d": "2. n. 简历（1）", "e": "[ G ] AI looks at <mark>resumes</mark> in greater numbers than humans would be able to, and selects the more promising candidates.", "z": "[G] 人工智能能够查看比人类多得多的<mark>简历</mark>，并筛选出更有潜力的候选人。", "r": "2021 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}]}, {"id": 1705, "w": "retire", "f": 3, "m": "", "s": [{"d": "1. v. 撤下；移回（2）", "e": "Why did Waterstones shops <mark>retire</mark> PRH books to their relevant sections?", "z": "为什么水石书店把企鹅兰登书屋的书<mark>撤回</mark>各自对应的分区？", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 32 题"}, {"d": "2. v. 退休（1）", "e": "Certain artifacts are especially vulnerable because some pioneers in plastic art didn&#x27;t always know how to mix ingredients properly, says Thea van Oosten, a polymer chemist who, until <mark>retiring</mark> a few years ago, worked for decades at the Cultural Heritage Agency of the Netherlands (RCE).", "z": "聚合物化学家西娅·范奥斯滕说，某些艺术品尤其容易受损，因为一些塑料艺术的先驱并不总是懂得如何恰当地混合原料；她在荷兰文化遗产局（RCE）工作了数十年，直到几年前<mark>退休</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1706, "w": "revelation", "f": 3, "m": "re-（移开）+vel（遮盖）+-ation（行为或结果）", "s": [{"d": "1. n. 新发现（2）", "e": "It was with these great <mark>revelations</mark> that a new kind of philosophy founded in reason was born.", "z": "正是伴随着这些<mark>重大发现</mark>，一种以理性为依据的新哲学诞生了。", "r": "2020 · 英语一 · 阅读理解 C · 第 48 题"}, {"d": "2. n. 揭示；揭露的事实（1）", "e": "One of the astonishing <mark>revelations</mark> was how little Rebekah Brooks knew of what went on in her newsroom, how little she thought to ask and the fact that she never inquired how the stories arrived.", "z": "其中一个令人震惊的<mark>披露</mark>是，丽贝卡·布鲁克斯对自己新闻编辑室里发生的事情知之甚少，想到要问的也极少，而且从未询问那些报道从何而来。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1707, "w": "revise", "f": 3, "m": "re-（再次）+vise（看）", "s": [{"d": "1. v. 修订；修改（3）", "e": "&quot;We reason together, challenge, <mark>revise</mark>, and complete each other&#x27;s reasoning and each other&#x27;s conceptions of reason.&quot;", "z": "“我们共同推理，质疑、<mark>修正</mark>并完善彼此的推理，以及彼此对理性的理解。”", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1708, "w": "revolution", "f": 3, "m": "re-（回、重新）+volut（转动）+-ion（名词后缀）", "s": [{"d": "1. n. 革命、重大变革（3）", "e": "The victims of this <mark>revolution</mark>, of course, are not limited to designers.", "z": "当然，这场<mark>变革</mark>的受害者并不限于设计师。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1709, "w": "rigid", "f": 3, "m": "rig（僵硬）+id（具有这种性质的）", "s": [{"d": "1. adj. 严格的；僵化的（3）", "e": "[ D ] a <mark>rigid</mark> moral code.", "z": "[D] 一套<mark>严格</mark>的道德规范。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 39 题 · 选项 D · 真题选项"}]}, {"id": 1710, "w": "ritual", "f": 3, "m": "ritu-（仪式）+-al（有关的）", "s": [{"d": "1. n. 仪式；固定惯例（3）", "e": "It has become a grimly reliable annual <mark>ritual</mark>: every January the cost of travelling by train rises, imposing a significant extra burden on those who have no option but to use the rail network to get to work or otherwise.", "z": "这已成为一种令人沮丧却年年准时上演的<mark>惯例</mark>：每到一月，乘火车出行的费用就上涨，给那些除了依靠铁路通勤或进行其他出行而别无选择的人，增加一笔沉重负担。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1711, "w": "round", "f": 3, "m": "", "s": [{"d": "1. n. 轮；一轮（2）", "e": "The journal Science is adding an extra <mark>round</mark> of statistical checks to its peer-review process, editor-in-chief Marcia McNutt announced today.", "z": "《科学》杂志主编玛西娅·麦克纳特今天宣布，该刊将在同行评审流程中增加一<mark>轮</mark>统计检查。", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. prep. 全天候（round-the-clock）（1）", "e": "No shock there, considering how much work it is to raise a kid without a partner to lean on; yet to hear Sandra and Britney tell it, raising a kid on their &quot;own&quot; (read: with <mark>round</mark>-the-clock help) is a piece of cake.", "z": "考虑到没有伴侣可以依靠时抚养孩子是多么辛苦，这并不令人震惊；但听桑德拉和布兰妮的说法，“独自”养孩子（意思是：有人<mark>全天候</mark>帮忙）简直是小菜一碟。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1712, "w": "routine", "f": 3, "m": "", "s": [{"d": "1. n. 惯例、日常安排（2）", "e": "Most importantly, it __18__ modifies and enhances the games you play to __19__ on the strengths you are developing -much like a(n) __20__ exercise <mark>routine</mark> requires you to increase resistance and vary your muscle use.", "z": "最重要的是，它会__18__修改并改进你玩的游戏，以__19__你正在培养的优势--就像一套__20__<mark>日常锻炼计划</mark>要求你增加阻力，并改变肌肉的使用方式一样。", "r": "2014 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. adj. 常规的、日常的（1）", "e": "Today, professors routinely treat the progressive interpretation of history and progressive public policy as the proper subject of study while portraying conservative or classical liberal ideas - such as free markets and self-reliance - as falling outside the boundaries of <mark>routine</mark>, and sometimes legitimate, intellectual investigation.", "z": "如今，教授们通常将进步主义的历史解释和公共政策视为适当的研究对象，却把自由市场、自力更生等保守主义或古典自由主义思想描绘为超出<mark>常规</mark>知识探究范围、有时甚至不具正当性的东西。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1713, "w": "safeguard", "f": 3, "m": "safe（安全的）+guard（守护、保护）", "s": [{"d": "1. v. 保护、保障（2）", "e": "The carbon emissions from technological research are well spent: ultimately this research will <mark>safeguard</mark> the future of our planet.", "z": "技术研究产生的碳排放是值得的：这些研究最终将<mark>保护</mark>我们地球的未来。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 保障措施（1）", "e": "The premise was that the common law of contract lacked sufficient <mark>safeguards</mark> for workers against arbitrary conduct by management.", "z": "其前提是，普通合同法缺乏充分的<mark>保障措施</mark>，无法保护工人免受管理层任意行为的侵害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1714, "w": "sake", "f": 3, "m": "", "s": [{"d": "1. n. 为了（for thesake of）（3）", "e": "(50) They pool resources, collaborate, think outside the box, and find solutions and ways around obstacles to explore science for the <mark>sake</mark> of science without the traditional boundaries of working inside a formal setting.", "z": "（50）他们汇集资源、相互合作、跳出思维框架，寻找解决办法和绕开障碍的途径，<mark>为科学本身</mark>而探索科学，不受正式机构工作方式的传统界限约束。", "r": "2025 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1715, "w": "scar", "f": 3, "m": "", "s": [{"d": "1. n. 伤疤；疤痕（2）", "e": "Some of the trees he analyzed bore more than 20 fire <mark>scars</mark> among their rings.", "z": "他分析的一些树木，其年轮中带有二十多处火灾<mark>疤痕</mark>。", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 使留下伤疤；使留下疤痕（1）", "e": "In 2022, Swetnam and other scientists teamed up to compile a database of fire-<mark>scarred</mark> trees from across the continent.", "z": "2022年，斯韦特南与其他科学家合作，汇编了一个收录整个大陆上<mark>留有火烧伤疤</mark>的树木的数据库。", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1716, "w": "section", "f": 3, "m": "sect（切割、切分）+-ion（结果、部分的名词后缀）", "s": [{"d": "1. n. 部分；分区（3）", "e": "Why did Waterstones shops retire PRH books to their relevant <mark>sections</mark>?", "z": "为什么水石书店把企鹅兰登书屋的书撤回各自对应的<mark>分区</mark>？", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 32 题"}]}, {"id": 1717, "w": "seemingly", "f": 3, "m": "seem（看似、显得）+-ing（呈现的状态）+-ly（副词后缀）", "s": [{"d": "1. adv. 似乎；表面上（3）", "e": "The music is abrupt and <mark>seemingly</mark> disconnected, as in the last piano sonata.", "z": "这段音乐突兀且<mark>似乎</mark>不连贯，正如最后一首钢琴奏鸣曲那样。", "r": "2014 · 英语一 · 阅读理解 C · 第 47 题"}]}, {"id": 1718, "w": "self-help", "f": 3, "m": "self（自己）+help（帮助）", "s": [{"d": "1. 短语 自助；自我提升（3）", "e": "With its theme that &quot;Mind is the master weaver,&quot; creating our inner character and outer circumstances, the book As a Man Thinketh by James Allen is an in-depth exploration of the central idea of <mark>self-help</mark> writing.", "z": "詹姆斯·艾伦的《思想塑造人生》以“思想是技艺高超的织匠”为主题，认为思想塑造我们的内在品格和外部境遇，深入探讨了<mark>自助</mark>作品的核心理念。", "r": "2011 · 英语一 · 阅读理解 C · 第 46-50 题"}]}, {"id": 1719, "w": "settle", "f": 3, "m": "sett（放置、固定）+le（动词词形结尾）", "s": [{"d": "1. v. 解决；确定（2）", "e": "[ D ] <mark>settle</mark>", "z": "［D］<mark>解决</mark>；<mark>确定</mark>。", "r": "2012 · 英语一 · 完形填空 · 第 8 题 · 选项 D · 真题选项"}, {"d": "2. v. 安定下来（settle down）（1）", "e":  "signat-（签名；标记，历史词干）+-ure（名词后缀）", "s": [{"d": "1. adj. 标志性的（1）", "e": "[ B ] Peters&#x27; <mark>signature</mark> shot is a butterfly &quot;take-off&quot;, showing the multiple wing-beats of one butterfly in one frame as it lifts off from a flower.", "z": "[B] 彼得斯的<mark>标志性</mark>照片是蝴蝶“起飞”：当一只蝴蝶从花朵上腾空而起时，一张画面中呈现出它多次扇动翅膀的影像。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 B · 真题选项"}, {"d": "2. n. 独特标志（1）", "e": "(49) The volatile chemicals produced by plants can be carried a long way, and they are very characteristic: Each plant or tree has its own particular odor <mark>signature</mark>.", "z": "（49）植物释放的挥发性化学物质可以传播很远，而且具有鲜明的特征：每株植物或每棵树都有自己<mark>独特的气味标志</mark>。", "r": "2024 · 英语一 · 阅读理解 C · 第 49 题"}, {"d": "3. n. 签名（1）", "e": "The digital services tax now awaits the <mark>signature</mark> of President Emmanuel Macron, who has expressed support for the measure, and it could go into effect within the next few weeks.", "z": "数字服务税目前正等待埃马纽埃尔·马克龙总统<mark>签字</mark>；他已经表达了对该措施的支持，而这项税收可能在未来几周内生效。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1724, "w": "similarity", "f": 3, "m": "similar（相似的）+-ity（性质）", "s": [{"d": "1. n. 相似性；相似之处（3）", "e": "Why this <mark>similarity</mark> exists in smell genes is difficult to explain, for now.", "z": "嗅觉基因为何存在这种<mark>相似性</mark>，目前还难以解释。", "r": "2015 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1725, "w": "similarly", "f": 3, "m": "similar（相似的）+-ly（以这种方式）", "s": [{"d": "1. adv. 同样地；类似地（3）", "e": "<mark>Similarly</mark>, some Wall Street investment firms armed themselves with patents for financial products, even as they took positions in court cases opposing the practice.", "z": "<mark>同样</mark>，一些华尔街投资公司用金融产品专利来武装自己，即便它们在诉讼中对这一做法采取了反对立场。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1726, "w": "simplify", "f": 3, "m": "simpl（simple去e，简单的）+-ify（使成为）", "s": [{"d": "1. v. 简化（3）", "e": "This __11__ makes sense if you <mark>simplify</mark> the workings of a complex brain, __12__ it to an array of electrical pulses; cells in plants  21-25 题"}]}, {"id": 1779, "w": "upcoming", "f": 3, "m": "up（来到）+coming（来临的）", "s": [{"d": "1. adj. 即将到来的（3）", "e": "<mark>Upcoming</mark> reforms might bring the price to a more reasonable level.", "z": "<mark>即将到来的</mark>改革可能会使价格降至更合理的水平。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1780, "w": "valid", "f": 3, "m": "val（强有力、能起作用）+-id（形容词结尾）", "s": [{"d": "1. adj. 合理的；有根据的（3）", "e": "The evidence had to be economic in order to be <mark>valid</mark>.", "z": "证据必须与经济有关，才能<mark>成立</mark>。", "r": "2010 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 1781, "w": "vanity", "f": 3, "m": "van（空、虚无）+ity（性质或状态的名词后缀）", "s": [{"d": "1. n. 虚荣；自负（3）", "e": "<mark>Vanity</mark> is a constant; people will only start shopping more sustainably when they can&#x27;t afford not to.", "z": "<mark>虚荣</mark>是永恒不变的；只有当人们承担不起不这样做的代价时，才会开始以更可持续的方式购物。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1782, "w": "variation", "f": 3, "m": "vary（变化；y变i）+-ation（名词后缀）", "s": [{"d": "1. n. 变化；差异（3）", "e": "[ D ] its major <mark>variations</mark>.", "z": "[D] 它的主要<mark>变化</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 D · 真题选项"}]}, {"id": 1783, "w": "via", "f": 3, "m": "", "s": [{"d": "1. prep. 通过；经由（3）", "e": "An emerging body of research shows that positive health habits-as well as negative ones-spread through networks of friends <mark>via</mark> social communication.", "z": "一批新兴研究表明，积极的健康习惯和消极的习惯一样，都会<mark>经由</mark>社会交流在朋友关系网络中传播。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1784, "w": "victory", "f": 3, "m": "vict（战胜、征服）+ory（名词结尾）", "s": [{"d": "1. n. 胜利（3）", "e": "This narrowing of the regulatory scope was a <mark>victory</mark> for builders, mining operators and other commercial interests often at odds with environmental rules.", "z": "监管范围的这种缩小，是建筑商、采矿经营者和其他经常与环保规定相冲突的商业利益集团的一次<mark>胜利</mark>。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1785, "w": "video", "f": 3, "m": "vide（看）+o（词形结尾）", "s": [{"d": "1. n. 视频（3）", "e": "The commission argued that other agencies would protect against anti-competitive behavior, such as a broadband-providing conglomerate like AT&amp;T favoring its own <mark>video</mark>-streaming service at the expense of Netflix and Apple TV.", "z": "该委员会认为，其他机构会防范反竞争行为，例如像美国电话电报公司这样提供宽带服务的企业集团偏袒自己的<mark>视频</mark>流媒体服务，损害奈飞和苹果电视的利益。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1786, "w": "virtual", "f": 3, "m": "", "s": [{"d": "1. adj. 虚拟的；网络的（2）", "e": "The best uses of 3D printers and <mark>virtual</mark> reality haven&#x27;t been invented yet.", "z": "3D打印机和<mark>虚拟</mark>现实的最佳用途还没有被创造出来。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 实际上的；事实上的（1）", "e": "Orin Kerr, a law professor, compares the explosion and accessibility of digital information in the 21st century with the establishment of automobile use as a <mark>virtual</mark> necessity of life in the 20th: The justices had to specify novel rules for the new personal domain of the passenger car then; they must sort out how the Fourth Amendment applies to digital information now.", "z": "法学教授奥林·克尔把21世纪数字信息的爆炸式增长及其易获取性，比作20世纪汽车在<mark>事实上</mark>成为生活必需品的过程：当时，大法官们不得不为乘用车这一新的个人领域制定新规则；如今，他们必须弄清第四修正案如何适用于数字信息。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1787, "w": "vocabulary", "f": 3, "m": "vocabul-（词语；名称）+-ary（集合或相关事物）", "s": [{"d": "1. n. 词汇；词汇量（3）", "e": "The peer-reviewed results showed that the target group of pupils drew on a wider <mark>vocabulary</mark>, used words &quot;classed as more sophisticated or rarer&quot;, and wrote at greater length.", "z": "经过同行评审的结果表明，实验组学生运用了更广的<mark>词汇</mark>，使用了“被归类为更高级或更罕见”的词语，写作篇幅也更长。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1788, "w": "volunteer", "f": 3, "m": "volunt-（意愿、自愿）+-eer（从事者）", "s": [{"d": "1. n. 志愿者、志愿参加的（3）", "e": "Write an email to answer the inquiry from an international student <mark>volunteer</mark>, specifying the details of the project.", "z": "写一封电子邮件，回复一名国际学生<mark>志愿者</mark>的咨询，说明该项目的具体细节。", "r": "2019 · 英语一 · ng is fuller, more advanced or more <mark>worthwhile</mark> than another.", "z": "因此，并不必然意味着某种阅读比另一种更充实、更高级或<mark>更有价值</mark>。", "r": "2015 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 1799, "w": "yield", "f": 3, "m": "", "s": [{"d": "1. v. 产生、带来（2）", "e": "Typically, they survey and sample (make test excavations on) large areas of terrain to determine where excavation will <mark>yield</mark> useful information.", "z": "通常，他们会勘察大片地形并进行取样勘探，也就是试掘，以确定在哪些地方挖掘能够<mark>获得</mark>有用的信息。", "r": "2014 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}, {"d": "2. v. 屈服于、让步于（yield to）（1）", "e": "[ B ] <mark>yield</mark> to", "z": "[B] <mark>屈服于</mark>", "r": "2024 · 英语一 · 完形填空 · 第 8 题 · 选项 B · 真题选项"}]}, {"id": 1800, "w": "abandon", "f": 2, "m": "", "s": [{"d": "1. v. 放弃；舍弃；遗弃（2）", "e": "The most successful monarchies strive to <mark>abandon</mark> or hide their old aristocratic ways.", "z": "最成功的君主制国家努力<mark>摒弃</mark>或隐藏其旧有的贵族做派。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
