<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 25 (2401-2500) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

（1）", "e": "This is the credibility process, through which the individual researcher&#x27;s me, here, now becomes the community&#x27;s anyone, anywhere, <mark>anytime</mark>.", "z": "这就是建立可信度的过程：通过这一过程，单个研究者的“我、此地、此时”，转变为整个群体的“任何人、任何地方、<mark>任何时候</mark>”。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2407, "w": "apartment", "f": 1, "m": "apart（分开的、分隔的）+-ment（名词后缀）", "s": [{"d": "1. n. 公寓；公寓住宅（1）", "e": "The researchers mapped not only the city&#x27;s vast and ornate ceremonial areas, but also hundreds of simpler <mark>apartment</mark> complexes where common people lived.", "z": "研究人员不仅绘制了这座城市广阔而装饰华丽的仪式区域地图，还绘制了普通居民居住的数百个较为简朴的<mark>公寓</mark>建筑群地图。", "r": "2014 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 B · 真题选项"}]}, {"id": 2408, "w": "apologize", "f": 1, "m": "apology（道歉；辩解，去y）+-ize（动词后缀）", "s": [{"d": "1. v. 道歉（1）", "e": "DeepMind has almost <mark>apologized</mark>.", "z": "DeepMind几乎已经<mark>道歉</mark>了。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2409, "w": "appetite", "f": 1, "m": "ap-（趋向）+pet（寻求）+ite（本词的名词结尾）", "s": [{"d": "1. n. 强烈欲望（1）", "e": "And it is equally true that science&#x27;s unrelenting <mark>appetite</mark> for information has caused a mushrooming of energy-intensive data centres around the world.", "z": "同样确凿的是，科学对信息永无止境的<mark>渴求</mark>，已使耗能巨大的数据中心在世界各地迅速涌现。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2410, "w": "appreciate", "f": 1, "m": "ap-（向）+preci（价值）+-ate（动词后缀）", "s": [{"d": "1. v. 欣赏；认可（1）", "e": "Sometimes years are required for truly novel discovery claims to be accepted and <mark>appreciated</mark>.", "z": "有时，真正新颖的发现主张需要多年才能被接受并获得<mark>认可</mark>。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2411, "w": "approximately", "f": 1, "m": "approximate（近似的、大致相当的）+ly（副词后缀）", "s": [{"d": "1. adv. 大约；近似地（1）", "e": "[ A ] <mark>Approximately</mark>", "z": "[A] <mark>大约</mark>。", "r": "2026 · 英语一 · 完形填空 · 第 15 题 · 选项 A · 真题选项"}]}, {"id": 2412, "w": "apt", "f": 1, "m": "", "s": [{"d": "1. adj. 容易……的（1）", "e": "[ B ] is <mark>apt</mark> to arouse criticism at home and abroad.", "z": "[B] <mark>容易</mark>引发国内外的批评。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 37 题 · 选项 B · 真题选项"}]}, {"id": 2413, "w": "archaeology", "f": 1, "m": "archaeo-（古代、古代事物）+-logy（研究、学科）", "s": [{"d": "1. n. 考古学（1）", "e": "Since the 1960s, underwater <mark>archaeology</mark> __15__ and tools had made huge advances.", "z": "自20世纪60年代以来，水下<mark>考古学</mark>的____和工具取得了巨大进步。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2414, "w": "architect", "f": 1, "m": "archi-（首席、主要）+tect（建造者）", "s": [{"d": "1. n. 建筑师（1）", "e": "Designed by Supervising <mark>Architect</mark> of the Treasury, Alfred B. Mullett, it was built from 1871 to 1888 to house the growing staffs of the State, War, and Navy Departments, and is considered one of the best examples of French Second Empire architecture in the country.", "z": "它由美国财政部首席<mark>建筑师</mark>阿尔弗雷德·B.马利特设计，于1871年至1888年间建造，用来容纳国务院、陆军部和海军部不断增加的工作人员，被认为是美国最优秀的法国第二帝国风格建筑之一。", "r": "2018 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 2415, "w": "archive", "f": 1, "m": "", "s": [{"d": "1. n. 档案馆；档案保存机构（1）", "e": "Libraries and <mark>archives</mark> have traditionally shouldered the responsibility of organization, preservation, and access to information.", "z": "图书馆和<mark>档案馆</mark>历来承担着信息组织、保存和获取的责任。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2416, "w": "arrogant", "f": 1, "m": "ar-（朝向自己一方）+rog（请求、主张）+-ant（具有这种性质的）", "s": [{"d": "1. adj. 傲慢的（1）", "e": "[ A ] <mark>arrogant</mark>.", "z": "[A] <mark>傲慢</mark>的。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26 题 · 选项 A · 真题选项"}]}, {"id": 2417, "w": "ascribe", "f": 1, "m": "a-（向）+scrib（写）+e（词形结尾）", "s": [{"d": "1. v. 赋予（意义）（1）", "e": "[ G ] Rather, we <mark>ascribe</mark> meanings to texts on the basis of interaction between what we might call textual and contextual material: between kinds of organization or patterning we perceive in a text&#x27;s formal structures (so especially its language structures) and various kinds of background, social knowledge, belief and attitude that we bring to the text.", "z": "[G] 相反，我们<mark>赋予</mark>文本的意义源于我们可以称作文本材料与语境材料的相互作用：一方面是我们在文本的形式结构中，尤其是在语言结构中，感知到的种种组织形式或模式，另一方面则是我们带入文本的各种背景、社会知识、信念和态度。", "r": "2015 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}]}, {"id": 2418, "w": "ash", "f": 1, "m": "", "s": [{"d": "1. n. 灰烬（1）", "e": "This was an attempt to recover the valuable nails, which could be reused after sifting the <mark>ashes</mark>.", "z": "这样做是为了尝试回收有价值的钉子，筛除<mark>灰烬</mark>后，这些钉子可以再次使用。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2419, "w": "assemble", "f": 1, "m": "as-（向）+sem（相同、同一）+ble（词形结尾）", "s": [{"d": "1. v. 组装；组合（1）", "e": "How the whole image is then <mark>assembled</mark> and perceived is still a mystery although it is the subject of current research.", "z": "随后，完整图像是如何被<mark>组合</mark>并被感知的，虽然正在受到研究，但仍然是一个谜。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 2420, "w": "assert", "f": 1, "m": "as-（向）+sert（连接；主张）", "s": [{"d": "1. v. 明确表达、坚持主张（1）", "e": "The Administration was in essence <mark>asserting</mark> that because it didn&#x27;t want to carry out Congress&#x27;s immigration wishes, no state should be allowed to do so either.", "z": "政府实际上是在<mark>主张</mark>：既然它不愿执行国会在移民问题上的意愿，那么任何州也不应该获准这样做。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2421, "w": "assignment", "f": 1, "m": "assign（分配、指派）+-ment（表示行为或结果的名词后缀）", "s": [{"d": "1. n. 作业；指定任务（1）", "e": "I&#x27;ve got a class <mark>assignment</mark> to make an oral report on an ancient Chinese scientist, but I&#x27;m not sure how to prepare for it.", "z": "我有一项课堂<mark>作业</mark>，要就一位中国古代科学家作口头报告，但不确定该如何准备。", "r": "2024 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 2422, "w": "assistance", "f": 1, "m": "assist（协助、帮助）+-ance（行为、作用的名词后缀）", "s": [{"d": "1. n. 帮助；援助（1）", "e": "Called conditional cash transfers or CCTs, these social <mark>assistance</mark> programs are designed to reduce inequality and break the cycle of poverty.", "z": "这些被称为“有条件现金转移支付”、简称CCT的社会<mark>援助</mark coming more difficult.", "z": "人工智能要取得成功，就必须能获取数据，但个人数据的使用正受到更多监管，数据的<mark>自动化</mark>共享也越来越困难。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 2429, "w": "awkward", "f": 1, "m": "", "s": [{"d": "1. adj. 笨重不便的（1）", "e": "The crude technique required educated guesses on exposure times, and involved heavy, <mark>awkward</mark> equipment-several men had to assist in its transportation.", "z": "这种粗糙的技术需要对曝光时间作出有根据的猜测，还要使用沉重而<mark>笨拙</mark>的设备，必须由几个人协助运输。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 2430, "w": "baggage", "f": 1, "m": "bag（袋、包）+-age（集合或相关事物）", "s": [{"d": "1. n. 行李（1）", "e": "Another factor may be that more people are trying to overpack their carry-on bags to avoid checked-<mark>baggage</mark> fees, though the airlines strongly dispute this.", "z": "另一个因素可能是，为避免<mark>行李</mark>托运费，越来越多的人试图把随身包塞得过满，不过航空公司对此坚决否认。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2431, "w": "bake", "f": 1, "m": "", "s": [{"d": "1. v. 烘烤（1）", "e": "&quot;It&#x27;s like <mark>baking</mark> a cake: If you don&#x27;t have exact amounts, it goes wrong,&quot; she says.", "z": "她说：“这就像<mark>烘焙</mark>蛋糕：如果用量不精确，就会出问题。”", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2432, "w": "bald", "f": 1, "m": "", "s": [{"d": "1. adj. 白头的（bald eagle：白头海雕）（1）", "e": "We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where <mark>bald</mark> eagles fly over tidal marshes so shallow you could not paddle a boat across them, but teeming with aquatic life.", "z": "我们可以安排他们参观多切斯特县的黑水国家野生动物保护区，那里<mark>白头</mark>海雕翱翔在潮汐沼泽上空；沼泽浅得无法划船穿过，却充满了水生生物。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2433, "w": "ball", "f": 1, "m": "", "s": [{"d": "1. n. 球（1）", "e": "Pairs of opponents hit the <mark>ball</mark> back and forth until one winner emerges from all who entered.", "z": "对阵双方将<mark>球</mark>来回击打，直到所有报名参赛者中决出一名胜者。", "r": "2019 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 2434, "w": "banner", "f": 1, "m": "", "s": [{"d": "1. n. 横幅广告（1）", "e": "Data can be gathered on where the customer can be engaged, such as location, devices used, website interactions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and <mark>banners</mark> at an appropriate frequency.", "z": "可以收集与何处能够接触到顾客有关的数据，例如顾客的位置、使用的设备、网站互动和访问的网站，从而以合适的频率，通过电子邮件、社交媒体帖子、弹出式广告和<mark>横幅广告</mark>等恰当形式展示营销信息。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 2435, "w": "basically", "f": 1, "m": "basic（基本的、基础的）+ally（从这种性质而言）", "s": [{"d": "1. adv. 基本上；本质上（1）", "e": "[ B ] have remained <mark>basically</mark> the same since Roman times", "z": "［B］自罗马时代以来<mark>基本上</mark>保持不变。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 24 题 · 选项 B · 真题选项"}]}, {"id": 2436, "w": "bearing", "f": 1, "m": "bear（承受；携带）+-ing（名词后缀）", "s": [{"d": "1. n. 方位感（1）", "e": "If you&#x27;ve explored the area before, keep an eye out for familiar sights - you may be __11__ how quickly identifying a distinctive rock or tree can restore your <mark>bearings</mark>.", "z": "如果你以前探索过这片区域，就留意熟悉的景物--你可能会____认出一块独特的岩石或一棵树竟能如此迅速地恢复你的<mark>方位感</mark>。", "r": "2019 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2437, "w": "beautify", "f": 1, "m": "beaut-（beauty去y，美、美丽）+-ify（使成为、使具有）", "s": [{"d": "1. v. 美化（1）", "e": "There is no doubt that gardens evidence an irrepressible urge to create, express, fashion, and <mark>beautify</mark> and that self-expression is a basic human urge; (46) yet when one looks at the photographs of the gardens created by the homeless, it strikes one that, for all their diversity of styles, these gardens speak of various other fundamental urges, beyond that of decoration and creative expression.", "z": "毫无疑问，花园表明人们有一种难以抑制的创造、表达、塑造和<mark>美化</mark>的冲动，而自我表达也是人类的一种基本冲动；（46）然而，当人们看着无家可归者所建花园的照片时，就会意识到，尽管这些花园风格各异，它们却体现出装饰和创造性表达之外的其他多种基本冲动。", "r": "2013 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 2438, "w": "becoming", "f": 1, "m": "become（适合，去e）+-ing（形容词化分词后缀）", "s": [{"d": "1. adj. 得体的；相称的（1）", "e": "A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#x27;s gum-exposing Cheshire Cat, but it was not a <mark>becoming</mark> look for properly bred persons.", "z": "露齿咧嘴笑（尤其是牙齿有缺口或发黑时）显得缺乏格调：醉汉、流浪汉和音乐厅演员可以挤眉弄眼、咧嘴大笑，像刘易斯·卡罗尔笔下露出牙龈的柴郡猫那样笑得嘴角大开，但对有良好教养的人来说，这种表情并不<mark>得体</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2439, "w": "bench", "f": 1, "m": "", "s": [{"d": "1. n. 后备人才队伍（1）", "e": "Persuading studios to film here would become much more challenging if we couldn&#x27;t offer a deep <mark>bench</mark> of local film workers, on-screen talent and local businesses that support the entertainment industry.", "z": "如果我们无法提供储备充足的本地电影从业者、荧幕表演人才以及支持娱乐业的本地企业这一<mark>后备队伍</mark>，说服制片厂来此拍摄就会困难得多。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 2440, "w": "better", "f": 1, "m": "", "s": [{"d": "1. v. 改善（1）", "e": "[ A ] <mark>better</mark> businesses&#x27; relations with states.", "z": "[A] <mark>改善</mark>企业与各州的关系。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36 题 · 选项 A · 真题选项"}]}, {"id": 2441, "w": "bicycle", "f": 1, "m": "bi-（两个）+cycle（轮；圆）", "s": [{"d": "1. n. 自行车（1）", "e": "Princes and princesses have day-jobs and ride <mark>bicycles</mark>, not horses (or helicopters).", "z": "王子和公主有日常工作，出行骑<mark>自行车</mark>，而不是骑马（或乘直升机）。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2442, "w": "bid", "f": 1, "m": "", "s": [{"d": "1. n. 出价；竞标（1）", "e": "Britain&#x27;s towns, it is true, are not prevented from applying, but they generally lack the resources to put together a <mark>bid</mark> to beat their bigger competitors.", "z": "诚然，英国的小城镇并未被禁止提出申请，但它们通常缺乏资源，难以准备一份能击败更大竞争对手的<mark>竞标方案</mark>。", "r": "2020 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2443, "w": "bin", "f": 1, "m": "", "s": [{"d": "1. n. （存放商品的）箱柜（1）", "e": "Priestly explains how the deep blue color of the assistant&#x27;s sweater descended over the years from fashion shows to department stores and to the bargain <mark>bin</mark> in which the poor girl doubtless found her garment.", "z": "普里斯特利解释说，助理毛衣上的深蓝色多年来如何从时装秀逐渐向下流传到百货商店，再到<mark>特价商品箱</mark>，而这个可怜的女孩毫无疑问就是从那里找到这件衣服的。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2444, "w": "biography", "f": 1, "m": "bio-（生命、生平）+-graphy（书写、记述）", "s": [{"d": "1. n. 传记（1）", "e": "His tale of self-improvement and hard work would make a fascinating <mark>biography</mark> in its own right, but represents something more than that.", "z": "他自我提升、勤奋工作的故事，本身就足以写成一本引人入胜的<mark>传记</mark>，但它的意义还不止于此。", "r": "2022 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2445, "w": "bite", "f": 1, "m": "", "s": [{"d": "1. v. 咬（1）", "e": "[ B ] <mark>bite</mark>", "z": "［B］<mark>咬</mark>。", "r": "2011 · 英语一 · 完形填空 · 第 16 题 · 选项 B · 真题选项"}]}, {"id": 2446, "w": "bizarre", "f": 1, "m": "", "s": [{"d": "1. adj. 奇怪的；异乎寻常的（1）", "e": "At a time when Thomas Piketty and other economists are warning of rising inequality and the increasing power of inherited wealth, it is <mark>bizarre</mark> that wealthy aristocratic families should still be the symbolic heart of modern democratic states.", "z": "在托马斯·皮凯蒂等经济学家警告不平等加剧、继承财富的力量不断增强之际，富有的贵族家族竟仍是现代民主国家的象征性核心，实在令人<mark>匪夷所思</mark>。", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2447, "w": "blank", "f": 1, "m": "", "s": [{"d": "1. adj. 没有表情的（1）", "e": "The thought of holding a fixed grin as the camera performed its magical duties was too much to contemplate, and so a non-committal <mark>blank</mark> stare became the norm.", "z": "一想到相机施展神奇本领时自己必须始终保持僵硬的笑容，就让人难以设想，因此不表露态度、<mark>毫无表情的</mark>凝视便成了常态。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2448, "w": "bleed", "f": 1, "m": "", "s": [{"d": "1. v. 大量流失（资金）；亏损（1）", "e": "The U.S. Postal Service (USPS) continues to <mark>bleed</mark> red ink.", "z": "美国邮政局仍在持续<mark>大量亏损</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2449, "w": "blessing", "f": 1, "m": "bless（祝福）+-ing（行为；结果）", "s": [{"d": "1. n. 祝福（1）", "e": "Buddhist priests offer a short sermon and __8__ prayers of <mark>blessing</mark>.", "z": "佛教僧侣作简短说法，并__8__<mark>祝福</mark>的祈祷。", "r": "2016 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2450, "w": "blood", "f": 1, "m": "", "s": [{"d": "1. n. 血液（1）", "e": "Laughter does __2__ short-term changes in the function of the heart and its <mark>blood</mark> vessels, __3__ heart rate and oxygen consumption.", "z": "笑确实会__2__心脏及其<mark>血</mark>管功能的短期变化，__3__心率和氧气消耗量。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2451, "w": "blunder", "f": 1, "m": "", "s": [{"d": "1. n. 重大失误（1）", "e": "&quot;It was seen as a <mark>blunder</mark>,&quot; he said.", "z": "他说：“这被视为一次<mark>重大失误</mark>。”", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2452, "w": "boast", "f": 1, "m": "", "s": [{"d": "1. n. 夸耀；吹嘘（1）", "e": "[ C ] <mark>boast</mark>.", "z": "[C] <mark>吹嘘</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 27 题 · 选项 C · 真题选项"}]}, {"id": 2453, "w": "boat", "f": 1, "m": "", "s": [{"d": "1. n. 船（1）", "e": "We can offer them a visit to Blackwater National Wildlife Refuge in Dorchester County where bald eagles fly over tidal marshes so shallow you could not paddle a <mark>boat</mark> across them, but teeming with aquatic life.", "z": "我们可以安排他们参观多切斯特县的黑水国家野生动物保护区，那里白头海雕翱翔在潮汐沼泽上空；沼泽浅得无法划<mark>船</mark>穿过，却充满了水生生物。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2454, "w": "boil", "f": 1, "m": "", "s": [{"d": "1. v. 归结为（boildown to）（1）", "e": "<mark>Boiling</mark> down an individual&#x27;s output to simple metrics, such as number of publications or journal impacts, entails considerable savings in time, energy and ambiguity.", "z": "把一个人的产出<mark>归结为</mark>简单的指标，比如发表论文的数量或期刊影响力，可以节省大量时间和精力，并显著减少模糊性。", "r": "2019 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 2455, "w": "bold", "f": 1, "m": "", "s": [{"d": "1. adj. 醒目的；大胆的（1）", "e": "They transform the aspirations of the people who live there; they nudge the self-image of the city into a <mark>bolder</mark> and more optimistic light.", "z": "它们改变了当地居民的志向，也促使这座城市以更<mark>大胆</mark>、更乐观的眼光看待自身形象。", "r": "2020 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 2456, "w": "boot", "f": 1, "m": "", "s": [{"d": "1. n. 启动（计算机）（1）", "e": "All I have to do is to go to my CD shelf, or <mark>boot</mark> up my computer and download still more recorded music from iTunes.", "z": "我只需要走到自己的CD架前，或者<mark>启动</mark>电脑，从iTunes下载更多录制好的音乐。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题 原表义项待核：本例中为动词短语“启动电脑”。"}]}, {"id": 2457, "w": "border", "f": 1, "m": "", "s": [{"d": "1. n. 边界；国界（1）", "e": "Some powers do belong exclusively to the federal government, and control of citizenship and the <mark>borders</mark> is among them.", "z": "有些权力确实专属于联邦政府，其中就包括对公民身份和<mark>国界</mark>的管理。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 2458, "w": "borrow", "f": 1, "m": "", "s": [{"d": "1. v. 引用（1）", "e": "One of these urges has to do with creating a state of peace in the midst of turbulence, a &quot;still point of the turning world,&quot; to <mark>borrow</mark> a phrase from T. S. Eliot.", "z": "这些冲动中有一种与在动荡之中营造安宁状态有关，<mark>借用</mark>T. S. 艾略特的话来说，就是“旋转世界中的静止点”。", "r": "2013 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 2459, "w": "bowel", "f": 1, "m": "", "s": [{"d": "1. n. 肠（1）", "e": "[ D ] Five years ago, at summer&#x27;s end, Andrew Fusek Peters was diagnosed with <mark>bowel</mark> cancer.", "z": "［D］五年前的夏末，安德鲁·富塞克·彼得斯被诊断出患有<mark>肠</mark>癌。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 2460, "w": "breakthrough", "f": 1, "m": "break（突破）+through（穿过）", "s": [{"d": "1. n. 突破、重大进展（1）", "e": "Stand in the shoes of scientists and witness the degree to which <mark>breakthroughs</mark> emerge from accidents, conflict and sheer mental stamina.", "z": "站在科学家的立场上，看看<mark>突破</mark>在多大程度上源于偶然事件、冲突和纯粹的精神耐力。", "r": "2026 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 2461, "w": "breed", "f": 1, "m": "", "s": [{"d": "1. v. 培养；教养（1）", "e": "A toothy grin (especially when there were gaps or blackened gnashers) lacked class: drunks, tramps, and music hall performers might gurn and grin with a smile as wide as Lewis Carroll&#x27;s gum-exposing Cheshire Cat, but it was not a becoming look for properly <mark>bred</mark> persons.", "z": "露齿咧嘴笑（尤其是牙齿有缺口或发黑时）显得缺乏格调：醉汉、流浪汉和音乐厅演员可以挤眉弄眼、咧嘴大笑，像刘易斯·卡罗尔笔下露出牙龈的柴郡猫那样笑得嘴角大开，但对有良好<mark>教养</mark>的人来说，这种表情并不得体。", "r": "2021 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2462, "w": "bribe", "f": 1, "m": "", "s": [{"d": "1. v. 贿赂（1）", "e": "&quot;We estimate that either eliminating a substantial labour-rights concern, such as child labour, or increasing corporate giving by about 20% results in fines that generally are 40% lower than the typical punishment for <mark>bribing</mark> foreign officials,&quot; says one researcher.", "z": "一位研究人员说：“我们估计，无论是消除童工等重大劳工权利问题，还是将企业捐赠增加约20%，都会使罚款通常比<mark>贿赂</mark>外国官员所受的常规处罚低40%。”", "r": "2016 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 2463, "w": "bride", "f": 1, "m": "", "s": [{"d": "1. n. 新娘（1）", "e": "Parts of the ceremony involve ritual hair cutting, __9__ cotton threads soaked in holy water around the <mark>bride&#x27;s</mark> and groom&#x27;s wrists, and __10__ a candle around a circle of happily married and respected couples to bless the __11__ .", "z": "仪式的部分环节包括按习俗剪发、在<mark>新娘</mark>和新郎的手腕上____浸过圣水的棉线，以及在一圈婚姻幸福、受人尊敬的夫妇之间____一支蜡烛，以祝福____。", "r": "2016 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 2464, "w": "broadly", "f": 1, "m": "broad（宽广的）+-ly（副词后缀）", "s": [{"d": "1. adv. 广泛地；总体上（1）", "e": "Asked whether any particular papers had impelled the change, McNutt said: &quot;The creation of the &#x27;statistics board&#x27; was motivated by concerns <mark>broadly</mark> with the application of statistics and data analysis in scientific research and is part of Science&#x27;s overall drive to increase reproducibility in the research we publish.&quot;", "z": "当被问及是否有某些特定论文促使这一变化时，麦克纳特说：“设立‘统计委员会’，源于对科学研究中统计学和数据分析应用的<mark>广泛</mark>担忧，也是《科学》整体推动提高所发表研究可重复性的一部分。”", "r": const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
