<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 19 (1801-1900) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

<script>
const UNIT_NO = 19;
const WORDS = [{"id": 1801, "w": "abound", "f": 2, "m": "ab-（向外）+ound（波浪；溢出，历史词干）", "s": [{"d": "1. v. 大量存在（2）", "e": "Opportunities for misinterpretation, error, and self-deception <mark>abound</mark>.", "z": "误解、错误和自我欺骗的机会<mark>大量存在</mark>。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1802, "w": "abrupt", "f": 2, "m": "ab-（离开、断开）+rupt（断裂）", "s": [{"d": "1. adj. 突兀的（1）", "e": "The music is <mark>abrupt</mark> and seemingly disconnected, as in the last piano sonata.", "z": "这段音乐<mark>突兀</mark>且似乎不连贯，正如最后一首钢琴奏鸣曲那样。", "r": "2014 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. adj. 突然的（1）", "e": "This <mark>abrupt</mark> shift to an &quot;intensive mothering narrative&quot;, which suggests that mothers should manage childcare alone, was likely to have been harmful.", "z": "这种<mark>突然</mark>转向“密集育儿叙事”的变化很可能造成了伤害，因为这种叙事暗示，母亲应独自承担育儿工作。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1803, "w": "accelerate", "f": 2, "m": "ac-（进一步）+celer（快速、加速）+-ate（使……）", "s": [{"d": "1. v. 加快；加速（2）", "e": "&quot;Figuring out a way to <mark>accelerate</mark> that transition would make sense for them,&quot; he said, &quot;but if you discontinue it, you&#x27;re going to have your most loyal customers really upset with you.&quot;", "z": "他说：“对他们而言，想办法<mark>加快</mark>这一转型是合理的，但如果你停止提供它，就会让最忠实的客户对你非常不满。”", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1804, "w": "acceptable", "f": 2, "m": "accept（接受、认可）+-able（能够被……的）", "s": [{"d": "1. adj. 可接受的（2）", "e": "The financial crisis has made it more <mark>acceptable</mark> to be between jobs or to leave a bad one.", "z": "金融危机使待业或辞去一份糟糕的工作变得更容易<mark>被接受</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1805, "w": "acclaim", "f": 2, "m": "ac-（朝向）+claim（呼喊、公开说出）", "s": [{"d": "1. n. 赞扬；喝彩（1）", "e": "[ C ] received <mark>acclaim</mark>.", "z": "[C] 获得<mark>赞誉</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21 题 · 选项 C · 真题选项"}, {"d": "2. v. 赞扬；喝彩（1）", "e": "At any rate, this change will ultimately be <mark>acclaimed</mark> by an ever-growing number of both domestic and international consumers, regardless of how long the current consumer pattern will take hold.", "z": "无论如何，不管当前的消费模式还会持续多久，这种变化最终都会得到越来越多国内外消费者的<mark>赞扬</mark>。", "r": "2010 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 C · 真题选项"}]}, {"id": 1806, "w": "accomplish", "f": 2, "m": "ac-（使；加强）+compl（完成）+-ish（动词词尾）", "s": [{"d": "1. v. 完成；实现（2）", "e": "__6__ , instead of straining muscles to build them, as exercise does, laughter apparently <mark>accomplishes</mark> the __7__ .", "z": "____，笑显然<mark>实现</mark>了____，而不是像运动那样通过使肌肉绷紧来增强肌肉。", "r": "2011 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1807, "w": "accounting", "f": 2, "m": "account（核算；说明）+-ing（活动；过程）", "s": [{"d": "1. n. 会计（2）", "e": "Behind the scenes, they have been taking aim at someone else: the <mark>accounting</mark> standard-setters.", "z": "在幕后，他们一直把矛头指向另一些人：<mark>会计</mark>准则制定者。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1808, "w": "accuracy", "f": 2, "m": "accur（精确、周密的词干）+-acy（性质名词后缀）", "s": [{"d": "1. n. 准确性（2）", "e": "What is in question is not the retrieval of an absolute, fixed or &quot;true&quot; meaning that can be read off and checked for <mark>accuracy</mark>, or some timeless relation of the text to the world.", "z": "所讨论的并不是找回某种能够直接解读并核验<mark>准确性</mark>的、绝对、固定或“真实”的意义，也不是文本与世界之间某种永恒不变的关系。", "r": "2015 · 英语一 · 阅读理解 B · 第 43 题"}]}, {"id": 1809, "w": "accustom", "f": 2, "m": "ac-（使进入）+custom（习惯、惯常做法）", "s": [{"d": "1. v. 使习惯于（2）", "e": "By offering on-trend items at dirt-cheap prices, Cline argues, these brands have hijacked fashion cycles, shaking an industry long <mark>accustomed</mark> to a seasonal pace.", "z": "克莱恩认为，这些品牌以极低价格提供时髦商品，从而操控了时尚周期，动摇了一个长期<mark>习惯于</mark>季节节奏的行业。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1810, "w": "acquaintance", "f": 2, "m": "acquaint（使认识、使熟悉）+-ance（状态或相关人的名词词形）", "s": [{"d": "1. n. 熟人（2）", "e": "For a social epidemic to occur, however, each person so affected must then influence his or her own <mark>acquaintances</mark>, who must in turn influence theirs, and so on; and just how many others pay attention to each of these people has little to do with the initial influential.", "z": "然而，要形成社会性传播，每个受影响的人还必须影响自己的<mark>熟人</mark>，<mark>熟人</mark>再影响他们自己的<mark>熟人</mark>，如此类推；至于这些人各自能获得多少他人的关注，则与最初的影响者关系不大。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1811, "w": "actively", "f": 2, "m": "active（积极的、主动的）+ly（以某种方式）", "s": [{"d": "1. adv. 积极地；主动地（2）", "e": "&quot;Many young people assume a great deal of personal responsibility for educating themselves and <mark>actively</mark> seeking out opposing viewpoints,&quot; the survey concluded.", "z": "调查得出结论：“许多年轻人在自我教育方面承担了很大的个人责任，并<mark>主动</mark>寻找对立观点。”", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1812, "w": "adhere", "f": 2, "m": "ad-（向）+her-（黏、附着）+e（词形结尾）", "s": [{"d": "1. v. 依附；被吸引而持续关注（1）", "e": "My definition revolves around the concept of &quot;stickiness&quot; -creations and experiences to which others <mark>adhere</mark>.", "z": "我的定义围绕“黏性”这一概念展开，即能让他人<mark>持续依附</mark>的作品和体验。", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 遵守；坚持（1）", "e": "For years executives and headhunters have <mark>adhered</mark> to the rule that the most attractive CEO candidates are the ones who must be poached.", "z": "多年来，高管和猎头一直<mark>坚持</mark>这样一条原则：最有吸引力的首席执行官候选人，是那些必须从别处挖来的人。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1813, "w": "adulthood", "f": 2, "m": "adult（成年人）+-hood（身份；时期）", "s": [{"d": "1. n. 成年期（2）", "e": "In <mark>adulthood</mark>, looking someone else in a pleasant way can be a complimentary sign of paying attention.", "z": "<mark>成年以后</mark>，以友善的方式注视别人，可以成为一种表示关注、传递赞赏的信号。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1814, "w": "advent", "f": 2, "m": "ad-（向、到）+vent（来、到来）", "s": [{"d": "1. n. 出现；到来（2）", "e": "The <mark>advent</mark> of electronic publishing and authors&#x27; need to find outlets for their papers resulted in thousands of new journals.", "z": "电子出版的<mark>出现</mark>，以及作者为论文寻找发表渠道的需求，促成了数千种新期刊的诞生。", "r": "2023 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1815, "w": "aerial", "f": 2, "m": "aer-（空气、空中）+-ial（与之有关的）", "s": [{"d": "1. adj. 空中的、航空的（2）", "e": "<mark>Aerial</mark> surveys locate general areas of interest or larger buried features, such as ancient buildings or fields.", "z": "<mark>航空</mark>勘测可以确定大致的关注区域，或较大的地下遗存，例如古代建筑或田地。", "r": "2014 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 1816, "w": "affair", "f": 2, "m": "a-（要做、待做）+fair（做）", "s": [{"d": "1. n. 事务（1）", "e": "The report also advocates greater study of foreign languages, international <mark>affairs</mark> and the expansion of study abroad programs.", "z": "报告还主张加强外语和国际<mark>事务</mark>的学习，并扩大海外留学项目。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 社交活动；场合（1）", "e": "The traditional wedding is a long and colorful <mark>affair</mark>.", "z": "传统婚礼是一场漫长而丰富多彩的<mark>活动</mark>。", "r": "2016 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1817, "w": "afford", "f": 2, "m": "", "s": [{"d": "1. v. 承担得起（1）", "e": "Vanity is a constant; people will only start shopping more sustainably when they can&#x27;t <mark>afford</mark> not to.", "z": "虚荣是永恒不变的；只有当人们<mark>承担不起</mark>不这样做的代价时，才会开始以更可持续的方式购物。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. v. 提供（1）", "e": "They <mark>afford</mark> an opportunity for people from all backgrounds to encounter a range of animals, from drone bees to springbok or salmon, to better understand the natural world we live in.", "z": "它们为各种背景的人<mark>提供</mark>了接触不同动物的机会，从雄蜂到跳羚再到鲑鱼，让人们更好地理解我们生活的自然世界。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1818, "w": "afloat", "f": 2, "m": "a-（处于……状态）+float（漂浮）", "s": [{"d": "1. adj. 维持运转、免于倒闭（2）", "e": "We were kept <mark>afloat</mark> by &quot;peak TV&quot;, the glut of content that was required by the explosion of streaming services.", "z": "使我们得以<mark>维持运转</mark>的是“电视巅峰期”：流媒体服务激增所需要的海量内容。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1819, "w": "agenda", "f": 2, "m": "ag（做）+end（结束）+a（全部）", "s": [{"d": "1. n. 目的；行动意图（2）", "e": "First, most people do not realise that there are strong commercial <mark>agendas</mark> at work to keep them in passive consumption mode.", "z": "首先，大多数人没有意识到，强大的商业<mark>目的</mark>正在发挥作用，使他们一直处于被动消费模式。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 1820, "w": "aggravate", "f": 2, "m": "ag-（加强）+grav（重）+-ate（使……）", "s": [{"d": "1. v. 加重；使恶化（2）", "e": "[ A ] <mark>aggravate</mark>", "z": "[A] <mark>加重</mark>", "r": "2011 · 英语一 · 完形填空 · 第 9 题 · 选项 A · 真题选项"}]}, {"id": 1821, "w": "aging", "f": 2, "m": "age（去掉末尾e，变老）+-ing（过程或相应性质）", "s": [{"d": "1. adj. 变老的；老化的（1）", "e": "The conflict has been surfacing since 2002, when the corporation bought Vermont&#x27;s only nuclear power plant, an <mark>aging</mark> reactor in Vernon.", "z": "这一冲突从2002年就开始显现，当时该公司收购了佛蒙特州唯一的核电站，即位于弗农的一座<mark>老化的</mark>反应堆。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 衰老；老化（1）", "e": "But __3__ <mark>aging</mark> is inevitable, scientists are finding out that certain changes in brain function may not be.", "z": "但__3__<mark>衰老</mark>不可避免，科学家正发现，大脑功能的某些变化未必如此。", "r": "2021 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1822, "w": "agricultural", "f": 2, "m": "agricultur（agriculture去e，农业）+-al（与……有关的）", "s": [{"d": "1. adj. 农业的（2）", "e": "They move between a variety of habitats, including forests, grasslands, woodlands, wetlands and <mark>agricultural</mark> land.", "z": "它们在各种栖息地之间迁移，包括森林、草原、林地、湿地和<mark>农业</mark>用地。", "r": "2024 · 英语一 · 阅读理解 C · 第 46、47 题"}]}, {"id": 1823, "w": "airplane", "f": 2, "m": "air（空气）+plane（飞机）", "s": [{"d": "1. n. 飞机（2）", "e": "Think of those fleeting moments when you look out of an <mark>aeroplane</mark> window and realise that you are flying, higher than a bird.", "z": "想想那些转瞬即逝的时刻：你望向<mark>飞机</mark>窗外，意识到自己正在飞行，而且飞得比鸟儿还高。", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1824, "w": "align", "f": 2, "m": "a-（向、使朝向）+lign（线）", "s": [{"d": "1. v. 使一致；相互协调（2）", "e": "On this, students&#x27; ": [{"d": "1. n. 人类学家（2）", "e": "Look at your work environment like an <mark>anthropologist</mark>.", "z": "像<mark>人类学家</mark>一样观察你的工作环境。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1830, "w": "appendix", "f": 2, "m": "ap-（附到）+pend（悬挂）+-ix（名词结尾）", "s": [{"d": "1. n. 附录（2）", "e": "In volume V he had attached an <mark>appendix</mark>, The Scovell Ciphers.", "z": "在第五卷中，他附上了一篇名为《斯科维尔密码》的<mark>附录</mark>。", "r": "2022 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 1831, "w": "appoint", "f": 2, "m": "ap-（向）+point（点；指定）", "s": [{"d": "1. v. 任命；委派（2）", "e": "Working with the American Statistical Association, the journal has <mark>appointed</mark> seven experts to a statistics board of reviewing editors (SBoRE).", "z": "该期刊与美国统计协会合作，已<mark>任命</mark>七名专家加入统计审稿编辑委员会（SBoRE）。", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1832, "w": "approve", "f": 2, "m": "ap-/ad-（使、向）+prove（证明、认可）", "s": [{"d": "1. v. 批准；正式认可（1）", "e": "Curbs on business-method claims would be a dramatic about-face, because it was the Federal Circuit itself that introduced such patents with its 1998 decision in the so-called State Street Bank case, <mark>approving</mark> a patent on a way of pooling mutual-fund assets.", "z": "限制商业方法专利申请将是一次重大转向，因为正是联邦巡回上诉法院在1998年所谓的道富银行案裁决中，<mark>批准</mark>了一项汇集共同基金资产的方法专利，从而引入了此类专利。", "r": "2010 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 赞成；认可（1）", "e": "[ A ] <mark>approved</mark> of.", "z": "［A］<mark>赞成</mark>。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 28 题 · 选项 A · 真题选项"}]}, {"id": 1833, "w": "arbitrary", "f": 2, "m": "arbitr-（裁决、裁决者）+-ary（由此决定或与此有关的）", "s": [{"d": "1. adj. 武断的、任意的（2）", "e": "The premise was that the common law of contract lacked sufficient safeguards for workers against <mark>arbitrary</mark> conduct by management.", "z": "其前提是，普通合同法缺乏充分的保障措施，无法保护工人免受管理层<mark>任意</mark>行为的侵害。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1834, "w": "architecture", "f": 2, "m": "architect（建筑师）+-ure（活动、成果）", "s": [{"d": "1. n. 建筑；建筑设计（2）", "e": " const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
