<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 04 (301-400) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

ark>，欧洲食品和饮料批发市场的增长与零售市场一样缓慢，但合计后的数据掩盖了两种相反的趋势。", "r": "2010 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 337, "w": "pass", "f": 14, "m": "", "s": [{"d": "1. v. 传递；转交（7）", "e": "This forces users to be more conscious of their role in <mark>passing</mark> along information.", "z": "这迫使用户更加清楚地意识到自己在<mark>传递</mark>信息中的作用。", "r": "2018 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. v. 通过（考试、审核等）（5）", "e": "Passengers who <mark>pass</mark> a background check are eligible to use expedited screening lanes.", "z": "<mark>通过</mark>背景核查的乘客有资格使用快速安检通道。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 度过；越过（1）", "e": "Peak TV <mark>passed</mark> its peak as ____", "z": "电视业的巅峰时代已<mark>越过</mark>高峰，因为____。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 28 题 · 真题题干"}, {"d": "4. v. 超过（1）", "e": "In 2009 the number of unionists in America&#x27;s public sector <mark>passed</mark> that of their fellow members in the private sector.", "z": "2009年，美国公共部门工会会员的人数<mark>超过</mark>了私营部门的同行会员。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 338, "w": "photograph", "f": 14, "m": "photo-（光）+graph-（写、画、记录）", "s": [{"d": "1. n. 照片（12）", "e": "Visit any antiques store and you&#x27;ll encounter artifacts from the past: <mark>photographs</mark>, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history.", "z": "走进任何一家古董店，你都会遇见来自过去的物件：<mark>照片</mark>、书信、详细介绍1964至1965年世界博览会辛克莱恐龙展的一本宣传手册，以及历史中那些原本短暂留存的纸质杂物。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 给……拍照（2）", "e": "In recent summers, he has travelled the length and breadth of Britain to <mark>photograph</mark> all 58 native species of butterfly.", "z": "近几个夏天，他走遍英国各地，为全部58种本土蝴蝶<mark>拍照</mark>。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}]}, {"id": 339, "w": "public-sector", "f": 14, "m": "public（公共的）+sector（部门）", "s": [{"d": "1. 短语 公共部门；公营部门（的）（14）", "e": "Its current leader, Ed Miliband, owes his position to votes from <mark>public-sector</mark> unions.", "z": "现任领导人埃德·米利班德能够获得这一职位，要归功于<mark>公共部门</mark>工会的选票。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 340, "w": "resource", "f": 14, "m": "re-（再、重新）+source（来源）", "s": [{"d": "1. n. 资源、可用的财力物力（14）", "e": "But if Congress wanted to prevent states from using their own <mark>resources</mark> to check immigration status, it could.", "z": "不过，如果国会想阻止各州使用自己的<mark>资源</mark>核查移民身份，它是可以这样做的。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 341, "w": "security", "f": 14, "m": "secure（安全的、有保障的）+ity（状态或保障手段的名词后缀）", "s": [{"d": "1. n. 安保；安全检查（8）", "e": "Americans are willing to tolerate time-consuming <mark>security</mark> procedures in return for increased safety.", "z": "美国人愿意忍受耗时的<mark>安检</mark>程序，以换取更高的安全保障。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 安全；保障（6）", "e": "But demanding too much of air travelers or providing too little <mark>security</mark> in return undermines public support for the process.", "z": "但对航空旅客要求过多，或所提供的<mark>安全保障</mark>太少，都会削弱公众对这一程序的支持。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 342, "w": "similar", "f": 14, "m": "simil-（相似）+-ar（具有某种性质的）", "s": [{"d": "1. adj. 相似的（14）", "e": "<mark>Similar</mark> to newly staked mining claims, they are full of potential.", "z": "它们与刚刚圈定并申报矿权的采矿地<mark>相似</mark>，都充满潜力。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 343, "w": "specific", "f": 14, "m": "spec（看、辨明）+i（连接字母）+fic（做、使形成）", "s": [{"d": "1. adj. 具体的、特定的（13）", "e": "In this age of generalists, it pays to have <mark>specific</mark> knowledge or skills.", "z": "在这个通才的时代，拥有<mark>特定</mark>知识或技能是有益的。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 具体细节（1）", "e": "These unilateral developments differ in their <mark>specifics</mark>, but they are all designed to tax multinationals on income and revenue that countries believe they should have a right to tax, even if international tax rules do not grant them that right.", "z": "这些单边举措的<mark>具体细节</mark>各不相同，但目的都是对跨国公司 13 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 348, "w": "war", "f": 14, "m": "", "s": [{"d": "1. n. 战争（8）", "e": "As the <mark>war</mark> unfolded, science rapidly assumed a central role.", "z": "随着<mark>战争</mark>展开，科学迅速承担起核心作用。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "2. n. 斗争；争夺（5）", "e": "The company seems to have concluded that its reputation in Vermont is already so damaged that it has nothing left to lose by going to <mark>war</mark> with the state.", "z": "这家公司似乎已经认定，它在佛蒙特州的声誉已经受损到这种程度，以至于同州政府<mark>开战</mark>也没有什么可失去的了。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 陆军事务（Secretary of War：陆军部长）（1）", "e": "It has housed 16 Secretaries of the Navy, 21 Secretaries of <mark>War</mark>, and 24 Secretaries of State.", "z": "这里曾是16位海军部长、21位<mark>陆军</mark>部长和24位国务卿的办公地点。", "r": "2018 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 349, "w": "address", "f": 13, "m": "ad-（向）+dress（安排；使对准，历史词义）", "s": [{"d": "1. v. 处理；应对（11）", "e": "This practice does not <mark>address</mark> the real worry.", "z": "这种做法没有<mark>解决</mark>真正令人担忧的问题。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 地址（1）", "e": "Until now, many sellers that have a physical presence in only a single state or a few states have been able to avoid charging sales taxes when they ship to <mark>addresses</mark> outside those states.", "z": "迄今为止，许多仅在一个州或少数几个州设有实体经营点的卖家，向这些州以外的<mark>地址</mark>发货时，可以不收取销售税。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. v. 向……讲话；讲授或涉及（1）", "e": "A study last year by the National Center for Science Education, a non-profit group of scientists and teachers, looking at how state public schools across the country <mark>address</mark> climate change in science classes, gave barely half of US states a grade B+ or higher.", "z": "由科学家和教师组成的非营利组织美国国家科学教育中心去年开展了一项研究，考察全国各州公立学校在科学课上如何<mark>讲授</mark>气候变化，结果仅仅有一半的州获得了B+或更高的评级。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 350, "w": "award", "f": 13, "m": "", "s": [{"d": "1. n. 奖  4 · 第 36-40 题"}, {"d": "2. n. 指控；罪名（3）", "e": "As the hacking trial concludes - finding guilty one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same <mark>charge</mark> - the wider issue of dearth of integrity still stands.", "z": "随着窃听案审判结束--《世界新闻报》前任编辑安迪·库尔森被认定犯有共谋窃听电话罪，而他的前任丽贝卡·布鲁克斯则就同一<mark>指控</mark>获判无罪--更广泛的诚信缺失问题依然存在。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. n. 冲锋；率先发起行动（lead thecharge）（1）", "e": "[ B ] France leads the <mark>charge</mark> on Digital Tax", "z": "[B] 法国<mark>率先发起</mark>数字税行动。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 40 题 · 选项 B · 真题选项"}, {"d": "4. n. 收取（费用）；征收（1）", "e": "Amazon.com, with its network of warehouses, also collects sales tax in every state that <mark>charges</mark> it, though third-party sellers who use the site don&#x27;t have to.", "z": "拥有仓库网络的亚马逊网站，也会在每一个<mark>征收</mark>销售税的州代收这项税款，但使用该网站的第三方卖家却不必如此。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题 原表义项待核：本例中为动词“征收”。"}, {"d": "5. n. 负责；掌管（1）", "e": "And if Peretti were in <mark>charge</mark> at the Times?", "z": "那么，如果由佩雷蒂<mark>掌管</mark>《纽约时报》，又会怎样呢？", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "6. v. 委托；赋予任务（be charged with）（1）", "e": "In addition to the entourage of scientists, the team also included artists: Painter Thomas Moran and photographer Jackson were <mark>charged</mark> with capturing this astounding natural beauty and sharing it with the world.", "z": "除了随行的科学家，团队还包括艺术家：画家托马斯·莫兰和摄影师杰克逊<mark>受命</mark>记录这令人惊叹的自然美景，并与全世界分享。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 F · 真题选项"}]}, {"id": 354, "w": "conclude", "f": 13, "m": "con-（一起、完全）+clud（关闭）+e（拼写结尾）", "s": [{"d": "1. v. 得出结论（11）", "e": "According to several studies <mark>concluding</mark> that parents are less happy than childless couples, single parents are the least happy of all.", "z": "几项研究<mark>得出结论</mark>，有孩子的父母不如无子女夫妇幸福，而单亲父母是其中最不幸福的。", "r": "2011 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, { 06, the state went a step <mark>further</mark>, requiring that any extension of the plant&#x27;s license be subject to the Vermont legislature&#x27;s approval.", "z": "2006年，该州<mark>进一步</mark>规定，该电厂许可证的任何延期都必须获得佛蒙特州议会批准。", "r": "2012 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adv. 更远地（1）", "e": "&quot;Each year the physical presence rule becomes <mark>further</mark> removed from economic reality and results in significant revenue losses to the States,&quot; he wrote in an opinion joined by four other justices.", "z": "他在一份得到另外四位大法官支持的意见书中写道：“实体存在规则每年都<mark>进一步</mark>脱离经济现实，并导致各州损失巨额收入。”", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. adv. 此外；而且（1）", "e": "(50) To realize how great was the dramatic activity, we must remember <mark>further</mark> that hosts of plays have been lost, and that probably there is no author of note whose entire work has survived.", "z": "（50）要认识到戏剧活动曾是何等繁盛，我们<mark>还</mark>必须记住，大量剧作已经失传，而且恐怕没有哪位著名作家的全部作品都流传了下来。", "r": "2018 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "4. v. 推进；继续深造（1）", "e": "[ D ] <mark>further</mark> their studies in a specific field.", "z": "[D] 在某个特定领域<mark>继续深造</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 29 题 · 选项 D · 真题选项"}]}, {"id": 365, "w": "garden", "f": 13, "m": "", "s": [{"d": "1. n. 花园, 公园（13）", "e": "Said one recorder of events, &quot;The air at twelve leagues&#x27; distance smelt as sweet as a new-blown <mark>garden</mark>.&quot;", "z": "一位事件记录者说：“十二里格以外的空气闻起来，也像刚刚盛开的<mark>花园</mark>一样芳香。”", "r": "2015 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 366, "w": "literacy", "f": 13, "m": "liter（文字、书写）+-acy（能力、状态）", "s": [{"d": "1. n. 素养；相关知识和能力（10）", "e": "What can promote children&#x27;s emotional <mark>literacy</mark> according to O&#x27;Hanlon?", "z": "根据奥汉隆的说法，什么能够促进儿童的情绪<mark>素养</mark>？", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 24 题"}, {"d": "2. n. 识字能力；读写能力（3）", "e": "Together, they make up the reading component of your overall <mark>literacy</mark>, or relationship to your surrounding textual environment.", "z": "它们共同构成你整体<mark>读写能力</mark>中的阅读部分，也就是你与周围文字环境之间的关系。", "r": "2015 · 英语一 · 阅读理解 B · 第 45 题"}]}, {"id": 367, "w": "particular", "f": 13, "m": "particul-（小部分；个别项）+-ar（形容词后缀）", "s": [{"d": "1. adj. 特定的；特别的（10）", "e": "How we read a given text also depends to some extent on our <mark>particular</mark> interest in reading it.", "z": "我们如何阅读某一特定文本，也在一定程度上取决于我们阅读它时的<mark>具体</mark>兴趣。", "r": "2015 · 英语一 · 阅读理解 B · 第 45 题"}, {"d": "2. adj. 尤其；特别（in particular）（3）", "e": "As a result, scientists - physicists in <mark>particular</mark> - found themselves in high demand.", "z": "因此，科学家，<mark>尤其</mark>是物理学家，发现社会对他们的需求很大。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 368, "w": "popular", "f": 13, "m": "popul（人民、民众）+-ar（与……有关的）", "s": [{"d": "1. adj. 受欢迎的；流行的（11）", "e": "The tool, along with other <mark>popular</mark> image-generation AI models, allows anyone to create impressive images based on text prompts.", "z": "这款工具与其他<mark>流行的</mark>人工智能图像生成模型一样，让任何人都能依据文字提示生成令人印象深刻的图像。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 大众的；普遍的（2）", "e": "By the time that Shakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once <mark>popular</mark> and literary; Kyd had written a tragedy that crowded the pit; and Marlowe had brought poetry and genius to triumph on the common stage - where they had played no part since the death of Euripides.", "z": "莎士比亚二十五岁时，利利、皮尔和格林已创作出既<mark>受大众欢迎</mark>又有文学性的喜剧；基德写出了一部使剧场廉价站席挤满观众的悲剧；马洛则让诗歌与天才在普通舞台上大获成功，而自欧里庇得斯去世以来，它们一直未能在那里发挥作用。", "r": "2018 · 英语一 · 阅读理解 C · 第 48、49 题"}]}, {"id": 369, "w": "possibility", "f": 13, "m": "possible（可能的，末尾le换成il）+-ity（性质、情况的名词后缀）", "s": [{"d": "1. n. 可能性、可能的机会（13）", "e": "Don&#x27;t dismiss that <mark>possibility</mark> entirely.", "z": "不要完全排除这种<mark>可能性</mark>。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 370, "w": "presence", "f": 13, "m": "present（去掉词尾ent，在场的、存在的）+-ence（状态）", "s": [{"d": "1. n. 存在；在场（12）", "e": "(diverted profits tax), Australia&#x27;s MAAL (multinational anti-avoidance law), and India&#x27;s SEP (significant economic <mark>presence</mark>) test, to name but a few.", "z": "（转移利润税）、澳大利亚的《跨国反避税法》（MAAL）以及印度的“显著经济<mark>存在</mark>”（SEP）认定标准等，仅举数例。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 影响力；存在感（1）", "e": "The researchers&#x27; argument stems from a simple observation about social influence: With the exception of a few celebrities like Oprah Winfrey - whose outsize <mark>presence</mark> is primarily a function of media, not interpersonal, influence - even the most influential members of a population simply don&#x27;t interact with that many others.", "z": "研究人员的论点源于对社会影响力的一项简单观察：除了奥普拉·温弗瑞等少数名人，其超乎常人的<mark>存在感</mark>主要取决于媒体影响而非人际影响之外，即使是一个群体中最有影响力的人，也不会与那么多人互动。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 371, "w": "private", "f": 13, "m": "priv（个人、与公共范围分离）+ate（具有这种性质的）", "s": [{"d": "1. adj. 私营的；私立的（8）", "e": "In many rich countries average wages in the state sector are higher than in the <mark>private</mark> one.", "z": "在许多富裕国家，国有部门的平均工资高于<mark>私营</mark>部门。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 私人的（3）", "e": "And it should: Wasted time is a drag on Americans&#x27; economic and <mark>private</mark> lives, not to mention infuriating.", "z": "而它理应如此：浪费时间会拖累美国人的经济生活和<mark>私人</mark>生活，更不用说还会令人恼怒。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. adj. 普通议员的（private member）（1）", "e": "In New Zealand, a 2016 <mark>private</mark> members&#x27; Bill tried to permit firms and high-income employees to contract out of the unjustified dismissal regime.", "z": "在新西兰，2016年一项<mark>普通议员</mark>提出的法案试图允许企业与高收入雇员通过合同约定，排除不当解雇制度的适用。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "4. adj. 私密的；非公开的（1）", "e": "Citizens still have a right to expect private documents to remain <mark>private</mark> and protected by the Constitution&#x27;s prohibition on unreasonable searches.", "z": "公民仍有权期待私人文件保持<mark>私密</mark>，并受到宪法禁止无理搜查条款的保护。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 372, "w": "project", "f": 13, "m": "pro-（向前）+ject（投掷、投射）", "s": [{"d": "1. n. 项目；计划（13）", "e": "The founders deliberately focused their <mark>projects</mark> around light-hence the &quot;visual studies&quot; in the name.", "z": "创始人特意将<mark>项目</mark>的重点放在光上，因此名称中才有“视觉研究”。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 373, "w": "provider", "f": 13, "m": "provid-（provide去e，提供）+-er（做某事的人或机构）", "s": [{"d": "1. n. 提供者；服务机构（13）", "e": "The order also declared that state and local governments couldn&#x27;t regulate broadband <mark>providers</mark> either.", "z": "该命令还宣布，州政府和地方政府也无权监管宽带<mark>服务提供商</mark>。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 374, "w": "publication", "f": 13, "m": "public（公开的）+-ation（行为、结果的名词后缀）", "s": [{"d": "1. n. 出版；发表（7）", "e": "What is important is not truth, but <mark>publication</mark>, which has become almost an end in itself.", "z": "重要的并非真相，而是<mark>发表</mark>，<mark>发表</mark>本身几乎已成为目的。", "r": "2019 · 英语一 · 阅读理解 C · 第 47 题"}, {"d": "2. n. 出版物；刊物（6）", "e": "That&#x27;s one reason why we have launched Arc, a new <mark>publication</mark> dedicated to the near future.", "z": "这也是我们创办《Arc》这一专注于不远未来的新<mark>刊物</mark>的原因之一。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 375, "w": "publishing", "f": 13, "m": "publish（出版）+-ing（活动、行业）", "s": [{"d": "1. n. 出版；出版业（13）", "e": "Scientific <mark>publishing</mark> has long been a licence to print money.", "z": "长期以来，科学<mark>出版</mark>一直是一张可以印钞的许可证。", "r": "2020 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 376, "w": "radio", "f": 13, "m": "", "s": [{"d": "1. n. 广播、无线电（11）", "e": "But <mark>radio&#x27;s</mark> enriching serendipity is ebbing.", "z": "但<mark>广播</mark>带来的那些令人充实的意外发现正逐渐减少。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 收音机（2）", "e": "The variety of plastic objects at risk is dizzying: early <mark>radios</mark>, avant-garde sculptures, celluloid animation stills from Disney films, the first artificial heart.", "z": "面临风险的塑料物品种类多得令人眼花缭乱：早期的<mark>收音机</mark>、先锋派雕塑、迪士尼电影的赛璐珞动画单帧画，以及第一颗人工心脏。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 377, "w": "reach", "f": 13, "m": "", "s": [{"d": "1. v. 触达；与……接触（4）", "e": "&quot;Artists help scientists <mark>reach</mark> a broader audience and make emotional connections that enhance learning,&quot; one respondent said.", "z": "一位受访者说：“艺术家帮助科学家<mark>接触</mark>更广泛的受众，并建立能够促进学习的情感联系。”", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 到达；达到（4）", "e": "This is a reaction to Hollywood&#x27;s decline, which is <mark>reaching</mark> a critical point for the industry and Southern California.", "z": "这是对好莱坞衰退的反应，而这种衰退正<mark>达到</mark>一个对该行业及南加州而言十分危急的阶段。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. n. 影响或能力所及的范围（2）", "e": "The <mark>reach</mark> of art-science tie-ups needs to go beyond the necessary purpose of research communication, and participants must not fall into the trap of stereotyping each other.", "z": "艺术与科学合作的<mark>影响范围</mark>，需要超越传播研究成果这一必要目的，而且参与者不能陷入以刻板印象看待彼此的陷阱。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "4. v. 达成（一致意见）（2）", "e": "In response to these many unilateral measures, the Organization for Economic Cooperation and Development (OECD) is currently working with 131 countries to <mark>reach</mark> a consensus by the end of 2020 on an international solution.", "z": "为应对这些众多的单边措施，经济合作与发展组织（OECD）目前正与131个国家合作，争取在2020年底前就一项国际解决方案<mark>达成</mark>共识。", "r": "2020 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "5. adj. 影响深远的（far-reaching）（1）", "e": "Of all the changes that have taken place in English-language newspapers during the past quarter-century, perhaps the most far-<mark>reaching</mark> has been the inexorable decline in the scope and seriousness of their arts coverage.", "z": "在过去四分之一个世纪里英语报纸发生的所有变化中，<mark>影响最深远</mark>的或许是其艺术报道范围与严肃程度不可阻挡的下降。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 378, "w": "regulation", "f": 13, "m": "regulate（管制、调节，去掉末尾e）+-ion（过程或结果的名词后缀）", "s": [{"d": "1. n. 规章；监管（13）", "e": "Stringent job dismissal <mark>regulations</mark> adversely affect productivity growth and hamper both prosperity and overall well-being.", "z": "严格的解雇<mark>规定</mark>会对生产率增长产生不利影响，并阻碍繁荣和整体福祉的提升。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 379, "w": "responsibility", "f": 13, "m": "responsibil（responsible的词干，负责的）+-ity（性质、状态）", "s": [{"d": "1. n. 责任；职责（13）", "e": "The <mark>responsibility</mark> for the latest wave of strikes rests on the unions.", "z": "最近这一波罢工浪潮的<mark>责任</mark>在于工会。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 380, "w": "retailer", "f": 13, "m": "retail（零售）+-er（从事者、经营者）", "s": [{"d": "1. n. 零售商（13）", "e": "Those <mark>retailers</mark> may face headaches complying with various state sales tax laws.", "z": "那些<mark>零售商</mark>在遵守各州不同的销售税法规时，可能会遇到棘手的麻烦。", "r": "2019 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 381, "w": "select", "f": 13, "m": "se-（分开）+lect（选择）", "s": [{"d": "1. v. 选择；选取（12）", "e": "With multiple networks and countless podcasts, a smartphone user <mark>selects</mark> what to hear and when.", "z": "面对多个广播网和数不清的播客，智能手机用户可以<mark>选择</mark>听什么以及何时听。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. adj. 精选的；特选的（1）", "e": "Marketers have embraced the two-step flow because it suggests that if they can just find and influence the influentials, those <mark>select</mark> people will do most of the work for them.", "z": "营销人员接受了两级传播理论，因为该理论表明，只要找到并影响那些有影响力的人，这些<mark>经过挑选</mark>的人就会替他们完成大部分工作。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 382, "w": "store", "f": 13, "m": "stor（储存、储备）+e（词形结尾）", "s": [{"d": "1. n. 商店（7）", "e": "Hire a personal stylist, or use the free styling service of a <mark>store</mark> like J.Crew.", "z": "请一位私人造型师，或者使用J.Crew这类<mark>商店</mark>提供的免费造型服务。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 储存；保存（4）", "e": "The shallows provide homes for hundreds of species while <mark>storing</mark> floodwaters, filtering pollutants from water, and protecting nearby communities from potentially destructive storm surges.", "z": "浅水区为数百种物种提供栖息地，同时<mark>储存</mark>洪水、过滤水中污染物，并保护附近社区免受可能具有破坏性的风暴潮侵袭。", "r": "2024 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "3. n. 储备物；物资（1）", "e": "Here was the raw material of houses and furniture, ships and potash, dyes and naval <mark>stores</mark>.", "z": "这里有用于建造房屋、制作家具和船舶、生产钾碱与染料，以及制造船舶<mark>物资</mark>的原料。", "r": "2015 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "4. n. 即将发生（instore）（1）", "e": "The Hawthorne experiments had another surprise in <mark>store</mark>.", "z": "霍桑实验<mark>还将带来</mark>另一个意外发现。", "r": "2010 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 383, "w": "stress", "f": 13, "m": "", "s": [{"d": "1. n. 压力（8）", "e": "It is like the immune system of the body, which under <mark>stress</mark> or through lack of nutrition or exercise can be weakened, but which never leaves us.", "z": "它就像人体的免疫系统，在<mark>压力</mark>下或缺乏营养、运动时可能减弱，却从不会离开我们。", "r": "2016 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "2. n. 强调；重视（3）", "e": "This is not to say that there is no point in getting a degree, but rather <mark>stress</mark> that a degree is not for everyone, that the switch from classroom to lecture hall is not an inevitable one and that other options are available.", "z": "这并不是说取得学位毫无意义，而是要<mark>强调</mark>，学位并非适合每个人，从教室走向大学阶梯讲堂并非必然之路，还有其他选择。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题 原表义项待核：本例中为动词“强调”。"}, {"d": "3. v. 强调；重视（2）", "e": "Because representative government presupposes an informed citizenry, the report supports full literacy; <mark>stresses</mark> the study of history and government, particularly American history and American government; and encourages the use of new digital technologies.", "z": "由于代议制政府以知情的公民群体为前提，这份报告支持全民识字，<mark>强调</mark>学习历史和政府制度，尤其是美国历史与美国政府制度，并鼓励使用新的数字技术。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 384, "w": "suffer", "f": 13, "m": "suf-（在下）+fer（承载、承受）", "s": [{"d": "1. v. 遭受；受苦（12）", "e": "Society also <mark>suffers</mark> from excessive employment protections.", "z": "社会也会因过度的就业保护而<mark>受到损害</mark>。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 患（病）（1）", "e": "I came to recognise various signs of a bad paper: the kind of paper that purports to show that people who eat more than one kilo of broccoli a week were 1.17 times more likely than those who eat less to <mark>suffer</mark> late in life from pernicious anaemia.", "z": "我逐渐学会辨认劣质论文的各种迹象：比如某种论文声称，每周吃超过一公斤西兰花的人，晚年<mark>患</mark>恶性贫血的概率是摄入量较少者的1.17倍。", "r": "2019 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 385, "w": "variety", "f": 13, "m": "", "s": [{"d": "1. n. 多样性；各种各样（12）", "e": "They move between a <mark>variety</mark> of habitats, including forests, grasslands, woodlands, wetlands and agricultural land.", "z": "它们在<mark>各种</mark>栖息地之间迁移，包括森林、草原、林地、湿地和农业用地。", "r": "2024 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "2. n. 种类（1）", "e": "Many students experience both <mark>varieties</mark>.", "z": "许多学生都经历过这两<mark>种</mark>情况。", "r": "2011 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 D · 真题选项"}]}, {"id": 386, "w": "writing", "f": 13, "m": "write（写，去e）+-ing（动作或结果的名词后缀）", "s": [{"d": "1. n. 写作（9）", "e": "Yet only one of his books is now in print, and his vast body of <mark>writings</mark> on music is unknown save to specialists.", "z": "然而，如今他的书只有一本仍在出版；除专家以外，几乎无人知晓他那数量庞大的一批音乐<mark>著作</mark>。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 作品；文章（3）", "e": "With its theme that &quot;Mind is the master weaver,&quot; creating our inner character and outer circumstances, the book As a Man Thinketh by James Allen is an in-depth exploration of the central idea of self-help <mark>writing</mark>.", "z": "詹姆斯·艾伦的《思想塑造人生》以“思想是技艺高超的织匠”为主题，认为思想塑造我们的内在品格和外部境遇，深入探讨了自助<mark>作品</mark>的核心理念。", "r": "2011 · 英语一 · 阅读理解 C · 第 46-50 题"}, {"d": "3. n. 不祥预兆（thewriting is on thewall）（1）", "e": "Does that mean the <mark>writing</mark> is on the wall for all European royals, with their magnificent uniforms and majestic lifestyles?", "z": "这是否意味着，对所有身穿华丽制服、过着尊贵生活的欧洲王室成员而言，<mark>厄运将至的征兆已经出现</mark>？" const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
