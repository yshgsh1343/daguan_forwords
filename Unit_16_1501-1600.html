<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 16 (1501-1600) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>
</head>

题"}, {"d": "2. n. 辩护；维护（1）", "e": "The only major objection came from Justice Antonin Scalia, who offered an even more robust <mark>defense</mark> of state privileges going back to the Alien and Sedition Acts.", "z": "唯一主要的反对意见来自安东宁·斯卡利亚大法官，他援引可追溯至《外国人法和煽动叛乱法》的依据，为各州特权提出了更强有力的<mark>辩护</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1510, "w": "delivery", "f": 3, "m": "deliver（递送、交付、帮助出生）+-y（过程或结果的名词结尾）", "s": [{"d": "1. n. 递送、投递（2）", "e": "Also missing is any discussion of eliminating Saturday letter <mark>delivery</mark>.", "z": "同样缺失的，还有关于取消周六信件<mark>投递</mark>的任何讨论。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. n. 传递、投放（信息）（1）", "e": "(50) The non-intrusive <mark>delivery</mark> of the marketing messages in a way that is sensitive to the needs of target customers is one of the critical challenges to the digital marketer.", "z": "（50）以顾及目标客户需求的方式，在不打扰他们的情况下<mark>传递</mark>营销信息，是数字营销人员面临的关键挑战之一。", "r": "2023 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 1511, "w": "democratic", "f": 3, "m": "demo（人民）+crat（治理，承接-cracy）+ic（有关的）", "s": [{"d": "1. adj. 民主的；民主制度的（2）", "e": "If connections can be bought, a basic premise of <mark>democratic</mark> society - that all are equal in treatment by government - is undermined.", "z": "如果人脉可以购买，<mark>民主</mark>社会的一项基本前提--政府平等对待所有人--就会遭到破坏。", "r": "2017 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 美国民主党的（1）", "e": "The Republican-penned order not only eliminated the strict net neutrality rules the FCC had adopted when it had a <mark>Democratic</mark> majority in 2015, but rejected the commission&#x27;s authority to require broadband providers to do much of anything.", "z": "这项由共和党人起草的命令，不仅废除了联邦通信委员会在2015年<mark>民主党</mark>占多数时通过的严格网络中立规则，还否认了该委员会有权要求宽带供应商采取几乎任何行动。", "r": "2021 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1512, "w": "dense", "f": 3, "m": "dens（浓密、稠密）+e（词形结尾）", "s": [{"d": "1. adj. 密集的、浓密的（3）", "e": "The colonists&#x27; first glimpse of the new land was a sight of <mark>dense</mark> woods.", "z": "殖民者初瞥这片新大陆时，看到的是<mark>茂密</mark>树林的景象。", "r": "2015 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1513, "w": "deprive", "f": 3, "m": "de-（去掉、使离开）+priv（个人拥有的范围）+e（拼写结尾）", "s": [{"d": "1. v. 剥夺（3）", "e": "When we are <mark>deprived</mark> of green, of plants, of trees, (49) most of us give in to a demoralization of spirit which we usually blame on some psychological conditions, until one day we find ourselves in a garden and feel the oppression vanish as if by magic.", "z": "当我们被<mark>剥夺</mark>了绿色、植物和树木时，（49）我们大多数人都会陷入情绪低落，通常把它归咎于某种心理疾病，直到有一天我们置身花园，才感到压抑仿佛被魔法驱散般消失了。", "r": "2013 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 1514, "w": "derive", "f": 3, "m": "de（从原处引出）+rive（河流）", "s": [{"d": "1. v. 源于；来自（2）", "e": "The supposed importance of influentials <mark>derives</mark> from a plausible-sounding but largely untested theory called the &quot;two-step flow of communication&quot;: Information flows from the media to the influentials and from them to everyone else.", "z": "人们所认定的有影响力者的重要性，<mark>源于</mark>一个听起来合理却基本未经检验的理论，即“传播的两级流动”：信息从媒体流向有影响力者，再从他们流向其他所有人。", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 获得；获取（1）", "e": "It&#x27;s important to note that while AI can enhance our __19__ of beauty, it should not __20__ the genuine human experience and the emotional connections we <mark>derive</mark> from seeing the beauty in each other.", "z": "需要注意的是，尽管人工智能可以增强我们对美的__19__，它却不应__20__真实的人类体验，以及我们从欣赏彼此的美中<mark>获得</mark>的情感联系。", "r": "2026 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1515, "w": "description", "f": 3, "m": "de-（向下、写下）+script-（写）+-ion（行为、结果）", "s": [{"d": "1. n. 描述；描写；叙述（3）", "e": "As a <mark>description</mark> of the next music director of an orchestra that has hitherto been led by musicians like Gustav Mahler and Pierre Boulez, that seems likely to have struck at least some Times readers as faint praise.", "z": "对于一支迄今曾由古斯塔夫·马勒和皮埃尔·布列兹等音乐家执掌的乐团来说，这样<mark>描述</mark>其下一任音乐总监，似乎至少会让部分《泰晤士报》读者觉得这只是轻描淡写的赞美。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1516, "w": "desert", "f": 3, "m": "de-（离开）+sert（连接）", "s": [{"d": "1. adj. 荒无人烟的（desert island：荒岛）（2）", "e": "The Time to Act study also found that while control pupils relied on &quot;<mark>desert</mark> island clichés&quot; such as palm trees, target pupils were &quot;more expansive [giving] a broader picture of the sky, the sea and the atmospheric conditions&quot;.", "z": "“行动的时刻”研究还发现，对照组学生依赖棕榈树等“<mark>荒岛</mark>陈词滥调”，而目标组学生的描述“更为详尽，对天空、海洋及大气状况作出了更广泛的描绘”。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 沙漠（1）", "e": "&quot;Donkeys are champions when it comes to carrying stuff and are good at crossing <mark>deserts</mark>,&quot; co-author Ludovic Orlando, an evolutionary biologist at Paul Sabatier University in France, tells the publication.", "z": "“驴是驮运物品的能手，也擅长穿越<mark>沙漠</mark>，”合著者、法国保罗·萨巴蒂耶大学的进化生物学家吕多维克·奥兰多对该刊物说。", "r": "2026 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1517, "w": "designer", "f": 3, "m": "design（设计）+er（从事者）", "s": [{"d": "1. n. 设计师（3）", "e": "The victims of this revolution, of course, are not limited to <mark>designers</mark>.", "z": "当然，这场变革的受害者并不限于<mark>设计师</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1518, "w": "devoted", "f": 3, "m": "devote（献身；去e）+-ed（形容词后缀）", "s": [{"d": "1. adj. 忠实的；热衷的（1）", "e": "<mark>Devoted</mark> concertgoers who reply that recordings are no substitute for live performance are missing the point.", "z": "那些<mark>忠实的</mark>音乐会听众回答说，录音无法充当现场演奏的替代品，但他们没有抓住要点。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 忠诚的（1）", "e": "The author believes that the <mark>devoted</mark> concertgoers____", "z": "作者认为，那些<mark>忠实</mark>的音乐会听众____。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 23 题 · 真题题干"}, {"d": "3. adj. 致力于；专心于（1）", "e": "Yet researchers can take some comfort in the fact that there are a multitude of librarians <mark>devoted</mark> to discovering, organizing, and preserving digital information for researchers current and future.", "z": "不过，研究人员可以从这样一个事实中得到些许安慰：有众多图 . v. 预测，预报（未来的事情或趋势）（2）", "e": "[ A ] <mark>forecast</mark>", "z": "［A］<mark>预测</mark>。", "r": "2015 · 英语一 · 完形填空 · 第 16 题 · 选项 A · 真题选项"}, {"d": "2. n. 预测；预报（1）", "e": "As so often, the past holds the key to the future: we have now identified enough of the long-term patterns shaping the history of the planet, and our species, to make evidence-based <mark>forecasts</mark> about the situations in which our descendants will find themselves.", "z": "正如常常发生的那样，过去掌握着未来的钥匙：如今，我们已经识别出足够多塑造地球及人类历史的长期模式，能够对后代将面临的处境作出有证据支持的<mark>预测</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1561, "w": "formidable", "f": 3, "m": "formid-（畏惧）+-able（足以引起这种感受的）", "s": [{"d": "1. adj. 令人敬畏的（1）", "e": "Even Tommasini, who had advocated Gilbert&#x27;s appointment in the Times, calls him &quot;an unpretentious musician with no air of the <mark>formidable</mark> conductor about him.&quot;", "z": "即便曾在《纽约时报》倡议任命吉尔伯特的托马西尼，也称他是“一位谦逊的音乐家，身上没有那种<mark>令人敬畏</mark>的指挥家架子”。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 令人望而生畏的（1）", "e": "[ B ] the language of Shakespeare may be <mark>formidable</mark> for pupils", "z": "[B] 莎士比亚的语言可能让学生<mark>望而生畏</mark>", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 B · 真题选项"}, {"d": "3. adj. 强有力的（1）", "e": "(49) It wasn&#x27;t until the phrase &quot;scientific literacy&quot; came along in the 1940s that science had the <mark>formidable</mark> slogan it needed to command public attention and make improving science education an important national goal.", "z": "（49）直到20世纪40年代“科学素养”一词出现，科学才拥有了所需的<mark>强有力</mark>口号，足以吸引公众关注，并让改善科学教育成为一项重要的国家目标。", "r": "2026 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 1562, "w": "foster", "f": 3, "m": "", "s": [{"d": "1. v. 培养；促进（3）", "e": "Vocational schools should do a better job of <mark>fostering</mark> problem-solving skills and helping students work alongside robots.", "z": "职业学校应当更好地<mark>培养</mark>解决问题的能力，并帮助学生与机器人协同工作。", "r": "2018 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1563, "w": "found", "f": 3, 它是形而上的；但其表达手段却纯粹且仅仅是物质性的：声音。", "r": "2014 · 英语一 · 阅读理解 C · 第 46 题"}, {"d": "2. adv. 从现在起……以后（1）", "e": "For example, the Long Now Foundation has as its flagship project a mechanical clock that is designed to still be marking time thousands of years <mark>hence</mark>.", "z": "例如，长远基金会的旗舰项目是一座机械钟，其设计目标是在<mark>从现在起数千年后</mark>仍能记录时间。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1577, "w": "high-income", "f": 3, "m": "high（高）+income（收入）", "s": [{"d": "1. adj. 高收入的（3）", "e": "In New Zealand, a 2016 private members&#x27; Bill tried to permit firms and <mark>high-income</mark> employees to contract out of the unjustified dismissal regime.", "z": "在新西兰，2016年一项普通议员提出的法案试图允许企业与<mark>高收入</mark>雇员通过合同约定，排除不当解雇制度的适用。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1578, "w": "horizon", "f": 3, "m": "", "s": [{"d": "1. n. 地平线（2）", "e": "The same curiosity to find what lies beyond the <mark>horizon</mark> that first brought early Polynesians to Hawaii&#x27;s shores inspires astronomers today to explore the heavens.", "z": "当初驱使早期波利尼西亚人抵达夏威夷海岸的，是想知道<mark>地平线</mark>之外有何物的好奇心；如今，同样的好奇心激励着天文学家探索天空。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 视野（1）", "e": "[ B ] The Lost <mark>Horizon</mark> in Newspapers", "z": "[B] 报纸中失落的<mark>视野</mark>", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 B · 真题选项"}]}, {"id": 1579, "w": "imagination", "f": 3, "m": "imagin-（imagine去e，想象）+-ation（名词后缀）", "s": [{"d": "1. n. 想象；想象力（3）", "e": "[ D ] lack of <mark>imagination</mark>.", "z": "[D] 缺乏<mark>想象力</mark>。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21 题 · 选项 D · 真题选项"}]}, {"id": 1580, "w": "imitation", "f": 3, "m": "imit（模仿、仿效）+-ation（行为或结果的名词后缀）", "s": [{"d": "1. n. 模仿（3）", "e": "While hunter-gatherer children learnt from observation and <mark>imitation</mark> in mixed-age playgroups, researchers said that western &quot;instructive teaching&quot;, where pupils are asked to sit still, may contribute to conditions such as attention deficit hyperactivity disorder.", "z": "狩猎采集社会的孩子通过混龄游戏群体中的观察和<mark>模仿</mark>来学习；研究人员说，相比之下，西方要求学生安坐不动的“指导式教学”，可能促成注意缺陷多动障碍等病症。", "r": "2024 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1581, "w": "implement", "f": 3, "m": "im-（加强、完全）+ple-（填满、补足）+-ment（相关事物）", "s": [{"d": "1. v. 实施；执行（3）", "e": "Sensible ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to <mark>implement</mark> them.", "z": "合理的想法早已存在，但管理这一行业的州级机构过于保守，一直没有<mark>实施</mark>这些想法。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1582, "w": "implicit", "f": 3, "m": "im-（向内）+plicit（折叠）", "s": [{"d": "1. adj. 隐含的；未明说的（3）", "e": "(50) It is this <mark>implicit</mark> or explicit reference to nature that fully justifies the use of the word garden, though in a &quot;liberated&quot; sense, to describe these synthetic constructions.", "z": "（50）正是这种对自然<mark>含蓄</mark>或明确的借鉴，充分证明了用“花园”一词描述这些人工构造物的合理性，尽管这里使用的是一种“解放了”的词义。", "r": "2013 · 英语一 · 阅读理解 C · 第 49、50 题"}]}, {"id": 1583, "w": "imply", "f": 3, "m": "im-（向内）+ply（折入、折叠）", "s": [{"d": "1. v. 暗示；意味着（3）", "e": "But they are the exception, not the norm that Ms. Marris <mark>implies</mark>.", "z": "但它们是例外，并非马里斯女士所<mark>暗示</mark>的常态。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1584, "w": "impression", "f": 3, "m": "impress（盖印、留下印象）+-ion（名词后缀）", "s": [{"d": "1. n. 印象（2）", "e": "This is especially true in first <mark>impressions</mark>.", "z": "在第一<mark>印象</mark>方面，尤其如此。", "r": "2016 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. n. 语境不足：印象（干扰选项，与句子搭配不通）（1）", "e": "[ C ] <mark>impression</mark>", "z": "[C] <mark>印象</mark>", "r": "2023 · 英语一 · 完形填空 · 第 6 题 · 选项 C · 真题选项"}]}, {"id": 1585, "w": "impressive", "f": 3, "m": "impress（留下印象）+-ive（能产生这种作用的）", "s": [{"d": "1. adj. 令人印象深刻的（3）", "e": "The tool, along with other popular image-generation AI models, allows anyone to create <mark>impressive</mark> images based on text prompts.", "z": "这款工具与其他流行的人工智能图像生成模型一样，让任何人都能依据文字提示生成<mark>令人印象深刻的</mark>图像。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1586, "w": "independence", "f": 3, "m": "in-（不）+dependence（依赖状态）", "s": [{"d": "1. n. 独立；自主（3）", "e": "The details may be unknowable, but the <mark>independence</mark> of standard-setters, essential to the proper functioning of capital markets, is being compromised.", "z": "细节也许无从得知，但标准制定者的<mark>独立性</mark>正在受到损害，而这种<mark>独立性</mark>对资本市场的正常运作至关重要。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1587, "w": "index", "f": 3, "m": "", "s": [{"d": "1. n. 指数；指标（3）", "e": "Under the law, using a fashion model that does not meet a government-defined <mark>index</mark> of body mass could result in a $85,000 fine and six months in prison.", "z": "根据这项法律，聘用未达到政府制定的身体质量<mark>指数</mark>标准的时装模特，可能面临8.5万美元罚款和六个月监禁。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1588, "w": "inevitably", "f": 3, "m": "inevitab（inevitable去le，不可避免的）+-ly（副词后缀）", "s": [{"d": "1. adv. 不可避免地（3）", "e": "Such background material <mark>inevitably</mark> reflects who we are.", "z": "这类背景资料<mark>不可避免地</mark>反映出我们是什么样的人。", "r": "2015 · 英语一 · 阅读理解 B · 第 44 题"}]}, {"id": 1589, "w": "inference", "f": 3, "m": "infer（推论、推断）+ence（名词后缀）", "s": [{"d": "1. n. 推断（3）", "e": "But they show comprehension to consist not just of passive assimilation but of active engagement in <mark>inference</mark> and problem-solving.", "z": "但它们表明，理解不仅由被动吸收构成，也包括主动参与<mark>推断</mark>和解决问题。", "r": "2015 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 1590, "w": "inform", "f": 3, "m": "in-（向内、在里面）+form（形成、赋予形式）", "s": [{"d": "1. v. 通知；告知（2）", "e": "The Students Union of your university has assigned you to <mark>inform</mark> the international students about an upcoming singing contest.", "z": "你所在大学的学生会指派你向留学生<mark>通知</mark>一场即将举行的歌唱比赛。", "r": "2020 · 英语一 · 写作 A · 第 51 题"}, {"d": "2. v. 启发；为…提供信息（1）", "e": "Ideally, different kinds of reading <mark>inform</mark> each other, and act as useful reference points for and counterbalances to one another.", "z": "理想情况下，不同类型的阅读应相互<mark>启发</mark>，并成为彼此有益的参考点和  of <mark>intelligent</mark> machines reflects humanity&#x27;s highest values?", "z": "换句话说：我们如何确保<mark>智能</mark>机器的思维体现人类最崇高的价值观？", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1598, "w": "intense", "f": 3, "m": "in-（朝向、加强）+tens（拉伸、绷紧）+e（词形结尾）", "s": [{"d": "1. adj. 强烈的、集中的（3）", "e": "Although good TV shows can help stir children&#x27;s interest in conservation, they cannot replace the excitement of a zoo visit as an <mark>intense</mark>, immersive and interactive experience.", "z": "虽然优秀的电视节目有助于激发儿童对自然保护的兴趣，但它们无法取代参观动物园带来的兴奋感，因为那是一种<mark>强烈</mark>、身临其境且具有互动性的体验。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1599, "w": "intention", "f": 3, "m": "in-（向着）+tent-（伸展）+-ion（行为、状态）", "s": [{"d": "1. n. 意图；打算（3）", "e": "Time, rather than <mark>intention</mark>, has given them legitimacy.", "z": "赋予它们合法性的是时间，而非<mark>意图</mark>。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1600, "w": "interact", "f": 3, "m": "inter-（在彼此之间、相互）+act（行动、起作用）", "s": [{"d": "1. v. 交流、互动（2）", "e": "(48) Algorithms used to simulate human interactions are creating many of these concerns, especially as no-one is quite sure what the outcomes of using AI to <mark>interact</mark> with customers will be.", "z": "（48）用于模拟人类互动的算法正在引发其中许多担忧，尤其是因为没有人十分确定，使用人工智能与顾客<mark>互动</mark>究竟会带来什么结果。", "r": "2023 · 英语一 · 阅读理解 C · 第 47、48 题"}, {"d": "2. v. 互动；相互作用（1）", "e": "Beginning in 2006, some scientists have __7__ that plants possess neuron-like cells that <mark>interact</mark> with hormones and neurotransmitters, __8__ &quot;a plant nervous system, __9__ to that in animals,&quot; said lead study author Lincoln Taiz.", "z": "该研究的首席作者林肯·泰兹说，从2006年开始，一些科学家就__7__，植物具有与神经元类似的细胞，它们与激素和神经递质<mark>相互作用</mark>，__8__“一个与动物的神经系统__9__的植物神经系统”。", "r": "2022 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
