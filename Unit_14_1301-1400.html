<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 14 (1301-1400) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>

ark>paintings</mark>, sculpture and architecture - and superfluous experiences - music, literature, religion and philosophy.", "z": "人类的独特之处在于，他们不仅能够制造工具，还能转而使用工具创造非必需的物质产品--<mark>绘画</mark>、雕塑和建筑，以及非必需的体验--音乐、文学、宗教和哲学。", "r": "2012 · 英语一 · 阅读理解 B · 第 43 题"}]}, {"id": 1320, "w": "participant", "f": 4, "m": "particip（参与；partake的同源词干）+-ant（参与者）", "s": [{"d": "1. n. 参与者，参加者（4）", "e": "The reach of art-science tie-ups needs to go beyond the necessary purpose of research communication, and <mark>participants</mark> must not fall into the trap of stereotyping each other.", "z": "艺术与科学合作的影响范围，需要超越传播研究成果这一必要目的，而且<mark>参与者</mark>不能陷入以刻板印象看待彼此的陷阱。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1321, "w": "partnership", "f": 4, "m": "partner（伙伴、合伙人）+-ship（身份或关系）", "s": [{"d": "1. n. 合作关系；伙伴关系（4）", "e": "But a genuine <mark>partnership</mark> must be a two-way street.", "z": "但真正的<mark>伙伴关系</mark>必须是双向往来的。", "r": "2022 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1322, "w": "passive", "f": 4, "m": "pass-（承受）+-ive（具有这种状态或性质的）", "s": [{"d": "1. adj. 被动的；消极的（4）", "e": "First, most people do not realise that there are strong commercial agendas at work to keep them in <mark>passive</mark> consumption mode.", "z": "首先，大多数人没有意识到，强大的商业目的正在发挥作用，使他们一直处于<mark>被动</mark>消费模式。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 1323, "w": "path", "f": 4, "m": "", "s": [{"d": "1. n. 途径；发展道路（3）", "e": "Progressives often support diversity mandates as a <mark>path</mark> to equality and a way to level the playing field.", "z": "进步主义者经常支持强制推行多元化的规定，将其视为实现平等的<mark>途径</mark>和使竞争环境公平的办法。", "r": "2020 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 道路（1）", "e": "__13__ , even in dense forest, you should be able to __14__ gaps in the tree line due to roads, train tracks, and other <mark>paths</mark> people carve __15__ the woods.", "z": "____，即使在茂密的森林里，你也应该能____林木带中因道路、铁轨以及人们____林间开辟的其他<mark>路径</mark>而形成的空隙。", "r": "2019 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1324, "w": "payment", "f": 第 36-40 题"}]}, {"id": 1357, "w": "render", "f": 4, "m": "", "s": [{"d": "1. v. 使成为；使处于某状态（4）", "e": "(50) One could interpret much of the work of Beethoven by saying that suffering is inevitable, but the courage to fight it <mark>renders</mark> life worth living.", "z": "（50）贝多芬的许多作品可以这样理解：苦难不可避免，但与之抗争的勇气<mark>使</mark>人生值得一活。", "r": "2014 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1358, "w": "request", "f": 4, "m": "re-（再次、加强）+quest（寻求、询问）", "s": [{"d": "1. n. 请求；要求（4）", "e": "After all, it has an ad business too, which it says will comply with DNT <mark>requests</mark>, though it is still working out how.", "z": "毕竟，它也有广告业务，并表示会遵守“请勿追踪”<mark>请求</mark>，尽管它仍在研究具体如何做到。", "r": "2013 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1359, "w": "respectable", "f": 4, "m": "respect（尊敬）+-able（值得、能够被……的）", "s": [{"d": "1. adj. 体面的；受人尊敬的（4）", "e": "[ C ] <mark>respectable</mark>.", "z": "[C] <mark>受人尊敬</mark>的。", "r": "2011 · 英语一 · 阅读理解 A Text 1 · 第 22 题 · 选项 C · 真题选项"}]}, {"id": 1360, "w": "retain", "f": 4, "m": "re-（往回、留住）+tain（持有、保持）", "s": [{"d": "1. v. 保留；保持（4）", "e": "Half a century of town and country planning has enabled it to <mark>retain</mark> an enviable rural coherence, while still permitting low-density urban living.", "z": "半个世纪的城乡规划使它<mark>保留</mark>了令人羡慕的乡村整体风貌，同时仍允许低密度的城市生活。", "r": "2016 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1361, "w": "revolve", "f": 4, "m": "re-（回、反复）+volv（转动）+e（词形结尾）", "s": [{"d": "1. v. 围绕；以……为中心（3）", "e": "My definition <mark>revolves</mark> around the concept of &quot;stickiness&quot; -creations and experiences to which others adhere.", "z": "我的定义<mark>围绕</mark>“黏性”这一概念展开，即能让他人持续依附的作品和体验。", "r": "2012 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. v. 公转（1）", "e": "Copernicus theorized in 1543 that all of the planets that we knew of <mark>revolved</mark> not around the Earth, but the Sun, a system that was later upheld by Galileo at his own expense.", "z": "哥白尼于1543年提出理论，认为当时所有已知行星都不是围绕地球，而是围绕太阳<mark>公转</mark>；后来伽利略支持这一体系，并为此付出了个人代价。", "r": "2020 >screen</mark> talent and local businesses that support the entertainment industry.", "z": "如果我们无法提供储备充足的本地电影从业者、<mark>荧幕</mark>表演人才以及支持娱乐业的本地企业这一后备队伍，说服制片厂来此拍摄就会困难得多。", "r": "2026 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "3. v. 审查（1）", "e": "[ A ] Science Joins Push to <mark>Screen</mark> Statistics in Papers", "z": "［A］《科学》加入推动<mark>审查</mark>论文统计数据的行动。", "r": "2015 · 英语一 · 阅读理解 A Text 3 · 第 35 题 · 选项 A · 真题选项"}]}, {"id": 1365, "w": "scrutiny", "f": 4, "m": "scrutin（仔细翻查）+-y（这种行为）", "s": [{"d": "1. n. 审查、仔细检查（4）", "e": "But it takes collective <mark>scrutiny</mark> and acceptance to transform a discovery claim into a mature discovery.", "z": "但只有经过集体<mark>审查</mark>和认可，才能将一项发现的宣称转化为成熟的发现。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1366, "w": "sea", "f": 4, "m": "", "s": [{"d": "1. n. 海（3）", "e": "The Time to Act study also found that while control pupils relied on &quot;desert island clichés&quot; such as palm trees, target pupils were &quot;more expansive [giving] a broader picture of the sky, the <mark>sea</mark> and the atmospheric conditions&quot;.", "z": "“行动的时刻”研究还发现，对照组学生依赖棕榈树等“荒岛陈词滥调”，而目标组学生的描述“更为详尽，对天空、<mark>海洋</mark>及大气状况作出了更广泛的描绘”。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 海石竹（sea-pinks 植物名的组成部分）（1）", "e": "His pictures of a Glanville fritillary rising from the <mark>sea</mark>-pinks beside the chalk cliffs of Compton Bay on the Isle of Wight are particularly glorious.", "z": "他拍摄的照片格外绚丽：在怀特岛康普顿湾的白垩悬崖旁，一只格兰维尔豹蛱蝶从<mark>海石竹</mark>丛中飞起。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 A · 真题选项"}]}, {"id": 1367, "w": "segment", "f": 4, "m": "seg-（切）+ment（切分的结果）", "s": [{"d": "1. n. 部分；细分群体（4）", "e": "In so doing they give composure to a <mark>segment</mark> of the inarticulate environment in which they take their stand.", "z": "通过这样做，他们使自己所处的无言环境中的<mark>一部分</mark>获得了秩序与安定。", "r": "2013 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 1368, "w": "sensible", "f": 4, "m": "sens（感觉、判断）+-ible（能够……或能够被……的）", "s": [{"d": "1. adj. 明智的；合理的（4）", "e": "<mark>Sensible</mark> ideas have been around for a long time, but the state-level bodies that govern the profession have been too conservative to implement them.", "z": "<mark>合理</mark>的想法早已存在，但管理这一行业的州级机构过于保守，一直没有实施这些想法。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1369, "w": "sequence", "f": 4, "m": "sequ（跟随）+-ence（状态、结果的名词后缀）", "s": [{"d": "1. n. 一系列；顺序（2）", "e": "[ D ] <mark>sequence</mark>", "z": "[D] <mark>顺序</mark>。", "r": "2014 · 英语一 · 完形填空 · 第 9 题 · 选项 D · 真题选项"}, {"d": "2. n. （DNA）序列（2）", "e": "Looking at these DNA <mark>sequences</mark>, we get a biological testimony to the environment these animals lived in and the experiences they survived.&quot;", "z": "观察这些DNA<mark>序列</mark>，我们便能获得生物学证据，了解这些动物生活的环境和它们曾经挺过的经历。”", "r": "2026 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1370, "w": "servant", "f": 4, "m": "serv（服务、侍奉）+-ant（做这项工作的人）", "s": [{"d": "1. n. 仆人（2）", "e": "Only then will they be useful <mark>servants</mark> and not Frankenstein&#x27;s out-of-control monster.", "z": "只有到那时，它们才会成为有用的<mark>仆人</mark>，而不是弗兰肯斯坦创造的失控怪物。", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 公务员（civilservant）（2）", "e": "If the trade unionist Jimmy Hoffa were alive today, he would probably represent civil <mark>servants</mark>.", "z": "如果工会人士吉米·霍法今天仍然健在，他很可能会代表<mark>公务员</mark>的利益。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1371, "w": "settlement", "f": 4, "m": "settle（安顿、定居、解决）+-ment（行为、结果或相关地点的名词后缀）", "s": [{"d": "1. n. 聚落、定居点（4）", "e": "Located in the southern Peloponnesian peninsula, Pavlopetri (the modern name of the site) emerged as a Neolithic <mark>settlement</mark> around 3500 B.C. and became an important trading center for Mycenaean Greece (1650-1180 B.C.).", "z": "帕夫洛彼特里（该遗址的现代名称）位于伯罗奔尼撒半岛南部，约于公元前3500年作为一处新石器时代<mark>聚落</mark>出现，后来成为迈锡尼时代希腊（公元前1650-前1180年）的重要贸易中心。", "r": "2025 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1372, "w": "shareholder", "f": 4, "m": "share（股份）+hold（持有）+-er（人）", "s": [{"d": "1. n. 股东（4）", "e": "As boards scrutinize succession plans in response to <mark>shareholder</mark> pressure, executives who don&#x27;t get the nod also may wish to move on.", "z": "董事会因应<mark>股东</mark>压力而严格审查继任计划时，未获认可的高管也可能希望另谋出路。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1373, "w": "significance", "f": 4, "m": "signific-（表示；意味）+-ance（性质、状态）", "s": [{"d": "1. n. 重要性；意义（4）", "e": "Second, the majority of people who use networked computers to upload are not even aware of the <mark>significance</mark> of what they are doing.", "z": "其次，大多数使用联网计算机上传内容的人，甚至没有意识到自己所做之事的<mark>重要性</mark>。", "r": "2012 · 英语一 · 阅读理解 B · 第 42 题"}]}, {"id": 1374, "w": "sir", "f": 4, "m": "", "s": [{"d": "1. n. 爵士（尊称）（4）", "e": "What can be learnt about wireless from <mark>Sir</mark> John Reith?", "z": "从约翰·里思<mark>爵士</mark>那里，我们可以了解关于无线电广播的什么情况？", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31 题"}]}, {"id": 1375, "w": "speech", "f": 4, "m": "", "s": [{"d": "1. n. 演讲（2）", "e": "Write an e-mail of about 100 words to a foreign teacher in your college, inviting him/her to be a judge for the upcoming English <mark>speech</mark> contest.", "z": "给你校的一位外教写一封约100词的电子邮件，邀请他或她担任即将举行的英语<mark>演讲</mark>比赛的评委。", "r": "2013 · 英语一 · 写作 A · 第 51 题"}, {"d": "2. n. 言语（2）", "e": "True: for more than 80 pre-digital years, linear <mark>speech</mark> broadcasting brought the gift of serendipity, random enlivening of a car journey or dull manual task.", "z": "确实，在数字时代之前的八十多年里，按固定顺序播放的<mark>语言</mark>广播带来了意外发现的乐趣，不时为汽车旅途或枯燥的体力劳动增添生气。", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1376, "w": "split", "f": 4, "m": "", "s": [{"d": "1. v. 分开；分裂（2）", "e": "They were <mark>split</mark> into target and control groups and asked to write, for example, a message in a bottle as Ferdinand after the shipwreck in *The Tempest*.", "z": "他们被<mark>分成</mark>实验组和对照组，并被要求写作，例如以《暴风雨》中海难后的费迪南德的身份写一封漂流瓶信。", "r": "2025 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 极短的（split-second）（1）", "e": "Human drivers sometimes must make <mark>split</mark>-second decisions.", "z": "人类驾驶员有时必须在<mark>转瞬之间</mark>作出决定。", "r": "2019 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "3. v. 裂开（1）", "e": "It&#x27;s especially vulnerable to light damage, and by the mid-1990s, Gilardi&#x27;s pumpkins, roses, and other figures were <mark>splitting</mark> and crumbling.", "z": "它尤其容易受到光照损伤；到20世纪90年代中期，吉拉尔迪创作的南瓜、玫瑰及其他造型已开始<mark>开裂</mark>和碎裂。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1377, "w": "sport", "f": 4, "m": "", "s": [{"d": "1. n. 体育运动（2）", "e": "Write a notice to recruit a student for Prof. Smith’s research project on campus <mark>sports</mark> activities.", "z": "写一则通知，为史密斯教授关于校园<mark>体育</mark>活动的研究项目招募一名学生。", "r": "2023 · 英语一 · 写作 A · 第 51 题"}, {"d": "2. n. 跑车的（sports car）（2）", "e": "Roman lamps and Roman chariots are very different from LED strips and <mark>sports</mark> cars, but Roman nails are still clearly nails.", "z": "罗马时代的灯具和战车与LED灯带和<mark>跑车</mark>截然不同，但罗马时代的钉子仍然明显是钉子。", "r": "2024 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1378, "w": "stage", "f": 4, "m": "", "s": [{"d": "1. n. 舞台（2）", "e": "For a time literature showed no interest in this public <mark>stage</mark>.", "z": "有一段时间，文学对这个公共<mark>舞台</mark>毫无兴趣。", "r": "2018 · 英语一 · 阅读理解 C · 第 48、49 题"}, {"d": "2. n. 阶段（2）", "e": "As the latest crop of students pen their undergraduate application form and weigh up their options, it may be worth considering just how the point, purpose and value of a degree has changed and what Generation Z need to consider as they start the third <mark>stage</mark> of their educational journey.", "z": "当新一批学生填写本科入学申请表、权衡各种选择时，或许值得思考一下：学位的意义、目的和价值究竟发生了怎样的变化，以及Z世代在开启求学旅程的第三个<mark>阶段</mark>时需要考虑些什么。", "r": "2022 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1379, "w": "standard-setter", "f": 4, "m": "standard（标准）+set（确定、设置）+er（人或组织）", "s": [{"d": "1. 短语 标准制定者（4）", "e": "Behind the scenes, they have been taking aim at someone else: the accounting <mark>standard-setters</mark>.", "z": "在幕后，他们一直把矛头指向另一些人：会计<mark>准则制定者</mark>。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1380, "w": "statistics", "f": 4, "m": "statistic（统计数字）+-s（复数结尾）", "s": [{"d": "1. n. 统计学、统计方法（4）", "e": "&quot;Machine learning often provides a more reliable form of <mark>statistics</mark> which makes data more valuable,&quot; says Winston.", "z": "温斯顿说：“机器学习通常提供一种更可靠的<mark>统计方法</mark>，使数据更有价值。”", "r": "2021 · 英语一 · 阅读理解 B · 第 44 题"}]}, {"id": 1381, "w": "statute", "f": 4, "m": "stat（建立、确立）+ute（名词结尾）", "s": [{"d": "1. n. 成文法律（4）", "e": "The White House argued that Arizona&#x27;s laws conflicted with its enforcement priorities, even if state laws complied with federal <mark>statutes</mark> to the letter.", "z": "白宫认为，即便亚利桑那州的法律逐字遵循联邦<mark>成文法</mark>的条文，它们仍与联邦政府优先执行的事项相冲突。", "r": "2013 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1382, "w": "stem", "f": 4, "m": "", "s": [{"d": "1. v. 源于、由……造成（stem from）（2）", "e": "The way consumers now approach the process of making purchase decisions means that marketing&#x27;s impact <mark>stems</mark> from a broad range of factors beyond conventional paid media.", "z": "消费者如今对待购买决策过程的方式意味着，营销的影响<mark>源自</mark>传统付费媒体以外的众多因素。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 茎（1）", "e": "__3__ plants lack brains, the firing of electrical signals in their <mark>stems</mark> and leaves nonetheless triggered responses that __4__ consciousness, researchers previously reported.", "z": "研究人员此前报告说，____植物没有大脑，它们<mark>茎</mark>和叶中发出的电信号仍会引起____意识的反应。", "r": "2022 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "3. v. 遏制、阻止（1）", "e": "<mark>Stemming</mark> climate change, for example, is as much about changing consumption patterns and promoting tax acceptance as it is about developing clean energy.", "z": "例如，<mark>遏制</mark>气候变化既要改变消费模式、提高人们对税收的接受度，也要发展清洁能源。", "r": "2013 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 E · 真题选项"}]}, {"id": 1383, "w": "stimulate", "f": 4, "m": "stimul（刺激、推动、激励）+-ate（使……）", "s": [{"d": "1. v. 刺激；促进；激发（3）", "e": "Likewise, automation should eventually boost p ”与业绩挂钩。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1388, "w": "succeed", "f": 4, "m": "suc-（接在后面）+ceed（走、前进）", "s": [{"d": "1. v. 成功（3）", "e": "These benefactors have <mark>succeeded</mark> in their chosen fields, they say, and they want to use their wealth to draw attention to those who have <mark>succeeded</mark> in science.", "z": "他们说，这些捐助者在自己选择的领域<mark>取得了成功</mark>，因此希望利用自己的财富，让人们关注那些在科学领域<mark>取得成功</mark>的人。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 继承（王位）（1）", "e": "[ B ] Charles, Anxious to <mark>Succeed</mark> to the Throne", "z": "[B] 渴望<mark>继承</mark>王位的查尔斯", "r": "2015 · 英语一 · 阅读理解 A Text 1 · 第 25 题 · 选项 B · 真题选项"}]}, {"id": 1389, "w": "suit", "f": 4, "m": "S（尺寸）+U（用途）+I（我）+T（试）su（诉）+it（它）", "s": [{"d": "1. v. 适合；满足…需要（2）", "e": "Within the complex social structure of the scientific community, researchers make discoveries; editors and reviewers act as gatekeepers by controlling the publication process; other scientists use the new finding to <mark>suit</mark> their own purposes; and finally, the public (including other scientists) receives the new discovery and possibly accompanying technology.", "z": "在科学界复杂的社会结构中，研究人员作出发现；编辑和审稿人通过控制发表过程充当把关人；其他科学家利用新发现<mark>满足</mark>自身目的；最后，公众，包括其他科学家，接收到这一新发现以及可能随之而来的技术。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 适合；满足…需要（1）", "e": "John Donahue at Harvard&#x27;s Kennedy School points out that the norms of culture in Western civil services <mark>suit</mark> those who want to stay put but are bad for high achievers.", "z": "哈佛大学肯尼迪学院的约翰·多纳休指出，西方公务部门的文化规范<mark>适合</mark>那些想安于现状的人，却不利于成就突出的人。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题 原表义项待核：本例中为动词“适合”。"}, {"d": "3. n. （follow suit）仿效；照着做（1）", "e": "France&#x27;s planned tax is a clear warning: Unless a broad consensus can be reached on reforming the international tax system, other nations are likely to follow <mark>suit</mark>, and American companies will face a cascade of different taxes from dozens of nations r invention to make our lives easier.", "z": "心理健康是创造力的源泉，帮助我们解决问题、化解冲突、美化<mark>周围环境</mark>、管理家庭生活，或想出让生活更轻松的创新商业点子或发明。", "r": "2016 · 英语一 · 阅读理解 C · 第 48 题"}]}, {"id": 1394, "w": "suspicion", "f": 4, "m": "su-（从下方）+spic（看）+-ion（这种心理状态）", "s": [{"d": "1. n. 怀疑、猜疑（4）", "e": "Ms Brooks may or may not have had <mark>suspicions</mark> about how her journalists got their stories, but she asked no questions, gave no instructions - nor received traceable, recorded answers.", "z": "布鲁克斯女士也许<mark>怀疑</mark>过记者获取报道素材的方式，也许没有，但她既未发问，也未下达指示，更没有收到可追溯、有记录的答复。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1395, "w": "tackle", "f": 4, "m": "", "s": [{"d": "1. v. 处理；应对（4）", "e": "&quot;There is a coalition growing within artist industries to figure out how to <mark>tackle</mark> or mitigate this,&quot; says Ortiz.", "z": "“艺术行业内部正在形成一个联盟，试图弄清如何<mark>应对</mark>或减轻这个问题，”奥尔蒂斯说。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1396, "w": "tame", "f": 4, "m": "", "s": [{"d": "1. v. 驯化（4）", "e": "Prehistoric humans may have <mark>tamed</mark> donkeys to help navigate the expanding Sahara.", "z": "史前人类可能<mark>驯化</mark>了驴，以帮助他们穿越不断扩大的撒哈拉沙漠。", "r": "2026 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1397, "w": "taxpayer", "f": 4, "m": "tax（税）+pay（支付）+er（做这件事的人）", "s": [{"d": "1. n. 纳税人（4）", "e": "Successive governments have permitted such increases on the grounds that the cost of investing in and running the rail network should be borne by those who use it, rather than the general <mark>taxpayer</mark>.", "z": "历届政府都允许这样的涨价，理由是铁路网络的投资与运营成本应由使用者承担，而非由普通<mark>纳税人</mark>承担。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1398, "w": "tempt", "f": 4, "m": "", "s": [{"d": "1. v. 诱使、使想要（4）", "e": "You might even be <mark>tempted</mark> to assume that humanity has little future to look forward to.", "z": "你甚至可能<mark>不由得</mark>认为，人类的未来没有多少值得期待的东西。", "r": "2013 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1399, "w": "tendency", "f": 4, "m": "tend（朝一个方向发展）+-ency（状态、特点的名词结尾）", "s": [{"d": "1. n. 倾向；趋势（4）", "e": "This <mark>tendency</mark> in the natural sciences has long been evident in the social sciences too.", "z": "自然科学中的这种<mark>倾向</mark>，长期以来在社会科学中也十分明显。", "r": "2012 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 1400, "w": "tension", "f": 4, "m": "tens（拉紧）+-ion（状态名词后缀）", "s": [{"d": "1. n. 紧张、紧张关系（4）", "e": "Offering up such a theory during a time of high <mark>tension</mark> between scientific and religious minds was branded as heresy and any such heretics that continued to spread these lies were to be punished by imprisonment or even death.", "z": "在科学思想与宗教思想关系高度<mark>紧张</mark>的时期，提出这样的理论会被扣上异端的帽子，而任何继续传播这些谎言的异端者都将受到监禁甚至死刑的惩罚。", "r": "2020 · 英语一 · 阅读理解 C · 第 47 题"}]}];
const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
