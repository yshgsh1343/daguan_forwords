<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 13 (1201-1300) - 考研英语一·真题语境背单词</title>
<style>:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1e293b;
  --sub: #64748b;
  --border: #e2e8f0;
  --momo: #10b981;
  --momo-dark: #059669;
  --momo-soft: #d1fae5;
  --amber: #f59e0b;
  --amber-soft: #fef3c7;
  --rose: #f43f5e;
  --rose-soft: #ffe4e6;
  --mark-text: #d92d20;
  --mark-bg: #fee4e2;
  --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06);
}
[data-theme="dark"] {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --sub: #94a3b8;
  --border: #334155;
  --momo: #10b981;
  --momo-dark: #34d399;
  --momo-soft: rgba(16, 185, 129, 0.18);
  --amber-soft: rgba(245, 158, 11, 0.18);
  --rose-soft: rgba(244, 63, 94, 0.18);
  --mark-text: #fda29b;
  --mark-bg: rgba(240, 68, 56, 0.25);
  --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}
a { color: inherit; text-decoration: none; }
button, select, input {
  font-family: inherit;
  border: none;
  outline: none;
  background: none;
}
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.badge-momo {
  background: var(--momo);
  color: #fff;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
}
.nav-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-chip {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-chip:hover { border-color: var(--momo); color: var(--momo); }
.btn-chip.active { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo { background: var(--momo); color: #fff; border-color: var(--momo); }
.btn-chip.btn-momo:hover { background: var(--momo-dark); color: #fff; }
.btn-chip.btn-amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn-chip.btn-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
.stats-bar {
  max-width: 960px;
  width: 100%;
  margin: 14px auto 0;
  padding: 0 16px;
}
.progress-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  display: flex;
  margin-bottom: 10px;
}
.prog-seg { height: 100%; transition: width 0.3s ease; }
.prog-k { background: var(--momo); }
.prog-v { background: var(--amber); }
.prog-u { background: var(--rose); }
.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--sub);
  flex-wrap: wrap;
  gap: 8px;
}
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--sub);
  transition: all 0.15s;
}
.pill.active { font-weight: 700; color: var(--text); border-color: var(--momo); background: var(--momo-soft); }
.batch-toolbar {
  margin-top: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 220px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
}
.search-box input {
  width: 100%;
  font-size: 13px;
  color: var(--text);
}
.batch-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.container {
  max-width: 960px;
  width: 100%;
  margin: 12px auto 100px;
  padding: 0 16px;
  flex: 1;
}
.momo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 24px;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 16px;
  margin-bottom: 18px;
}
.word-title-wrap { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.word-title {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
  cursor: pointer;
}
.word-title.masked {
  filter: blur(10px);
  user-select: none;
}
.speak-btn {
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--momo-soft);
  color: var(--momo-dark);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.meta-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.freq-badge {
  background: var(--rose-soft);
  color: var(--rose);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.status-badge {
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}
.st-1 { background: var(--momo-soft); color: var(--momo-dark); }
.st-2 { background: var(--amber-soft); color: var(--amber); }
.st-3 { background: var(--rose-soft); color: var(--rose); }
.morph-box {
  background: var(--bg);
  border-left: 4px solid var(--momo);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.morph-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--momo-dark);
  background: var(--momo-soft);
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
}
.sense-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: border-color 0.2s;
}
.sense-item:hover { border-color: var(--momo); }
.en-sent {
  font-size: 17px;
  line-height: 1.65;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 10px;
}
.en-sent mark, .zh-sent mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
}
.cloze-mode .en-sent mark {
  color: transparent !important;
  background: var(--border) !important;
  border-bottom: 2px solid var(--momo);
  padding: 0 18px;
  cursor: pointer;
}
.reveal-box {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 8px;
  transition: opacity 0.2s, filter 0.2s;
}
.hidden-meaning .reveal-box, .hidden-meaning .morph-box {
  filter: blur(8px);
  opacity: 0.28;
  user-select: none;
  cursor: pointer;
}
.sense-def {
  display: inline-block;
  font-size: 14px;
  font-weight: 700;
  color: var(--mark-text);
  background: var(--mark-bg);
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 6px;
}
.zh-sent {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 6px;
}
.src-tag {
  font-size: 12px;
  color: var(--sub);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.speak-sent {
  cursor: pointer;
  color: var(--momo-dark);
  font-weight: 600;
  font-size: 12px;
}
.dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  z-index: 60;
  box-shadow: 0 -8px 25px rgba(0,0,0,0.05);
}
.dock-inner {
  max-width: 960px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: auto 1fr 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}
.btn-act {
  padding: 12px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.1s, opacity 0.15s;
}
.btn-act:active { transform: scale(0.97); }
.btn-act small { font-size: 11px; font-weight: 500; opacity: 0.85; }
.act-k { background: var(--momo); color: #fff; }
.act-v { background: var(--amber); color: #fff; }
.act-u { background: var(--rose); color: #fff; }
.act-nav {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}
.list-grid { display: flex; flex-direction: column; gap: 14px; }
.list-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: border-color 0.15s;
}
.list-card.selected-row { border-color: var(--momo); box-shadow: 0 0 0 2px var(--momo-soft); }
/* 紧凑速查表（一键勾选/标熟） */
.quick-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.quick-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.quick-table th, .quick-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.quick-table th {
  background: var(--bg);
  font-size: 12px;
  color: var(--sub);
  font-weight: 700;
}
.quick-table tr:hover { background: var(--bg); }
.quick-table tr.selected-row { background: var(--momo-soft); }
.chk-box {
  width: 17px;
  height: 17px;
  accent-color: var(--momo);
  cursor: pointer;
}
.toast {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.toast.show { opacity: 1; }
.kbd-hint {
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  margin-top: 12px;
}
@media (max-width: 640px) {
  .word-title { font-size: 26px; }
  .en-sent { font-size: 15.5px; }
  .dock-inner { grid-template-columns: 1fr 1fr 1fr; }
  .act-nav { display: none; }
  .hide-sm { display: none; }
}
</style>
</head>

<script>
const UNIT_NO = 13;
const WORDS = [{"id": 1201, "w": "diverse", "f": 4, "m": "di-（分开、朝不同方向）+vers（转）+e（词形结尾）", "s": [{"d": "1. adj. 多样的；不同的（4）", "e": "(46) This movement, driven by powerful and <mark>diverse</mark> motivations, built a nation out of a wilderness and, by its nature, shaped the character and destiny of an uncharted continent.", "z": "（46）这场运动由强大而<mark>多样</mark>的动机推动，在荒野中建立起一个国家，并以其自身的性质塑造了这片未知大陆的性格与命运。", "r": "2015 · 英语一 · 阅读理解 C · 第 46 题"}]}, {"id": 1202, "w": "dominate", "f": 4, "m": "domin（统治、支配）+-ate（动词后缀）", "s": [{"d": "1. v. 支配、占主导地位（4）", "e": "Third, they now <mark>dominate</mark> left-of-centre politics.", "z": "第三，他们如今<mark>主导</mark>着中间偏左的政治。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1203, "w": "durable", "f": 4, "m": "dur（持久）+-able（能够……的）", "s": [{"d": "1. adj. 耐用的（4）", "e": "People often complain that plastics are too <mark>durable</mark>.", "z": "人们常常抱怨塑料太<mark>耐用</mark>了。", "r": "2022 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1204, "w": "edition", "f": 4, "m": "edit（编辑、校订）+-ion（过程或结果的名词后缀）", "s": [{"d": "1. n. 版本（4）", "e": "Overhead may be high and circulation lower, but rushing to eliminate its print <mark>edition</mark> would be a mistake, says BuzzFeed CEO Jonah Peretti.", "z": "BuzzFeed首席执行官乔纳·佩雷蒂说，日常运营开支可能很高，发行量也可能较低，但仓促取消纸质<mark>版</mark>将是一个错误。", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1205, "w": "educate", "f": 4, "m": "educ-（养育；教导）+-ate（动词后缀）", "s": [{"d": "1. v. 教育、使受教育（3）", "e": "Second, they are mostly bright and well-<mark>educated</mark>.", "z": "其次，他们大多聪明且<mark>受过良好的教育</mark>。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 使增长知识、启发（1）", "e": "In my own book about radio I recorded how, on one drive: &quot;I caught up with the news, learnt some 17th-century history, and was startlingly <mark>educated</mark> by an unpretentious programme on the history of the stethoscope.&quot;", "z": "在我自己写的一本关于广播的书中，我记录了一次开车途中发生的事：“我了解了最新新闻，学到了一些17世纪的历史，还从一档朴实无华、讲述听诊器历史的节目中意外地<mark>增长了知识</mark>。”", "r": "2026 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1206, "w": "element", "f": 4, "m": "", "s": [{"d": "1. n. 要素；组成部分（4）", "e": "What is the essential <mark>element</mark> in the dynamics of social influence?", "z": "社会影响的作用机制中，关键<mark>要素</mark>是什么？", "r": "2010 · 英语一 · 阅读理解 A Text 3 · 第 35 题"}]}, {"id": 1207, "w": "embody", "f": 4, "m": "em-（使进入）+body（身体；具体形式）", "s": [{"d": "1. v. 体现， 象征（4）", "e": "This very fact <mark>embodied</mark> the new ways of thinking that swept through Europe during most of the 17th century.", "z": "这一事实本身就<mark>体现</mark>了在17世纪大部分时间里席卷欧洲的新思维方式。", "r": "2020 · 英语一 · 阅读理解 C · 第 49 题"}]}, {"id": 1208, "w": "embrace", "f": 4, "m": "em-（进入）+brac（手臂）+e（词形结尾）", "s": [{"d": "1. v. 欣然接受；拥护（3）", "e": "There is no reason why everyone cannot be welcomed on Mauna Kea to <mark>embrace</mark> their cultural heritage and to study the stars.", "z": "没有理由不欢迎所有人来到莫纳克亚山，<mark>拥抱</mark>自己的文化传承并研究星空。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. n. 拥抱（1）", "e": "Believe it or not, a warm <mark>embrace</mark> might even help you __4__ getting sick this winter.", "z": "信不信由你，一个温暖的<mark>拥抱</mark>甚至可能帮助你在今年冬天____生病。", "r": "2017 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1209, "w": "encounter", "f": 4, "m": "en-（进入）+counter（相对、迎面）", "s": [{"d": "1. v. 遇到（3）", "e": "Visit any antiques store and you&#x27;ll <mark>encounter</mark> artifacts from the past: photographs, letters, a brochure detailing the Sinclair dinosaur exhibit from the 1964-65 World&#x27;s Fair, the ephemera of history.", "z": "走进任何一家古董店，你都会<mark>遇见</mark>来自过去的物件：照片、书信、详细介绍1964至1965年世界博览会辛克莱恐龙展的一本宣传手册，以及历史中那些原本短暂留存的纸质杂物。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 遭遇（尤指困难或问题）（1）", "e": "After a bruising <mark>encounter</mark> with Congress, America&#x27;s Financial Accounting Standards Board (FASB) rushed through rule changes.", "z": "在<mark>与国会交锋</mark>受挫之后，美国财务会计准则委员会（FASB）仓促通过了规则修改。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1210, "w": "enforce", "f": 4, "m": "en-（使）+force（力量、强制力）", "s": [{"d": "1. v. 执行（4）", "e": "The bans, if fully <mark>enforced</mark>, would suggest to women (and many men) that they should not let others be arbiters of their beauty.", "z": "如果这些禁令得到全面<mark>执行</mark>，就会向女性以及许多男性传达这样的信息：不应让别人裁定自己的美。", "r": "2016 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1211, "w": "engineer", "f": 4, "m": "engine（引擎、机器，去掉末尾e）+eer（从事有关工作的人）", "s": [{"d": "1. n. 工程师（2）", "e": "In 1924 America&#x27;s National Research Council sent two <mark>engineers</mark> to supervise a series of experiments at a telephone-parts factory called the Hawthorne Plant near Chicago.", "z": "1924年，美国国家研究委员会派出两名<mark>工程师</mark>，到芝加哥附近一家名为霍桑工厂的电话零件厂，监督一系列实验。", "r": "2010 · 英语一 · 完形填空 · 第 1-20 题"}, {"d": "2. v. 精心策划；设计（1）", "e": "And that&#x27;s the problem with a social cure <mark>engineered</mark> from the outside: in the real world, as in school, we insist on choosing our own friends.", "z": "这正是从外部<mark>设计</mark>社会疗法的问题所在：在现实世界中，就像在学校里一样，我们坚持自己选择朋友。", "r": "2012 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 通过工程技术改造（1）", "e": "(41)______ Humanity has the necessary agro-technological tools to eradicate hunger, from genetically <mark>engineered</mark> crops to artificial fertilizers.", "z": "（41）____人类拥有消除饥饿所需的农业技术工具，从经基因<mark>工程改造</mark>的作物到人工肥料，无一不备。", "r": "2013 · 英语一 · 阅读理解 B · 第 41 题 · 真题题干"}]}, {"id": 1212, "w": "entitle", "f": 4, "m": "en-（给予、使具有）+title（标题、称号）", "s": [{"d": "1. v. 赋予权利；有资格（4）", "e": "The court, though, may want to allow room for police to cite situations where they are <mark>entitled</mark> to more freedom.", "z": "不过，法院可能希望留出余地，让警方援引那些使其<mark>有权</mark>享有更多自由的情形。", "r": "2015 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1213, "w": "equally", "f": 4, "m": "equal（相等的、平等的）+-ly（以这种方式）", "s": [{"d": "1. adv. 同样地；相等地（3）", "e": "And it is <mark>equally</mark> true that science&#x27;s unrelenting appetite for information has caused a mushrooming of energy-intensive data centres around the world.", "z": "<mark>同样</mark>确凿的是，科学对信息永无止境的渴求，已使耗能巨大的数据中心在世界各地迅速涌现。", "r": "2025 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}, {"d": "2. adv. 平等地；平均地（1）", "e": "Each spouse retains __16__ property he or she __17__ into the marriage, and jointly-acquired property is __18__ <mark>equally</mark>.", "z": "夫妻双方各自保留其____婚姻的____财产，而共同取得的财产则<mark>平均</mark>____。", "r": "2016 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}]}, {"id": 1214, "w": "error", "f": 4, "m": "err-（偏离、犯错）+-or（相应的情况或结果）", "s": [{"d": "1. n. 错误；失误（4）", "e": "Opportunities for misinterpretation, <mark>error</mark>, and self-deception abound.", "z": "误解、<mark>错误</mark>和自我欺骗的机会大量存在。", "r": "2012 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1215, "w": "exam", "f": 4, "m": "", "s": [{"d": "1. n. 考试（4）", "e": "If the bar <mark>exam</mark> is truly a stern enough test for a would-be lawyer, those who can sit it earlier should be allowed to do so.", "z": "如果律师资格<mark>考试</mark>确实对准律师构成足够严峻的考验，那么那些能够提前参加<mark>考试</mark>的人就应获准这样做。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1216, "w": "exception", "f": 4, "m": "except（除外、反对）+-ion（行为或结果的名词后缀）", "s": [{"d": "1. n. 例外；除外（4）", "e": "But they are the <mark>exception</mark>, not the norm that Ms. Marris implies.", "z": "但它们是<mark>例外</mark>，并非马里斯女士所暗示的常态。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1217, "w": "exciting", "f": 4, "m": "excite（使激动，去掉末尾e）+ing（表示引起某种反应的性质）", "s": [{"d": "1. adj. 令人兴奋的（4）", "e": "The world of AI is buzzing with an <mark>exciting</mark> potential to improve and enrich our lives.", "z": "人工智能界正在热议改善和丰富我们生活的<mark>令人兴奋的</mark>潜力。", "r": "2026 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1218, "w": "exclude", "f": 4, "m": "ex-（向外）+clud（关闭）+e（拼写结尾）", "s": [{"d": "1. v. 排除；不包括在内（4）", "e": "You are now not wanted; you are now <mark>excluded</mark> from the work environment that offers purpose and structure in your life.", "z": "如今，你不再被需要；你已被<mark>排除</mark>在那个为生活提供目标和秩序的工作环境之外。", "r": "2014 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1219, "w": "excuse", "f": 4, "m": "ex-（出去、脱离）+cuse（指控、责备）", "s": [{"d": "1. n. 借口（4）", "e": "Rather than cloaking his exit in the usual vague <mark>excuses</mark>, he came right out and said he was leaving &quot;to pursue my goal of running a company.&quot;", "z": "他没有用惯常的含糊<mark>借口</mark>掩饰自己的离职，而是直截了当地说，离开是为了“追求经营一家公司的目标”。", "r": "2011 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1220, "w": "existence", "f": 4, "m": "exist（存在、生存）+-ence（状态、过程的名词后缀）", "s": [{"d": "1. n. 生存；生活（3）", "e": "Beethoven&#x27;s music tends to move from chaos to order as if order were an imperative of human <mark>existence</mark>.", "z": "贝多芬的音乐往往从混乱走向秩序，仿佛秩序是人类<mark>生存</mark>不可或缺的需要。", "r": "2014 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "2. n. 存在；生存（1）", "e": "[ C ] neglected the likely <mark>existence</mark> of bad debts.", "z": "[C] 忽视了坏账可能<mark>存在</mark>的事实。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 39 题 · 选项 C · 真题选项"}]}, {"id": 1221, "w": "expansion", "f": 4, "m": "expans（expand的词干变体，扩展）+-ion（行为；结果）", "s": [{"d": "1. n. 扩张、扩大（4）", "e": "The report also advocates greater study of foreign languages, international affairs and the <mark>expansion</mark> of study abroad programs.", "z": "报告还主张加强外语和国际事务的学习，并<mark>扩大</mark>海外留学项目。", "r": "2014 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1222, "w": "exploit", "f": 4, "m": "ex-（向外、展开）+ploit（使用、运用）", "s": [{"d": "1. v. 利用；开发（3）", "e": "While traditional &quot;paid&quot; media - such as television commercials and print advertisements - still play a major role, companies today can <mark>exploit</mark> many alternative forms of media.", "z": "虽然电视广告和平面广告等传统“付费”媒体仍发挥重要作用，但如今企业可以<mark>利用</mark>许多其他可供选择的媒体形式。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. v. 掠夺性开发、剥削（1）", "e": "[ B ] Two centuries ago, the idea of preserving nature, rather than <mark>exploiting</mark> it, was a novel one to many US settlers.", "z": "[B] 两个世纪前，对许多美国移民定居者而言，保护自然而非<mark>掠夺性开发</mark>自然，是一种新颖的想法。", "r": "2023 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 B · 真题选项"}]}, {"id": 1223, "w": "explosion", "f": 4, "m": "explos-（explode的词干变体 36-40 题"}]}, {"id": 1228, "w": "fierce", "f": 4, "m": "", "s": [{"d": "1. adj. 激烈的；强烈的（3）", "e": "Such debates reflect <mark>fierce</mark> discussions across the US, as researchers, policymakers, teachers and students step up demands for a greater focus on teaching about the facts of climate change in schools.", "z": "此类争论反映了全美各地的<mark>激烈</mark>讨论，研究人员、政策制定者、教师和学生正加大呼吁力度，要求学校更加重视气候变化事实的教学。", "r": "2023 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. adj. 凶猛的，凶狠的（1）", "e": "For example, type in &quot;Wizard with sword and a glowing orb of magic fire fights a <mark>fierce</mark> dragon Greg Rutkowski,&quot; and the system will produce something that looks not a million miles away from works in Rutkowski&#x27;s style.", "z": "例如，输入“持剑的巫师带着一颗发光的魔法火球，与一条<mark>凶猛</mark>的龙战斗，格雷格·鲁特科夫斯基”，系统就会生成与鲁特科夫斯基风格的作品颇为相似的东西。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1229, "w": "fix", "f": 4, "m": "", "s": [{"d": "1. v. 修复；解决（2）", "e": "&quot;If they fail first and then you <mark>fix</mark> them, it&#x27;s very expensive,&quot; says Domingos.", "z": "多明戈斯说：“如果等到它们发生故障后再<mark>修复</mark>，成本会非常高。”", "r": "2021 · 英语一 · 阅读理解 B · 第 45 题"}, {"d": "2. v. 固定；确定（2）", "e": "What is in question is not the retrieval of an absolute, <mark>fixed</mark> or &quot;true&quot; meaning that can be read off and checked for accuracy, or some timeless relation of the text to the world.", "z": "所讨论的并不是找回某种能够直接解读并核验准确性的、绝对、<mark>固定</mark>或“真实”的意义，也不是文本与世界之间某种永恒不变的关系。", "r": "2015 · 英语一 · 阅读理解 B · 第 43 题"}]}, {"id": 1230, "w": "fluid", "f": 4, "m": "flu（流动）+-id（形容词后缀）", "s": [{"d": "1. adj. 流体的（fluid intelligence：流体智力）（4）", "e": "<mark>Fluid</mark> intelligence is the type of intelligence that has to do with short-term memory and the ability to think quickly, logically, and abstractly in order to solve new problems.", "z": "<mark>流体</mark>智力是一种与短期记忆，以及为了应对新问题而快速、合乎逻辑并抽象地思考的能力有关的智力。", "r": "2021 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1231, "w": "fly", "f": 4, "m": "", "s": [{"d": "1. v. 飞行（3）", "e": " e will look back.", "z": "我们知道，一般婴儿总会本能地<mark>凝视</mark>母亲的眼睛，母亲也会回望他们。", "r": "2020 · 英语一 · 阅读理解 B · 第 41-45 题"}]}, {"id": 1240, "w": "generator", "f": 4, "m": "generat（generate去e，产生）+-or（执行这种作用的装置）", "s": [{"d": "1. n. 生成器（4）", "e": "His distinctive style is now one of the most commonly used prompts in the new open-source AI art <mark>generator</mark> Stable Diffusion.", "z": "他独特的风格如今已成为新款开源人工智能艺术<mark>生成器</mark>Stable Diffusion中最常用的提示词之一。", "r": "2024 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1241, "w": "generous", "f": 4, "m": "gener-（种类；出身）+-ous（具有……性质的）", "s": [{"d": "1. adj. 慷慨的；丰厚的（4）", "e": "Politicians have repeatedly &quot;backloaded&quot; public-sector pay deals, keeping the pay increases modest but adding to holidays and especially pensions that are already <mark>generous</mark>.", "z": "政界人士一再把公共部门薪酬协议的支出推迟到以后兑现，保持较小的工资涨幅，却增加休假，尤其是增加本已<mark>丰厚</mark>的养老金。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1242, "w": "genius", "f": 4, "m": "gen（出生、天生）+ius（本词的名词结尾）", "s": [{"d": "1. n. 天才；天才人物（3）", "e": "They perpetuate the myth of the lone <mark>genius</mark>.", "z": "他们使“孤独<mark>天才</mark>”的迷思延续下去。", "r": "2014 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}, {"d": "2. n. 天赋；才华（1）", "e": "By the time that Shakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once popular and literary; Kyd had written a tragedy that crowded the pit; and Marlowe had brought poetry and <mark>genius</mark> to triumph on the common stage - where they had played no part since the death of Euripides.", "z": "莎士比亚二十五岁时，利利、皮尔和格林已创作出既受大众欢迎又有文学性的喜剧；基德写出了一部使剧场廉价站席挤满观众的悲剧；马洛则让诗歌与<mark>天才</mark>在普通舞台上大获成功，而自欧里庇得斯去世以来，它们一直未能在那里发挥作用。", "r": "2018 · 英语一 · 阅读理解 C · 第 48、49 题"}]}, {"id": 1243, "w": "goods", "f": 4, "m": "good（有用或有价值之物）+-s（复数）", "s": [{"d": "1. n. 商品、货物（4）", "e": "They&#x27;ve helped pull wheeled vehicles, carry travelers and move <mark>goods</mark> across the world.", "z": "在世界各地，它们帮助拉动轮式车辆、驮载旅客和搬运<mark>货物</mark>。", "r": "2026 · 英语一 · 阅读理解 A  阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1247, "w": "guard", "f": 4, "m": "", "s": [{"d": "1. v. 保护；防范（4）", "e": "Personal grievance procedures were designed to <mark>guard</mark> the jobs of ordinary workers from &quot;unjustified dismissals&quot;.", "z": "个人申诉程序的设计目的是<mark>保护</mark>普通工人的工作，使他们免遭“不合理解雇”。", "r": "2022 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1248, "w": "guilty", "f": 4, "m": "guilt（罪过、内疚）+-y（具有这种性质或状态的）", "s": [{"d": "1. adj. 内疚的；有负罪感的（2）", "e": "Yet as we report now, the food police are determined that this __3__ should be rendered yet another <mark>guilty</mark> pleasure __4__ to damage our health.", "z": "然而，正如我们现在报道的，食品监管者决意让这种____变成又一种<mark>令人内疚</mark>的享受，____损害我们的健康。", "r": "2020 · 英语一 · 完形填空 · 第 1-20 题 · 完形原文"}, {"d": "2. adj. 有罪的（2）", "e": "As the hacking trial concludes - finding <mark>guilty</mark> one ex-editor of the News of the World, Andy Coulson, for conspiring to hack phones, and finding his predecessor, Rebekah Brooks, innocent of the same charge - the wider issue of dearth of integrity still stands.", "z": "随着窃听案审判结束--《世界新闻报》前任编辑安迪·库尔森被认定<mark>犯有共谋窃听电话罪</mark>，而他的前任丽贝卡·布鲁克斯则就同一指控获判无罪--更广泛的诚信缺失问题依然存在。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1249, "w": "hack", "f": 4, "m": "", "s": [{"d": "1. v. 非法侵入；窃听（4）", "e": "Journalists are known to have <mark>hacked</mark> the phones of up to 5,500 people.", "z": "据悉，记者曾<mark>窃听</mark>多达5500人的电话。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1250, "w": "heritage", "f": 4, "m": "herit（继承）+-age（所得事物的名词后缀）", "s": [{"d": "1. n. 遗产；传承（4）", "e": "There is no reason why everyone cannot be welcomed on Mauna Kea to embrace their cultural <mark>heritage</mark> and to study the stars.", "z": "没有理由不欢迎所有人来到莫纳克亚山，拥抱自己的<mark>文化传承</mark>并研究星空。", "r": "2017 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1251, "w": "hijack", "f": 4, "m": "", "s": [{"d": "1. v. 劫持、操控（4）", "e": "Members of social networks, for instance, are learning that they can <mark>hijack</mark> media to apply pressure on the businesses that originally created them.", "z": "例如，社交网络的成员正在了解到，他们可以<mark>操控</mark>媒体，向最初创建这些媒体的企业施加压力。", "r": "2011 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1252, "w": "hinder", "f": 4, "m": "", "s": [{"d": "1. v. 阻碍，妨碍（4）", "e": "Transient investors, who demand high quarterly profits from companies, can <mark>hinder</mark> a firm&#x27;s efforts to invest in long-term research or to build up customer loyalty.", "z": "要求公司取得高额季度利润的短期投资者，可能<mark>妨碍</mark>企业投资长期研究或培养客户忠诚度的努力。", "r": "2019 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1253, "w": "homeless", "f": 4, "m": "home（家、住所）+less（没有）", "s": [{"d": "1. n. 无家可归者（集合名词）（4）", "e": "(48) The gardens of the <mark>homeless</mark>, which are in effect <mark>homeless</mark> gardens, introduce form into an urban environment where it either didn&#x27;t exist or was not discernible as such.", "z": "（48）<mark>无家可归</mark>者的花园，实际上也是<mark>无家可归</mark>的花园；它们为城市环境引入了形式，而这种形式此前要么不存在，要么无法被辨认为形式。", "r": "2013 · 英语一 · 阅读理解 C · 第 47、48 题"}]}, {"id": 1254, "w": "honor", "f": 4, "m": "hon（荣誉、尊严）+or（本词词形结尾）", "s": [{"d": "1. n. 荣誉（2）", "e": "Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring <mark>honor</mark> to England.", "z": "宫廷、学校、业余爱好者组织以及巡回演员，竞相满足人们对戏剧娱乐的广泛需求；（47）任何上过文法学校的男孩都不会不知道，戏剧是一种为希腊和罗马带来荣耀、也可能为英国带来<mark>荣誉</mark>的文学形式。", "r": "2018 · 英语一 · 阅读理解 C · 第 46、47 题"}, {"d": "2. v. 尊重；颂扬（1）", "e": "A &quot;town of culture&quot; could be not just about the arts but about <mark>honouring</mark> a town&#x27;s peculiarities-helping sustain its high street, supporting local facilities and above all celebrating its people.", "z": "“文化小镇”不仅可以关乎艺术，还可以关乎<mark>颂扬</mark>一座城镇的独特之处--帮助维持商业街的活力、支持当地设施，最重要的是赞美当地居民。", "r": "2020 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "3. v. 授予荣誉；给予表彰（1）", "e": "He was knighted in 1967, the first music critic to be so <mark>honored</mark>.", "z": "他于1967年获封爵士，是首位<mark>获此荣誉</mark>的音乐评论家。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1255, "w": "hunt", "f": 4, "m": "", "s": [{"d": "1. v. 追猎；捕猎（2）", "e": "Were it not for opportunities to observe these beautiful, wild creatures close to home, many more people would be driven by their fascination to travel to wild areas to seek out, disturb and even <mark>hunt</mark> them down.", "z": "如果人们没有机会在家附近观察这些美丽的野生动物，就会有更多人因痴迷它们而前往野外，寻找、打扰，甚至<mark>追猎</mark>它们。", "r": "2022 · 英语一 · 阅读理解 B · 第 41-45 题"}, {"d": "2. n. 搜寻；寻找（1）", "e": "Science-based analytical approaches proved remarkably successful in the <mark>hunt</mark> for German submarines in the Atlantic Ocean.", "z": "在大西洋<mark>搜寻</mark>德国潜艇的过程中，以科学为基础的分析方法被证明取得了显著成功。", "r": "2026 · 英语一 · 阅读理解 C · 第 50 题"}, {"d": "3. v. 搜寻；寻找（1）", "e": "If you&#x27;re heading for your nearest branch of Waterstones, the biggest book retailer in the UK, in search of the Duchess of Sussex&#x27;s new children&#x27;s book The Bench, you might have to be prepared to <mark>hunt</mark> around a bit; the same may be true of The President&#x27;s Daughter, the new thriller by Bill Clinton and James Patterson.", "z": "如果你正前往英国最大的图书零售商水石书店离你最近的分店，寻找苏塞克斯公爵夫人的新童书《长椅》，你可能得做好四处<mark>找一找</mark>的准备；比尔·克林顿和詹姆斯·帕特森合著的新惊悚小说《总统的女儿》，情况或许也一样。", "r": "2023 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1256, "w": "impossible", "f": 4, "m": "im-（不）+possible（可能的、做得到的）", "s": [{"d": "1. adj. 不可能的（4）", "e": "While future researchers may find the digital realm a challenging place to ply their trade, they won&#x27;t find it an <mark>impossible</mark> one.", "z": "虽然未来的研究人员可能发现，在数字领域从事自己的工作充满挑战，但他们不会觉得这完全<mark>不可能</mark>。", "r": "2025 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1257, "w": "inadequate", "f": 4, "m": "in-（不）+adequate（足够的、能满足需要的）", "s": [{"d": "1. adj. 不足的；不充分的（4）", "e": "[ D ] an <mark>inadequate</mark> solution.", "z": "[D] 一种<mark>不充分</mark>的解决方案。", "r": "2023 · 英语一 · 阅读理解 A Text 2 · 第 30 题 · 选项 D · 真题选项"}]}, {"id": 1258, "w": "independent", "f": 4, "m": "in-（不）+dependent（依靠的、依赖的）", "s": [{"d": "1. adj. 独立的；不依赖于……的（4）", "e": "Successful markets require <mark>independent</mark> and even combative standard-setters.", "z": "成功的市场需要<mark>独立</mark>、甚至敢于争斗的标准制定者。", "r": "2010 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1259, "w": "indicator", "f": 4, "m": "indicat（indicate去e，指示、表明）+or（起指示作用的事物）", "s": [{"d": "1. n. 指标；标志（4）", "e": "Yes, there has been a budding economic recovery since the 2008 global crash, but in key <mark>indicators</mark> in areas such as health and education, major economies have continued to decline.", "z": "的确，自2008年全球经济崩溃以来，经济复苏已初现端倪；但在健康和教育等领域的关键<mark>指标</mark>上，主要经济体仍持续下滑。", "r": "2017 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1260, "w": "industrial", "f": 4, "m": "industry（工业；y变i）+-al（形容词后缀）", "s": [{"d": "1. adj. 工业的；产业的（3）", "e": "This is hacking on an <mark>industrial</mark> scale, as was acknowledged by Glenn Mulcaire, the man hired by the News of the World in 2001 to be the point person for phone hacking.", "z": "这是一场达到<mark>工业化</mark>规模的窃听活动，格伦·马尔凯尔也承认了这一点；他于2001年受《世界新闻报》雇用，担任电话窃听活动的主要负责人。", "r": "2015 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. adj. 劳资行动的（industrial action：罢工等行动）（1）", "e": "However, there is a strong case that those who have been worst affected by <mark>industrial</mark> action should receive compensation for the disruption they have suffered.", "z": "然而，有充分理由认为，受<mark>罢工等劳工行动</mark>影响最严重的人，应当就其遭受的干扰获得补偿。", "r": "2021 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1261, "w": "informed", "f": 4, "m": "inform（告知）+-ed（已经得到相应信息、处在相应状态的）", "s": [{"d": "1. adj. 知情的；了解情况的（4）", "e": "There are lessons about <mark>informed</mark> patient consent to learn.", "z": "关于患者的<mark>知情</mark>同意，还有经验教训需要吸取。", "r": "2018 · 英语一 · 阅读理解 A Text 3 · 第 31-35 题"}]}, {"id": 1262, "w": "inherent", "f": 4, "m": "in-（在里面）+her（粘着、结合）+-ent（处在这种状态的）", "s": [{"d": "1. adj. rs out of a law firm <mark>isolates</mark> lawyers from the pressure to make money rather than serve clients ethically.", "z": "行业内部存在变革压力，但监管者中的反对者坚持认为，将外部人士挡在律师事务所之外，可以<mark>使律师免受</mark>一味赚钱而非合乎道德地服务客户的压力。", "r": "2014 · 英语一 · 阅读理解 A Text 2 · 第 26-30 题"}]}, {"id": 1268, "w": "judgment", "f": 4, "m": "judge（判断；审判，去e）+-ment（行为；结果；能力）", "s": [{"d": "1. n. 判断；评价（4）", "e": "The ethical <mark>judgments</mark> of the Supreme Court justices have become an important issue recently.", "z": "最高法院大法官的道德<mark>判断</mark>近来已成为一个重要议题。", "r": "2012 · 英语一 · 完形填空 · 第 1-20 题"}]}, {"id": 1269, "w": "keen", "f": 4, "m": "", "s": [{"d": "1. adj. 热切的；热衷的（4）", "e": "I&#x27;m very <mark>keen</mark> to see them in person.", "z": "我非常<mark>渴望</mark>亲眼见到它们。", "r": "2026 · 英语一 · 写作 A · 第 51 题"}]}, {"id": 1270, "w": "kill", "f": 4, "m": "", "s": [{"d": "1. v. 杀死（3）", "e": "The fact that fires happened so often meant they couldn&#x27;t have been severe enough to <mark>kill</mark> most trees.", "z": "火灾如此频繁地发生，意味着它们不可能严重到足以<mark>杀死</mark>大多数树木。", "r": "2026 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}, {"d": "2. v. 扼杀；阻止（1）", "e": "But postal special-interest groups seem to have <mark>killed</mark> it, at least in the House.", "z": "但邮政业的特殊利益集团似乎已经<mark>扼杀</mark>了它，至少在众议院是如此。", "r": "2018 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1271, "w": "label", "f": 4, "m": "", "s": [{"d": "1. n. 品牌（3）", "e": "These <mark>labels</mark> encourage style-conscious consumers to see clothes as disposable - meant to last only a wash or two, although they don&#x27;t advertise that - and to renew their wardrobe every few weeks.", "z": "这些<mark>品牌</mark>鼓励注重时尚的消费者把衣服看作一次性用品，设计时就只打算让它们经受一两次洗涤，尽管<mark>品牌</mark>不会公开说明这一点；它们还鼓励消费者每隔几周就更新衣橱中的全部衣物。", "r": "2013 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 标签；称号（完形干扰选项）（1）", "e": "[ C ] <mark>label</mark>", "z": "［C］<mark>标签</mark>；<mark>称号</mark>。", "r": "2022 · 英语一 · 完形填空 · 第 15 题 · 选项 C · 真题选项"}]}, {"id": 1272, "w": "laboratory", "f": 4, "m": "labor（劳动、工作）+-atory（场所）", "s": [{"d": "1. n. 实验室（4）", "e": "So is it time to take the Petri dish out of the <mark>laboratory</mark> and into the garage?", "z": "那么，现在是否该把培养皿从<mark>实验室</mark>搬进车库了？", "r": "2025 · 英语一 · 阅读理解 C · 第 50 题"}]}, {"id": 1273, "w": "lane", "f": 4, "m": "", "s": [{"d": "1. n. 通道；车道（4）", "e": "Passengers who pass a background check are eligible to use expedited screening <mark>lanes</mark>.", "z": "通过背景核查的乘客有资格使用快速安检<mark>通道</mark>。", "r": "2017 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}]}, {"id": 1274, "w": "left", "f": 4, "m": "", "s": [{"d": "1. adj. 左派；左翼的（4）", "e": "Third, they now dominate <mark>left</mark>-of-centre politics.", "z": "第三，他们如今主导着中间<mark>偏左</mark>的政治。", "r": "2012 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1275, "w": "legacy", "f": 4, "m": "leg（委托、传递）+acy（本词名词结尾）", "s": [{"d": "1. adj. 传统遗留的（产品或业务）（4）", "e": "&quot;I would raise prices and make it into more of a <mark>legacy</mark> product.&quot;", "z": "“我会提高价格，让它更多地成为一种<mark>传统</mark>产品。”", "r": "2016 · 英语一 · 阅读理解 A Text 4 · 第 36-40 题"}]}, {"id": 1276, "w": "length", "f": 4, "m": "leng（long的o换成e，长）+-th（性质、度量）", "s": [{"d": "1. adv. 详细地（atlength）（2）", "e": "In those far-off days, it was taken for granted that the critics of major papers would write in detail and at <mark>length</mark> about the events they covered.", "z": "在那些遥远的岁月里，人们理所当然地认为，各大报纸的评论家会对其报道的事件作<mark>篇幅较长、详尽</mark>的论述。", "r": "2010 · 英语一 · 阅读理解 A Text 1 · 第 21-25 题"}, {"d": "2. n. 各处；纵横范围（length andbreadth）（1）", "e": "In recent summers, he has travelled the <mark>length</mark> and breadth of Britain to photograph all 58 native species of butterfly.", "z": "近几个夏天，他走遍英国<mark>各地</mark>，为全部58种本土蝴蝶拍照。", "r": "2025 · 英语一 · 阅读理解 B · 第 41-45 题 · 选项 G · 真题选项"}, {"d": "3. n. 长度；持续时间（1）", "e": "The peer-reviewed results showed that the target group of pupils drew on a wider vocabulary, used words &quot;classed as more sophisticated or rarer&quot;, and wrote at greater <mark>length</mark>.", "z": "经过同行评审的结果表明，实验组学生运用了更广的词汇，使用了“被归类为更高级或更罕见”的词语，写作<mark const STORAGE_KEY = 'kaoyan_momo_v1';
let store = {};
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { store = {}; }

let mode = 'context'; // 'context' | 'list' | 'table'
let filter = 'all';   // 'all' | '0' | '1' | '2' | '3' | 'review'
let cloze = false;
let revealed = false;
let curIdx = 0;
let filteredList = [...WORDS];
let selectedIds = new Set();

function showToast(msg) {
  let t = document.getElementById('toast-box');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-box';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function saveStore() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch(e) {}
  updateStats();
}

function getStatus(id) {
  return store[id] || 0; // 0:未标, 1:认识, 2:模糊, 3:不认识
}

function setStatus(id, st, advance = true) {
  if (st === 0) delete store[id];
  else store[id] = st;
  saveStore();
  if (mode === 'context') {
    if (!revealed && st !== 1 && st !== 0) {
      revealed = true;
      renderContext();
      return;
    }
    if (advance) nextWord();
    else renderContext();
  } else {
    render();
  }
}

function getVisibleList() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  return filteredList.filter(w => {
    if (!q) return true;
    return w.w.toLowerCase().includes(q)
      || (w.m && w.m.toLowerCase().includes(q))
      || w.s.some(s => s.d.toLowerCase().includes(q) || s.z.toLowerCase().includes(q) || s.e.toLowerCase().includes(q));
  });
}

function toggleSelect(id, checked) {
  if (checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  const row = document.getElementById('wrow-' + id);
  if (row) row.classList.toggle('selected-row', checked);
}

function selectAllVisible() {
  const list = getVisibleList();
  const allSelected = list.length > 0 && list.every(w => selectedIds.has(w.id));
  if (allSelected) {
    list.forEach(w => selectedIds.delete(w.id));
  } else {
    list.forEach(w => selectedIds.add(w.id));
  }
  render();
}

function invertSelectVisible() {
  const list = getVisibleList();
  list.forEach(w => {
    if (selectedIds.has(w.id)) selectedIds.delete(w.id);
    else selectedIds.add(w.id);
  });
  render();
}

function markSelected(st) {
  const list = getVisibleList();
  // 如果当前没有手动勾选任何词，则对当前筛选/搜索出的可见列表直接生效
  const targets = selectedIds.size > 0
    ? WORDS.filter(w => selectedIds.has(w.id))
    : list;

  if (!targets.length) {
    showToast('当前列表没有可操作的单词');
    return;
  }
  const labelMap = { 1: '✓ 认识(标熟)', 2: '? 模糊', 3: '✗ 不认识', 0: '待学习(重置)' };
  targets.forEach(w => {
    if (st === 0) delete store[w.id];
    else store[w.id] = st;
  });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`已将 ${targets.length} 个单词一键设为「${labelMap[st]}」`);
}

function markRestUnlearnedAsKnown() {
  const list = getVisibleList().filter(w => getStatus(w.id) === 0);
  if (!list.length) {
    showToast('当前列表没有「待学习」的单词');
    return;
  }
  list.forEach(w => { store[w.id] = 1; });
  selectedIds.clear();
  saveStore();
  render();
  showToast(`⚡ 已将当前列表剩余 ${list.length} 个未标词全部一键标熟！`);
}

function updateBatchBar() {
  const cntEl = document.getElementById('sel-cnt');
  if (cntEl) cntEl.textContent = selectedIds.size;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]+>/g, '');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

function applyFilter(newFilter) {
  filter = newFilter;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === filter);
  });
  filteredList = WORDS.filter(w => {
    const st = String(getStatus(w.id));
    if (filter === 'all') return true;
    if (filter === 'review') return st === '2' || st === '3';
    return st === filter;
  });
  curIdx = 0;
  revealed = (mode !== 'context');
  render();
}

function onSearchInput() {
  if (mode === 'context') {
    setMode('table');
  } else {
    render();
  }
}

function updateStats() {
  let c0 = 0, c1 = 0, c2 = 0, c3 = 0;
  WORDS.forEach(w => {
    const st = getStatus(w.id);
    if (st === 1) c1++;
    else if (st === 2) c2++;
    else if (st === 3) c3++;
    else c0++;
  });
  const total = WORDS.length || 1;
  document.getElementById('prog-k').style.width = (c1 / total * 100) + '%';
  document.getElementById('prog-v').style.width = (c2 / total * 100) + '%';
  document.getElementById('prog-u').style.width = (c3 / total * 100) + '%';
  document.getElementById('cnt-all').textContent = WORDS.length;
  document.getElementById('cnt-0').textContent = c0;
  document.getElementById('cnt-1').textContent = c1;
  document.getElementById('cnt-2').textContent = c2;
  document.getElementById('cnt-3').textContent = c3;
  updateBatchBar();
}

function statusBadgeHTML(st) {
  if (st === 1) return '<span class="status-badge st-1">✓ 已标熟</span>';
  if (st === 2) return '<span class="status-badge st-2">? 模糊</span>';
  if (st === 3) return '<span class="status-badge st-3">✗ 不认识</span>';
  return '<span class="status-badge" style="border:1px solid var(--border);color:var(--sub)">待学习</span>';
}

function renderContext() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'block';
  const list = getVisibleList();
  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:50px 20px;">
      <h2 style="margin-bottom:10px;">🎉 当前筛选列表下没有单词啦！</h2>
      <p style="color:var(--sub);margin-bottom:20px;">你可以切换到「全部」或其他分组继续背诵，或者前往下一单元。</p>
      <button class="btn-chip active" onclick="applyFilter('all')">显示全部单词</button>
    </div>`;
    return;
  }
  if (curIdx >= list.length) curIdx = 0;
  if (curIdx < 0) curIdx = list.length - 1;
  const w = list[curIdx];
  const st = getStatus(w.id);

  const morphHTML = w.m ? `<div class="morph-box" onclick="revealMeaning()">
    <span class="morph-label">构词拆解</span>
    <span>${w.m}</span>
  </div>` : '';

  const sensesHTML = w.s.map(s => `
    <div class="sense-item" onclick="if(!revealed) revealMeaning()">
      <div class="en-sent">${s.e}</div>
      <div class="reveal-box">
        <div class="sense-def">${s.d}</div>
        <div class="zh-sent">${s.z}</div>
        <div class="src-tag">
          <span>📖 ${s.r}</span>
          <span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span>
        </div>
      </div>
    </div>
  `).join('');

  box.innerHTML = `
    <div class="momo-card ${revealed ? '' : 'hidden-meaning'} ${cloze && !revealed ? 'cloze-mode' : ''}">
      <div class="word-header">
        <div class="word-title-wrap">
          <span style="font-size:13px;font-weight:700;color:var(--sub);">#${w.id} (${curIdx + 1}/${list.length})</span>
          <h1 class="word-title ${cloze && !revealed ? 'masked' : ''}" onclick="speak(${JSON.stringify(w.w)})">${w.w}</h1>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊 发音 [R]</button>
        </div>
        <div class="meta-badges">
          <span class="freq-badge">🔥 真题考频 ${w.f} 次</span>
          ${statusBadgeHTML(st)}
        </div>
      </div>
      ${morphHTML}
      <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:700;color:var(--sub);">🎯 真题语境先行（先读原句猜词义，点击卡片或按空格揭晓）</span>
        <button class="btn-chip" onclick="toggleReveal()">${revealed ? '🙈 隐藏释义 [Space]' : '👀 显示释义 [Space]'}</button>
      </div>
      ${sensesHTML}
      <div class="kbd-hint">快捷键：[Space] 显示/隐藏释义 · [1] 认识(标熟) · [2] 模糊 · [3] 不认识 · [←/→] 切换单词 · [R] 朗读单词</div>
    </div>
  `;
}

function renderList() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  box.innerHTML = `<div class="list-grid ${revealed ? '' : 'hidden-meaning'} ${cloze ? 'cloze-mode' : ''}">` + list.map(w => {
    const st = getStatus(w.id);
    const isSel = selectedIds.has(w.id);
    return `<div class="list-card ${isSel ? 'selected-row' : ''}" id="wrow-${w.id}">
      <div class="word-header" style="padding-bottom:10px;margin-bottom:12px;">
        <div class="word-title-wrap" style="align-items:center;">
          <input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)">
          <span style="font-size:12px;color:var(--sub);font-weight:700;">#${w.id}</span>
          <span class="word-title" style="font-size:24px;" onclick="speak(${JSON.stringify(w.w)})">${w.w}</span>
          <button class="speak-btn" onclick="speak(${JSON.stringify(w.w)})">🔊</button>
          <span class="freq-badge">考频 ${w.f}</span>
          ${statusBadgeHTML(st)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn-chip ${st===1?'btn-momo':''}" onclick="setStatus(${w.id},1,false)">✓ 标熟</button>
          <button class="btn-chip ${st===2?'btn-amber':''}" onclick="setStatus(${w.id},2,false)">? 模糊</button>
          <button class="btn-chip ${st===3?'btn-rose':''}" onclick="setStatus(${w.id},3,false)">✗ 不认识</button>
        </div>
      </div>
      ${w.m ? `<div class="morph-box"><span class="morph-label">构词</span><span>${w.m}</span></div>` : ''}
      ${w.s.map(s => `
        <div class="sense-item" style="padding:12px 14px;margin-bottom:8px;" onclick="this.querySelector('.reveal-box').style.filter='none';this.querySelector('.reveal-box').style.opacity='1';">
          <div class="en-sent" style="font-size:15.5px;">${s.e}</div>
          <div class="reveal-box">
            <span class="sense-def">${s.d}</span>
            <div class="zh-sent">${s.z}</div>
            <div class="src-tag"><span>📖 ${s.r}</span><span class="speak-sent" onclick="event.stopPropagation();speak(${JSON.stringify(s.e)})">🔊 读例句</span></div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('') + `</div>`;
}

function renderTable() {
  const box = document.getElementById('main-view');
  const dock = document.getElementById('bottom-dock');
  dock.style.display = 'none';
  const list = getVisibleList();

  if (!list.length) {
    box.innerHTML = `<div class="momo-card" style="text-align:center;padding:40px;">没有找到匹配的单词</div>`;
    return;
  }

  const allChecked = list.length > 0 && list.every(w => selectedIds.has(w.id));

  box.innerHTML = `
    <div class="quick-table-wrap">
      <table class="quick-table">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" class="chk-box" ${allChecked ? 'checked' : ''} onchange="selectAllVisible()" title="全选当前列表"></th>
            <th style="width:55px;">序号</th>
            <th style="width:150px;">单词 (点击发音)</th>
            <th style="width:70px;" class="hide-sm">考频</th>
            <th>已考词义 & 真题语境首句</th>
            <th style="width:210px;text-align:right;">快速标记 / 一键标熟</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(w => {
            const st = getStatus(w.id);
            const isSel = selectedIds.has(w.id);
            const defs = w.s.map(s => s.d).join('；');
            const firstEn = w.s[0] ? w.s[0].e : '';
            return `<tr id="wrow-${w.id}" class="${isSel ? 'selected-row' : ''}">
              <td><input type="checkbox" class="chk-box" ${isSel ? 'checked' : ''} onchange="toggleSelect(${w.id}, this.checked)"></td>
              <td style="color:var(--sub);font-weight:700;font-size:12px;">#${w.id}</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px;">
                  <strong style="font-size:16.5px;cursor:pointer;color:var(--text);" onclick="speak(${JSON.stringify(w.w)})">${w.w}</strong>
                  <span style="cursor:pointer;font-size:12px;color:var(--momo-dark);" onclick="speak(${JSON.stringify(w.w)})">🔊</span>
                </div>
                ${w.m ? `<div style="font-size:11.5px;color:var(--sub);margin-top:2px;">${w.m}</div>` : ''}
              </td>
              <td class="hide-sm"><span class="freq-badge">${w.f}次</span></td>
              <td>
                <div style="font-weight:600;color:var(--mark-text);font-size:13.5px;margin-bottom:3px;">${defs}</div>
                <div style="font-size:12.5px;color:var(--sub);line-height:1.4;">${firstEn}</div>
              </td>
              <td style="text-align:right;white-space:nowrap;">
                <button class="btn-chip ${st===1?'btn-momo':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},1,false)">✓ 熟</button>
                <button class="btn-chip ${st===2?'btn-amber':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},2,false)">? 模</button>
                <button class="btn-chip ${st===3?'btn-rose':''}" style="padding:4px 9px;font-size:12px;" onclick="setStatus(${w.id},3,false)">✗ 生</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function render() {
  updateStats();
  if (mode === 'context') renderContext();
  else if (mode === 'list') renderList();
  else renderTable();
}

function toggleReveal() {
  revealed = !revealed;
  render();
}
function revealMeaning() {
  if (!revealed) { revealed = true; renderContext(); }
}
function prevWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx - 1 + list.length) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nextWord() {
  const list = getVisibleList();
  if (!list.length) return;
  curIdx = (curIdx + 1) % list.length;
  revealed = false;
  renderContext();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setMode(m) {
  mode = m;
  revealed = (m !== 'context');
  document.getElementById('mode-ctx').classList.toggle('active', m === 'context');
  document.getElementById('mode-lst').classList.toggle('active', m === 'list');
  document.getElementById('mode-tbl').classList.toggle('active', m === 'table');
  render();
}
function toggleCloze() {
  cloze = !cloze;
  document.getElementById('btn-cloze').classList.toggle('active', cloze);
  render();
}
function shuffleWords() {
  for (let i = filteredList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
  }
  curIdx = 0;
  revealed = false;
  render();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('kaoyan_theme', next);
}

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const list = getVisibleList();
  if (mode !== 'context' || !list.length) return;
  const w = list[curIdx];
  if (e.code === 'Space') { e.preventDefault(); toggleReveal(); }
  else if (e.key === '1') { e.preventDefault(); setStatus(w.id, 1, true); }
  else if (e.key === '2') { e.preventDefault(); setStatus(w.id, 2, true); }
  else if (e.key === '3') { e.preventDefault(); setStatus(w.id, 3, true); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevWord(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); speak(w.w); }
});

(function init() {
  const savedTheme = localStorage.getItem('kaoyan_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  render();
})();

</script>
</body>
</html>
